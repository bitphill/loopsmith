name: release

# Builds the six prebuilt targets and publishes them with a SHA256SUMS manifest.
#
# The manifest is not decoration: the npm postinstall and the PyPI first-run
# launcher both refuse to execute a download that does not match it. Distributing
# a binary without a checksum to compare against is a supply-chain hole with a
# progress bar.
#
# This machine's maintainer builds on an Intel Mac with no docker and no `cross`,
# so five of these six targets can only be produced here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The tag being released, whichever way the run was started. Scripts read it
  # from here rather than having `${{ github.event.inputs.tag }}` pasted into
  # their text: an expression is substituted before the shell parses the line,
  # so a tag typed into the dispatch form would otherwise run as shell code.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            # musl needs its own linker, and the error without it names a missing
            # `cc` rather than a missing target.
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cross-compilation packages
        if: matrix.packages != ''
        run: sudo apt-get update -qq && sudo apt-get install -y ${{ matrix.packages }}

      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        run: |
          triple=$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${triple}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtime
          key: ${{ matrix.target }}

      - name: Build
        working-directory: runtime
        # `dist`, not `release`: same code, fat LTO and one codegen unit, which
        # is 16% off the download for build time nobody is waiting on here.
        run: cargo build --profile dist --locked --bin loopsmith --target ${{ matrix.target }}

      # One archive per target, named for the version and the triple, because both
      # downloaders construct the filename from exactly those two facts.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          name="loopsmith-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar czf "dist/$name" -C "runtime/target/${{ matrix.target }}/dist" loopsmith
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          name="loopsmith-v${version}-${{ matrix.target }}.zip"
          mkdir -p dist
          # tar.exe ships with Windows and writes zips, so no extra dependency.
          tar acf "dist/$name" -C "runtime/target/${{ matrix.target }}/dist" loopsmith.exe
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: staging

      - name: Collect the archives and checksum them
        run: |
          mkdir -p dist
          find staging -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          cd dist
          # Bare filenames, no leading path: both downloaders match a line by its
          # trailing asset name, and a `./` prefix would silently never match.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          notes=$(awk "/^## \[${tag#v}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md)
          [ -z "$notes" ] && notes="See CHANGELOG.md."
          gh release create "$tag" dist/* \
            --title "loopsmith $tag" \
            --notes "$notes" \
            --verify-tag

  # ── crates.io ──────────────────────────────────────────────────────────────
  #
  # No stored token. `crates-io-auth-action` exchanges the OIDC token GitHub
  # mints for this workflow run for a crates.io credential that lives about
  # fifteen minutes. Nothing to leak, nothing to rotate, and a stolen laptop
  # cannot publish.
  #
  # Configure once at crates.io → each crate → Settings → Trusted Publishing:
  # repository `bitphill/loopsmith`, workflow `release.yml`.
  #
  # Off unless the repository variable `PUBLISH_CRATES` is `true` (Settings →
  # Secrets and variables → Actions → Variables).
  #
  # 1.0.0 could not be published by this job. It introduced three crates —
  # `loopsmith-run`, `-wizard`, `-web` — and a Trusted Publishing token cannot
  # create a crate, while the nine that already existed accept nothing but
  # Trusted Publishing. So all twelve went to crates.io by hand on 2026-09-26:
  # unlocked, published in dependency order, the three new ones given a
  # publisher config, every one locked again. The tag came four days later and
  # this job was left off for it, so the tag could not touch crates.io at all.
  #
  # Every crate now exists and has a publisher config, so from 1.0.1 on this job
  # does the whole crates.io release by itself. **Set the variable before the
  # next tag**, or that release skips crates.io without saying so.
  #
  # Nothing depends on this job; `pypi`, `npm` and `homebrew` all hang off
  # `publish`. Skipping it skips crates.io and nothing else.
  crates:
    name: crates.io
    if: vars.PUBLISH_CRATES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # Dependency order, not alphabetical: a crate cannot be verified until
      # everything it depends on is on the index.
      #
      # The retry is not defensive padding. Publishing 0.2.1 by hand,
      # loopsmith-provider failed with "failed to prepare local package" because
      # loopsmith-util had been accepted but was not yet visible to the
      # verification build. It published on the second attempt, unchanged.
      #
      # Already-published is a success, not a failure: a re-run of this workflow
      # must not fall over on the crates that got through the first time. The
      # string to match is the server's, quoted from
      # `rust-lang/crates.io:src/controllers/krate/publish.rs` — "crate version
      # `X` is already uploaded", which cargo passes through verbatim. This guard
      # used to look for "already exists", which crates.io does not say, so a
      # re-run took three attempts and two thirty-second sleeps per crate and
      # then failed the job. Both spellings are matched now; a registry that says
      # something else entirely would have to be found the same way this was.
      - name: Publish in dependency order
        working-directory: runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -u
          version="$(awk '/^\[workspace\.package\]/{f=1} f && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::could not read the workspace version"; exit 1; }
          echo "publishing $version"

          # `cargo publish` packages and runs a full verification build *before*
          # it uploads and finds out the version is already there, so the
          # already-uploaded path below is free in upload terms and costs a
          # complete compile every time. That matters because the Trusted
          # Publishing token expires thirty minutes after the job starts: a
          # re-run that has to skip eleven crates would spend the whole window
          # rebuilding them and could lose the token before reaching the twelfth.
          # Asking the index first turns each skip into one HTTP request.
          #
          # Only 200 counts as present. A 404, a rate limit, or a dropped
          # connection all fall through to publishing, because the upload is the
          # authority and this is an optimisation, not a gate.
          on_index() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: loopsmith release workflow (github.com/bitphill/loopsmith)' \
              "https://crates.io/api/v1/crates/$1/$version" || echo 000)
            [ "$code" = 200 ]
          }

          for crate in loopsmith-util loopsmith-core loopsmith-memory \
                       loopsmith-graph loopsmith-provider loopsmith-gate \
                       loopsmith-skills loopsmith-mcp loopsmith-run \
                       loopsmith-wizard loopsmith-web loopsmith; do
            if on_index "$crate"; then
              echo "$crate $version is already on the index — not rebuilding it"
              continue
            fi
            for attempt in 1 2 3; do
              echo "::group::$crate (attempt $attempt)"
              out=$(cargo publish -p "$crate" 2>&1) && status=0 || status=$?
              echo "$out"
              echo "::endgroup::"
              if [ "$status" -eq 0 ]; then
                echo "published $crate"; break
              fi
              if echo "$out" | grep -qE "already (uploaded|exists)"; then
                echo "$crate is already on the index at this version — continuing"; break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::$crate failed three times"; exit 1
              fi
              echo "retrying $crate after index propagation..."; sleep 30
            done
          done

  # ── PyPI ───────────────────────────────────────────────────────────────────
  #
  # Trusted Publishing, so no PYPI_TOKEN anywhere. Configure once at
  # pypi.org → loopsmith-cli → Publishing → Add a new publisher (GitHub):
  # owner `bitphill`, repository `loopsmith`, workflow `release.yml`.
  #
  # Depends on `publish` rather than `build`: the wheel is a launcher that
  # downloads the binary from the GitHub release on first run, so releasing it
  # before that release exists ships something briefly broken.
  pypi:
    name: PyPI
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: pypi
        run: |
          python -m pip install --quiet --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi/dist

  # ── npm ────────────────────────────────────────────────────────────────────
  #
  # `--provenance` is the point of moving this off a laptop. It records a
  # Sigstore attestation binding the tarball to this exact commit and workflow
  # run, which npm surfaces as a verified build badge and supply-chain scanners
  # weight far above download count.
  #
  # Configure once at npmjs.com → @bitphill/loopsmith → Settings → Trusted
  # Publisher: GitHub Actions, `bitphill/loopsmith`, workflow `release.yml`.
  npm:
    name: npm
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm; the one bundled with the node
      # image is routinely older than the feature.
      - run: npm install -g npm@latest
      - name: Publish with provenance
        working-directory: npm
        run: npm publish --provenance --access public

  # ── Homebrew tap ───────────────────────────────────────────────────────────
  #
  # `brew install` reads github.com/bitphill/homebrew-loopsmith, a separate
  # repository that nothing syncs. Updating this repo's Formula/ alone leaves
  # the tap pinning the previous release while the copy here looks correct —
  # the one way a release can silently half-land, and the reason this job
  # exists rather than a note in a checklist.
  #
  # Authentication is a deploy key rather than a token: scoped to that one
  # repository, write-only to it, and unable to publish a package or touch this
  # repo. Narrow enough to be worth the one stored secret, right after three
  # broader ones were retired in favour of OIDC.
  #
  # `needs: publish` so the tap only moves for a release that fully succeeded.
  homebrew:
    name: Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The formula body lives here; only the url and digest are rendered per
      # release. The tap holds the rendered result, and is what brew reads.
      - name: Render the formula for this tag
        id: render
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"

          curl -sL "$url" -o src.tar.gz

          # Every one of these guards a real failure seen on this project.
          # codeload rate-limits unauthenticated archive fetches and curl exits
          # 0 while writing the 429 body to the output file, so hashing blind
          # produces a well-formed digest of an error page and pins a checksum
          # no install can ever match. The tell was two tags hashing identically.
          size=$(wc -c < src.tar.gz)
          echo "tarball is $size bytes"
          gzip -t src.tar.gz || { echo "::error::not valid gzip — probably an error page"; exit 1; }
          [ "$size" -ge 500000 ] || { echo "::error::$size bytes is too small to be the source tarball"; exit 1; }
          # Count entries by consuming the whole listing. `tar tzf | head -1`
          # looks tidier but deadlocks against `set -o pipefail`: head closes the
          # pipe after one line, tar takes SIGPIPE and exits non-zero, and
          # pipefail then fails a pipeline whose tarball was perfectly good. That
          # is what sank the first real 0.3.0 tap push — a 2.5 MB valid gzip
          # reported "empty". `wc -l` reads every entry, so tar never sees a
          # broken pipe.
          [ "$(tar tzf src.tar.gz | wc -l)" -gt 0 ] || { echo "::error::tarball is empty"; exit 1; }

          sha=$(sha256sum src.tar.gz | cut -d' ' -f1)
          previous=$(grep -oE '^  sha256 "[0-9a-f]{64}"' Formula/loopsmith.rb | grep -oE '[0-9a-f]{64}')
          if [ "$sha" = "$previous" ]; then
            echo "::error::digest is identical to the previous release — that is the rate-limit signature, not a coincidence"
            exit 1
          fi

          sed -i -E "s|^  url \".*\"|  url \"$url\"|" Formula/loopsmith.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/loopsmith.rb
          grep -E "^  (url|sha256) " Formula/loopsmith.rb
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Push it to the tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:bitphill/homebrew-loopsmith.git tap
          cp Formula/loopsmith.rb tap/Formula/loopsmith.rb
          cd tap

          # A re-run of a release that already updated the tap is a success,
          # not a failure: git commit exits non-zero when there is nothing to do.
          if git diff --quiet; then
            echo "tap already carries ${{ steps.render.outputs.tag }}"
          else
            git config user.name "loopsmith release"
            git config user.email "bitphill@duck.com"
            git commit -aqm "loopsmith ${{ steps.render.outputs.version }}

          Digest verified against the real tarball: valid gzip, plausible size,
          and distinct from the previous release's."
            git push origin HEAD
            echo "tap updated to ${{ steps.render.outputs.tag }}"
          fi

          # The README's Homebrew badge reads the tap's newest tag, so the tag is
          # what makes that badge a fact rather than a claim: it exists only once
          # this job has pushed the formula, and a release whose Homebrew step
          # failed — 0.3.0's did — leaves the badge on the previous version
          # instead of announcing one nobody can install. Pushed on the re-run
          # path too, so a tap updated by hand still gets its tag. Forced, so a
          # re-run lands it on the same commit rather than failing because it
          # already exists.
          git tag -f "${{ steps.render.outputs.tag }}"
          git push -f origin "refs/tags/${{ steps.render.outputs.tag }}"
