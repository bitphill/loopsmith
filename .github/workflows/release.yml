name: release

# Builds the six prebuilt targets and publishes them with a SHA256SUMS manifest.
#
# The manifest is not decoration: the npm postinstall and the PyPI first-run
# launcher both refuse to execute a download that does not match it. Distributing
# a binary without a checksum to compare against is a supply-chain hole with a
# progress bar.
#
# This machine's maintainer builds on an Intel Mac with no docker and no `cross`,
# so five of these six targets can only be produced here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            # musl needs its own linker, and the error without it names a missing
            # `cc` rather than a missing target.
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cross-compilation packages
        if: matrix.packages != ''
        run: sudo apt-get update -qq && sudo apt-get install -y ${{ matrix.packages }}

      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        run: |
          triple=$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${triple}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
          key: ${{ matrix.target }}

      - name: Build
        working-directory: runtime
        # `dist`, not `release`: same code, fat LTO and one codegen unit, which
        # is 16% off the download for build time nobody is waiting on here.
        run: cargo build --profile dist --locked --bin loopsmith --target ${{ matrix.target }}

      # One archive per target, named for the version and the triple, because both
      # downloaders construct the filename from exactly those two facts.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "${{ github.event.inputs.tag }}" ] && version="${{ github.event.inputs.tag }}" && version="${version#v}"
          name="loopsmith-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar czf "dist/$name" -C "runtime/target/${{ matrix.target }}/dist" loopsmith
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "${{ github.event.inputs.tag }}" ] && version="${{ github.event.inputs.tag }}" && version="${version#v}"
          name="loopsmith-v${version}-${{ matrix.target }}.zip"
          mkdir -p dist
          # tar.exe ships with Windows and writes zips, so no extra dependency.
          tar acf "dist/$name" -C "runtime/target/${{ matrix.target }}/dist" loopsmith.exe
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect the archives and checksum them
        run: |
          mkdir -p dist
          find staging -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          cd dist
          # Bare filenames, no leading path: both downloaders match a line by its
          # trailing asset name, and a `./` prefix would silently never match.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          notes=$(awk "/^## \[${tag#v}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md)
          [ -z "$notes" ] && notes="See CHANGELOG.md."
          gh release create "$tag" dist/* \
            --title "loopsmith $tag" \
            --notes "$notes" \
            --verify-tag

  # ── crates.io ──────────────────────────────────────────────────────────────
  #
  # No stored token. `crates-io-auth-action` exchanges the OIDC token GitHub
  # mints for this workflow run for a crates.io credential that lives about
  # fifteen minutes. Nothing to leak, nothing to rotate, and a stolen laptop
  # cannot publish.
  #
  # Configure once at crates.io → each crate → Settings → Trusted Publishing:
  # repository `bitphill/loopsmith`, workflow `release.yml`.
  crates:
    name: crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Dependency order, not alphabetical: a crate cannot be verified until
      # everything it depends on is on the index.
      #
      # The retry is not defensive padding. Publishing 0.2.1 by hand,
      # loopsmith-provider failed with "failed to prepare local package" because
      # loopsmith-util had been accepted but was not yet visible to the
      # verification build. It published on the second attempt, unchanged.
      #
      # Already-published is a success, not a failure: a re-run of this workflow
      # must not fall over on the crates that got through the first time.
      - name: Publish in dependency order
        working-directory: runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -u
          for crate in loopsmith-util loopsmith-core loopsmith-memory \
                       loopsmith-graph loopsmith-provider loopsmith-gate \
                       loopsmith-skills loopsmith-mcp loopsmith; do
            for attempt in 1 2 3; do
              echo "::group::$crate (attempt $attempt)"
              out=$(cargo publish -p "$crate" 2>&1) && status=0 || status=$?
              echo "$out"
              echo "::endgroup::"
              if [ "$status" -eq 0 ]; then
                echo "published $crate"; break
              fi
              if echo "$out" | grep -q "already exists"; then
                echo "$crate is already on the index at this version — continuing"; break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::$crate failed three times"; exit 1
              fi
              echo "retrying $crate after index propagation..."; sleep 30
            done
          done

  # ── PyPI ───────────────────────────────────────────────────────────────────
  #
  # Trusted Publishing, so no PYPI_TOKEN anywhere. Configure once at
  # pypi.org → loopsmith-cli → Publishing → Add a new publisher (GitHub):
  # owner `bitphill`, repository `loopsmith`, workflow `release.yml`.
  #
  # Depends on `publish` rather than `build`: the wheel is a launcher that
  # downloads the binary from the GitHub release on first run, so releasing it
  # before that release exists ships something briefly broken.
  pypi:
    name: PyPI
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: pypi
        run: |
          python -m pip install --quiet --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/dist

  # ── npm ────────────────────────────────────────────────────────────────────
  #
  # `--provenance` is the point of moving this off a laptop. It records a
  # Sigstore attestation binding the tarball to this exact commit and workflow
  # run, which npm surfaces as a verified build badge and supply-chain scanners
  # weight far above download count.
  #
  # Configure once at npmjs.com → @bitphill/loopsmith → Settings → Trusted
  # Publisher: GitHub Actions, `bitphill/loopsmith`, workflow `release.yml`.
  npm:
    name: npm
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm; the one bundled with the node
      # image is routinely older than the feature.
      - run: npm install -g npm@latest
      - name: Publish with provenance
        working-directory: npm
        run: npm publish --provenance --access public

  # ── Homebrew tap ───────────────────────────────────────────────────────────
  #
  # `brew install` reads github.com/bitphill/homebrew-loopsmith, a separate
  # repository that nothing syncs. Updating this repo's Formula/ alone leaves
  # the tap pinning the previous release while the copy here looks correct —
  # the one way a release can silently half-land, and the reason this job
  # exists rather than a note in a checklist.
  #
  # Authentication is a deploy key rather than a token: scoped to that one
  # repository, write-only to it, and unable to publish a package or touch this
  # repo. Narrow enough to be worth the one stored secret, right after three
  # broader ones were retired in favour of OIDC.
  #
  # `needs: publish` so the tap only moves for a release that fully succeeded.
  homebrew:
    name: Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The formula body lives here; only the url and digest are rendered per
      # release. The tap holds the rendered result, and is what brew reads.
      - name: Render the formula for this tag
        id: render
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"

          curl -sL "$url" -o src.tar.gz

          # Every one of these guards a real failure seen on this project.
          # codeload rate-limits unauthenticated archive fetches and curl exits
          # 0 while writing the 429 body to the output file, so hashing blind
          # produces a well-formed digest of an error page and pins a checksum
          # no install can ever match. The tell was two tags hashing identically.
          size=$(wc -c < src.tar.gz)
          echo "tarball is $size bytes"
          gzip -t src.tar.gz || { echo "::error::not valid gzip — probably an error page"; exit 1; }
          [ "$size" -ge 500000 ] || { echo "::error::$size bytes is too small to be the source tarball"; exit 1; }
          tar tzf src.tar.gz | head -1 | grep -q . || { echo "::error::tarball is empty"; exit 1; }

          sha=$(sha256sum src.tar.gz | cut -d' ' -f1)
          previous=$(grep -oE '^  sha256 "[0-9a-f]{64}"' Formula/loopsmith.rb | grep -oE '[0-9a-f]{64}')
          if [ "$sha" = "$previous" ]; then
            echo "::error::digest is identical to the previous release — that is the rate-limit signature, not a coincidence"
            exit 1
          fi

          sed -i -E "s|^  url \".*\"|  url \"$url\"|" Formula/loopsmith.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/loopsmith.rb
          grep -E "^  (url|sha256) " Formula/loopsmith.rb
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Push it to the tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:bitphill/homebrew-loopsmith.git tap
          cp Formula/loopsmith.rb tap/Formula/loopsmith.rb
          cd tap

          # A re-run of a release that already updated the tap is a success,
          # not a failure: git commit exits non-zero when there is nothing to do.
          if git diff --quiet; then
            echo "tap already carries ${{ steps.render.outputs.tag }}"
            exit 0
          fi

          git config user.name "loopsmith release"
          git config user.email "bitphill@duck.com"
          git commit -aqm "loopsmith ${{ steps.render.outputs.version }}

          Digest verified against the real tarball: valid gzip, plausible size,
          and distinct from the previous release's."
          git push origin HEAD
          echo "tap updated to ${{ steps.render.outputs.tag }}"
