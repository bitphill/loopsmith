name: Bug report
description: Something does not work the way the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys or other secrets here. If one slips in, rotate it: deleting the text is not enough.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or config that shows it. A trimmed `loop.yaml` helps a lot.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: loopsmith version
      description: Output of `loopsmith --version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - cargo install loopsmith
        - npm (@bitphill/loopsmith)
        - pip (loopsmith-cli)
        - Homebrew
        - install.sh
        - install.bat
        - Built from a git checkout
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Windows (WSL or Git Bash)
        - BSD
        - Other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `loopsmith doctor`
      description: It reports your bash, userland and scheduler, which is often the answer.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: For a run, the last lines of `logs/run-<id>.log` are usually enough.
      render: text
