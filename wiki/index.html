han_passes_by_default`) |\n| `Judge { standard, min_score }` | see below | no judgment recorded; `min_score` set but no scores reported |\n\n`Script` captures the last line of stderr into the evidence string, which is usually the part a human wants. `op_str` renders `CompareOp` back into `>`, `>=`, `<`, `<=`, `==` for that evidence text.\n\n### Judge independence\n\nThe `Judge` arm is where the crate's thesis is enforced:\n\n1. Collect judgments whose `validation` matches this check's name. Empty → fail.\n2. If `cfg.providers.enforce_judge_independence` is set and **any** judgment has `provider_id == builder_provider_id`, the check is **refused outright** — not averaged down, not partially credited. The evidence reads `\"a shared provider shares its blind spots\"`. Sharing a provider between builder and judge means sharing blind spots, which is the failure the architecture exists to avoid.\n3. Otherwise, partition into independent judgments (`provider_id != builder_provider_id`). If any exist, they become the scoring pool; if none do (only reachable with enforcement off), the pool falls back to all judgments.\n4. With `min_score`: pass if the mean of reported scores meets the minimum. Without: pass if every judgment in the pool passed.\n\nNote the asymmetry in step 2 versus step 3 — with enforcement on, one self-judgment poisons the whole check even if independent judgments are also present. That is intentional: a self-judgment in the pile is a signal that the routing is wrong, not noise to be outvoted.\n\n## Success scenarios\n\nDetector verdicts answer \"is this target satisfied\". Success scenarios answer \"is that enough to stop\", and are evaluated separately:\n\n- `success_met(scenario, verdict)` — for `Mode::Percentage`, compares `blocking_pass_rate()` against `scenario.threshold` (defaulting to `1.0`). For `Mode::Objective` and `Mode::Subjective`, it is just `verdict.satisfied`.\n- `overall_success(cfg, verdicts)` — takes every `SuccessScenario` targeting `OVERALL` and requires **all** of them to hold against the `OVERALL` verdict. If no such scenario is declared, it falls back to the raw `OVERALL` verdict. A missing `OVERALL` verdict is `false`.\n\nThis is the split that lets a config say \"90% of blocking checks is good enough to stop\" without ever letting a goal be marked satisfied on a partial pass.\n\n## Integration points\n\n| Caller | Uses |\n|---|---|\n| `src/cmd/gate.rs::execute` | `evaluate` — the `loopsmith gate` CLI subcommand, one-shot verdict |\n| `src/run/mod.rs::execute` | `evaluate_all` — the per-iteration sweep of every goal plus `overall` |\n| `src/run/stop.rs::should_stop` | `overall_success` — the stop gate |\n| `src/run/phases.rs`, `src/run/export.rs`, `src/run/summary.rs` | `TargetVerdict` — carried through reporting and export |\n| `loopsmith-mcp::tool_gate` | `evaluate` — exposes the gate over the local stdio MCP server |\n| `loopsmith-cli/src/judgment.rs::parse` | `Judgment` — builds judgments from model output before they reach `Evidence` |\n\nDependencies point downward only: `loopsmith-core` (config model), `loopsmith-memory` (`GoalState`, `now_ms`), `regex`, `serde`. The gate never reaches back into providers or the scheduler.\n\n## Contributing\n\n**Adding a detector.** Add the variant in `loopsmith-core`'s `Detector` enum and the JSON schema, then add a `match` arm in `run_detector`. The arm must return `(bool, String)` where the string explains the verdict in terms a human can act on, and it must treat absent input as failure. Add a test alongside the existing ones — every detector arm has at least one, and the missing-input case has its own (`a_missing_metric_fails_rather_than_passes_by_default`, `a_missing_judgment_fails_closed`).\n\n**Where \"cannot run\" currently lands.** `run_detector` distinguishes a `GateError` from a plain `false`, but `evaluate` collapses both into `passed: false`, preserving the distinction only as a `\"detector error: {e}\"` prefix on the evidence string. If you are building tooling that needs to separate \"missing toolchain\" from \"unfinished work\" — the README calls this out as a real distinction — that separation has to be read out of the evidence text today, or the `CheckResult` shape has to grow a field.\n\n**Test fixtures.** `cfg_with(validations)` splices a YAML validation block into a minimal config with two providers (`builder-p` on ollama, `judge-p` on openai) and parses it through `loopsmith_core::parse_str`, so tests exercise real config parsing rather than hand-built structs. Filesystem tests use `loopsmith_util::testing::temp_dir` (gated behind the `testing` feature in dev-dependencies).\n\n**Packaging.** `Cargo.toml` ships only `/src/**/*` and `/README.md`. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — including them would hand a published crate tests that cannot pass.","loop-configuration-schema":"# Loop Configuration Schema\n\n# Loop Configuration Schema\n\nThe config layer of loopsmith: one JSON Schema, one Rust model, one validator. Together they decide whether a loop description is coherent enough to be run unattended.\n\nTwo artifacts describe the same thing:\n\n| Artifact | Role |\n|---|---|\n| `config/loop.schema.json` | Draft 2020-12 schema. Editor completion, CI checks, documentation. **Not read at runtime.** |\n| `runtime/crates/loopsmith-core` | The `serde` model that actually parses configs, plus `validate()` |\n\nNothing in the runtime loads the `.json` file — `serde_yaml`/`serde_json` deserialize straight into `LoopConfig`, and `deny_unknown_fields` plays the role `additionalProperties: false` plays in the schema. The crate's `Cargo.toml` makes this explicit: `include = [\"/src/**/*\", \"/README.md\"]`, because the integration tests that read `config/loop.schema.json` and `config/examples/` reach outside the crate directory and no published tarball could carry them. So the schema is a repo-level artifact, and keeping it in step with the Rust structs is a manual obligation of anyone adding a field.\n\n## The A–J model\n\nA loop is ten lettered sections. The lettering is load-bearing: it is the same in the template, the schema, the docs, and the module layout, so \"where does `stop_gates` live\" has one answer everywhere.\n\n| | Section | Rust module | Required |\n|---|---|---|---|\n| A | `information` | `config/info.rs` | no |\n| B | `pre_execution` | `config/work.rs` | no (but see below) |\n| C | `goals` | `config/goals.rs` | **yes**, ≥1 |\n| D | `validations` | `config/validation.rs` | **yes**, ≥1 |\n| E | `success` | `config/success.rs` | no |\n| F | `stop_gates` | `config/gates.rs` | no |\n| G | `schedules` | `config/triggers.rs` | no |\n| H | `constraints` | `config/constraints.rs` | no |\n| I | `execution_guidelines` | `config/guidelines.rs` | no |\n| J | `default_skills` | `config/default_skills.rs` | no |\n\nPlus four non-lettered sections that describe machinery rather than intent: `graph`, `providers`, `skills`, `context`.\n\n> **Doc drift worth knowing about.** The module headers in `src/lib.rs` and `src/config/mod.rs`, and the schema's own `title`/`description`, still say \"the A–H model\" — they predate sections I and J. The field-level doc comments on `LoopConfig` and the crate README are current. If you touch either header, fix the letter range.\n\n## Loading a config\n\n```rust\nuse loopsmith_core::{load, load_validated, parse_str, is_markdown};\n```\n\nThree input grammars, two entry points:\n\n```\n .md / .markdown ──► md::parse_md ──┐\n                                    ├──► LoopConfig\n .yaml / .yml / .json ──► parse_str ┘\n        (YAML first, then strict JSON)\n```\n\n`load()` picks Markdown **by extension only**. That is deliberate: a `.md` config is a different grammar, not a different serialization, so sniffing at it would mean reporting a YAML parse error for a document that was never YAML. Everything else falls through to `parse_str()`, which tries `serde_yaml` first (a JSON superset in practice) and then `serde_json`, keeping *both* error strings so `CoreError::Parse` can show the caller which one they probably meant.\n\n`load_validated()` is `load()` plus `validate()`, with any error-severity issue promoted to `CoreError::Invalid(report.render())`. Only two callers use it — `src/cmd/run.rs::start` and `src/cmd/watch.rs::execute` — because those are the ones that are about to spend money. Read-only commands (`plan`, `providers`, `permissions`, `convert`, `gate`, `prune`, `schedule`, `doctor`, `skills`) call plain `load()` so they still work on a config you are in the middle of fixing.\n\n`CoreError` has exactly three shapes: `Io`, `Parse` (carrying both parser messages), and `Invalid` (carrying a rendered `ValidationReport`).\n\n## The config model\n\n`LoopConfig` is a flat struct of the fourteen sections. Every struct in `config/` carries `#[serde(deny_unknown_fields)]`, and the tests in `config/mod.rs` guard it at both levels:\n\n```rust\n// stop_gate: (missing s) must be an error, not a silently dropped section\nlet typo = MINIMAL.to_string() + \"stop_gate:\\n  max_iterations: 2\\n\";\nparse(&typo).expect_err(\"a misspelled section must be refused\");\n```\n\nWithout it a misspelled key is dropped and the loop runs with a default the author never chose — which is how a budget cap becomes a surprise invoice.\n\nFour convenience methods carry real weight downstream:\n\n- `goal_names()`\n- `blocking_validations_for(target)` — used by `src/run/prompts.rs::build_node_prompt` to tell a node what it will actually be checked against\n- `provider(id)` — the lookup the validator uses to reject unknown provider references\n- `cascade_for(tier)` — resolves a `Tier` to an ordered provider list. If `providers.cascade` has no entry for that tier, it falls back to *every* provider whose `tiers` list is empty or contains the tier. An empty `tiers` therefore means \"eligible for everything\", not \"eligible for nothing\".\n\n`OVERALL` (`\"overall\"`) is the reserved target name meaning the loop as a whole. It is refused as a goal name in both the schema (`not: { const: \"overall\" }`) and `check_goals`.\n\n### Detectors (D)\n\n`Detector` is an internally-tagged enum on `type`, mirrored by a `oneOf` in the schema. The ordering in the source follows the independence ladder — `Judge` is rung 3, everything else is rung 4:\n\n| `type` | Passes when | Deterministic |\n|---|---|---|\n| `script` | command exits with `expect_exit` (default 0) | yes |\n| `file_exists` | `path` exists, optionally non-empty | yes |\n| `regex_match` | `pattern` matches the named `artifact` | yes |\n| `threshold` | `metric` compares against `value` via `op` | yes |\n| `judge` | a model verdict against a named `standard` | **no** |\n\n`CompareOp::apply` is the whole comparison surface; note `Eq` uses `(lhs - rhs).abs() < f64::EPSILON`, so it is an exact-ish float compare and not a tolerance you can tune.\n\nOne schema/Rust divergence to be aware of: the schema gives `expect_exit` `\"default\": 0`, while the Rust field is `Option<i32>` with `#[serde(default)]` — so in Rust the absent case is `None`, and whoever runs the detector supplies the 0.\n\n### Stop gates (F)\n\nAll gates are evaluated every iteration; any one halts the run. Defaults: `max_iterations: 10`, `max_revisions_per_node: 3`, `no_progress_iterations: 3`, `stop_on_overall_success: true`. Wall clock, token, and cost ceilings are all `Option` and all unset by default.\n\n`no_progress_iterations_randomness` is the interesting one. Set it below `no_progress_iterations` and the run *perturbs itself* at that point — a cheap-tier agent is asked to pick one of four tactics (reorder, escalate, explore, reframe), with a seeded fallback if no agent answers, and the seed lands in the ledger so the run replays. Set it at or above the halt point and it can never fire, which the validator treats as an error rather than a curiosity.\n\n### Execution guidelines (I) vs. graph edges\n\nThis is the distinction most likely to trip up a contributor. Both express ordering; they mean different things.\n\n- `graph.nodes[].depends_on` is a **data** dependency: this node reads that node's output. It feeds the critical path. An \"and then\" that is not read is not an edge.\n- `execution_guidelines` are **phases** — method ordering. *Gather before you draft. Land the tests before you refactor.* A node joins a phase with `stage:` and is not dispatched until that phase is active; a node with no `stage` is always eligible.\n\nOverloading `depends_on` with both would make the critical path meaningless, since half the edges would not be real work dependencies.\n\nPhase ordering is written as arrows, one chain per entry, because the thing being described is an ordering:\n\n```yaml\nexecution_guidelines:\n  items:\n    - name: gather\n      guideline: Collect sources. Write nothing yet.\n    - name: draft\n      guideline: Write only from what `gather` collected.\n  dependency:\n    - gather -> draft -> review\n```\n\n`parse_chain(\"a -> b -> c\")` yields `[(a,b), (b,c)]`. It refuses a line with no arrow and a line with an empty name on either side, and reports the offending *line*, not the offending character, because that is what the author is looking at. `ExecutionGuidelines::phases()` folds the edge list into `Phase { name, guideline, depends_on }` — and deliberately does **not** check for cycles or unknown names, leaving that to the validator and to `loopsmith-graph`. Guidelines with no arrow between them are independent and run in parallel; two phases must not acquire an ordering just by being written one after the other.\n\n### Providers\n\nEvery provider is a command template — `command` plus `args` with `{prompt} {system} {model} {tier} {node}` substituted before spawn. That is why BYOK needs no Rust change: anything invocable from a shell is routable. `requires_env` lists key *names* only; values are never read, substituted, or logged, so they stay out of the ledger.\n\n`ProviderKind` carries serde aliases for the spellings people actually write (`claude`, `openai`, `OpenAI`, `open_ai`, `grok`, `custom`, `MCP`, …), and a test enumerates them, because a config that insists on `open_ai` over `openai` wastes the author's afternoon.\n\n### Context policy\n\nEach iteration is compressed to a summary and only the last `carry_summaries` (default 2) are sent forward, so prompt size stops growing with the run. `summary_provider` is optional — omit it and summaries are still written, just without the prose half. `max_summary_chars` (default 1200) caps the narrative, since a summary that grows without limit defeats the purpose.\n\n### Default skills (J)\n\n`init_command` is an **argv line, not a shell line**. `DefaultSkill::init_argv()` splits on whitespace and the result is executed directly, so `&&`, `|`, and `$(…)` survive as literal arguments — a test asserts exactly this. A config that could smuggle a shell into a setup step would make a loop directory an unreviewable install script.\n\n`is_safe_repo_url()` accepts only `https://`. `git://` and `ssh://` carry no transport authentication a loop could verify, `file://` would let a config reach anywhere on the machine, and a leading `-` would be read by git as a flag rather than a URL.\n\n## Validation\n\n```rust\npub fn validate(cfg: &LoopConfig) -> ValidationReport\n```\n\n`ValidationReport` is a `Vec<Issue>`, each with a `Severity` (`Error` | `Warning`), a dotted `field` path (`goals[2].name`, `validations[target=g1]`), and a message. `has_errors()` is the gate; `render()` produces the two-space-indented `error`/`warn ` lines the CLI prints.\n\n`validate()` is a straight fan-out — no early returns at the top level, so an author sees every problem in one pass:\n\n```mermaid\ngraph LR\n    V[validate] --> G[check_goals]\n    V --> P[check_pre_execution]\n    V --> D[check_validations]\n    V --> S[check_success]\n    V --> F[check_stop_gates]\n    V --> I[check_execution_guidelines]\n    V --> N[check_graph]\n    V --> R[check_providers]\n```\n\n### The rules that are errors\n\nThe ones that encode a design commitment rather than a typo:\n\n**Every goal needs at least one blocking validation.** `check_validations` counts blocking validations per target and reports `\"goal has no blocking validation; it could never be honestly satisfied\"` for any goal at zero. This is the single most common way loops fail, so the config is rejected rather than run.\n\n**Every `pre_execution` step must be `done: true`.** An unfinished manual step is an error, not a warning: automating a process you cannot describe in checkable terms produces fast, confident garbage. An *empty* `pre_execution` is only a warning — the corpus rule is to do the task by hand first, and the manual runs are the spec.\n\n**A `regex_match` must name an artifact something produces.** `available_artifacts()` collects the files this config's own `file_exists` detectors name, registering each under both its full path and its stem — so `out/notes.md` is reachable as `notes` or as `out/notes.md`. A regex naming anything else has nothing to match and fails closed for the whole life of the loop, which reads as \"the work is not done\" rather than \"this check was never wired up.\" The error lists what *is* available.\n\n**A `judge` detector must name its standard.** An unnamed standard is an opinion. (Blocking + `objective` mode + a judge is a *warning*, nudging toward a script detector.)\n\n**`no_progress_iterations_randomness` must be ≥1 and strictly below `no_progress_iterations`**, and cannot be set at all when `no_progress_iterations` is 0 — staleness is never counted, so it could never fire.\n\n**Guideline arrows must resolve, must not self-loop, and must not cycle.** A node whose `stage` names a nonexistent guideline is an error too: it would simply never be dispatched, three hours into an unattended run.\n\nPlus the structural ones: duplicate goal/node/provider/guideline names, unknown `depends_on` targets, self-dependencies, unknown validation/success targets, `percentage` success without a `threshold` in `0.0..=1.0`, non-positive node `weight`, `max_parallel: 0`, empty provider `command`, cascade keys outside `cheap|standard|strong`.\n\n### The rules that are warnings\n\nThings that are usually a mistake but occasionally a choice: no `overall` validation; empty `pre_execution`; goal descriptions or guidelines under 12 characters; node instructions under 16; `max_iterations` over 100 (\"a loop that cannot converge in 100 iterations usually has a miscalibrated verifier\"); `no_progress_iterations: 0`; no budget ceiling of any kind; no nodes; no judge node; no providers; judge independence enforced with only one provider; and unisolated parallel builders.\n\n### Two algorithms core re-implements on purpose\n\n`loopsmith-graph` owns the real scheduler, but the dependency runs graph → core, so core cannot reach it. Both re-implementations are small and self-contained:\n\n**`topo_order`** — Kahn's algorithm over phase names, used only to detect guideline cycles. It reuses `ExecutionGuidelines::phases()` rather than writing a second traversal, which is the point of resolving phases into DAG shape in the first place.\n\n**`wave_levels`** — a relaxation pass computing, for each node, the longest dependency chain ending at it. Nodes sharing a wave have no path between them, so they are exactly the ones that can be dispatched together. This is what makes the \"parallel writers without isolation\" warning precise:\n\n```rust\n// `make-media -> publish` cannot overlap, so warning about it trains the\n// reader to ignore the warning that matters.\n```\n\nThe warning only fires for unisolated `Builder` nodes that share a wave, and only when `concurrency` is not `Sequential`. The loop is bounded by `nodes.len()` and breaks early when nothing changes, so a cyclic graph stops improving instead of hanging — cycles are reported at plan time, by the scheduler.\n\n### What validation does *not* check\n\n`constraints`, `default_skills`, `skills`, `context`, and `schedules` have no `check_*` function. They are structurally validated by serde and the schema, and semantically checked (if at all) by the crate that consumes them — `loopsmith-skills` for acquisition and URL safety, the runner for triggers. If you add a cross-field rule for one of those sections, you are adding the first one.\n\n## How this connects to the rest of the system\n\n`loopsmith-core` sits at the bottom of the dependency graph, above only `loopsmith-util`. Everything above it reads config; nothing it depends on reads config.\n\n```mermaid\ngraph TD\n    CLI[loopsmith CLI] --> CORE\n    RUN[run/ dispatch, prompts, phases, stop] --> CORE\n    GATE[loopsmith-gate] --> CORE\n    GRAPH[loopsmith-graph] --> CORE\n    PROV[loopsmith-provider] --> CORE\n    CORE[loopsmith-core] --> UTIL[loopsmith-util]\n```\n\nRepresentative consumers:\n\n- `src/cmd/validate.rs::execute` — `load()` then `validate()`, the direct surface of this module\n- `src/cmd/run.rs::start` and `src/cmd/watch.rs::execute` — `load_validated()`; the only paths where an error-severity issue halts the program\n- `src/run/phases.rs::new` — calls `ExecutionGuidelines::phases()` to build the phase scheduler\n- `src/run/prompts.rs::build_node_prompt` — `blocking_validations_for()`\n- `src/run/dispatch.rs::run_node` — `ConstraintSet::merged(global, per_node)`; node rules *append*, node limits *override*\n- `src/run/perturb.rs::ask_agent` — `cascade_for(Tier::Cheap)` to pick the perturbation agent\n- `src/run/summary.rs::add_narrative` — `provider()` to resolve `context.summary_provider`\n- `src/cmd/convert.rs`, `src/cmd/new.rs` — `is_markdown()` to route between the Markdown and YAML grammars\n\nThe one rule the whole design rests on: **a model must not certify its own completion.** Config expresses that in three places — `blocking` on validations, `enforce_judge_independence` on provider routing, and the requirement that a `judge` detector name an external standard — but the enforcement lives in `loopsmith-gate`, which is the only writer of `goal_satisfied` and can revoke it.\n\n## Adding to the config\n\nAdding a field is four edits, and skipping any one of them produces a quiet failure:\n\n1. **The struct** in the matching `config/*.rs`. Give it `#[serde(default)]` or a named default fn — `deny_unknown_fields` means an optional field without a default is a hard parse error for every existing config. Note the shared `pub(crate) fn yes() -> bool` helper: four sections default a boolean to true and a serde default must be a path, not a literal.\n2. **`config/loop.schema.json`** — same name, same default, same constraints, and keep `additionalProperties: false` intact.\n3. **`validate.rs`**, if the field has a relationship to another field. Schema handles shape; `validate()` handles everything the schema cannot express.\n4. **`Default for …`**, if the type has a hand-written `Default` impl (`StopGates`, `SkillPolicy`, `ContextPolicy`, `Concurrency`) — `#[derive(Default)]` is not doing it for you there.\n\nNew detector variants also need a `oneOf` branch in the schema and, usually, an arm in `check_validations`. New validation rules belong in the existing `check_*` function for their section; each takes `&LoopConfig` and `&mut ValidationReport` and pushes via `Issue::err` / `Issue::warn`.\n\nTests live beside the code. `validate.rs::tests::minimal()` builds the smallest config that passes cleanly and each test mutates one field off it — the fastest way to add a rule test is to start there. Several tests assert on the *message text*, not just on `has_errors()`:\n\n```rust\nassert!(r.render().contains(\"can never match\"), \"the error must say why: {}\", r.render());\n```\n\nThat is intentional. The error message is the feature; a rule that fires without explaining itself is a rule the author will work around rather than fix.","loop-execution-engine":"# Loop Execution Engine\n\n# Loop Execution Engine\n\n`runtime/crates/loopsmith-cli/src/run/`\n\nThe engine is the state machine that turns a validated `LoopConfig` into a run: it dispatches nodes wave by wave, collects evidence, asks the gate for a ruling, records what happened, and decides whether the run may continue. Everything else in `src/run/` exists so that `mod.rs` can stay a state machine and nothing else.\n\n## The invariant everything else is arranged around\n\n**The thing that decides whether work is finished is never the thing that did the work.**\n\nConcretely:\n\n- `loopsmith_gate` is the only writer of goal state. `collect_evidence` deliberately refuses to treat a node's own output as evidence — only artifacts on disk, parsed metrics, and judge verdicts count.\n- A judge verdict only reaches the gate once the engine knows which provider produced the work being judged; that comes from the episode record, not from the judge's claim. A judge sharing the builder's provider cannot satisfy a target (`a_judge_on_the_builders_provider_still_cannot_satisfy_the_gate`).\n- Phases close on the gate's ruling, never on a node reporting itself done (`Phases::refresh`).\n- The success export is written only when `StopReason::OverallSuccess` was returned, and that variant only comes from `should_stop` calling `loopsmith_gate::overall_success`. There is no flag that writes one anyway.\n- The stop-gate ladder is a pure function over a numeric snapshot, evaluated *after* the gate ruling, so no amount of confident model output can extend a run past its ceiling.\n\nThere is a structural test asserting the last part stays true: `nothing_that_perturbs_or_summarises_can_reach_goal_state` greps `perturb.rs` and `summary.rs` for `set_goal_state`, `to_goal_state`, and `GoalState`. If you add a component that consumes model output, add it to that list.\n\n## Entry point\n\n```rust\npub fn execute<S: Store>(\n    cfg: &LoopConfig,\n    store: &S,\n    opts: &RunOptions,\n) -> Result<RunOutcome, String>\n```\n\n`RunOptions` carries the run identity and the four switches that change behaviour rather than configuration: `dry_run` (plan and log, invoke no provider), `resume` (restore the checkpoint), `acquire_skills` (install missing sub-agents rather than running without them), and `verbose` (mirror the run log to stderr). `config_file` exists only so the export's re-run scripts can name the right file.\n\n`RunOutcome` reports the stop reason, the final verdicts, accumulated tokens and cost (with `tokens_estimated` set if any provider reported nothing and usage had to be estimated), the number of evolution proposals written, and the two paths a run may leave behind: `log_path` and `export_path`.\n\nCallers are the CLI commands — `cmd/run.rs`, `cmd/resume.rs`, and `cmd/watch.rs` all build a `RunOptions` and call `execute`; `cmd/run.rs::exit_code` and `cmd/mod.rs::report_outcome` read `StopReason::is_success`. `cmd/gate.rs` reuses `collect_evidence` directly to evaluate a workspace without running anything.\n\nBefore the first provider call, `execute` resolves two things that are config bugs if they fail: `loopsmith_graph::plan` (the node graph → waves and concurrency) and `Phases::new` (section I's phase graph, cycle-checked by reusing the scheduler). Discovering an unschedulable graph after dispatch means paying for the discovery.\n\n## One iteration\n\n```mermaid\nflowchart TD\n    A[read scratchpads + carry_forward summaries] --> B[per wave, per chunk:<br/>filter by phase + revision ceiling]\n    B --> C[ensure_skills, then<br/>thread::scope → run_node]\n    C --> D[join, then write:<br/>ledger, episodes, publish]\n    D --> E[harvest_judgments]\n    E --> F[collect_evidence → gate.evaluate_all]\n    F --> G[phases.refresh · summary · record_trials]\n    G --> H[should_stop]\n    H -->|None| A\n    H -->|Some| I[save checkpoint, export if success]\n```\n\nOrdering is load-bearing at three points. Skill acquisition touches the store, so it happens before threads start. Ledger and episode writes happen after the join, so the record stays ordered. The summary is written after the gate so it quotes rulings rather than predictions.\n\n## Components\n\n### `dispatch.rs` — running one node\n\n`run_node` is **store-free by design**: it runs on a worker thread, and a thread that can write the ledger is a thread that can interleave the ledger. Everything it learns comes back in a `NodeOutcome` and is written by the caller after the join.\n\nIt creates isolation (`worktree::create` when `node.isolated`, otherwise `Isolation::Shared`), seeds the worktree from what other nodes published, merges global and per-node constraints, builds both prompts, resolves the tier, and calls `loopsmith_provider::dispatch`. Provider failures become `NodeOutcome { error: Some(..) }` rather than a panic or an early return — the wave still joins cleanly.\n\n`NodeContext` bundles what a node is told beyond its own spec: scratchpad notes, resolved sub-agents, phase guideline, carried summaries, active perturbation, and the published-path map. It's a struct because the alternative is an eight-argument function where two arguments are `&str` and only their order distinguishes them.\n\n`ensure_skills` resolves declared sub-agents, acquiring missing ones when `acquire_skills` is on and otherwise logging that the node runs without them. A missing optional helper degrades a run; it does not break one.\n\n### `phases.rs` — section I at runtime\n\nA phase is **active** when every phase it depends on is complete, and **complete** when all its member nodes have run *and* every goal those nodes advance is satisfied per the gate. `Phases::eligible` is what the dispatch loop consults; nodes without a `stage` are always eligible, so adding phases was not a breaking change for configs that don't use them. Empty phases are marked complete at construction (`mark_vacuous_complete`) so a phase nobody staffed cannot block the one behind it. An unknown stage name fails closed.\n\n`refresh` returns the phases that closed on this pass, so the ledger can say so.\n\n### `prompts.rs` — what a node is told\n\nTwo prompts. The system prompt carries loop name, the `information` block, and the merged constraint set (rules, forbidden paths and commands, human checkpoints). The task prompt carries, in order: the instruction, the phase guideline, available sub-agents, the goals this node advances **and the blocking validations those goals face**, then either the judge output contract (for `Role::Judge`) or the perturbation directive (for everyone else), then carried history, then scratchpad notes.\n\nStating the bar in the prompt is not politeness — the gate will refuse work that missed a target nobody mentioned. The judge/perturbation branch is exclusive on purpose: telling the thing that checks the work to \"try a different approach\" is how a stalled loop talks itself into a lower bar.\n\n### `publish.rs` — isolation is a property of the wave, not the run\n\nAn isolated node runs in `state/worktrees/<node>/`, but evidence is collected from the loop root. Without publishing, a `file_exists` detector pointing at an isolated builder's output could never pass — real work, on disk, invisible to the only thing allowed to rule on it.\n\n`publish` asks git for the paths that differ from the commit the worktree branched from (`git status --porcelain -z --untracked-files=all`, parsed by `parse_status`, which drops rename sources and skips deletions), filters `state/`, `logs/`, and `.git/`, then copies. **First writer wins; the second is named in the ledger** with the path and the node that got there first — taking the last write silently would reintroduce exactly the collision isolation exists to prevent.\n\n`seed` is the mirror: because a worktree branches from `HEAD`, an isolated node starts blind to everything the run produced since, including its upstream's output. Seeding copies published paths in before the node runs — never a path the node published itself, so a builder's in-progress work isn't overwritten by last iteration's copy of it.\n\nThe engine keeps two maps for this: `published_paths` spans the whole run (used for seeding), `claimed_paths` is per-iteration (used for collision detection). A node rewriting its own output next iteration is normal and is not a collision.\n\n### `summary.rs` — compressing an iteration\n\nTwo halves, and the split is the point:\n\n- `deterministic(&IterationFacts)` is written by Rust from the gate's verdicts and the dispatch log. Always present, costs nothing, cannot be wrong. It reports what ran, newly satisfied targets, **REVOKED** targets (the gate can take `done` back), still-failing blocking checks with the gate's own evidence line, closed phases, and spend.\n- `add_narrative` optionally buys prose from `context.summary_provider` at `Tier::Cheap`. Best effort — a failed summariser must not fail the iteration it describes — and the prompt explicitly tells it that it is not deciding whether anything is finished.\n\n`carry_forward` renders the last `context.carry_summaries` summaries for the next iteration's prompts. This is the entire cost-control story: prompt size stops growing with the run. Setting `carry_summaries: 0` disables it, and the observable effect is that iteration 2 gets a byte-identical prompt to iteration 1 — which is precisely the bug carry-forward was added to fix.\n\n### `stop.rs` — the ladder\n\n`should_stop(&StopInputs) -> Option<StopReason>`. Pure: no store, no providers, no clock. Order is not arbitrary:\n\n1. `OverallSuccess` — checked first so a run that meets the bar on its last permitted iteration reports success, not \"iteration cap\".\n2. `NoProgress` — `no_progress_iterations: 0` means *disabled*, not *instant*.\n3. `IterationCap`\n4. `WallClock`, `TokenBudget`, `CostBudget` — budgets, cheapest signal first.\n\n`progress_signature` fingerprints the verdict map (`target:satisfied:passed/total`, sorted). An unchanged signature increments `stale_iterations`; any change resets it. Adding a gate means adding a variant, a branch, and a `describe()` arm — nothing in `execute` changes.\n\n### `evolve.rs` / `perturb.rs` — learning and unsticking\n\n`evolve` handles the parts that change future runs rather than this one: `harvest_judgments` parses judge output into `Judgment`s, `record_trials` records what each sub-agent was worth (skill × satisfied-goals), `next_candidate` picks an untried skill to explore, and `write_proposals` turns exhausted nodes and stuck verdicts into config proposals.\n\n`perturb` fires only when `stop_gates.no_progress_iterations_randomness` is set and `stale_iterations` has reached it. `seed_for(run_id, iteration)` makes the choice reproducible and the seed is written to the ledger so a run replays. A chosen `Perturbation` can reorder a wave (`shuffle`), escalate a tier (`tier_for`, never for judges), add a prompt directive (`directive`), or trigger `Explore` — the one case where trying an untried sub-agent is worth money without being asked. Perturbation delays giving up; it does not prevent it (`a_stalled_run_varies_its_approach_before_it_gives_up`).\n\n### `export.rs` — what a successful run leaves behind\n\n`export_success` writes `<root>/<name>-success/`: a `SKILL.md` frontmatter'd as a reusable sub-agent, an `EVIDENCE.md` stating where each ruling came from, the converged `loop.yaml` verbatim, whatever is in `out/`, and both `run.sh` (POSIX sh — macOS ships bash 3.2) and `run.cmd` (CRLF, single `exit /b` on the last line because `setlocal`'s implicit `endlocal` restores the errorlevel). The loop name is `sanitize`d before it reaches the filesystem. `SKILL.md` says in as many words that it is \"a record, not a guarantee\".\n\n## Concurrency\n\n`plan.concurrency` sets the width. Waves run in sequence; within a wave, nodes are independent by construction and are chunked by width, each chunk running under `std::thread::scope`. The published-path map is **snapshotted per chunk** rather than borrowed — every node in one chunk sees the same published set, which is also the honest answer, since they ran at the same time.\n\nRules for anything you add to the threaded section:\n\n- No store access inside the closure. Return it in `NodeOutcome` and write it after the join.\n- Borrow references *outside* the `move` closure (see the `nudge` binding — taking `perturbation.as_ref()` inside would capture the `Option` itself).\n- Thread panics are dropped via `filter_map(|h| h.join().ok())`; a panicking node loses its outcome rather than the wave.\n\n`independent_nodes_in_a_wave_run_concurrently` guards this with a wall-clock assertion, using `ping -n` on Windows because `sleep` isn't a command there.\n\n## State that survives\n\nThe `Checkpoint` carries `iteration`, `completed_nodes`, `tokens_used`, `cost_usd`, `revisions`, `stale_iterations`, `last_signature`, and `verdicts_json`. Restoring the stop-gate accounting is deliberate: a resumed run must not be handed a fresh revision budget and a zeroed no-progress counter every time it pauses. `restore_verdicts` drops unparseable stored verdicts rather than guessing — a resumed run reporting no deltas on its first iteration is a small loss; one reporting invented deltas is not.\n\n`max_revisions_per_node` is enforced by counting, per node, the iterations where it ran and *left a declared goal unsatisfied*. Nodes with no declared goals are never counted (nothing to measure them against), and a node whose goals pass keeps being dispatched forever. When a node hits the ceiling it stops being dispatched, the ledger says why, and the run continues — one stuck node must not spend the whole iteration budget.\n\nEvery event goes through `Recorder::entry`, which writes the sled ledger and the plain-text run log in one call, so the queryable record and the readable one cannot disagree. `a_run_writes_a_readable_log_beside_the_config` asserts they hold the same number of events.\n\n## Contributing notes\n\n- **Adding a stop condition** → `StopReason` variant + branch in `should_stop` + `describe()`. Nothing in `execute` changes.\n- **Adding something a node is told** → field on `NodeContext`, rendering in `build_node_prompt`. Remember it changes `prompt_digest`, which several tests use as the proxy for \"the prompt actually varied\".\n- **Adding a component that reads model output** → it must not be able to reach goal state, and it should be added to the file list in `nothing_that_perturbs_or_summarises_can_reach_goal_state`.\n- **Adding a detector type that needs artifacts** → `artifact_paths` currently derives the readable set from `file_exists` detectors only. That set is the config's own answer to \"what is this loop supposed to produce\". A regex naming anything else is caught by validation rather than failing silently at runtime — keep that pairing intact.\n- Known limitation, documented in `publish.rs`: an isolated node sees its upstream's work only via `seed`, which copies published files in. It does not see uncommitted work through git. Downstream *unisolated* nodes read the loop root directly and do.","markdown-yaml-config-interchange":"# Markdown/YAML Config Interchange\n\n# Markdown/YAML Config Interchange\n\nA loopsmith config has one model (`LoopConfig`) and two grammars. YAML is the machine-friendly one. Markdown is the one a human can read top to bottom, with the reasoning for a goal sitting directly above the goal. This module is the bridge: `parse_md` turns a document into a `LoopConfig`, `render_md` turns a `LoopConfig` back into a document, and `loopsmith convert` exposes both to the CLI.\n\n**Location:** `runtime/crates/loopsmith-core/src/md/` (`mod.rs`, `parse.rs`, `render.rs`) plus `runtime/crates/loopsmith-cli/src/cmd/convert.rs`.\n\n## The central design decision\n\nNeither the parser nor the renderer knows what a `Goal` is.\n\n`parse_md` builds a `serde_yaml::Value` tree and hands it to `serde_yaml::from_value::<LoopConfig>`. `render_md` starts from `serde_yaml::to_value(cfg)` and walks the resulting `Value`. Both sides speak only mapping/sequence/scalar.\n\nThe consequence is the point: every `#[serde(default)]`, every alias, and every `deny_unknown_fields` rule that governs the YAML path governs the markdown path identically, for free. A misspelled field is refused in a `.md` file for the same reason it is refused in a `.yaml` file — the rejection happens in serde, downstream of anything this module wrote. Adding a field to `LoopConfig` requires no change here at all. Adding a whole *section* requires, at most, one line in `section_shape` and one in `SECTIONS`.\n\n```mermaid\nflowchart LR\n    MD[\".md document\"] -->|tokenize| T[\"Vec&lt;Tok&gt;\"]\n    T -->|build_document| V[\"serde_yaml::Value\"]\n    V -->|from_value| C[\"LoopConfig\"]\n    C -->|to_value| V2[\"serde_yaml::Value\"]\n    V2 -->|render_md| MD2[\".md document\"]\n    C -->|serde_yaml::to_string| Y[\".yaml\"]\n    Y -->|core::load| C\n```\n\n## The document grammar\n\n| Markdown construct | Meaning |\n|---|---|\n| `# my-loop` | sets the top-level `name` |\n| bullets before any `##` | top-level fields (`version`, `description`) |\n| `## F. Stop gates` | opens a section — normalised to the key `stop_gates` |\n| `### ship-it` | opens an entry inside the current section |\n| `- key: value` | a field on whichever scope is currently open |\n| indented bullets under a valueless `- key:` | a nested mapping or list |\n| an indented non-bullet line under a bullet | a continuation of that bullet's value |\n| anything else at column 0 | documentation; dropped |\n\nThat last row is the feature, not a limitation. Paragraphs, tables, and fenced code blocks at the left margin are ignored entirely, so a config can carry its own justification in the same file.\n\n### Heading normalisation\n\n`heading_to_key` in `mod.rs` maps `A. Pre-execution` → `pre_execution`. Section letters are a navigation aid for humans, not grammar, so a leading `A.` / `B)` / `J -` is stripped — but only when the delimiter sits at index ≤ 2 and the prefix is alphanumeric. That window is why `Pre-execution` (hyphen at index 3) survives intact rather than becoming `execution`. After stripping, the heading is lowercased and its spaces and hyphens become underscores. Writing the raw key (`## stop_gates`) works too.\n\n### `SectionShape`: the one place sections are special\n\n`### ship-it` has to become `name: ship-it` under `goals` but `id: ship-it` under `graph`. `section_shape` is the whole table of that knowledge:\n\n```rust\npub(crate) struct SectionShape {\n    pub list_field: Option<&'static str>,  // None when the section *is* the list\n    pub key_field: &'static str,           // what a `###` heading fills in\n}\n```\n\n`goals`, `validations`, `success`, `information`, `pre_execution`, `schedules`, `default_skills` are lists directly (`list_field: None`). `graph`, `providers`, and `execution_guidelines` are mappings that hold their list under a named field (`nodes`, `providers`, `items`). A section absent from the table — `stop_gates`, `constraints`, `skills`, `context` — is a plain field bag and takes no `###` entries; attempting one is a parse error with that exact message.\n\nBoth `parse.rs` and `render.rs` call `section_shape`, which is what keeps the two directions from drifting.\n\n## Parsing (`parse.rs`)\n\n`parse_md(text, origin)` runs three stages. Failures at either of the last two become `CoreError::Parse` with `json: \"not attempted: the file was read as markdown\"` — the markdown path never falls back to JSON, and the error says so rather than leaving a confusing empty field.\n\n### 1. `tokenize` → `Vec<Tok>`\n\nA flat scan producing `H1`, `H2`, `H3`, and `Bullet { indent, text }`. Three behaviours worth knowing:\n\n- **Fences toggle a skip.** A ` ``` ` at column 0 flips `fenced`; everything until the closing fence is dropped. Example configs inside a config's own documentation cannot corrupt it.\n- **Headings are only headings at column 0.** An indented `### foo` is not a heading; it is a candidate continuation line.\n- **Continuation folding.** A non-bullet line that is indented past the bullet above it, *with no blank line between them*, is appended to that bullet's text with a `\\n`. This is how a long `instruction` field spans several lines without becoming prose. The blank-line guard is what separates a wrapped value from a new paragraph.\n\n### 2. `build_document` → `Value`\n\nA single pass over the tokens with two pieces of state: the open `section` and the open `entry`. Every heading first calls `flush_entry`, which appends the entry under construction to the right place — `root[section]` when `list_field` is `None`, `root[section][list_field]` otherwise — and errors clearly if that slot already holds the wrong kind of value.\n\nA `###` heading's text is inserted as a `Value::from(String)` and **never** re-read as YAML. Without that, `### Recorded the baseline: test count, coverage` would parse as a one-entry mapping and land on a field expecting text.\n\nBullets are gathered into maximal runs and handed to `build_block`, then routed by the current scope:\n\n- an entry is open → the bullets are that entry's fields\n- only a section is open → they merge into the section mapping\n- neither → they are top-level fields\n\n### 3. `build_block` → mapping or sequence\n\nRecursive over indentation. `split_field` decides whether `- text` is a field or a bare list item, and its guard is deliberately strict: **a key containing whitespace is not a key.** That is what stops `- Never git stash. Never git reset.` from being read as a field named `Never git stash. Never git reset.`. A `- key:` with nothing after it claims the more-deeply-indented bullets below it as its value; with nothing below, it becomes `Value::Null`.\n\nA block that mixes `key: value` bullets with bare items is rejected — it has no unambiguous reading.\n\n`scalar` interprets a value the way YAML would, so `12`, `true`, and `[a, b]` arrive as the types they look like. Multi-line values (i.e. folded continuations) are kept as verbatim strings: prose with a colon in it is not a mapping.\n\n## Rendering (`render.rs`)\n\n`render_md(cfg)` is the inverse, over `serde_yaml::to_value`. It emits `# {name}`, then the `PREAMBLE` fields (`version`, `description`), then each section in `SECTIONS` order — the same A–J ordering as `LOOP-TEMPLATE.md`, so a rendered config and the template read alike. Absent and blank sections are skipped.\n\n`render_section` branches on the same three shapes the parser recognises: a sequence with a shape (each element becomes a `###` entry), a mapping with a shape (its scalar fields first, then its list rendered as entries), and a plain mapping with no shape (a flat bullet list).\n\n### The rules that make round-tripping work\n\n- **`is_blank` omits nulls and empty collections** — a config full of `- skills: []` is noise, and serde defaults put them back on the way in. But an **empty string is not blank**. `value: \"\"` is a value the author chose, and dropping it from a required field produces a document that no longer parses. `information[].value` is the field that taught this lesson.\n- **`push_string` quotes only when it must.** A string is written bare unless YAML would read it back as something other than that same string. Prose stays readable; `\"12\"` and `\"true\"` get quotes.\n- **Nested lists of objects are emitted as inline JSON flow** via `flow()`. There is no bullet form for them that survives a round trip, and JSON is a subset of YAML — which is exactly what `scalar` feeds a value to on the way back in.\n- **Values are `trim_end`ed.** A bullet ends where the line ends, so trailing whitespace inside a value is the one thing markdown cannot carry. Nothing else is lost.\n- **Multi-line strings** are written with the first line on the bullet and subsequent lines indented by `indent + 4`, which `tokenize`'s continuation rule folds back together.\n\n### The guard against silent loss\n\n`render_md` walks `SECTIONS` and `PREAMBLE`, so a top-level key in neither list is *silently dropped*. That is a real failure mode — it is how the `context` section went missing once. The test `the_renderer_knows_about_every_top_level_config_key` closes it: it serialises a parsed config and asserts every top-level key it produces appears in `covered_keys()` (`SECTIONS` + `PREAMBLE` + `name`), failing with the list of keys that would be lost.\n\n**If you add a section to `LoopConfig`, add it to `SECTIONS`.** That test will tell you if you forget.\n\n## How it connects\n\n`loopsmith_core::load` dispatches on the file extension and calls `parse_md` for markdown, so *every* command that loads a config goes through this module for `.md` inputs — `run`, `resume`, `gate`, `schedule`, `permissions`, `providers`. That is why the parser has to be as strict as the YAML path rather than merely permissive: it is not a side door.\n\n`loopsmith_core::is_markdown` is the extension check; `parse_md` and `render_md` are the crate's public surface from this module.\n\nConsumers:\n\n- **`cmd/convert.rs`** — `loopsmith convert` is load-then-emit. Direction is inferred: `is_markdown(config)` means the input is markdown so the output is YAML; otherwise render markdown. `--to-yaml` forces YAML either way. Output goes to `--out` (creating parent directories) or stdout.\n- **`loopsmith-cli/src/scaffold.rs`** — calls `parse_md` to load bundled markdown templates.\n- **`loopsmith-core/tests/md_roundtrip.rs`** — the property test. `roundtrip` runs `render_md` then `parse_md` and compares. Companion tests cover the equivalence of a markdown config with its YAML twin, prose and fenced blocks being ignored, multi-line instructions surviving, and a misspelled field being refused.\n\n## Contributing\n\n| Change | What you touch |\n|---|---|\n| New field on an existing config struct | Nothing here |\n| New plain field-bag section | `SECTIONS` in `render.rs` |\n| New section taking `###` entries | `section_shape` in `mod.rs` **and** `SECTIONS` in `render.rs` |\n| Change to how a value is spelled | `scalar`/`split_field` in `parse.rs` and `push_string`/`flow` in `render.rs` — always as a pair |\n\nAnything touching the grammar should come with a case in `md_roundtrip.rs`. The round trip is a property test rather than a hope, and the pairing of parse and render rules is the invariant it protects.","mcp-server":"# MCP Server\n\n# MCP Server (`loopsmith-mcp`)\n\nA local, stdio-only [Model Context Protocol](https://modelcontextprotocol.io) server that exposes three slices of the loopsmith control plane — the schedule, the ledger, and the gate's verdict — to any MCP client (an editor, an agent, Claude Code).\n\nThe whole crate is one file: `runtime/crates/loopsmith-mcp/src/lib.rs`.\n\n## The invariant this module is built around\n\n> A model must not be the thing that certifies its own completion.\n\nEverything else in the design follows from that. There is no `set_goal_satisfied` tool, no `mark_done`, no way to write a `TargetVerdict` back into the store. `loopsmith_gate_evaluate` *reports* the gate's ruling by calling `loopsmith_gate::evaluate` on freshly collected evidence; it does not persist anything. `goal_satisfied` is written by `loopsmith-gate` and by nothing else.\n\nThis is enforced by a test rather than by convention — `there_is_no_tool_for_declaring_a_goal_satisfied` walks the names returned by `tools()` and fails if any contains `satisfy`, `set_goal`, or `mark_done`. If you add a tool, that test is the gate you have to get past.\n\nThe two tools that *do* mutate — `loopsmith_record_episode` and `loopsmith_scratchpad` — write records of what happened, not rulings about it. An episode is refused outright without `provider_id`, because unattributed work cannot later be judged for independence.\n\n## Transport and protocol\n\nJSON-RPC 2.0, newline-delimited, over stdin/stdout. Three methods matter: `initialize`, `tools/list`, `tools/call`. That is the entire surface an MCP client needs, and implementing it directly is why this crate takes no async runtime as a dependency — `serve` is a blocking `for line in input.lines()` loop.\n\n`PROTOCOL_VERSION` is pinned to `\"2024-11-05\"` and returned verbatim from `initialize`, alongside `serverInfo.name = \"loopsmith\"` and the crate version from `CARGO_PKG_VERSION`.\n\nStdio-only is a deliberate boundary, not an unfinished feature. A loop's ledger and goal state are the record of what happened on one machine; putting them on a socket is a different security question than the one this crate answers.\n\n## Request lifecycle\n\n```mermaid\nflowchart TD\n    serve[\"serve()<br/>read line\"] -->|parse ok| handle[\"handle()\"]\n    serve -->|parse fail| parse[\"Response::err(-32700)\"]\n    handle -->|initialize / tools/list| ok[\"Response::ok\"]\n    handle -->|tools/call| call[\"call()\"]\n    handle -->|other| unknown[\"Response::err(-32601)\"]\n    call --> tool[\"tool_plan / tool_gate / tool_ledger /<br/>tool_goal_states / tool_record / tool_scratchpad\"]\n    tool -->|Ok / Err| wrap[\"Response::ok with<br/>content[] + isError\"]\n```\n\n`serve` checks `req.id.is_none()` *before* dispatching: notifications are still handled (so `notifications/initialized` does its work) but the response is dropped rather than written, per the spec. The test `serve_answers_requests_and_stays_silent_on_notifications` feeds three lines in and asserts exactly two come out.\n\nOutput is flushed after every line. A malformed line produces a `-32700` parse error with `id: null` and the loop continues — `malformed_json_gets_a_parse_error_rather_than_a_panic` covers that.\n\n## Two error channels, and when each is used\n\nThis distinction trips people up, so it is worth stating plainly:\n\n| Failure | Shape | Example |\n|---|---|---|\n| Protocol-level | JSON-RPC `error` object, `result` absent | unknown method → `-32601`; unparseable line → `-32700` |\n| Tool-level | JSON-RPC **success**, `result.isError == true`, message in `content[0].text` | missing `run_id`, config that won't load, unknown tool name |\n\nEvery failure inside `call` — including `unknown tool` — comes back as a *successful* JSON-RPC response carrying `isError: true`. That is what MCP clients expect: a tool that failed is a normal result the model should see and react to, not a transport fault. Internally the tool methods all return `Result<Value, String>` and `call` does the wrapping in one place.\n\nSuccessful results are serialized with `serde_json::to_string_pretty` into a single text content block, so the client sees readable JSON rather than a nested object.\n\n## Tool catalogue\n\n`tools()` returns the catalogue as a `serde_json::Value` array — a free function, not a method, which is what lets the independence test inspect it without opening a store.\n\n| Tool | Required args | What it does |\n|---|---|---|\n| `loopsmith_plan` | `config_path` | Loads the config, runs `loopsmith_graph::plan` on `cfg.graph`, returns waves, critical path and cost, parallel fraction, chosen concurrency, predicted speedup, speedup ceiling |\n| `loopsmith_gate_evaluate` | `config_path`, `target` | Builds `Evidence` from `workdir` + supplied metrics/artifacts, returns the `TargetVerdict` from `loopsmith_gate::evaluate` |\n| `loopsmith_ledger` | `run_id` | `Store::ledger`, optionally tail-limited |\n| `loopsmith_goal_states` | `run_id` | `Store::goal_states` — current gate rulings for every goal plus `overall` |\n| `loopsmith_record_episode` | `run_id`, `node_id`, `provider_id`, `output` | Builds an `Episode` and `Store::put_episode`; returns the assigned `seq` |\n| `loopsmith_scratchpad` | `run_id`, `key` | Read/write in one tool — omit `value` to read |\n\nDetails that aren't obvious from the schemas:\n\n**`loopsmith_ledger`'s `limit` is a tail, not a head.** `tool_ledger` computes `entries.len().saturating_sub(limit)` and `split_off`s at that point, so you get the *last* N entries. That's the useful default for an agent asking \"what just happened,\" and `saturating_sub` means an oversized limit returns everything rather than panicking.\n\n**`loopsmith_gate_evaluate` silently drops ill-typed evidence.** Metrics are taken only via `as_f64` and artifacts only via `as_str`; a metric sent as a JSON string, or an artifact sent as a number, is skipped without complaint. `workdir` defaults to `\".\"`, which means the gate resolves artifact paths relative to wherever the *server* process was started — not the client's cwd. Pass it explicitly if the two can differ.\n\n**`tool_record` accepts more than it advertises.** Beyond the declared schema it reads optional `tokens`, `cost_usd`, and `duration_ms`. `role` defaults to `\"builder\"`, `iteration` to `0`, `error` is always `None`, and `prompt_digest` is written as an empty string — the MCP path has no prompt to digest. `created_ms` comes from `loopsmith_memory::now_ms()`.\n\n**Argument validation is one helper.** `str_arg(args, key)` returns `Err(\"missing required argument \\`key\\`\")`, and the error text carries the key name. Tests assert on that substring (`a_missing_argument_is_reported_as_a_tool_error` looks for `run_id`; `recording_without_provenance_is_refused` looks for `provider_id`), so the message format is load-bearing.\n\n## Types\n\n```rust\npub struct Request  { jsonrpc: String, id: Option<Value>, method: String, params: Value }\npub struct Response { jsonrpc: &'static str, id: Option<Value>, result: Option<Value>, error: Option<Value> }\npub struct Server<S: Store> { pub store: S }\n```\n\n`Request` uses `#[serde(default)]` on everything except `method` — a request missing `jsonrpc` or `params` still deserializes, and only a missing `method` is a parse error. `Response` skips `None` fields on serialize, so `result` and `error` are never both present on the wire. Construct responses through `Response::ok` / `Response::err` rather than by hand; they set `jsonrpc` for you.\n\n`Server` is generic over `loopsmith_memory::Store`, which is what makes the handler testable against any backing store. The tests use `SledStore` over a `loopsmith_util::testing::temp_path`.\n\n## Where it sits\n\n`loopsmith-mcp` is a leaf in the dependency graph — nothing in the workspace calls into it; the `loopsmith` binary's `mcp` subcommand constructs a `Server` and hands it stdin/stdout. It reaches downward into four crates:\n\n- **`loopsmith-core`** — `load(path)` for the A–J config, used by both `tool_plan` and `tool_gate`\n- **`loopsmith-graph`** — `plan(&cfg.graph)` for waves and Amdahl-driven concurrency\n- **`loopsmith-gate`** — `Evidence`, `TargetVerdict`, `evaluate`\n- **`loopsmith-memory`** — the `Store` trait, `Episode`, `LedgerEntry`, `now_ms`\n\nEverything returned to the client is `serde_json::to_value` over those crates' own types, so their `Serialize` impls *are* this crate's public response schema. Changing a field on `TargetVerdict` or `LedgerEntry` changes the MCP output with no compiler error here to warn you.\n\n## Running it\n\nRegister the binary as a local MCP server (see `runtime/crates/loopsmith-cli/templates/mcp.template.json`):\n\n```bash\nclaude mcp add loopsmith -- loopsmith mcp --state ./state\n```\n\nor drop the `mcpServers` block into `.mcp.json` at your project root. The template also carries fallbacks for when the binary isn't on `PATH` — an absolute path, or `cargo run --release -p loopsmith -- mcp --state ./state` for development.\n\n## Contributing notes\n\n**Adding a tool** means three edits in lockstep: an entry in `tools()`, an arm in `call`'s match, and a `tool_*` method returning `Result<Value, String>`. Use `str_arg` for required strings so the error text stays uniform. If the tool mutates, be able to say why what it writes is a record rather than a ruling.\n\n**The crate's `include` is deliberately narrow** — only `/src/**/*` and `/README.md`. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain; shipping them would hand a published crate tests that cannot pass. Don't widen `include` to \"fix\" missing test fixtures.\n\n**Test hygiene:** each test opens a `SledStore` in a temp directory and removes it at the end. There is no shared fixture and no cleanup guard, so a panicking test leaks its directory — acceptable, but don't build on the assumption that it's cleaned up.","memory-episode-store":"# Memory & Episode Store\n\n# loopsmith-memory\n\nThe durable substrate of a loopsmith run. Everything that must survive a crash, a scheduled pause, or a context reset lives in this crate: episodes (what a node did), goal state (what the gate has ruled), the ledger (append-only audit trail), checkpoints (where to resume), per-goal scratchpads, iteration summaries, skill trials, and proposals.\n\nIt sits at the bottom of the dependency graph alongside `loopsmith-core`, depending only on `loopsmith-util` (for `now_ms`), `serde`/`serde_json`, `thiserror`, and `sled`. Nothing in this crate knows about the gate, the graph, or providers — the dependency arrows all point *inward*, which is load-bearing for one specific reason covered under [The direction that keeps the gate honest](#the-direction-that-keeps-the-gate-honest).\n\n## Two design rules\n\n**Validate before writing.** Bad data compounds: one wrong record becomes a retrieved \"fact\", which becomes reasoning, which becomes another record. Every write path in `SledStore` checks its input and returns `MemError::Rejected` rather than storing it. `Episode::check` requires a non-empty `run_id`, `node_id`, and `provider_id`; `set_goal_state` rejects an empty target and any state where `passed + failed > total`; `put_skill_trial` rejects an empty skill name and a `pass_rate` outside `0.0..=1.0`; `append_ledger`, `put_summary`, and `put_proposal` all require a non-empty `run_id`.\n\n**The store is a trait.** `sled` is the shipped backend but is effectively frozen upstream, so callers depend on the `Store` trait and a different engine can be swapped in without touching them. `open(path) -> Result<SledStore>` is the convenience constructor for the shipped implementation; anything that only needs persistence should take `&dyn Store` or a generic bound.\n\n## Record types\n\n| Type | What it records | Written by |\n|---|---|---|\n| `Episode` | One node's work on one iteration: role, `provider_id`, `prompt_digest`, output, tokens, cost, duration, error | the run loop (`src/run/mod.rs`) |\n| `GoalState` | The gate's ruling on one target: `satisfied`, passed/failed/total, reason, iteration | `loopsmith-gate` only |\n| `LedgerEntry` | An audit event tagged with a `LedgerKind` | `loopsmith-cli/src/logging.rs` |\n| `Checkpoint` | Where to resume, including the stop gates' accounting | the run loop |\n| `IterationSummary` | One iteration compressed for re-injection into a later prompt | `src/run/summary.rs` |\n| `SkillTrial` | One observation of \"did this skill help?\" | `src/run/evolve.rs` |\n| `Proposal` | A change the loop wants but may not apply itself | `src/run/evolve.rs` |\n\n### Episode\n\n`provider_id` is not bookkeeping. It records the provider that *actually* served the call, so the gate can verify a judge did not run on the same provider as its builder. `tokens`, `cost_usd`, `duration_ms`, and `error` are all `#[serde(default)]` optionals — an episode is written even when the call failed.\n\n### GoalState\n\n`pass_rate()` returns `passed / total`, guarding the zero case. The type carries no constructor discipline of its own — the rule that only `loopsmith-gate` may build one with `satisfied: true` is enforced by the dependency direction, not by visibility.\n\n### LedgerEntry and LedgerKind\n\nThe ledger is append-only and records *every* stop-gate trigger, not just successes. A node that hits its ceiling constantly is a signal, and that signal is invisible if only completions are logged. `LedgerKind` spans the full run lifecycle: `RunStarted`, `IterationStarted`, `NodeDispatched`, `NodeSucceeded`, `NodeFailed`, `GateEvaluated`, `GoalSatisfied`, `GoalRevoked`, `SkillAcquired`, `ProposalWritten`, `StopGateTriggered`, `RunFinished`.\n\nNote `GoalRevoked` alongside `GoalSatisfied` — the gate can take back a ruling. Delete a required artifact and a satisfied goal flips back, and the ledger keeps both events.\n\n### Checkpoint\n\n`Checkpoint::new(run_id)` produces a zeroed checkpoint stamped with `now_ms()`. Beyond the obvious resume fields (`iteration`, `completed_nodes`, `tokens_used`, `cost_usd`), it carries the stop gates' own accounting:\n\n- `revisions: BTreeMap<String, u32>` — how many times each node has run with its goals still unsatisfied. This is what `max_revisions_per_node` bounds.\n- `stale_iterations` — consecutive iterations in which no verdict moved.\n- `last_signature` — the rulings' signature at the last iteration.\n- `verdicts_json` — last iteration's gate rulings, serialised as text.\n\nThese fields exist because without them a loop that resumes often would be handed a fresh revision budget and a no-progress counter of zero every time, so a run going nowhere could never reach the halt that exists to stop it. The ceilings would apply only to runs that never paused. The `checkpoint_survives_reopen` test asserts all four survive a drop-and-reopen, and `loopsmith-cli/tests/stress.rs` has an end-to-end `a_resume_does_not_reset_the_no_progress_counter`.\n\nTwo subtleties worth knowing before you touch this struct:\n\n- `completed_nodes` means \"has this node ever run in this run\", not \"did it run this iteration\". Phase completion is computed from it, so redefining it per-iteration would reopen every phase on every pass.\n- `verdicts_json` is text rather than the gate's verdict type on purpose. See below.\n\n### IterationSummary\n\nThe record that makes a long run affordable. Without it, iteration N+1 either re-sends every prior episode (unbounded growth) or sends nothing (which is why a stalled loop used to produce the byte-identical prompt it had already failed with).\n\nThe `facts: Vec<String>` / `narrative: Option<String>` split is deliberate: `facts` is written by Rust from the gate's own verdicts and is always present; `narrative` is optional prose from a model and is never load-bearing. `render()` emits `### Iteration N`, the headline, the facts as bullets, and the trimmed narrative if non-empty — this is the string injected into later prompts.\n\nStorage keys summaries by iteration rather than by sequence, so re-summarising an iteration *replaces* it. Appending a second version would mean a later `summaries()` read silently includes the iteration twice.\n\n### SkillTrial, SkillScore, and `score_skills`\n\n`SkillTrial` is the substrate of self-evolution. A loop cannot reason its way to knowing which sub-agents earn their place — it has to try them and watch the gate. Each trial pairs a skill (with its `source`: `installed | marketplace | generated`) against the gate outcome that followed: the node's blocking `pass_rate` and whether every goal it advances ended the iteration `satisfied`.\n\n`score_skills(&[SkillTrial]) -> Vec<SkillScore>` groups trials by skill name into a `BTreeMap`, sums pass rates, counts satisfied outcomes, and sorts by `satisfaction_rate()` descending with `trials` as the tiebreaker. The `source` recorded on a `SkillScore` is whichever trial was seen first for that skill.\n\nA skill with too few trials is still reported but should not be acted on — one lucky run is not evidence. The scorer does not filter on trial count; that judgment belongs to the caller (`src/cmd/skills.rs::scores`, `src/run/evolve.rs::skill_proposals`).\n\nTrials are keyed globally (`st/<seq>`) rather than per run, because a skill's track record is only meaningful across runs — one bad loop should not erase it.\n\n### Proposal and expiry\n\nA `Proposal` is a change the loop wants to make but may not apply itself. `ProposalKind` covers `AdoptSkill`, `DropSkill`, `TrySkill`, `ReshapeGraph`, and `ChangeCriteria` — and anything touching goals, validations, or success criteria is *always* a proposal, never an action.\n\nProposals expire because a proposal is evidence about a moment: \"this skill correlated with satisfied goals across the last three iterations\" is a claim about a graph and a config that have both since been edited by hand. Nothing expires a proposal automatically and nothing deletes one — the record of what the loop wanted is worth keeping — but a reviewer needs to know which suggestions answer a question nobody is asking any more.\n\n```\nProposal { expires_ms: None }\n        │\n        ├─ with_default_expiry() ──▶ default_lifetime_ms(kind)\n        │                              TrySkill              → 7 days\n        │                              AdoptSkill / DropSkill → 30 days\n        │                              ReshapeGraph          → 30 days\n        │                              ChangeCriteria        → never\n        │\n        └─ an explicitly-set expires_ms is left alone\n```\n\n`with_default_expiry` uses `checked_add`, so a `created_ms` near `u64::MAX` yields `None` rather than wrapping. `is_expired(now_ms)` treats the expiry instant itself as already stale (`now_ms >= e`).\n\nThe match in `default_lifetime_ms` is exhaustive on purpose: a new `ProposalKind` cannot be added without deciding its lifetime, and `every_proposal_kind_has_a_decided_lifetime` pins each decision so a change to one shows up in a diff.\n\n`expires_ms` is `#[serde(default)]` because proposals live in a sled store that outlives the binary that wrote them. Without it, records written by an earlier build fail to parse and `loopsmith proposals` reports a backend error on a perfectly healthy store — `a_proposal_written_before_the_field_existed_still_deserialises` guards that.\n\n## The `Store` trait\n\n```rust\npub trait Store: Send + Sync {\n    fn put_episode(&self, ep: &Episode) -> Result<u64>;\n    fn episodes(&self, run_id: &str) -> Result<Vec<Episode>>;\n\n    fn set_goal_state(&self, run_id: &str, st: &GoalState) -> Result<()>;\n    fn goal_state(&self, run_id: &str, target: &str) -> Result<Option<GoalState>>;\n    fn goal_states(&self, run_id: &str) -> Result<BTreeMap<String, GoalState>>;\n\n    fn append_ledger(&self, entry: &LedgerEntry) -> Result<u64>;\n    fn ledger(&self, run_id: &str) -> Result<Vec<LedgerEntry>>;\n\n    fn save_checkpoint(&self, cp: &Checkpoint) -> Result<()>;\n    fn checkpoint(&self, run_id: &str) -> Result<Option<Checkpoint>>;\n\n    fn set_scratchpad(&self, run_id: &str, key: &str, value: &str) -> Result<()>;\n    fn scratchpad(&self, run_id: &str, key: &str) -> Result<Option<String>>;\n\n    fn put_summary(&self, s: &IterationSummary) -> Result<()>;\n    fn summaries(&self, run_id: &str) -> Result<Vec<IterationSummary>>;\n\n    fn put_skill_trial(&self, t: &SkillTrial) -> Result<u64>;\n    fn skill_trials(&self) -> Result<Vec<SkillTrial>>;\n\n    fn put_proposal(&self, p: &Proposal) -> Result<u64>;\n    fn proposals(&self, run_id: &str) -> Result<Vec<Proposal>>;\n\n    fn runs(&self) -> Result<Vec<String>>;\n    fn flush(&self) -> Result<()>;\n}\n```\n\n`Send + Sync` is required — nodes on the same iteration write concurrently.\n\nNote the two asymmetries in the signatures, both intentional: `skill_trials()` takes no `run_id` (global by design), and the append-style writes (`put_episode`, `append_ledger`, `put_skill_trial`, `put_proposal`) return the assigned sequence number while the keyed writes (`set_goal_state`, `save_checkpoint`, `put_summary`, `set_scratchpad`) return `()` because they overwrite.\n\n### Errors\n\n`MemError` has four variants and `Result<T>` is aliased to `std::result::Result<T, MemError>`:\n\n- `Backend(String)` — the sled layer failed; every `sled::Error` is stringified at the boundary so the trait's error type does not leak the engine.\n- `Serde(#[from] serde_json::Error)` — encode/decode failure, the only variant with a `From` impl.\n- `Rejected(String)` — validation refused the write. **Nothing was stored.**\n- `NotFound(String)` — reserved; the read methods return `Ok(None)` for a miss rather than erroring.\n\n## `SledStore` — the shipped backend\n\nKeys are prefixed and zero-padded to 20 digits so `scan_prefix` returns records in insertion order without a secondary index:\n\n```text\nep/<run>/<seq:020>      episode\ngs/<run>/<target>       goal state\nlg/<run>/<seq:020>      ledger entry\nck/<run>                checkpoint\nsp/<run>/<key>          scratchpad\nsu/<run>/<iter:020>     iteration summary\nst/<seq:020>            skill trial (global, deliberately not per run)\npr/<run>/<seq:020>      proposal\n```\n\nThree private helpers carry every operation: `next_seq()` wraps `db.generate_id()` (a monotonic counter shared across all keyspaces — only relative ordering matters, not density), `put(key, value)` inserts and maps the backend error, and `scan::<T>(prefix)` iterates a prefix and deserialises each value.\n\n```mermaid\ngraph LR\n    W[\"put_episode / append_ledger<br/>put_skill_trial / put_proposal\"] --> V[\"validate\"]\n    V -->|Rejected| E[\"MemError::Rejected\"]\n    V --> S[\"next_seq()\"]\n    S --> P[\"put(key, json)\"]\n    R[\"episodes / ledger<br/>summaries / proposals\"] --> SC[\"scan(prefix)\"]\n    P --> DB[(\"sled::Db\")]\n    SC --> DB\n```\n\nTwo behaviours are worth calling out:\n\n**`save_checkpoint` flushes synchronously.** A checkpoint is the resume contract, so it is made durable immediately rather than trusting sled's background flusher to beat a crash. It is the only write that does this; everything else relies on the background flusher or an explicit `flush()`.\n\n**`runs()` is derived from checkpoints.** It scans the `ck/` prefix and strips the prefix from each key, collecting into a `BTreeSet` for sorted, deduplicated output. A run with episodes but no checkpoint will not appear — checkpoint existence *is* the definition of a known run.\n\nThe scratchpad is the one keyspace storing raw bytes rather than JSON; `scratchpad()` reads them back through `String::from_utf8_lossy`, so non-UTF-8 input round-trips lossily rather than failing.\n\n## The direction that keeps the gate honest\n\n> A model must not be the thing that certifies its own completion.\n\n`goal_satisfied` is written by `loopsmith-gate` and by nothing else, and the gate can revoke — delete a required artifact and a satisfied goal flips back.\n\nThis is why `Checkpoint::verdicts_json` is a `String` rather than the gate's verdict type. `loopsmith-gate` depends on `loopsmith-memory`; if memory imported the verdict type, the arrow would reverse and the only constructor of a satisfied `GoalState` could no longer be kept inside the gate. Holding the verdicts as opaque text preserves the direction. A resumed run parses that text itself so its first summary can report deltas instead of claiming everything is new.\n\nKeep this in mind when extending the crate: **do not add a dependency on `loopsmith-gate`, `loopsmith-graph`, or `loopsmith-provider`.** If a new field needs a type from one of those crates, store it serialised.\n\n## How the rest of the workspace uses it\n\n```mermaid\ngraph TD\n    RUN[\"src/run/mod.rs::execute\"] -->|Episode, Checkpoint| MEM[(\"loopsmith-memory\")]\n    GATE[\"loopsmith-gate\"] -->|GoalState| MEM\n    LOG[\"loopsmith-cli/src/logging.rs::entry\"] -->|LedgerEntry| MEM\n    EVO[\"src/run/evolve.rs\"] -->|SkillTrial, Proposal| MEM\n    SUM[\"src/run/summary.rs\"] -->|IterationSummary| MEM\n    MEM --> MCP[\"loopsmith-mcp\"]\n    MEM --> CLI[\"src/cmd/skills.rs::scores\"]\n```\n\n- **`src/run/mod.rs::execute`** is the hub. Every traced execution flow in the run loop — `a_node_that_never_satisfies_its_goals_stops_being_dispatched`, `a_stalled_run_varies_its_approach_before_it_gives_up`, `a_judge_on_the_builders_provider_still_cannot_satisfy_the_gate`, `a_satisfiable_loop_stops_on_overall_success` — runs `execute` → `logging::entry` → `LedgerEntry`. The ledger is how those tests assert on behaviour, which makes it a real API surface, not just diagnostics.\n- **`src/run/evolve.rs`** writes trials via `record_trials`, reads them back through `score_skills` in `skill_proposals`, and writes the resulting `Proposal`s in `write`.\n- **`src/cmd/skills.rs::scores`** is the read-only path: `skill_trials()` → `score_skills` → ranked table.\n- **`src/run/summary.rs`** builds `IterationSummary` in both `deterministic` (facts from verdicts) and `carry_forward` (honouring the configured depth) paths.\n- **`loopsmith-mcp`** exposes the store read-side over a local stdio MCP server.\n\n## Testing\n\nTests use `loopsmith_util::testing::temp_path` (behind the `testing` feature, enabled as a dev-dependency) via the local `tmp(tag)` helper, which returns `(SledStore, PathBuf)` and leaves cleanup to the caller's `remove_dir_all`. `sample_episode(run, node)` in `lib.rs` is `#[cfg(test)] pub(crate)` and gives a valid episode to mutate into an invalid one.\n\nThe suite is organised around the invariants rather than the methods:\n\n| Test | Invariant |\n|---|---|\n| `episodes_round_trip_in_order` | zero-padded keys preserve insertion order |\n| `malformed_episodes_are_rejected_not_stored` | rejection means *nothing was written* |\n| `inconsistent_goal_state_is_rejected` | `passed + failed > total` cannot be stored |\n| `checkpoint_survives_reopen` | resume accounting survives a process boundary |\n| `skill_trials_accumulate_across_runs_and_rank_by_outcome` | global trial keyspace + ranking order |\n| `an_out_of_range_pass_rate_is_rejected` | `pass_rate` stays in `0.0..=1.0` |\n| `proposals_are_scoped_per_run` | proposal keyspace is per-run, unlike trials |\n| `scratchpad_carries_reasoning_between_iterations` | scratchpad round-trip, miss returns `None` |\n| `a_proposal_written_before_the_field_existed_still_deserialises` | forward-compatible deserialisation |\n\nWhen adding a validation rule, add the paired test that asserts the read-back is empty — \"rejected\" and \"rejected but stored anyway\" are indistinguishable from the return value alone.\n\n## Adding a new record type\n\n1. Define the struct in `lib.rs` with `Serialize`/`Deserialize`, `#[serde(default)]` on every new optional field (stores outlive binaries), and a `created_ms: u64` stamped from `now_ms()`.\n2. Add the write and read methods to `Store`. Return `Result<u64>` if append-ordered, `Result<()>` if keyed.\n3. Pick a two-letter key prefix not already in the table above. Zero-pad sequences to 20 digits. Decide per-run vs. global explicitly and document why in a comment — that decision was the whole point of `st/` versus `pr/`.\n4. Validate in the `SledStore` impl, returning `MemError::Rejected` with a message that names the offending field and value.\n5. Test both the round-trip and the rejection-writes-nothing case.\n\n## Packaging note\n\n`Cargo.toml` sets `include = [\"/src/**/*\", \"/README.md\"]`. Integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping them would hand a published crate tests that cannot pass. Test additions that reach outside `src/` will pass locally and fail for anyone building from crates.io.","other":"# Other\n\n# CLI integration tests (`runtime/crates/loopsmith-cli/tests/`)\n\nThis directory is the stress harness: four test binaries plus a shared fixture builder. Unit tests elsewhere in the workspace cover each piece of the runtime in isolation. Nothing else covers whether those pieces work *together*, under a real iteration loop, driven through the real binary, against the configs that ship in `config/examples/`.\n\n```sh\ncargo test -p loopsmith --test stress\ncargo test -p loopsmith --test surface\ncargo test -p loopsmith --test compat\ncargo test -p loopsmith --test opt_in     # skips everything gated by default\n```\n\n| File | Covers |\n|-
