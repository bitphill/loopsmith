.\n\n## How the rest of the tree uses this\n\n| Caller | Uses | For |\n|---|---|---|\n| `loopsmith-run/src/phases.rs` (`new`) | `waves` | building the phase schedule; a later phase stays shut until the earlier one closes |\n| `loopsmith-web/src/assemble.rs` (`plan_view`) | `unisolated_parallel_writers` | the clobber warning in the config review UI |\n| `src/cmd/plan.rs` (`execute`) | `unisolated_parallel_writers` | the same warning from the CLI |\n| `loopsmith-mcp` | the graph surface | exposing planning over stdio |\n\nThe phase-graph path is the clearest evidence that `DagNode` earns its keep: `phases::new` feeds `Phase` values straight into `waves` and gets the same cycle detection, the same unknown-dependency check, and the same deterministic ordering that `NodeSpec` gets.\n\nDependencies run one way only: this crate depends on `loopsmith-core` (for `GraphSpec`, `NodeSpec`, `Phase`, `Concurrency`, `Role`), `serde`, and `thiserror`. It knows nothing about the run engine, the gate, or providers.\n\n## Contributing notes\n\n- **Determinism is a requirement, not a nicety.** `BTreeMap`/`BTreeSet` and the explicit `names.sort()` inside `waves` are there so the same config always produces the same plan. A `HashMap` substituted for speed would silently break wave ordering.\n- **`weight` is relative, not a duration.** It exists for critical-path weighting. Node types with no meaningful cost return `1.0` — that is what `Phase` does.\n- **New node types need only `impl DagNode`.** Do not add a second traversal. If a new graph kind needs scheduling, give it the trait and it inherits cycle detection, waves, and critical path for free.\n- **Errors are values.** `waves` and `critical_path` return `GraphError`; nothing in this crate panics on bad config. The indexing inside `critical_path` (`by_id[id]`, `best[d.as_str()]`) is infallible only because `waves` already validated every dependency — preserve that ordering if you refactor.\n- **The Amdahl table is pinned by test.** Changing `amdahl` or `speedup_ceiling` means changing `amdahl_matches_the_published_table`, and those numbers appear in user-facing documentation.\n\n## Packaging\n\n`Cargo.toml` ships `src/` and `README.md` only. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping them would hand a published crate tests that cannot pass.","gating-success-criteria":"# Gating & Success Criteria\n\n# Gating & Success Criteria (`loopsmith-gate`)\n\nThe gate is the component that decides whether work is done. It is plain Rust with no model in the loop: every verdict comes from an exit code, a file's existence, a regex match, a numeric comparison, or an explicitly *independent* judgment. Its reason for existing is a single invariant:\n\n> A model must not be the thing that certifies its own completion.\n\n`GoalState { satisfied: true, .. }` is constructed in exactly one place in the workspace — `TargetVerdict::to_goal_state` in `runtime/crates/loopsmith-gate/src/lib.rs`. Nothing else in the codebase may build one.\n\n## The five responsibilities\n\nThe crate is one file, and it does five separable jobs. They share `run_detector` and nothing else.\n\n| Job | Entry point | Answers |\n|---|---|---|\n| Goal verification | `evaluate`, `evaluate_all` | Is this target satisfied by the evidence? |\n| Success criteria | `success_met`, `overall_success` | Do the declared success scenarios hold? |\n| Gate rules | `check_rules` | May the run enter / proceed / must it roll back? |\n| Proposal admission | `admit_proposal` | May this self-evolution proposal even be recorded? |\n| Regression gate | `compare_to_baseline` | Did this run hold the frozen baseline? |\n\n## Evidence: the whole input surface\n\n`Evidence` is a deliberately closed list of what the gate may look at. Anything absent from it cannot influence a verdict — most pointedly, the builder's own claim that it finished.\n\n```rust\nlet ev = Evidence::new(&workdir)\n    .with_metric(\"coverage\", 0.85)\n    .with_artifact(\"test-output\", &stdout)\n    .with_judgment(judgment);\n```\n\n- `artifacts: BTreeMap<String, String>` — named text blobs for `Detector::RegexMatch`.\n- `metrics: BTreeMap<String, f64>` — named numbers for `Detector::Threshold`.\n- `judgments: Vec<Judgment>` — model verdicts, matched to a validation by `Judgment::validation`.\n- `workdir: PathBuf` — the base directory for `Detector::Script` (`current_dir`) and `Detector::FileExists` (joined onto `path`).\n\nThe builder-style methods take `self` and return `Self`, so an `Evidence` is assembled in one expression and then read-only.\n\n## How a target is evaluated\n\n`evaluate(cfg, target, ev)` selects the validations in `cfg.safety.checks` whose `target` matches, runs each one's detector, and folds the results into a `TargetVerdict`.\n\n```mermaid\nflowchart TD\n    E[evaluate: target] --> S[select cfg.safety.checks<br/>where target matches]\n    S --> D[run_detector per validation]\n    D --> C[CheckResult: passed, blocking, evidence]\n    C --> Q{any blocking check?}\n    Q -->|no| U1[unsatisfied:<br/>nothing to satisfy]\n    Q -->|yes| B{blocking failures?}\n    B -->|none| SAT[satisfied]\n    B -->|some| U2[unsatisfied:<br/>names the failures]\n```\n\nThree decisions in that fold are worth knowing before you touch it:\n\n**Silence is not success.** A target with no blocking validation aimed at it is *never* satisfied. The reason string says so: `` no blocking validation targets `g1`; nothing to satisfy ``. This makes a typo'd `target:` field fail loudly instead of certifying an empty set.\n\n**Non-blocking checks are advisory only.** They contribute to `passed` / `failed` / `total` and to the report, but never to `satisfied`. A verdict can carry `failed: 1` and still be satisfied.\n\n**A detector that errors fails its check.** `run_detector` returning `Err` becomes `(false, \"detector error: …\")`, not a propagated error. \"Could not tell\" is not \"passed\" — a gate that waved a run through because its own tooling was missing would be worse than no gate. The `GateError` type still exists because the message matters for the report: `GateError::Detector` for a command that would not launch, `GateError::Regex { name, source }` so a bad pattern is reported under the validation it came from.\n\n`evaluate_all` maps over `cfg.intent.goals` and adds the `OVERALL` pseudo-target, producing the `BTreeMap<String, TargetVerdict>` that the run engine, exports, and summaries all consume.\n\n### Revocation\n\nNothing in `evaluate` reads prior state. It looks only at the evidence in front of it, so re-running it on fresh evidence can flip a satisfied target back:\n\n```rust\nlet before = evaluate(&cfg, \"g1\", &Evidence::new(&dir));  // report.md exists -> satisfied\nstd::fs::remove_file(&file).unwrap();\nlet after  = evaluate(&cfg, \"g1\", &Evidence::new(&dir));  // -> unsatisfied\n```\n\nKeep it that way. A gate that can only promote is a burndown chart with extra steps, and any caching or memoization added here would quietly reintroduce that.\n\n## The detectors\n\n`run_detector(cfg, name, detector, ev)` is the single dispatch point, returning `(bool, String)` — the verdict and a human-readable evidence line for the report. `name` is the validation's name or the gate rule's id; it is what a judgment is matched on and what a bad regex is blamed on.\n\n| `Detector` variant | Verdict | Fails closed when |\n|---|---|---|\n| `Script { command, args, expect_exit }` | exit code equals `expect_exit` (default `0`), run in `ev.workdir`; last stderr line is appended to the evidence | the process will not spawn → `GateError::Detector` |\n| `FileExists { path, non_empty }` | `ev.workdir.join(path)` has metadata, and non-zero length when `non_empty` | missing, or present-but-empty under `non_empty` |\n| `RegexMatch { artifact, pattern }` | the compiled pattern matches `ev.artifacts[artifact]` | artifact was not collected; invalid pattern → `GateError::Regex` |\n| `Threshold { metric, op, value }` | `op.apply(actual, value)` over `ev.metrics[metric]` | metric was not reported |\n| `Judge { standard, min_score }` | see below | no judgment recorded for `name` |\n\nEvery one of these fails on absent input. That is the load-bearing property of the whole table: a missing metric, an uncollected artifact, and an unrecorded judgment each read as *not satisfied*, never as *nothing to object to*.\n\n### The judge detector and independence\n\n`Judge` is the only detector whose input is a model's opinion, and it is the most constrained. A `Judgment` carries both `provider_id` (who judged) and `builder_provider_id` (who produced the work).\n\n1. Judgments are filtered to those whose `validation` equals `name`. None → fail, `` no judgment recorded for `name` ``.\n2. If `cfg.execution.providers.enforce_judge_independence` is on, *any* judgment where `provider_id == builder_provider_id` fails the check outright — the evidence line reads `a shared provider shares its blind spots`. This is a refusal, not a downgrade: a self-judgment does not get counted at reduced weight, it collapses the check.\n3. Otherwise the pool is narrowed to the independent judgments, falling back to all of them only when none are independent.\n4. With `min_score`, the pool's mean `score` must reach it; a pool with no scores at all fails. Without `min_score`, every judgment in the pool must have `passed: true`.\n\nIf you extend this, preserve step 2's position. Running independence *before* scoring is what stops a self-judgment from being averaged into a passing mean.\n\n## Success criteria\n\n`CheckResult`/`TargetVerdict` answer \"did the checks pass\". `SuccessScenario` answers the separate question of how much passing is enough.\n\n- `TargetVerdict::blocking_pass_rate()` — fraction of *blocking* checks that passed. It returns `0.0` when there are no blocking checks, consistent with the \"nothing to satisfy\" rule rather than vacuously perfect.\n- `success_met(s, verdict)` — for `Mode::Percentage`, `blocking_pass_rate() >= s.threshold` (defaulting to `1.0`); for `Mode::Objective` and `Mode::Subjective`, simply `verdict.satisfied`.\n- `overall_success(cfg, verdicts)` — all `cfg.intent.success` scenarios targeting `OVERALL` must be met. With no such scenario declared it falls back to the `OVERALL` verdict's own `satisfied`. This is what `loopsmith-run/src/stop.rs::should_stop` calls to decide the loop is finished.\n\n## Gate rules\n\nA gate rule is structurally the same thing as a validation — a statement plus a detector — so it is decided by the same compiled code and can no more be argued past. `check_rules(cfg, kind, ev)` filters `cfg.safety.gates.rules()` to one `GateKind` (`Entry`, `Approval`, `Rollback`) and maps each through `check_rule`, which is a thin wrapper over `run_detector`.\n\nThe difference from a validation is `RuleVerdict::on_fail: GateOutcome` — the rule carries its own consequence (e.g. `GateOutcome::Pause`), and the gate reports it rather than acting on it. `loopsmith-run/src/rules.rs::apply` is what turns that outcome into behavior.\n\nKinds do not leak: asking for `GateKind::Entry` when only `approval:` rules are configured returns an empty `Vec`, which callers must treat as \"no rules of this kind\", not \"all clear on entry\".\n\n## Proposal admission\n\n`admit_proposal(cfg, kind, patch)` is the gate on self-evolution: it decides whether a proposed config change may even be *written down*. It returns `Admission::Admitted` or `Admission::Refused(String)`, where the string is a ledger-ready sentence.\n\nTwo independent refusals, in order:\n\n1. **Kind.** If `cfg.evolution_enabled()` and `!cfg.evolution.allows(kind)`, refuse — `` `graph_change` is not in `evolution.allowed_kinds` ``.\n2. **Protected paths.** The patch is parsed as YAML, run through `loopsmith_core::config::legacy::migrate` so a 0.3-shaped fragment is judged as the 1.0 path it means, flattened by `leaf_paths` into dotted paths, and each path tested against `cfg.safety.protected.touches`. Any hit refuses.\n\nThe protected-path check runs **regardless of whether evolution is enabled**. A loop that can merely *suggest* loosening its own gates has already started arguing with them.\n\n`leaf_paths` treats a list, a scalar, and an *empty mapping* as leaves. The empty-mapping case is the one that matters: `safety: {}` is a leaf at path `safety`, so wholesale replacement of a protected parent is caught the same as writing to the child. A patch that is not parseable YAML is refused (`its patch is not readable YAML`) — nothing unreadable is admitted. `patch: None` skips the path check entirely and is admitted if the kind allows.\n\n```rust\n// all three are Refused\nadmit_proposal(&c, ProposalKind::ValidationChange, Some(\"stop_gates:\\n  max_iterations: 500\\n\"));\nadmit_proposal(&c, ProposalKind::GraphChange, Some(\"safety:\\n  gates: {}\\n\"));\nadmit_proposal(&c, ProposalKind::GraphChange, Some(\"safety: {}\\n\"));\n```\n\n## The regression gate\n\n`compare_to_baseline(cfg, measured)` maps `cfg.evolution.regressions(measured)` onto a four-state `BaselineVerdict`:\n\n- `Off` — evolution disabled; nothing is compared.\n- `NoBaseline` — evolution on, no baseline frozen. **This is not a pass.** It reports that the run cannot show an improvement, so proposals are recorded but not adoptable.\n- `Held` — within tolerance on every metric the baseline names.\n- `Regressed(Vec<String>)` — one line per regressed metric.\n\n`BaselineVerdict::describe()` renders a single ledger/terminal line, returning `None` for `Off` because there is then nothing to say. `src/cmd/mod.rs::report_outcome` is the caller that prints it.\n\nThe baseline lives under `safety.protected`, which closes the obvious loop: the run being judged cannot move the bar it is judged against.\n\n## How the rest of the workspace uses it\n\n```mermaid\nflowchart LR\n    RUN[loopsmith-run] --> EVAL[evaluate / evaluate_all]\n    RUN --> RULES[check_rules]\n    RUN --> ADMIT[admit_proposal]\n    RUN --> BASE[compare_to_baseline]\n    CLI[loopsmith CLI] --> EVAL\n    MCP[loopsmith-mcp] --> EVAL\n    EVAL --> GS[to_goal_state → GoalState]\n    GS --> MEM[loopsmith-memory]\n```\n\n| Caller | Uses |\n|---|---|\n| `loopsmith-run/src/running.rs::rule` | `evaluate_all` each iteration |\n| `loopsmith-run/src/stop.rs::should_stop` | `overall_success` to end the loop |\n| `loopsmith-run/src/rules.rs::apply` | `check_rules`, then acts on `on_fail` |\n| `loopsmith-run/src/evolve.rs::write` | `admit_proposal` before recording a proposal |\n| `loopsmith-run/src/closing.rs::judge_against_baseline` | `compare_to_baseline` |\n| `loopsmith-run/src/judgment.rs::parse` | constructs `Judgment` from model output |\n| `loopsmith-run/src/{metrics,phases,summary,export}.rs` | read `TargetVerdict` / `CheckResult` |\n| `src/cmd/gate.rs::execute` | `evaluate` for the one-shot `gate` subcommand |\n| `loopsmith-mcp/src/lib.rs::tool_gate` | `evaluate` exposed over stdio MCP |\n\nUpstream, the crate depends on `loopsmith-core` for the config model (`LoopConfig`, `Detector`, `Validation`, `GateRule`, `GateKind`, `GateOutcome`, `SuccessScenario`, `Mode`, `Baseline`, `ProposalKind`, `CompareOp`, `OVERALL`) and on `loopsmith-memory` for `GoalState` and `now_ms`. It has no async runtime, no network, and no provider access — a detector's process is spawned with `std::process::Command`.\n\n## Serialization\n\n`CheckResult` uses the field names `text` / `passed` / `evidence` on purpose: they mirror the grading schema the existing eval viewer reads, so gate reports are consumable by tooling that predates this crate. `Judgment`, `CheckResult`, `TargetVerdict`, and `RuleVerdict` all derive `Serialize`/`Deserialize`; `Judgment`'s `score`, `standard`, and `evidence` are `#[serde(default)]`, so a minimal judgment from a model deserializes.\n\n`Evidence` is deliberately *not* serializable — it is assembled per-evaluation from live filesystem and run state.\n\n## Contributing here\n\nThe tests in `src/lib.rs` are the specification, and each name states a property rather than a mechanism: `a_target_with_no_blocking_validation_is_never_satisfied`, `a_missing_metric_fails_rather_than_passes_by_default`, `judge_on_the_builders_provider_is_refused`, `the_gate_can_take_done_back`, `a_rule_whose_detector_cannot_run_does_not_pass`, `only_the_gate_builds_a_satisfied_goal_state`. Treat them as the contract; adding a detector means adding the corresponding fails-closed test.\n\nThree rules for changes in this crate:\n\n1. **New detectors fail closed.** Missing input, unparseable input, and un-runnable tooling all produce `(false, …)` with an evidence line that says which of those it was.\n2. **`to_goal_state` stays the only constructor of a satisfied `GoalState`.** If another crate needs one, it needs a `TargetVerdict` first.\n3. **`evaluate` stays stateless.** No history, no cache, no memory of a previous pass — that is what makes revocation work.\n\nNote that `Cargo.toml` restricts `include` to `/src/**/*` and the README: the integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which a crate tarball cannot carry, so they are excluded rather than shipped broken.","loop-configuration-schema":"# Loop Configuration Schema\n\n# Loop Configuration Schema\n\nThe config model that every other loopsmith crate reads. It lives in `loopsmith-core` (`runtime/crates/loopsmith-core/`), is expressed as Rust types under `src/config/`, and is published as a generated JSON Schema at `config/loop.schema.json`.\n\nA loop config answers four questions, and the top-level shape mirrors them:\n\n| Bundle | Question |\n|---|---|\n| `intent` | What is this loop for, and how would we know it worked? |\n| `execution` | How does the work get done? |\n| `safety` | What must not happen, and when does this stop? |\n| `evolution` | How is this allowed to change itself? |\n\nAround those four sit five scalar/flag keys: `name` (the only required field in the whole document), `version`, `description`, `environment`, and `features`.\n\nBefore 1.0 these were fourteen flat keys, ten of them known by a letter (A–J: information, pre-execution, goals, validations, success, stop gates, schedules, constraints, execution guidelines, default skills). Every one of those spellings still loads — see [Legacy migration](#legacy-migration).\n\n---\n\n## Loading a config\n\n`lib.rs` is the whole public entry surface:\n\n```rust\npub fn load(path: impl AsRef<Path>) -> Result<LoopConfig, CoreError>\npub fn load_validated(path: impl AsRef<Path>) -> Result<LoopConfig, CoreError>\npub fn parse_str(text: &str, origin: &str) -> Result<LoopConfig, CoreError>\npub fn parse_str_reporting(text: &str, origin: &str)\n    -> Result<(LoopConfig, Vec<config::legacy::Moved>), CoreError>\npub fn is_markdown(path: &Path) -> bool\npub fn json_schema() -> serde_json::Value\n```\n\n`load` dispatches on extension: `.md`/`.markdown` goes to `md::parse_md`, because a Markdown config is a *different grammar*, not a different serialization — guessing would mean reporting a YAML parse error for a document that was never YAML. Everything else falls through to `parse_str`.\n\n```mermaid\nflowchart TD\n    A[\"load(path)\"] -->|\".md\"| B[\"md::parse_md\"]\n    A -->|\"else\"| C[\"parse_str_reporting\"]\n    C --> D[\"serde_yaml → untyped Value<br/>(JSON fallback)\"]\n    D --> E[\"type_document\"]\n    E --> F[\"legacy::migrate<br/>→ Vec&lt;Moved&gt;\"]\n    F --> G[\"serde_yaml::from_value::&lt;LoopConfig&gt;\"]\n    B --> H[\"LoopConfig\"]\n    G --> H\n    H --> I[\"validate → ValidationReport\"]\n```\n\nTwo details in `parse_str_reporting` are load-bearing:\n\n1. **Both formats are read into an untyped `serde_yaml::Value` first**, so the same relocation runs for each. Typing directly and only falling back on failure would mean a file mixing old and new keys parses as whichever half the model happened to accept.\n2. **Both error strings survive to the caller.** `CoreError::Parse` carries `yaml` and `json` messages side by side, so a mis-indented YAML file does not get reported as bad JSON.\n\n`load_validated` is `load` plus `validate`, treating any `Severity::Error` issue as fatal and rendering the whole report into `CoreError::Invalid`. `src/cmd/run.rs` and `src/cmd/watch.rs` use it; the read-only commands (`plan`, `convert`, `doctor`, `permissions`, `providers`, `gate`, `prune`, `schedule`, `skills`) use plain `load` so they can still operate on a config that does not yet pass.\n\n### Strictness\n\nNearly every definition in the schema carries `\"additionalProperties\": false`, which maps to serde's `deny_unknown_fields`. A misspelled nested field is refused, not silently dropped — there is a test named exactly that (`a_misspelled_nested_field_is_refused_not_ignored` in `src/config/mod.rs`). This is why `TriggerSpec` nests its trigger under `on:` rather than flattening it: serde refuses `deny_unknown_fields` on any struct with a flattened field, and losing the guard there would mean a misspelled `idempotency_kye` leaves a trigger with no dedup and no warning.\n\n### The schema file\n\n`config/loop.schema.json` is `json_schema()` written out — `schemars::schema_for!(LoopConfig)`. It is generated, not hand-maintained, and CI regenerates it and fails if the committed copy differs. The previous hand-written schema had already drifted: `max_revisions_per_node` was declared there, defaulted in Rust, documented twice, and read by no runtime code at all.\n\n> **Reading generated defaults carefully.** Two defaults can appear for one field: the per-field default (what you get when the key is omitted from a block that *is* present) and the default rendered for the parent struct. `execution.providers.enforce_judge_independence` shows `true` as its own default but `false` inside the rendered `Execution` default. If judge independence matters to a loop, set it explicitly rather than relying on either.\n\n---\n\n## `intent` — what the loop is for\n\nThe bundle a human writes first and reads most. Nothing in it describes machinery.\n\n- **`background: [InfoItem]`** — static `key`/`value` facts every node receives. Formerly section A, `information`. It is deliberately *not* called `context`: 0.3 used that word for the memory policy, and a Markdown config headed `## Context` would then mean one thing in an old file and another in a new one, with no way for the parser to tell which.\n- **`prerequisites: [WorkItem]`** — manual work (`step`, `done`, `evidence`) that must be finished before automation may start. This is the one section that makes a fresh config refuse to run.\n- **`goals: [Goal]`** — `name`, `description`, `depends_on`, optional `priority`.\n- **`success: [SuccessScenario]`** — `name`, `statement`, `target` (a goal name or the reserved `overall`), `mode`, optional `threshold`.\n\n`Mode` is `subjective | objective | percentage`. In `percentage` mode, `threshold` is the fraction of blocking validations that must pass and is required; it is ignored otherwise.\n\n---\n\n## `execution` — how the work gets done\n\n### `graph: GraphSpec`\n\n`nodes: [NodeSpec]`, plus `concurrency`, `join`, and a loop-wide `container_image`.\n\nA `NodeSpec` requires `id`, `instruction`, and `role`. `Role` is `builder | judge | manager | adversary | researcher` — a judge \"must not be the same provider instance as the builder it judges\". Optional fields: `depends_on` (only list an edge if this step genuinely reads that step's output), `goals`, `skills`, `stage`, `provider`, `tier`, `isolation`, `weight` (relative cost weight for critical-path calculation).\n\n`Isolation` is a three-rung ladder, and the cost is not linear:\n\n| Mode | What it buys | Cost |\n|---|---|---|\n| `none` | nothing — runs in the loop directory | free; correct for a single writer or a read-only node |\n| `worktree` | own git worktree, published back on success | nearly free; **required for parallel writers** |\n| `container` | filesystem + network separation over its own worktree | a Docker daemon and an image pull |\n\n`container` **degrades rather than fails**: with no Docker present the node runs under `worktree` and the run records a warning. The same loop directory gets checked out on laptops, CI runners and servers, and refusing to start on the ones without Docker would make container isolation unusable rather than merely unavailable. `network` defaults to `false`.\n\n`Concurrency` is `sequential`, `fixed { max_parallel }`, or `auto { cap = 16, min_marginal_gain = 0.05 }` — derived from the graph's widest wave, capped, and trimmed to where marginal Amdahl speedup still beats marginal cost. `Join` decides when a wave is finished: `wait_for_all` (default), `quorum { count }`, or `first_success`.\n\n### `providers: ProviderRouting`\n\n**Every provider is a command template.** `ProviderSpec` requires `id`, `kind`, `command`; `{prompt}`, `{system}`, `{model}` and `{tier}` are substituted before spawn, or the prompt goes on stdin with `prompt_on_stdin`. This keeps BYOK support out of the Rust build entirely — anything invocable from a shell is routable.\n\n`ProviderKind` covers `claude_code | ollama | grok_cli | grok_build | hermes | openai | gemini`, plus `byok` (any OpenAI-compatible or bespoke command) and `mcp` (stdio). Aliases resolve, so a config writing `openai` is not rejected in favour of `open_ai` (`provider_kind_aliases_still_resolve`).\n\n`requires_env` names variables checked for **presence only** — values are never read, so keys stay out of the ledger. `usage_regex` pulls a token count out of the provider's own output with one capture group; without it, usage is estimated from character count, which is enough to make a budget ceiling real but is not exact. `cascade` is an ordered fallback chain per `Tier` (`cheap | standard | strong`); first reachable provider wins.\n\n### `skills: SkillPolicy` and `default_skills: [DefaultSkill]`\n\n`default_skills` are sub-agents installed before the loop starts (formerly section J), each with a `name`, a `source` (`marketplace | github | local`), an optional `url`, an `init_command`, a `trust_level`, and a `checksum` — \"what turns *we fetched the thing we meant to* from a hope into a check\".\n\n`TrustLevel` is the real supply-chain control: `untrusted` (the default for anything newly fetched) → `reviewed` (a human read what it does) → `approved` (cleared for effects that leave the loop directory). Before it existed, `min_marketplace_stars` was the only thing between a loop and arbitrary third-party code, and stars measure popularity, not intent.\n\n`SkillPolicy` defaults to `min_trust_level: reviewed`, which means a freshly fetched skill is acquired into `quarantine_dir` (`generated-skills`) but **not dispatched to** — the loop can find a sub-agent on its own, a human decides whether it runs. There is a test for exactly this: `a_freshly_fetched_skill_is_not_dispatched_to_by_default`. `acquisition_order` defaults to `installed → marketplace → generate`. `explore` (off by default — exploration spends real money) trials `explore_candidates` for `min_trials` runs each. `require_checksum` is off by default because it makes discovery impossible, and is the expected setting in `prod`.\n\n### `memory: MemoryPolicy`\n\nCarry-forward within a run: `carry_summaries` (default 2 — enough to see what a node just tried and what it tried before, without the prompt growing with the run; `0` disables), `max_summary_chars` (1200), `max_retrieved` (10). `summary_provider` is opt-in: omit it and summaries are still written, you just lose the prose half, which costs tokens every iteration.\n\nAcross runs, four `Namespaces`, each a `NamespacePolicy` with `enabled`, `min_confidence`, `require_provenance`, `retention_days`, and a `Promotion` rule:\n\n| Namespace | Promotion | Why |\n|---|---|---|\n| `episodic` | `never` | an episode is evidence for a belief, not a belief |\n| `failure` | `automatic` | having hit a wall is self-evidencing |\n| `procedural` | `repeated_validation { times: 3 }` | reusable methods need corroboration |\n| `semantic` | `repeated_validation { times: 3 }` | same, for domain facts |\n\n(`human_approval` is the fourth `Promotion` rule, available but not a default anywhere.) Splitting the namespaces is what makes differing retention defensible — one policy across all four either throws away what the loop learned or keeps every transcript forever.\n\n### `phases: ExecutionGuidelines`\n\nNamed `items: [Guideline]`, each a standing instruction injected into the prompt of every node declaring `stage: <name>`, plus `dependency` — ordering written as arrow chains, `\"a -> b\"` or `\"a -> b -> c\"`. Anything not named in an arrow has no predecessor and starts immediately, so two guidelines with no arrow between them run in parallel. Sequencing is something you ask for.\n\n### `triggers: TriggerPolicy`\n\n`Trigger` is `cron { expr }`, `interval { seconds }`, `file_change { path }`, `goal_satisfied { goal }`, or `manual`, wrapped in a `TriggerSpec { on, enabled, idempotency_key }`. Two guards make firing safe: `dedup_window_seconds` (300) collapses two firings sharing an idempotency key, and `max_depth` (5) bounds trigger-started-by-trigger chains — depth 0 is a run a human started. Without the cap a self-reachable trigger has no bound at all. Set `idempotency_key` explicitly when the payload is noisier than the event: six files landing in a watched directory together is one event, not six.\n\n---\n\n## `safety` — what must not happen\n\nEverything here is enforced by compiled code rather than asked of a model, and every part of it is a `Protected` component by default.\n\n### `checks: [Validation]`\n\nHow each goal is checked (formerly section D). Named `checks` rather than `validations` because the old name read as a synonym for `success`, and authors routinely put success criteria here and detectors there. A `Validation` carries `name`, `statement`, `target`, `mode`, `blocking` (default `true`), and a `Detector`.\n\n`Detector` is ordered by an independence ladder — `judge` is rung 3, everything else rung 4:\n\n| Detector | Passes when |\n|---|---|\n| `script { command, args, expect_exit }` | exit code 0 (or `expect_exit`). The strongest available. |\n| `file_exists { path, non_empty }` | the path exists, optionally non-empty |\n| `regex_match { artifact, pattern }` | the pattern matches the named artifact |\n| `threshold { metric, op, value }` | the number compares as `CompareOp` says (`gt/gte/lt/lte/eq`) |\n| `judge { standard, min_score }` | a model verdict against a **named** external standard |\n\n`judge` requires a judge whose provider differs from the builder's, otherwise the gate refuses it as non-independent. Naming a standard is what turns an opinion into a check.\n\n### `gates: Gates`\n\nFour checkpoints. `entry` runs once before the first iteration (a failing entry gate means the run never starts — the cheapest possible failure); `approval` and `rollback` run after each iteration. Each is a `GateRule { id, statement, detector, on_fail }`, where `GateOutcome` is `stop | escalate | pause | rollback | warn` (`warn` is the only non-blocking one). The `statement` is shown verbatim when a gate blocks, so it is the whole explanation a stopped operator gets — write it for them.\n\n`gates.stop: StopGates` is the old section F entire:\n\n| Field | Default | Note |\n|---|---|---|\n| `max_iterations` | 10 | hard ceiling |\n| `max_revisions_per_node` | 3 | one stuck node cannot burn the whole iteration budget |\n| `no_progress_iterations` | 3 | jidoka: stop the line rather than spin |\n| `no_progress_iterations_randomness` | unset | perturb *before* giving up; must be **strictly less** than `no_progress_iterations` |\n| `stop_on_overall_success` | true | |\n| `max_tokens` / `max_cost_usd` / `max_wall_clock_seconds` | unset | |\n\n### `limits: Constraints`\n\nA `global: ConstraintSet` applied to every node, plus `per_node` keyed by node id. A `ConstraintSet` holds `rules` (literal text injected into the node prompt), `forbidden_paths`, `forbidden_commands`, `max_seconds`, `max_tokens`, and `human_checkpoint` — actions that require a human before proceeding. Bezos Type 1: irreversible decisions do not get made at machine speed.\n\n### `recovery: Recovery`\n\nA failure-class → action map. The defaults: retry the world, revise the output, escalate a pattern, never negotiate with a safety violation.\n\n| Failure class | Default action |\n|---|---|\n| `transient_error` | `retry` — exponential backoff, base 2s, 3 attempts total |\n| `invalid_output` | `revise` — 2 attempts, told what was wrong last time |\n| `tool_unavailable` | `fallback` — next provider in the tier cascade |\n| `repeated_failure` | `escalate` |\n| `resource_exhaustion` | `pause` (resumable) |\n| `corrupted_state` | `restore_checkpoint` |\n| `safety_violation` | `stop` |\n\n`retry` re-dispatches unchanged (failures about the world); `revise` re-dispatches with feedback (failures about the output). `Backoff` is `fixed | linear | exponential`.\n\n### `protected: Protected` and `alerts: [Alert]`\n\n`Protected.components` defaults to every named `ProtectedComponent`: `gates`, `limits`, `recovery`, `protected` (always protected, regardless), `approvals`, `credentials`, `audit`, `baselines`, `retention`, `environment`. `extra_paths` takes dotted config paths for anything the enum does not anticipate. The reasoning on `baselines` is the sharpest: a loop that can move its own baseline can declare any change an improvement.\n\n`Alert { id, metric, above, below, message }` fires on a `Metric` the engine keeps for every run — `iterations`, `tokens_used`, `cost_usd`, `wall_clock_seconds`, `failed_dispatches`, `retries`, `stale_iterations`, `validation_pass_rate` — and gets a human's attention without stopping anything.\n\n---\n\n## `evolution` — how the loop changes itself\n\nOff by default (`enabled: false`), and gated twice: `features.self_evolution` says whether this class of thing is allowed at all, `evolution.enabled` says whether it happens on this run.\n\n`allowed_kinds` defaults to `new_skill`, `skill_update`, `prompt_change`, `validation_change` — a subset of `ProposalKind`, which also defines `graph_change`, `provider_routing`, and `success_criteria`. Opt into those deliberately. The enum is closed and deliberately contains nothing under `safety`: a proposal that wants to relax a limit is not a proposal, it is a request for a human to edit the config.\n\n`baseline: Baseline` is the frozen set of numbers a proposal is measured against — `cost_usd`, `latency_seconds`, `iterations_to_success`, `completion_rate`, `validation_pass_rate`, `measured_at`. Every field is optional, and **a metric left unset is not compared, which is different from being compared against zero.** Without a baseline, no proposal can be adopted, only recorded.\n\n`max_regression` defaults to `0.02` — nonzero on purpose. A change that trades a hair of accuracy for half the cost is usually right, and a zero-tolerance gate refuses every such trade while admitting any change that touches nothing measured.\n\n`require_approval` and `require_sandbox` default on; `keep_rollback` keeps the previous known-good configuration so an adoption can be undone.\n\n---\n\n## `environment` and `features`\n\n`environment` is `dev | staging | prod`, \"read before anything else, because it decides how strictly the rest is enforced.\" `prod` is not a label: the gate refuses an unreviewed marketplace skill and an unapproved evolution proposal outright there, where `dev` only warns. Authors develop against the looser setting and get told what *would* have been refused, instead of discovering it on the run that mattered. Turning off `features.human_approval` or `evolution.require_approval` is refused outright in `prod`.\n\n`features` is five coarse switches, each defaulting to the conservative answer:\n\n| Flag | Default |\n|---|---|\n| `human_approval` | `true` |\n| `parallel_execution` | `true` |\n| `external_side_effects` | `false` |\n| `marketplace_skills` | `false` (this is the supply-chain surface) |\n| `self_evolution` | `false` |\n\nThe coarseness is the point: a flag answers \"is this class of thing allowed at all\", the bundle that owns the capability answers \"under what conditions\". An operator can disable a whole capability without reading, or trusting, the policy that configures it. Turning `parallel_execution` off forces strict sequential execution — the first thing to try when debugging a run that behaves differently under load.\n\n---\n\n## Validation\n\n`validate(&LoopConfig) -> ValidationReport`, in `src/validate.rs`. A report is a `Vec<Issue>`, each an `Issue { severity, field, message }` where `field` is a dotted path into the config (`safety.checks[2].detector.artifact`). `has_errors()`, `errors()`, `warnings()` and `render()` are the accessors; there is a test asserting `every_issue_names_a_path_the_config_has`.\n\n`validate` does two inline checks (`name` non-empty, at least one goal) and then fans out:\n\n`check_goals` · `check_pre_execution` · `check_validations` · `check_success` · `check_stop_gates` · `check_execution_guidelines` · `check_graph` · `check_providers` · `check_gate_rules` · `check_recovery` · `check_alerts` · `check_containers`\n\n### The rules worth knowing\n\n**Prerequisites gate the whole config.** `check_pre_execution` emits an *error* for any `intent.prerequisites` entry with `done: false`: *\"Automating before understanding produces fast, confident garbage.\"* An empty list is a warning, not an error — the corpus rule is to do the task manually first, because the manual runs are the spec.\n\n**Every goal needs at least one blocking validation.** `check_validations` counts blocking checks per target and errors on any goal with zero: *\"it could never be honestly satisfied.\"* This is the single most common way loops fail, so the config is rejected rather than run. A missing `overall` check is a warning only — the loop can still finish per-goal.\n\n**`overall` is reserved.** A goal named `overall` is an error; it is the whole-loop target for `Validation.target` and `SuccessScenario.target`.\n\n**A `regex_match` must name a real artifact.** `available_artifacts` collects the files this config's own `file_exists` detectors name, registering each under both its full path and its stem. A regex naming anything else has nothing to match and fails closed for the life of the loop — which reads as \"the work is not done\" rather than \"this check was never wired up\". The error message lists what *is* available.\n\n**Objective mode with a model judge is warned about** — prefer a script detector so the verdict is not a model's opinion.\n\n**Perturbation must fire before the halt.** `no_progress_iterations_randomness` must be ≥ 1 and strictly less than `no_progress_iterations`; at or past the halt point it never fires. Zero budget ceilings of any kind is a warning: *\"an unsolvable task will bill until someone notices.\"*\n\n**Gate rule ids must be unique within a list** (`a_rule_id_used_twice_is_refused`) — the ledger could not tell them apart. And an `entry` or `approval` rule with `on_fail: rollback` is warned about: it runs before anything has been done, so there is nothing to roll back (`an_entry_rule_cannot_roll_back_what_has_not_run`).\n\n**Phase graphs are scheduled at validation time.** `check_execution_guidelines` resolves the arrow chains via `ExecutionGuidelines::edges()`, rejects arrows naming guidelines that do not exist and self-arrows, and detects cycles by trying to schedule (`an_execution_guideline_cycle_is_refused`). It also errors on any node whose `stage` names a phase that does not exist — that node would never be dispatched. A dependency list with an empty `items` is an error on its own.\n\n**Parallel-writer detection is shape-aware.** `check_graph` warns about concurrent writers but not about chained builders (`chained_builders_are_not_reported_as_parallel_writers`), and `sequential` concurrency silences it entirely.\n\n**A sealed container in front of a hosted model is warned about** — `check_containers` catches a node with no network isolation pointed at a provider that needs it.\n\n### Why cycle detection is duplicated\n\n`topo_order` in `validate.rs` is Kahn's algorithm over phase names. `loopsmith-graph` owns the real scheduler, but **`loopsmith-core` cannot depend on it** — the dependency runs the other way — so validation carries its own copy. The `DagNode` trait is what keeps the two from drifting in shape.\n\n---\n\n## Legacy migration\n\n`config::legacy::migrate(&serde_yaml::Value) -> (Value, Vec<Moved>)` runs on the untyped document before typing. It relocates 0.3 top-level keys into their 1.0 bundles (`insert_path`, `at_mut`), and `repair_nodes`/`migrate_node` fixes node-level spellings — `isolated: true` still parses and still means `Isolation::Worktree`. Bare 0.3 triggers get wrapped in `on:`, which costs one line and keeps `deny_unknown_fields` everywhere.\n\n`Moved` records each relocation. `parse_str` discards the list; `parse_str_reporting` returns it, and the callers that have somewhere to put a deprecation notice use that: the CLI, the wizard, `src/cmd/migrate.rs`, and the browser UI (`loopsmith-web`'s `start_job` → `render` → `assemble::parse_value` → `parse_str`). The list is empty for a file already in the 1.0 shape.\n\n---\n\n## Where this sits in the workspace\n\n`loopsmith-core` depends only on `loopsmith-util`. Everything else depends on it:\n\n```\nloopsmith  (CLI: arguments, dispatch, scaffolding)\n├── loopsmith-web ─────── loopsmith-wizard ──┐\n├── loopsmith-run ──┬──── loopsmith-gate ────┤\n│   (the engine)    ├──── loopsmith-skills ──┤\n│                   ├──── loopsmith-provider ┼── loopsmith-core ── loopsmith-util\n│                   ├──── loopsmith-graph ───┤      (config)        (primitives)\n│                   └──── loopsmith-memory ──┘\n└── loopsmith-mcp  (gate, memory, and graph over stdio)\n```\n\nConsumers to know about when changing the model:\n\n- **`loopsmith-cli/src/scaffold.rs::starter_config`** constructs a `LoopConfig` by hand — `Gates`, `StopGates`, `GraphSpec`, `TriggerPolicy`, `ProviderRouting`, `SkillPolicy`, `ConstraintSet`, `frozen_git_rules`. A new required field breaks scaffolding first.\n- **`src/cmd/*`** — `run`/`watch` via `load_validated`, everything else via `load`; `migrate`, `convert` and `new` also call `is_markdown` to pick a writer.\n- **`loopsmith-web` / `loopsmith-cli/src/guided.rs`** call `parse_str` on assembled text rather than reading a file.\n- **`loopsmith-run/src/export.rs`** round-trips a config through `parse_str` when exporting a run.\n\n### Packaging\n\n`Cargo.toml` sets `include = [\"/src/**/*\", \"/README.md\"]` deliberately. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping them would hand a published crate tests that cannot pass.\n\n---\n\n## The rule the whole model exists to enforce\n\n> A model must not be the thing that certifies its own completion.\n\n`goal_satisfied` is written by `loopsmith-gate` and by nothing else, and the gate can **revoke**: delete a required artifact and a satisfied goal flips back. Everything in this schema — `Detector`, `blocking`, judge independence, `Protected`, `Baseline` — exists so that the gate has something deterministic to decide with. A field that lets a model widen its own success criteria is a bug in the model, not a feature of the config.","loop-execution-engine":"# Loop Execution Engine\n\n# Loop Execution Engine — `loopsmith-run`\n\nEverything that happens between \"start this loop\" and \"here is why it stopped\". The crate owns the run lifecycle, the iteration loop, node dispatch (including isolation and recovery), the stop-gate ladder, iteration compression, and the success export.\n\nIt does **not** own the verdict. The engine collects evidence and hands it to `loopsmith-gate`; nothing in this crate can mark a goal satisfied. That split is the load-bearing design decision, and most of the structure below exists to keep it true.\n\nCrate root: `runtime/crates/loopsmith-run/src/lib.rs`.\n\n---\n\n## Entry point\n\n```rust\npub fn execute<S: Store>(\n    cfg: &LoopConfig,\n    store: &S,\n    opts: &RunOptions,\n) -> Result<RunOutcome, String>\n```\n\n`execute` (`lib.rs:122`) is the whole public surface for running a loop. The CLI calls it from two places — `loopsmith run` (`loopsmith-cli/src/cmd/run.rs:37`) and the trigger watcher (`cmd/watch.rs:110`) — with the same options struct; `resume` is the same call with `resume: true`.\n\n`RunOptions` carries the run id, the loop root (`workdir`), and four behavioural flags. Two are worth knowing about:\n\n- `dry_run` — plan and report, invoke no provider. Skill installation is skipped too: \"invoke no provider\" should not mean \"install software anyway\" (`planning.rs:48`).\n- `answer_escalations` — deliberately separate from `resume`. A scheduler resumes a run on a cadence; if a resume also cleared every open escalation and refunded every stuck node's revision budget, a loop that pauses on a schedule could retry a broken node forever (`lib.rs:83`, `validating.rs:25`).\n\n`RunOutcome` reports the closing `RunState`, the `StopReason`, the gate's final verdicts, spend, the log and export paths, `RunMetrics`, raised alerts, and the `BaselineVerdict`. An `Err` means a config the engine could not start at all — an unschedulable graph, an unresolvable phase chain — and that run is still written to the ledger as having moved to `Failed`, so the record and the return value agree.\n\n---\n\n## The lifecycle\n\n`state.rs` owns the run's state and is the only place a transition is legal. `RunState::successors` *is* the state machine — one table, thirteen states.\n\n```mermaid\nstateDiagram-v2\n    [*] --> Validating\n    Validating --> Planning\n    Planning --> AwaitingApproval\n    Planning --> Running\n    AwaitingApproval --> Running\n    Running --> Retrying\n    Retrying --> Running\n    Running --> Outcome : succeeded / paused / blocked / escalated / rolled_back / failed\n    Outcome --> Closed\n    Closed --> Validating : resume\n```\n\nThe property worth having: a run cannot be recorded as `Succeeded` from `Planning`, because the only road to `Succeeded` runs through `Running`, which runs through the gate. `state.rs` tests that directly (`success_is_unreachable_without_running`).\n\nEvery state module takes `&mut context::Run` and nothing else, so \"what can this state touch\" has one answer. `Run::enter` advances the lifecycle, writes the transition to the ledger and the run log together, and persists the checkpoint only when entering a state the engine spends time or money in — `Running`, `Retrying`, `AwaitingApproval`, `Closed`. The states in between are passed through in milliseconds, and every save is an fsync (`context.rs:92`).\n\n`Lifecycle::resume` distinguishes three cases from a stored checkpoint: a run that closed normally, a pre-1.0 checkpoint with no state (every such run was closed — the old engine had no other way to stop), and a checkpoint whose last state was `Running` or similar, which means the process died mid-run. The third is reported and the resume still goes through validation, because the config may have been edited while the run was stopped.\n\n---\n\n## The four states, in order\n\n### `Validating` — may this run start at all?\n\n`validating.rs`. The config was already validated by the loader; what is checked here is the *world*. `safety.gates.entry` rules are evaluated against evidence on disk before a single token is spent: a missing brief, a lockfile another run holds, a metric that says the target system is down.\n\nThis is also where answering escalations happens, before `Progress::from_checkpoint` reads the counters — built before, the revision counts would be stale (`lib.rs:131`).\n\n### `Planning` — schedule the graph, resolve the phases\n\n`planning.rs` calls `loopsmith_graph::plan` for the wave decomposition and builds `phases::Phases`. Both resolve before anything is dispatched, because finding an unschedulable graph after the first provider call means paying for the discovery.\n\n`phases.rs` is Section I of the config at runtime. A phase is **active** when every phase it depends on is complete, and **complete** when its own nodes have all run *and* every goal they advance is satisfied. Completion is read off the gate's verdicts (`Phases::refresh`), never off a node's report. A phase with no nodes is complete on sight, so adding an unstaffed phase never blocks the one behind it. Nodes with no `stage` are never gated — otherwise adding `execution.phases` would be a breaking change for every config that does not use it.\n\nThen `planning::approve`: if `safety.gates.approval` has rules and `features.human_approval` is on, the run enters `AwaitingApproval` and the rules are checked. An approval rule is a detector like any other, which is what lets a human approve without loopsmith growing a UI: the rule names an artifact — `APPROVED`, a signed-off ticket, a green deploy check — and the run proceeds once it is there.\n\n### `Running` — the iteration loop\n\n`running::iterate` is one `loop`, and every iteration is the same sequence:\n\n```mermaid\nflowchart LR\n    P[prepare<br/>scratch · carried · stall?] --> D[waves::dispatch]\n    D --> R[rule<br/>judgments → gate]\n    R --> B[rollback rules]\n    B --> C[compress<br/>summary + metrics]\n    C --> V[spend revisions]\n    V --> S[decide<br/>should_stop]\n    S -->|continue| P\n```\n\n- **`prepare`** (`running.rs:371`) gathers what every node in the iteration is shown: per-goal scratchpad notes (read once, so no worker thread touches the store mid-dispatch), the carried summaries, promoted cross-run memory via `remembering::recall`, and — if `stop.no_progress_iterations_randomness` has been crossed — a `perturb::Perturbation`.\n- **`rule`** (`running.rs:450`) harvests judge output into `Judgment`s, collects evidence at the loop root, calls `loopsmith_gate::evaluate_all`, and refreshes phase completion.\n- **Rollback rules run after every ruling, even one that follows a halt.** A halt decides how the run ends; a rollback decides whether what this iteration achieved is kept. One does not answer the other (`running.rs:219`).\n- **Rulings reach the store only if no rollback rule refused them** (`persist_rulings`). Written earlier, `status` and a `goal_satisfied` trigger would both act on a ruling the run has already discarded.\n- **`spend_revisions`** charges a revision to every node that ran and left its goals unsatisfied, and returns the ones that just spent their last. Nodes with no declared goals are never counted — there is nothing to measure them against.\n- **`decide`** computes `progress_signature(verdicts)`, increments or resets `stale_iterations`, and asks `should_stop`.\n\n`Progress` is the accounting that outlives an iteration, and it is restored from the checkpoint rather than started fresh — a resumed run must not be handed a zeroed no-progress counter and a full revision budget every time it pauses. `Snapshot` is what a rollback returns to, and spend is deliberately *not* in it: a rollback discards what an iteration achieved, never what it cost, or a run could refund its own budget by tripping a rollback rule (`running.rs:159`).\n\n### `Closing` — the outcome, written down once\n\n`closing.rs`. `outcome_for` maps a stop reason to an outcome state: success is `Succeeded`; a budget or iteration ceiling is resource exhaustion, answered by `safety.recovery.resource_exhaustion` (`pause` by default — the run did nothing wrong, and a bigger budget is the ordinary next step); no progress is `Blocked`. Either becomes `Escalated` when the run has questions open for a human, because that, not the ceiling, is what it is waiting on.\n\nAlerts get a final look at the numbers before the counters are stored, since wall clock and spend can cross a line in a run's last moments. Then the outcome state is entered, the export is written if and only if the gate certified success, `remembering::procedure` records the shape of a successful run, `metrics::measure` fills `RunMetrics`, and `judge_against_baseline` compares this run to `evolution.baseline` — on completion and pass rate alone when the run did not succeed, since \"mean cost of a successful run\" is not comparable to a failure.\n\n---\n\n## Inside an iteration: dispatch\n\n`waves.rs` is the dispatcher; `dispatch.rs` is what a worker actually runs.\n\n**Concurrency.** Up to `graph.concurrency` nodes are in flight at once. The in-flight budget is global rather than per-wave, so a released wave's stragglers keep their slots while the next wave starts, instead of a whole chunk waiting on its slowest member.\n\n**Join** (`execution.graph.join`, modelled by `Tally`):\n\n| Join | Released when | Not met ⇒ |\n|---|---|---|\n| `wait_for_all` (default) | every node finished, successfully or not | n/a |\n| `quorum { count }` | `count` nodes succeeded | later waves not dispatched this iteration |\n| `first_success` | one succeeded | same |\n\nA released wave's stragglers are left to finish and their output is still recorded and published if it arrives in time; nodes not yet started are not started. A `quorum`/`first_success` wave whose nodes all finish without meeting the bar is not released, and `break 'waves` stops the iteration there — later waves would be reading answers that are not there.\n\n**Store discipline.** `dispatch::run_node` is store-free by construction: \"a thread that can write to the ledger is a thread that can interleave the ledger.\" Workers return a `NodeOutcome` over an `mpsc` channel and `waves::handle` writes everything down on the dispatcher's thread, in arrival order. A worker panic is caught (`catch_unwind`) and turned into one node's failure — an uncaught panic would mean a report that never arrives and a dispatcher that waits forever.\n\n**What a node is told** — `prompts.rs`. Two prompts: a system prompt with the loop's static context and the merged `ConstraintSet` (rules, forbidden paths and commands, human checkpoints), and a task prompt assembled in a deliberate order — a refused previous attempt first, then the phase guideline (usually about what *not* to do yet), sub-agents, the goals *and the checks those goals face*, then role-specific material. Stating the bar is not politeness: a node that does not know how it will be checked cannot aim at the check.\n\nTwo things are never handed to a `Role::Judge`: a perturbation (\"try a different approach\" is how a stalled loop talks itself into a lower bar) and promoted cross-run memory (the thing that checks the work is held to the standard it was given, not to what the loop has come to believe). For the same reason, a perturbation escalates a *builder's* tier but never a judge's (`dispatch.rs:179`).\n\n**Eligibility** (`eligible_nodes`) drops nodes whose phase is shut, nodes at the `max_revisions_per_node` ceiling, and nodes escalated earlier in the run. A node waiting on its phase is skipped silently — one line per node per iteration would bury the events that matter.\n\n---\n\n## Isolation and publication\n\n`worktree.rs` + `publish.rs` + `container.rs`, and the three-step dance between them is the part most likely to surprise a new contributor.\n\nA node whose `isolation` asks for it gets a git worktree at `state/worktrees/<node>/` on branch `loopsmith/<run>/<node>`. Nothing here is fatal: outside a git repo, or on a machine without git, `worktree::create` returns `Isolation::Shared { reason }` and the run continues with an honest report. An existing worktree is reused across iterations — recreating it would throw away the node's in-progress work every pass.\n\nBecause a worktree branches from `HEAD`, it is blind to everything the run has produced since. So:\n\n1. **`publish::seed`** copies in paths other nodes have already published, before the node runs — never a path the node published itself, so a builder's in-progress work is not overwritten by last iteration's copy of it.\n2. The node runs in its worktree (and, for `isolation: container`, inside `docker run --rm` with that worktree mounted at `/work` — degrading to a plain worktree, once per run in the ledger, when no runtime, daemon, or image is available).\n3. **`publish::publish`** copies what the node changed back into the loop root at join time, because `evidence::at_root` collects evidence there and nowhere else.\n\nWithout step 3, a `file_exists` detector pointing at an isolated builder's output could never pass: the work is real, on disk, and invisible to the only thing allowed to rule on it — a worse failure than the clobbering isolation prevents, because it looks like the builder did nothing.\n\nThree rules make publication safe to reason about:\n\n- **Only what the node changed.** `git status --porcelain -z --untracked-files=all` in the worktree is exactly that set. `-z` because paths contain spaces; `--untracked-files=all` because a new artifact in a new directory is the normal case and git's default collapses it to the directory name. Deletions are not propagated.\n- **First writer wins, second is named.** `claimed_paths` is carried across every node in the iteration; the loser gets a ledger line with the path and the node that got there first. Taking the last write silently would reintroduce the collision after doing the work to avoid it.\n- **`state/`, `logs/`, `.git/` are never published**, whatever a node did to them.\n\n`publish::forbidden_changes` is the one place a `forbidden_paths` constraint is *enforced* rather than merely stated: an isolated node's git status is a record of what it touched. A hit means nothing from that worktree is published — the whole tree is suspect, not just the offending file — and the failure is raised as `FailureClass::SafetyViolation`, which halts the run as `Failed` by default. A node sharing the loop root leaves no such record, so its `forbidden_paths` remain a prompt-level instruction.\n\nA rollback restores the checkpoint and the progress counters but **does not revert published files**; the ledger line names what was written so a human can check before resuming (`running.rs:303`).\n\n---\n\n## Recovery\n\n`recovering.rs` turns a `FailureClass` and an attempt count into a `Response` and nothing more — carrying it out is the dispatcher's job. Keeping the decision pure is what lets every row of the policy table be tested without running a provider.\n\n| `Response` | Meaning |\n|---|---|\n| `Retry { delay_seconds }` | same dispatch again, after backoff |\n| `Revise` | dispatch again now, telling the node what was wrong |\n| `Continue` | accept for this iteration; eligible again next |\n| `Escalate` | stop dispatching this node for the run, record the question |\n| `Halt(state)` | end the run in that state |\n\n`recovering::answer` decides *and* writes the ledger line in one step, so no call site can do one without the other. `may_redispatch: false` — set once dispatch has stopped for the iteration — downgrades a retry or revision to `Continue`: the policy asked for another attempt and there is no longer one to give.\n\n`max_attempts` counts dispatches, not retries; the default of 3 is the first try and two more. `RecoveryAction::Fallback` resolves to `Continue` because the provider cascade *is* the fallback and it has already been walked.\n\nTwo classifications are worth calling out. A judge that answered without a single `VERDICT:` block is `InvalidOutput` — it ran, and the gate cannot read a word of it — which the default policy answers with `Revise` rather than a blind retry (`waves.rs:587`). A retry's backoff is slept on the retry's own thread, so it blocks nothing else; on waking it checks `Shared::stopped` and reports itself cancelled rather than spending money after the run stopped dispatching.\n\nRun-level conditions go through `recovering::run_outcome`, which ignores retry and revise: a budget does not refill by being asked twice.\n\n---\n\n## The stop-gate ladder\n\n`stop.rs` is a pure function over a snapshot (`StopInputs`) — no store, no provider, no clock. The gates are the mechanical answer to \"may this run continue\", and a mechanical answer must not be reachable by anything a node said.\n\nOrder is not arbitrary:\n\n1. `stop_on_overall_success` — checked first, so a run that meets the bar on its last permitted iteration reports `OverallSuccess`, not `IterationCap`.\n2. `no_progress_iterations` (`0` means disabled, not instant).\n3. `max_iterations`, then wall clock, tokens, cost — cheapest signal first.\n\n`progress_signature` fingerprints the verdicts (`target:satisfied:passed/total`, sorted). If it does not change between iterations the loop is spinning rather than progressing. `waves::over_budget` additionally checks the token and cost ceilings mid-iteration and stops launching new nodes, so a wide graph cannot overshoot a budget by a whole wave.\n\n---\n\n## Compression, judgment, and the export\n\n**`summary.rs`** splits an iteration's record in two, and the split is load-bearing. `deterministic` is written by Rust from the gate's verdicts and the episode log — always present, costs nothing, cannot be wrong about what was satisfied. It reports deltas (`Newly satisfied`, and a shouted `REVOKED —` when the gate takes `done` back), the evidence line of every failing blocking check, phases closed, and spend. `add_narrative` optionally asks a cheap provider for two-to-four sentences of prose; the summariser is told explicitly that it is not deciding whether anything is finished, and nothing reads a summary to decide goal state anyway. `carry_forward` renders the last `context.carry_summaries` summaries — not the episodes — which is the whole cost-control story: prompt size stops growing with the run.\n\n**`judgment.rs`** parses judge prose into `Judgment`s the gate can act on. The contract (`JUDGE_OUTPUT_CONTRACT`, appended to every judge prompt and kept in the same file as the parser so the two cannot drift) is a line-oriented block format rather than JSON, because asking for strict JSON in the middle of an explanation is how you get truncated objects:\n\n```text\nVERDICT: every-claim-cited PASS\nSTANDARD: the citation policy in AGENTS.md\nEVIDENCE: all 14 claims carry a source line; checked lines 12-96\nSCORE: 9\n```\n\nUnparseable output yields nothing, so the gate fails closed. An unrecognised decision word is skipped rather than guessed at. **A `PASS` with no evidence is demoted to a fail** — that is an assertion, not a judgment, and letting it through would reopen the hole the gate exists to close. Provider ids come from the episode record, never from the judge's own claim about which model it was.\n\n**`export.rs`** writes `<root>/<name>-success/` — `SKILL.md`, `EVIDENCE.md`, the `loop.yaml` that converged, the `out/` tree, and POSIX + `cmd.exe` re-run launchers — packaged as a sub-agent skill so the next person with the same problem starts from something that worked. It is written only when `StopReason::OverallSuccess` fired, which only `should_stop` produces, and only from `loopsmith_gate::overall_success`. There is no flag to write it anyway: an export a confident model could produce would be a certificate that means nothing. The `SKILL.md` says so in as many words — \"a record, not a guarantee\" — and a test asserts that line is present.\n\n---\n\n## Supporting modules\n\n| Module | What it does |\n|---|---|\n| `context.rs` | `Run`: config, store, options, recorder, checkpoint, lifecycle. Checkpoint read/write with the `corrupted_state` policy applied (`save_or_halt`). |\n| `logging.rs` | `Recorder` writes the sled ledger and the plain-text `logs/` file through one choke point, so the queryable record and the readable one cannot disagree. `logging::line` is also the seam `loopsmith-web` renders progress through. |\n| `evidence.rs` | What the gate is shown: artifacts named by `file_exists` detectors (registered under both full path and stem, so `regex_match` has something to match), `metrics.json`, parsed judgments. A node's claim is not evidence. |\n| `rules.rs` | Entry, approval, and rollback rules applied uniformly; a `rollback` outcome on an entry rule has nothing to undo, so it fails the run and says so. |\n| `metrics.rs` | The eight numbers every `RunOutcome` reports, and `safety.alerts` thresholds on them — each alert fires at most once per run. |\n| `evolve.rs` | Skill trials, judgment harvesting, and proposal writing. Gathers evidence and writes proposals; adopting one is a human's edit. |\n| `perturb.rs` | What to do when the loop has stopped moving but has budget left. A fixed four-item menu of changes to *how* the loop works, never to what counts as done; seeded from run id + iteration and logged, so a strange turn can be replayed. |\n| `remembering.rs` | Cross-run memory the engine itself writes: failure modes (promoted on write — hitting a wall is its own evidence) and procedures (promoted only once several runs agree). |\n| `container.rs` | Docker/Podman probe and the `Containment` decision, including the degrade path. |\n| `schedule.rs` | Cron/interval/file triggers and the `Watcher` behind `loopsmith run watch`; plist, crontab, and `schtasks` generation for `run schedule --install`. Cron is evaluated in **UTC** on purpose. |\n\n---\n\n## Working on this crate\n\n- **`loopsmith-run` never decides that work is done.** If a change would let the engine write goal state, set `satisfied`, or gate the export on anything but `StopReason::OverallSuccess`, it is the wrong change. `loopsmith-gate` is the only writer.\n- **Keep the stop ladder pure.** `stop.rs` takes numbers and returns a verdict. It used to be eight inline `if` blocks in the middle of `execute()`; adding a gate meant remembering the same two-line dance at every break site.\n- **Workers do not touch the store.** Anything a node's dispatch learns comes back on `NodeOutcome` and is written down after the join, in a defined order. Skill acquisition happens on the dispatcher's thread before any worker starts, for exactly this reason.\n- **Add a state by editing the table.** `RunState::successors` is the machine; `Lifecycle::advance` refuses anything not in it, and `ALL` drives round-trip and outcome-closure tests.\n- Unit tests live beside their module (`phases.rs`, `stop.rs`, `judgment.rs`, `publish.rs`, `worktree.rs`, `export.rs`, `recovering.rs`, `state.rs`, `summary.rs`) and the engine-level tests are in `src/tests.rs`. The git-touching tests build real repositories in temp dirs via `loopsmith_util::testing::temp_dir`, so they are worth running before touching isolation or publication.\n\n---\n\n*Note on the brief: the paths supplied (`loopsmith-cli/src/run/*.rs`, `loopsmith-cli/src/judgment.rs`, `loopsmith-cli/src/worktree.rs`) do not exist and the supplied call-graph data was empty. This module actually lives in its own crate at `runtime/crates/loopsmith-run/src/`, which is what the documentation above describes, read from source.*","markdown-yaml-config-interchange":"# Markdown/YAML Config Interchange\n\n# Markdown/YAML Config Interchange\n\nA `loopsmith` config can be written as YAML or as a Markdown document, and the two are the *same model in two grammars*. This module (`loopsmith-core::md`, plus the `loopsmith convert` command) is the translation layer: Markdown in, `LoopConfig` out, and back again.\n\nThe design constraint that shapes everything here: **the parser and renderer know nothing about the config model.** They move between Markdown text and `serde_yaml::Value`, and serde does the typing. Adding a field to `LoopConfig` requires no change in this module. Adding a whole new *section* usually costs one table entry.\n\n## Why a Markdown grammar at all\n\nYAML has no place to put reasoning. A comment is second-class — it can't be rendered, it's invisible to tooling, and it drifts. In a Markdown config, prose at column 0 is documentation the parser deliberately drops, so the explanation for why a goal exists sits directly beneath the goal:\n\n```markdown\n# my-loop\n\n- version: 0.1.0\n- description: what this loop is for\n\nThis paragraph is ignored by the parser. Fenced blocks at the left margin\nare ignored too, so you can show an example without it becoming config.\n\n## C. Goals\n\n### ship-it\n- description: the thing is shipped and the suite is green\n- priority: 1\n\n## F. Stop gates\n- max_iterations: 12\n- max_cost_usd: 10.0\n```\n\nThe grammar in one line: `#` is the loop name, `##` is a section, `###` is an entry within a section, `- key: value` bullets are fields, indentation nests, everything else is prose.\n\n## Pipeline\n\n```mermaid\ngraph LR\n    MD[\".md text\"] --> T[tokenize]\n    T --> B[build_document]\n    B --> V[\"serde_yaml::Value\"]\n    V --> M[\"legacy::migrate\"]\n    M --> C[\"LoopConfig<br/>(serde)\"]\n    C --> R[render_md]\n    R --> MD\n```\n\n`parse_md` / `parse_md_reporting` own the left half, `render_md` the right. Both are deliberately thin over `serde_yaml::Value`, which is what makes them stay correct as the config model grows — every default, `#[serde(alias)]`, and `deny_unknown_fields` rule applies identically on both paths.\n\n## Parsing\n\n### `tokenize` — text to tokens\n\nProduces a flat `Vec<Tok>` of `H1`/`H2`/`H3`/`Bullet { indent, text }`. Three behaviours are worth knowing:\n\n- **Headings only count at column 0.** An indented `### foo` inside a bullet's continuation is not a heading.\n- **Fenced blocks at column 0 toggle a `fenced` flag** and everything inside is skipped. This is what lets a config document contain a YAML example of itself.\n- **Continuation lines fold upward.** A non-bullet line indented past the bullet above it, with *no blank line between*, is appended to that bullet's text with a newline. This is how a long `instruction` field spans several lines without becoming prose. The `after_blank` flag is the whole distinction between \"continuation\" and \"new paragraph\".\n\nAnything that matches none of these is dropped. That's the feature, not a gap.\n\n### `build_document` — tokens to value tree\n\nA small state machine over two variables: the currently-open `section` (a dotted path) and the currently-open `entry` (a `Mapping` being accumulated from a `###` heading).\n\n- **`H1`** sets `name` at the root.\n- **`H2`** normalises the heading via `heading_to_key`, resolves it through `section_path`, and opens that path as the current section. An unresolvable heading fails *here* rather than falling through to serde — worth the table lookup, because serde can only say `unknown field 'goles'` while this can list the sections that exist.\n- **`H3`** opens a new entry and seeds it with the heading text at `shape.key_field` via `nested_insert`. The heading is inserted as a `Value::String` unconditionally, never re-parsed as YAML: `### Recorded the baseline: test count, coverage` would otherwise become a one-entry mapping landing on a field that wanted text.\n- **`Bullet`** grabs the maximal run of consecutive bullets, hands it to `build_block`, and merges the result into the entry (if one is open), else the section (via `slot_at`), else the root as a top-level field.\n\n`flush_entry` runs before every heading and once at the end, appending the finished entry to its section's list — either the section's `list_field` sub-sequence (`execution.graph` → `…graph.nodes`) or the section itself when the section *is* the list (`intent.goals`). It converts an empty mapping left behind by `slot_at` into a sequence, since `slot_at` can't know which shape the caller wants.\n\n### `build_block` — one indent level\n\nRecursive. At a given `indent`, each bullet is classified by `split_field`:\n\n| `split_field` result | meaning |\n|---|---|\n| `Some((key, \"\"))` | key owns the deeper bullets below it (or is explicitly `Null`) |\n| `Some((key, rest))` | a scalar field |\n| `None` | a bare sequence item |\n\nMixing `key: value` bullets and bare items at the same level is an error — the block is either a mapping or a sequence.\n\n`split_field` carries the load-bearing guard: **a key containing whitespace is not a key.** Without it, `- Never git stash. Never git reset.` would be read as a field named `Never git stash. Never git reset.`. It also accepts a trailing bare `key:` for the owns-children case.\n\n`scalar` reads values the way YAML would, so `12`, `true`, and `[a, b]` arrive as the types they look like, falling back to a string. Multi-line values (the folded continuations) stay verbatim strings — prose with a colon in it is not a mapping.\n\n### `merge_key` — why merging, not inserting\n\nA `###` heading can fill in a *nested* field. A trigger's heading writes `on.type`; the `- on:` bullet beneath it then arrives carrying only `expr`. A shallow `insert` would replace the `on` mapping outright, dropping the `type` the heading just placed — and the entry would fail with `missing field type` while pointing at a document that plainly says `### cron`. `merge_key` recurses whenever both sides are mappings; `merge_into` is the entry point for a whole block.\n\n### Legacy handling\n\n`parse_md_reporting` calls `crate::config::legacy::migrate` on the value tree before handing it to serde, and returns the `Vec<Moved>` describing what was relocated. `parse_md` is the same thing with the report discarded.\n\nThis is deliberate and it is the key design decision for 0.3 compatibility: a legacy heading (`## A. Information`, `## F. Stop gates`) is parsed into the **0.3 flat shape** and then migrated by the same code the YAML path uses. The Markdown layer never learns a second relocation table that could drift. It also inherits the per-key repairs for free — a bare trigger gaining its `on:` wrapper, a node's `isolated: true` becoming an isolation level.\n\n## The section tables (`mod.rs`)\n\nThree tables carry all the section-specific knowledge in the module, read by the parser going in and the renderer coming out, so a heading cannot mean one thing when written and another when read back.\n\n**`SECTION_PATHS`** — `(heading key, dotted path, rendered heading)`. Its order *is* the render order, arranged the way a human writes a loop: what it's for, how it runs, what stops it, how it learns.\n\n**`LEGACY_SECTION_KEYS`** — 0.3 heading keys with no 1.0 spelling of their own (`information`, `pre_execution`, `validations`, `stop_gates`, `constraints`, `execution_guidelines`, `schedules`, `context`). These resolve to their flat 0.3 key and are relocated by `migrate`. `goals`, `graph`, `providers`, and `skills` are absent because they're *also* 1.0 headings — `SECTION_PATHS` answers those first and lands them where the migration would anyway.\n\n`context` is the reason `intent.background` isn't called `intent.context`: in a 0.3 document that heading meant the memory policy.\n\n**`section_shape`** — the only place the Markdown layer knows anything section-specific, and it exists solely because `### ship-it` must become `name: ship-it` for a goal but `id: ship-it` for a node:\n\n```rust\npub(crate) struct SectionShape {\n    pub list_field: Option<&'static str>,  // None when the section *is* the list\n    pub key_field: &'static str,           // may be dotted, e.g. \"on.type\"\n}\n```\n\nA section absent from this table takes no `###` entries — it's a plain field bag like `stop_gates`.\n\n### Resolution and normalisation\n\n`section_path` accepts three spellings of the same section: the 1.0 heading (`## Goals`), the 0.3 heading (`## Information`), and the dotted path written out in full (`## execution.graph`) — the last because a config being explicit is being unambiguous, not wrong.\n\n`heading_to_key` strips the A–J navigation letters and normalises: `A. Pre-execution` → `pre_execution`. The letter-stripping window is guarded to index ≤ 2 with alphanumeric-only prefix, which is what keeps `Pre-execution` (hyphen at index 3) from losing its first word. Both behaviours are pinned by unit tests in `mod.rs`.\n\n### Dotted-path helpers\n\n`nested_get`, `nested_insert`, and `nested_remove` operate on `serde_yaml::Mapping` with dotted paths. `nested_insert` creates parents; `nested_remove` recurses and **drops any parent it leaves empty** — that cleanup is what keeps a rendered trigger from carrying a pointless empty `- on:` bullet under the heading that already said which kind it is.\n\n`parse.rs` has its own `slot_at`, which is `nested_insert`'s read-write cousin: it walks to a dotted path creating intermediate mappings and hands back a `&mut Value`, erroring if the path runs through a non-mapping.\n\n## Rendering\n\n`render_md` is the structural inverse, written against `serde_yaml::to_value(cfg)` for the same reason the parser is written against `Value`.\n\n1. `# {name}` from the root, falling back to `unnamed-loop`.\n2. Preamble bullets, from the `PREAMBLE` list (`version`, `description`, `environment`, `features`) — top-level keys that are not sections.\n3. Each entry of `SECTION_PATHS` in order: resolve the path with `at`, skip if `is_blank`, emit `## {heading}`, then `render_section`.\n\n`render_section` branches on the value and its `section_shape`: a sequence with a shape becomes `###` entries; a mapping with a shape emits its non-list fields as bullets and then its `list_field` sequence as entries; a mapping with no shape is a flat field bag.\n\n`render_entry` pulls the heading text with `nested_get(m, key_field)`, then clones the mapping and `nested_remove`s the key field before rendering the rest as bullets. Removing from a clone rather than skipping inline is what makes a dotted key work — `on.type` has to come out of the nested mapping, and the now-empty `on` has to come out with it.\n\n### Emission rules\n\n`push_field` recurses for mappings (indent + 2) and delegates strings to `push_string`. Sequences — scalar or not — are emitted as **inline YAML flow via `flow`** (`serde_json::to_string`, since JSON is a subset of YAML). A nested list of objects has no bullet form that survives a round trip, so flow style is the honest answer, and it's exactly what the parser's `scalar` reader accepts back.\n\n`push_string` writes prose bare so it stays readable, and quotes only when necessary — specifically when YAML would read the text back as something *other than the same string*. Multi-line values are emitted as a first line plus continuation lines at `indent + 4`, which is what `tokenize`'s fold-upward rule reads back.\n\n`is_blank` drops nulls and empty collections: a config full of `- skills: []` is noise, and serde's defaults put them back on the way in. **An empty string is not blank** — `value: \"\"` is a value the author chose, and dropping it on a required field produces a document that no longer parses. That is precisely what happened to `information[].value` before the distinction existed.\n\n### Known lossiness\n\nExactly one thing does not survive a round trip: **trailing whitespace inside a value**, because a bullet ends where the line ends. Values are therefore emitted `trim_end`ed, deliberately. Nothing else is lost.\n\n## Tests that hold the invariants\n\nRound-trip is a property test, not a hope. `loopsmith-core/tests/md_roundtrip.rs` covers `roundtrip` (parse → render → parse), a Markdown config parsing into the same model as its YAML twin, prose and fenced blocks being documentation, multi-line instructions surviving, and misspelled fields being refused in Markdown too (the `deny_unknown_fields` inheritance).\n\nThe subtler guard lives in `render.rs`: `the_renderer_knows_about_every_config_section` serialises a config and asserts every path it produces is reachable from `SECTION_PATHS` or `PREAMBLE` (via the test-only `covered_paths`). Sec
