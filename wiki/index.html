var PAGES = {"cli-command-surface":"# CLI Command Surface\n\n# CLI Command Surface (`loopsmith-cli`)\n\nThe crate that publishes as **`loopsmith`** and builds the `loopsmith` binary. Nothing here runs a loop, evaluates a gate, or decides a verdict — those live in `loopsmith-run`, `loopsmith-gate`, and `loopsmith-core`. This crate owns exactly three things:\n\n1. **The argument grammar** — what you can type and what it means (`src/cli/`).\n2. **The command bodies** — one module per action, each of which loads a config, calls into a library crate, and prints (`src/cmd/`).\n3. **Loop scaffolding** — materialising a new loop directory, launchers and all (`src/scaffold.rs`, `src/guided.rs`).\n\nA useful mental model: this crate is a *translator*. Argv comes in, a `Command` enum comes out, a library crate does the work, and an `ExitCode` goes back to the shell. Every design decision below follows from keeping those four stages separate.\n\n## Layout\n\n| Path | Job |\n|---|---|\n| `src/main.rs` | Entry point only — 38 lines, no command logic |\n| `src/cli/mod.rs` | The clap grammar: `Cli`, `Command`, and the four action enums |\n| `src/cli/alias.rs` | The 0.3 → 1.0 spelling table, applied before clap |\n| `src/cmd/mod.rs` | `dispatch`, the two noun routers, and four shared helpers |\n| `src/cmd/*.rs` | One module per leaf action |\n| `src/scaffold.rs` | `loopsmith loop new`'s filesystem work, shared with the wizard |\n| `src/guided.rs` | The terminal wizard front end |\n| `templates/` | Files compiled in with `include_str!` |\n\n## The four-stage pipeline\n\n`main` is deliberately the whole control flow, and it is short enough to read as the spec:\n\n```mermaid\nflowchart LR\n    A[\"std::env::args()\"] --> B[\"cli::alias::rewrite<br/>0.3 → 1.0 spellings\"]\n    B --> C[\"Cli::parse_from<br/>clap\"]\n    C --> D[\"Cli::resolve<br/>--web / --guided collapse\"]\n    D --> E[\"cmd::dispatch<br/>match on Command\"]\n    E --> F[\"command module<br/>Result&lt;ExitCode, String&gt;\"]\n    F --> G[\"ExitCode, or<br/>eprintln! + FAILURE\"]\n```\n\nEach boundary exists to keep the next stage simple:\n\n- **`rewrite` runs before clap** so the grammar in `cli/mod.rs` holds only 1.0 spellings. The compatibility layer is one table in one file, deletable whole at 2.0 rather than unpicked from twenty-eight hidden subcommands.\n- **`resolve` runs after clap** so `dispatch` is a pure match over `Command` with no knowledge that `--web` and `web` are the same thing.\n- **Command bodies return `Result<ExitCode, String>`** and never call `process::exit`. That makes each one callable from a test — and from `guided::offer_run`, which invokes `cmd::run::execute` directly after scaffolding.\n- **One error path.** `main` prints `error: {e}` and returns `FAILURE`. `resolve`'s errors are the same `String` shape as a command's, so both take that path.\n\n## The grammar\n\n1.0 groups actions under four nouns, with four machine-level commands left flat: eight top-level subcommands, twenty-eight leaf actions.\n\n| Noun | Actions | Concern |\n|---|---|---|\n| `loop` | `new`, `guided`, `validate`, `plan`, `convert`, `migrate`, `permissions` | The config file itself |\n| `run` | `start`, `resume`, `status`, `ledger`, `gate`, `watch`, `schedule`, `proposals`, `prune` | One run of a loop, and what it left behind |\n| `memory` | `list`, `promote`, `forget` | What the loop remembers across runs |\n| `skills` | `list`, `search`, `acquire`, `install`, `scores` | Sub-agent discovery and scoring |\n| *(flat)* | `doctor`, `providers`, `web`, `mcp` | One thing about this machine, not about a loop |\n\n`Cli` also carries four global flags — `--web`, `--guided`, and `--guided`'s two modifiers `--novice` / `--expert` plus `--ask`. `resolve` turns them into `Command::Web` or `Command::Loop { action: LoopAction::Guided { .. } }`, and refuses the contradictions explicitly rather than guessing:\n\n- `--web` + `--guided` → \"two front ends for the same thing — pick one\"\n- `--web` + a subcommand → \"`--web` starts the browser UI and takes no subcommand\"\n- neither, and no subcommand → a message naming `loopsmith loop guided` and `loopsmith web`\n\n`--novice`, `--expert`, and `--ask` are declared with `requires = \"guided\"`, so clap rejects them on their own; the `guided` subcommand declares the same three flags itself, so the short spelling is not a lesser one.\n\n## The compatibility layer (`cli/alias.rs`)\n\nEvery 0.3 verb was flat (`loopsmith validate`, `loopsmith watch`). Those spellings are in shell histories, Makefiles, crontab lines written by `schedule --install`, and the `run.sh` / `run.cmd` launchers in every loop directory the binary has ever scaffolded. So `rewrite` fixes up argv and prints one note via `Moved::notice`.\n\nTwo tables do the work:\n\n- **`MOVED`** — fifteen `(verb, noun)` pairs. A match inserts the noun at position 1.\n- **`RUN_VERBS`** — the verbs under `run`, because `run` is the one collision: a noun in 1.0, a verb in 0.3.\n\nThe `run` disambiguation is the subtle part. `loopsmith run <config>` must keep running the loop:\n\n```rust\nif first == \"run\" {\n    let verb_next = args.get(2).is_some_and(|n| RUN_VERBS.contains(&n.as_str()));\n    let has_config = args[2..].iter().any(|a| !a.starts_with('-'));\n    if verb_next || !has_config { return (args, None); }   // the 1.0 noun\n    args.insert(2, \"start\".into());                        // the 0.3 verb\n}\n```\n\nReading the token *straight after* `run` rather than the first non-flag token anywhere is what keeps `--run-id start loop.yaml` from being misread as the `start` verb. Checking for any later non-flag token is what keeps 0.3's flags-before-positional form (`run --dry-run loop.yaml`) working. Only the first argument is ever inspected, so a config file literally named `validate` is safe.\n\nFour tests in this file are load-bearing well beyond it, and are the reason a command rename is a single-commit change:\n\n- `every_moved_verb_lands_on_a_noun_that_exists` and `every_run_verb_is_a_real_one` hold the tables against the clap grammar via `CommandFactory`. A verb missing from `RUN_VERBS` would be read as a config path.\n- `the_browser_never_asks_for_a_spelling_that_moved` (feature-gated on `web`) walks `loopsmith_web::exec::all_actions()` and asserts both that clap accepts each argv *and* that `rewrite` has nothing to say about it. A 0.3 spelling in the web UI would still work — by coming through this table — and would land a deprecation notice in the console of someone who pressed a button and typed nothing.\n- `no_document_tells_anyone_to_type_a_spelling_that_moved` walks every `.md`/`.sh`/`.cmd`/`.rb`/`.html` in the repository, scrapes invocations out of prose with `commands_in`, and runs each through `rewrite`. `CHANGELOG.md` and the migration wiki page are exempted by name. It asserts `seen > 100` so a scanner that silently stops reading fails too.\n\n## Command bodies and their shared helpers\n\n`cmd/mod.rs` holds four helpers every command reaches for, and they encode invariants worth knowing:\n\n- **`config_dir(config)`** — the config's directory, normalised to `.` when `Path::parent()` yields `Some(\"\")` for a bare `loop.yaml`. An empty path is not a usable working directory; spawning into one fails with ENOENT.\n- **`config_file_name(config)`** — the bare file name, for scripts generated *inside* the loop directory that `cd` there first.\n- **`open_store(config)`** — opens the sled store at `<config_dir>/state`. Every command that reads a run's history goes through this.\n- **`report_outcome(&RunOutcome)`** — the one place a finished run is printed: run id, iterations, state, `stop.describe()`, spend (flagging estimates when no provider reported usage), alerts, baseline, proposal count, per-target verdicts, log path, export path. On failure it prints the `run ledger` command to type next. Shared by `run`, `resume`, and `watch` so all three read identically.\n\n`dispatch` routes `Command::Loop` and `Command::Run` to `loop_noun` and `run_noun`; `Memory` and `Skills` are matched inline. Only `validate` is a private `mod`; every other command module is `pub` so the wizard and tests can call it.\n\n### Exit codes carry meaning\n\n`ExitCode` is part of the interface, because a scheduler or CI step should not have to parse output:\n\n| Command | Non-zero when |\n|---|---|\n| `run start` / `run resume` | `!out.stop.is_success()` — via `run::exit_code` |\n| `run gate` | the target is not satisfied |\n| `loop validate` | `report.has_errors()`, or `--strict` and any warning |\n| `loop migrate --check` | the file still uses 0.3 keys |\n| `skills install` | any declared `default_skills` entry failed |\n| `doctor` | **never** — advisory by design. Reporting a constraint is not the machine being unusable, and a non-zero exit would fail a CI step that was working fine |\n\n### Notable bodies\n\n- **`doctor`** probes rather than infers: `Platform::detect()` for OS, userland, bash version, `/bin/sh`, and installed scheduler; `which` for `git`/`sh`/`sed`/`awk`/`curl`; `loopsmith_run::container::probe()` for a container runtime. `sed`'s in-place flags are printed with the empty argument rendered as `''`, because that argument *is* the GNU/BSD difference. Given a config, `config_notes` additionally resolves every `Detector::Script` command — relative paths against the loop directory, bare names against `PATH` — and reports missing or non-executable detectors before the first gate evaluation discovers them.\n- **`watch`** is the resident loop. It refuses up front when every trigger is `Trigger::Manual` (it would sleep forever), primes a `schedule::Watcher` that ignores the `<name>-success` export directory so a `file_change` trigger cannot fire on the loop's own output, and then polls. Several triggers firing in one poll start **one** run, at the shallowest depth any of them allows; `Decision::Duplicate` and `Decision::DepthCapped` are printed rather than silently dropped. A failed run logs and continues — that is the difference between a scheduler and a one-shot.\n- **`schedule`** picks a scheduler by what is *installed*, not by `cfg!(target_os)`: `launchctl` → plist, `schtasks` → a printed command, anything else → a crontab line. Only launchd gets a real `--install`, because LaunchAgents is one file per job; for the other two, `nothing_to_install` explains why rather than accepting the flag as a no-op. Logs go to `logs/`, never `state/` — the watcher ignores everything under `state/`, which would have hidden the OS's own record of a failed start.\n- **`migrate`** re-parses its own output and refuses to write a file that does not load: a migration producing an unloadable config has taken a working config away from someone. YAML is rewritten as a `serde_yaml::Value` document so unknown keys survive; Markdown round-trips through the model.\n- **`proposals`** marks stale entries but never deletes them. A proposal records what the loop wanted at a moment; the moment went stale, not the record.\n- **`mcp`** serves `loopsmith_mcp::Server` over stdin/stdout — the same server a scaffolded loop's `.mcp.json` points at.\n\n## Three front ends, one config\n\n`loop new`, `loop guided` (`--guided`), and `web` (`--web`) all produce the same `LoopConfig` and all end in `scaffold::scaffold`. They differ only in how the answers are collected:\n\n- **`new`** never blocks on a prompt — a command that waits for a keypress cannot run from a Makefile or from the agent setting the loop up. Config can be handed over whole via `--config-file` or `--config-stdin`; `read_provided` rejects both together and an empty stdin. For a file, the *extension* decides the grammar (`loopsmith_core::is_markdown`), because guessing from content would let a stray `#` reinterpret someone's YAML.\n- **`guided`** (`src/guided.rs`) has two paths, and the choice is remembered in `loopsmith_wizard::preferences`: **novice** walks every question via `loopsmith_wizard::interview` (the same question set the browser renders), **expert** hands a filled-in config to `$EDITOR` and validates what comes back, preserving the author's own formatting and comments. A flag overrides for one run; `--ask` forgets the preference. With `--edit`, the result is written back over the same file (`write_back`, which asks before overwriting); otherwise `create_loop` scaffolds a directory named after a `sanitize`d loop name and then `offer_run` optionally calls `cmd::run::execute`, defaulting the first pass to a dry run.\n- **`web`** is behind the default-on `web` feature. When the feature is off, `dispatch` still matches `Command::Web` and returns an error naming the flag that brings it back, rather than pretending the command does not exist.\n\n## Scaffolding (`src/scaffold.rs`)\n\n`scaffold(&NewLoopArgs) -> io::Result<Scaffold>` creates the directory tree (`state`, `logs`, `out`, `proposals`, `generated-skills`, `.claude/skills`), writes the config, the harness, and both launcher flavours, then optionally initialises git.\n\n**Guardrails, in order:**\n\n1. `guard_path` refuses an empty path, a filesystem root, the user's home directory, and — the load-bearing one — anywhere inside the loopsmith installation. `install_root` finds that installation by walking up from `current_exe` looking for `config/loop.schema.json` **and** `runtime/Cargo.toml` together. A loop edits files, installs sub-agents, and writes state; pointed at its own runtime, it could modify the thing that runs it. The refusal suggests `--path ~/loops/<name>`.\n2. A non-empty target directory is refused without `--force`.\n3. A supplied config is parsed *before* anything is written. A loop directory holding an unparseable config is worse than no directory.\n\n**Templates are compiled in.** `MCP_TEMPLATE`, `PERMISSIONS_TEMPLATE`, `COMPAT_TEMPLATE`, `MARKETPLACES`, `README_TEMPLATE`, and the four launcher templates are `include_str!`ed from `templates/`. That makes a new loop self-contained and makes it impossible for `loop new` to touch the checkout it was launched from. They live in the crate rather than the repository's `config/` for a packaging reason, not a stylistic one: an `include_str!` reaching above the crate root compiles locally and fails `cargo package --verify`. `Cargo.toml`'s `include` list is anchored with leading slashes for the same class of reason — unanchored `README.md` would also match `tests/README.md`.\n\n`fill(template, values)` substitutes `{{key}}` in **one pass over the template, never over the values**, so a purpose containing `{{name}}` comes out verbatim. An unknown key is left as `{{key}}`, and `every_template_placeholder_is_filled` turns that into a test failure.\n\n**Launchers.** Both `.sh` and `.cmd` are written on every host, unconditionally — a loop directory outlives the machine that made it, and `cmd.exe` cannot run a shebang script while no POSIX shell will run a `.cmd`. The shell scripts use `#!/bin/sh` and POSIX-only syntax because macOS still ships bash 3.2. The batch files are converted by `crlf` on the way out and have exactly one `exit /b` on the last line: an implicit `endlocal` restores the errorlevel `setlocal` saved, and `endlocal & exit /b` does not work inside a nested `if (…)` block, so every path sets `CODE` and falls through. `binary_path` pins an absolute path (cron and launchd inherit no `PATH`) but deliberately does *not* canonicalize an already-absolute one, because resolving Homebrew's symlink would pin a version number that dies on the next upgrade.\n\n**`init_git`** is what makes `isolated: true` isolate anything. It runs `init`, `add -A`, and a commit — the commit is not optional, since `git worktree add` resolves a start point and a repository with no HEAD has none. Identity is passed inline with `-c` rather than written to the repo config, so a machine with no `user.email` still works and nobody's git identity is edited to scaffold a loop. Failure is reported, never fatal: `Scaffold::git` is `Some(Ok(()))`, `Some(Err(why))`, or `None`, and `cmd::new` prints the warning because a silent failure here surfaces much later as two builders overwriting each other.\n\n**`starter_config`** builds the shipped starter: a two-node `build` → `judge` graph, `Environment::Dev`, every risky feature off, `enforce_judge_independence: true`, and `prerequisites` whose `done` flags are all `false`. It is asserted **not** to validate as shipped — `the_starter_config_validates_once_pre_execution_is_marked_done` — because a loop automating a process nobody has performed by hand produces fast, confident garbage.\n\n## Connections outward\n\nEvery dependency is a one-way call into a library crate; nothing calls back into this one.\n\n| Crate | Used for |\n|---|---|\n| `loopsmith-core` | `load`, `load_validated`, `validate`, `parse_str`/`parse_md`, `render_md`, `is_markdown`, `permissions::*`, `config::legacy::migrate`, and the whole config model |\n| `loopsmith-run` | `execute`, `RunOptions`/`RunOutcome`/`RunState`, `collect_evidence`, `schedule::*`, `worktree::*`, `container::probe` |\n| `loopsmith-gate` | `evaluate` for the one-shot `run gate` |\n| `loopsmith-graph` | `plan`, `unisolated_parallel_writers` for `loop plan` |\n| `loopsmith-memory` | `open`, `Store`, `score_skills`, `Checkpoint` |\n| `loopsmith-provider` | `availability`, `starter_providers` |\n| `loopsmith-skills` | `list_installed`, `acquire`, `install_default`, `search_marketplace` |\n| `loopsmith-mcp` | `Server::serve` |\n| `loopsmith-wizard` | `interview`, `Io`, `Grammar`, `Outcome`, `preferences` |\n| `loopsmith-util` | `which`, `is_executable`, `now_ms`, `platform::*`, `testing::*` |\n| `loopsmith-web` | Optional; `serve`, and `exec::argv_for` in tests |\n\n## Adding a command\n\n1. Add the variant to the right action enum in `cli/mod.rs` with its doc comment — clap uses it as the help text, so write it for the reader who types `--help`.\n2. Add a module under `src/cmd/` exposing `pub fn execute(...) -> Result<ExitCode, String>`. Load the config with `loopsmith_core::load` (or `load_validated` if it will run something), use `open_store` when you need run history, print, return. Do not call `process::exit`.\n3. Wire it into `loop_noun` / `run_noun` / `dispatch`.\n4. If you add it under `run`, add its name to `RUN_VERBS` — otherwise `loopsmith run <yourverb>` is read as a config path. `every_run_verb_is_a_real_one` fails if you forget.\n5. If you *rename* or move a command, add the old verb to `MOVED`, and expect `no_document_tells_anyone_to_type_a_spelling_that_moved` to tell you which documents need editing on the same commit.\n6. If the web UI can trigger it, `the_browser_never_asks_for_a_spelling_that_moved` will hold `loopsmith_web::exec::argv_for` to the new spelling.","distribution-installers":"# Distribution & Installers\n\n# Distribution & Installers\n\nEverything in this module exists to get one compiled artifact — the `loopsmith` binary — onto a machine, and nothing else. No part of it links against the runtime crates or is called by them; the coupling runs the other way, through a version string and a release tag.\n\nThere are two families here, and confusing them is the fastest way to write a bug:\n\n| Family | Entry points | What it does | Needs Rust? |\n|---|---|---|---|\n| **Build from source** | `install.sh`, `install.bat` → `install.ps1`, `installers/deps.*` | Installs a toolchain, clones or uses a checkout, runs `cargo build --release` | Yes, it installs one |\n| **Fetch a prebuilt binary** | `npm/scripts/install.js`, `pypi/src/loopsmith_cli/` | Downloads a release asset, verifies it against `SHA256SUMS`, installs a launcher | No |\n| **Package manager** | `Formula/loopsmith.rb` | Hands the build to Homebrew (`std_cargo_args`) | Homebrew provides it |\n\nA third, smaller concern sits across all of them: `tools/sync-version.sh`, which keeps the version string identical in the eight places that have to repeat it.\n\n---\n\n## Part 1 — Building from source\n\n### The manifest is the only shared fact\n\n`install.sh` (bash), `install.ps1` (PowerShell) and `install.bat` (a five-line shim) all install the same thing on different operating systems. Every fact they share — repository URL, branch, install directory name, build command, the \"next steps\" text — lives in `installers/manifest.json` and nowhere else.\n\n```mermaid\ngraph LR\n  M[installers/manifest.json]\n  SH[install.sh] -->|manifest.sh: m_str / m_list| M\n  PS[install.ps1] -->|ConvertFrom-Json| M\n  BAT[install.bat] -->|delegates| PS\n  SH --> DSH[installers/deps.sh]\n  PS --> DPS[installers/deps.ps1]\n```\n\nThe manifest's shape is load-bearing, and the comment at the top of the file says so. `installers/manifest.sh` reads it with `sed` and `awk`, not `jq`:\n\n```sh\n. installers/manifest.sh\nBINARY=\"$(m_str binary)\"          # one string\nm_list build_args                 # one element per line\n```\n\nThe reasoning is worth internalising before editing it: a machine running `install.sh` has just been told it needs `cargo` and `git`. It is in no position to also need a JSON parser. That constraint produces two rules:\n\n- **Keep the manifest flat.** Strings and arrays of strings only. `m_str` is a single `sed` substitution against `\"key\": \"value\"` on one line; `m_list` scans for `\"key\"` followed by `[` and pulls quoted items until `]`. Nest an object and both readers silently stop working.\n- **One array element per line.** `m_list` depends on it.\n\n`m_str` returns non-zero and prints `manifest: no key 'x'` for a missing key, deliberately. A missing key that returned empty would become `git clone \"\"`, which fails much later with a much worse message.\n\n`install.sh` reads list values into `\"$@\"` through a `while IFS= read -r` loop rather than `$(...)` word-splitting, so a build argument containing a space stays one argument.\n\n### install.sh\n\nLinux, macOS, BSD. Ordered as: detect → deps → verify → source → build → install → link.\n\n1. `detect_os()` maps `uname -s` to `linux`/`macos`/`bsd`/`windows`/`unknown`. `unknown` is fatal; MSYS/Cygwin prints a warning pointing at `install.bat` and continues, since a POSIX layer is present.\n2. Delegates to `installers/deps.sh` if present, otherwise falls back to an inline `rustup` pipe. Everything is `tee`'d to `$INSTALL_DIR/install.log`.\n3. Verifies `m_list requires` (`cargo`, `git`) is on `PATH`. **The `while read` loop that does this runs in a subshell**, so its `err` cannot exit the parent — the script therefore re-checks `cargo` and `git` explicitly afterwards. This is not redundancy; removing either check removes the guard.\n4. A `runtime/` directory beside the script wins over a clone. That is what makes `git clone && ./install.sh` install the code you just cloned rather than whatever `main` happens to be.\n5. Installs to `$INSTALL_DIR/bin/loopsmith` with `install -m 0755`, then symlinks into `/usr/local/bin` **only** if that directory is writable or the user is root. Otherwise it prints the `export PATH=...` line and exits successfully — an installer that cannot write to a system directory has not failed.\n\nOverrides, all read before the manifest default:\n\n| Variable | Default (from manifest) |\n|---|---|\n| `LOOPSMITH_HOME` | `$HOME/.loopsmith` |\n| `LOOPSMITH_BIN_DIR` | `/usr/local/bin` |\n| `LOOPSMITH_REPO_URL` | `https://github.com/bitphill/loopsmith.git` |\n| `LOOPSMITH_BRANCH` | `main` |\n\n`install.ps1` honours `LOOPSMITH_HOME`, `LOOPSMITH_REPO_URL` and `LOOPSMITH_BRANCH`; it has no `LOOPSMITH_BIN_DIR` equivalent because it edits the user `PATH` instead of linking.\n\n### install.bat and install.ps1\n\n`install.bat` exists so the install is one word rather than an execution-policy incantation. It `cd /d \"%~dp0\"`, checks `where powershell` (exiting `127` with an explanatory message if absent), then runs `install.ps1` with `-NoProfile -ExecutionPolicy Bypass` — scoped to that one process, changing nothing about the machine. It forwards `%*` and propagates `%errorlevel%`.\n\n`install.ps1` mirrors `install.sh` step for step, but three Windows-specific details are each the fix for a real failure:\n\n- **`Get-Content ... -Raw -Encoding UTF8`.** Windows PowerShell 5.1, which `install.bat` invokes, reads a BOM-less file in the ANSI code page. The manifest is UTF-8 without a BOM, so any non-ASCII character in it would arrive as mojibake.\n- **`Invoke-Logged`.** Under `$ErrorActionPreference = 'Stop'` with stderr redirected, 5.1 turns every stderr line from a native command into a terminating error record. `cargo` and `git` both report progress on stderr, so a *successful* build died on cargo's own `Finished` line. `Invoke-Logged` drops to `'Continue'` for the length of the call, flattens each record back to text for the log, and treats `$LASTEXITCODE` as the verdict.\n- **User `PATH`, not machine `PATH`.** No elevation needed, and a tool installed into a home directory has no business editing a system-wide setting. It also prepends to `$env:PATH` for the current process and says a new shell is needed.\n\n### deps.sh and deps.ps1\n\nBoth are callable standalone, install nothing already present, and **never install a package manager** — a host with none is a decision somebody made, and these report it rather than working around it.\n\n`deps.sh` dispatches on the *package manager*, not the OS, because a Debian container may have `apt` and no `sudo` while an Alpine one has `apk`: `pkg_install()` tries `apt-get`, `dnf`, `yum`, `pacman`, `apk`, `zypper`, `brew`, `pkg` in that order, prefixing `sudo` only when not already root and `sudo` exists (`brew` is never sudo'd). It installs `git` and `curl` if missing, then `rustup` with `--profile minimal --default-toolchain stable` if `cargo` is absent.\n\nTwo comments there record deliberate *non*-actions: loopsmith links no C libraries and never does TLS in-process (providers are external commands), so `pkg-config` and OpenSSL headers are installed on purpose-not-at-all.\n\n`deps.ps1` uses `winget` then `choco`, and dies rather than bootstrapping either. Beyond the shared logic it warns when `link.exe` is absent, because `Rustup.Rustup` pulls the MSVC toolchain and needs the Visual Studio C++ build tools for the linker:\n\n```\nwinget install --id Microsoft.VisualStudio.2022.BuildTools\n```\n\nBoth scripts prepend `~/.cargo/bin` to `PATH` for the caller's process, because `rustup` writes its `PATH` line to `~/.profile`, which zsh never reads.\n\n> **Known drift.** `runtime/Cargo.toml` declares `rust-version = \"1.85\"` and `manifest.json` carries `\"min_rust\": \"1.85\"`, but the toolchain-age warnings in `deps.sh` and `deps.ps1` still hardcode `1.75` and neither reads `min_rust`. The warning fires too late to be useful on a 1.75–1.84 toolchain. Wiring both checks to `m_str min_rust` / `$Manifest.min_rust` is the obvious fix and would make the manifest genuinely the single source.\n\n---\n\n## Part 2 — Fetching a prebuilt binary\n\nnpm and PyPI both ship a launcher, not a library. Neither has a Rust toolchain in the picture. Both do the same four steps — resolve a target triple, fetch `SHA256SUMS`, fetch the asset, refuse on mismatch — and differ on *when*.\n\n```mermaid\ngraph TD\n  T[resolve target triple] --> A[\"asset = loopsmith-vVERSION-TRIPLE.tar.gz|.zip\"]\n  A --> S[\"fetch SHA256SUMS<br/>find line ending in asset\"]\n  A --> D[fetch archive]\n  S --> C{sha256 matches?}\n  D --> C\n  C -->|no| R[refuse: checksum mismatch]\n  C -->|yes| X[extract one named member]\n  X --> I[chmod +x, install]\n```\n\nThe checksum step is the whole point, and both files say so in the same words: fetching a binary and running it unverified is a supply-chain hole with a progress bar. The release workflow publishes `SHA256SUMS` with bare filenames precisely so these two can match a line by its trailing asset name and refuse.\n\n### Target triples\n\nThe mapping is identical in `resolveTarget()` (JS) and `_target()` (Python), and must stay identical to the `matrix.target` list in `.github/workflows/release.yml`:\n\n| Platform | Triple |\n|---|---|\n| linux x64, glibc | `x86_64-unknown-linux-gnu` |\n| linux x64, musl | `x86_64-unknown-linux-musl` |\n| linux arm64 | `aarch64-unknown-linux-gnu` |\n| macOS x64 / arm64 | `x86_64-apple-darwin` / `aarch64-apple-darwin` |\n| Windows x64 | `x86_64-pc-windows-msvc` |\n\nlibc detection is the subtle part, and the two implementations differ because their languages offer different tools:\n\n- **`isMusl()`** runs `ldd --version` and inspects the *failure*. musl's `ldd` has no `--version`: it prints usage plus `musl libc` to stderr and exits non-zero, where glibc's answers and exits 0. So a thrown exception whose stderr matches `/musl/i` means musl.\n- **`platform.libc_ver()`** returns a non-empty string for glibc and empty otherwise, so Python treats empty as musl.\n\nGetting this backwards yields a binary that dies with a bare `not found` naming no missing library.\n\nAnything unmatched is not an error: `install.js` warns and returns, `_target()` raises `ResolveError`. Both point at `cargo install loopsmith`.\n\n### npm — download at postinstall\n\n`npm/package.json` declares `bin.loopsmith → bin/loopsmith.js`, `postinstall → node scripts/install.js`, `engines.node >= 18` (for global `fetch`), and `os`/`cpu` arrays.\n\n`scripts/install.js` is one `main()` that `Promise.all`s the archive and `SHA256SUMS`, verifies, writes the archive to `os.tmpdir()`, and extracts exactly one member with the system `tar` (`tar xf` on Windows — `tar.exe` has shipped since Windows 10 1803 and reads zips; `tar xzf` elsewhere). The extracted file is renamed to `loopsmith-bin` (or kept as `loopsmith.exe`) and `chmod 0755`'d; the temp archive is removed in a `finally`.\n\n**The failure path is deliberately non-fatal.** `main().catch()` logs and sets `process.exitCode = 0`, because a flaky download should not hard-fail an `npm install` that may be installing twenty other things. The error surfaces later, clearly, from the launcher.\n\n`bin/loopsmith.js` is that launcher. It exits `127` with build-from-source advice if the binary never landed, `126` if spawning fails, and otherwise `spawnSync(..., { stdio: 'inherit' })`. `spawnSync`, not `execFileSync`, because loopsmith is interactive and long-running and its exit code is a verdict that has to arrive unchanged. A signalled child has a `null` status, so the launcher re-raises the signal on itself — that is what makes the shell see the same death the child had.\n\n### PyPI — download on first run\n\nThe distribution is `loopsmith-cli` (the short name was taken); the console script is `loopsmith`, via `[project.scripts]` → `loopsmith_cli.__main__:main`.\n\nThe install-time/first-run split is the deliberate difference from npm. A wheel that downloads during `pip install` breaks in every environment that installs with no network and then runs with one — CI images, Docker build stages, locked-down build hosts — and it surfaces as an install error for a package the user has not tried to use yet.\n\n`ensure_binary()` is the one public entry point:\n\n```\nensure_binary() → cache_dir() → hit? return\n               → _target()\n               → _expected_digest(asset) → _read(SHA256SUMS)\n               → _read(asset) → sha256 compare\n               → _extract(archive, tmp, name) → shutil.move → chmod +x\n```\n\nFour details each encode a specific failure:\n\n- **`cache_dir()` is versioned** — `$LOOPSMITH_HOME/bin/<version>` (default `~/.loopsmith/bin/<version>`) — so an upgrade re-fetches instead of running a stale binary.\n- **`_TIMEOUT = 20`**, not 120. `urllib` tries a host's addresses one after another and spends the full timeout on each that does not answer. GitHub serves release assets from four anycast addresses; a network that could not reach one made the first run sit for two minutes per download, looking exactly like a hang. Twenty keeps a genuinely slow link working and makes a dead node a pause.\n- **The \"fetching…\" line prints before the download**, for the same reason: a first run that prints nothing until it finishes is indistinguishable from a hang.\n- **`_extract` takes one named member.** A checksum-matched archive is still untrusted input, so the tar path calls `getmember(member)` and rejects a name mismatch, a symlink or a hard link rather than calling `extractall`.\n\n`__main__.main()` returns `127` for `ResolveError` and for `OSError` during fetch. Then it does the thing that looks paranoid and is not: it compares `Path(exe).resolve()` against `Path(sys.argv[0]).resolve()` and refuses if they match. There is deliberately **no** \"reuse a `loopsmith` already on `PATH`\" shortcut anywhere in this package, because pip installs *this package's* console script as `loopsmith`, so `shutil.which(\"loopsmith\")` would find the running script and `execv` it — an infinite exec loop that presents as a command hanging with no output, no error and no traceback. Both the missing shortcut and this guard are there because that failure mode has no useful symptom.\n\nOn POSIX it then `os.execv`s, replacing the process so the shell's Ctrl-C reaches the real binary and the exit code arrives unchanged. Windows has no such exec, so it `subprocess.call`s and maps `KeyboardInterrupt` to `130`.\n\n`pypi/build.sh` builds and optionally uploads (`--upload`, using `PYPI_TOKEN`) for local releases. It creates a throwaway `.venv-build` and pins `build`/`twine` into it, because the `python3` first on `PATH` is not a stable fact: a Homebrew install can put a new `python3` ahead of the one whose user site-packages holds `build`, producing `No module named build` on a machine where build is very much installed — and Homebrew's Python is PEP 668 externally-managed, so `pip install --user` into it is refused outright. `pick_python()` walks an explicit `python3.13 … python3.9, python3, /usr/bin/python3` list, testing `import venv` on each. CI does not use this script; the `pypi` job in `release.yml` publishes via Trusted Publishing.\n\n---\n\n## Part 3 — Homebrew\n\n`Formula/loopsmith.rb` in this repo is the **template**, not what `brew` reads. `brew install` reads `github.com/bitphill/homebrew-loopsmith`; the `homebrew` job in `release.yml` renders `url` and `sha256` for the tag and pushes the result there with a deploy key. Edit the body here — those two lines will be overwritten. Updating this file alone leaves the tap pinning the previous release while the copy here looks correct, which is the one way a release can silently half-land.\n\nThe formula builds from source (`depends_on \"rust\" => :build`) and `cd \"runtime\"` first, because the cargo workspace root is `runtime/`, not the repository root, and the binary comes from `crates/loopsmith-cli`.\n\nThe `sha256` cannot be derived locally — it is the digest of a tarball GitHub generates — so it is the one field `sync-version.sh` leaves alone. Check the *size* before trusting a digest: codeload rate-limits unauthenticated archive downloads, `curl -sL` reports success while writing the error body, and hashing that yields a checksum no install can ever match. The release workflow encodes the same lesson as hard gates — valid gzip, ≥ 500 kB, non-empty listing, and a digest that differs from the previous release's (an identical digest is the rate-limit signature, not a coincidence).\n\n`caveats` is the only place a tap can speak to someone who has just arrived, and it spends that space on `--web` and `--guided` rather than assuming knowledge of the config format.\n\nThe `test do` block is a real behavioural test, not a smoke test. Alongside `--version` and an advisory `doctor` probe, it scaffolds a loop and asserts that `loop validate` **exits 1** mentioning `intent.prerequisites`. That refusal is the product; a build where it stops happening is a broken build.\n\n---\n\n## Part 4 — Keeping versions in step\n\n`runtime/Cargo.toml`'s `[workspace.package] version` is the single source of truth. Everything else is derived, and `tools/sync-version.sh` derives it:\n\n```bash\n./tools/sync-version.sh           # rewrite everything to match\n./tools/sync-version.sh --check   # fail on drift (CI runs this)\n```\n\nIt reads the version with `awk`, then calls `apply <file> <pattern> <replacement> <label>` per target: the workspace's own path-dependency versions, `npm/package.json`, `pypi/pyproject.toml`, `loopsmith_cli.__version__`, the Homebrew `url` tag, and — in every published README — the tag-pinned logo URL and the tag-pinned `README-FOR-DUMMIES.md` link. A published README is immutable, so an image or link URL pointing at `main` will eventually be wrong on a registry page nobody looks at twice.\n\n`apply` writes to `mktemp` and `mv`s rather than using `sed -i`, because `-i`'s spelling differs between GNU and BSD. In `--check` mode it reports and increments `drift` instead of moving the file, then exits 1 with the count.\n\nCI enforces this (`.github/workflows/ci.yml`, \"Versions are in step\"). If you bump the workspace version, run the script; if you add a new place that repeats the version, add an `apply` call for it.\n\nThe script also lives in `tools/`, not `scripts/` — `scripts/` is reserved for a loop's own detector scripts, and the repository deliberately ships none so the `pre_execution` refusal keeps its teaching value.\n\n---\n\n## How a release ties it together\n\n```\ntag v* → build (6 targets, --profile dist, --locked)\n       → publish (collect archives, sha256sum * > SHA256SUMS, gh release create)\n           ├─ pypi     (Trusted Publishing; needs the release to exist first)\n           ├─ npm      (npm publish --provenance)\n           └─ homebrew (render url+sha256, push to the tap)\n       └─ crates      (independent; gated on vars.PUBLISH_CRATES)\n```\n\n`pypi`, `npm` and `homebrew` all `need: publish` rather than `build`, because the wheel and the npm package are launchers that download from the GitHub release — publishing either before that release exists ships something briefly broken. `crates` hangs off `build` and nothing depends on it, so skipping it skips crates.io and nothing else.\n\nThe release builds `--profile dist` (fat LTO, one codegen unit) while the source installers build `--release`. Same code; the dist profile trades build time nobody is waiting on for ~16% off the download.\n\n## Invariants to preserve\n\n1. **`manifest.json` stays flat, one array element per line.** `manifest.sh` is `sed` and `awk`, by necessity.\n2. **Any new shared fact between `install.sh` and `install.ps1` goes in the manifest**, not into both scripts. Three copies of a URL is three chances to move the repository and fix two of them, and the one nobody fixes is the script for the OS they are not on.\n3. **Never skip the checksum comparison** in `install.js` or `_read`/`_expected_digest`, and never widen `_extract` to `extractall`.\n4. **Target-triple tables must match `release.yml`'s matrix** — in both downloaders, or one platform silently loses prebuilt binaries.\n5. **Do not add a \"`loopsmith` already on `PATH`\" fast path** to the Python launcher, and do not remove the `argv[0]` guard in `__main__.main()`.\n6. **A postinstall download failure must stay non-fatal** in npm; the launcher reports it.\n7. **Run `./tools/sync-version.sh` after any version bump**, and add an `apply` call for any new file that repeats the version.\n8. **Edit the formula body in `Formula/loopsmith.rb`**, never in the tap; expect `url` and `sha256` to be overwritten at release time.","evolution-perturbation":"# Evolution & Perturbation\n\n# Evolution & Perturbation\n\nTwo sibling modules in `loopsmith-run` that let a loop change how it works without ever changing what counts as done.\n\n| Module | Question it answers | Effect |\n|---|---|---|\n| `crates/loopsmith-run/src/evolve.rs` | \"What did this run learn about its own tooling and shape?\" | Writes evidence and proposals. Never mutates config. |\n| `crates/loopsmith-run/src/perturb.rs` | \"The loop has stopped moving — what should it vary?\" | Alters dispatch order, tier, sub-agent, and prompt for one iteration. |\n\nBoth are driven from `running.rs`, and both are bounded by the same invariant: **the gate owns the definition of done, and neither module can touch it.** Everything here is method, not criteria.\n\n> Note on paths: these modules live in the `loopsmith-run` crate (`runtime/crates/loopsmith-run/src/`), not in `loopsmith-cli`. The CLI only surfaces their output.\n\n---\n\n## Where they sit in an iteration\n\n```mermaid\nflowchart TD\n    prepare[\"running::prepare\"] -->|stall detected| choose[\"perturb::choose\"]\n    prepare -->|next untried skill| cand[\"evolve::next_candidate\"]\n    choose --> disp[\"waves::dispatch\"]\n    cand --> disp\n    disp -->|RanNode + node_skills| rule[\"running::rule\"]\n    rule -->|\"evolve::harvest_judgments\"| gate[\"loopsmith_gate::evaluate_all\"]\n    gate -->|verdicts| trials[\"evolve::record_trials\"]\n    trials --> props[\"evolve::write_proposals\"]\n```\n\n`prepare` (`running.rs:371`) decides at the *top* of the iteration what to vary. `rule` (`running.rs:450`) and the block at `running.rs:246` read the *bottom* of the iteration and turn the outcome into evidence.\n\n---\n\n## `perturb` — the stall response\n\n### Why it exists\n\n`no_progress_iterations` is the halt: stop the line rather than spin. `no_progress_iterations_randomness` fires *earlier* and does something else first, because a loop that repeats the identical approach three times and then quits has learned nothing. It must be strictly less than the halt threshold or it never fires, and it is `Option<u32>` — unset means halt without ever varying, since perturbation costs a provider call.\n\n### The fixed menu\n\n```rust\npub enum Perturbation {\n    Reorder,          // dispatch each wave's nodes in a different order\n    Escalate,         // run builders one tier stronger\n    Explore,          // force an untried sub-agent onto a builder\n    Reframe(String),  // a specific different approach, in words\n}\n```\n\nThe agent *picks from* the menu; it does not *write* the menu. This is the module's central safety property. `Perturbation::from_choice` matches four lowercase literals and returns `None` for anything else, so an answer like `CHOICE: mark the goal satisfied` is discarded rather than interpreted. `Reframe` is the one variant carrying free text, and it is refused when the `DIRECTIVE` line is missing or blank.\n\nThree methods define what a perturbation actually does:\n\n- **`tier_for(base)`** — only `Escalate` moves anything: `Cheap → Standard`, everything else `→ Strong`. Escalation saturates at `Strong`; there is no runaway.\n- **`directive()`** — the extra prompt text, always wrapped in a `## The loop has stalled` block that ends with \"It does not change what counts as done — the gate is unchanged.\" A test (`every_directive_says_the_gate_is_unchanged`) asserts that sentence is present for every variant, because a stall directive must not read as permission to lower the bar.\n- **`describe()`** — the one-line form written to the ledger.\n\n### Determinism\n\n`seed_for(run_id, iteration)` is FNV-1a over the run id mixed with the iteration — reusing the hash the provider crate already uses for prompt digests, so the workspace carries one hash rather than two. The seed is logged in hex alongside the choice (`running.rs:406`), so a run that took a strange turn can be replayed.\n\n`shuffle` is Fisher-Yates over `next_random`, a SplitMix64 step. `fallback(seed)` draws from `Reorder | Escalate | Explore` only — never `Reframe`, which needs text a PRNG cannot supply.\n\n### Asking the agent first\n\n`choose` returns `(Perturbation, bool)`, the flag saying whether an agent or the seeded fallback decided, so the ledger can distinguish them.\n\n`ask_agent` bails immediately when `cfg.cascade_for(Tier::Cheap)` is empty — no cheap provider, no question. Otherwise it dispatches a `Tier::Cheap` `InvokeRequest` under the synthetic node id `\"perturb\"` with a strict output contract:\n\n```\nCHOICE: <reorder|escalate|explore|reframe>\nDIRECTIVE: <one sentence, required only when CHOICE is reframe>\n```\n\n`parse_choice` is line-oriented and unforgiving: split on the first `:`, uppercase the key, keep only `CHOICE` and `DIRECTIVE`, and hand the result to `from_choice`. Anything off-menu yields `None` and the caller falls back to the seed.\n\n### What the agent is allowed to see\n\n```rust\npub struct Stall<'a> {\n    pub stale_iterations: u32,\n    pub failing: &'a [(String, String, String)],  // (target, check name, evidence)\n    pub recent: &'a [IterationSummary],\n}\n```\n\nDeliberately narrow: failing blocking checks and the last two iteration summaries (`running.rs:394` takes the tail). No gate handle, no config, no store. The prompt states outright that a separate deterministic gate owns whether anything is finished.\n\n### How a perturbation reaches the work\n\n| Variant | Applied in | Mechanism |\n|---|---|---|\n| `Reorder` | `waves.rs:285` | `perturb::shuffle(&mut ids, inputs.seed)` before `eligible_nodes` |\n| `Escalate` | `dispatch.rs:179` | `p.tier_for(node.tier)` — **skipped for `Role::Judge`** |\n| `Explore` | `running.rs:427` | Fills `explore_now` from `explore_candidates.first()` even when `explore` is off |\n| `Reframe` / all | `prompts.rs:100` | `p.directive()` appended — **skipped for `Role::Judge`** |\n\nThe two judge exclusions are the same argument twice. Escalating the checker alongside the worker changes the bar at the moment the work changes; telling the checker to \"try a different approach\" is how a stalled loop talks itself into a lower bar. Judges keep their configured tier and their fixed toolset (`resolve_skills`, `waves.rs:665`, attaches exploration candidates to `Role::Builder` only).\n\n`Explore` is also the one case where a sub-agent trial happens without opting in — normally `skills.explore` gates it, but a stall makes the spend worth it unprompted. When `explore_candidates` is empty the loop records that it wanted to explore and could not, rather than failing silently.\n\n---\n\n## `evolve` — evidence and proposals\n\nNothing in this module changes the config, and nothing in it can reach goal state. The loop may discover that a sub-agent helps; adopting it is a human's edit.\n\n### Exploration scheduling\n\n`next_candidate(cfg, trials)` returns the candidate to trial this iteration, or `None`. It requires `skills.explore` to be on with a non-empty `explore_candidates`, filters out anything already configured on a graph node, drops candidates that already have `min_trials` behind them, and then picks the **least-tried** remaining one — so evidence accumulates evenly instead of piling onto whichever name sorts first.\n\n### Recording what a skill was worth\n\n```rust\npub struct RanNode {\n    pub node_id: String,\n    pub goals: Vec<String>,\n    pub tokens: Option<u64>,\n}\n```\n\n`RanNode` exists because this used to be a four-tuple threaded through three functions, which is how `SkillTrial.tokens` came to be permanently `None`. `waves.rs:876` constructs one per dispatch.\n\n`record_trials` joins three things — the nodes that ran, `node_skills` (skill name plus its `source`, from `resolve_skills`), and the gate's `verdicts` — into one `SkillTrial` per (node, skill):\n\n- `pass_rate` is the mean `blocking_pass_rate()` across **only the goals this node advances**, clamped to `0.0..=1.0`. Scoring against the whole loop would give every skill in the graph one shared verdict.\n- `satisfied` requires every relevant verdict satisfied.\n- `tokens` carries what the node cost, because a skill that lifts the pass rate while tripling the bill is not the same proposition as one that does it for free.\n\nNodes with no skills, or whose goals have no verdicts, are skipped rather than recorded as zeroes.\n\n### Harvesting judge verdicts\n\n`harvest_judgments(cfg, rec, iteration)` reads this iteration's episodes, keeps those whose node has `Role::Judge`, and hands each output to `judgment::parse(&ep.output, &ep.provider_id, &builder_provider)`.\n\nThe interesting part is `builder_provider`: it is resolved by walking the judge node's `depends_on` and finding the matching episode's `provider_id`. Independence is measured against the provider that actually produced the work, taken from the episode record — not from the judge's own claim about what it reviewed. A store read failure returns an empty vec, so a judgment can be lost but never invented.\n\n### The proposal desk\n\n`Desk` is the private writer that all four proposal producers share. It carries the set of `{kind:subject}` pairs already written *this run*, seeded from `store.proposals(run_id)` — a proposals file with forty identical entries is a proposals file nobody reads.\n\n`Desk::write` returns `usize` (1 or 0) so callers can sum without each keeping a mutable counter. Its sequence:\n\n1. **Dedupe** on `{kind:?}:{subject}`.\n2. **Ask the gate.** `loopsmith_gate::admit_proposal(cfg, evolution_kind(kind), patch)` refuses a kind outside `evolution.allowed_kinds`, a patch that is not readable YAML, or a patch whose leaf paths touch `safety.protected`. A refusal is logged as `GateEvaluated` and nothing is written. The gate rules on a proposal before it is written, the same as on anything else that could change what the loop is held to.\n3. **Stamp expiry** via `Proposal::with_default_expiry()`, derived from the kind rather than passed in by each caller — so a new kind cannot be added without deciding how long its evidence stays true. (`TrySkill` ages out in seven days; `ChangeCriteria` never expires.)\n4. **Persist** and log `ProposalWritten`.\n\n`evolution_kind` maps the desk's vocabulary (what the loop observed) onto the policy's (what part of the config would change), exhaustively:\n\n| `memory::ProposalKind` | `core::ProposalKind` |\n|---|---|\n| `AdoptSkill`, `TrySkill` | `NewSkill` |\n| `DropSkill` | `SkillUpdate` |\n| `ReshapeGraph` | `GraphChange` |\n| `ChangeCriteria` | `ValidationChange` |\n\n### The four producers\n\n`write_proposals` takes `Observed { exhausted_nodes, verdicts }` and sums four calls. The first three read the run's own behaviour; only the fourth needs the accumulated trial record.\n\n**`propose_reshape`** — for each node that hit `max_revisions_per_node` with goals unsatisfied. A node that spends its whole revision budget is evidence about the *graph*, not the node: one unit of work was asked to do something it cannot do in one step. The proposal ships a suggested YAML patch adding a `{node}-prepare` researcher upstream. Rewriting the graph itself would be the loop editing its own config, which it may never do.\n\n**`propose_criteria_changes`** — for every blocking, failed check whose `evidence` starts with `\"detector error\"`. A detector that cannot run is not a failing check, it is a broken one; it fails closed forever and no amount of work by any node changes the answer. No patch, because the fix is not mechanical.\n\n**`propose_try_skill`** — fires only when `explore` is **off**, candidates are listed, and something is still unsatisfied. Exploration is off by default because it spends real money; when the run is failing anyway, saying \"there is something here you have switched off\" is worth more than silently not doing it. Patch: `execution.skills.explore: true`.\n\n**`skill_proposals`** — delegates to `loopsmith_skills::recommend(&configured, &trials, min_trials, 0.8, 0.2)`. Skills below `min_trials` are ignored; at ≥80% satisfaction and not configured → `AdoptSkill`; at ≤20% and configured → `DropSkill`. `score_skills` supplies the rate and trial count quoted in each rationale.\n\n---\n\n## Contributing\n\n**Adding a perturbation variant.** Extend the enum, then handle it in `from_choice`, `describe`, `tier_for`, and `directive` — and add its name to the menu inside `ask_agent`'s prompt, or the agent can never select it. Decide whether `fallback` should reach it (it must be text-free to qualify). Then wire the actual effect: order in `waves.rs`, tier in `dispatch.rs`, prompt in `prompts.rs`. Ask whether a judge should see it; the default answer is no. `every_directive_says_the_gate_is_unchanged` will fail until the directive carries the guarantee sentence.\n\n**Adding a proposal kind.** Add the variant to `loopsmith_memory::ProposalKind`, give it a lifetime in `Proposal::default_lifetime_ms`, map it in `evolution_kind`, and add a producer that goes through `Desk::write` rather than `put_proposal` directly — the desk is where deduplication, the gate check, and expiry live.\n\n**Changing the adopt/drop thresholds.** They are literals at the `recommend` call in `skill_proposals` (`evolve.rs:375`), not config. Moving them to config means deciding whether they belong under `safety.protected`.\n\n**Invariants to preserve.** No path in either module may write a verdict, a goal state, or the config. A perturbation must survive the \"could a stalled loop read this as permission to stop trying?\" reading. And anything derived from a seed must stay reproducible from `(run_id, iteration)` alone.\n\n**Tests.** `perturb.rs` carries its own `#[cfg(test)]` module covering seed stability, shuffle determinism and totality, fallback confinement to the menu, parse strictness, and tier saturation. Evolution is exercised end-to-end from `loopsmith-run/src/tests.rs` (`skill_trials_are_recorded_and_become_proposals`); the interaction between reordering and phase filtering is covered in `loopsmith-cli/tests/stress.rs:1202`.","example-loops":"# Example Loops\n\n# Example Loops — `config/examples/`\n\nFifteen worked loop configurations that ship with loopsmith, plus a frozen 0.3-era corpus in `config/examples/legacy/`. They are simultaneously the primary teaching material, the fixture set for the integration tests, and the example library compiled into the web UI. Editing one of these files touches all three roles, so this module has more invariants around it than its extension (`.yaml`, `.md`) suggests.\n\n## What the module is for\n\nAn example is a complete, runnable `LoopConfig` written around one lesson — how a gate is built out of scripts rather than opinions, how `human_checkpoint` stops an irreversible action, how `evolution.baseline` fences self-modification. The header comment at the top of each `.yaml` states that lesson explicitly and is the first thing to read:\n\n```\n# Draft and send cold outreach — behind a human checkpoint, with an opt-out.\n# ...\n# Two decisions carry the weight:\n#   1. `human_checkpoint` covers sending. ...\n```\n\nThese are the most-copied files in the repository. That is also why they are the strictest: three test suites and two CI steps exist purely to stop them drifting from the shape the tool actually has.\n\n## Every example ships as a pair\n\nEach loop is authored **once**, as `<name>.yaml`. The `<name>.md` beside it is *generated* from it and must never be hand-edited:\n\n```bash\nloopsmith loop convert config/examples/research-loop.yaml   # prints the Markdown twin\n./tools/sync-examples.sh                                     # regenerate all twins + sync the crate copies\n./tools/sync-examples.sh --check                             # fail if anything is stale (what CI runs)\n```\n\nThe two formats are the same model in two grammars — YAML keys on one side, `## Section` / `### item` / `- field: value` bullets on the other. `loopsmith-core`'s `render_md` and `parse_md` are inverses, and `runtime/crates/loopsmith-core/tests/md_roundtrip.rs` enforces it from both directions:\n\n- `every_example_config_survives_a_markdown_round_trip` — load the `.yaml`, render, re-parse, require an identical `LoopConfig`.\n- `every_shipped_md_example_means_the_same_as_its_yaml_twin` — load both files on disk and compare. This is the test that catches a hand-edited `.md`.\n\nBoth comparisons normalise by trimming trailing whitespace inside strings: a YAML folded scalar (`>`) ends in a newline that a Markdown bullet cannot carry, and that is the only difference the Markdown grammar is allowed to introduce.\n\nTwo spellings of the same field coexist across the library and both normalise to the same model. Older examples use the `isolated: true` shorthand on a node; `container-refactor-loop` and `self-tuning-loop` use the explicit form:\n\n```yaml\nisolation:\n  mode: worktree     # or: none | container (+ network: bool)\n```\n\nThe rendered `.md` always shows the explicit form, which is why `write` appears as `isolation: mode: worktree` in `blogger-loop.md` but as `isolated: true` in `blogger-loop.yaml`.\n\n## Anatomy\n\nEvery 1.0 example has the same four top-level sections — `intent`, `execution`, `safety`, and optionally `evolution` — plus `name`, `version`, `description`, `environment`, and `features`.\n\n**`intent`** — what the loop is for, in terms a person can check.\n- `background`: `key`/`value`/`note` triples. These are the knobs a copier edits — `categories`, `daily_cap`, `test_command`, `prevalence_rule`. Values that must be replaced say so in the `note` (\"Replace. `Any good idea` is not a segment and returns nothing usable\").\n- `prerequisites`: the manual work that must precede automation. See below.\n- `goals`: named, `depends_on`-ordered, with a `priority`.\n- `success`: usually a single `target: overall`, `mode: percentage`, `threshold: 1.0` entry meaning \"every blocking check passes\".\n\n**`execution`** — how the work gets done.\n- `graph.nodes`: `id`, `role` (`researcher`, `builder`, `judge`, `adversary`), `instruction`, `depends_on`, `goals`, `stage`, `tier`, `weight`, `isolation`. `graph.join.strategy`, `graph.concurrency` (`mode: auto`, `cap`, `min_marginal_gain`), and `graph.container_image` where containers are used.\n- `providers`: the same three-provider cascade in nearly every example — `ollama` (cheap, local), `claude` (standard, `claude_code`), `openai` (strong, `curl` + `requires_env: [OPENAI_API_KEY]`) — with `cascade` mapping tiers to ordered provider lists and `enforce_judge_independence: true`.\n- `phases.items` + `phases.dependency`: named stages with a `guideline`, wired as `research -> draft -> revise`. Node `stage` values must match a phase name.\n- `default_skills`, `skills`, `memory`, `triggers`.\n\n**`safety`** — what must not happen, and when to stop.\n- `checks`: the gate. Each has a `target` (a goal name or `overall`), `mode: objective | subjective`, a `statement`, and a `detector` of type `file_exists`, `regex_match`, `threshold`, `script`, or `judge`.\n- `gates.stop` (`max_iterations`, `max_cost_usd`, `max_wall_clock_seconds`, `no_progress_iterations`, `stop_on_overall_success`), and in `container-refactor-loop` also `gates.entry` and `gates.rollback`.\n- `limits.global`: prose `rules`, `forbidden_paths`, `forbidden_commands`, `max_seconds`, `human_checkpoint`.\n- `recovery` per failure class, `alerts`, `protected.components`.\n\n**`evolution`** — present and `enabled: true` in exactly one example (`self-tuning-loop`), with `baseline`, `max_regression`, `allowed_kinds`, `require_sandbox`, `require_approval`, `keep_rollback`.\n\n### The deliberate refusal\n\nEvery shipped example **fails `loopsmith loop validate` with exactly one error**, and that is load-bearing, not a bug:\n\n```bash\n$ loopsmith loop validate config/examples/research-loop.yaml\n  error  intent.prerequisites: 2 step(s) not marked done: …\n```\n\n`check_pre_execution` in `runtime/crates/loopsmith-core/src/validate.rs:267` emits that error while any `prerequisites` entry has `done: false`, and warns when the list is empty at all. Every example ships with all of its steps false because an example config describes a job nobody has done yet. A copier does the job by hand, ticks the steps with what they actually did, and only then can the loop run.\n\nCI turns this into the cheapest regression signal in the project: the **\"Every example refuses for exactly one reason\"** step (`.github/workflows/ci.yml:103`) validates all 30 example files and fails if any produces more than one error or any warning at all. A schema change that breaks a config shows up there immediately.\n\n### Conventions that hold across the library\n\nThese are not enforced by the schema, but breaking one in a new example makes it teach the wrong thing:\n\n- **The judge sits on a different provider from the writer.** `enforce_judge_independence: true` everywhere, `judge` nodes pinned to `provider: openai` / `tier: strong`. `container-refactor-loop` carries a second provider family *purely* so a judge has somewhere to run — with one provider, judge independence refuses every judgment and nothing can pass.\n- **Objective and subjective checks are mixed, and the objective ones carry the weight.** `blogger-loop` is the clearest case: \"sounds human\" is decomposed into three `threshold` detectors (`sentence_length_variance`, `stock_transitions_per_500w`, `hedging_density`) *plus* a `judge`, and all four are blocking.\n- **Irreversible actions go behind `human_checkpoint`**, not behind a stern `instruction`. Publishing, sending, paying, deploying, adopting a proposed config value.\n- **Anti-self-grading checks.** `account-watch-loop` scores last run's predictions in its *first* phase, before making new ones, and enforces it with `no-retroactive-predictions` (a `script` detector over timestamps).\n- **`features.self_evolution: false`** in every example but `self-tuning-loop`.\n\n## The library\n\n| Example | The lesson it carries |\n|---|---|\n| `research-loop` | Smallest example whose checks are all deterministic. Cited brief, adversary node, `source_floor`. |\n| `refactor-loop` | The test suite as the gate; editing a test to make it pass is a blocking failure. |\n| `container-refactor-loop` | Wide parallelism done safely: three `builder` nodes in one `wait_for_all` wave, each `isolation: mode: container` over its own worktree, `gates.entry` requiring a clean tree, `gates.rollback` on a red suite. |\n| `self-tuning-loop` | The fence around self-evolution — `evolution.baseline` measured from real manual runs, `max_regression: 0.05`, `allowed_kinds` that deliberately exclude `validation_change`, and `protected.components` a proposal may never touch. |\n| `landing-page-loop` | A strong gate for a design task: `npm run build` exits zero, Lighthouse ≥ 90/95, page weight < 500KB, every CTA resolves. Taste is one judge among many, not the verdict. |\n| `blogger-loop` | Gating \"reads like a person wrote it\" by measuring the mechanical tells and putting the taste judgment on another provider. |\n| `idea-radar-loop` | Ideas that trace to dated verbatim complaints, with a numeric `pain_threshold` and an honest competitor check. |\n| `trend-radar-loop` | A `rise_definition` as a number (2× the trailing 7-day average), every trend carrying the post IDs it came from. |\n| `account-watch-loop` | Predictions written with timestamps and scored by a *later* run; unfalsifiable predictions count as misses. |\n| `traffic-loop` | Measuring referred sessions from an analytics export rather than posts made, with per-venue rules as constraints. |\n| `sales-leads-loop` | Lawful collection: `permitted_sources` / `forbidden_sources`, and `lawful-basis-recorded` as a blocking check. |\n| `cold-outreach-loop` | The most constrained example. The loop drafts and queues; a human releases. `suppression-honoured` and `opt-out-present` are blocking. |\n| `marketing-automation-loop` | Claims sourced to the product's own site, one post per platform per day, publishing behind a checkpoint. |\n| `viral-game-loop` | Decomposing an ungateable word (\"viral\") into four checkable ones: builds, runs headless, time-to-first-play, cold playtest. |\n| `x402-agent-loop` | An agent that spends money, with two documented postures (supervised as shipped; autonomous by removing one `human_checkpoint` line) behind a funded float, a merchant allowlist, and `max_cost_usd`. |\n\n`wiki/Examples.md` carries this table for users, plus a \"which one to start from\" section. Keep the two in step when adding an example.\n\n### `config/examples/legacy/` — the migration corpus\n\nThirteen 0.3-shaped copies of the examples that predate 1.0 (everything except `container-refactor-loop` and `self-tuning-loop`). They are **not documentation, and nothing links to them.** They exist so `runtime/crates/loopsmith-core/tests/legacy_corpus.rs` can assert three things:\n\n- `every_legacy_example_migrates_to_the_one_beside_it` — loading the 0.3 file and the 1.0 file of the same name must produce identical `LoopConfig`s. That is a stronger claim than \"the old file still parses\": it says the relocation table puts every key exactly where the 1.0 file puts it by hand, checked against thirteen configs someone actually wrote.\n- `the_legacy_corpus_is_actually_legacy` — each corpus entry must still trip at least one relocation, or it proves nothing.\n- `no_shipped_example_still_uses_a_03_key` — the inverse for the files outside `legacy/`. A shipped example needing the relocation table would print a deprecation notice to someone who just installed the tool.\n\nDon't migrate a `legacy/` file. Don't add a 0.3 key to a shipped one.\n\n## How an example reaches a user\n\n```mermaid\ngraph TD\n    Y[\"config/examples/&lt;name&gt;.yaml<br/>(the only hand-edited copy)\"]\n    MD[\"&lt;name&gt;.md twin\"]\n    CRATE[\"loopsmith-web/templates/<br/>examples/&lt;name&gt;.yaml\"]\n    EMB[\"EMBEDDED const<br/>(include_str!)\"]\n    API[\"GET /api/examples<br/>GET /api/examples/{id}\"]\n    TESTS[\"md_roundtrip · legacy_corpus<br/>cli stress harness\"]\n\n    Y -->|loop convert| MD\n    Y -->|cp| CRATE\n    CRATE --> EMB\n    EMB --> API\n    Y -.->|\"repo override,<br/>no rebuild\"| API\n    Y --> TESTS\n    MD --> TESTS\n```\n\nBoth derived copies are produced by `tools/sync-examples.sh`, and both have a test that fails when it has not been run.\n\nThe crate copy exists for a specific reason documented in `runtime/crates/loopsmith-web/src/examples.rs`: `include_str!` cannot reach above the package root, and `config/` is excluded from the published tarball. An example served from `config/` works in a checkout and 404s for everyone who installed from crates.io, npm, pip, or brew.\n\nAt runtime the web UI resolves examples from three sources, first to claim an `id` winning:\n\n1. `~/.loopsmith/examples/*.yaml` — the user's own (`origin: \"user\"`)\n2. `config/examples/*.yaml` relative to the working directory (`origin: \"repo\"`) — live edits in a checkout appear without a rebuild\n3. the compiled-in copies (`origin: \"embedded\"`)\n\n`examples::list()` builds one `ExampleCard` per id, and none of its fields are hand-written metadata: `name`, `blurb`, `goals`, `validations`, `judge_validations`, `nodes`, `providers`, `trigger`, `max_iterations`, `max_cost_usd` are all parsed out of the config itself, so a card cannot disagree with the loop it describes. `judge_validations` is surfaced deliberately — a loop judged entirely by models is a loop whose gate is an opinion. An example that fails to parse is dropped rather than shown as a card that errors on click.\n\n## The examples as the integration fixture set\n\n`runtime/crates/loopsmith-cli/tests/stress.rs` runs **every** example through the real binary:\n\n- `every_example_completes_an_iteration_and_leaves_a_consistent_record` — one capped iteration with satisfiable detectors; asserts the ledger opened, recorded why it stopped, that the run log and ledger agree line for line, and that one iteration left exactly one summary.\n- `every_example_survives_a_run_where_nothing_passes` — no stubs, no artifacts, no metrics; the run must exit non-zero and write `StopGateTriggered` to the ledger rather than panic.\n\n`tests/harness/mod.rs` is what makes a shipped example runnable, and reading it explains several things about the configs:\n\n- `unblock()` flips every `prerequisites.done` to `true` — otherwise nothing would validate.\n- `deterministic_providers()` rewrites each provider to `printf` while **preserving provider ids**, because `enforce_judge_independence` compares ids; renaming them would silently disable the check the examples are demonstrating.\n- `stub_scripts()` generates a stub for every `scripts/…` detector a config names. **The examples reference 29 distinct script detectors between them and the repository ships none of them.** `scripts/check-suppression.sh`, `scripts/check-timestamps.sh`, `scripts/word-count.sh` and the rest are contracts a copier implements — an example is deliberately not a turnkey program.\n- `satisfy_files()` / `satisfy_metrics()` write the artifacts and `metrics.json` keys the detectors name. The stub artifact body carries a URL and a `post_id:` line because that is what the shipped `regex_match` detectors look for.\n\n`research-loop.yaml` and `refactor-loop.yaml` additionally serve as named fixtures in `tests/surface.rs`, `tests/opt_in.rs`, and `tests/grammar.rs`. Changing either one can move assertions in those files.\n\n## Adding or changing an example\n\n1. Author `config/examples/<name>.yaml` only. Lead with a header comment stating the one lesson. Point `prerequisites` at real manual work and leave every step `done: false`.\n2. Give the gate at least one objective detector per goal, and put any judge on a provider the builder does not use.\n3. `cd runtime && cargo build --release --bin loopsmith`, then `./tools/sync-examples.sh`. This regenerates the `.md`, copies the YAML into `runtime/crates/loopsmith-web/templates/examples/`, and removes orphans in both directions.\n4. **Add an `include_str!` entry to `EMBEDDED` in `runtime/crates/loopsmith-web/src/examples.rs`.** The sync script copies the file but does not touch that array; `embedded_examples_match_the_source_of_truth` compares `EMBEDDED.len()` against the YAML count on disk and fails if you forget.\n5. Add a row to `wiki/Examples.md`, and to \"Which one to start from\" if it is the best example of something.\n6. `cargo test --workspace` and `loopsmith loop validate` on both files — exactly one error, zero warnings.\n\nThings that will bite:\n\n- Several test and CI thresholds are floors tied to the current library size: `seen -ge 30` in CI (15 YAML + 15 Markdown), `checked >= 15` in `no_shipped_example_still_uses_a_03_key`, `checked >= 13` over the legacy corpus. Adding examples is free; removing one means updating the floor deliberately.\n- Every `.md` needs a `.yaml` twin and vice versa — an orphan in either direction is a failure (`sync-examples.sh --check`, and `every_shipped_md_example_means_the_same_as_its_yaml_twin`).\n- A `regex_match` detector can only name an artifact that one of the same config's `file_exists` detectors registers, under its full path or its stem. Anything else has nothing to match and fails closed for the life of the loop.\n- The module doc comment at the top of `examples.rs` still says \"Thirteen working loops ship inside the binary\" while fifteen are in `EMBEDDED`. Fix it next time you add one.","execution-graph-concurrency-planning":"# Execution Graph & Concurrency Planning\n\n# Execution Graph & Concurrency Planning (`loopsmith-graph`)\n\nNodes declare `depends_on`. This crate turns that declaration into an execution schedule: wave groupings, a critical path, and a worker count derived from arithmetic rather than from a guess.\n\nEverything here is pure, deterministic, and cheap enough to run before every iteration. Nothing in this crate dispatches work, touches a filesystem, or talks to a provider — it answers \"what can run together, and how many workers is that worth?\" and hands the answer to `loopsmith-run`.\n\n## The three jobs\n\n1. **Cycle detection.** A cyclic dependency graph is a config bug. It is caught before any node is dispatched, with the stuck node IDs named in the error.\n2. **Wave scheduling.** Kahn's algorithm, grouped by level. Every node in a wave has no unmet dependency, so every node in a wave may run concurrently.\n3. **Sizing.** The critical path is the floor on wall-clock time. Amdahl's law is the cap on what more workers can buy. Both are known before dispatch, which is the point — you size the fleet from the graph instead of from optimism.\n\n## Entry point: `plan`\n\n```rust\npub fn plan(spec: &GraphSpec) -> Result<Plan, GraphError>\n```\n\n`plan` is the full pass and the function most callers want. It composes the five primitives below and returns a `Plan`:\n\n```mermaid\nflowchart TD\n    P[\"plan(spec)\"] --> W[\"waves()\"]\n    P --> CP[\"critical_path()\"]\n    P --> PF[\"parallel_fraction()\"]\n    P --> CC[\"choose_concurrency()\"]\n    P --> SC[\"speedup_ceiling()\"]\n    CP --> W\n    CC --> A[\"amdahl()\"]\n```\n\n`critical_path` calls `waves` itself to get a topological order, so a cyclic graph fails in both places; `plan` simply surfaces whichever `GraphError` comes back first.\n\nThe resulting `Plan` carries the schedule *and* the reasoning behind the worker count:\n\n| Field | Meaning |\n|---|---|\n| `waves` | ordered `Vec<Wave>`; everything in one wave is concurrency-safe |\n| `critical_path` / `critical_path_cost` | the longest weighted chain and its accumulated weight |\n| `total_cost` | sum of all node weights — the fully serial cost |\n| `parallel_fraction` | `p`, derived from the graph |\n| `concurrency` | the chosen worker count |\n| `predicted_speedup` | `amdahl(p, concurrency)` |\n| `speedup_ceiling` | `1 / (1 - p)` — what no worker count can beat |\n\nKeeping the inputs alongside the decision is deliberate: `loopsmith-web` and `loopsmith plan` both render the *why*, not just the number.\n\n## `DagNode`: one scheduler, two graphs\n\n```rust\npub trait DagNode {\n    fn id(&self) -> &str;\n    fn deps(&self) -> &[String];\n    fn weight(&self) -> f64;\n}\n```\n\nThree facts are all scheduling needs: what a thing is called, what it waits for, what it costs. The trait exists so the scheduler is not welded to `NodeSpec`.\n\nloopsmith has two DAGs over the same topology problem:\n\n- **The execution graph** (`execution.graph`) — `NodeSpec`, whose `weight` is a real relative cost.\n- **The phase graph** (`execution.phases`) — `Phase`, keyed by `name`, which always weighs `1.0`. Phases carry no cost of their own; the work lives in the nodes assigned to them, so the critical path through the phase graph is simply its longest chain.\n\nBoth `impl DagNode` in this crate. A second copy of Kahn's algorithm would be a second place for a cycle bug to hide, and the test `any_dag_node_type_schedules_through_the_same_code` builds a throwaway `Step` type — no role, no provider, no instruction — to keep that decoupling honest.\n\n`index_nodes` is the shared helper: it builds a `BTreeMap<&str, &N>` by ID. The `BTree*` collections throughout are not incidental — they are what makes wave membership and error text deterministic across runs.\n\n## Wave scheduling\n\n```rust\npub fn waves<N: DagNode>(nodes: &[N]) -> Result<Vec<Wave>, GraphError>\n```\n\nStandard Kahn, with one deviation: instead of draining the ready queue one node at a time, each iteration drains the *entire* current frontier as a level. That level becomes one `Wave`, with `nodes` sorted so the output is stable.\n\nTwo failure modes, both returned rather than panicked:\n\n- `GraphError::UnknownNode(id)` — a `depends_on` entry names a node that is not in the list. Detected during indegree construction, before any traversal.\n- `GraphError::Cycle(ids)` — fewer nodes were placed than exist. The nodes still carrying a nonzero indegree are the ones in or downstream of the cycle, and they are joined into the message.\n\n## Critical path\n\n```rust\npub fn critical_path<N: DagNode>(nodes: &[N]) -> Result<(Vec<String>, f64), GraphError>\n```\n\nA longest-weighted-path pass over the wave order. Because waves are a topological order, a single forward sweep suffices: for each node, take the heaviest already-computed predecessor as the base, add the node's own weight, and record which predecessor was chosen in a `prev` map. The maximum entry in `best` is the path's end; walking `prev` backwards and reversing yields the path.\n\nAn empty node list returns `(vec![], 0.0)` rather than erroring.\n\nThe test `critical_path_follows_the_heaviest_chain` pins the behavior: with `a(1) → b(5) → d(1)` and `a(1) → c(1) → d(1)`, the answer is `[\"a\", \"b\", \"d\"]` at cost `7.0` — the heaviest chain, not the longest by node count.\n\n## The concurrency decision\n\nThis is the part worth understanding before changing anything.\n\n### Deriving `p` from the graph\n\n```rust\npub fn parallel_fraction(total_cost: f64, critical_cost: f64) -> f64\n```\n\n`p = (total_cost - critical_cost) / total_cost`, clamped to `[0, 1]`. The critical path is work that genuinely cannot be parallelized — each step reads an upstream output. Everything else can, in principle, run alongside it. So the parallel fraction is the share of total work *not* stuck on the critical path.\n\nThis is the mechanical form of the \"and then\" test, and it means `p` is a property of the declared graph, not a tuning knob. A pure chain gives `p = 0.0` exactly (`a_pure_chain_has_no_parallel_fraction`).\n\n### Amdahl's law\n\n```rust\npub fn amdahl(p: f64, n: usize) -> f64       // 1 / ((1 - p) + p/n)\npub fn speedup_ceiling(p: f64) -> f64        // 1 / (1 - p), or INFINITY at p = 1\n```\n\n`amdahl` clamps `p` and returns `0.0` for `n == 0`. The numbers it produces are the whole argument for not sizing a fleet by vibes: at `p = 0.95`, sixteen workers buy **×9.14**, not ×16; 256 workers buy ×18.6 against a ceiling of ×20. `amdahl_matches_the_published_table` asserts exactly these values, so they are a contract, not documentation prose.\n\n### Choosing `n`\n\n```rust\npub fn choose_concurrency(concurrency: &Concurrency, waves: &[Wave], p: f64) -> (usize, f64)\n```\n\nEvery mode is bounded by `widest` — the node count of the largest wave, floored at 1. No mode can return more workers than the graph could ever keep busy at once.\n\n- **`Sequential {}`** → `(1, amdahl(p, 1))`, which is always `1.0`.\n- **`Fixed { max_parallel }`** → `max_parallel`, floored at 1 and clamped down to `widest`. `fixed_concurrency_is_capped_by_the_widest_wave` covers the clamp: asking for 32 workers over a two-node graph gets you 2.\n- **`Auto { cap, min_marginal_gain }`** → grow the fleet while each additional worker still buys at least `min_marginal_gain` of additional speedup, then stop. The loop runs `n` from 2 to `min(widest, cap)`, comparing `amdahl(p, n)` against the previous value and breaking on the first insufficient gain.\n\n`Auto` is the answer to \"how many agents should I run?\" and its failure mode is the one that matters: spending on workers that cannot be used is the most common way a parallel scheduler costs more than it saves. `auto_concurrency_stops_when_marginal_gain_dries_up` asserts that 16 independent nodes with a large `min_marginal_gain` stop well short of the cap — greater than 1, less than 16.\n\nNote that the `Auto` loop breaks on the *first* shortfall rather than scanning the whole range. Amdahl's speedup curve is concave in `n`, so marginal gain is monotonically decreasing and the early break is safe. Anything that changes the speedup model has to re-check that assumption.\n\n## Safety report: `unisolated_parallel_writers`\n\n```rust\npub fn unisolated_parallel_writers(spec: &GraphSpec, waves: &[Wave]) -> Vec<String>\n```\n\nBuilder nodes that land in the same wave without worktree isolation write to the same files and clobber each other. This function walks each wave, keeps the nodes where `role == Role::Builder && !isolation.needs_worktree()`, and reports every ID from any wave holding more than one such node.\n\nIt reports rather than fixes. Adding isolation, splitting the wave with an edge, or accepting the overlap are all config decisions, and the crate does not make config decisions on the user's behalf
