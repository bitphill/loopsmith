ing_env_is_unavailable_and_names_only_the_key`, which asserts `why_not()` contains no `=`. That test is the secrets guarantee in executable form.\n\nIntegration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which is why `Cargo.toml` ships only `/src/**/*` and `/README.md` — a crate tarball cannot contain those files, and shipping the tests would hand a published crate tests that cannot pass.","scheduling-triggers":"# Scheduling & Triggers\n\n# Scheduling & Triggers\n\n`loopsmith` loops are defined as config, but a config file has no heartbeat. This module supplies it: it decides *when* a loop should run, and it hands that decision to something that outlives the terminal you started it in.\n\nTwo files, two responsibilities:\n\n| File | Role |\n|---|---|\n| `runtime/crates/loopsmith-cli/src/schedule.rs` | The trigger engine — cron parsing, UTC calendar math, and the `Watcher` state machine that `loopsmith watch` polls. |\n| `runtime/crates/loopsmith-cli/src/cmd/schedule.rs` | The `loopsmith schedule` subcommand — generates launchd / cron / Task Scheduler artifacts so the OS keeps the watcher alive. |\n\n## The two paths a schedule can take\n\n```mermaid\nflowchart TD\n    C[loop.yaml schedules] --> W[\"loopsmith watch\"]\n    C --> S[\"loopsmith schedule\"]\n    W --> P[\"Watcher::poll\"]\n    P --> F[\"Vec&lt;Fired&gt;\"]\n    F --> R[\"loopsmith run\"]\n    S --> L[launchd plist]\n    S --> X[crontab line]\n    S --> T[schtasks command]\n    L --> W\n    T --> W\n    X --> R\n```\n\nNote the asymmetry at the bottom: launchd and Task Scheduler are asked to keep a **watcher** alive, so trigger evaluation stays inside loopsmith. A crontab line runs `run` directly — cron *is* the trigger — which is why `crontab_line` takes a cron expression and the other two do not.\n\n## Time is UTC, deliberately\n\nCron expressions are evaluated in UTC, and the module says so in its own header: deriving a local offset in a multithreaded Unix process is unsound without care, and a scheduler that is silently an hour off twice a year is worse than one that is honestly in UTC. `crontab()` in the command file prints a warning about this, because the crontab path is the one place where the expression gets handed to a *different* evaluator that uses local time.\n\nThe advice both places give is the same: if you want a cadence that doesn't care about wall clocks, use an `interval` trigger.\n\n`civil_from_unix` does the calendar math in-crate rather than pulling a date crate, using Howard Hinnant's `civil_from_days` algorithm. It returns `Civil { year, month, day, hour, minute, weekday }` — no seconds, because cron's finest granularity is the minute. Weekday comes from the fact that 1970-01-01 was a Thursday: `(days + 4).rem_euclid(7)`.\n\n`civil_from_unix` has one caller outside this module: `format_utc` in `logging.rs`. Changing its shape touches log formatting.\n\n## Cron parsing\n\n`CronExpr::parse` takes the standard five fields — `minute hour day-of-month month day-of-week` — and rejects anything else with a message naming the expected shape. Each field becomes a `Field`:\n\n```rust\npub enum Field {\n    Any,                 // \"*\"\n    Values(Vec<u32>),    // sorted, deduplicated\n}\n```\n\n`parse_field` handles lists (`1,15`), ranges (`9-17`), steps (`*/15`, `0-30/5`), and bare values, expanding everything eagerly into a sorted `Vec<u32>`. Matching is then a `binary_search`. Rejections carry a reason rather than a generic parse error — `\"step of 0 would never fire\"`, `` \"`60` is outside 0..=59\" ``, `\"field matches nothing\"`.\n\nDay-of-week accepts `0..=7` because 0 and 7 both mean Sunday, as in every other cron. `CronExpr::matches` handles the pairing explicitly:\n\n```rust\nlet dow_match = self.day_of_week.matches(t.weekday)\n    || (t.weekday == 0 && self.day_of_week.matches(7));\n```\n\nA parse failure inside `Watcher::poll` is *skipped*, not propagated (`let Ok(c) = CronExpr::parse(expr) else { continue }`) — validation is expected to have happened at config load, and a live watcher should not die on one bad entry.\n\n## The Watcher\n\n`Watcher` is the whole trigger state machine. It holds four maps of per-trigger memory plus an ignore list, and exposes three methods.\n\n```rust\npub fn ignoring(ignore: Vec<String>) -> Self\npub fn prime(&mut self, triggers: &[Trigger], root: &Path)\npub fn poll(&mut self, triggers: &[Trigger], root: &Path, now: i64,\n            satisfied: &BTreeMap<String, bool>) -> Vec<Fired>\n```\n\n`poll` takes `now` as a parameter rather than reading the clock. That is what makes the cron and interval tests deterministic — they step time forward by arithmetic instead of sleeping. Keep it that way when extending.\n\nEach trigger variant has its own idea of what \"already fired\" means:\n\n**`Trigger::Cron`** — keyed on minute-of-epoch (`now.div_euclid(60)`). A watcher polling every 20 seconds sees the same matching minute three times; `fired_minute` ensures only the first produces a `Fired`.\n\n**`Trigger::Interval`** — the first poll *primes* and does not fire. `last_interval_run` starts empty, so the first `poll` records `now` and returns nothing; the trigger only fires once `now - prev >= seconds`. Starting a watcher does not immediately kick off a run.\n\n**`Trigger::FileChange`** — compares `newest_mtime_ignoring` against the stored value and fires on a strict increase. `prime()` exists so that starting the watcher does not look like a change; if you skip it, the first poll on a never-seen path sees `prev == None` and stays silent anyway, but priming makes that explicit.\n\n**`Trigger::GoalSatisfied`** — edge-triggered, not level-triggered. Fires on the `false → true` transition only; a goal that stays satisfied does not fire on every poll. The `satisfied` map is supplied by the caller (`cmd/watch.rs`), not read from disk here.\n\n**`Trigger::Manual`** — matched explicitly and does nothing, so a manual-only config never fires.\n\n`Fired` is the result type, and `Fired::describe()` produces the human-readable reason (`\"cron `* * * * *` matched (UTC)\"`, `` \"`src/` changed\" ``) that surfaces in watcher output.\n\n### The feedback-loop guard\n\nThis is the subtlest part of the module. A `file_change` trigger on the loop root would otherwise see the loop's own writes and retrigger forever.\n\n```rust\nconst NEVER_WATCHED: [&str; 3] = [\"state\", \".git\", \"logs\"];\n```\n\n`newest_mtime_ignoring` walks a path (depth-capped at 24) for the newest mtime, skipping any directory whose name is in `NEVER_WATCHED` **or** in the caller-supplied `extra` list, at any depth. A missing path reports `0` rather than erroring — a watched path that doesn't exist yet is a normal state, not a failure.\n\nThe three constants and the `extra` slot each exist for a concrete failure that was observed:\n\n- `state/` is sled's directory, written on every ledger update.\n- `logs/` is written on **every single iteration**, so a loop watching its own root would start a run, write a log, and start another.\n- The `extra` list carries the success export — a directory named after the loop, written only when a run meets its bar. Same bug with a longer fuse: the loop would enter a permanent cycle exactly when it succeeded.\n\n`Watcher::ignoring(...)` is how `cmd/watch.rs` supplies that export name. The two tests `the_watcher_ignores_its_own_state_directory` and `the_watcher_ignores_the_run_log_and_the_success_export` pin all of it, including the other half — that a real edit outside those directories *still* registers, or the trigger would be inert.\n\n### Poll cadence\n\n`poll_interval` picks the tightest cadence the trigger set demands, starting at 30s:\n\n| Trigger | Ceiling |\n|---|---|\n| `Cron` | 20s — sub-minute, or a matching minute can be missed entirely |\n| `FileChange` | 5s |\n| `Interval { seconds }` | `(seconds / 4).max(1)` |\n| `Manual`, `GoalSatisfied` | no effect |\n\nThe result is floored at 1s. `cmd/watch.rs` calls this alongside `Watcher::ignoring` and `now_unix` to drive its sleep loop.\n\n## OS handoff\n\nFour generators produce the artifacts, all pure string functions over paths — trivially testable, and tested:\n\n- **`launchd_plist(label, exe, config, log_dir)`** — a `RunAtLoad` + `KeepAlive` agent invoking `watch`, with stdout/stderr to `loopsmith.out.log` / `loopsmith.err.log`.\n- **`crontab_line(exe, config, expr, log_dir)`** — a line running `run` once per match, appending to `loopsmith.log`.\n- **`schtasks_command(label, exe, config)`** — a `/SC MINUTE /MO 1` task running `watch`. `/RL LIMITED` because a loop has no business elevated; `/F` so re-running updates rather than colliding on the name.\n- **`default_label(loop_name)`** — `com.loopsmith.` plus the name with every non-alphanumeric character replaced by `-`, so the label is safe for launchd.\n\nThe `schtasks` quoting deserves its own note, and has its own test. `/TR` takes the entire command as one argument, so the paths inside it need a second level of escaping (`\\\"`) — `C:\\Program Files\\…` is the case that finds out whether it's there. The command must also stay on one line, since pasting it into a shell is the whole delivery mechanism.\n\n`launch_agents_dir()` resolves to `$HOME/Library/LaunchAgents` via `loopsmith_util::platform::home_dir`, but `LOOPSMITH_LAUNCH_AGENTS_DIR` overrides it. That override exists purely so the test suite can exercise `--install` without writing a real launch agent into the home directory of whatever machine CI happens to be on.\n\n## `loopsmith schedule` — the command\n\n`cmd/schedule.rs::execute(config, install)` loads the config, resolves the executable and an absolute config path, creates `<loop-root>/logs/`, derives a label, then dispatches on `Platform::detect().scheduler()`.\n\nThe dispatch is on **what is installed**, not on `cfg!(target_os = ...)`. A build target says launchd *existed*; it does not say this machine has `launchctl` on `PATH`, and a container built `FROM debian` has neither `crontab` nor `systemctl` unless someone installed them. Printing a crontab line to a host with no cron is an instruction that silently does nothing.\n\n```\nSome(\"launchctl\") → launchd()   → plist to stdout, or written with --install\nSome(\"schtasks\")  → schtasks()  → command printed for the user to run\nSome(_)           → crontab()   → line printed for `crontab -e`\nNone              → Err(...)    → names the tools it looked for\n```\n\nThe `None` arm builds its message from `preferred_names`, which re-reads the same `loopsmith_util::platform::preferred_schedulers(p.os)` list the probe used. Restating the list by hand is exactly how an earlier version told a Windows user to install `crontab`.\n\nThe logs directory is `logs/`, not `state/`. `state/` is sled's and the watcher ignores everything under it — including, before this moved, the operating system's own record of why the loop failed to start.\n\n### What `--install` will and won't do\n\nOnly the launchd path writes anything. LaunchAgents is a directory where one plist is one job, so adding loopsmith's cannot disturb anyone else's. Even there, `launchctl load -w` is printed rather than executed — loading an agent is a persistent, user-visible change to the machine, so it stays the user's call.\n\nThe other two paths call `nothing_to_install(reason)`, which prints an explicit note to stderr:\n\n- **crontab** — one file per user with no drop-in directory, so writing means rewriting entries this loop did not put there.\n- **schtasks** — Task Scheduler keeps jobs in a database reached only through `schtasks` itself; there is no file to write.\n\nA flag that is silently a no-op is worse than one that explains itself, because the user walks away believing something was installed.\n\n## Contributing notes\n\n- **Extending `Trigger`** — the enum lives in `loopsmith_core`. Adding a variant means a new arm in `Watcher::poll`, a `Fired` variant with a `describe()` string, probably a new state map on `Watcher`, and a decision in `poll_interval` about whether it tightens the cadence. Decide up front whether it is edge- or level-triggered; `GoalSatisfied` is the edge-triggered precedent.\n- **Anything a run writes must be unwatchable.** If you add a directory the runner writes to on every iteration, it belongs in `NEVER_WATCHED` (or the `ignore` list, if only the caller knows its name). The failure mode is a loop that never goes idle and gives no clue why.\n- **Keep `poll` clock-injected and the generators pure.** Both properties are what make the tests in this module fast and deterministic; several of them assert behavior across simulated minutes.\n- **`schedule::execute` is the entry point for the whole config-load flow** — it calls `loopsmith_core::load`, which pulls in the entire Markdown/YAML parsing path. Changes to config shape reach this command before they reach the watcher.","skills-system":"# Skills System\n\n# Skills System (`loopsmith-skills`)\n\nThe Skills System is how a loop acquires the sub-agents it needs, and how it learns which of them are worth keeping. Two concerns live in this crate, and they are deliberately connected:\n\n1. **Acquisition** — resolve a skill name to a directory on disk, trying `installed → marketplace → generate` in the configured order.\n2. **Outcome ranking** — pair each skill with the gate verdict that followed its use, and propose adoptions and removals from that record.\n\nThe connection matters: a loop cannot reason its way to knowing which sub-agents earn their keep. It has to try one, watch the gate, and keep what correlates with satisfied goals. Acquisition is an action the loop may take on its own; *adopting* a skill into the config is a proposal a human applies.\n\n## Two invariants\n\nEverything in this crate follows from two rules, and most of the surprising code exists to uphold one of them.\n\n**Nothing acquired is trusted.** An acquired sub-agent runs with whatever your permission grant allowed, so everything fetched or generated lands in a quarantine directory (`generated-skills/` by default) until a human moves it. `ResolvedSkill::quarantined` carries that fact to every caller. Popularity is not trust either: a repo with 9,000 stars whose name matches the blocklist is still excluded from ranking.\n\n**A skill's value is measured by verdicts, not opinions.** `recommend` reads `SkillTrial` records from `loopsmith-memory` — each one a `(skill, node, pass_rate, satisfied)` tuple written after a gate ruling — never the model's assessment of its own tooling.\n\n## Crate shape\n\n```\nsrc/lib.rs          acquisition, safety predicates, quarantine, recommendation\nsrc/marketplace.rs  the claudemarketplaces.com index and the `skills` CLI\n```\n\nNo HTTP client, no git library. Network and package-manager work shells out to `curl`, `npx`, and `git` through the private `run` helper. That keeps the dependency set to `serde`/`serde_json`/`thiserror` plus loopsmith's own crates, and means a machine without `curl` degrades to *installed only* rather than failing to build. The cost is that every network path returns `SkillError::Missing` on a bare machine, and callers must treat that as \"this source is unavailable\", not \"this skill does not exist\" — which is exactly what `acquire` does when it falls through to the next source.\n\n## The acquisition path\n\n`acquire(name, purpose, policy, project_root)` walks `policy.acquisition_order`, which is a `Vec<AcquisitionSource>` from the A–J config model in `loopsmith-core`:\n\n```mermaid\nflowchart LR\n    A[acquire] --> B{Installed?}\n    B -- yes --> Z[ResolvedSkill]\n    B -- no --> C{Marketplace}\n    C -- ok --> Z\n    C -- Refused --> R[SkillError::Refused]\n    C -- other error --> D[Generate]\n    D --> Z\n```\n\nThe error handling on the marketplace arm is the load-bearing detail:\n\n```rust\nmatch install_from_cli(name, &quarantine) {\n    Ok(r) => return Ok(r),\n    Err(SkillError::Refused(m)) => return Err(SkillError::Refused(m)),\n    Err(_) => continue,\n}\n```\n\n`Refused` aborts the whole walk; everything else falls through. A missing `npx` or a network failure should let the loop try the next source, but a name that failed a safety check must not be quietly routed into `generate` — that would install something under a name the safety layer just rejected.\n\nIf the order runs out with nothing resolved, `acquire` returns `SkillError::Missing(name)`.\n\n### Resolution surface\n\n| Function | Role |\n|---|---|\n| `skill_search_paths(root)` | The search order: `<root>/.claude/skills`, `<root>/generated-skills`, then `~/.claude/skills`. Uses `loopsmith_util::platform::home_dir()` rather than `HOME`, because Windows does not set `HOME` outside a POSIX layer and the user-level directory would silently vanish. |\n| `find_installed(name, root)` | First directory in that order containing `<name>/SKILL.md`. A directory without `SKILL.md` is not a skill. |\n| `list_installed(root)` | Everything visible, deduplicated by name with the nearest directory winning — a project skill shadows a quarantined one of the same name. |\n\nNote what `find_installed` can and cannot know. The filesystem records *location*, not *provenance*, so anything found on disk is reported as `Source::Installed`, and the quarantine caveat is carried by the `quarantined` flag (true when the containing directory ends with `generated-skills`). Do not read `Source` as a trust signal for installed skills; read `quarantined`.\n\n### Installing and generating\n\n`install_from_cli(spec, quarantine)` runs `npx --yes skills add <spec> --dir . -y` with the quarantine directory as the working directory. The `--dir .` is what keeps it out of the global skills path. The resulting name is the spec's last segment after `@` and `/`, so `vercel-labs/agent-skills@react` lands as `react`.\n\n`install_default(spec, policy, root)` installs one of the loop's declared section-J default sub-agents, and is idempotent — a skill already on disk is returned untouched, so it is safe at the start of every run. It dispatches on `SkillOrigin`:\n\n- `Local` — returns `SkillError::Missing` with an explanation. A `local` skill is *never* fetched; declaring one that isn't on disk is a config error, not a cache miss.\n- `Marketplace` — `install_from_cli` with `spec.url` if present, otherwise the bare name.\n- `Github` — `clone_repo`, which requires `is_safe_repo_url` (https only) and clones with `--depth 1`, because a loop wants the skill and not its history.\n\nAfter install, `spec.init_argv()` runs inside the installed directory as argv — not through a shell. See the note on `DefaultSkill::init_argv` in `loopsmith-core`.\n\n`generate(name, purpose, quarantine)` is the last resort: it writes a `SKILL.md` with frontmatter, an **Approach** section, and an **Output** section, plus the line *\"Review before promoting\"*. The template's framing is not decorative — it asks for steps with checks and claims with evidence, because a generated skill's output still has to survive the gate.\n\n### The safety predicates\n\nBoth are pure and both are cheap to call, so callers call them early.\n\n`is_safe_name` accepts alphanumerics plus `- _ / @ .`, up to 64 characters, and rejects `..`, a leading `/`, and a leading `-`. Unsafe names are **refused, not sanitised** — a silently rewritten skill name installs something the caller did not ask for, and a leading `-` would be read as a flag by `npx`.\n\n`is_blocklisted` matches `credential`, `secret`, `exfil`, `keylog`, `password`, `token-steal` case-insensitively anywhere in the name. It gates `install_from_cli`, `install_default`, and marketplace ranking alike, and no trust score overrides it.\n\n## The marketplace index\n\n`marketplace.rs` fetches a flat JSON array from `https://claudemarketplaces.com/api/marketplaces` (~2,600 plugin-marketplace repos) via `curl -sS --fail --max-time`, then ranks it locally.\n\nEverything in that payload is untrusted text written by strangers. Descriptions and keywords are material to rank, never instructions to follow.\n\n**Lenient deserialization.** The `lenient` module supplies `deserialize_with` helpers that accept a JSON number *or* a numeric string (`\"1,200\"` → `1200`), and a string list *or* a bare string. This exists because of a real failure: `stars` is absent on roughly a third of live entries, and third-party mirrors have returned strings. Declaring the field as `String` made every parse fail — and because the failure was swallowed, search returned nothing while looking like a working search with no hits.\n\nThat bug is also why there are two ranking entry points:\n\n- `rank_checked(json, terms, opts) -> Result<Vec<MarketplaceEntry>>` — a parse failure is an error.\n- `rank(json, terms, opts) -> Vec<MarketplaceEntry>` — convenience wrapper, treats a parse failure as no results.\n\nPrefer `rank_checked` in any path a human reads. `search_marketplace` (fetch + rank in one call) uses it.\n\n**The ranking pipeline**, in `rank_entries`, applies four steps in order: star floor (`min_stars`, default 100) → blocklist on `repo` → keyword relevance → `limit` (default 10). Entries scoring zero relevance are dropped entirely, so an empty result means \"no matches\", not \"here is the whole index\". Sorting is by relevance, then stars as the tiebreak.\n\n`MarketplaceEntry::relevance` is a case-insensitive substring count over `repo + description + categories + pluginKeywords`. It is deliberately dumb: its job is to shortlist for a human or for the trust floor, not to be clever.\n\n**`search_skills_cli(query, cwd)`** is separate from the index because the two cover different things — the index lists plugin *bundles*, the `skills` CLI lists individual skills. It shells to `npx --yes skills find <query>` and returns raw stdout, and unlike the install path it tolerates spaces in the query.\n\n`templates/marketplaces.json` in `loopsmith-cli` documents both sources, the verified response shape, and the trust floors (`min_stars`, `min_installs`, `trusted_owners`) that the scaffolded config carries.\n\n## Outcome-ranked recommendation\n\n```rust\npub fn recommend(\n    configured: &[String],\n    trials: &[SkillTrial],\n    min_trials: usize,\n    adopt_above: f64,\n    drop_below: f64,\n) -> Recommendation\n```\n\n`recommend` delegates the arithmetic to `score_skills` in `loopsmith-memory`, which folds trials into `SkillScore` values exposing `trials` and `satisfaction_rate()`. Then, per skill:\n\n- fewer than `min_trials` → skipped entirely. One lucky run is not evidence, and a single trial must never drive a config change.\n- rate ≥ `adopt_above` and not already configured → `adopt`.\n- rate ≤ `drop_below` and currently configured → `drop`.\n\nAn already-configured skill with a good record produces nothing: there is nothing to propose. The output `Recommendation { adopt, drop }` is a **proposal**. This crate never edits a config. `src/run/evolve.rs` turns it into a file under `proposals/`, and a human applies it by editing `loop.yaml`.\n\n## How the rest of the binary uses this\n\n| Caller | Uses |\n|---|---|\n| `src/run/mod.rs::install_default_skills` | `install_default` — section-J defaults at run start |\n| `src/run/dispatch.rs::ensure_skills` | `find_installed`, `acquire` — resolve a node's skills before dispatch |\n| `src/run/mod.rs::execute` | `acquire` |\n| `src/run/evolve.rs::skill_proposals` | `recommend` — turns trials into `proposals/` |\n| `src/cmd/skills.rs` | `list_installed`, `install_default`, `search_marketplace`, `search_skills_cli`, `SearchOptions` — backs `loopsmith skills list / install / search` |\n\nDependencies run one way: on `loopsmith-core` for the config types (`SkillPolicy`, `DefaultSkill`, `SkillOrigin`, `AcquisitionSource`, `is_safe_repo_url`), on `loopsmith-memory` for `SkillTrial`/`SkillScore`/`score_skills`, and on `loopsmith-util` for `which` and `platform::home_dir`. Nothing here depends on `loopsmith-gate`; verdicts arrive as already-recorded trials.\n\n`which` is re-exported from `loopsmith-util` rather than reimplemented. The local copy it replaced was PATH-only and accepted any file, so a non-executable `curl` on PATH read as \"curl is available\". The shared version checks the executable bit.\n\n## Contributing notes\n\n**Error semantics are part of the contract.** `SkillError` has four variants and callers branch on them: `Refused` means a safety predicate said no and the walk must stop; `Missing` means a binary or a skill is absent and the next source should be tried; `Command` carries the last stderr line from a failed shell-out; `Io` wraps filesystem failures. Adding a new refusal path means returning `Refused`, not `Command`.\n\n**Never let a failure look like an empty result.** This is the crate's recurring bug shape, and the reason `rank_checked` exists alongside `rank`. If you add a parse or fetch step, decide explicitly which of the two behaviors it gets.\n\n**Tests are hermetic.** Every test uses `loopsmith_util::testing::temp_dir` and none touch the network — `acquire_falls_through_to_generation_when_nothing_is_found` constructs a `SkillPolicy` with `acquisition_order: [Installed, Generate]` specifically to skip the marketplace. Keep new tests that way; the `SAMPLE` constant in `marketplace.rs` mirrors the live payload shape (numeric stars, array categories, one entry with `stars` absent) and is the right place to add a new shape rather than adding a live fetch.\n\n**Packaging.** `Cargo.toml` ships `include = [\"/src/**/*\", \"/README.md\"]` only. Integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping them would hand a published crate tests that cannot pass."};

(function() {
  var activePage = 'overview';

  document.addEventListener('DOMContentLoaded', function() {
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
    renderMeta();
    renderNav();
    document.getElementById('menu-toggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
    });
    if (location.hash && location.hash.length > 1) {
      activePage = decodeURIComponent(location.hash.slice(1));
    }
    navigateTo(activePage);
  });

  function renderMeta() {
    if (!META) return;
    var el = document.getElementById('meta-info');
    var parts = [];
    if (META.generatedAt) {
      parts.push(new Date(META.generatedAt).toLocaleDateString());
    }
    if (META.model) parts.push(META.model);
    if (META.fromCommit) parts.push(META.fromCommit.slice(0, 8));
    el.textContent = parts.join(' \u00b7 ');
  }

  function renderNav() {
    var container = document.getElementById('nav-tree');
    var html = '<div class="nav-section">';
    html += '<a class="nav-item overview" data-page="overview" href="#overview">Overview</a>';
    html += '</div>';
    if (TREE.length > 0) {
      html += '<div class="nav-group-label">Modules</div>';
      html += buildNavTree(TREE);
    }
    container.innerHTML = html;
    container.addEventListener('click', function(e) {
      var target = e.target;
      while (target && !target.dataset.page) { target = target.parentElement; }
      if (target && target.dataset.page) {
        e.preventDefault();
        navigateTo(target.dataset.page);
      }
    });
  }

  function buildNavTree(nodes) {
    var html = '';
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      html += '<div class="nav-section">';
      html += '<a class="nav-item" data-page="' + escH(node.slug) + '" href="#' + encodeURIComponent(node.slug) + '">' + escH(node.name) + '</a>';
      if (node.children && node.children.length > 0) {
        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;
  }

  function escH(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function navigateTo(page) {
    activePage = page;
    location.hash = encodeURIComponent(page);

    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].dataset.page === page) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
})();

</script>
