tions sit one level inside a bundle now, so it walks two levels — a top-level key is covered if it's listed itself or if every key beneath it is. Without this, adding a section to a bundle and forgetting `SECTION_PATHS` loses it *silently* on the Markdown path, which is what happened to `context` once already.\n\n**If you add a config section, add it to `SECTION_PATHS`.** This test is the thing that will tell you.\n\n## Connections to the rest of the codebase\n\n**Entry points into the module:**\n\n- `loopsmith_core::load` — dispatches on `is_markdown(path)` and calls `parse_md`. This is the main road: `loopsmith run`, `loopsmith schedule`, and the rest reach the Markdown parser through it without knowing it exists.\n- `loopsmith-cli/src/scaffold.rs` — `scaffold` parses generated Markdown templates through `parse_md`, so a template that doesn't parse fails at scaffold time.\n- `loopsmith-cli/src/cmd/migrate.rs` — uses `parse_md_reporting` to get the `Moved` report and `render_md` to write the upgraded document.\n- `loopsmith-wizard::render` and `loopsmith-web`'s `assemble::render` — both emit Markdown via `render_md`, which is why the wizard's output and a hand-written config are the same artifact.\n\n**`loopsmith convert`** (`loopsmith-cli/src/cmd/convert.rs) is the thinnest possible consumer — load then emit:\n\n```rust\nlet cfg = loopsmith_core::load(config)?;\nlet want_yaml = to_yaml || loopsmith_core::is_markdown(config);\nlet text = if want_yaml { serde_yaml::to_string(&cfg)? } else { render_md(&cfg) };\n```\n\nDirection is inferred from the input (a `.md` config converts *to* YAML), with `--to-yaml` as an override. Output goes to `--out` (creating parent directories) or stdout.\n\n## Contributing: where changes go\n\n| Change | What to touch |\n|---|---|\n| New field on an existing section | Nothing in this module. Add it to the config struct. |\n| New section | One row in `SECTION_PATHS`; a `section_shape` arm if it takes `###` entries. |\n| A `###` heading should fill a different field | `section_shape`'s `key_field` (dotted paths supported). |\n| A 0.3 key moved | `crate::config::legacy` only — never a second table here. |\n| New grammar affordance | `tokenize` for lexing, `build_block`/`split_field` for structure, and a matching `push_*` so it round-trips. |\n\nThe rule underneath all of these: **the parser and renderer must remain ignorant of the config model.** Any change that teaches `md/` about a concrete type like `Goal` or `StopGates` is the wrong shape, because it's a change that will have to be made again for the next type.","mcp-server":"# MCP Server\n\n# MCP Server (`loopsmith-mcp`)\n\nA Model Context Protocol server over stdio that exposes a loop's control plane — schedule, ledger, memory, and gate verdicts — to any MCP client, without exposing the one thing that would break the system's central guarantee.\n\n## Purpose and the omission that defines it\n\nThe crate answers a narrow question: what may a reasoning agent legitimately read from and write to the control plane while a loop is running?\n\nThe answer is everything *except* completion. There is no `set_goal_satisfied` tool, no `mark_done`, no `satisfy`. `goal_satisfied` is written by `loopsmith-gate` and by nothing else. The MCP surface can *report* the gate's ruling through `loopsmith_gate_evaluate`, but the gate is not reachable as a mutation from here.\n\nThis is load-bearing enough to have its own test:\n\n```rust\n#[test]\nfn there_is_no_tool_for_declaring_a_goal_satisfied() {\n    // The gate owns that ruling. If this ever fails, the independence\n    // guarantee has been quietly removed.\n```\n\nThe test scans the names returned by `tools()` for `satisfy`, `set_goal`, and `mark_done`. If you add a tool, that filter is the first thing to check against it.\n\nThe second omission is transport: stdio only, no socket. A loop's ledger and goal state are a record of what happened on one machine, and a listening port is a different security question than the one this crate answers.\n\n## Protocol surface\n\nJSON-RPC 2.0, newline-delimited, three methods plus one notification:\n\n| Method | Behavior |\n|---|---|\n| `initialize` | Returns `PROTOCOL_VERSION` (`\"2024-11-05\"`), `capabilities.tools`, and `serverInfo` (name `loopsmith`, version from `CARGO_PKG_VERSION`) |\n| `notifications/initialized` | Acknowledged with `{}` — and since it carries no `id`, `serve` discards the reply |\n| `tools/list` | The `tools()` catalogue |\n| `tools/call` | Dispatches on `params.name` with `params.arguments` |\n\nAnything else gets a JSON-RPC error `-32601`. Malformed input gets `-32700` with the serde message attached.\n\nWriting the protocol by hand rather than pulling in an MCP SDK is deliberate: those three methods are the whole surface an MCP client needs, and an async runtime is a heavy dependency for a loop that reads lines off stdin.\n\n## Request lifecycle\n\n```mermaid\nflowchart LR\n    S[serve: read line] --> P{parse}\n    P -- err --> E[\"Response::err -32700\"]\n    P -- ok --> H[handle: match method]\n    H -- \"tools/call\" --> C[call: match tool name]\n    H -- other --> R1[initialize / tools-list / -32601]\n    C --> T[\"tool_* method\"]\n    T --> R2[\"Response::ok<br/>content + isError\"]\n```\n\n`serve(input, output)` is the only I/O in the crate. It loops over `input.lines()`, skips blank lines, and for each parsed `Request` checks `req.id.is_none()` *before* dispatching — the handler still runs, but a notification gets no reply written. Every response is one line, flushed immediately.\n\n`handle` is pure with respect to I/O and takes `&Request`, which is what makes the test suite able to drive the whole server through direct calls without touching a pipe.\n\n## The two error channels\n\nThis trips people up, so it is worth being explicit. There are two distinct failure modes and they use different parts of the response:\n\n**Protocol errors** set `Response.error` — an unknown method, a parse failure. These are JSON-RPC-level and use `Response::err(id, code, message)`.\n\n**Tool errors** are *successful* JSON-RPC responses whose result carries `\"isError\": true`:\n\n```rust\nErr(msg) => Response::ok(\n    req.id.clone(),\n    json!({\n        \"content\": [{ \"type\": \"text\", \"text\": msg }],\n        \"isError\": true\n    }),\n),\n```\n\nA missing argument, a config that will not load, a refused memory write — all of these come back as `isError: true` with the message as the text content, never as a JSON-RPC error. That is the MCP convention: the call succeeded, the tool said no. Tests distinguish them with the `is_error` helper (reads `result.isError`) versus checking `r.error.is_some()`.\n\nOn success, `result` is `{ \"content\": [{ \"type\": \"text\", \"text\": <pretty-printed JSON> }], \"isError\": false }`. Tool return values are serialized with `serde_json::to_string_pretty` and embedded as text — MCP clients read text content, not structured JSON.\n\n## Tools\n\n`tools()` returns the catalogue as a `serde_json::Value` literal. Each entry carries `name`, `description`, and an `inputSchema` with `type: \"object\"`; `tools_list_is_non_empty_and_every_tool_has_a_schema` enforces that shape.\n\n### Read-only\n\n| Tool | Backed by | Notes |\n|---|---|---|\n| `loopsmith_plan` | `loopsmith_core::load` → `loopsmith_graph::plan` | Projects the plan into waves, critical path and cost, parallel fraction, concurrency, predicted speedup, speedup ceiling |\n| `loopsmith_gate_evaluate` | `loopsmith_gate::evaluate` | Builds `Evidence` from `workdir` (default `.`), plus optional `metrics` and `artifacts` maps |\n| `loopsmith_ledger` | `Store::ledger` | Optional `limit` returns the *last* N entries via `split_off` on a saturating offset |\n| `loopsmith_goal_states` | `Store::goal_states` | Gate rulings for every goal plus `overall` |\n| `loopsmith_recall` | `namespaces::recall` | Promoted records only, filtered by each namespace's confidence floor |\n\n`tool_gate` filters as it copies: only `f64`-valued metrics and string-valued artifacts make it into `Evidence`. A metric sent as a JSON string is silently dropped rather than rejected — worth knowing when a check mysteriously has no evidence to weigh.\n\n`tool_plan` reads `cfg.execution.graph`; `tool_remember` and `tool_recall` read `cfg.execution.memory`. Every config-taking tool calls `loopsmith_core::load` fresh on each invocation — there is no cache, so an edited config takes effect on the next call.\n\n### Writes\n\nThree tools write, and all three write *records of what happened* rather than rulings about it.\n\n**`loopsmith_record_episode`** builds an `Episode` and calls `Store::put_episode`, returning the assigned `seq`. Required: `run_id`, `node_id`, `provider_id`, `output`. The `provider_id` requirement is the interesting one — an episode without provenance cannot be judged for independence, so it is refused. `role` defaults to `\"builder\"`; `iteration` to `0`; `prompt_digest` is left empty (the MCP path does not see prompts); `created_ms` comes from `loopsmith_memory::now_ms()`. Note that `tokens`, `cost_usd`, and `duration_ms` are read from the arguments but are not declared in the tool's `inputSchema` — a well-behaved client will not send them.\n\n**`loopsmith_scratchpad`** is read/write on one entry point: present `value` means `set_scratchpad`, absent means `scratchpad`. Since the branch is `args.get(\"value\").and_then(|v| v.as_str())`, a non-string `value` reads instead of writing.\n\n**`loopsmith_remember`** is the most constrained write. It loads the config, resolves the namespace, builds a `Note`, and hands it to `namespaces::remember` along with `cfg.execution.memory`. The three outcomes map as follows:\n\n- `Remembered::Written { promoted, .. }` → `{\"written\": true, \"promoted\": <bool>}`\n- `Remembered::Refused(why)` → tool error carrying the policy's reason\n- `Remembered::Disabled` → tool error naming the switched-off namespace\n\n`confidence` defaults to `0.8` when absent. The memory policy in the config — not this crate — decides whether a record is refused for missing provenance and whether it is promoted.\n\n### Namespace handling\n\n`memory_namespace` parses the optional `namespace` argument and enforces one rule beyond `Namespace::parse`:\n\n```rust\nSome(Namespace::Episodic) | None => Err(format!(\n    \"`{name}` is not a memory namespace; use semantic, procedural, or failure\"\n)),\n```\n\nEpisodic is deliberately excluded. An episode is *what happened*, recorded through `loopsmith_record_episode`; it is not something believed, and routing it through `remember` would blur that line. An unparseable name and `episodic` produce the same message.\n\nThe `Option` return is what lets the same helper serve both callers: `tool_remember` unwraps `None` into a missing-argument error, while `tool_recall` expands `None` into all three namespaces.\n\n## Promotion, and why an agent cannot shortcut it\n\nThe memory model deserves a note because it is the second place independence is enforced. `an_agent_can_remember_a_fact_but_not_promote_it_by_saying_so` walks the whole path:\n\n1. A semantic write with no `provenance` is refused.\n2. The same write *with* provenance succeeds and reports `\"promoted\": false`.\n3. `loopsmith_recall` immediately after returns `{\"records\": []}`.\n\nOne run asserting a fact is not enough for that fact to be reused. Corroboration — the same key written from another run — is what promotes it, and promotion is evaluated by `loopsmith-memory` against the loop's policy. The MCP server reports the promotion bit; it cannot set it. Same shape as the gate.\n\n## Arguments and `str_arg`\n\nEvery required string argument goes through:\n\n```rust\nfn str_arg(args: &Value, key: &str) -> Result<String, String>\n```\n\nwhich produces ``missing required argument `key` `` on absence or a non-string value. Since that message surfaces verbatim as the tool error text, argument names are part of the observable contract — `a_missing_argument_is_reported_as_a_tool_error` asserts the response text contains `run_id`, and `recording_without_provenance_is_refused` asserts it contains `provider_id`.\n\n## Generic over `Store`\n\n```rust\npub struct Server<S: Store> { pub store: S }\n```\n\nThe server is generic over `loopsmith_memory::Store`, so it never names a concrete backend. Production wires in `SledStore`; tests do the same over a `loopsmith_util::testing::temp_path(\"mcp\")` directory and clean up at the end of each test. `store` is public, which is what lets the episode test assert against `s.store.episodes(\"r1\")` directly rather than round-tripping through another tool.\n\n## Dependency position\n\n`loopsmith-mcp` is a leaf. Nothing in the workspace calls into it; the `loopsmith` binary owns it via the `mcp` subcommand and it reaches downward into four crates:\n\n- `loopsmith-core` — `load` for every config-taking tool\n- `loopsmith-graph` — `plan`\n- `loopsmith-gate` — `evaluate`, `Evidence`, `TargetVerdict`\n- `loopsmith-memory` — `Store`, `Episode`, `LedgerEntry`, `Namespace`, `namespaces::{remember, recall, Note, Remembered}`, `now_ms`\n\nNo async runtime, no HTTP stack, no MCP SDK. `serde`, `serde_json`, and `thiserror` are the only non-workspace dependencies.\n\n## Client registration\n\n`runtime/crates/loopsmith-cli/templates/mcp.template.json` holds a copyable `mcpServers` block:\n\n```json\n{\n  \"mcpServers\": {\n    \"loopsmith\": {\n      \"command\": \"loopsmith\",\n      \"args\": [\"mcp\", \"--state\", \"./state\"],\n      \"env\": {}\n    }\n  }\n}\n```\n\nOr via CLI: `claude mcp add loopsmith -- loopsmith mcp --state ./state`. The template also carries fallbacks for a binary not on PATH (absolute path) and for development (`cargo run --release -p loopsmith -- mcp --state ./state`).\n\nThe template's `$tools` block documents six of the eight tools — `loopsmith_remember` and `loopsmith_recall` were added later and are not listed there. If you add a tool, that block is the third place to update, after `tools()` and `call`.\n\n## Adding a tool\n\n1. Add the entry to `tools()` with a `name`, a `description`, and an `inputSchema` whose `type` is `\"object\"`.\n2. Add the arm to `call`'s match on `name`, returning `Result<Value, String>`.\n3. Write `tool_<name>(&self, args: &Value)`, pulling required strings through `str_arg` and mapping every downstream error with `.map_err(|e| e.to_string())`.\n4. Check the name against the `satisfy` / `set_goal` / `mark_done` filter — and more importantly, against the rule behind it. If the tool would let a caller assert completion rather than report it, it does not belong here.\n5. Update `$tools` in the CLI template.\n\n## Packaging\n\n`Cargo.toml` restricts the published tarball to `include = [\"/src/**/*\", \"/README.md\"]`. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping them would hand a published crate tests that cannot pass. If you add a test that reads a repo-root fixture, keep it out of `src/`.","memory-episode-store":"# Memory & Episode Store\n\n# Memory & Episode Store (`loopsmith-memory`)\n\nEverything a loop must not forget lives in this crate: what each node did, what the gate ruled, an append-only audit trail, where to resume, what the loop wants changed, and what it has learned across runs. It is the persistence plane for the whole workspace — `loopsmith-run` writes to it every iteration, `loopsmith-gate` is the only writer of one particular field, and `loopsmith-mcp` exposes parts of it over stdio.\n\n## Two rules the design rests on\n\n**Validate before writing.** Bad data compounds: one wrong record becomes a retrieved \"fact\", which becomes reasoning, which becomes another record. So writes reject rather than store. `Episode::check` demands a non-empty `run_id`, `node_id`, and `provider_id`; `set_goal_state` rejects a ruling where `passed + failed > total`; `put_skill_trial` rejects a `pass_rate` outside `0.0..=1.0`; `put_record` rejects an empty key or a confidence outside `0..1`. Every one of these returns `MemError::Rejected` and writes nothing — the test `malformed_episodes_are_rejected_not_stored` asserts the store is still empty afterwards.\n\n**The store is a trait.** `sled` is the shipped backend but is effectively frozen upstream. Callers depend on `Store`, never on `SledStore`, so a different engine can be dropped in without touching them. `open(path)` is the one convenience that names the concrete backend, returning `SledStore` directly.\n\n## The data model\n\n| Type | Scope | What it answers |\n|---|---|---|\n| `Episode` | per run | What one node did on one iteration — role, provider, prompt digest, output, tokens, cost, error |\n| `GoalState` | per run, per target | The gate's ruling: `satisfied`, `passed`/`failed`/`total`, a reason, the iteration it was made |\n| `LedgerEntry` | per run | Append-only audit; `LedgerKind` spans `RunStarted` through `RunFinished`, plus `StateChanged`, `Recovered`, `Escalated`, `AlertRaised`, `RuleEvaluated`, `Remembered` |\n| `Checkpoint` | one per run | Where to resume, including the stop gates' accounting |\n| `IterationSummary` | per run, per iteration | What an iteration amounted to, compressed for re-injection |\n| `SkillTrial` | **global** | One observation of \"did this skill help?\" |\n| `Proposal` | per run | A change the loop wants but may not apply itself |\n| `Record` | cross-run, per namespace | Something the loop remembers between runs |\n| scratchpad | per run, per key | Free-text reasoning carried between iterations |\n\n### `GoalState` and the one rule\n\n> A model must not be the thing that certifies its own completion.\n\n`satisfied: true` is constructed only by `loopsmith-gate::to_goal_state` and by nothing else. The dependency direction enforces it: `loopsmith-gate` depends on `loopsmith-memory`, not the reverse, which is also why `Checkpoint::verdicts_json` and `Checkpoint::state` are held as `String` rather than as the gate's verdict type or the engine's state enum. Those crates sit above this one, so this one cannot name their types without inverting the edge that keeps the gate the sole author of a satisfied goal.\n\n`GoalState::pass_rate()` returns `passed / total`, guarding the zero-total case at `0.0`.\n\n### `Checkpoint` — resume is not a reset\n\nThe subtle part of resuming is not the node list, it's the accounting. If a checkpoint carried only progress, a loop that resumes often would be handed a fresh revision budget and a zero no-progress counter every time — so a run going nowhere could never reach the halt that exists to stop it, and the ceilings would apply only to runs that never paused. So the checkpoint carries the stop gates' own state:\n\n- `revisions: BTreeMap<String, u32>` — runs per node with goals still unsatisfied; this is what `max_revisions_per_node` bounds.\n- `stale_iterations` — consecutive iterations in which no verdict moved.\n- `last_signature` — the rulings' signature at the last iteration, so the first iteration after a resume is compared against something rather than always looking like progress.\n- `escalations: Vec<Escalation>` — questions put to a human that nobody has answered. `Escalation::node_id` is kept structurally, not folded into prose, so answering one can give that node its revisions back.\n- `retries`, `failed_dispatches`, `alerts_raised` — recovery and alert counters that likewise span every resume (\"an alert fires once per run, and a resume is the same run\").\n\n`completed_nodes` means *has this node ever run in this run*, not *did it run this iteration*. Phase completion is computed from it, so the append-only reading is what stops a phase reopening every iteration.\n\n`Checkpoint::new(run_id)` gives a zeroed checkpoint stamped with `now_ms()`. Every field added since the type shipped carries `#[serde(default)]`, so checkpoints written by an older build still deserialise — `state: None` means \"written before runs had states, and every such run was closed.\"\n\n### `IterationSummary` — why long runs are affordable\n\nWithout a compressed per-iteration record, iteration N+1 either re-sends every prior episode (unbounded growth) or sends nothing (which is what the runtime did before, and is why a stalled loop kept producing the byte-identical prompt it had already failed with).\n\nThe split inside the type is the point: `facts: Vec<String>` is written by Rust from the gate's own verdicts and is always present; `narrative: Option<String>` is optional model prose and is never load-bearing. A model may describe what happened, but the record of *what was satisfied* is never something a model wrote. `render()` emits `### Iteration N`, the headline, the facts as bullets, then the trimmed narrative if non-empty.\n\n### `Proposal` — evidence with a shelf life\n\nA proposal is a change the loop wants but may not apply. `ProposalKind` covers `AdoptSkill`, `DropSkill`, `TrySkill`, `ReshapeGraph`, and `ChangeCriteria`.\n\nNothing expires a proposal automatically and nothing deletes one — the record of what the loop wanted is worth keeping — but a reviewer needs to know which suggestions are answering a question nobody is asking any more. `Proposal::default_lifetime_ms` decides that by kind:\n\n- `TrySkill` — 7 days. It names a marketplace listing that may already be gone.\n- `AdoptSkill`, `DropSkill`, `ReshapeGraph` — 30 days. They are about a skill set or a graph the reviewer has probably edited since.\n- `ChangeCriteria` — `None`, never expires. It is a question about the goal, not an observation about a run.\n\n`with_default_expiry()` stamps that lifetime onto `created_ms` via `checked_add`, and leaves an explicitly set `expires_ms` alone. `is_expired(now_ms)` treats the expiry instant itself as already stale. The match in `default_lifetime_ms` is exhaustive on purpose: a new kind cannot be added without deciding its lifetime, and `every_proposal_kind_has_a_decided_lifetime` pins each decision so a change to one shows up in a diff.\n\n### `SkillTrial` and `score_skills` — self-evolution grounded in verdicts\n\nA loop cannot reason its way to knowing which sub-agents earn their place; it has to try them and watch the gate. Each `SkillTrial` pairs a skill with the gate outcome that followed — `pass_rate` for the node's goals and whether they all ended satisfied.\n\nTrials are keyed **globally**, not per run (`st/<seq>`), because a skill's track record is only meaningful across runs — one bad loop should not erase it. `Store::skill_trials()` accordingly takes no `run_id`.\n\n`score_skills(&[SkillTrial]) -> Vec<SkillScore>` groups by skill name, counts trials and satisfactions, means the pass rate, and sorts by `satisfaction_rate()` descending with trial count as the tiebreak. It is consumed by `src/cmd/skills.rs::scores`. A skill with too few trials is reported but should not be acted on — one lucky run is not evidence, and the struct exposes `trials` so the caller can apply that judgement.\n\n### `Namespace` and `Record` — memory across runs\n\n`Namespace` mirrors `execution.memory.namespaces` in the config model: `Episodic` (what happened), `Semantic` (stable domain facts), `Procedural` (ways of working that worked), `Failure` (known failure modes and what got past them). `Namespace::ALL`, `as_str()`, and `parse()` round-trip the snake_case names.\n\nA `Record` is keyed by `(namespace, key)`. Writing the same key again is **corroboration, not duplication**: the writing run is appended to `runs`, and it is that count — distinct runs, not writes — that promotion reads. `confidence` is a 0-to-1 floor check at retrieval; `promoted` marks a record that has cleared its namespace's bar. The promotion and refusal policy itself lives in the `namespaces` module, which re-exports `Note` and `Remembered`.\n\n## The sled backend\n\n`sled_store.rs` implements `Store` over a single `sled::Db`. Keys are prefix-and-zero-padded so `scan_prefix` returns records in insertion order with no secondary index:\n\n```text\nep/<run>/<seq:020>      episode\ngs/<run>/<target>       goal state\nlg/<run>/<seq:020>      ledger entry\nck/<run>                checkpoint\nsp/<run>/<key>          scratchpad\nsu/<run>/<iter:020>     iteration summary\nst/<seq:020>            skill trial (global, deliberately not per run)\npr/<run>/<seq:020>      proposal\nmr/<ns>/<key>           cross-run record\n```\n\nThree key-layout decisions carry meaning:\n\n- **Summaries are keyed by iteration, not sequence.** Re-summarising an iteration must *replace* it, not append a second version a later `summaries()` read would silently include twice.\n- **Skill trials have no run segment**, for the reason above.\n- **Runs are discovered from checkpoint keys.** `runs()` scans `ck/` and strips the prefix, so a run exists exactly when it has a checkpoint.\n\n`next_seq()` wraps `db.generate_id()` — one monotonic counter shared by every keyspace, since only relative ordering matters. `put` and `scan` are the two private helpers every method funnels through; `scan` deserialises with `serde_json`, so a `serde_json::Error` becomes `MemError::Serde` via `#[from]`.\n\n`save_checkpoint` calls `flush()` itself rather than trusting the background flusher to beat a crash — the checkpoint is the resume contract, so it is made durable immediately.\n\n`prune_episodes(before_ms)` scans `ep/`, deserialises each episode to read `created_ms`, and removes those older than the cutoff, returning the count. It is the only method that deletes bulk history.\n\n### Opening: waiting out a lock that is already being released\n\n`SledStore::open` retries. Sled releases its file lock as part of cleanup, and neither `drop` nor process exit makes that instantaneous, so \"locked\" usually means \"locked for another millisecond\". Failing immediately turns an ordinary race into a user-visible error.\n\nThe web UI is what made this reachable: pressing Run and then Status spawns two processes back to back, and the first is often still exiting when the second opens. Under the CLI alone the gap was a human's reaction time.\n\n```mermaid\nflowchart TD\n    A[\"open(path)\"] --> B[\"sled::open\"]\n    B -->|Ok| C[\"SledStore\"]\n    B -->|Err| D{\"is_lock_contention?\"}\n    D -->|no| E[\"MemError::Backend(raw)\"]\n    D -->|yes| F{\"past LOCK_WAIT (2s)?\"}\n    F -->|yes| G[\"MemError::Backend<br/>'locked by another<br/>loopsmith process'\"]\n    F -->|no| H[\"sleep, double backoff<br/>5ms → 150ms cap\"]\n    H --> B\n```\n\n`is_lock_contention` matches narrowly on purpose: the typed `sled::Error::Io` kinds `WouldBlock` and `ResourceBusy`, falling back to the message text (`\"could not acquire lock\"`, `\"WouldBlock\"`) because sled stringifies the io error on some paths. A corrupt database or a missing directory must not be retried, so anything else surfaces immediately with sled's own message.\n\n`LOCK_WAIT` is two seconds — far longer than the milliseconds a releasing lock needs, and short enough that a genuinely held lock reports quickly rather than hanging. Backoff doubles rather than polling at a fixed interval so the common case, which clears on the first retry, does not pay for the rare one. Two tests hold both ends of that trade: `opening_waits_for_a_lock_that_is_being_released` asserts the call actually waits ~120ms for a holder dropped on another thread, and `a_lock_nobody_releases_is_reported_rather_than_waited_on_forever` asserts it gives up at the deadline, within 3× of it, with a message naming what is holding the database — or the user has nothing to act on.\n\n## Errors\n\n`MemError` has four variants and `Result<T>` aliases over it:\n\n- `Backend(String)` — anything sled reported, including the lock-timeout message.\n- `Serde(#[from] serde_json::Error)` — a value that would not encode or decode.\n- `Rejected(String)` — a write that failed validation. Nothing was stored.\n- `NotFound(String)` — reserved; the read methods return `Ok(None)` for a missing key rather than erroring.\n\n## How the rest of the workspace uses it\n\n`loopsmith-memory` sits at the bottom of the stack, above only `loopsmith-core` and `loopsmith-util` (from which it re-exports `now_ms`, so the whole workspace reads one clock).\n\n```mermaid\nflowchart LR\n    G[\"loopsmith-gate\"] -->|\"GoalState<br/>(sole author of satisfied)\"| M[\"loopsmith-memory\"]\n    R[\"loopsmith-run\"] -->|\"Episode, LedgerEntry,<br/>Checkpoint, Proposal,<br/>SkillTrial, Summary\"| M\n    S[\"loopsmith-skills\"] -->|\"score_skills\"| M\n    MC[\"loopsmith-mcp\"] -->|\"Episode over stdio\"| M\n    M --> U[\"loopsmith-util<br/>(now_ms)\"]\n```\n\nConcretely, in the current tree:\n\n- **`loopsmith-run`** is the heaviest writer. `logging::entry` builds `LedgerEntry` values, reached from `context::enter` and `context::save_or_halt` and from `recovering::answer` — which is why an ordinary iteration, a close, a plan approval, and a recovery all land in the same ledger. `context::open` → `read_checkpoint` is the resume path; `evolve::write` constructs `Proposal`s and `evolve::record_trials` constructs `SkillTrial`s.\n- **`loopsmith-gate`** calls `to_goal_state` to produce the only satisfied `GoalState` in the system, and can revoke: delete a required artifact and a satisfied goal flips back.\n- **`loopsmith-mcp`** builds `Episode`s in `tool_record`, exposing the memory plane over stdio alongside the gate and graph.\n- **`src/cmd/skills.rs::scores`** calls `score_skills` for the CLI's skill ranking.\n\nThe ledger deliberately records every stop-gate trigger, not just successes. A node that hits its ceiling constantly is a signal, and that signal is invisible if only completions are logged.\n\n## Contributing notes\n\n- **Adding a `Store` method** means implementing it in `SledStore` and picking a key prefix. Ask whether the record is per-run or global before choosing the shape — the skill-trial keyspace is the precedent for global, and it is a decision about meaning, not storage.\n- **Adding a field to a persisted struct** requires `#[serde(default)]`. These types live in a sled store that outlives the binary that wrote them; `a_proposal_written_before_the_field_existed_still_deserialises` exists because without it, `loopsmith proposals` reports a backend error on a perfectly healthy store.\n- **Adding a `ProposalKind`** forces a `default_lifetime_ms` arm. Keep the match exhaustive and add the row to `every_proposal_kind_has_a_decided_lifetime`.\n- **Adding validation** belongs in the write path, before `next_seq()` or `put`, and must return `MemError::Rejected` — the contract is that a rejected write stores nothing, and tests assert emptiness afterwards.\n- **Tests** use `loopsmith_util::testing::temp_path` (via the `testing` feature, a dev-dependency) through the local `tmp(tag)` helper, and clean up with `remove_dir_all`. The crate's `include` list ships only `src/` and `README.md`, because the integration tests read `config/examples/` and `config/loop.schema.json` from the repository root — paths no crate tarball can contain.","other":"# Other\n\n# The Stress Harness (`loopsmith-cli/tests`)\n\nIntegration tests for the `loopsmith` binary. Every crate in the runtime has unit tests; this directory covers what unit tests structurally cannot — whether the pieces work *together*, under a real iteration loop, driven through the real binary, against the configs users are actually handed.\n\n```sh\ncargo test -p loopsmith --test stress     # the iteration loop\ncargo test -p loopsmith --test surface    # subcommands\ncargo test -p loopsmith --test compat     # portability of generated loops\ncargo test -p loopsmith --test opt_in     # gated: network and money\n```\n\n| File | Covers |\n|---|---|\n| `harness/mod.rs` | The `Fixture` builder. No tests of its own. |\n| `stress.rs` | Phases, isolation, stop gates, proposals, resume, export |\n| `surface.rs` | Subcommands that were implemented and never executed |\n| `compat.rs` | What a generated loop assumes about the machine it lands on |\n| `opt_in.rs` | Anything that reaches the network or spends money |\n\n---\n\n## Why a fixture exists\n\nThe shipped examples under `config/examples/` **cannot be run as they stand**, and both reasons are deliberate design rather than defects:\n\n1. **Every example refuses.** `pre_execution` steps ship as `done: false`, so `validate` and `run` both stop. That refusal is the teaching mechanism.\n2. **No detector scripts exist.** The examples name 29 distinct `scripts/…` detectors between them; the repository ships none. A missing script becomes a detector *error*, which the gate converts to a failed check — correct behaviour, and useless for exercising anything past the first gate.\n\n`Fixture` therefore rewrites a **copy** in a scratch directory. Nothing under `config/examples/` is ever touched.\n\n```mermaid\ngraph LR\n  E[\"config/examples/*.yaml\"] -->|read| P[\"parse_str\"]\n  P --> U[\"unblock<br/>steps done\"]\n  U --> D[\"deterministic_providers<br/>printf + judge block\"]\n  D --> W[\"scratch dir<br/>loop.yaml\"]\n  W --> S[\"stub_scripts<br/>satisfy_files<br/>satisfy_metrics<br/>git_init\"]\n  S --> R[\"run_loop → real binary\"]\n  R --> A[\"ledger · run log · summaries · export\"]\n```\n\n### The builder\n\n`Fixture::example(name, tag)` loads a shipped example; `Fixture::from_yaml(text, tag)` takes config text directly, for shapes no example has. Both funnel through `from_yaml`, which parses, applies `unblock` and `deterministic_providers`, and writes `loop.yaml` into a temp directory named from `tag`.\n\nThe remaining methods are chained opt-ins, each returning `Self`:\n\n- **`stub_scripts(Stubs)`** — writes an executable stub for every `scripts/…` path the config names. `Stubs::Pass` exercises the success path and the export; `Stubs::Fail` reaches `no_progress_iterations`, the randomness gate, and `max_revisions_per_node`. `Stubs::PassFrom(n)` fails until iteration `n` using a `.stub-count` file in the loop root, because the loop cannot change its own environment between iterations.\n- **`satisfy_files()` / `write_artifacts(body)`** — creates every path a `file_exists` detector points at. `satisfy_files` uses `ARTIFACT_BODY`, which carries a URL and a `post_id:` line; see the trap below.\n- **`satisfy_metrics()` / `metrics(&[(name, value)])`** — writes `metrics.json`, where threshold detectors read from. The no-argument form derives a satisfying value per `CompareOp` via `satisfying_value`.\n- **`git_init()`** — makes the loop directory a repository *with a commit*, so `isolated: true` produces a real worktree. A repository with no `HEAD` makes `git worktree add` refuse to branch from nothing.\n\nMutating `cfg` in place is the normal way to reshape a scenario (`cap`, `starve`, pushing a provider), but **nothing notices until you call `write_config()`**.\n\n### Running and reading back\n\n`run(args)` and `run_with_env(args, env)` invoke `LOOPSMITH` — the path Cargo hands over in `CARGO_BIN_EXE_loopsmith`, so there is no `cargo run` here and no chance of driving a stale build. `run_loop(run_id, env)` is the common case: `run loop.yaml --run-id <id> --no-acquire`.\n\nAssertions then read the **record**, not stdout:\n\n| Accessor | Reads |\n|---|---|\n| `store()` | the sled ledger, episodes, goal states, summaries, proposals, checkpoint, skill trials |\n| `log_text(run_id)` | `logs/<run-id>.log` |\n| `export_dir()` | `<config name>-success/` |\n\nStdout is a report. One invariant recurs and is worth keeping: the run log and the ledger are written through a single call, so they must always hold the same number of events. A divergence means one of the two write paths grew a branch the other did not — `every_example_completes_an_iteration_and_leaves_a_consistent_record` asserts exactly that.\n\n---\n\n## Harness-authoring traps\n\nThese are not stylistic preferences. Each one has produced a failure that reads like a bug somewhere else.\n\n**Give every fixture a distinct tag.** Temp directories are named from it and the suite runs threaded, so two concurrent tests sharing a tag collide on the sled lock — with nothing in the error pointing at the tag. Loops over `all_examples()` use `&format!(\"all-{i}\")` for this reason.\n\n**The store cannot be opened while the binary under test is running**, and the handle must be `drop`ped before its directory is removed. A store opened around a `Command` call reports a lock error that reads like a backend bug. Every test in `stress.rs` ends `drop(store); f.cleanup();`.\n\n**Providers keep their ids when they are swapped for stubs.** `deterministic_providers` rewrites `kind`, `command`, `args`, and clears `requires_env`, but leaves `id` alone — `enforce_judge_independence` compares ids to require that a judge sits on a different provider from the builder it reviewed. Rewriting the ids would quietly switch that check off.\n\n**A judge PASS with no evidence is demoted to FAIL.** `judge_payload` emits `VERDICT/STANDARD/EVIDENCE/SCORE` for every `Detector::Judge` in the config; the `EVIDENCE:` line is mandatory or every subjective validation becomes permanently unsatisfiable. `failing_judge_payload` is the inverse, and `set_provider_output` points one id at a different payload so a judge can disagree while builders carry on.\n\n**`satisfy_files` writes a body, not a placeholder.** The files a `file_exists` detector names are the same files a `regex_match` detector reads — evidence collection registers them under their stem — so the default body carries the tokens the shipped examples look for. Without them the file exists, `file_exists` passes, and the regex on the same file fails.\n\n**A detector script runs with no shell and no timeout.** `command` is argv[0] and `args` are literal, so a stub needs a shebang and must not hang.\n\n---\n\n## Windows stubbing\n\nWindows has no shebang handling, so a `#!/bin/sh` stub is unrunnable and every stubbed detector fails to spawn. `stub_scripts` writes a `.cmd` instead and `point_at_cmd_stubs` repoints the config's detector commands at it. Rewriting rather than skipping keeps the iteration loop covered there, and the rewrite is honest — it is exactly what a user has to do.\n\nThe subtlety is *which* detectors get repointed. `detectors` and `detectors_mut` walk checks **and** every entry, approval, and rollback gate rule. These were two separate lists once, and only the first learned about gates: on Windows an entry gate went on naming the `.sh` whose `.cmd` replacement had been written, the run failed while still validating, and the only symptom was `a run must open the ledger` — because `RunStarted` had not reached the ledger yet. Keep `detectors` and `detectors_mut` side by side; they must have the same order and the same members.\n\n`point_at_cmd_stubs` is a plain function of the config rather than a Windows-gated branch, so `the_windows_stubs_are_named_by_every_detector_they_replace` runs on **every** OS and fails locally first. It also asserts `gate_scripts > 0`, so the test cannot pass while proving nothing about the half of the list that broke.\n\n---\n\n## What `stress.rs` pins\n\nTwo scenario shapers sit at the top and appear throughout:\n\n- `cap(cfg, n)` — sets `max_iterations`, zeroes `no_progress_iterations`, clears the randomness threshold. Without it a scenario sits in a long example's default ceiling of ten iterations and three hours.\n- `starve(cfg, target)` — rewrites every validation on a target to `command: \"false\"`, so a run keeps iterating instead of succeeding on its first pass. Starving `overall` while leaving the per-goal checks satisfiable is how the phase-ordering tests keep a run alive long enough to observe.\n\nTwo inline configs carry the rest: `NEVER_SATISFIED` (one node, nothing satisfiable — the base for proposals, resume, and perturbation), plus `ISOLATED_WRITER` and `ISOLATED_CHAIN` for the worktree tests.\n\nThe scenarios group into six areas.\n\n**The whole set, twice.** `every_example_completes_an_iteration_and_leaves_a_consistent_record` runs all 13 examples with everything satisfiable; `every_example_survives_a_run_where_nothing_passes` runs them with no stubs, no artifacts, no metrics. A detector that fails closed is correct; a runtime that panics on one is not. This pair is the cheapest signal that a config change broke the runtime rather than the schema.\n\n**Phases.** `phases.rs` is unit-tested against synthetic verdicts. `phases_open_one_at_a_time_across_a_real_run` is the first time the ordering is asserted against verdicts the gate actually produced, walking `traffic-loop`'s four linear phases and checking that each node's *first* iteration strictly follows its predecessor's. `a_phase_that_never_satisfies_its_goals_never_opens_the_next_one` covers the negative: no timeout, no eventual give-up that lets later work start anyway.\n\n**Isolation.** Outside a repository, `isolated: true` degrades to the shared directory — silently, by design — and `isolation_degrades_to_shared_outside_a_repository` asserts the degradation is *reported* rather than hidden. Inside one, `isolation_is_real_inside_a_repository` requires `state/worktrees/<node>/` per isolated node. The two harder cases concern visibility: a worktree branches from `HEAD`, so an isolated node starts blind to everything the run has produced since. `an_isolated_builders_output_reaches_the_gate` covers publishing back to the loop root (before it existed, a `file_exists` detector on an isolated builder's output could never pass — the work was real, on disk, and invisible to the only thing allowed to rule on it), and `an_isolated_node_can_read_what_its_isolated_upstream_produced` covers the seeding that publishing did not fix, for the node reading its own tree.\n\n**Stop gates and the randomness agent.** `a_run_with_no_moving_verdicts_halts_on_no_progress` checks the halt fires long before the iteration cap. The randomness gate has three tests because only its *seeded fallback* had ever run — no cheap provider is reachable in a test environment, so `ask_agent` returned `None` every time and `parse_choice` saw only strings. A deterministic cheap provider on the `cheap` cascade closes that: `the_randomness_agent_chooses_when_a_cheap_provider_answers` proves the directive survives the round trip, and `an_answer_off_the_menu_falls_back_rather_than_being_guessed_at` proves an off-menu `CHOICE:` is discarded in favour of the seed and does not leak into the recorded choice.\n\n**Resume.** Everything the stop gates count used to be declared inside the iteration loop, so it was rebuilt from nothing whenever a run resumed — a long-lived loop resuming on a schedule could never reach the ceilings that exist to stop it. Two tests pin the fix: `a_resume_does_not_hand_a_stuck_node_its_revision_budget_back` (checks `checkpoint.revisions`) and `a_resume_does_not_reset_the_no_progress_counter` (checks `stale_iterations` **and** that `last_signature` is non-empty, or the first iteration after a resume always looks like progress).\n\n**Proposals.** The loop is not allowed to reshape itself, so evidence about the graph has to surface as a proposal. One test per kind — `ReshapeGraph` from an exhausted revision budget, `ChangeCriteria` from a detector that *cannot run* as distinct from one that fails, `TrySkill` for unexplored candidates when `explore` is off. Each asserts exactly one proposal (not one per iteration) and that the proposal is not self-applying: the config on disk stays untouched, and no ledger entry shows the skill being acquired.\n\nTwo smaller ones close gaps nothing else reaches: `a_summary_provider_adds_prose_that_cannot_decide_anything` (a configured `summary_provider` claims everything is complete; the gate disagrees and the gate is the only thing that counts) and `a_skill_trial_records_what_the_node_that_used_it_cost` — without `SkillTrial.tokens` the ranking cannot tell a skill that lifts the pass rate for free from one that does it by tripling the bill.\n\nFinally, two combinations no single unit test covers: `perturbation_and_phases_do_not_dispatch_a_shut_phase` (a shuffle that assumed every node in the wave was eligible would dispatch work whose phase is shut) and `a_phased_loop_that_succeeds_still_exports` (phases gate dispatch; they must not gate the certificate).\n\n---\n\n## What `compat.rs` pins\n\nA loop directory outlives the checkout that produced it and gets copied to build boxes, containers, and colleagues' laptops. Three differences break it every time, and all three are invisible on the machine that wrote it: **bash 3.2** (macOS still ships it, because 4.0 changed licence), **BSD versus GNU `sed`/`stat`/`readlink`**, and **whichever scheduler is installed**, which is not implied by the OS.\n\nThese tests *run* the generated scripts rather than reading them. `new_loop(tag)` scaffolds into a scratch directory via `loopsmith new --path . --name portable --force` — never in-tree, because `new` refuses a path inside the loopsmith checkout.\n\n`the_compatibility_helpers_work_under_posix_sh` sources `scripts/compat.sh` under `sh` and exercises **every** helper (`compat_report`, `sed_i`, `stat_size`, `stat_mtime`, `readlink_f`, `sha256`, `require`), because a helper that is never called is a helper nobody has checked. It also asserts the in-place edit leaves no `sample.txt.bak` behind — the litter a wrong `sed -i` spelling produces on BSD.\n\n`need_bash` and `require` must exit **2, not 1**. A detector's exit code is its verdict; \"this machine cannot run the check\" is a different fact from \"the check failed\", and a gate that cannot tell them apart reports missing tooling as unfinished work.\n\n`the_generated_scripts_parse_under_posix_sh` uses `sh -n` to parse without executing, then scans for bashisms (`[[`, `declare -A`, `mapfile`, `readarray`, `${!`, `&>>`) — through `strip_comments`, because these files *document* the constructs they must not use and a check that reads prose flags its own explanation. `strip_comments` drops everything after the first `#` on a line and blanks any line starting `rem ` (case-insensitive), the same trap in the `.cmd` dialect.\n\n### The `.cmd` launcher\n\n`the_generated_cmd_launchers_are_crlf_and_shaped_for_cmd_exe` encodes several `cmd.exe` traps that Windows CI walked into:\n\n- **CRLF is required.** With LF only, the trailing newline becomes part of the last token on a line, so `exit /b 2` turns into an unknown command with no useful message attached. The test counts lone-LF endings and requires zero.\n- **Exactly one exit, on the last line, `endlocal & exit /b %CODE%`.** `setlocal` saves the errorlevel and the implicit `endlocal` restores it, so an early `exit /b 127` reports 0 — a loop whose binary had moved printed its diagnostic and then exited *successfully*. Writing `endlocal & exit /b 127` fixes that on a top-level line but **not** inside a nested `if ( … )` block, which is where the broken one was. A single exit point plus a `:loopsmith_done` label needs no reasoning about block parsing.\n- **Delayed expansion.** A parenthesised block is parsed before it runs, so `%ERRORLEVEL%` inside one expands to the value from *before* the block. The test requires `setlocal enabledelayedexpansion` and forbids `set \"CODE=%ERRORLEVEL%\"`.\n- `cd /d \"%~dp0\"`, so the launcher runs from its own directory.\n\n### Cross-platform launcher selection\n\n`launcher(dir, stem)` returns a runnable `Command` for whichever launcher *this* host can execute — `cmd /c run.cmd` on Windows, `./run.sh` otherwise. Windows cannot run a `#!` script and no POSIX shell will run a `.cmd`, which is exactly why both are generated; a test hardcoding `./run.sh` would test nothing on Windows, and `#[cfg(unix)]` would leave the `.cmd` unexercised on the only platform that runs it.\n\n`with_system_path(dir)` builds a `PATH` containing only `dir` — plus `%SystemRoot%\\System32` on Windows, because the `.cmd` launcher searches with `where.exe`, which lives there. On unix the `.sh` launcher uses `command -v`, a shell builtin that needs nothing on `PATH`. Without the addition, the fallback test would stop measuring the fallback and start measuring whether `where` exists.\n\nThose two feed `a_generated_script_falls_back_to_path_when_the_pinned_binary_has_moved`: the script pins an absolute path (cron and launchd do not inherit a login shell's `PATH`), but a moved binary must produce exit 127 with a message naming `not on PATH` and telling the user to `Re-point it` — then be found again when the real binary is on `PATH`. `the_export_script_is_posix_and_does_not_pin_a_binary` is the inverse for exports, which travel furthest and must assume least.\n\n`the_generated_scripts_keep_the_indentation_they_were_written_with` pins a Rust-side trap: a `\\` line continuation inside a **non-raw** `format!` eats the leading whitespace of the next line, and the generated `run.sh` reached disk flat and unindented because of it. Nothing about that fails a build or a parse, so the only way it stays fixed is a test that reads the layout back.\n\n### `doctor`\n\n`doctor` must report `os`, `userland`, `bash`, `scheduler`, and `git`, quote the in-place `sed -i` spelling for this userland, and **stay advisory** — reporting a constraint is not the machine being unusable, and a non-zero exit would fail a CI step that was working. Pointed at a config it also names detector scripts that do not exist, and (unix only) ones that exist but are not executable, with `chmod +x` in the message. That gate is on the whole test, not just the `chmod`: there is no executable bit off unix, so `loopsmith_util::is_executable` degrades to a file check and `doctor` is *right* not to report anything — a `#[cfg]` around only the chmod would leave a test asserting the wrong thing on Windows.\n\n---\n\n## `opt_in.rs`\n\nEvery test here returns without asserting unless its environment variable is set, via the `gated!` macro, which accepts `1` or `true` and otherwise prints why it is skipping. So `cargo test --workspace` never clones a repository, never calls a model, and never costs anything.\n\n```sh\nLOOPSMITH_STRESS_NETWORK=1  cargo test -p loopsmith --test opt_in\nLOOPSMITH_STRESS_PROVIDER=1 cargo test -p loopsmith --test opt_in -- --nocapture\nLOOPSMITH_STRESS_DOCKER=1   cargo test -p loopsmith --test opt_in\n```\n\n| Variable | Covers |\n|---|---|\n| `LOOPSMITH_STRESS_NETWORK` | `git clone --depth 1` into quarantine; the post-clone `init_command` running *inside* the installed directory |\n| `LOOPSMITH_STRESS_PROVIDER` | one real-provider run of `research-loop`; the randomness agent keeping to its four-item menu with a real model |\n| `LOOPSMITH_STRESS_DOCKER` | a container node actually running in a container |\n\n`an_unsafe_repo_url_is_refused_before_git_is_reached` is deliberately **not** gated — refusing `file:///etc` takes no network, and it is the half of the clone path that matters most.\n\nThe provider tests read the example directly rather than through `Fixture::example`, since the whole point is keeping the real providers. They cap iterations and set `max_cost_usd`, then assert against episodes' `provider_id` and a `GateEvaluated` entry in the ledger. Point `LOOPSMITH_STRESS_PROVIDER` at the cheapest model you have; the aim is to prove the plumbing reaches a real provider, not to get a good answer.\n\n`a_container_node_really_runs_in_a_container` is the only test that calls library APIs rather than the binary. `loopsmith_run::container` has unit tests for the *decision* (which image, network or not, degrade or not) and `loopsmith_provider::container_argv` has unit tests for the *argv*, but neither had ever handed that argv to a daemon — so three things nobody could see were untested: that the mount spelling is one a real runtime accepts, that `-w /work` puts the command where the node's files are, and that `--network none` is *applied* rather than merely appended. It probes via `rt::probe()` and skips gracefully if no runtime is present. The image is `alpine:3` and the command is `cat`, because a provider's CLI has to exist *inside* the image — the host's copy is not visible in there, which is the whole point of the isolation.\n\n`the_harness_still_builds_a_runnable_fixture` is ungated, so a failure above is about the network or the provider rather than the scaffolding around it.\n\n---\n\n## Deliberately not covered\n\n- **Actually loading a launch agent.** `--install` writes the plist and stops; `launchctl load -w` stays the user's call. The write itself is covered because `LOOPSMITH_LAUNCH_AGENTS_DIR` redirects the destination. Same reasoning for `schtasks /Create`: `schedule` prints the command rather than running it.\n- **Executing a `.cmd` launcher.** No POSIX host can run one, so this suite checks its shape and the `windows-latest` CI leg runs it.\n- **A GNU userland, locally.** `compat.rs` exercises the helpers rather than mocking the userland, so everything portability-related is asserted on whichever machine the suite runs on — and this one is BSD. The `ubuntu-latest` CI leg proves the other half by running the same tests.\n\n---\n\n## Traps that used to be prose\n\nEach of these was a sentence someone had to remember. A remembered rule is one refactor away from being gone, so each is now something that fails.\n\n| Trap | Pinned by |\n|---|---|\n| A `\\` continuation in a non-raw `format!` eats the next line's indentation | `the_generated_scripts_keep_the_indentation_they_were_written_with` |\n| `cmd.exe` needs CRLF; LF-only makes the last token unparseable | `the_generated_cmd_launchers_are_crlf_and_shaped_for_cmd_exe` |\n| A bashism check that reads comments flags its own explanation | `strip_comments`, extended to `rem ` for the `.cmd` dialect |\n| The userland is probed with `sed --version`, never inferred from the OS | `the_userland_is_probed_and_never_inferred_from_the_operating_system` (`platform.rs`) |\n| Windows fell into the catch-all arm and was offered `crontab` | `every_os_has_a_scheduler_worth_probing_and_windows_gets_the_native_one` |\n| `HOME` is unset on Windows | `the_home_directory_is_found_by_this_platforms_variable` |\n| `require` / `need_bash` exit 2, not 1 | `need_bash_exits_two_so_a_missing_tool_is_not_read_as_a_failed_check` |\n| A new `ProposalKind` must decide its own staleness | `every_proposal_kind_has_a_decided_lifetime` (`loopsmith-memory`) |\n| Proposals written before `expires_ms` existed must still load | `a_proposal_written_before_the_field_existed_still_deserialises` |\n\n---\n\n## Adding a scenario\n\n1. Pick a **unique tag**. Grep the suite if unsure.\n2. Start from `Fixture::example` when the point is that a *shipped config* works; from `Fixture::from_yaml` (or `NEVER_SATISFIED`) when the point is a shape no example has.\n3. Apply `cap` and, if the run must stay alive, `starve` — then `write_config()`.\n4. Chain the opt-ins the scenario actually needs. Stubbing and artifacts are not free; a test that stubs what it does not read is a test whose failure mode is unclear.\n5. Assert against `store()`, `log_text()`, or `export_dir()`. If you find yourself matching on stdout, the fact you want is probably in the ledger.\n6. End with `drop(store); f.cleanup();`.","overview":"# loops — Wiki\n\n# loopsmith\n\n**Self-evolving agent loops. The gate is code, so \"done\" cannot be argued.**\n\nloopsmith runs an AI agent in a loop against a goal, and stops when a program — not a model — says the goal is met. You write a config describing what you want, how work gets done, and what must be true for it to count as finished. loopsmith iterates: dispatch nodes, collect evidence, evaluate the gate, and either stop or try again with what it learned.\n\nThe load-bearing idea is a separation the whole codebase is organized around: **the thing doing the work never decides whether the work is done.** A model can write code, fix tests, and argue persuasively that it succeeded. It cannot set `goal_satisfied`. That flag is written in exactly one place in the workspace, by a crate whose entire job is to compare exit codes, file existence, regex matches and numbers against thresholds.\n\n---\n\n## Architecture at a glance\n\n```mermaid\ngraph TD\n    CLI[loopsmith-cli<br/>commands & scaffolding]\n    CORE[loopsmith-core<br/>config model]\n    RUN[loopsmith-run<br/>iteration engine]\n    GATE[loopsmith-gate<br/>the verdict]\n    PROV[loopsmith-provider<br/>model invocation]\n    MEM[loopsmith-memory<br/>ledger & episodes]\n    GRAPH[loopsmith-graph<br/>wave scheduling]\n    MCP[loopsmith-mcp<br/>control plane]\n    UTIL[loopsmith-util<br/>primitives]\n\n    CLI --> CORE\n    CLI --> RUN\n    RUN --> GRAPH\n    RUN --> PROV\n    RUN --> GATE\n    RUN --> MEM\n    GATE --> MEM\n    MCP --> MEM\n    CORE --> UTIL\n```\n\nRead it top to bottom: the CLI parses a config, the engine plans and dispatches it, the gate rules on it, and memory remembers all of it. `loopsmith-util` sits underneath everything with zero dependencies of its own.\n\n---\n\n## The pieces\n\nA run starts as text. The [loop configuration schema](loop-configuration-schema.md) is the shared vocabulary every other crate reads — four bundles answering four questions: `intent` (what is this for?), `execution` (how does work happen?), `safety` (what must not happen?), `evolution` (what may change?). You can write it as YAML or as a Markdown document; the [Markdown/YAML interchange](markdown-yaml-config-interchange.md) treats them as one model in two grammars, translating in both directions without knowing anything about the config types.\n\nThe [CLI command surface](cli-command-surface.md) is what you type. It owns the argument grammar, one module per command, and the scaffolding that materializes a new loop directory — but it runs nothing itself. Every command loads a config and calls into a library crate.\n\nThe [loop execution engine](loop-execution-engine.md) owns everything between \"start\" and \"here is why it stopped\": the iteration loop, node dispatch, isolation and recovery, the stop-gate ladder, and the success export. Before each iteration, [execution graph planning](execution-graph-concurrency-planning.md) turns `depends_on` declarations into wave groupings, a critical path, and a worker count derived by arithmetic rather than guesswork. Dispatch itself goes through [provider integration](provider-integration.md), which treats every model — Claude Code, Ollama, a Grok CLI, an HTTP endpoint driven by `curl`, an MCP server over stdio — as a command template. Adding a provider is a config edit, never a rebuild.\n\nThen [gating and success criteria](gating-success-criteria.md) rules. No model is in that loop.\n\nWhen a loop stalls, [evolution and perturbation](evolution-perturbation.md) lets it change *how* it works without touching *what counts as done* — varying dispatch order, tier, sub-agent, and prompt for an iteration, and recording proposals for the operator. [Skills](skills-system.md) handle sub-agent acquisition: find what a node needs, install it somewhere inert, and rank future choices by what the gate ruled afterward.\n\nEverything a loop must not forget lives in the [memory and episode store](memory-episode-store.md) — node results, gate verdicts, an append-only audit trail, resume points, and cross-run learning. The [MCP server](mcp-server.md) exposes that control plane over stdio to any MCP client, deliberately omitting the one thing that would break the guarantee: there is no `mark_done` tool.\n\nAround the edges: [scheduling and triggers](scheduling-triggers.md) decides what starts a run and what stops it starting itself forever; [permissions and sandboxing](permissions-sandboxing.md) keeps two distinct things apart — the grant that stops consent prompts interrupting a hands-off run, and the isolation machinery that is the actual safety property; [platform utilities](platform-utilities.md) is the dependency-free bottom of the stack. [Distribution and installers](distribution-installers.md) gets the binary onto a machine and is coupled to the runtime only through a version string.\n\n---\n\n## How a run actually goes\n\n**Parsing.** Whatever you wrote — YAML, Markdown, or a request arriving through the web API — converges on the same path: text becomes a `serde_yaml::Value`, gets typed into a `LoopConfig`, and passes through migration that repairs older 0.3-era shapes in place. Config authored two versions ago still loads.\n\n**Planning.** Nodes declare dependencies; the graph crate groups them into waves and computes how many workers that parallelism is actually worth.\n\n**Iterating.** Each wave dispatches through the provider plane. Results, costs, and failures land in memory as they happen. If a node dies mid-iteration, the resume point in the ledger is enough to pick the run back up where it stopped.\n\n**Ruling.** The gate reads the evidence and constructs a verdict. Satisfied → export and stop. Not satisfied → check the stop ladder (budget, iteration cap, stall detection), then either stop with a reason or run again, possibly perturbed.\n\n---\n\n## Getting started\n\n```sh\n# Install (macOS / Linux)\ncurl -fsSL https://raw.githubusercontent.com/bitphill/loopsmith/main/install.sh | sh\n\n# Or build from a clone — Rust 1.85+\ncargo build --release\n```\n\nThen scaffold and run a loop:\n\n```sh\nloopsmith new my-loop      # materialize a loop directory\nloopsmith run my-loop      # start iterating\nloopsmith convert loop.md  # Markdown ↔ YAML\n```\n\nThe fastest way to learn the config model is to read the [example loops](example-loops.md) in `config/examples/` — fifteen worked configurations, each built around one lesson, which double as the integration-test fixtures and the web UI's example library.\n\nFor tests, `cargo test` covers the unit suites; the integration harness runs through the real binary:\n\n```sh\ncargo test -p loopsmith --test stress    # the iteration loop\ncargo test -p loopsmith --test surface   # subcommands\ncargo test -p loopsmith --test compat    # portability of generated loops\n```\n\n---\n\n## Where to look when you change something\n\nThe [project documentation](project-documentation.md) page explains which of the four root-level documents owns what, so a behavior change lands in one place rather than drifting across four. If you are touching the config model, expect the JSON Schema at `config/loop.schema.json` and the examples to move with it. If you are touching the gate, read `TargetVerdict::to_goal_state` first — it is the single construction site for a satisfied goal, and it stays that way on purpose.","permissions-sandboxing":"# Permissions & Sandboxing\n\n# Permissions & Sandboxing\n\nTwo unrelated mechanisms share this territory, and keeping them apart is the point of the design:\n\n- **The permission grant** is what stops the harness from interrupting a hands-off run with a consent prompt. It is a convenience that buys uninterrupted execution.\n- **The constraint and isolation machinery** is what stops a run from doing something you cannot undo. It is the safety property.\n\nThe grant is derived, narrow, and additive. It is *not* a security boundary, and the code says so in several places — `permissions.template.json` carries a `$deny_note` explaining that nothing is denied by default because \"denial is not the mechanism that protects you,\" and `render()` ends every preflight block with the reminder that human checkpoints stop the run \"grant or no grant.\"\n\n---\n\n## Deriving the grant\n\n`loopsmith_core::permissions::required(&LoopConfig) -> Vec<String>`\n(`runtime/crates/loopsmith-core/src/permissions.rs:17`)\n\nThe grant is computed from the config, never guessed or templated. It accumulates into a `BTreeSet<String>`, so the output is deduplicated and sorted — a property with a test of its own (`the_grant_has_no_duplicates_and_is_sorted`), because a sorted grant produces a stable diff in `.claude/settings.local.json`.\n\n| Rule | Derived from |\n|---|---|\n| `Read`, `Write`, `Edit`, `Glob`, `Grep` | Unconditional. The loop reads and writes inside its own directory. |\n| `Bash(<command>:*)` per provider | `cfg.execution.providers.providers[].command` |\n| `Bash(<command>:*)` per script detector | `cfg.safety.checks[].detector`, matched on `Detector::Script { command, .. }` |\n| `Bash(npx skills:*)` + `WebFetch(domain:claudemarketplaces.com)` | Only when `cfg.execution.skills.acquisition_order` contains `AcquisitionSource::Marketplace` |\n\nThe marketplace pair is the case that best shows the intent: a loop whose `acquisition_order` is `[installed]` gets no network rule at all. `marketplace_access_is_only_requested_when_the_policy_uses_it` asserts both directions — that the rules appear when the policy uses the marketplace, and that they are absent when it does not.\n\nNote that `required()` reads the **acquisition policy**, not `features.marketplace_skills`. The feature flag gates whether acquisition may happen at run time; the grant reflects what the config declares it intends to reach.\n\n## Presenting and writing it\n\n```mermaid\nflowchart LR\n    C[loop config] --> R[\"required(&cfg)\"]\n    R --> G[\"grant: Vec&lt;String&gt;\"]\n    G -->|no --write| P[\"render(&grant)<br/>stdout\"]\n    G -->|--write path| M[\"merge_into(path, &grant)\"]\n    M --> S[\".claude/settings.local.json\"]\n```\n\n**`render(&[String]) -> String`** produces the human-readable preflight block: a header, the rules one per line, and the closing note about checkpoints. It is the \"show it once, then ask once\" half of the compromise described in the module doc comment. `render_mentions_that_checkpoints_still_stop` pins the closing note in place so a reword cannot quietly drop it.\n\n**`merge_into(&Path, &[String]) -> io::Result<String>`** is the write path, and its contract is *additive and non-destructive*:\n\n- A missing file becomes `{}`; an existing file that fails to parse as JSON also becomes `{}` (`unwrap_or_else(|_| json!({}))`) rather than an error — a corrupt settings file does not block a run. A non-object root is likewise replaced.\n- `permissions.allow` is created if absent, then each grant string is appended only when not already present. Existing rules survive, and unrelated top-level keys survive: `merging_preserves_existing_rules_and_adds_new_ones` checks that both a hand-added `Skill(claude-api)` and an unrelated `\"theme\": \"light\"` are intact afterwards.\n- Repeated calls are no-ops (`merging_is_idempotent`), which is what makes it safe to wire into scaffolding and into a web button.\n- Parent directories are created before the write, so `--write .claude/settings.local.json` works in a fresh directory.\n\nThe returned string is the pretty-printed result, so every caller can display exactly what landed on disk.\n\n## The CLI surface\n\n`runtime/crates/loopsmith-cli/src/cmd/permissions.rs` is a thin shell over the two core functions:\n\n```\nloopsmith loop permissions <config> [--write <path>]\n```\n\nIt loads the config with `loopsmith_core::load`, derives the grant, and either prints `render(&grant)` or merges into `--write`'s path and prints a count plus the merged JSON. Every error is flattened to `String` via `map_err(|e| e.to_string())`; success is always `ExitCode::SUCCESS`.\n\n`permissions` is in the 0.3 alias table (`loopsmith-cli/src/cli/alias.rs`) mapped to the `loop` noun, so the bare `loopsmith permissions <config>` spelling still works and is rewritten before clap sees the arguments.\n\n### Other callers\n\n- **Scaffolding** (`loopsmith-cli/src/scaffold.rs:664`) derives the grant for the config it just generated and merges it straight into `.claude/settings.local.json`, falling back to `render(&grant)` as the file contents if the merge fails — so a new loop directory always ships with *something* readable in place. It also writes `permissions.template.json` alongside as documentation.\n- **The web UI** surfaces the grant twice: `loopsmith-web/src/assemble.rs:134` puts `required(cfg)` into the `Review` struct that the draft-review endpoint returns as you type (the `permissions_are_derived_rather_than_guessed` test covers that field), and `Action::PermissionsWrite { config, settings }` in `loopsmith-web/src/exec.rs:506` spawns the CLI as `loop permissions <config> --write <settings>` — the browser never touches the file itself, it asks for one of a closed set of argv shapes.\n\n## `permissions.template.json` — the shape, not the answer\n\nThe scaffolded template is deliberately over-broad and deliberately annotated as such. Its `$comment` tells the reader to generate the real file with `loopsmith loop permissions <config> --write .claude/settings.local.json`; the `$sections` map explains each group (`core_tools`, `control_plane`, `providers`, `detectors`, `acquisition`); and `$still_stops` enumerates what no allow-rule can authorise:\n\n- anything in `constraints.human_checkpoint`\n- publishing, sending, deleting, or paying\n- promoting a quarantined sub-agent out of `generated-skills/`\n- applying anything written to `proposals/`\n\n## What actually constrains a run\n\nThe grant says what will not prompt. These are the mechanisms that say what cannot happen.\n\n**Constraints** (`loopsmith-core/src/config/constraints.rs`). `ConstraintSet` carries `rules`, `forbidden_paths`, `forbidden_commands`, `max_tokens`, `max_seconds`, and `human_checkpoint` — the last documented as Bezos Type 1: \"irreversible decisions do not get made at machine speed.\" `ConstraintSet::merged(global, node)` appends node lists onto the global ones and lets node limits win where present. `frozen_git_rules()` is the canned set (no `git stash`, no `git reset`, no git command except committing a specific file) emitted into parallel nodes.\n\nConstraints reach a node two ways. `loopsmith-run/src/prompts.rs:32` renders them into the system prompt as `Never touch:`, `Never run:`, and `Stop and ask a human before:` lines. That is instruction, not enforcement — and the code is honest about the difference: `publish::forbidden_changes` (`loopsmith-run/src/publish.rs:88`) enforces `forbidden_paths` *mechanically*, but only for a node with `Isolation::Worktree`, where the worktree's git status is an exact record of what changed. A node sharing the loop root \"leaves no such record, so its `forbidden_paths` remain a prompt-level instruction and nothing more.\" When a worktree node does touch a forbidden path, `waves.rs:831` publishes **nothing** from it — \"the whole worktree is suspect, not just the offending file.\"\n\n**Protected components** (`loopsmith-core/src/config/protected.rs`). Self-evolution is only safe if the evolving thing cannot reach what constrains it. `ProtectedComponent` maps each protected area to dotted config paths, and the list includes `Approvals` → `safety.limits.global.human_checkpoint`, `safety.gates.approval`; `Credentials` → `execution.providers.providers.requires_env`, `secrets`; and `Protected` itself. The check lives in the gate — compiled code the loop cannot dispatch to.\n\n**Feature flags** (`loopsmith-core/src/config/environment.rs`). `Features` keeps capability separate from policy: `self_evolution`, `marketplace_skills` (\"this is the supply-chain surface\"), and `external_side_effects` all default to `false`; `human_approval` defaults to `true` and turning it off is refused outright in `prod`.\n\n## Process isolation\n\n```mermaid\nflowchart TD\n    I{\"node isolation\"} -->|not Container| H[Containment::Host]\n    I -->|Container| IMG{\"image named?\"}\n    IMG -->|no| D[\"Degraded(no image)\"]\n    IMG -->|yes| RT{\"runtime probe\"}\n    RT -->|Err| D2[\"Degraded(why)\"]\n    RT -->|Ok| CN[\"Container(image, network, runtime)\"]\n```\n\n`container::resolve` (`loopsmith-run/src/container.rs:98`) answers where a node's provider command runs, given the node's `Isolation`, the graph-level `execution.graph.container_image` fallback, and the result of `container::probe`. The node image wins over the graph image; `network` defaults off.\n\nThe load-bearing decision is that a container node **degrades to a worktree** rather than failing when the runtime is absent, its daemon is stopped, or no image is named — machines without Docker are the common case, and \"a loop that refused to run there would be a loop that only runs on its author's machine.\" The ledger records which happened. `probe()` caches its answer in a `OnceLock` (the answer cannot change mid-process, and a five-second daemon timeout in front of every dispatch would be intolerable) and reads `LOOPSMITH_DOCKER` to allow a CLI-compatible runtime such as `podman`.\n\n`loopsmith_provider::container_argv` (`loopsmith-provider/src/lib.rs:134`) builds the invocation: `run --rm`, `-i` when the provider takes its prompt on stdin, `--network none` unless the node asked for a network, `-v <workdir>:/work -w /work`, then `-e KEY` for each entry in `requires_env`. Passing env vars **by name** is deliberate — the runtime reads each value from the parent process's environment, so a secret never appears in argv where anyone on the machine could read it from the process table. The provider CLI must exist inside the image; the host's copy is not visible, which is the isolation.\n\n## Detectors run with no shell\n\nA `Detector::Script { command, args, expect_exit }` is executed by `run_detector` in `loopsmith-gate/src/lib.rs:436` as `Command::new(command).args(args).current_dir(&ev.workdir)`. There is no shell: `command` is argv[0] and every `arg` is a literal. No globbing, no pipes, no `&&`, no variable expansion. A detector that needs any of that is a real file with a real shebang.\n\n`compat.template.sh` (scaffolded to `scripts/compat.sh`, mode `0o755`) is what such a file should source. Three rules govern it:\n\n1. **Everything is detected at run time.** A loop directory gets copied to a build box, a container, or a colleague's laptop, and a baked-in answer \"would be wrong on arrival with no sign that anything had changed.\" `scaffold.rs` ships this file verbatim rather than generating it for exactly that reason.\n2. **POSIX `sh` unless `need_bash 4` says otherwise**, because macOS ships bash 3.2.57 and associative arrays, `${x,,}`, `mapfile`, `&>>` and `**` all arrived in 4.0.\n3. **Exit 2, not 1, when the machine cannot run the check.** `need_bash` and `require` both exit 2, and the comment explains why: a detector's exit code is its verdict, and \"this machine cannot run the check\" is a different fact from \"the check failed.\" A gate that conflates them reports missing tooling as unfinished work — and since `expect_exit` defaults to 0, a 2 is a clean failure with a distinguishable code rather than a false negative.\n\nThe exported environment (`LOOPSMITH_OS`, `LOOPSMITH_USERLAND`, `LOOPSMITH_BASH_MAJOR`) and the helpers built on it cover the differences that actually break scripts:\n\n| Helper | Papers over |\n|---|---|\n| `sed_i` | GNU `sed -i` takes no argument, BSD requires one — get it wrong on BSD and you edit a file called `-e` |\n| `stat_size`, `stat_mtime` | `-c%s`/`-c%Y` on GNU, `-f%z`/`-f%m` on BSD |\n| `readlink_f` | `readlink -f` is missing from every BSD before macOS 12; falls back to a `cd`/`pwd -P` walk |\n| `sha256` | `sha256sum` or `shasum -a 256`, whichever exists; 127 with a message when neither does |\n| `require`, `need_bash` | Missing tooling, reported as exit 2 |\n| `compat_report` | One line for a log or bug report |\n\nWindows is in scope only through Git Bash, WSL, or MSYS. Nothing here runs under `cmd.exe` or PowerShell — a detector for those is a `.cmd` or `.ps1` naming its own interpreter, which works precisely because there is no shell in the way. The same reasoning is why scaffolding writes both `run.sh`/`resume.sh` and `run.cmd`/`resume.cmd` on every host.\n\n---\n\n## Contributing\n\n**Adding a permission rule.** Put the derivation in `required()` and key it off a config field, never off a guess. If the rule is conditional, add a test in the style of `marketplace_access_is_only_requested_when_the_policy_uses_it` that asserts *both* presence and absence — a rule that is always emitted is indistinguishable from a template, which is what this module exists to replace. If the rule group is new, add a line to `$sections` in `permissions.template.json`.\n\n**Do not add a deny list.** The empty deny list is a decision, documented in `$deny_note`. Something that must not happen belongs in `constraints`, `safety.protected`, or a `features` flag — places the gate enforces and evolution cannot reach.\n\n**Touching `merge_into`.** The three invariants under test are: existing rules survive, unrelated keys survive, and repeat calls add nothing. The scaffolder and the web UI both depend on all three.\n\n**Touching `compat.sh`.** Add a helper that probes rather than a constant that was true on your machine, and use exit 2 for \"cannot check.\" `loopsmith-cli/tests/compat.rs` exercises the shipped template.\n\n**Adding a web action.** `Action` in `loopsmith-web/src/exec.rs` is a closed set with no wildcard arm in `named()`, so a new variant is a compile error until it is added to `all_actions()` — and the argv it produces must be a spelling the 1.0 grammar accepts without tripping the 0.3 alias notice.","platform-utilities":"# Platform Utilities\n\n# Platform Utilities (`loopsmith-util`)\n\nThe bottom crate of the workspace. Every other loopsmith crate depends on it, which is why it has **no dependencies at all** — not `serde`, not `libc`, nothing. Anything added here is added to every build of every crate above it, so the bar for entry is high: a primitive earns its place here by having already been written more than once, in more than one state of correctness.\n\nThree things live here:\n\n| Surface | What it answers |\n|---|---|\n| `which` / `is_executable` | Is this command really runnable, and where? |\n| `now_ms` | The single wall clock. |\n| `platform` | What is this host *actually*, at run time? |\n| `testing` (feature-gated) | Collision-free temp paths for parallel tests. |\n\n---\n\n## Command resolution: `which`\n\n```rust\npub fn which(cmd: &str) -> Option<PathBuf>\npub fn is_executable(p: &Path) -> bool\n```\n\n`which` resolves a command the way a shell does, and splits on the shape of the input:\n\n- **Absolute paths, or anything containing a separator** are checked directly. This branch exists because the three previous copies of this function were PATH-only: they joined an absolute path onto every `PATH` entry and returned `None` for a binary the caller was holding a valid path to.\n- **Bare names** are resolved against `PATH` via `std::env::split_paths`, taking the first hit.\n\nBoth branches funnel into the same private helper, and that helper is where the platform behaviour lives:\n\n```mermaid\ngraph TD\n    W[\"which(cmd)\"] -->|\"bare name: for each PATH entry\"| F[\"first_executable(base)\"]\n    W -->|\"absolute / has separator\"| F\n    F --> E[\"is_executable(base)\"]\n    F -->|\"not executable\"| X[\"path_extensions()\"]\n    X -->|\"append each suffix\"| E\n    E -->|unix| B[\"metadata: is_file && mode & 0o111\"]\n    E -->|\"non-unix\"| P[\"is_file()\"]\n```\n\n### Why the executable bit matters\n\n`is_executable` on unix requires both `is_file()` **and** at least one execute bit (`mode() & 0o111 != 0`). Two of the three earlier copies of `which` checked `is_file()` alone, so a non-executable file named `curl` sitting on `PATH` read back as \"curl is available\" — and the lie only surfaced much later as a confusing spawn error, far from the check that produced it.\n\nOff unix there is no permission bit to consult, so `is_executable` degrades to a file check rather than pretending to know more than it does. Tests in this crate are careful about that distinction: `a_file_that_is_not_runnable_is_not_a_command` asserts unix semantics under `#[cfg(unix)]` and the
