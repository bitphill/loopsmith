*extension* rule under `#[cfg(not(unix))]`, because \"not runnable\" genuinely means different things on the two platforms.\n\n### Why the suffix loop matters\n\n`path_extensions()` returns an empty `Vec` on unix and the `PATHEXT` list on Windows (falling back to `.COM;.EXE;.BAT;.CMD`, which is what Windows itself defaults to). `PATHEXT` is honoured rather than hardcoded because it is how a machine declares that `.ps1` or `.py` counts as a command.\n\nWithout this loop, `which` is simply broken on Windows: `git` there is a file called `git.exe`, so joining the bare name onto every `PATH` entry matches nothing. Everything downstream then faithfully reports the falsehood it was handed — `doctor` says no tool is installed, `Platform::detect` finds no scheduler, and worktree isolation degrades to a shared directory citing \"git not on PATH\", on a machine where git is very much on `PATH`.\n\nOne subtlety worth preserving: the suffix is **appended by building an `OsString`**, never applied with `set_extension`. `set_extension` would rewrite `check.sh` into `check.exe`; a command name may legitimately contain a dot, so `check.sh` must be allowed to become `check.sh.exe`. `a_suffix_is_appended_rather_than_replacing_a_real_extension` pins that.\n\n### Callers\n\n`which` is the most widely consumed thing in the crate. The notable paths:\n\n- `loopsmith-run/src/worktree.rs::which_git` → `create` — git worktree isolation. This is the chain that appears in execution flows from `run_node` (dispatch), `worktree` (publish), and `prune`.\n- `src/cmd/doctor.rs` — `report_tool`, `config_notes`, and `execute` all probe tools through it; `config_notes` also calls `is_executable` directly.\n- `loopsmith-cli/src/scaffold.rs::init_git` — decides whether a new loop directory can be turned into a repo a worktree can resolve against.\n- `platform::Platform::detect` — filters scheduler candidates. This is the only call *out* of `platform` into the crate root.\n\n---\n\n## The clock: `now_ms`\n\n```rust\npub fn now_ms() -> u64\n```\n\nMilliseconds since the Unix epoch, and the only clock in the workspace. Timestamps are stored as numbers so the memory ledger stays sortable without a date parser anywhere in the read path.\n\nA clock that runs backwards (`duration_since` returning `Err`) yields `0` rather than panicking. The trade is explicit: a wrong timestamp on one ledger entry is a nuisance; a panic partway through an unattended overnight run is not.\n\n---\n\n## Runtime platform detection: `platform`\n\nThis module exists because `cfg!(target_os = …)` answers none of the questions that actually change what loopsmith and its generated scripts may assume:\n\n- **The bash on `PATH` may be from 2007.** macOS still ships 3.2.57 (4.0 changed licence). Associative arrays, `${x,,}`, `mapfile`, `&>>`, and `**` all arrived in 4.0, so a detector script written on Linux fails on a Mac with a syntax error instead of a useful message.\n- **`sed`, `stat`, and `readlink` take different flags** under GNU versus BSD userland — the single most common way a working script stops working on someone else's machine.\n- **The scheduler is whatever is installed**, not whatever the OS is famous for. A container has neither `launchctl` nor `crontab`; a Mac has both; a systemd host may have `systemctl` and no `crontab`.\n\nEverything here probes and reports. **Nothing decides on the caller's behalf, and nothing is cached across processes** — a probe costs one `--version` call and a run is not a hot loop.\n\n### `Os`\n\nA thin wrapper over `std::env::consts::OS` (`MacOs`, `Linux`, `FreeBsd` — which also covers OpenBSD and NetBSD — `Windows`, `Other`). This one genuinely *is* a compile-time fact, since the binary is built for the platform it runs on; it is wrapped here so callers have one place to ask, sitting next to the facts that are not compile-time. `as_str()` gives the stable report string (`\"bsd\"` for the BSD family) and `is_windows()` answers whether the host runs `.cmd` batch files rather than `#!` scripts.\n\n### `home_dir`\n\n```rust\npub fn home_dir() -> Option<PathBuf>\n```\n\nOn non-Windows, `HOME` (rejecting the empty string). On Windows it walks a cascade: `HOME` first, because Git Bash and MSYS set it and it is the more specific answer when both exist; then `USERPROFILE`; then `HOMEDRIVE` + `HOMEPATH` concatenated, for a bare `cmd.exe`.\n\nCode that reads `HOME` directly silently loses the home directory on Windows, where the failure surfaces as \"cannot locate LaunchAgents\" or as a loop cheerfully scaffolding itself into a relative path.\n\n### `Userland`\n\n```rust\npub enum Userland { Gnu, Bsd, Unknown }\n```\n\n`Userland::detect()` probes by running `sed --version`: GNU answers successfully (and busybox is classed as GNU-compatible here), BSD's `sed` exits non-zero. A successful exit whose output mentions neither is `Unknown`, and a spawn failure is `Unknown` too.\n\nThe reason this is a probe and not a `match` on `Os`: Homebrew's `coreutils` puts GNU tools ahead of BSD ones on a Mac, and a stripped container may have busybox. `Os::MacOs` does not imply BSD and `Os::Linux` does not imply GNU.\n\n`sed_in_place()` returns the argv fragment for an in-place edit — `[\"-i\"]` for GNU, `[\"-i\", \"\"]` for BSD. **`Unknown` deliberately takes the BSD spelling**, because GNU rejects the empty suffix loudly while BSD would silently swallow the next argument as a backup suffix — which is how a script ends up editing a file called `-e`. When guessing, guess toward the louder failure.\n\n### `BashVersion`\n\n```rust\npub struct BashVersion { pub major: u32, pub minor: u32, pub raw: String }\npub const MODERN_MAJOR: u32 = 4;\n```\n\n`BashVersion::parse` takes the first line of `bash --version` and splits on the literal `\"version \"`, then collects the leading run of digits and dots. The banner shape has been stable since bash 2.0 (`GNU bash, version 3.2.57(1)-release (x86_64-apple-darwin24)`). A missing minor defaults to `0`, so `version 5 (x86_64)` parses as 5.0; anything that is not a bash banner returns `None`. `raw` keeps the whole trimmed line for the `doctor` report.\n\n`is_modern()` is `major >= 4` — the line between \"write POSIX `sh`\" and \"bash 4 syntax is fine\". The private `probe(command)` runs `<command> --version` and feeds the first line to `parse`.\n\n### `Platform`\n\n```rust\npub struct Platform {\n    pub os: Os,\n    pub userland: Userland,\n    pub bash: Option<BashVersion>,      // `bash` on PATH; a machine may have none\n    pub sh_bash: Option<BashVersion>,   // `/bin/sh`, iff it is bash in POSIX mode\n    pub schedulers: Vec<&'static str>,  // actually installed, preferred first\n}\n```\n\n`Platform::detect()` is the one entry point, and it fans out to every probe in the module:\n\n```mermaid\ngraph LR\n    D[\"Platform::detect()\"] --> O[\"Os::detect()\"]\n    D --> U[\"Userland::detect()<br/>sed --version\"]\n    D --> B[\"BashVersion::probe(\\\"bash\\\")\"]\n    D --> S[\"BashVersion::probe(\\\"/bin/sh\\\")\"]\n    D --> PS[\"preferred_schedulers(os)\"]\n    PS --> WH[\"which(candidate)<br/>filter to what exists\"]\n```\n\n`sh_bash` being `None` is itself information: on Debian `/bin/sh` is `dash`, which rejects `[[`, `local -n`, and `echo -e` that a bash-as-sh would have accepted by accident.\n\nThree accessors read off the struct:\n\n- **`scheduler()`** — the first installed scheduler, or `None` when the machine has none. Consumed by `src/cmd/schedule.rs::execute` and the `doctor` report.\n- **`has_modern_bash()`** — `false` when bash is missing entirely, on the principle that a script which cannot be run is not a script that may assume anything.\n- **`portability_note()`** — one line explaining why a generated script sticks to POSIX `sh` (no bash at all, or a pre-4.0 bash), or `None` when nothing is holding it back. `doctor` prints this verbatim.\n\n### `preferred_schedulers`\n\n```rust\npub fn preferred_schedulers(os: Os) -> &'static [&'static str]\n```\n\nThe **candidate** list, best first — not the answer. `Platform::detect` filters it through `which`, and `src/cmd/schedule.rs::preferred_names` reuses it for its own listing.\n\n| OS | Candidates | Why this order |\n|---|---|---|\n| macOS | `launchctl`, `crontab` | launchd survives a reboot without the user enabling anything else |\n| Linux / BSD | `crontab`, `systemctl` | |\n| Windows | `schtasks`, `crontab` | Task Scheduler is the only one that ships with Windows; `crontab` still worth probing for Cygwin/WSL interop |\n| Other | `crontab` | |\n\nWindows having its own arm is a fixed bug, pinned by `every_os_has_a_scheduler_worth_probing_and_windows_gets_the_native_one`: it previously fell into the catch-all and was offered only `crontab`, so `schedule` reported \"no scheduler\" on a machine with a perfectly good Task Scheduler.\n\n---\n\n## Test scaffolding: the `testing` feature\n\n```toml\n[dev-dependencies]\nloopsmith-util = { workspace = true, features = [\"testing\"] }\n```\n\nOpt-in so it never ships in a release build; resolver 2 keeps the dev-dependency feature out of the normal build graph.\n\n```rust\npub fn temp_path(tag: &str) -> PathBuf  // unique, NOT created\npub fn temp_dir(tag: &str) -> PathBuf   // unique, created\npub fn cleanup(p: &Path)                // best-effort; never fails a test\n```\n\nNames take the form `loopsmith-{tag}-{pid}-{now_ms}-{n}`, where `n` comes from a process-wide `AtomicU64`.\n\n**The counter is the load-bearing part.** This function existed six times in four shapes, and two of those shapes omitted it. Tests run in parallel threads inside one process, so pid and millisecond timestamp do not separate two directories created in the same millisecond — and when two tests share a directory, sled reports a lock error that reads like a backend bug rather than a test collision.\n\n`cleanup` swallows its error on purpose: a leaked temp directory is not a test failure.\n\nThese are used broadly across the workspace — `loopsmith-cli` integration tests (`guided.rs`, `surface.rs`, `compat.rs`, `opt_in.rs`), `loopsmith-cli/src/guided.rs::draft_path`, `scaffold.rs` tests, `loopsmith-core/src/permissions.rs` tests, and `tests/harness/mod.rs::from_yaml`.\n\n---\n\n## Contributing here\n\nA few conventions that the existing code holds to, and that a change should keep:\n\n**The dependency count is zero, and that is a feature.** Adding a dependency here adds it to every crate in the workspace. If a primitive needs a crate, it probably belongs one level up.\n\n**Tests must not mutate the environment.** Several tests explicitly say so: `std::env::set_var` on `PATH` races every other test thread reading the environment — the same class of parallel-test collision the temp-dir counter exists to prevent. The Windows suffix behaviour is therefore asserted through the *absolute-path* branch of `which`, which exercises `first_executable` and `path_extensions` without touching `PATH`, and is meaningful on both platforms.\n\n**Assertions must mean the platform's own rule.** Where behaviour genuinely differs, the test splits on `#[cfg]` and asserts what that platform actually promises, rather than asserting unix semantics on a system that has none.\n\n**Probes report; they do not decide.** `platform` returns what it found, including `Unknown` and `None`. The choice of what to do about a missing bash or an unrecognised userland belongs to the caller — usually `doctor`, `schedule`, `new`, or the script generator.\n\n**Packaging note.** `Cargo.toml` restricts `include` to `/src/**/*` and `/README.md`. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping the tests would hand a published crate tests that cannot pass.","project-documentation":"# Project Documentation\n\n# Project Documentation\n\nThe `loopsmith` repository ships four root-level documents plus a template. They are not four versions of the same text — each one is written for a different reader arriving with a different question, and they cross-link rather than repeat. This page describes what each file owns, the rules that keep them from drifting apart, and where to make a change when behavior changes.\n\n## The four documents\n\n| File | Reader | Question it answers |\n|---|---|---|\n| `README.md` | A developer evaluating the tool | What is this, how do I install it, what does a loop look like? |\n| `README-FOR-DUMMIES.md` | Someone who does not write code | Can I use this, and what do I actually type? |\n| `HOW-TO-USE.md` | Someone writing or debugging a config | What does every field mean, and why does it exist? |\n| `LOOP-TEMPLATE.md` | Someone authoring a loop right now | What goes in `loop.yaml`, slot by slot? |\n\n`README-DETAIL.md` and `loops-engineering-cheat-sheet.md` also live at the root but are not part of the maintained set described here.\n\n### `README.md`\n\nThe entry point. It carries the install matrix (crates.io, npm, PyPI, Homebrew, and `./install.sh` / `install.bat`), the five-minute walkthrough, the three front ends (`--web`, `--guided`, plain config editing), scheduling, the portability table, and the \"While it runs\" command reference.\n\nTwo things in it are load-bearing and easy to break on edit:\n\n- **The install section carries operational caveats, not just commands.** Homebrew accepts only `bitphill/loopsmith/loopsmith` or a separate `brew tap` + `brew install`; the two-component form is read as a core formula and fails. Homebrew 6's `brew trust` gate is documented because it is per-tap, not per-formula. The npm and PyPI package names (`@bitphill/loopsmith`, `loopsmith-cli`) differ from the binary name because the plain names were already taken. Each of these exists because someone hit it.\n- **The `validate`-fails-on-purpose block.** The README shows the real error text for unfinished `pre_execution` steps and states outright that the refusal is the most valuable thing the tool does. Every document in the set repeats this in its own register; none of them soften it.\n\n### `README-FOR-DUMMIES.md`\n\nThe non-developer path, linked prominently from the README's TL;DR. It is a parallel route to the same product, not a simplified summary — it assumes no YAML knowledge and no terminal fluency (\"Mac: press `⌘ + Space`, type *Terminal*\").\n\nIts structural choices:\n\n- **Fifteen examples first.** The table of `config/examples/*.md` loops leads the document, because reading a working config is faster than reading a schema.\n- **One diagram twice.** The loop idea is drawn as ASCII art and then again as Mermaid — the ASCII version survives contexts where Mermaid does not render, and both put the AI strictly on the left of the pass/fail diamond.\n- **Six things you edit, and only six.** Prerequisites, Goals, Checks, Stop gates, Triggers, Limits. Everything else in `loop.md` is explicitly declared off-limits for this reader.\n- **A hard-coded gotcha.** Readers are told to delete every `type: script` check from an example, because script detectors need a script file that examples do not ship. This is the single most likely first-run failure for a non-developer, called out inline rather than left to the troubleshooting table.\n\n### `HOW-TO-USE.md`\n\nFourteen numbered sections, the longest document in the set, and the one that carries the reasoning. §5 is the field-by-field configuration reference; the rest covers architecture, the two skills, providers and BYOK, the permission preflight, sub-agent acquisition, the memory ledger, a failure playbook, self-evolution, promotion, and long-running operation.\n\n§14, *Where the design came from*, is the design rationale: twenty sources distilled, what each contributed, what was rejected and why, and a self-imposed source-quality warning marking uncorroborated claims `[unverified]`. It was a separate file before 1.0 and was merged in on the stated principle that a rationale living beside the design it explains is one that gets read.\n\n### `LOOP-TEMPLATE.md`\n\nThe authoring surface: a complete annotated `loop.yaml` wrapped in a `SKILL.md` frontmatter block. Every section is a real YAML fragment followed by a *\"Why it exists\"* paragraph, and the document closes with a pre-first-run checklist. `loopsmith loop new --path <dir>` writes the same two files, so the template is the manual path to what the scaffolder produces.\n\n## How they connect\n\n```mermaid\nflowchart TD\n    R[\"README.md<br/>developer entry\"]\n    D[\"README-FOR-DUMMIES.md<br/>non-developer path\"]\n    H[\"HOW-TO-USE.md<br/>field reference + rationale\"]\n    T[\"LOOP-TEMPLATE.md<br/>annotated loop.yaml\"]\n    S[\"config/loop.schema.json<br/>generated from Rust types\"]\n    R --> D\n    R --> H\n    R --> T\n    D --> H\n    H --> T\n    T -.validates against.-> S\n    H -.documents.-> S\n```\n\nThe dotted edges matter more than the solid ones. `config/loop.schema.json` is **generated from the Rust types**, so the prose in `HOW-TO-USE.md` §5 and `LOOP-TEMPLATE.md` describes a schema it cannot change. Cross-field rules a JSON Schema cannot express — a goal with no blocking check, a judge that would grade its own provider, `no_progress_iterations_randomness` not strictly below `no_progress_iterations` — live in `loopsmith loop validate`, and the docs name that as their enforcement point rather than implying the schema does it.\n\n## The invariants the docs enforce\n\nFour claims appear in every document, in different words. They are the reason the set holds together, and changing one means editing four files.\n\n**A model must not certify its own completion.** `goal_satisfied` is written by `loopsmith-gate` and by nothing else. The README states it as the design's single rule; `README-FOR-DUMMIES.md` renders it as \"the AI never gets to say 'done'\"; `HOW-TO-USE.md` §14.2.2 gives the four-rung independence ladder (separate prompt → separate context → separate model → separate mechanism) and places the gate at rung four.\n\n**The gate can revoke.** Delete a required artifact and a satisfied goal flips back. `HOW-TO-USE.md` §14.1 names this the grading test for the whole system: *can it take \"done\" back?* A system that can only promote is a burndown chart with extra steps.\n\n**`validate` refuses on process, not just syntax.** `intent.prerequisites` must be all `done: true`. This is documented as the only place the tool refuses on a matter of process, and every document says the refusal is deliberate.\n\n**The loop proposes; a human applies.** Goals, checks, success criteria, and skill adoption are written to `proposals/`. The loop may acquire and trial sub-agents on its own, but they land in quarantine. Both `HOW-TO-USE.md` §11 and `LOOP-TEMPLATE.md` carry the same two-column \"does on its own / only proposes\" table.\n\n## Configuration surface, as documented\n\nThe docs describe eight top-level keys: `name`, `version`, `description`, `environment`, `features`, and four bundles.\n\n```yaml\nintent:      # background, prerequisites, goals, success\nexecution:   # graph, providers, phases, default_skills, skills, memory, triggers\nsafety:      # checks, gates, limits, recovery, protected, alerts\nevolution:   # enabled, baseline, max_regression, allowed_kinds, ...\n```\n\n`features` sits above the bundles because its five switches (`self_evolution`, `marketplace_skills`, `external_side_effects`, `parallel_execution`, `human_approval`) are capabilities rather than settings — two decide what the loop can *become*, two decide whether its limits are real.\n\n**0.3 configs still parse.** The lettered keys — `information`, `pre_execution`, `goals`, `validations`, `success`, `stop_gates`, `schedules`, `constraints`, `execution_guidelines`, `default_skills` — are relocated into the bundles by one table as the file is read, with a warning naming each moved key. `loopsmith loop migrate --write` rewrites a file using that same table, which is why the migrator cannot disagree with the parser. The full mapping lives in `wiki/Migration-0-3-To-1-0.md`.\n\nSection **A**–**J** language still appears in `README.md` and `README-FOR-DUMMIES.md` (Gates are **F**, Triggers **G**, and so on) because those are the headings a 0.3-shaped Markdown config still uses. A reader following the dummies guide edits a `loop.md` with lettered sections; a reader following the template writes a bundled `loop.yaml`. Both are valid input — keep that in mind before \"fixing\" one document to match the other.\n\n## Documentation-adjacent machinery\n\nThree things outside these files keep the docs honest, and a docs change may need one of them updated too:\n\n- **Compiled-in examples.** All fifteen `config/examples/*.yaml` are compiled into the binary with `include_str!` for the web UI. `tools/sync-examples.sh` copies them into `runtime/crates/loopsmith-web/templates/examples/`, and a test fails if the two have drifted — so a stale copy is caught by `cargo test` rather than by a user.\n- **One wizard spec, two front ends.** `--guided` and the browser walk-through both render the spec the wizard crate serves at `/api/wizard/spec`. Neither front end can ask a question the other does not, which is why `README.md` and `HOW-TO-USE.md` §4b can describe them as the same interview.\n- **The generated schema.** `config/loop.schema.json` comes from the Rust types. If a field's meaning changes, the schema follows the code automatically; the prose does not.\n\n## Writing conventions in this set\n\nObservable across all four files, and worth matching:\n\n- **Every rule states its cost.** Not \"set `max_cost_usd`\" but \"a loop with only an iteration cap and an expensive provider is an unbounded bill waiting for a slow night.\" Claims of the form *X is refused* are paired with what goes wrong if it were allowed.\n- **Tables carry the reference load, prose carries the reasoning.** Field lists, detector strength orderings, failure-class defaults, and platform differences are tables. The paragraph after the table says why the defaults are unequal.\n- **Commands appear as they are typed, with real output.** The `loopsmith providers` sample shows an `unavailable  missing env: OPENAI_API_KEY` line; the `validate` failure shows its actual error text.\n- **Exit codes and edge semantics are stated explicitly.** `require` and `need_bash` exit **2**, not 1, because \"this machine cannot run the check\" is a different fact from \"the check failed\". `file_change` and `goal_satisfied` fire on the edge, not the level. Cron is evaluated in UTC, with the reason given.\n- **No superlatives about the tool.** The closest the set comes to a boast is the CI note — the three-platform claim is described as \"something that gets checked rather than something written down.\"\n\n## Where to make a change\n\n| What changed | Edit |\n|---|---|\n| A config field's meaning or default | `HOW-TO-USE.md` §5 **and** the matching fragment in `LOOP-TEMPLATE.md` |\n| A new CLI command or flag | `README.md` (the relevant section + \"While it runs\" if it's a query command) |\n| A new failure mode users will hit | `HOW-TO-USE.md` §10 playbook **and** the \"When something goes wrong\" table in `README-FOR-DUMMIES.md` |\n| A new example loop | `config/examples/`, both tables (`README.md` §Examples, `README-FOR-DUMMIES.md` §What people use it for), and run `tools/sync-examples.sh` |\n| Install mechanics for a registry | `README.md` §Install + §Packages table, and the one-line form in `README-FOR-DUMMIES.md` |\n| A platform difference | `README.md` §Portability table, and `HOW-TO-USE.md`'s `compat.sh` helper table if a helper is involved |\n| Design reasoning behind a rule | `HOW-TO-USE.md` §14 — mark unverified claims `[unverified]`, as the existing entries do |\n\nA field change that touches only one of `HOW-TO-USE.md` §5 and `LOOP-TEMPLATE.md` is the most common drift in this set. They describe the same schema from two angles — reference and worked example — so they move together.","provider-integration":"# Provider Integration\n\n# Provider Integration (`loopsmith-provider`)\n\nThe provider plane turns \"ask a model\" into \"run a program.\" Every provider in loopsmith — Claude Code, Ollama, a Grok CLI, an OpenAI-compatible HTTP endpoint driven by `curl`, an MCP server over stdio — is a command template: a binary name, an argument list with placeholders, and a few metadata fields. Adding a provider is a config edit, never a Rust change and never a rebuild.\n\nThis crate does four things: decide whether a provider is usable, expand its template and run it, account for what the call cost, and classify failures so the run engine knows whether retrying is worth wall-clock time.\n\n## The command-template model\n\nA provider is a `ProviderSpec` (defined in `loopsmith-core`, `src/config/providers.rs`). The fields this crate actually acts on:\n\n| Field | Effect |\n|---|---|\n| `command` | the binary; looked up on `PATH` via `which` |\n| `args` | argument list, each element run through `render` |\n| `model` | substituted as `{model}` |\n| `requires_env` | variable **names** that must exist; values are never read |\n| `timeout_seconds` | polled kill deadline in `invoke` |\n| `prompt_on_stdin` | pipe the prompt to stdin instead of passing `{prompt}` |\n| `usage_regex` | pattern whose first capture group is a token count |\n| `cost_per_1k_tokens` | rate applied to whatever token count was obtained |\n| `tiers` | which tiers this provider may serve |\n\n`render` substitutes `{prompt}`, `{system}`, `{model}`, `{tier}`, and `{node}` into a template string. Unknown placeholders are left verbatim — a provider whose real CLI takes `{foo}` as a literal keeps working, and a typo in a config placeholder shows up in the command line rather than silently becoming an empty string.\n\n## Secrets never enter the process\n\nThis is the load-bearing constraint, and it is why `requires_env` holds names rather than values.\n\n`availability` checks presence with `std::env::var_os(k).is_none()` and discards everything but the key name. `Availability::why_not` can therefore only ever say `missing env: OPENAI_API_KEY` — a test asserts the string contains no `=`, because there is no value present to leak. Nothing in this crate substitutes a secret into an argument, a log line, or the ledger.\n\nThe OpenAI starter provider shows the intended pattern: the `Authorization: Bearer $OPENAI_API_KEY` header is passed to `curl` *unexpanded*, and `curl` resolves it from its inherited environment. loopsmith never sees the key.\n\nThe same rule holds under containers. `container_argv` passes each required variable as `-e KEY` with no value, so the container runtime reads it out of this process's environment rather than putting it on a command line where any user on the machine could read it from the process table.\n\n## Availability and the tier cascade\n\nNodes never name a provider; they ask for a `Tier` (`Cheap`, `Standard`, `Strong`). `dispatch` resolves that tier to an ordered candidate list via `cfg.cascade_for(req.tier)` and walks it:\n\n```mermaid\nflowchart TD\n    D[dispatch: tier or pinned id] --> C{next candidate?}\n    C -->|none left| N[NoneAvailable + accumulated class]\n    C -->|spec| A[availability]\n    A -->|not ok| S[push skip reason] --> C\n    A -->|ok| I[invoke]\n    I -->|Ok| R[InvokeResponse + skipped list]\n    I -->|Err| F[note failure_class] --> S\n```\n\nTwo details matter for contributors:\n\n- **The skip list is a return value, not a log.** `dispatch` returns `(InvokeResponse, Vec<String>)`, where the vector holds `\"id (reason)\"` for every provider passed over. The ledger records *why* the winning provider won.\n- **The failure class accumulates.** `class` starts at `ToolUnavailable` and latches to `TransientError` if any candidate failed transiently. So a cascade where the cheap tier was rate-limited and everything else was missing still reports a transient overall failure, which is the class that makes a retry worthwhile.\n\n`pinned: Some(id)` bypasses the cascade entirely, collapsing the candidate list to `cfg.provider(id)`. That is the path a judge-independence or manual-override decision takes.\n\nUnder a container, `dispatch` rewrites the availability check: the provider binary lives in the image, so what must exist on this machine is `c.runtime`, not `spec.command`.\n\n## Failure classification\n\n`ProviderError::failure_class` maps into `loopsmith_core::FailureClass`, and the mapping encodes a policy about the run's wall-clock budget:\n\n- `Timeout` → transient, by definition.\n- `Spawn` → `ToolUnavailable`; the binary isn't there.\n- `Failed` → transient **only** if `looks_transient(stderr)` matches one of its markers (`429`, `503`, `rate limit`, `overloaded`, `try again`, `connection reset`, `network`, …). Otherwise `ToolUnavailable`.\n\nThe asymmetry is deliberate. A wrong flag or a missing login fails identically on the second attempt, so retrying it with backoff only spends budget learning that. Only the stderr strings that describe a condition which may clear by itself earn a retry. `looks_transient` is a substring scan over a lowercased copy — cheap, and deliberately a little generous, since a false \"transient\" costs one retry while a false \"unavailable\" costs a node.\n\n## Running a provider: `invoke`\n\n`invoke` is the single place a child process is spawned. The sequence:\n\n1. Build the substitution map (including `tier_name(req.tier)`) and render every argument.\n2. Build the `Command` — either `spec.command` directly, or `container.runtime` with `container_argv(...)` when `req.container` is set.\n3. `current_dir(&req.workdir)`; stdin piped only when `prompt_on_stdin`, stdout and stderr always piped.\n4. Write the prompt to stdin if configured. A broken pipe here is swallowed on purpose: it means the child exited early, and the exit-code path below reports that far more usefully than an io error would.\n5. **Poll for completion** at 50 ms intervals, killing the child once `timeout_seconds` elapses. `std::process` has no timeout, and an async runtime is a heavy dependency for one feature.\n6. Non-zero exit → `ProviderError::Failed` with only the **last line** of stderr. A non-zero exit is never a silent pass.\n7. On success, account for usage and cost, then build `InvokeResponse`.\n\n### Usage and cost accounting\n\n`invoke` tries `parse_usage(spec, &stdout)`, then `parse_usage(spec, &stderr)` — providers report usage in wildly inconsistent places. `parse_usage` compiles `usage_regex`, prefers capture group 1 and falls back to the whole match, and strips `,` and `_` before parsing. Every fallible step returns `None`, so a malformed regex degrades to estimation rather than failing the call.\n\nWhen nothing usable is reported, `estimate_tokens` applies the four-characters-per-token approximation over prompt plus output and `InvokeResponse.tokens_estimated` is set to `true`. The response carries the distinction so a budget report can state which it is: an approximate ceiling that fires beats an exact one that never does, which is what an unaccounted budget gate amounts to.\n\n`cost_usd` is `Some` only when both a token count and `cost_per_1k_tokens` exist. No rate means no cost, not a guessed one.\n\n## Container execution\n\n`Container { image, network, runtime }` describes where a provider runs. `container_argv` assembles:\n\n```\nrun --rm [-i] [--network none] -v <workdir>:/work -w /work [-e KEY]... <image> <command> <args...>\n```\n\n`-i` appears only for stdin-mode providers. `--network none` is the default; `network: true` simply omits the flag. The node's working directory is mounted at `/work` and becomes the container's cwd, so a provider writing relative paths lands its output where the node expects it.\n\nThe provider CLI must exist *inside the image* — the host's copy is not visible in there, which is the point of the isolation. `loopsmith-run`'s `container` and `resolve` (`loopsmith-run/src/container.rs`) build these values; `loopsmith-core`'s validation warns about combinations that don't make sense, such as a sealed container fronting a hosted model.\n\n## Supporting pieces\n\n- **`digest`** — FNV-1a 64-bit over a string, hex-formatted. Not cryptographic. Its only job is to let the ledger say \"this is the same prompt as before\" without storing the prompt twice. `run_node` calls it for prompt provenance.\n- **`which`** — re-exported from `loopsmith-util`. The path is kept here because callers already used it; the implementation moved out once it turned out to have been written three times across the workspace, in three states of correctness.\n- **`starter_providers`** — the cascade `loopsmith init` writes into a fresh config, via `starter_config` (`loopsmith-cli/src/scaffold.rs`). Every entry is just a command, so unavailable ones are skipped rather than fatal, and a test asserts the set covers all three tiers. Note the deliberately short 120 s Ollama timeout: `ollama run <model>` silently pulls a missing model, and a multi-gigabyte download is indistinguishable from slow generation from out here. A cheap tier exists to be abandoned quickly, so it falls through to the next candidate instead of accommodating a download.\n\n## How callers use it\n\n| Caller | Uses |\n|---|---|\n| `loopsmith-run/src/dispatch.rs` → `run_node` | builds `InvokeRequest`, calls `dispatch`, records `digest` |\n| `loopsmith-run/src/perturb.rs` → `ask_agent` | `dispatch` for adversarial perturbation prompts |\n| `loopsmith-run/src/summary.rs` → `add_narrative` | `dispatch` for run narration |\n| `loopsmith-cli/src/cmd/providers.rs` → `execute` | `availability` for the `loopsmith providers` readiness table |\n| `loopsmith-cli/src/scaffold.rs` → `starter_config` | `starter_providers` |\n| `loopsmith-run/src/container.rs` | constructs `Container` |\n\nThis crate deliberately knows nothing about goals, gates, or iteration. It takes an `InvokeRequest`, returns an `InvokeResponse` or a classified `ProviderError`, and leaves every decision about what to do next to the run engine.\n\n## Contributing notes\n\n- **Adding a provider is usually not a code change.** `ProviderKind` exists for labelling and wizard catalog purposes; routing behaviour comes entirely from `command`, `args`, `requires_env`, and `tiers`. Reach for a config example before reaching for `lib.rs`.\n- **Never read an environment variable's value.** If a change needs a secret's contents, the design is wrong — the child process expands it.\n- **New placeholders** go in the `vars` map in `invoke`; `render` needs no change. Keep unknown placeholders passing through untouched.\n- **New transient markers** go in `looks_transient::MARKERS`, lowercase. Prefer a marker that appears in real provider stderr over a guess.\n- **Tests run real binaries** (`echo`, `cat`, `false`, `sleep`, `sh`) rather than mocking the process boundary, which is the part most likely to be wrong. Keep new tests in that style, and keep shell quoting out of test arguments — one usage test was rewritten to avoid double quotes precisely because Windows escapes them differently, and the test failed there for a reason unrelated to usage.\n- The crate's `include` list ships only `src/` and the README. Integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain.","scheduling-triggers":"# Scheduling & Triggers\n\n# Scheduling & Triggers\n\nWhat starts a run, what stops a run from starting itself forever, and how the schedule survives a reboot.\n\nWithout this module `execution.triggers` is decoration: the config parses, validates, and then nothing ever fires it. Three layers do the work, and they live in three crates:\n\n| Layer | Where | Responsibility |\n|---|---|---|\n| Config | `loopsmith-core/src/config/triggers.rs` | The trigger vocabulary and the policy around it (`Trigger`, `TriggerSpec`, `TriggerPolicy`) |\n| Runtime | `loopsmith-run/src/schedule.rs` | Cron parsing, the `Watcher` that decides what is due, and the OS handoff text generators |\n| Commands | `loopsmith-cli/src/cmd/watch.rs`, `cmd/schedule.rs` | `loopsmith run watch` (the resident process) and `loopsmith run schedule` (hand the job to the OS) |\n\n`loopsmith-util/src/platform.rs` supplies the one fact the handoff cannot guess: which scheduler is actually installed.\n\n## The trigger vocabulary\n\nFive variants, tagged by `type` in YAML/markdown:\n\n```yaml\ntriggers:\n  - on: { type: cron, expr: \"0 2 * * *\" }\n  - on: { type: interval, seconds: 900 }\n  - on: { type: file_change, path: inbox }\n    idempotency_key: inbox\n  - on: { type: goal_satisfied, goal: docs-current }\n  - on: { type: manual }\n```\n\nThe trigger is nested under `on:` rather than flattened into `TriggerSpec`. Flattening would read better and would have let the 0.3 spelling parse untouched, but serde refuses `deny_unknown_fields` on a struct with a flattened field — and losing that guard means a misspelled `idempotency_kye` is silently dropped, leaving a trigger with no dedup and no warning. `config::legacy::repair_triggers` wraps old bare triggers in `on:` instead, so the cost is one migration function rather than a whole class of silent config bugs.\n\n`TriggerSpec` adds two pieces of bookkeeping: `idempotency_key` (optional; derived when unset) and `enabled` (defaults true, so a trigger can be switched off for an afternoon without deleting it). Every code path that iterates triggers filters on `t.enabled` — `Watcher::prime`, `Watcher::poll`, `poll_interval`, `TriggerPolicy::has_self_reachable_trigger` and `key_for` all do.\n\n### Self-reachable triggers and the two guards\n\n`Trigger::is_self_reachable()` is true for exactly `FileChange` and `GoalSatisfied`. Those are the two a run's own output can fire: a run that writes into the directory it watches, or satisfies the goal it watches, fires itself. Cron and interval are driven by a clock no run can advance.\n\n`TriggerPolicy` carries the guards against that shape:\n\n- `max_depth` (default 5) — how long a chain of self-started runs may get. `may_chain(depth)` is `depth < max_depth`.\n- `dedup_window_seconds` (default 300) — two firings with the same idempotency key inside this window are one firing.\n\n## Cron, parsed here\n\n`CronExpr::parse` takes the standard five fields (`minute hour day-of-month month day-of-week`) and supports `*`, lists, ranges and steps (`*/15 9-17 1,15 * 1-5`). `0` and `7` both mean Sunday, as in every other cron. A field parses into `Field::Any` or `Field::Values(Vec<u32>)` — sorted and deduplicated, so `matches` is a binary search. Malformed input is rejected with a reason (`step of 0 would never fire`, `` `60` is outside 0..=59 ``), not silently accepted.\n\n**Cron is evaluated in UTC.** Deriving a correct local offset in a multithreaded process is unsound on Unix without care, and a scheduler quietly an hour off twice a year is worse than one honestly in UTC. `civil_from_unix` (Howard Hinnant's `civil_from_days`) breaks a Unix timestamp into a `Civil` struct with no date-crate dependency. For cadence that does not need a wall-clock time, prefer `interval`.\n\n## The watcher\n\n`Watcher` holds all trigger state between polls: last-fired minute per cron expression, last run time per interval, last mtime per watched path, last seen satisfaction per goal, the admitted-key ledger, and the depth and time window of the most recent run.\n\n```mermaid\nflowchart LR\n    P[\"poll(triggers, root, now, satisfied)\"] --> F[\"Vec&lt;Fired&gt;\"]\n    F --> A[\"admit(policy, fired, now)\"]\n    A --> R[\"Decision::Run { depth }\"]\n    A --> D[\"Decision::Duplicate { key }\"]\n    A --> C[\"Decision::DepthCapped { depth }\"]\n    R --> S[\"started(depth, now) → execute → finished(now)\"]\n    S -.->|\"informs caused_by_last_run\"| A\n```\n\n### poll — what is due\n\nEach variant is edge-triggered, not level-triggered:\n\n- **Cron** fires at most once per minute-of-epoch, not once per poll inside that minute.\n- **Interval** primes on first sight and fires only after `seconds` have actually elapsed, so starting the watcher is not itself a firing.\n- **FileChange** compares `newest_mtime_ignoring` against the stored value; `prime()` seeds it so start-up does not look like a change.\n- **GoalSatisfied** fires on the `false → true` transition only.\n- **Manual** never fires from `poll`.\n\n`newest_mtime_ignoring` walks a path (depth-capped at 24) for the newest mtime anywhere under it, and a missing path reports `0` rather than erroring — a watched path that does not exist yet is a normal state. It skips `NEVER_WATCHED = [\"state\", \".git\", \"logs\"]` at any depth, plus whatever extra directory names the caller passes. Every entry there is written *by* a run: a watcher that noticed them would fire a run, which would write them, which would fire a run, and nothing in the output would say why. `logs/` is in the list for exactly the same reason `state/` is — the run log is written on every iteration.\n\n### admit — whether a firing becomes a run\n\n`admit` returns a `Decision` and is the only place the two guards are enforced.\n\n**Idempotency.** `key_for` prefers the trigger's explicit `idempotency_key`; otherwise it derives one from what fired — `cron:{expr}:{minute}`, `interval:{secs}:{slot}`, `file:{path}:{mtime}`, `goal:{goal}:{now}`. A derived key almost never repeats, which is right for cron and interval. The explicit key is for events noisier than their cause: six files landing in one directory at once are one event, not six.\n\n**Depth.** A clock firing starts a chain at depth 0. A self-reachable firing extends the chain the last run started, and is refused with `DepthCapped` once that chain is `max_depth` long.\n\n`caused_by_last_run` decides which of those applies, and the distinction matters: a `GoalSatisfied` firing after a run is attributed to it, but a `FileChange` is attributed only when the file's new mtime falls inside the run's window, widened by `ATTRIBUTION_GRACE_SECONDS` (5) because filesystems stamp mtimes coarsely and a run's last write can land just after the engine returns. A file a human drops into a watched directory an hour later is a fresh cause, starts a fresh chain at depth 0, and is never refused by a cap that exists to stop the loop feeding itself.\n\n### poll_interval — how often to look\n\n`poll_interval` returns the shortest cadence the enabled trigger set demands: 30s by default, 20s if any cron is present (a minute can otherwise be missed), 5s for `file_change`, and `seconds / 4` for an interval. Floored at 1s.\n\n## `loopsmith run watch`\n\n`cmd/watch.rs` is the resident process — what makes a loop live for weeks rather than for one invocation. It loads the config with `load_validated`, and refuses up front when the trigger list is empty or entirely `manual`, because `watch` would then sleep forever. `--check` prints the trigger set and the poll interval, then exits without running anything. `--max-runs N` stops after N runs.\n\nThree behaviours in the loop are worth knowing before you change it:\n\n1. **The success export is ignored.** The watcher is built as `Watcher::ignoring(vec![format!(\"{}-success\", cfg.name)])`. That directory is written whenever a run meets its bar, so a `file_change` trigger on the loop root would otherwise see it and start another run — a permanent cycle that begins exactly when the loop succeeds.\n2. **Goal state is read fresh each poll**, from the last run's `goal_states` in the store, so a run started elsewhere still feeds `goal_satisfied`.\n3. **Several firings in one poll start one run**, at the shallowest depth any of them allows (`depth.map_or(d, |x| x.min(d))`); the reasons are joined into one `why` line. Non-admitted firings print why they were skipped or refused, naming the dedup window or `max_depth`.\n\nA failed run prints `run failed: …` and the loop continues. That is the difference between a scheduler and a one-shot.\n\n## `loopsmith run schedule` — the OS handoff\n\n`watch` needs a process supervisor. `schedule` writes or prints the thing that supervises it.\n\nWhich scheduler to use is decided by what is **installed**, not by what the operating system is famous for. `cfg!(target_os = \"macos\")` says the build target had launchd; it does not say this machine has `launchctl` on `PATH`, and a container built `FROM debian` has neither `crontab` nor `systemctl` unless someone put them there. `Platform::detect()` filters `preferred_schedulers(os)` through `which`, and `Platform::scheduler()` returns the first survivor.\n\n```mermaid\nflowchart TD\n    D[\"Platform::detect().scheduler()\"] --> L{\"which one?\"}\n    L -->|launchctl| A[\"launchd() — plist, writable\"]\n    L -->|schtasks| B[\"schtasks() — command, print only\"]\n    L -->|crontab / other| C[\"crontab() — line, print only\"]\n    L -->|None| E[\"error naming preferred_names(&platform)\"]\n```\n\nThe `None` arm is why `preferred_names` exists: it re-reads the same `preferred_schedulers` list the probe used instead of restating it. The version that restated it told a Windows user to install `crontab`.\n\n### What each backend emits\n\n- **launchd** — `launchd_plist(label, exe, config, log_dir)` builds an agent that runs `loopsmith run watch <config>` with `RunAtLoad` and `KeepAlive`, logging to `loopsmith.out.log` / `loopsmith.err.log`. `--install` writes it to `launch_agents_dir()/{label}.plist`; `LOOPSMITH_LAUNCH_AGENTS_DIR` overrides that directory so the test suite can exercise `--install` without installing a launch agent into whoever's home directory the suite runs in. Loading it (`launchctl load -w`) stays the user's call — it is a persistent, user-visible change to their machine.\n- **crontab** — `crontab_line(exe, config, expr, log_dir)` produces `<expr> <exe> run start <config> >> …`, one run per firing rather than a resident watcher. The expression is the first `Trigger::Cron` in the config, falling back to `@reboot` (which keeps a watcher-shaped arrangement alive for configs whose triggers aren't cron). The printed note flags the mismatch that bites here: loopsmith evaluates cron in UTC, cron itself in local time.\n- **schtasks** — `schtasks_command(label, exe, config)` returns a single-line `schtasks /Create /F /RL LIMITED /TN \"<label>\" /SC MINUTE /MO 1 /TR \"…run watch…\"`. `watch`, not `run`, because the watcher owns trigger evaluation and Task Scheduler then only has to keep one process alive. `/RL LIMITED` because a loop has no business elevated; `/F` so re-running updates the task instead of failing on a name clash. The double-quoting inside `/TR` is load-bearing — `C:\\Program Files\\…` is the common case, and a test pins it.\n\nLabels come from `default_label(loop_name)`: `com.loopsmith.` plus the name with every non-alphanumeric character replaced by `-`, which is what makes it safe for launchd.\n\n### `--install` is honest about doing nothing\n\nOnly launchd has somewhere safe to write: a LaunchAgents directory where one plist is one job. A crontab is one file per user with no drop-in directory, and Task Scheduler keeps its jobs in a database reached only through `schtasks`. Rather than accepting `--install` and ignoring it, both of those call `nothing_to_install(reason)`, which explains on stderr why there is nothing to write. A flag that is silently a no-op is worse than one that explains itself — the user is left believing something was installed.\n\nLogs go to `<config dir>/logs`, created by `execute` before the handoff. Deliberately not `state/`: that directory is sled's, and the watcher ignores everything inside it — including, until this moved, the operating system's own record of why the loop failed to start.\n\n## Configuration surface\n\nTriggers live at `execution.triggers` (a `TriggerPolicy` inside `Execution`). In markdown configs the section is `Triggers`, keyed by `on.type` with `triggers` as the list field (`md::section_shape`, `md::SECTION_PATHS`). A 0.3 document's `schedules` section is relocated to `execution.triggers.triggers` by `config::legacy`, and each bare entry wrapped in `on:` by `repair_triggers` — which is why `cmd/schedule.rs` reaches the list as `cfg.execution.triggers.triggers` regardless of which spelling the file on disk used.\n\nBoth commands are reachable as `loopsmith run watch`/`loopsmith run schedule` and, via `cli::alias`, as the shorter `loopsmith watch`/`loopsmith schedule`.\n\n## Contributing notes\n\n- `cmd/schedule.rs` uses `loopsmith_core::load`, not `load_validated`: printing a plist for a config with a failing gate is still useful. `cmd/watch.rs` validates, because it is about to run the thing.\n- Adding a trigger variant means touching `Trigger`, `Trigger::is_self_reachable`, `Fired` and its `is_from`/`describe`/`is_self_reachable`, `Watcher::poll`, `key_for`, and `poll_interval`. Decide deliberately whether a run's own output can cause it — that answer is what `max_depth` enforces.\n- Anything a run writes on every iteration must be added to `NEVER_WATCHED` (or passed as an `ignore` name) before a `file_change` trigger can point at the loop root. The regression tests for `state/`, `logs/` and the success export in `loopsmith-run/src/schedule.rs` are the record of that going wrong.\n- The generator functions are pure string builders with no side effects, which is what makes the handoff testable; keep the writing in `cmd/schedule.rs` and the text in `loopsmith-run`.","skills-system":"# Skills System\n\n# Skills System (`loopsmith-skills`)\n\nSub-agent acquisition for a running loop: find the skill a node needs, install it somewhere inert if it is not already on disk, record what happened when the gate ruled, and rank skills by that record.\n\nThe crate is deliberately small and dependency-light. Its two files — `src/lib.rs` (acquisition, safety, ranking) and `src/marketplace.rs` (the `claudemarketplaces.com` index) — hold everything, and all network work is shelled out to `curl`, `npx`, and `git` rather than linked in. A machine with none of those degrades to \"installed only\" instead of failing to build.\n\n## The two ideas this module rests on\n\n**Quarantine is the default, not the exception.** Anything the loop acquires lands in a quarantine directory (`generated-skills/` by default) and stays there until a human moves it. An acquired sub-agent runs with whatever your permission grant allowed, so acquisition is a *proposal*, not a decision. Every `ResolvedSkill` carries a `quarantined: bool` so callers can never lose track of that distinction.\n\n**Selection is ranked by outcome, not by the model's opinion.** A loop cannot reason its way to knowing which sub-agents earn their keep. `recommend` looks only at `SkillTrial` records — each pairing a skill with the gate verdict that followed it — and proposes adoptions and drops from that. It still cannot apply them; a proposal is written and a human edits the config.\n\n## Acquisition: three sources, in configured order\n\n`acquire(name, purpose, policy, project_root)` walks `policy.acquisition_order`, a `Vec<AcquisitionSource>` from `loopsmith-core`, and returns the first hit.\n\n```mermaid\nflowchart LR\n    A[acquire] --> I{Installed?}\n    I -->|hit| R[ResolvedSkill]\n    I -->|miss| M[install_from_cli<br/>npx skills add]\n    M -->|ok| R\n    M -->|Refused| X[error, stop]\n    M -->|other err| G[generate]\n    G --> R\n```\n\nThe order matters in one non-obvious way: a `SkillError::Refused` from the marketplace step **aborts the whole walk** rather than falling through to generation. A refusal means a safety floor said no — an unsafe name, a blocklisted name — and quietly generating a skill under that same name would route around the refusal. Any other error (no `npx`, network down, package not found) continues to the next source.\n\n### 1. Installed — `find_installed`, `list_installed`\n\nA skill is a *directory containing `SKILL.md`*. `skill_search_paths` defines where to look, nearest first:\n\n| Order | Directory | Quarantined |\n|---|---|---|\n| 1 | `<root>/.claude/skills/` | no |\n| 2 | `<root>/generated-skills/` | yes |\n| 3 | `<home>/.claude/skills/` | no |\n\nHome comes from `loopsmith_util::platform::home_dir()`, not `$HOME` — Windows does not set `HOME` outside a POSIX emulation layer, and reading it directly makes the user-level skills directory silently vanish there.\n\n`find_installed` always reports `Source::Installed`, even for a skill that originally came from the marketplace. The filesystem tells you *where* something is, not where it came from; the `quarantined` flag carries the only provenance fact that is actually knowable at that point. `list_installed` deduplicates by name with the nearest directory winning, so a project skill shadows a quarantined one of the same name.\n\n### 2. Marketplace — `install_from_cli`, `clone_repo`\n\n`install_from_cli(spec, quarantine)` runs `npx --yes skills add <spec> --dir . -y` with the working directory set to the quarantine path. The `--dir .` is the load-bearing part: it keeps the install out of the global skills path. The resulting name is the spec's last segment after `@` and `/`, so `vercel-labs/agent-skills@react` installs as `react`.\n\n`clone_repo` handles `SkillOrigin::Github`: `git clone --depth 1` (the loop wants the skill, not its history) after `loopsmith_core::is_safe_repo_url` confirms an https URL. Anything else is refused.\n\n### 3. Generate — `generate`\n\nThe last resort. Writes a single `SKILL.md` with YAML frontmatter, the stated purpose, an Approach section and an Output section — both phrased around producing evidence the gate can act on — and a `Review before promoting` note in the description. Returns `Source::Generated`, always quarantined.\n\n### Declared defaults — `install_default`\n\nSeparate from `acquire`, and used at plan time rather than dispatch time. `install_default(spec: &DefaultSkill, policy, root)` installs one of the loop's section-J declared sub-agents. It is **idempotent**: a skill already found on disk is returned untouched, which is what makes it safe to run at the start of every run rather than once at scaffold time.\n\nThree origins, from `DefaultSkill::source`:\n\n- `SkillOrigin::Local` — never fetched. Returns `SkillError::Missing` with an error message that names the fix (put it under `.claude/skills/` or change its source).\n- `SkillOrigin::Marketplace` — `install_from_cli` on `spec.url` if present, otherwise `spec.name`.\n- `SkillOrigin::Github` — `clone_repo`.\n\nAfter install, `spec.init_argv()` runs inside the installed directory if it is non-empty. That is **argv, not a shell** — the setup step for a skill declared in a config file is not an eval hatch.\n\n## The safety floors\n\nThree functions guard every install path. All of them refuse rather than repair.\n\n```rust\npub fn is_safe_name(name: &str) -> bool\npub fn is_blocklisted(name: &str) -> bool\npub use loopsmith_util::which;   // shared with the provider plane\n```\n\n**`is_safe_name`** accepts ASCII alphanumerics plus `- _ / @ .`, length 1–64, and rejects anything containing `..` or starting with `/` or `-`. It is not a sanitiser by design: a silently rewritten skill name installs something the caller did not ask for. `vercel-labs/agent-skills@react` and `my_skill.v2` pass; `../escape`, `-rf`, and `a/../../b` do not.\n\n**`is_blocklisted`** does a case-insensitive substring match against `credential`, `secret`, `exfil`, `keylog`, `password`, `token-steal`. This runs *after* the star floor and independently of it — the test `a_high_star_credential_grabber_is_still_excluded` pins a 9000-star, perfectly-matching entry that must never be offered. Popularity is not trust.\n\n**`which`** is re-exported from `loopsmith-util` rather than reimplemented. The local copy it replaced was PATH-only and accepted any file, so a non-executable `curl` on PATH read as \"curl is available\". The shared version checks the executable bit.\n\nThe internal `run(cmd, args, cwd)` helper funnels every subprocess through `which` first, returning `SkillError::Missing` before attempting a spawn, and on failure captures only the *last* line of stderr into `SkillError::Command`.\n\n## The marketplace index\n\n`marketplace.rs` fetches `https://claudemarketplaces.com/api/marketplaces` — a flat JSON array of roughly 2,600 plugin-marketplace repositories — via `curl -sS --fail --max-time <n>`.\n\nEverything the index returns is **untrusted data written by strangers**. Descriptions and keywords are text to rank, never instructions, and nothing installs without clearing the trust floors.\n\n### Parsing: lenient by necessity\n\nThe `lenient` module supplies two `deserialize_with` helpers, `number` and `string_list`, both accepting an absent field, a scalar, or the \"wrong\" shape:\n\n- `stars` and `pluginCount` are numbers in the live index but **absent on roughly a third of entries**, and third-party mirrors return strings. `lenient::number` handles `4200`, `\"1,200\"` (commas stripped), and missing (→ `0`).\n- `categories` and `pluginKeywords` are arrays, but a bare string appears in the wild. `lenient::string_list` wraps it.\n\nThis is not defensive paranoia; it is a recorded bug. Declaring `stars: String` made every parse fail, the failure was swallowed, and the search \"worked\" while returning nothing. Both the crate tests and `templates/marketplaces.json` document the verified live shapes so the mistake is not repeatable.\n\n### Ranking and the two entry points\n\n`MarketplaceEntry::relevance` counts how many search terms appear in a lowercased haystack of `repo + description + categories + pluginKeywords`. It is deliberately dumb — its job is to shortlist for a human or for the trust floor, not to be clever.\n\n`rank_entries` then applies, in order: the star floor (`min_stars`, default 100) → the blocklist on `repo` → drop anything with zero relevance → sort by relevance descending, tie-broken by stars → truncate to `limit`.\n\nTwo public forms, and the difference is the point:\n\n- **`rank_checked`** returns `Err(SkillError::Refused)` on a parse failure. A broken index must not look like a working search that found nothing.\n- **`rank`** is the convenience wrapper that treats a parse failure as an empty list. Use it only where an empty result is genuinely acceptable.\n\n`search_marketplace` = `fetch_index` + `rank_checked`, and is what the CLI calls.\n\n`search_skills_cli(query, cwd)` is separate because the two sources list different things: the index lists plugin *bundles*, the `skills` CLI lists *individual* skills. It shells `npx --yes skills find <query>` and returns raw stdout, after a looser validation pass that permits spaces in a search term.\n\n`SearchOptions` defaults: `min_stars: 100`, `limit: 10`, `timeout_seconds: 20`.\n\n## Outcome ranking\n\n```rust\npub fn recommend(\n    configured: &[String],\n    trials: &[SkillTrial],\n    min_trials: usize,\n    adopt_above: f64,\n    drop_below: f64,\n) -> Recommendation           // { adopt: Vec<String>, drop: Vec<String> }\n```\n\n`recommend` delegates the arithmetic to `loopsmith_memory::score_skills`, which folds `SkillTrial` records into `SkillScore`s carrying a `trials` count and a `satisfaction_rate()`. The policy on top is three rules:\n\n1. **`trials < min_trials` → skip entirely.** One lucky run is not evidence, and the test `one_lucky_run_is_not_evidence` pins that a single satisfied trial drives no config change.\n2. **`rate >= adopt_above` and not already configured → adopt.** An already-configured skill is never re-adopted.\n3. **`rate <= drop_below` and currently configured → drop.** A skill that is not configured cannot be dropped.\n\nA `SkillTrial` records `run_id`, `iteration`, `node_id`, `skill`, `source` (the `Source` string, so a track record carries its provenance), `pass_rate`, `satisfied`, and optional `tokens`. `Source::as_str` gives the stable wire form: `installed`, `marketplace`, `generated`.\n\nThe output is a `Recommendation`, not a config mutation. The crate has no path that writes a skill into a loop config — `loopsmith-run` turns the recommendation into a proposal on disk and a human applies it.\n\n## Where it plugs in\n\n| Caller | Function | When |\n|---|---|---|\n| `loopsmith-run/src/planning.rs` → `install_default_skills` | `install_default` | plan time, per declared default skill |\n| `loopsmith-run/src/waves.rs` → `resolve_skills` | `acquire` | building a wave |\n| `loopsmith-run/src/dispatch.rs` → `ensure_skills` | `find_installed`, `acquire` | just before a node runs |\n| `loopsmith-run/src/evolve.rs` → `skill_proposals` | `recommend` | after a run, writing `proposals/` |\n| `src/cmd/skills.rs` → `list` / `search` / `install` | `list_installed`, `search_marketplace`, `search_skills_cli`, `install_default` | the `loopsmith skills` subcommands |\n\nDownward, the crate depends on `loopsmith-core` for the config types (`SkillPolicy`, `DefaultSkill`, `SkillOrigin`, `AcquisitionSource`, `is_safe_repo_url`), `loopsmith-memory` for `SkillTrial` / `SkillScore` / `score_skills`, and `loopsmith-util` for `which` and `platform::home_dir`. It depends on no HTTP client, no async runtime, and nothing else.\n\nThe user-facing surface is the `loopsmith skills` command group:\n\n```bash\nloopsmith skills search <terms...>       # search_marketplace + search_skills_cli\nloopsmith skills acquire <config> <name> # acquire, into quarantine\nloopsmith skills install <config>        # install_default for every section-J default\nloopsmith skills list <config>           # list_installed\nloopsmith skills scores <config>         # the trial record behind recommend\n```\n\n## Contributing notes\n\n- **Add a safety floor, do not weaken one.** `is_safe_name` and `is_blocklisted` are checked at the top of `install_from_cli`, `install_default`, and `generate`, and again on `repo` inside `rank_entries`. New install paths must re-check; the floors are not enforced by a type.\n- **Refusal must not fall through.** If you add an `AcquisitionSource`, preserve `acquire`'s handling: `Err(SkillError::Refused(_))` propagates immediately, every other error continues the walk.\n- **A parse failure is not an empty result.** Prefer `rank_checked` in new code. This crate has already shipped that bug once.\n- **Do not link an HTTP client.** The shell-out to `curl`/`npx`/`git` is what keeps this crate dependency-free and lets a network-less machine degrade gracefully. `SkillError::Missing` is the designed outcome, not a failure to handle.\n- **Tests must not touch the network.** `acquire_falls_through_to_generation_when_nothing_is_found` sets an explicit `acquisition_order` of `[Installed, Generate]` for exactly this reason. Marketplace tests run against the `SAMPLE` constant in `marketplace.rs`, which mirrors the live payload including an entry with `stars` absent.\n- **Crate packaging is narrow on purpose.** `include = [\"/src/**/*\", \"/README.md\"]`. Integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain; shipping them would hand a published crate tests that cannot pass."};

        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
})();

</script>
</body>
</html>
