e 29 distinct `scripts/…` detectors between them and the repository ships none. A missing script becomes a *detector error*, which the gate converts to a failed check. Correct behaviour, and useless for exercising anything past the first gate.\n\n`Fixture` therefore never touches `config/examples/`. It parses an example, rewrites the parsed model in memory, and serialises the result into a scratch directory. Everything a scenario needs — unblocked steps, runnable detectors, providers that cost nothing — is applied to that copy.\n\n```mermaid\nflowchart LR\n  E[\"config/examples/*.yaml\"] --> P[\"parse_str\"]\n  P --> U[\"unblock: pre_execution done\"]\n  U --> D[\"deterministic_providers\"]\n  D --> W[\"scratch/loop.yaml\"]\n  W --> S[\"stub_scripts / satisfy_files<br/>satisfy_metrics / git_init\"]\n  S --> R[\"run_loop → the real binary\"]\n  R --> A[\"ledger · run log · summaries · export\"]\n```\n\n## `Fixture`\n\nConstruction goes through one of two entry points, both of which run `unblock` and `deterministic_providers` before writing `loop.yaml`:\n\n- `Fixture::example(name, tag)` — a runnable copy of a shipped example.\n- `Fixture::from_yaml(text, tag)` — config text directly, for shapes no example has (`NEVER_SATISFIED`, `ISOLATED_WRITER`, `ISOLATED_CHAIN` in `stress.rs`).\n\n`tag` names the temp directory. It must be unique across concurrently running tests — see [Traps](#traps-worth-not-rediscovering).\n\nThe struct exposes `dir`, `config`, and `cfg` (the parsed `LoopConfig`). A scenario mutates `cfg` in place and then calls `write_config()`; nothing else notices the change. This is the standard shape:\n\n```rust\nlet mut f = Fixture::example(\"traffic-loop\", \"phases\");\ncap(&mut f.cfg, 6);\nstarve(&mut f.cfg, \"overall\");\nf.write_config();\nlet f = f.stub_scripts(Stubs::Pass).satisfy_files().satisfy_metrics();\n```\n\n### Builder methods\n\nAll of these consume and return `Self`, so they chain — but note they must come *after* the last `write_config()`, since `stub_scripts` may rewrite the config itself on Windows.\n\n| Method | Effect |\n|---|---|\n| `stub_scripts(Stubs)` | Generates an executable stub for every `scripts/…` detector the config names |\n| `satisfy_files()` | Writes `ARTIFACT_BODY` into every path a `file_exists` detector points at |\n| `write_artifacts(body)` | Same, with a body the scenario chooses |\n| `satisfy_metrics()` | Writes a `metrics.json` that satisfies every threshold, via `satisfying_value` |\n| `metrics(&[(name, value)])` | Specific values, for a threshold meant to fail |\n| `git_init()` | Makes the loop directory a repository, so `isolated: true` produces a real worktree |\n\n`Stubs` is the axis that reaches the interesting states:\n\n- `Stubs::Pass` — the success path and the export.\n- `Stubs::Fail` — `no_progress_iterations`, the randomness gate, `max_revisions_per_node`.\n- `Stubs::PassFrom(n)` — fails until iteration `n`. Implemented with a `.stub-count` file in the loop root rather than an environment variable, because the loop cannot change its own environment between iterations and the gate re-runs every detector each pass.\n\n### Running and reading back\n\n`run(args)` and `run_with_env(args, env)` invoke the binary in `dir`. `run_loop(run_id, env)` is the common case — `run loop.yaml --run-id <id> --no-acquire` — with a fixed run id so assertions know what to look up.\n\n`store()` opens the sled ledger, `log_text(run_id)` reads `logs/<run-id>.log`, and `export_dir()` is `<name>-success/`. `cleanup()` removes the scratch directory.\n\n`LOOPSMITH` is the binary under test, supplied by Cargo through `env!(\"CARGO_BIN_EXE_loopsmith\")` — there is no `cargo run` anywhere here and no chance of driving a stale build.\n\n## Assertions read artifacts, not stdout\n\nStdout is a report. The record is the sled ledger, `logs/<run-id>.log`, `store.summaries()`, the checkpoint, and the presence or absence of `<name>-success/`.\n\nOne assertion recurs and is worth keeping, in `every_example_completes_an_iteration_and_leaves_a_consistent_record`:\n\n```rust\nassert_eq!(log.lines().count(), ledger.len());\n```\n\nThe run log and the ledger are written through a single call, so they must always hold the same number of events. A divergence means one of the two write paths grew a branch the other did not.\n\n## How the fixture stays deterministic\n\n`deterministic_providers` replaces every provider with `printf` emitting a fixed judge block. Three properties of that rewrite are load-bearing:\n\n- **Provider ids are preserved.** `enforce_judge_independence` compares them: a judge must sit on a different id from the builder it reviewed, or the gate refuses the judgment outright. Rewriting the ids would quietly switch that check off.\n- **Every provider emits the judge block**, not only the ones a judge lands on. Judge output is harvested only from `Role::Judge` nodes, so a builder emitting the same text is inert — and this avoids re-deriving the cascade to work out where a judge would land. `judge_provider_ids` exists for scenarios that do need that answer.\n- **`judge_payload` always emits an `EVIDENCE:` line and `SCORE: 10`.** A judge PASS with no evidence is demoted to FAIL by the parser, which would make every subjective validation permanently unsatisfiable. `failing_judge_payload` and `set_provider_output` are the escape hatches for making one judge disagree while builders carry on.\n\n`ARTIFACT_BODY` is likewise not arbitrary. The files a `file_exists` detector names are the same files a `regex_match` detector reads — evidence collection registers them under their stem — so the default body carries a URL and a `post_id:` line, which is what the shipped examples look for. `a_regex_detector_reads_the_file_the_loop_produced` asserts both directions: the default body satisfies `sources-cited`, and `write_artifacts(\"no links in here at all\\n\")` does not.\n\n## `stress.rs` — the iteration loop\n\nTwo helpers shape most scenarios. `cap(cfg, n)` pins `max_iterations` and disables the no-progress gates, so a scenario cannot sit inside a long example's default ceiling of ten iterations and three hours. `starve(cfg, target)` rewrites every validation on a target to `Detector::Script { command: \"false\" }`, so a run keeps iterating instead of succeeding on its first pass — `phases_open_one_at_a_time_across_a_real_run` starves `overall` for exactly this reason.\n\nThe two broad sweeps run over `all_examples()` and are the cheapest signal that a config change broke the runtime rather than the schema: every example must complete one supervised iteration and leave a consistent record, and every example must survive a run where nothing at all is satisfiable without panicking.\n\nBeyond that, the areas covered:\n\n- **Phases** (`traffic-loop`, four strictly linear phases). Nodes must come online one iteration at a time in order, a phase whose goals are never certified must keep the ones behind it shut for the whole run, and a phased success must still export.\n- **Worktree isolation** (`refactor-loop`). Outside a repository, `isolated: true` degrades to the shared directory *silently by design*, and the degradation must be reported in the ledger. Inside one, `state/worktrees/<node>/` must actually exist. Two hand-written configs go further: `ISOLATED_WRITER` proves an isolated builder's output reaches the gate (which reads the loop root), and `ISOLATED_CHAIN` proves an isolated node can read what its isolated upstream produced — a worktree branches from `HEAD`, so seeding is required and must appear in the ledger as \"was seeded with\".\n- **Stop gates and the randomness agent.** The seeded fallback must record its seed so the choice replays; a reachable cheap provider must make the *agent* path fire; and an answer off the four-item menu (`reorder:`, `escalate:`, `explore:`, `reframe:`) must fall back rather than be guessed at, with the refused text never leaking into the choice.\n- **Resume.** Everything the stop gates count used to be declared inside the iteration loop, so it was rebuilt from nothing on resume — a scheduled long-lived loop could therefore never reach the ceilings meant to stop it. Two tests pin this: a resume must not refund a node's revision budget, and must not reset `stale_iterations` or drop `last_signature`.\n- **Proposals.** The loop proposes; a human applies. Each `ProposalKind` has a test — `ReshapeGraph` for an exhausted node, `ChangeCriteria` for a detector that cannot run (broken, not failing), `TrySkill` for unexplored candidates. Each also asserts the negative: exactly one proposal rather than one per iteration, the config on disk untouched, and no ledger entry showing the proposal self-applied.\n- **Summaries and skill trials.** A configured `context.summary_provider` must produce prose, and that prose must not be able to satisfy a goal the gate refused. A `SkillTrial` must carry the token cost of the node that used the skill, or ranking cannot distinguish a free win from one that triples the bill.\n\n## `compat.rs` — portability of a generated loop\n\nA loop directory outlives the checkout that produced it. Three differences break it every time and all three are invisible on the machine that wrote it: **bash 3.2** (macOS still ships it), **BSD versus GNU `sed`/`stat`/`readlink`**, and **whichever scheduler is installed**, which is not implied by the OS.\n\nThese tests scaffold with `new_loop(tag)` — `loopsmith new` refuses a path inside the loopsmith checkout, which is why it always happens in a scratch directory — and then *run* the generated scripts rather than reading them.\n\n- `the_compatibility_helpers_work_under_posix_sh` sources `scripts/compat.sh` under `sh` and exercises every helper (`compat_report`, `sed_i`, `stat_size`, `stat_mtime`, `readlink_f`, `sha256`, `require`), because a helper nobody calls is a helper nobody has checked. It also asserts `sed_i` left no `sample.txt.bak` behind, which is what a wrong `-i` spelling produces on BSD.\n- **`need_bash` and `require` exit 2, not 1.** A detector's exit code is its verdict, and \"this machine cannot run the check\" is a different fact from \"the check failed\". A gate that cannot tell them apart reports missing tooling as unfinished work.\n- `the_generated_scripts_parse_under_posix_sh` runs `sh -n` over `run.sh`, `resume.sh`, and `compat.sh`, then scans for bashisms — through `strip_comments`, because these files *document* the constructs they must not use and a naive check flags its own explanation. `strip_comments` handles both `#` and the `rem ` dialect for the same reason.\n- `the_generated_cmd_launchers_are_crlf_and_shaped_for_cmd_exe` pins the `.cmd` launchers' shape: CRLF throughout, a pinned absolute binary with a `where loopsmith` fallback, `setlocal enabledelayedexpansion`, and **exactly one** `endlocal & exit /b %CODE%` on the last line. Two `cmd.exe` traps live here and Windows CI walked into both — the implicit `endlocal` restoring a saved errorlevel (so an early `exit /b 127` reported 0), and `%ERRORLEVEL%` inside a parenthesised block expanding at parse time.\n- `launcher()` and `launcher_file()` pick the launcher this host can actually execute. Hardcoding `./run.sh` would test nothing on Windows; `#[cfg(unix)]` would leave the `.cmd` unexercised on the only platform that runs it.\n- `a_generated_script_falls_back_to_path_when_the_pinned_binary_has_moved` rewrites the pinned path to a bogus one and asserts exit 127 with a message that says what to do, then proves the `PATH` fallback fires with the real binary. `with_system_path` keeps `System32` on `PATH` on Windows, since removing it stops the test measuring the fallback and starts it measuring whether `where.exe` exists.\n- `the_export_script_is_posix_and_does_not_pin_a_binary` — a success export travels further than anything else a loop produces, so it must assume least of all.\n- `doctor` must report `os`, `userland`, `bash`, `scheduler`, and `git`, must quote the in-place `sed -i` spelling for this userland, and must stay **advisory** (a non-zero exit would fail a CI step that was working). Pointed at a config it also names detector scripts that do not exist or are not executable, with `chmod +x` in the message.\n\nThe non-executable-detector test is `#[cfg(unix)]` for a semantic reason, not just because `set_permissions` needs `PermissionsExt`: there is no executable bit to clear off unix, so `loopsmith_util::is_executable` degrades to a file check and `doctor` is *right* to say nothing. Gating the whole test states that; gating only the chmod would leave a test asserting the wrong thing.\n\n## `surface.rs` — the command surface\n\nCheap, provider-free, scratch-directory-only exercises of subcommands that compiled and were never executed: `new --config-stdin` (YAML and `--markdown`), `convert --to-yaml` in both directions, `skills install`, `watch --check` and `watch` as a resident process, `schedule` with and without `--install` (redirected via `LOOPSMITH_LAUNCH_AGENTS_DIR`), the reporting commands (`plan`, `providers`, `permissions`, `gate`), the run reports against an unknown run id, and `prune`.\n\nThe round-trip test compares **parsed models**, not text — comment placement and quoting are presentation, and the round trip is about meaning. `trimmed()` normalises trailing whitespace on both sides: a YAML block scalar ends with a newline and Markdown has no way to say so, which is a documented property of the Markdown grammar rather than a conversion bug. The Markdown-on-stdin test generates its input by running `convert` rather than hand-writing the grammar, so it tests the stdin path rather than the author's typing.\n\n## `opt_in.rs` — network and money\n\nEvery test here begins with the `gated!` macro, which prints why it is skipping and returns unless its variable is `1` or `true`. `cargo test --workspace` therefore never clones a repository, never calls a model, and never costs anything.\n\n```sh\nLOOPSMITH_STRESS_NETWORK=1  cargo test -p loopsmith --test opt_in\nLOOPSMITH_STRESS_PROVIDER=1 cargo test -p loopsmith --test opt_in -- --nocapture\n```\n\n`LOOPSMITH_STRESS_NETWORK` covers the section-J clone path: `install_default` shelling out to `git clone --depth 1` into `generated-skills/`, and a post-clone `init_command` running as argv inside the installed directory. Its counterpart, `an_unsafe_repo_url_is_refused_before_git_is_reached`, is **not** gated — refusing takes no network, and it is the half of the clone path that matters most.\n\n`LOOPSMITH_STRESS_PROVIDER` invokes whatever model the example names; point it at the cheapest one you have, since the aim is to prove the plumbing reaches a real provider, not to get a good answer. These two tests read `research-loop.yaml` directly rather than through `Fixture::example`, because the fixture would swap the providers out. `the_harness_still_builds_a_runnable_fixture` is an ungated sanity check, so a failure above is about the network or the provider rather than the scaffolding around it.\n\n## Traps worth not rediscovering\n\n- **Give every fixture a distinct tag.** Temp directories are named from it and the suite runs threaded, so two concurrent tests sharing a tag collide on the sled lock — the same error, from the same cause, with nothing pointing at the tag.\n- **The store cannot be opened while the binary under test is running**, and the handle must be dropped before its directory is removed. Every test here ends `drop(store); f.cleanup();`. A store held open around a `Command` call reports a lock error that reads like a backend bug.\n- **A detector script runs with no shell and no timeout.** `command` is argv[0] and `args` are literal, so a stub needs a shebang and must not hang. On Windows there is no shebang handling at all, which is why `stub_scripts` writes `.cmd` stubs and repoints the config's detector commands at them — the same rewrite a user has to do there, which is why `compat.sh` says so.\n- **A `\\` continuation in a non-raw `format!` eats the next line's indentation.** `run.sh` reached disk flat because of it. Nothing about that fails a build or a parse, so `the_generated_scripts_keep_the_indentation_they_were_written_with` reads the layout back.\n\n## Not covered, and why\n\n- **Loading a launch agent.** `--install` writes the plist and stops; `launchctl load -w` stays the user's call. The write itself is covered because `LOOPSMITH_LAUNCH_AGENTS_DIR` redirects the destination. Same reasoning for `schtasks /Create`: `schedule` prints the command rather than running it.\n- **Executing a `.cmd` launcher.** No POSIX host can run one, so this suite checks its shape and the `windows-latest` CI leg runs it.\n- **A GNU userland, locally.** `compat.rs` exercises the helpers rather than mocking the userland, so whichever machine runs the suite proves its own half and the `ubuntu-latest` CI leg proves the other.\n\n## Adding a test\n\n1. Pick a fixture source — a shipped example if the shape exists, `from_yaml` if it does not.\n2. Give it a tag no other test uses.\n3. Mutate `cfg`, then `write_config()`, then chain the builder methods.\n4. Run through `run_loop` with a fixed run id.\n5. Assert against `store()`, `log_text()`, or `export_dir()` — not stdout.\n6. `drop(store)` before `cleanup()`.\n\nIf the behaviour you are pinning is currently a sentence someone has to remember, it belongs in the trap table with a test name beside it. A remembered rule is one refactor away from being gone; a test is not.","overview":"# loops — Wiki\n\n# loopsmith\n\n> Self-evolving agent loops. The gate is code, so \"done\" cannot be argued.\n\nloopsmith runs a long-lived, unattended loop over a job you'd otherwise redo by hand every week — a competitor roundup, a lead list, a landing page, a nightly refactor. You describe the job once in a config file: what you want, how anyone would tell it's good, and when the loop is allowed to give up. loopsmith then puts an AI to work on it, checks the result against the files on disk, sends it back when it falls short, and stops when it passes.\n\nOne rule holds the whole design up:\n\n> **A model must not be the thing that certifies its own completion.**\n\n`GoalState { satisfied: true }` is constructed in exactly one place in the entire workspace — inside the deterministic Rust gate. No prompt, no provider response, and no MCP tool can produce that value. The gate can also **revoke**: delete a required artifact and a satisfied goal flips back to unsatisfied. That asymmetry is what makes it safe to leave a loop running for weeks.\n\n---\n\n## Getting started\n\nThe repository is a Rust workspace under `runtime/` that produces exactly one executable, `loopsmith`. Everything else is a library it links.\n\n```bash\ncd runtime\ncargo build --release          # requires Rust 1.75+\ncargo test --workspace         # ~415 tests\n```\n\nTo install a release build instead of working from the tree, pick whichever package manager you already have — `cargo install loopsmith`, `npm install -g @bitphill/loopsmith`, `pip install loopsmith-cli`, or the Homebrew tap. All of them put the same binary on `PATH`; the packaging scripts and the one-line installers live in [Distribution & Installers](distribution-installers.md).\n\nYour first loop:\n\n```bash\nloopsmith new --path ~/loops/nightly-refactor --purpose \"keep the module simple\"\ncd ~/loops/nightly-refactor\n$EDITOR loop.yaml\nloopsmith validate loop.yaml && loopsmith plan loop.yaml && ./run.sh\n```\n\n`--path` must point **outside** this repository — a loop edits files and writes state, so it never gets aimed at the tool that runs it.\n\nExpect `validate` to fail the first time. It refuses to pass until every `pre_execution` step is marked `done: true`, which is a deliberate demand that you do the task by hand once before automating it. The manual run *is* the spec.\n\nTwo front ends will build the config for you if you'd rather not start from a blank file: `loopsmith --web` opens a six-step browser editor on `127.0.0.1:3000`, and `loopsmith --guided` asks the same questions one at a time in the terminal, so it works over SSH. Both are compiled into the binary and both spawn the real CLI for every action, so neither can drift from it.\n\n---\n\n## The config is the whole interface\n\nA loop is described by ten sections, **A** through **J**: context, the manual work list, goals, validations, success scenarios, stop gates, schedules, constraints, execution guidelines, and default skills. That model is defined once, in [Loop Configuration Schema](loop-configuration-schema.md) — as `config/loop.schema.json` for editors and external tooling, and as the Rust types plus cross-field rules in `loopsmith-core`. Nothing else in the workspace gets to invent config shape.\n\nYou can write that config as YAML or as Markdown. They are the same model, and [Markdown/YAML Config Interchange](markdown-yaml-config-interchange.md) converts either way (`loopsmith convert`). The Markdown form exists so the reason a goal exists can sit in prose directly beside the goal.\n\nThirteen complete, non-toy loops ship in [Example Loops](example-loops.md) — research, refactoring, marketing, lead generation, agent payments — each as both a `.yaml` and an equivalent `.md`. They double as the broadest integration fixture in the repo: a config change that breaks the runtime fails against all thirteen before it reaches a user.\n\n---\n\n## Architecture\n\n```mermaid\nflowchart LR\n  CLI[\"CLI<br/>loopsmith\"] --> CFG[\"Loop Config<br/>A–J model\"]\n  CFG --> PLAN[\"Graph Planner<br/>waves + workers\"]\n  CLI --> ENG[\"Iteration Engine\"]\n  PLAN --> ENG\n  ENG --> PROV[\"Providers<br/>agent CLIs\"]\n  PROV --> WS[(\"Workspace<br/>files\")]\n  WS --> GATE[\"Gate<br/>deterministic\"]\n  GATE -- verdict --> ENG\n  ENG <--> MEM[(\"Memory<br/>episode store\")]\n  MEM --> MCP[\"MCP server<br/>read-only\"]\n```\n\nRead it left to right and the design falls out. A config is parsed and validated, planned into waves, executed against providers that write real files, and then judged by a gate that only ever looks at those files. The engine never hears \"I'm done\" from a model; it hears a verdict from code.\n\n[CLI Command Surface](cli-command-surface.md) is the only binary in the workspace and does no real work of its own — it parses arguments, dispatches, and presents. Its heaviest traffic is into the config model (`validate`, `plan`, `new`, `convert`) and into the store (`status`, `ledger`, `proposals`, `watch`).\n\n[Execution Graph & Concurrency Planning](execution-graph-concurrency-planning.md) answers three questions from `depends_on` declarations alone, before anything is dispatched: is the graph acyclic and are all its dependencies real, which nodes may run simultaneously, and how many workers are actually worth starting. It is pure arithmetic over the config — no I/O, no clock — which is why `loopsmith plan` can show you the wave schedule and the Amdahl ceiling without spending a cent.\n\n[Loop Execution Engine](loop-execution-engine.md) is the state machine that spends the money. It is split by *authority* rather than convenience: `mod.rs` holds the iteration state and delegates dispatch, prompt construction, evidence collection, stopping, and export to neighbouring modules.\n\n[Provider Integration](provider-integration.md) turns \"call a model\" into \"run a program.\" Claude Code, Ollama, a Grok CLI, an OpenAI-compatible endpoint driven by `curl`, an MCP server over stdio — all of them are the same struct: a command, argument templates, a few knobs. There is no per-vendor Rust code and no HTTP client anywhere in the crate, which is exactly why bring-your-own-key is free and why adding a provider is a config edit.\n\n[Gating & Success Criteria](gating-success-criteria.md) is deliberately the least clever crate here: plain Rust, no provider calls, no prompt in the code path. Everything it concludes follows mechanically from a config plus a bag of evidence read off disk.\n\n[Memory & Episode Store](memory-episode-store.md) is the persistence plane, and it holds only what must survive a crash, a schedule boundary, or a context reset. If a piece of state can be recomputed from the config or the graph, it lives elsewhere; if losing it would make a resumed run lie about what already happened, it lives here.\n\n[MCP Server](mcp-server.md) is the read side of the control plane. It lets an editor or an agent inspect a loop's schedule, ledger, and gate verdict over stdio — everything about its own run except the one thing it must not control. There is a test that fails if a tool for setting `goal_satisfied` ever appears.\n\nAround that spine sit four supporting concerns. [Evolution & Perturbation](evolution-perturbation.md) runs once per iteration to answer \"the loop is not converging — what now?\", splitting by who may act on the answer: `evolve.rs` writes proposals for a human, `perturb.rs` changes the next iteration itself. [Skills System](skills-system.md) resolves the sub-agents a loop asks for — installed, then marketplace, then generated — and pairs each use with the gate verdict that followed it, so adopt/drop advice comes from outcomes rather than reasoning. [Permissions & Sandboxing](permissions-sandboxing.md) derives the narrowest grant a config actually needs and writes it into the harness settings file. [Scheduling & Triggers](scheduling-triggers.md) answers \"should this run right now?\" via cron expressions, file-mtime scans, and edge detection, and generates the launchd / systemd / Task Scheduler artifacts that ask.\n\nUnderneath everything is [Platform Utilities](platform-utilities.md), the base of the dependency graph. Every crate depends on it and it depends on nothing — not even serde — because anything added there is added to every build in the workspace.\n\n---\n\n## The end-to-end flows\n\n**Loading a config.** Every command that touches a loop funnels through the same path: `loopsmith-core::load` sniffs the format, and Markdown goes through tokenize → build document → section shape before landing in the identical `LoopConfig` a YAML file produces. Because `new`, `validate`, `run`, `resume`, `schedule`, and both the web and guided front ends all call it, a parser change is felt everywhere at once — which is intentional, and why the parser has the test coverage it does.\n\n**One iteration.** The engine plans the node graph into waves, dispatches each wave to its providers, and lets those providers write files. It then collects evidence from disk, hands it to the gate, and receives a verdict per target — never a claim from a model. Skill usage and ledger entries land in the store. Evolution and perturbation get a look at the trend. Finally the stop ladder runs, mechanically, in order: overall success, iteration cap, wall clock, token budget, cost budget, and no-measurable-progress. Only the first of those six counts as success; when it fires, loopsmith writes a `<name>-success/` directory beside the config holding the converged configuration, the gate's evidence, and the artifacts.\n\n**Resuming.** `resume.sh <run-id>` re-enters through the same start path as a fresh run, reloads the validated config, and picks up from the last checkpoint in the store. Nothing about a resumed run is a special case in the engine.\n\n**Running on a schedule.** `loopsmith schedule` evaluates triggers and installs an OS-level scheduler artifact that invokes the loop unattended. This is where the \"walk away for weeks\" claim is actually cashed — and where the gate's ability to revoke matters most, because nobody is watching.\n\n---\n\n## Finding your way around\n\n`runtime/crates/` holds the nine crates: `loopsmith` (the binary) plus `loopsmith-util`, `-core`, `-memory`, `-graph`, `-gate`, `-provider`, `-skills`, and `-mcp`. `config/` holds the schema and the example corpus. `installers/`, `npm/`, `pypi/`, and `Formula/` are the packaging channels. The six top-level Markdown files are described in [Project Documentation](project-documentation.md) — several are load-bearing rather than decorative, since `LOOP-TEMPLATE.md` is a file users copy and `config/examples/*` is compiled into the binary.\n\nUnit tests live beside their crates. What they structurally cannot cover — whether the pieces work together, through the real binary, against the configs users are actually handed — lives in the integration suite documented in [Other](other.md):\n\n```sh\ncargo test -p loopsmith --test stress    # the iteration loop\ncargo test -p loopsmith --test surface   # subcommands\ncargo test -p loopsmith --test compat    # portability of generated loops\ncargo test -p loopsmith --test opt_in    # network / money — skips by default\n```\n\nIf you're touching the gate, read [Gating & Success Criteria](gating-success-criteria.md) first and understand why `satisfied: true` has exactly one construction site before you add a second one.","permissions-sandboxing":"# Permissions & Sandboxing\n\n# Permissions & Sandboxing\n\nDerives the narrowest permission grant a loop config actually needs, renders it for human review, and writes it into the settings file the harness reads. A second, separate concern lives alongside it: detector scripts run with no shell, so the module also ships the portability shim those scripts source.\n\n**Files**\n\n| Path | Role |\n|---|---|\n| `runtime/crates/loopsmith-cli/src/permissions.rs` | Derivation, rendering, and settings-file merge |\n| `runtime/crates/loopsmith-cli/src/cmd/permissions.rs` | `loopsmith permissions` subcommand |\n| `runtime/crates/loopsmith-cli/templates/permissions.template.json` | Documented reference shape (not a generated artifact) |\n| `runtime/crates/loopsmith-cli/templates/compat.template.sh` | Sourced by generated detector scripts |\n\n## Why derivation instead of a fixed allowlist\n\nA hands-off run cannot pause to ask for consent, but a run that grants itself blanket access is not hands-off — it is unsupervised. The resolution is to compute the rules from the config, show them once, and grant once. A loop with no script detectors never asks to run `cargo`; a loop whose `skills.acquisition_order` never reaches the marketplace never asks for network access.\n\nThe important thing to understand before changing anything here: **this grant is not the safety mechanism.** The `$deny_note` in the template says so explicitly, and `render` repeats it to the user — the constraint block in the loop config is what stops on irreversible actions, and it stops regardless of what the settings file allows. Permissions exist to remove *prompts*, not to bound behaviour. Don't add denial logic here expecting it to enforce policy.\n\n## The three functions\n\n```mermaid\ngraph LR\n    CFG[LoopConfig] --> REQ[required]\n    REQ --> G[\"Vec&lt;String&gt;<br/>sorted, deduped\"]\n    G --> R[render] --> OUT[stdout preflight]\n    G --> M[merge_into] --> F[settings.local.json]\n    CMD[cmd::permissions::execute] --> REQ\n    SC[scaffold] --> REQ\n    WEB[web::assemble::review_config] --> REQ\n```\n\n### `required(&LoopConfig) -> Vec<String>`\n\nCollects into a `BTreeSet<String>`, so the returned vector is sorted and duplicate-free by construction — `the_grant_has_no_duplicates_and_is_sorted` pins that property rather than the function sorting explicitly. Four sources contribute:\n\n- **Providers** — every entry in `cfg.providers.providers` is a command, so each yields `Bash({p.command}:*)`.\n- **Script detectors** — each `Detector::Script { command, .. }` in `cfg.validations` yields `Bash({command}:*)`, so the gate can run its checks without a mid-run prompt.\n- **Skill acquisition** — only when `cfg.skills.acquisition_order` contains `AcquisitionSource::Marketplace`, and then both `Bash(npx skills:*)` and `WebFetch(domain:claudemarketplaces.com)`.\n- **Core tools** — `Read`, `Write`, `Edit`, `Glob`, `Grep`, unconditionally, because the loop reads and writes inside its own directory.\n\nNote that the provider and detector rules collapse when they share a binary: a config whose provider command and detector command are both `cargo` produces one rule, not two.\n\n### `render(&[String]) -> String`\n\nThe preflight block shown before the single grant. It lists the rules, then states two things the reader needs: nothing outside the list is requested, and human checkpoints still stop and wait regardless of the grant. `render_mentions_that_checkpoints_still_stop` guards the second sentence — it is a load-bearing claim about the system, not decoration, so keep it if you rewrite the copy.\n\n### `merge_into(&Path, &[String]) -> io::Result<String>`\n\nAdditive, idempotent, and deliberately forgiving of whatever is already in the file:\n\n1. Read and parse the existing file if it exists; **unparseable JSON falls back to `json!({})`** rather than erroring. A non-object root (array, string, number) is likewise replaced.\n2. Walk to `permissions.allow`, creating `permissions` as `{}` and `allow` as `[]` if absent.\n3. Build a `BTreeSet` of the existing string entries and push only rules not already present.\n4. Pretty-print, `create_dir_all` the parent, write with a trailing newline, and return the serialized JSON so the caller can display it.\n\nTwo behaviours worth knowing before you touch this:\n\n- **Unrelated keys survive.** `merging_preserves_existing_rules_and_adds_new_ones` asserts both that a pre-existing `Skill(claude-api)` rule is retained and that a sibling `\"theme\": \"light\"` is untouched. Any rewrite of this function must keep that true — it edits a file the user also owns.\n- **A malformed `permissions` value is silently skipped.** If `permissions` exists but is not an object, `as_object_mut()` yields `None`, `allow` becomes `None`, and no rules are added — yet the file is still rewritten and `Ok` is returned. The caller reports success with a count that was never applied. If you need that surfaced, this is the place to change it.\n\nCorrupt-file recovery is destructive by design (step 1 discards unparseable content), which is fine for `settings.local.json` but is the reason this function should not be pointed at a file whose content it did not expect.\n\n## The `permissions` subcommand\n\n`cmd::permissions::execute(config, write)` loads the config via `loopsmith_core::load`, computes the grant, and branches on the destination:\n\n```\nloopsmith permissions ./loop.yaml\n    → render(&grant) to stdout, for a human to read before granting\n\nloopsmith permissions ./loop.yaml --write .claude/settings.local.json\n    → merge_into, then print \"wrote N permission rule(s) to <path>\" and the merged JSON\n```\n\n`N` is `grant.len()`, i.e. the number of rules *required*, not the number newly added — a second identical run reports the same count while changing nothing.\n\n## Other callers of `required`\n\nTwo paths consume the derivation without going through the subcommand, and both must keep working when it changes:\n\n- `scaffold::scaffold` (`loopsmith-cli/src/scaffold.rs`) — bakes the grant into a freshly generated loop directory.\n- `web::assemble::review_config` (`src/web/assemble.rs`) — surfaces it in the browser review step, so the guided flow shows the same list the CLI would.\n\nBecause all three share one function, a new rule source added to `required` propagates everywhere at once. That is the intended design; adding a rule in a caller instead is the thing to avoid.\n\n## `permissions.template.json` is documentation, not output\n\nThe template's own `$comment` is blunt about this: *\"This file is the shape, not the answer.\"* It exists so a reader can see the full space of rules, with `$sections` explaining each category and `$still_stops` listing what remains gated no matter what (`constraints.human_checkpoint` entries, publishing/sending/deleting/paying, promoting a quarantined sub-agent out of `generated-skills/`, applying anything in `proposals/`).\n\nOne concrete divergence to be aware of: the template lists `Bash(loopsmith:*)` under `control_plane`, but `required` does not emit it. Nothing keeps the two in sync automatically — if you add a rule source, update the template's prose too, and if you believe the control-plane rule should be granted, that's a change to `required`, not to the template.\n\n## `compat.template.sh` — the detector execution environment\n\nLoopsmith runs a detector **with no shell**: `command` is `argv[0]` and `args` are literal. A detector is therefore a real file with a real shebang, not a shell string, and this file is what it sources:\n\n```sh\n. ./scripts/compat.sh\n```\n\nEverything in it detects at run time rather than being baked in when the loop was generated — a loop directory gets copied to a build box, a container, or a colleague's laptop, and a pre-computed answer would be wrong on arrival with no sign that anything had changed.\n\n**Exported environment**\n\n- `LOOPSMITH_OS` — `uname -s`, or `unknown`.\n- `LOOPSMITH_USERLAND` — `gnu` if `sed --version` succeeds, else `bsd`.\n- `LOOPSMITH_BASH_MAJOR` — major version of the `bash` on `PATH`, or `0` when there is none.\n\n**Helpers**\n\n| Function | Papers over |\n|---|---|\n| `sed_i <expr> <file>…` | GNU `sed -i` takes no argument, BSD requires one. Getting it wrong on BSD consumes the next argument as a backup suffix — which is how a script ends up editing a file named `-e`. |\n| `stat_size` / `stat_mtime` | `-c%s`/`-c%Y` on GNU, `-f%z`/`-f%m` on BSD. |\n| `readlink_f <path>` | `readlink -f` is absent from BSD readlink before macOS 12; falls back to a `cd`/`pwd -P` walk. |\n| `sha256 <file>` | `sha256sum` or `shasum -a 256`, whichever exists; exits 127 with a message if neither. |\n| `need_bash <major>` | macOS ships bash 3.2.57 (4.0 changed licence). Associative arrays, `${x,,}`, `mapfile`, `&>>`, and `**` all arrived in 4.0. |\n| `require <command>…` | A tool the detector needs is not on `PATH`. |\n| `compat_report` | One line of environment for a log or bug report. |\n\n### The exit-2 convention\n\n`need_bash` and `require` exit **2**, not 1, and this is the single most important contract in the file. A detector's exit code *is* its verdict: `1` means the check failed, `2` means this machine cannot run the check. A gate that cannot distinguish them reports missing tooling as unfinished work. Preserve the distinction in any new helper that can abort.\n\n### Writing detectors against this\n\nTarget POSIX `sh` unless `need_bash 4` says otherwise — that is what the rest of a generated loop uses. On Windows the file runs under Git Bash, WSL, or MSYS and behaves as it does on Linux; nothing here runs under `cmd.exe` or PowerShell. A detector meant for those is a `.cmd` or `.ps1` naming its own interpreter, precisely because there is no shell to interpret it.\n\n## Tests\n\nThe unit tests in `permissions.rs` build configs from YAML through `loopsmith_core::parse_str` via the local `cfg(extra: &str)` helper, which is how the marketplace test mutates `skills.acquisition_order` to `[Installed]` and asserts the network and `npx skills` rules disappear. Filesystem tests use `loopsmith_util::testing::temp_dir` and clean up with a best-effort `remove_dir_all`. When adding a rule source, add both halves of the marketplace pattern: the rule appears when the config needs it, and is absent when it does not.","platform-utilities":"# Platform Utilities\n\n# Platform Utilities (`loopsmith-util`)\n\n`loopsmith-util` is the base of the workspace dependency graph. Every other crate — `loopsmith-core`, `-memory`, `-graph`, `-gate`, `-provider`, `-skills`, `-mcp`, and the CLI — depends on it, and nothing depends *on* those from here. It has **zero dependencies**, not even `serde`, because anything added here is added to every build in the workspace.\n\nThe crate answers three questions that came up repeatedly across crates and were being answered differently (and sometimes wrongly) in each one:\n\n1. **Is this command available, and where?** → `which` / `is_executable`\n2. **What time is it?** → `now_ms`\n3. **What is this host actually capable of?** → the `platform` module\n\nPlus one opt-in extra: `testing::temp_dir`, the shared temp-path allocator used by test suites across the workspace.\n\n---\n\n## Layout\n\n| Path | Contents |\n|---|---|\n| `src/lib.rs` | `which`, `is_executable`, `now_ms`, plus private `first_executable` / `path_extensions`; `testing` submodule behind the `testing` feature |\n| `src/platform.rs` | `Os`, `Userland`, `BashVersion`, `Platform`, `home_dir`, `preferred_schedulers` |\n\nTwo features' worth of build surface: the default (empty) and `testing`. Test scaffolding is gated so it never lands in a release build; crates that want it enable `loopsmith-util = { …, features = [\"testing\"] }` from `[dev-dependencies]`, and resolver 2 keeps that activation out of the normal dependency build.\n\nThe published tarball ships `src/` and `README.md` only (`include` in `Cargo.toml`) — integration tests elsewhere in the workspace read `config/examples/` and `config/loop.schema.json` from the repo root, which a crate tarball cannot carry.\n\n---\n\n## Command resolution\n\n### `which(cmd: &str) -> Option<PathBuf>`\n\nResolves a command the way a shell would, with two branches:\n\n- **Anything containing a path separator** (or an absolute path) is checked directly. It is *not* joined onto `PATH` entries — three earlier private copies of this function did exactly that, and consequently returned `None` for every absolute path handed to them.\n- **A bare name** is joined onto each `PATH` entry in order, first hit wins.\n\nBoth branches funnel into the same private helper:\n\n```\nwhich ──► first_executable ──┬─► is_executable        (the direct hit)\n                             └─► path_extensions ──► is_executable  (per suffix)\n```\n\n`first_executable` tries the path as given, then appends each entry from `path_extensions()`. The suffix is **appended, never substituted** — `Path::set_extension` would rewrite `check.sh` into `check.exe`, and a command name is allowed to contain a dot. So on Windows `check.sh` may legitimately resolve to `check.sh.exe`.\n\n`path_extensions()` returns an empty `Vec` on unix (the executable bit is the entire answer) and parses `PATHEXT` on Windows, falling back to `.COM;.EXE;.BAT;.CMD` — Windows' own default — when the variable is unset. Honouring `PATHEXT` rather than hardcoding a list is how a machine gets to declare that `.ps1` or `.py` counts as a command.\n\n### `is_executable(p: &Path) -> bool`\n\nOn unix: `metadata(p)` must report a file with any of the `0o111` bits set. Off unix there is no permission bit to consult, so it degrades to `p.is_file()` rather than pretending to know more.\n\nThe executable check is the point of the whole function. Of the three copies of `which` this replaced, only one checked the bit — so a non-executable file named `curl` sitting on `PATH` read as \"curl is available\" to two callers, and the truth surfaced much later as an opaque spawn error.\n\n### Why the Windows suffix path matters downstream\n\nWithout the `PATHEXT` loop, `which` returns `None` for every command on a Windows machine, because `git` there is a file called `git.exe` and the bare join matches nothing. Everything downstream then dutifully reports the falsehood it was handed: `doctor` (`src/cmd/doctor.rs`) says no tool is installed, `Platform::detect` finds no scheduler, and worktree isolation degrades to a shared directory citing \"git not on PATH\" — on a machine where git is very much on PATH.\n\n---\n\n## The clock\n\n```rust\npub fn now_ms() -> u64\n```\n\nMilliseconds since the Unix epoch, and the only clock in the workspace. Timestamps are stored as plain numbers so the ledger sorts without a date parser. A clock that runs backwards yields `0` rather than panicking — a wrong ledger timestamp is a nuisance; a panic partway through an unattended run is not.\n\n---\n\n## The `platform` module\n\n`cfg!(target_os = …)` describes the machine the binary was *compiled for*. Three facts that change what loopsmith and its generated scripts may assume are not knowable that way:\n\n- **The bash on `PATH` may be from 2007.** macOS still ships 3.2.57 for licence reasons. Associative arrays, `${x,,}`, `mapfile`, and `&>>` all arrived in 4.0.\n- **`sed`, `stat`, `readlink` take different flags** by userland. `sed -i` requires an argument on BSD and must not have one on GNU.\n- **The scheduler is whatever is installed**, not what the OS is famous for. A container has neither `launchctl` nor `crontab`; a Mac has both.\n\nEverything here **probes and reports**. Nothing decides on the caller's behalf, and nothing is cached across processes — a probe costs one `--version` call and a run is not a hot loop.\n\n### `Os`\n\nA five-variant enum (`MacOs`, `Linux`, `FreeBsd`, `Windows`, `Other`) over `std::env::consts::OS`; the BSDs collapse into one variant. This one genuinely *is* a compile-time fact, wrapped here so callers have a single place to ask, sitting next to the facts that are not. `as_str()` gives the stable lowercase name used in reports; `is_windows()` answers \"does this host run `.cmd` batch files rather than `#!` scripts\".\n\n### `home_dir()`\n\nReads whichever variable this OS actually uses. On Windows: `HOME` first (Git Bash and MSYS set it, and it is the more specific answer when both exist), then `USERPROFILE`, then `HOMEDRIVE` + `HOMEPATH` concatenated as a last resort on bare `cmd.exe`. Everywhere else, `HOME`. Empty values are filtered out at every step rather than accepted as a home directory.\n\nCode that reads `HOME` directly loses the home directory on Windows entirely, and the failure surfaces far away as \"cannot locate LaunchAgents\" or as a loop cheerfully scaffolding itself into a relative path.\n\n### `Userland`\n\n`Gnu` / `Bsd` / `Unknown`, probed by running `sed --version`:\n\n| Probe result | Verdict |\n|---|---|\n| exit 0, output contains `gnu` or `busybox` | `Gnu` |\n| exit 0, output matches neither | `Unknown` |\n| ran but exited non-zero (BSD `sed` refuses `--version`) | `Bsd` |\n| could not spawn | `Unknown` |\n\nNever inferred from `Os`: Homebrew's `coreutils` puts GNU tools ahead of BSD ones on a Mac, and a stripped container may have busybox.\n\n`sed_in_place()` returns the argv fragment for an in-place edit — `[\"-i\"]` for GNU, `[\"-i\", \"\"]` for BSD. **`Unknown` deliberately takes the BSD spelling**: GNU rejects the empty suffix loudly, whereas BSD given the GNU spelling silently swallows the *next* argument as a backup suffix, which is how a script ends up editing a file called `-e`. When guessing, guess toward the louder failure.\n\n### `BashVersion`\n\n```rust\npub struct BashVersion { pub major: u32, pub minor: u32, pub raw: String }\n```\n\n`parse(first_line)` reads the first line of `bash --version` — a shape unchanged since 2.0, e.g. `GNU bash, version 3.2.57(1)-release (x86_64-apple-darwin24)`. It splits on `\"version \"`, takes the leading run of digits and dots, and parses major (required) and minor (defaulting to 0, so `version 5` parses as 5.0). Anything that is not a bash banner yields `None`. `raw` keeps the whole trimmed line for the `doctor` report.\n\n`MODERN_MAJOR = 4` and `is_modern()` encode the single line that matters: everything a generated script might want — associative arrays, `${x,,}`, `mapfile`, `&>>`, `**` — arrived in 4.0. Below that, the script must be written to POSIX `sh`.\n\nThe private `probe(command)` runs `<command> --version` and feeds line one to `parse`, returning `None` if the spawn fails.\n\n### `Platform`\n\nThe whole picture, gathered by one `Platform::detect()`:\n\n```mermaid\ngraph TD\n    D[\"Platform::detect\"] --> O[\"Os::detect\"]\n    D --> U[\"Userland::detect<br/>(sed --version[\"version)\"]\"]\n    D --> B[\"probe: bash\"]\n    D --> S[\"probe: /bin/sh\"]\n    D --> P[\"preferred_schedulers(os)\"]\n    P --> W[\"which — keep only<br/>what is installed\"]\n```\n\nFields:\n\n- `os`, `userland` — as above.\n- `bash: Option<BashVersion>` — `bash` on `PATH`, when there is one. A machine may have none.\n- `sh_bash: Option<BashVersion>` — `/bin/sh`, but only when it is a bash in POSIX mode. `None` on Debian, where it is `dash` — worth knowing, since dash rejects `[[`, `local -n`, and `echo -e` that a bash-as-sh would have accepted by accident.\n- `schedulers: Vec<&'static str>` — the candidate list for this OS, filtered by `which` down to what is actually installed, in preference order.\n\nMethods:\n\n- `scheduler()` — the first installed scheduler, or `None` when the machine has none.\n- `has_modern_bash()` — `false` when bash is missing entirely. A script that cannot be run is not a script that may assume anything.\n- `portability_note()` — one line explaining why a generated script sticks to POSIX `sh`, or `None` when nothing is holding it back. Distinguishes \"no bash on PATH\" from \"bash 3.2 predates 4.0\".\n\n### `preferred_schedulers(os)`\n\nThe **candidate** list, best first — not the answer. `Platform::detect` filters it through `which`.\n\n| OS | Candidates |\n|---|---|\n| macOS | `launchctl`, `crontab` |\n| Linux / BSD | `crontab`, `systemctl` |\n| Windows | `schtasks`, `crontab` |\n| Other | `crontab` |\n\nlaunchd leads on macOS because it survives a reboot without the user enabling anything else. Windows leads with `schtasks`, the only one of the four that ships with the OS — `crontab` still follows it, since a machine with Cygwin or WSL interop on `PATH` has a real cron, and the rule everywhere is \"prefer the native tool, still find the other one\". Getting this wrong is a fixed bug: Windows previously fell into the catch-all arm, was offered only `crontab`, and `schedule` reported \"no scheduler\" on a machine with a working Task Scheduler.\n\n---\n\n## `testing` (feature-gated)\n\n```rust\npub fn temp_path(tag: &str) -> PathBuf   // unique path — NOT created\npub fn temp_dir(tag: &str) -> PathBuf    // temp_path + create_dir_all\npub fn cleanup(p: &Path)                 // best-effort remove_dir_all\n```\n\nNames are `loopsmith-{tag}-{pid}-{now_ms}-{counter}` under `std::env::temp_dir()`.\n\nThe **`AtomicU64` counter is the load-bearing part.** This existed six times in four shapes across the workspace, and two of those shapes omitted it. Tests run in parallel threads within a single process, so pid and millisecond timestamp do not separate two directories created in the same millisecond — and when two tests share a directory, `sled` reports a lock error that reads like a backend bug rather than a test collision.\n\n`cleanup` swallows its error on purpose: a leaked temp directory must never fail a test.\n\nThis is the most widely-called item in the crate. Consumers include `loopsmith-gate`, `loopsmith-provider`, `loopsmith-mcp`, `loopsmith-memory`'s stores, and CLI test suites across `schedule.rs`, `logging.rs`, `permissions.rs`, `run/publish.rs`, `run/export.rs`, `web/detect.rs`, `web/exec.rs`, and `web/assemble.rs`.\n\n---\n\n## How the rest of the workspace uses this\n\nTwo representative flows:\n\n**`doctor` reporting the host.** `execute` (`src/cmd/doctor.rs`) calls `Platform::detect`, which fans out to `Userland::detect`, `BashVersion::probe` → `parse`, and the `which`-filtered scheduler list. `doctor` also calls `is_executable` directly from `config_notes` when checking user-configured command paths.\n\n**The web UI staging a job.** `start_job` (`src/web/api.rs`) → `write_scratch` (`src/web/assemble.rs`) → `temp_dir` → `temp_path`. Run publishing takes the same route through `repo` in `src/run/publish.rs`.\n\nThe pattern in both: `loopsmith-util` supplies the raw fact, and the caller decides what to do with it. `portability_note()` returns a sentence; it does not choose a shell. `preferred_schedulers` returns candidates; `Platform::detect` narrows them and `scheduler()` picks a head, but installing anything is the CLI's business.\n\n---\n\n## Contributing\n\n**The bar for adding something here is that it has already been written more than once elsewhere.** Every item currently in the crate meets that bar, and the doc comments record the specific bug each duplicate copy carried. A helper with a single caller belongs in that caller's crate.\n\n**Do not add a dependency.** Zero dependencies is a property of the whole workspace's build, and this is the crate that would break it.\n\n**Keep detection honest.** Probe, report, and let the caller decide. When a probe cannot answer, prefer the variant whose downstream failure is loud (`Userland::Unknown` taking the BSD `sed -i ''` spelling is the worked example) over the one that fails silently.\n\n**Tests must not mutate shared process state.** `std::env::set_var` races every other test thread that reads the environment — the same class of collision the temp-dir counter exists to prevent. The existing tests assert through `which`'s absolute-path branch and through `is_executable` directly instead of swapping `PATH`. Likewise, platform-specific claims are asserted under `#[cfg(unix)]` / `#[cfg(not(unix))]` with each platform's own rule: \"a plain file is not executable\" is a unix statement, and asserting it where there is no executable bit asserts unix semantics on a system that has none.","project-documentation":"# Project Documentation\n\n# Project Documentation\n\nThe prose layer of loopsmith: six top-level Markdown files plus the example corpus they point at. It is not incidental — several of these files are load-bearing artifacts that the build, the tests, and the CLI itself depend on. `LOOP-TEMPLATE.md` is a file users copy. `config/examples/*` is compiled into the binary. `loops-engineering-cheat-sheet.md` is the provenance record that justifies the architecture and is cited from `README-DETAIL.md`.\n\n## Why there are six documents and not one\n\nEach file is a complete description of the same system, pitched at a different reader, and the split is by **entry condition** rather than by topic. A reader who lands in the wrong one bounces; a reader who lands in the right one never needs the other five.\n\n| File | Reader | Entry condition | What it uniquely owns |\n|---|---|---|---|\n| `README.md` | Developer evaluating the tool | Found the repo, hasn't run anything | Install matrix, the five-minute path, the front-end tour (`--guided`, `--web`), portability table |\n| `README-FOR-DUMMIES.md` | Non-developer | Has a repeating job, does not write code | Markdown-config workflow (`loop.md`, not `loop.yaml`), the six sections worth editing, the \"delete every `type: script` block\" instruction |\n| `README-DETAIL.md` | Contributor / architect | Has run a loop, wants to know why it's shaped this way | Command table, crate layout, the verifier-independence ladder, the named tests |\n| `HOW-TO-USE.md` | Author writing a config | Editing `loop.yaml` and needs field semantics | Field-by-field A–J reference, detector portability, the permission preflight, the failure playbook |\n| `LOOP-TEMPLATE.md` | Author starting from blank | Wants a file to fill in | A copyable `SKILL.md` with frontmatter and inline rationale per section |\n| `loops-engineering-cheat-sheet.md` | Anyone questioning a design decision | \"Why is the gate Rust?\" | Per-source distillation of 20 sources, cross-cutting findings, `[unverified]` provenance markers |\n\n```mermaid\nflowchart TD\n    R[\"README.md<br/><i>developer entry<\/i>\"]\n    D[\"README-FOR-DUMMIES.md<br/><i>non-developer entry<\/i>\"]\n    H[\"HOW-TO-USE.md<br/><i>field reference<\/i>\"]\n    T[\"LOOP-TEMPLATE.md<br/><i>copyable authoring file<\/i>\"]\n    X[\"README-DETAIL.md<br/><i>architecture + rationale<\/i>\"]\n    C[\"loops-engineering-cheat-sheet.md<br/><i>provenance, 20 sources<\/i>\"]\n    E[\"config/examples/<br/><i>13 loops, .yaml + .md<\/i>\"]\n    R --> D\n    R --> X\n    R --> H\n    D --> E\n    H --> T\n    X --> C\n    X --> E\n```\n\nNote the asymmetry: `README-FOR-DUMMIES.md` links *out* to examples and back to `README.md`, but nothing in the developer chain routes into it except one signpost. That is intentional — it is a leaf, and it must stay self-sufficient.\n\n## The documentation-to-code coupling points\n\nFour places where editing docs without editing code (or vice versa) produces a broken build or a lying document.\n\n### `config/examples/` is compiled into the binary\n\nThe thirteen worked loops are not just documentation. `runtime/crates/loopsmith-cli` pulls them in with `include_str!`, which cannot reach above the package root, so `tools/sync-examples.sh` copies `config/examples/*.yaml` into `runtime/crates/loopsmith-cli/templates/examples/`. **A test fails if the two have drifted.** Editing an example is therefore a `cargo test`-visible change, not a prose change.\n\nEach example ships as a `.yaml` and an equivalent `.md`, and a round-trip test holds the two grammars honest against every shipped example. Adding an example means adding both halves.\n\nEvery example ships with `pre_execution` unfinished — `validate` refuses them by design. Any doc that shows an example being run must show the refusal first, or it teaches users to skip the one step the tool exists to enforce.\n\nThe count \"thirteen\" appears in `README.md`, `README-DETAIL.md`, `README-FOR-DUMMIES.md`, and `HOW-TO-USE.md`. Adding a fourteenth example is a four-file edit plus a table row in three of them.\n\n### `config/loop.schema.json` is the field authority\n\n`HOW-TO-USE.md §5` and `LOOP-TEMPLATE.md` both enumerate fields. Neither is generated — both are hand-maintained mirrors of the schema plus the cross-field rules the schema cannot express (every goal having a blocking validation, targets resolving, `execution_guidelines` cycles, `no_progress_iterations_randomness < no_progress_iterations`). Those cross-field rules live only in `loopsmith_core::validate` and in prose; there is no third place that records them.\n\n### The guided wizard's field list has three mirrors\n\n`README-DETAIL.md` states the rule explicitly: `guided/mod.rs::stages()` is the source of the terminal wizard's order, `guided/sections.rs` holds the labels, defaults, validators and gates, and `web/src/guided/spec.ts` is a declarative mirror the browser walks. The documentation asserts there is deliberately no second field list with its own opinions. **A field added to one is a field the other is expected to grow** — and the docs claiming that parity are the only place the expectation is written down.\n\n### Skills are documented and shipped\n\n`skills/loopsmith/` (user-invoked, `disable-model-invocation: true`) and `skills/loopsmith-reference/` (model-invoked) are described in `HOW-TO-USE.md §2` and §3. The conventions in §3 — the 1,536-character cap on `description` plus `when_to_use`, keeping the body under 500 lines, putting all \"when to use\" information in the description because the body isn't loaded until after the load decision — apply to those two shipped skills *and* to any skill the loop generates into `generated-skills/`. §3 is a spec, not commentary.\n\n## Invariants restated across files\n\nSome claims appear in four or five documents. They are the load-bearing facts, and they must move together or the corpus starts contradicting itself.\n\n| Invariant | Appears in |\n|---|---|\n| A model must not certify its own completion; `goal_satisfied` is written by `loopsmith-gate` and nothing else | all except the template |\n| The gate can **revoke** — delete an artifact and a satisfied goal flips back | `README.md`, `README-DETAIL.md`, `HOW-TO-USE.md`, cheat sheet |\n| `validate` fails on purpose until every `pre_execution` step is `done: true` | `README.md`, `README-DETAIL.md`, `README-FOR-DUMMIES.md`, `HOW-TO-USE.md`, `LOOP-TEMPLATE.md` |\n| A `judge` verdict from the builder's own provider is **refused**, not discounted | `README-DETAIL.md`, `HOW-TO-USE.md`, `LOOP-TEMPLATE.md` |\n| Every goal needs at least one blocking validation or the config is rejected | `README-DETAIL.md`, `HOW-TO-USE.md`, `LOOP-TEMPLATE.md` |\n| Cron is evaluated in **UTC**; prefer `interval` for plain cadence | `README.md`, `README-DETAIL.md`, `HOW-TO-USE.md`, `LOOP-TEMPLATE.md` |\n| `requires_env` names keys; values are never read, substituted, or logged | `README.md`, `README-DETAIL.md`, `HOW-TO-USE.md`, `LOOP-TEMPLATE.md` |\n| Pull an `ollama` model first; the starter provider sits at `timeout_seconds: 120` | `README.md`, `README-DETAIL.md`, `HOW-TO-USE.md`, `LOOP-TEMPLATE.md` |\n| `--path` is mandatory for `new` | `README.md`, `README-DETAIL.md`, `HOW-TO-USE.md`, `LOOP-TEMPLATE.md` |\n| The loop proposes goals/validations/success/skills; it never applies them | `README-DETAIL.md`, `HOW-TO-USE.md`, `LOOP-TEMPLATE.md`, `README-FOR-DUMMIES.md` |\n\nThe MCP invariant is a special case: `README-DETAIL.md` notes the server exposes plan, ledger, gate verdict, and scratchpad, and has **no tool for marking a goal satisfied** — and that a test (`there_is_no_tool_for_declaring_a_goal_satisfied`) asserts the absence. That's the pattern to imitate. Where a documented guarantee has a named test, cite the test; the citation is what stops the guarantee from being removed quietly.\n\n## Conventions\n\n**Every Mermaid diagram carries a plain-text fallback.** `README-DETAIL.md` pairs each `mermaid` block with an ASCII box-drawing equivalent, explicitly \"for a terminal with no image or mermaid support.\" `README-FOR-DUMMIES.md` leads with the ASCII picture and offers the Mermaid version second. Diagrams also come in a third form — a PNG in `assets/` (`architecture.png`, `guided-flow.png`, `web-guided-flow.png`) inside a `<div align=\"center\">`. New diagrams are expected to ship at least the Mermaid + ASCII pair.\n\n**Tables over prose for anything enumerable.** Detector types, stop gates, platform differences, failure modes, \"does on its own / only proposes\" — all tables. The detector table specifically is always ordered **strongest first** (`script` → `file_exists` → `regex_match` → `threshold` → `judge`), in every file where it appears, because the ordering *is* the advice.\n\n**Claims are shown, not asserted.** Where a document states a behaviour it prefers to paste the actual terminal output — the `pre_execution` refusal, `judgment refused: judge and builder both ran on 'claude'`, the `loopsmith providers` availability listing, the `plan` wave output with its Amdahl arithmetic, `skills scores`. These are transcript excerpts and go stale if output formats change.\n\n**Rationale is inline, under a stable heading.** `LOOP-TEMPLATE.md` uses a literal `*Why it exists:*` line under every A–H section. `HOW-TO-USE.md` uses tables titled by consequence (\"Why\" columns). Neither hides the reasoning in a separate rationale document — the cheat sheet is for *provenance*, not for *why this field exists*.\n\n**Uncertainty is marked.** The cheat sheet flags eighteen of twenty sources as self-published and tags every figure that drives a design decision `[unverified]` or `[unverified, secondhand]`. It names the one authoritative source (the official Claude Code skills documentation). Preserve those markers; they are the reason the design section can be trusted at all.\n\n## `LOOP-TEMPLATE.md` is executable-ish, not just prose\n\nIt opens with YAML frontmatter (`name`, `description`, `argument-hint`, `arguments`, `allowed-tools`, `disable-model-invocation`) because it is meant to be copied to `<your-loop>/SKILL.md`. Its `REPLACE ME` markers are the fill-in slots. The body deliberately stays thin — the file itself explains why:\n\n> the config is data the runtime validates, and data in a config file can be checked, diffed, and scheduled. Prose in a skill body cannot.\n\nConsequence for maintainers: content added to `LOOP-TEMPLATE.md` should be a config example plus one line of rationale, never a paragraph of guidance. Guidance belongs in `HOW-TO-USE.md`, which the template points to. The closing \"Checklist before first run\" is the one place in the corpus that collapses every invariant into a pre-flight list; it is worth updating whenever a new invariant lands.\n\n## `loops-engineering-cheat-sheet.md` and the provenance chain\n\nStructurally different from everything else: it is a distillation of `planning/docs/loops-engineering/` (33 files, 20 unique sources) with a **traceability table** mapping each source's load-bearing idea to the component that implements it. Section 3 (*What loopsmith Takes From This*) is the explicit corpus-idea → component → enforcement mapping.\n\nThis is what `README-DETAIL.md`'s *Why the gate is Rust* section defers to. The four-rung ladder — separate prompt, separate context, separate model family, separate mechanism — originates here (§2.2), and `loopsmith-gate` sitting at rung 4 is the sentence the whole architecture hangs on. The cheat sheet also records what was **rejected** and why, which is the part that stops a rejected idea from being re-proposed a year later.\n\nAmdahl's table (§2.4) is duplicated as a doc claim *and* as the test `amdahl_matches_the_published_table`. That is the tightest doc-to-code binding in the repo: the published table is the oracle.\n\n## Contributing to the docs\n\n### When you add a config field\n\n1. `config/loop.schema.json` — the field itself.\n2. `HOW-TO-USE.md §5` — semantics, defaults, and any cross-field rule the schema can't express.\n3. `LOOP-TEMPLATE.md` — only if it belongs in a starter config; add the YAML plus one `*Why it exists:*` line.\n4. `guided/sections.rs` and `web/src/guided/spec.ts` — if the wizard should ask for it.\n5. `README-DETAIL.md` §*The A–J model* — only if it's a new section, not a new field.\n\n### When you add a CLI command\n\n`README-DETAIL.md`'s command table is the canonical list. `README.md`'s *While it runs* table and `README-FOR-DUMMIES.md`'s equivalent table carry only the subset a running loop needs. `HOW-TO-USE.md` documents commands where they're relevant to a workflow section, not in a table of their own.\n\n### When you add an example loop\n\nBoth `.yaml` and `.md`, run `tools/sync-examples.sh`, then update the count and the annotated row in `README.md`, `README-DETAIL.md` (*The examples*), and `README-FOR-DUMMIES.md` (*What people use it for*). Leave `pre_execution` unfinished. `cargo test` catches a missed sync; nothing catches a missed count.\n\n### When you change a default or a message\n\nGrep for the pasted terminal output. The refusal text, the `providers` listing, the `plan` block, and the spend line all appear verbatim in more than one file.\n\n## Known drift\n\nWorth fixing on the next pass, and worth knowing about before you cite these files:\n\n- **The A–H / A–J mismatch.** The model has ten sections. `HOW-TO-USE.md §1` still labels the core crate \"A–H config model and validation\", §4 calls the scaffolded file \"the A–H config\", and `LOOP-TEMPLATE.md`'s main heading is \"The A–H model\" despite the corpus documenting `I · execution_guidelines` and `J · default_skills` elsewhere. `README.md` and `README-DETAIL.md` say A–J. The template's checklist and the `HOW-TO-USE` architecture block are the stale ones.\n- **Duplicate `## Architecture` heading in `README-DETAIL.md`.** Two sections share the name, so the `#architecture` anchor in the nav header resolves to the first (the ASCII plane diagram) and the second (the three-front-ends / one-`LoopConfig` explanation) is unreachable by link.\n- **`skills` appears in two lists.** `README-DETAIL.md`'s architecture block lists six crates under the control plane and omits `skills`; `HOW-TO-USE.md §1` lists seven and includes it. The repository-layout tree in `README-DETAIL.md` lists all eight published crates.\n- **Hardcoded counts.** The `tests-415 passing` badge appears in two files and the \"415 tests, no warnings\" line in a third. Nothing verifies them.\n- **`config/marketplaces.json` vs `runtime/crates/loopsmith-cli/templates/marketplaces.json`.** The repository-layout tree names the former; the trust-floor prose in both `README-DETAIL.md` and `HOW-TO-USE.md §8` points at the latter. Only one is the file the binary reads.","provider-integration":"# Provider Integration\n\n# Provider Integration (`loopsmith-provider`)\n\nThe provider plane turns \"call a model\" into \"run a program.\" Every provider — Claude Code, Ollama, a Grok CLI, an OpenAI-compatible endpoint driven by `curl`, an MCP server over stdio — is described by the same struct: a command, some argument templates, and a few knobs. There is no per-vendor Rust code, no HTTP client, and no SDK. Adding a provider is a config edit.\n\nThat single decision is what makes BYOK free, and it is the reason this crate is small (one `lib.rs`) relative to its surface area.\n\n## The two invariants\n\nEverything else in the crate is mechanism. These two are the contract:\n\n**1. A tier resolves through a cascade, not to a single provider.** Nodes ask for `Tier::Cheap`, `Tier::Standard`, or `Tier::Strong`. `dispatch` walks the ordered list configured for that tier and serves the call from the first provider that is both *available* (binary on `PATH`, required env present) and *succeeds*. Everything skipped is recorded and handed back to the caller so the ledger can say why.\n\n**2. Secrets never enter this process.** `ProviderSpec::requires_env` names environment variables. `availability` checks them with `std::env::var_os(k).is_none()` — it reads presence, never value. Nothing is substituted into an argument, logged, or written to the ledger. The `openai` starter spec passes the literal string `Authorization: Bearer $OPENAI_API_KEY` to `curl` and lets `curl` expand it. There is a test (`a_provider_with_missing_env_is_unavailable_and_names_only_the_key`) that asserts the failure message contains the key *name* and no `=`, precisely because that is the property worth regression-testing.\n\n## Types\n\n| Type | Role |\n|---|---|\n| `InvokeRequest` | What to ask: `node_id`, `system`, `prompt`, `tier`, `workdir`. `node_id` is for logging and digests only. |\n| `InvokeResponse` | What came back: `provider_id`, `output`, `exit_code`, `duration_ms`, `stderr_tail`, plus accounting (`tokens`, `tokens_estimated`, `cost_usd`). Serializable — it goes into the ledger. |\n| `Availability` | `on_path: bool` + `missing_env: Vec<String>`. `ok()` is the gate, `why_not()` renders the human-readable reason that lands in the skip list. |\n| `ProviderError` | `NoneAvailable` (cascade exhausted, with everything tried), `Spawn`, `Timeout`, `Failed` (non-zero exit + last stderr line). |\n\n`ProviderSpec`, `ProviderKind`, `Tier`, and `LoopConfig` all live in `loopsmith-core` — this crate consumes the config model, it does not define it.\n\n## How a call flows\n\n```mermaid\nflowchart TD\n    A[dispatch: tier or pinned id] --> B{candidates}\n    B -->|pinned| C[cfg.provider id]\n    B -->|tier| D[cfg.cascade_for tier]\n    C --> E[availability]\n    D --> E\n    E -->|not ok| F[push skip reason, next]\n    E -->|ok| G[invoke]\n    G -->|Err| F\n    G -->|Ok| H[InvokeResponse + skipped list]\n    F --> E\n    F -->|exhausted| I[ProviderError::NoneAvailable]\n```\n\n`dispatch(cfg, req, pinned)` is the entry point almost every caller uses. Passing `Some(id)` for `pinned` collapses the candidate list to that one provider — but it does *not* skip the availability check, so pinning an unavailable provider yields `NoneAvailable` with a one-entry `tried` list rather than a spawn error.\n\n## Inside `invoke`\n\n`invoke` is the only place that touches a process. It does four things in order.\n\n**Template rendering.** `render` substitutes `{prompt}`, `{system}`, `{model}`, `{tier}`, and `{node}` into each argument. It is a plain string replace over a `BTreeMap`, so unknown placeholders pass through untouched (`{unknown}` stays `{unknown}`) — a deliberate property, tested, so that a provider whose CLI uses brace syntax of its own isn't corrupted. Note that rendering applies to `spec.args` only, never to `spec.command`.\n\n**Spawn.** `stdin` is `piped` when `prompt_on_stdin` is set and `null` otherwise; stdout and stderr are always piped. When piping, only `req.prompt` is written — `system` reaches the provider solely through a `{system}` placeholder in the args, so a spec that pipes the prompt and never mentions `{system}` silently drops the system message. That is worth checking when a new spec produces oddly context-free output.\n\n**Timeout by polling.** `std::process` has no timeout, so the loop calls `try_wait` every 50 ms and compares `started.elapsed()` against `spec.timeout_seconds`. On expiry: `kill`, `wait`, `ProviderError::Timeout`. An async runtime would be tidier and is a heavy dependency for one feature, hence the poll. One consequence of the ordering: the stdin write happens before the poll loop begins, so a provider that never drains stdin can block on a very large prompt before the timer is ever consulted.\n\n**Accounting.** Non-zero exit is always an error, never a silent pass. On success, `parse_usage` runs the spec's `usage_regex` against stdout, then stderr (providers report usage in wildly different places), preferring capture group 1 and falling back to the whole match, and stripping `,` and `_` before parsing. If nothing usable comes back — no regex, a malformed regex, or no match — `estimate_tokens` counts characters in prompt + stdout and divides by four, and `tokens_estimated` is set to `true`. Cost is `tokens / 1000.0 * cost_per_1k_tokens`, and is `None` when no rate is configured rather than a guessed number.\n\nThe estimate deserves its rationale, which the source states plainly: an approximate ceiling that fires beats an exact one that never does, which is what an unaccounted budget gate amounts to. The `tokens_estimated` flag exists so a budget report can be honest about which kind of number it is showing.\n\n## Helpers worth knowing\n\n- **`digest(s)`** — FNV-1a 64-bit, formatted as 16 hex chars. Not cryptographic. Its only job is to let the ledger say \"same prompt as before\" without storing the prompt twice. `run_node` in `src/run/dispatch.rs` calls it.\n- **`which`** — re-exported from `loopsmith-util`. The path is kept here for existing callers; the implementation moved out once it turned out to have been written three times across the workspace, in three states of correctness.\n- **`starter_providers()`** — the day-one cascade emitted by `loopsmith init` (via `starter_config` in `loopsmith-cli/src/scaffold.rs`): `claude` (standard + strong), `ollama` (cheap), `grok` (standard), `openai` (strong, the only one with a real `usage_regex` and cost rate), `gemini` (standard). Unavailable ones are skipped, never fatal — that is the whole point of the cascade. `starter_providers_cover_every_tier` guards the invariant that no tier is left with an empty list.\n\nThe `ollama` entry carries a 120-second timeout rather than the 600 its siblings use. `ollama run <model>` pulls the model when it is absent, and from outside the process a 4.7 GB pull is indistinguishable from slow generation — one observed run spent its entire 600-second budget downloading and produced nothing. A cheap tier exists to be abandoned quickly, so the timeout is tuned to fall through to the next provider rather than to accommodate a download. Pull first with `ollama pull llama3`.\n\n## Where it connects\n\nUpstream, this crate reads `LoopConfig` from `loopsmith-core` — specifically `cfg.provider(id)` and `cfg.cascade_for(tier)` in `src/config/mod.rs` — and `which`/`temp_dir` from `loopsmith-util`. It depends on nothing else in the workspace and knows nothing about the gate, the graph, or memory.\n\nDownstream, three callers build an `InvokeRequest` and hand it to `dispatch`:\n\n- `run_node` (`src/run/dispatch.rs`) — the main path. Also calls `digest` for prompt provenance.\n- `ask_agent` (`src/run/perturb.rs`) — perturbation probes.\n- `add_narrative` (`src/run/summary.rs`) — run summaries.\n\nA fourth caller, `execute` in `src/cmd/providers.rs`, uses `availability` on its own to render the `loopsmith providers` doctor output without invoking anything.\n\nThe judge-independence rule — a judge must not run on the same provider as the builder whose work it is checking — is enforced by the caller choosing the `pinned` argument, not by this crate. `dispatch` has no notion of who is judging whom. Likewise, `goal_satisfied` is written by `loopsmith-gate` and by nothing else; no provider response reaching this crate can set it.\n\n## Contributing\n\nThe test module at the bottom of `lib.rs` is the fastest way to understand the crate, and it is deliberately built out of POSIX utilities rather than mocks: `echo` for a working provider, `false` for one that fails, `cat` for stdin mode, `sleep 30` with a 1-second timeout for the kill path, and `definitely-not-a-real-binary-xyz` for the missing-binary path. Real processes, real exit codes.\n\nTwo conventions to preserve when adding tests:\n\n- **Avoid double quotes in argument payloads.** `a_usage_regex_extracts_the_real_count` uses `total_tokens=1234` rather than JSON precisely because embedding quotes in an argument makes the test depend on platform escaping, which Windows does differently — it failed there for a reason unrelated to usage.\n- **Assert the fallback, not just the happy path.** `a_malformed_usage_regex_falls_back_to_estimating` exists because `parse_usage` swallows a bad regex with `.ok()?`; the visible consequence is `tokens_estimated == true`, and that is what should be pinned down.\n\nThe crate's `Cargo.toml` ships `/src/**/*` and `README.md` only. Integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping them would hand a published crate tests that cannot pass.\n\nAdding a provider *kind* means adding a `ProviderKind` variant in `loopsmith-core`; adding a provider *instance* means editing config and nothing else. If you find yourself writing vendor-specific logic in `invoke`, the design has been violated somewhere upstream.","scheduling-triggers":"# Scheduling & Triggers\n\n# Scheduling & Triggers\n\nThe scheduling module answers one question repeatedly: *should this loop run right now?* Without it, the `schedules` block of a loop config parses and validates and then nothing ever fires. Two files split the work:\n\n| File | Responsibility |\n|------|----------------|\n| `runtime/crates/loopsmith-cli/src/schedule.rs` | Trigger evaluation (cron parsing, mtime scanning, edge detection) and generation of OS scheduler artifacts |\n| `runtime/crates/loopsmith-cli/src/cmd/schedule.rs` | The `loopsmith schedule` command — picks the right scheduler for *this* machine and prints or installs the artifact |\n\nThe consumer of the evaluation half is `loopsmith watch` (`src/cmd/watch.rs`), which constructs a `Watcher`, sizes its sleep with `poll_interval`, and calls `poll` in a loop.\n\n## The two halves\n\n```mermaid\ngraph TD\n    W[\"loopsmith watch\"] --> Watcher\n    Watcher -->|\"poll()\"| Fired[\"Vec&lt;Fired&gt;\"]\n    Fired --> Run[\"run the loop\"]\n    S[\"loopsmith schedule\"] --> Detect[\"Platform::detect()\"]\n    Detect --> launchd_plist\n    Detect --> schtasks_command\n    Detect --> crontab_line\n    launchd_plist --> W\n    schtasks_command --> W\n    crontab_line --> Run\n```\n\nNote the asymmetry at the bottom: launchd and Task Scheduler are handed `watch` — one long-lived process that evaluates triggers itself — while a crontab line is handed `run`, a single iteration, because cron is itself the trigger evaluator in that arrangement. That distinction shows up again in `crontab()`, which falls back to `@reboot` when the config has no cron trigger for cron to act on.\n\n## Time is UTC, deliberately\n\n`CronExpr::matches` is evaluated against UTC, and the module says so in its own header. Deriving a local offset in a multithreaded Unix process is unsound without care, and a scheduler that is quietly an
