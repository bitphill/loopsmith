--|---|\n| `harness/mod.rs` | The fixture builder — no tests of its own |\n| `stress.rs` | The iteration loop: phases, isolation, stop gates, proposals, resume, export |\n| `surface.rs` | Subcommands that were implemented and never executed |\n| `compat.rs` | What a generated loop assumes about the machine it lands on |\n| `opt_in.rs` | Anything that reaches the network or spends money |\n\nEach binary declares `mod harness;` and shares the same builder. `README.md` in this directory is the human-facing index — a feature × example matrix of what has actually been executed, plus the traps that used to be prose and are now assertions.\n\n---\n\n## Why a fixture exists at all\n\nThe shipped examples cannot be run as they stand, and both reasons are deliberate rather than accidental:\n\n1. **Every example refuses.** `pre_execution` steps ship as `done: false`, so `validate` and `run` both stop. That is the teaching mechanism.\n2. **No detector scripts exist.** The examples name 29 distinct `scripts/…` detectors between them and the repository ships none. A missing script becomes a detector error, which the gate converts to a failed check — correct behaviour, and useless for exercising anything past the first gate.\n\n`Fixture` rewrites a **copy** in a scratch directory. Nothing under `config/examples/` is ever touched.\n\n---\n\n## `Fixture` — the builder\n\n```rust\npub struct Fixture {\n    pub dir: PathBuf,     // scratch directory, named from the tag\n    pub config: PathBuf,  // dir/loop.yaml\n    pub cfg: LoopConfig,  // the rewritten config, in memory\n}\n```\n\nTwo constructors, both taking a `tag`:\n\n- `Fixture::example(name, tag)` — reads `config/examples/<name>.yaml`\n- `Fixture::from_yaml(text, tag)` — config text directly, for shapes no example has\n\nBoth funnel through `from_yaml`, which parses with `loopsmith_core::parse_str`, applies `unblock` (marks every `pre_execution` step done) and `deterministic_providers`, then writes `loop.yaml`.\n\nEverything after construction is opt-in and chainable, taking `self` by value:\n\n```rust\nlet f = Fixture::example(\"research-loop\", \"export\")\n    .stub_scripts(Stubs::Pass)\n    .satisfy_files()\n    .satisfy_metrics();\n```\n\n```mermaid\ngraph TD\n    A[\"example / from_yaml\"] --> B[\"unblock<br/>deterministic_providers\"]\n    B --> C[\"write_config\"]\n    C --> D[\"stub_scripts<br/>satisfy_files / satisfy_metrics<br/>git_init\"]\n    D --> E[\"run_loop / run\"]\n    E --> F[\"store() · log_text() · export_dir()\"]\n```\n\n### Mutating the config\n\n`cfg` is public and mutated directly for anything the builder does not cover — stop gates, extra providers, a starved detector. **Nothing notices the change until `write_config()` re-serialises it.** `stress.rs` has two helpers for the common cases:\n\n- `cap(&mut cfg, iterations)` — bounds `max_iterations` and switches off both no-progress gates, so a scenario cannot sit in a long example's default ceiling of ten iterations\n- `starve(&mut cfg, target)` — repoints every validation on a target at `Detector::Script { command: \"false\", .. }`, so a run keeps iterating instead of succeeding on its first pass\n\nThe two combine: `phases_open_one_at_a_time_across_a_real_run` caps at six iterations and starves `overall`, so each goal can be satisfied while the run itself never finishes and the phases keep opening.\n\n### Providers\n\n`deterministic_providers` replaces every provider with `printf \"%s\" <payload>`, where the payload is a judge block covering every `Detector::Judge` in the config. Three properties are load-bearing:\n\n- **Provider ids are preserved.** `enforce_judge_independence` compares them; rewriting the ids would quietly switch the check off.\n- **`SCORE: 10` and an `EVIDENCE:` line are mandatory.** A judge PASS with no evidence is demoted to FAIL by the parser, which would make every subjective validation permanently unsatisfiable.\n- **Every provider emits the block**, not only the ones a judge sits on. Judge output is harvested only from nodes whose role is `Role::Judge`, so a builder emitting the same text is inert — and this avoids re-deriving the cascade to work out where a judge would land.\n\nTo make one provider disagree, `set_provider_output(&mut cfg, id, payload)` repoints a single id; `failing_judge_payload(&cfg)` builds the refusing counterpart. `judge_provider_ids(&cfg)` resolves which ids judges actually sit on, following `cfg.cascade_for(tier)` when a node named none.\n\nA scenario that needs a provider to *do* something rather than say something overwrites `cfg.providers.providers[n].command` and `.args` after construction — see `ISOLATED_WRITER` and `ISOLATED_CHAIN` in `stress.rs`, where the \"providers\" are `sh -c` invocations that write files.\n\n### Detector stubs\n\n`stub_scripts(mode)` generates an executable stub for every path in `script_detectors()` (every `Detector::Script` whose command contains a `/`).\n\n```rust\npub enum Stubs { Pass, Fail, PassFrom(u32) }\n```\n\n`PassFrom(n)` fails until iteration `n`, implemented with a `.stub-count` file in the loop root rather than an environment variable — the loop cannot change its own environment between iterations, and the gate re-runs every detector each pass.\n\nA detector runs with **no shell**: `command` is argv[0] and `args` are literal. On unix a stub is therefore a `#!/bin/sh` file with mode `0o755`. Windows has no shebang handling, so `stub_scripts` writes a CRLF `.cmd` instead *and repoints the config's detector commands at it*. That rewrite is honest — it is exactly what a user has to do there — and it keeps the iteration loop covered on Windows rather than `#[cfg]`-ing the tests away.\n\n### Artifacts and metrics\n\n`satisfy_files()` creates every path a `Detector::FileExists` names, with a body that is not arbitrary:\n\n```\nwritten by the stress harness\nsource: https://example.invalid/reference\npost_id: 1\n```\n\nThose same files are what `Detector::RegexMatch` detectors read — evidence collection registers them under their stem — so the body carries a URL and a `post_id:` line, the tokens the shipped examples look for. Without them the file exists, `file_exists` passes, and the regex on the same file fails. `write_artifacts(body)` takes a specific body when a scenario needs one; `a_regex_detector_reads_the_file_the_loop_produced` uses both directions.\n\n`satisfy_metrics()` writes a `metrics.json` satisfying every `Detector::Threshold`, via `satisfying_value(op, want)` over `CompareOp`. `metrics(&[(name, value)])` writes specific values when a threshold should fail on purpose.\n\n### Git\n\n`git_init()` initialises the loop directory as a repository, configures a fixture identity, writes a `.gitignore` covering `state/` and `logs/`, and commits — a repository with no commit has no `HEAD`, and `git worktree add` refuses to branch from nothing.\n\nThis matters in both directions. Outside a repository, `isolated: true` degrades to the shared directory *silently, by design*, and a scratch loop is not a repository unless someone makes it one. `isolation_degrades_to_shared_outside_a_repository` and `isolation_is_real_inside_a_repository` run the same example on either side of that line.\n\n### Running and reading back\n\n| Method | Does |\n|---|---|\n| `run(&[\"subcommand\", …])` | The binary at `LOOPSMITH`, cwd `dir` |\n| `run_with_env(args, env)` | Same, with environment overrides |\n| `run_loop(run_id, env)` | `run loop.yaml --run-id <id> --no-acquire` |\n| `store()` | Opens the sled ledger via `loopsmith_memory::open(dir/state)` |\n| `log_text(run_id)` | `logs/<run-id>.log` |\n| `export_dir()` | `<cfg.name>-success/` |\n| `cleanup()` | Removes the scratch directory |\n\n`LOOPSMITH` is `env!(\"CARGO_BIN_EXE_loopsmith\")` — Cargo builds the binary for this integration test and hands over the path, so there is no `cargo run` here and no chance of driving a stale build.\n\n---\n\n## Assertions read artifacts, not stdout\n\nStdout is a report. The record is the sled ledger, `logs/<run-id>.log`, `store.summaries()`, the checkpoint, and the presence or absence of `<name>-success/`.\n\nOne assertion recurs and is worth keeping:\n\n```rust\nassert_eq!(log.lines().count(), ledger.len());\n```\n\nThe run log and the ledger are written through a single call, so they must always hold the same number of events. A divergence means one of the two write paths grew a branch the other did not.\n\nThe two broadest tests — `every_example_completes_an_iteration_and_leaves_a_consistent_record` and `every_example_survives_a_run_where_nothing_passes` — sweep `all_examples()` and are the cheapest signal that a config change broke the runtime rather than the schema.\n\n---\n\n## What each binary is for\n\n### `stress.rs` — the iteration loop\n\nPhases (`traffic-loop`'s four strictly linear stages, asserted against verdicts the gate actually produced rather than the synthetic ones `phases.rs` unit-tests), worktree isolation, stop gates, resume, export, proposals, summaries, skill trials.\n\nSeveral tests exist because the behaviour they pin was once wrong in a way nothing failed on:\n\n- `an_isolated_builders_output_reaches_the_gate` — isolated nodes run in `state/worktrees/<node>/` and evidence is collected from the loop root, so before publishing existed a `file_exists` detector on an isolated builder's output could never pass.\n- `an_isolated_node_can_read_what_its_isolated_upstream_produced` — a worktree branches from `HEAD`, so the second node starts blind to its upstream. Publishing fixed the gate's view, not the next node's.\n- `a_resume_does_not_hand_a_stuck_node_its_revision_budget_back` and `a_resume_does_not_reset_the_no_progress_counter` — everything the stop gates count used to be declared inside the iteration loop, so a run that resumed on a schedule could never reach the ceilings meant to stop it.\n\nThe proposal tests all assert the same boundary: the loop proposes, a human applies. `a_node_that_exhausts_its_revisions_asks_for_the_graph_to_be_reshaped` checks the config on disk is untouched; `unexplored_candidates_are_proposed_rather_than_spent_on_unasked` checks nothing dispatched the candidate. `a_summary_provider_adds_prose_that_cannot_decide_anything` points a summariser at a payload claiming everything is complete and asserts the gate still says otherwise.\n\nThe shared config constants are worth knowing: `NEVER_SATISFIED` (one node, one goal, wired to fail) is the base for the resume, proposal, perturbation and skill-trial scenarios.\n\n### `surface.rs` — subcommands\n\n`new --config-stdin` (YAML and `--markdown`), `convert --to-yaml`, `skills install`, `watch --check` and `watch` as a resident process, `schedule` with and without `--install`, the reporting commands, `prune`. Each is cheap, needs no provider, and touches only a scratch directory.\n\n`a_config_survives_the_trip_out_to_markdown_and_back` compares *parsed models*, not text, via a local `trimmed()` that strips trailing whitespace from every scalar — a YAML block scalar ends with a newline and Markdown has no way to say so, which is a documented property of the grammar rather than a conversion bug.\n\n`schedule --install` writes into a redirected directory (`LOOPSMITH_LAUNCH_AGENTS_DIR`) rather than `~/Library/LaunchAgents`. Actually loading the agent stays the user's call, so no test runs `launchctl load -w`; the same reasoning applies to `schtasks /Create`, which `schedule` prints rather than runs.\n\n### `compat.rs` — portability\n\nA loop directory outlives the checkout that produced it. Three differences break it every time, and all three are invisible on the machine that wrote it: **bash 3.2** (macOS still ships it), **BSD versus GNU `sed`/`stat`/`readlink`**, and **whichever scheduler is installed**, which is not implied by the OS.\n\nThese tests *run* the generated scripts. `new_loop(tag)` scaffolds into a scratch directory — `loopsmith new` refuses a path inside the loopsmith checkout, which is why this is never done in-tree.\n\nThe `.cmd` assertions carry the most hard-won detail. `the_generated_cmd_launchers_are_crlf_and_shaped_for_cmd_exe` requires CRLF throughout, `setlocal enabledelayedexpansion`, `cd /d \"%~dp0\"`, a `where loopsmith` fallback, and **exactly one** `exit /b`, spelled `endlocal & exit /b %CODE%`. Windows CI walked into both traps behind that: `setlocal`'s implicit `endlocal` restores the errorlevel, so an early `exit /b 127` reported success; and writing `endlocal & exit /b 127` fixes that on a top-level line but not inside a nested `if ( … )` block, which is where the broken one was. A single exit point needs no reasoning about block parsing.\n\nTwo helpers make one test meaningful on both platforms rather than gating it out. `launcher(dir, stem)` returns a runnable `Command` for `.sh` or `cmd /c *.cmd`; `with_system_path(dir)` builds a minimal `PATH` that still contains `System32` on Windows, because `where.exe` lives there and a bare `PATH` would stop measuring the fallback and start measuring whether `where` exists.\n\n`strip_comments` scans code rather than prose: these files document the very constructs they must not use, so a bashism check that reads comments flags its own explanation. It handles `#` and, case-insensitively, `rem ` for the `.cmd` dialect.\n\n`need_bash_exits_two_so_a_missing_tool_is_not_read_as_a_failed_check` pins the exit-code distinction the whole gate depends on — \"this machine cannot run the check\" is a different fact from \"the check failed\", and a gate that cannot tell them apart reports missing tooling as unfinished work.\n\nThe `doctor` tests close the loop: it must name the platform facts (`os`, `userland`, `bash`, `scheduler`, `git`, plus the in-place `sed -i` spelling), stay advisory so a non-zero exit never fails a working CI step, and when pointed at a config name detectors this machine cannot run.\n\n`doctor_reports_a_detector_that_is_not_executable` is `#[cfg(unix)]` for a substantive reason, not just `PermissionsExt`: there is no executable bit to clear off unix, so `loopsmith_util::is_executable` degrades to a file check and `doctor` is *right* to report nothing. Gating the whole test says that; a `#[cfg]` around only the chmod would leave a test asserting the wrong thing on Windows.\n\n### `opt_in.rs` — network and money\n\nEvery test here returns without asserting unless its variable is set, via the local `gated!` macro:\n\n```sh\nLOOPSMITH_STRESS_NETWORK=1  cargo test -p loopsmith --test opt_in\nLOOPSMITH_STRESS_PROVIDER=1 cargo test -p loopsmith --test opt_in -- --nocapture\n```\n\nSo `cargo test --workspace` never clones a repository, never calls a model, and never costs anything. `LOOPSMITH_STRESS_PROVIDER` invokes whatever model the example names — point it at the cheapest one you have; the aim is to prove the plumbing reaches a real provider, not to get a good answer. `the_simplest_example_runs_against_a_real_provider` reads `research-loop.yaml` directly rather than through `Fixture::example`, precisely because the fixture would swap the providers out.\n\nTwo things here are deliberately *not* gated. `an_unsafe_repo_url_is_refused_before_git_is_reached` needs no network and is the half of the clone path that matters most. `the_harness_still_builds_a_runnable_fixture` is a sanity check, so a failure above is about the network or the provider rather than the scaffolding around it.\n\n---\n\n## Connections to the rest of the workspace\n\n| Crate | Used for |\n|---|---|\n| `loopsmith-core` | `parse_str`, `load`, `LoopConfig`, `Detector`, `ProviderSpec`, `ProviderKind`, `Tier`, `Role`, `CompareOp`, `cascade_for` |\n| `loopsmith-memory` | `open`, `SledStore`, the `Store` trait (`ledger`, `episodes`, `summaries`, `goal_states`, `checkpoint`, `proposals`, `skill_trials`, `runs`), `LedgerKind`, `ProposalKind` |\n| `loopsmith-util` | `testing::temp_dir`, and `is_executable` indirectly through `doctor` |\n| `loopsmith` (the binary) | Everything, through `CARGO_BIN_EXE_loopsmith` |\n\n`repo_root()` derives the workspace root from `CARGO_MANIFEST_DIR` by walking three ancestors up; `examples_dir()` and `all_examples()` build on it. If the crate ever moves in the tree, that `nth(3)` is the thing to fix.\n\n---\n\n## Traps worth not rediscovering\n\nThese are the rules that will bite when adding a test, most of which have already cost someone an afternoon:\n\n- **Give every fixture a distinct tag.** Temp directories are named from it and the suite runs threaded, so two concurrent tests sharing a tag collide on the sled lock — the same error, from the same cause, with nothing pointing at the tag.\n- **The store cannot be opened while the binary under test is running**, and the handle must be dropped before its directory is removed. A store opened around a `Command` call reports a lock error that reads like a backend bug. This is why every test ends `drop(store); f.cleanup();`.\n- **A detector script runs with no shell and no timeout.** `command` is argv[0] and `args` are literal, so a stub needs a shebang and must not hang.\n- **Providers keep their ids when swapped for stubs** — see `enforce_judge_independence` above.\n- **A judge PASS with no evidence is demoted to FAIL.** Any stub judge payload needs an `EVIDENCE:` line.\n- **`satisfy_files` writes a body, not a placeholder** — the same files feed `regex_match`.\n- **A `\\` continuation inside a non-raw `format!` eats the next line's indentation.** The generated `run.sh` once reached disk flat and unindented; nothing about that fails a build or a parse, which is why `the_generated_scripts_keep_the_indentation_they_were_written_with` reads the layout back.\n\n## Deliberate gaps\n\n- **Loading a launch agent.** `--install` writes the plist and stops; the write is covered because the destination is redirected.\n- **Executing a `.cmd` launcher.** No POSIX host can run one, so this suite checks its shape and the `windows-latest` CI leg runs it.\n- **A GNU userland, locally.** `compat.rs` exercises the helpers rather than mocking the userland, so whichever machine runs the suite proves its own half and the `ubuntu-latest` CI leg proves the other.","overview":"# loops — Wiki\n\n# loopsmith\n\n> Self-evolving agent loops. The gate is code, so \"done\" cannot be argued.\n\nloopsmith runs an AI agent against a goal, over and over, until a **program** — not a model — says the goal is met. You write down what you want, what counts as proof, and how much budget you'll spend. loopsmith schedules the work, collects evidence, runs mechanical checks against that evidence, and stops when the checks pass or the budget runs out.\n\nThe whole project is arranged around one invariant:\n\n**The thing that decides whether work is finished is never the thing that did the work.**\n\nA model can write code, run tests, and claim success. It cannot mark its own goal satisfied. That ruling belongs exclusively to [Gating & Success Criteria](gating-success-criteria.md), a small, dependency-light Rust crate with no model in the loop. Everything else in the system — providers, skills, the scheduler, the MCP server — produces work and produces claims *about* work. Only the gate turns a claim into `GoalState { satisfied: true }`.\n\n## Architecture at a glance\n\n```mermaid\ngraph TD\n    CLI[CLI Command Surface]\n    ENGINE[Loop Execution Engine]\n    CORE[Loop Configuration Schema]\n    GATE[Gating & Success Criteria]\n    GRAPH[Execution Graph & Planning]\n    PROV[Provider Integration]\n    MEM[Memory & Episode Store]\n    SKILLS[Skills System]\n    UTIL[Platform Utilities]\n\n    CLI --> CORE\n    CLI --> ENGINE\n    ENGINE --> GRAPH\n    ENGINE --> PROV\n    ENGINE --> SKILLS\n    ENGINE --> GATE\n    ENGINE --> MEM\n    GATE --> MEM\n    CORE --> UTIL\n    MEM --> UTIL\n```\n\nRead it top to bottom: the CLI parses and routes, the engine drives iterations, the graph decides what may run in parallel, providers do the work, the gate rules on it, and memory remembers all of it. `loopsmith-core` (the config model) and `loopsmith-util` sit underneath as the two things everything is allowed to depend on.\n\n## The layers\n\n**Configuration.** A loop is a document. [Loop Configuration Schema](loop-configuration-schema.md) defines the `LoopConfig` model — goals, validations, nodes, budgets, schedules — and the `validate()` pass that decides whether a description is coherent enough to run unattended. `config/loop.schema.json` mirrors the same shape for editors and CI, but the runtime never reads it; `serde` is the source of truth.\n\nThat config has two grammars. YAML is the machine-friendly one; Markdown is the one a human can read top to bottom, with the reasoning for a goal sitting directly above the goal. [Markdown/YAML Config Interchange](markdown-yaml-config-interchange.md) bridges them in both directions and backs `loopsmith convert`. If you want to see what a real loop looks like before writing one, [Example Loops](example-loops.md) ships thirteen worked configs — in both formats — that double as the runtime's test corpus.\n\n**Execution.** [CLI Command Surface](cli-command-surface.md) is the `loopsmith` binary: it parses, routes, prints, and picks exit codes, and deliberately decides nothing else. Config semantics stay in core, scheduling math in graph, verdicts in the gate.\n\nThe state machine lives in [Loop Execution Engine](loop-execution-engine.md). Each iteration it asks [Execution Graph & Concurrency Planning](execution-graph-concurrency-planning.md) which nodes may run together (pure, deterministic, no I/O — cheap enough to re-plan every iteration), dispatches that wave through [Provider Integration](provider-integration.md), collects evidence, and hands it to the gate.\n\nProviders are the deliberately thin part: no HTTP client, no SDK, no per-vendor module. A provider is a command template — `claude -p {prompt}`, `ollama run {model}`, a `curl` to an OpenAI-compatible endpoint. Pick one, run it, report honestly on what happened.\n\n**Adaptation.** When a loop stalls but still has budget, [Evolution & Perturbation](evolution-perturbation.md) changes *method* — retry shape, prompt variation, notes to a future human — while being structurally incapable of changing *criteria*. Neither module can mutate `LoopConfig`, and neither can move a goal from unsatisfied to satisfied. When a node needs a capability it doesn't have, [Skills System](skills-system.md) acquires a sub-agent for it, records the trial, and lets the loop learn whether it was worth having. Network-touching work (`curl`, `npx`, `git`) is shelled out, so a machine with no network degrades to \"installed skills only\" rather than failing.\n\n**Durability.** [Memory & Episode Store](memory-episode-store.md) is the sled-backed substrate for everything that must survive a crash, a scheduled pause, or a context reset: episodes, goal state, an append-only ledger, checkpoints, scratchpads, skill trials, proposals. It knows nothing about loops or gates — it just stores.\n\n**Surfaces around the loop.** [Scheduling & Triggers](scheduling-triggers.md) turns a `schedules:` block into something that actually fires, via `loopsmith watch` (a long-lived poller with its own cron parser) or a handoff to launchd/systemd/Task Scheduler. [MCP Server](mcp-server.md) exposes the schedule, the ledger, and the gate's verdict over stdio to any MCP client — read-only by construction, with no `mark_done` tool anywhere in it. [Permissions & Sandboxing](permissions-sandboxing.md) derives the narrowest permission set a given config could need, shows it once up front, and writes it into the harness settings — so an unattended run neither stops to ask nor runs unsupervised.\n\n**Foundations.** [Platform Utilities](platform-utilities.md) is the root of the dependency graph: every crate depends on it, it depends on nothing, not even `serde`. Command lookup, executable detection, home directories, `now_ms`. Admission requires having already been written more than once, in more than one state of correctness.\n\n## End-to-end: what one run does\n\n1. `loopsmith run` loads a config (YAML or Markdown, same model either way) and validates it.\n2. Permissions are derived from that config and written once, before any work starts.\n3. The graph planner turns `depends_on` declarations into waves and a worker count.\n4. Each wave dispatches through a provider; nodes may pull in skills they need.\n5. Evidence lands in the episode store as it's produced.\n6. The gate reads the config's validations, runs mechanical detectors over the evidence, and returns a verdict.\n7. Unsatisfied but budget remaining → evolution/perturbation adjusts method and iterates. Satisfied, or budget spent → the run ends, with the ledger explaining why.\n\nA `watch`-driven loop wraps this: triggers fire, a run executes, checkpoints in memory let the next wake-up resume where the last one stopped.\n\n## Getting started\n\nInstall:\n\n```sh\ncargo install loopsmith    # the package is named loopsmith, not loopsmith-cli\n```\n\nInstallers for Linux/macOS/BSD (`install.sh`), Homebrew, and Windows are described in [Distribution & Installers](distribution-installers.md) — worth reading if an install fails, since that module is where most \"loopsmith doesn't work\" reports originate.\n\nThen:\n\n```sh\nloopsmith new my-loop              # scaffold a config\nloopsmith convert my-loop.md       # switch between Markdown and YAML\nloopsmith run my-loop.yaml         # run it once\nloopsmith watch my-loop.yaml       # keep it alive on its schedule\n```\n\nCopy a starting point from `config/examples/` rather than writing from scratch — `loopsmith new --config-file` does exactly that.\n\n## Working on loopsmith\n\nThe workspace is under `runtime/crates/`, Rust 1.75+. Unit tests live with each crate; the cross-cutting coverage — real binary, real iteration loop, the shipped example configs — is in the CLI integration tests:\n\n```sh\ncargo test                                # everything\ncargo test -p loopsmith --test stress     # full-loop integration\ncargo test -p loopsmith --test surface    # CLI surface\ncargo test -p loopsmith --test compat     # config compatibility\n```\n\nOne more module worth knowing about: [Project Documentation](project-documentation.md). The root Markdown files aren't decoration — `CLAUDE.md` and the `skills/loopsmith*/SKILL.md` files are read by an agent at runtime, and the README encodes claims the runtime is expected to keep. Changing them can change behavior.","permissions-sandboxing":"# Permissions & Sandboxing\n\n# Permissions & Sandboxing\n\nA hands-off loop has an awkward property: it cannot stop halfway through to ask\nwhether it may run `cargo test`. The two obvious ways out are both wrong.\nPrompting mid-run defeats the point of running unattended; granting blanket\naccess means nothing is supervised at all.\n\nThis module takes the third path. It reads the loop config, derives the\n*narrowest* set of permission rules that config could possibly need, shows them\nonce, and writes them into the settings file the harness reads. A loop that only\nreads files never asks for write access. A loop that never touches the\nmarketplace never asks for the network.\n\nThe module has two source files and one template:\n\n| File | Role |\n|------|------|\n| `runtime/crates/loopsmith-cli/src/permissions.rs` | Derivation, rendering, merging |\n| `runtime/crates/loopsmith-cli/src/cmd/permissions.rs` | The `loopsmith permissions` subcommand |\n| `runtime/crates/loopsmith-cli/templates/permissions.template.json` | Annotated reference shape |\n\nA fourth file, `templates/compat.template.sh`, is documented at the end. It is\nsandboxing of a different kind — portability of the detector scripts that run\nunder the grant, rather than the grant itself.\n\n---\n\n## The three functions\n\nAll of `permissions.rs` is three public functions with no shared state between\nthem. They compose in one direction: `required` produces a grant, and both\n`render` and `merge_into` consume one.\n\n```mermaid\ngraph LR\n    C[LoopConfig] --> R[required]\n    R --> G[\"Vec&lt;String&gt;\"]\n    G --> D[render]\n    G --> M[merge_into]\n    D --> T[stdout preflight]\n    M --> S[settings.local.json]\n```\n\n### `required(cfg: &LoopConfig) -> Vec<String>`\n\nWalks the config and collects permission strings into a `BTreeSet<String>`,\nwhich gets both deduplication and a stable sort for free. Four sources:\n\n- **Providers.** Every entry in `cfg.providers.providers` is invoked as a\n  command, so each contributes `Bash({p.command}:*)`.\n- **Script detectors.** Each validation whose `detector` matches\n  `Detector::Script { command, .. }` contributes `Bash({command}:*)`. These run\n  during gating, so without the rule the gate would block on a prompt in the\n  middle of a run.\n- **Skill acquisition.** Only if `cfg.skills.acquisition_order` contains\n  `AcquisitionSource::Marketplace` do `Bash(npx skills:*)` and\n  `WebFetch(domain:claudemarketplaces.com)` get added. This is the conditional\n  worth understanding: network access is not a baseline capability here, it is\n  something the acquisition policy has to actually ask for.\n- **Core tools.** `Read`, `Write`, `Edit`, `Glob`, `Grep` are unconditional —\n  the loop reads and writes inside its own directory as a matter of course.\n\nThe `BTreeSet` is the reason the ordering guarantee holds without an explicit\nsort call anywhere; `the_grant_has_no_duplicates_and_is_sorted` pins that\nbehaviour so a future refactor to `Vec` + `push` cannot silently regress it.\n\n### `render(grant: &[String]) -> String`\n\nBuilds the human-readable preflight block: a one-line preamble, the rules\nindented two spaces, and a closing paragraph. That closing paragraph is not\ndecoration. It states that nothing outside the list is requested, and that\nanything the constraints mark as a human checkpoint still stops and waits —\ngrant or no grant. `render_mentions_that_checkpoints_still_stop` asserts on the\nstring `\"human checkpoint\"` specifically, because the sentence is a promise\nabout how the runtime behaves and removing it would misrepresent the grant.\n\n### `merge_into(path: &Path, grant: &[String]) -> io::Result<String>`\n\nWrites the grant into a settings JSON file without clobbering it. The rules it\nfollows, in order:\n\n1. If the file exists, parse it; on a parse failure, fall back to `json!({})`\n   rather than erroring. A corrupt settings file becomes a fresh one instead of\n   a dead command.\n2. If the root parses to a non-object (an array, a bare string), replace it with\n   `json!({})`.\n3. Navigate to `permissions.allow`, creating either level with `or_insert_with`\n   if absent.\n4. Collect existing entries into a `BTreeSet<String>` and append only rules not\n   already present.\n5. Pretty-print, `create_dir_all` on the parent, write with a trailing newline,\n   and return the serialized string so the caller can display it.\n\nTwo properties fall out of step 4 and are covered by tests.\n`merging_preserves_existing_rules_and_adds_new_ones` checks that an unrelated\n`Skill(claude-api)` rule survives and that a sibling key (`theme`) is untouched.\n`merging_is_idempotent` runs the same merge twice and asserts the `allow` array\nstill has length 1 — running `--write` repeatedly is safe, which matters because\nit is the natural thing to do after editing a config.\n\nOne sharp edge for contributors: the `allow` binding is an\n`Option<&mut Vec<Value>>`, and it is `None` when `permissions` or `allow` exist\nbut hold the wrong JSON type — say `\"permissions\": \"none\"`. In that case the\n`if let Some(list)` body is skipped, the file is rewritten with its existing\nshape intact, and *no rules are added*, silently. If you are changing this\nfunction, that branch is the one to think about.\n\n---\n\n## The CLI surface\n\n`cmd/permissions.rs` is deliberately thin:\n\n```rust\npub fn execute(config: &Path, write: Option<&Path>) -> Result<ExitCode, String>\n```\n\nIt loads the config through `loopsmith_core::load`, calls `required`, and then\nbranches on `write`:\n\n- **No `--write`** — prints `render(&grant)`. Read-only; this is the preflight\n  you show a human before the single grant.\n- **`--write <path>`** — calls `merge_into`, prints a count line\n  (`wrote N permission rule(s) to <path>`) followed by the merged JSON.\n\nEvery error is flattened to `String` via `map_err(|e| e.to_string())`, so the\ncommand surfaces both config-parse failures and IO failures the same way.\n\nNote that `execute` takes the config *path*, not a parsed config, which is why\n`load` sits on the call path. That pulls the whole Markdown-config pipeline in\nbehind it — `parse_md` → `tokenize` → `build_document` → `build_block`, with\n`section_shape` and `heading_to_key` doing the structural work. The permissions\ncommand is therefore an end-to-end exercise of the config parser, which makes it\na useful smoke test when working on `src/md/`.\n\n### The other caller\n\n`scaffold` (in `src/scaffold.rs`) calls both `required` and `render`. This is\nthe path that matters for new loops: scaffolding a loop directory emits the\npreflight text alongside everything else, so the grant is visible at creation\ntime rather than being discovered on the first run. When changing the signature\nor output shape of either function, `scaffold` is the caller to check — the CLI\nsubcommand is the obvious one, scaffold is the easy one to miss.\n\n---\n\n## `permissions.template.json`\n\nThe template is a *shape*, not an answer, and it says so in its own `$comment`.\nIt exists so a human can read what a generated grant looks like without running\nanything. Its `$sections` block annotates each group — core tools, control\nplane, providers, detectors, acquisition — and mirrors the derivation rules in\n`required`.\n\nThe `$deny_note` is the load-bearing part:\n\n> Nothing is denied here by default. Denial is not the mechanism that protects\n> you — the constraint block in the loop config is, because it stops on\n> irreversible actions regardless of what this file allows.\n\nThis is the module's actual security model, and it is worth stating plainly\nbecause it is easy to get backwards. The allow-list is a *prompt-suppression*\nmechanism: it exists so the run does not stall. It is not the thing that stops\nthe loop from doing something irreversible. That job belongs to\n`constraints.human_checkpoint` in the loop config, which halts regardless of\nwhat the settings file permits. The template's `$still_stops` list enumerates\nthe categories: anything in `constraints.human_checkpoint`, publishing/sending/\ndeleting/paying, promoting a quarantined sub-agent out of `generated-skills/`,\nand applying anything written to `proposals/`.\n\nIf you are adding a capability to this module, the question to ask is not \"is\nthis safe to allow?\" but \"does the constraint layer already stop the dangerous\nversion of this?\" Widening the grant to avoid a mid-run prompt is in scope.\nWidening it to let the loop do something a checkpoint would have caught is not.\n\nThe template also lists `Bash(loopsmith:*)` under `control_plane` — plan, gate,\nledger, resume. Note that `required` does *not* currently emit this rule; the\ntemplate documents it as part of a realistic hand-written grant.\n\n---\n\n## `compat.template.sh` — the detector execution contract\n\nThis template is sourced by a loop's detector scripts:\n\n```sh\n. ./scripts/compat.sh\n```\n\nIt is in this module's orbit because of one fact about how detectors run:\n**loopsmith runs a detector with no shell.** `command` is `argv[0]` and `args`\nare literal — no globbing, no pipes, no `&&`. A detector is therefore a real\nfile with a real shebang, not a shell fragment. That constraint is what makes\nthe `Bash({command}:*)` rules in `required` meaningful: the rule names an actual\nbinary, and there is no shell layer in between where something else could be\nsmuggled in.\n\nThe same fact determines the Windows story. Git Bash, WSL, and MSYS all behave\nlike Linux here. Nothing runs under `cmd.exe` or PowerShell — a detector meant\nfor those is a `.cmd` or `.ps1` naming its own interpreter.\n\n### Runtime detection, not generation-time baking\n\nEverything in the file detects at run time. The comment explains why: a loop\ndirectory gets copied to a build box, a container, or a colleague's laptop, and\na value baked in by the generating machine would be wrong on arrival with no\nsign that anything had changed.\n\nThree exported variables are computed on source:\n\n| Variable | Derivation |\n|----------|-----------|\n| `LOOPSMITH_OS` | `uname -s`, or `unknown` |\n| `LOOPSMITH_USERLAND` | `gnu` if `sed --version` succeeds, else `bsd` |\n| `LOOPSMITH_BASH_MAJOR` | Major version of `bash` on PATH, `0` if absent |\n\nThe GNU/BSD probe is `sed --version` rather than an OS check because the\nuserland is what actually differs — a GNU coreutils install on macOS should be\ntreated as GNU.\n\n### Helpers\n\n`sed_i`, `stat_size`, and `stat_mtime` branch on `LOOPSMITH_USERLAND`. These\ncover the three divergences that actually break scripts:\n\n- `sed -i` takes no argument on GNU and requires one on BSD. Getting it wrong on\n  BSD consumes the next argument as a backup suffix, which is how a script ends\n  up editing a file named `-e`.\n- `stat` is `-c%s` on GNU, `-f%z` on BSD.\n- `readlink -f` is absent from BSD readlink before macOS 12.\n\n`readlink_f` probes with `readlink -f . >/dev/null 2>&1` and falls back to a\n`cd`/`pwd -P` walk in a subshell. `sha256` tries `sha256sum`, then `shasum -a\n256`, and returns 127 with a message on PATH if neither is installed.\n\n### Exit code 2 is a distinct verdict\n\n`need_bash` and `require` both `exit 2`, and the comment on `need_bash` explains\nwhy that number matters:\n\n> A detector's exit code is its verdict, and \"this machine cannot run the check\"\n> is a different fact from \"the check failed\". A gate that cannot tell them\n> apart reports missing tooling as unfinished work.\n\nIf you add a helper that can fail because the environment is inadequate — a\nmissing tool, a too-old interpreter — exit 2, not 1. Anything that conflates the\ntwo will cause the gate to report a broken build box as a failing goal.\n\n`need_bash` defaults to major version 4 and special-cases Darwin in its message,\nbecause macOS ships bash 3.2.57 for licence reasons and the fix (`brew install\nbash`, or rewrite to POSIX sh) is not obvious. Associative arrays, `${x,,}`,\n`mapfile`, `&>>`, and `**` all arrived in bash 4.0 — the file's standing advice\nis to write POSIX `sh` unless `need_bash 4` says otherwise.\n\n`compat_report` prints a single `os=… userland=… bash=… sh=…` line, intended for\na log or a bug report.\n\n---\n\n## Testing notes\n\nThe tests in `permissions.rs` build configs through a local `cfg(extra: &str)`\nhelper that formats a minimal YAML-ish document and runs it through\n`loopsmith_core::parse_str`. The base fixture has one provider (`ollama`), one\nscript detector (`cargo`), and one goal; `extra` is appended so a test can add\nsections. The marketplace test builds the config and then mutates\n`c.skills.acquisition_order` directly rather than expressing it in the fixture\ntext, which is the shortest path to the negative case.\n\nFilesystem tests use `loopsmith_util::testing::temp_dir` and clean up with\n`let _ = std::fs::remove_dir_all(dir)`. The ignored result is intentional — a\nfailed assertion panics before cleanup, and a leaked temp directory is not worth\nfailing a test over.\n\nWhen adding a new derivation rule to `required`, add it to the fixture's\npositive case *and* write the negative case. The marketplace test is the pattern\nto copy: assert the rule appears when the policy asks for it, and assert it is\nabsent when the policy does not. A rule that is only ever tested positively will\nnot catch the regression that matters here, which is a grant quietly getting\nwider than the config justifies.","platform-utilities":"# Platform Utilities\n\n# Platform Utilities (`loopsmith-util`)\n\n`loopsmith-util` is the root of the loopsmith dependency graph: every other crate in the workspace depends on it, and it depends on nothing at all — not even `serde`. That constraint is the crate's defining property. Anything added here is added to every build of every crate, so the bar for admission is high: a primitive earns its place by having already been written more than once, in more than one state of correctness.\n\nThe crate answers three questions that keep coming up across the workspace:\n\n1. **Is this command available, and where?** — `which`, `is_executable`\n2. **What time is it?** — `now_ms`\n3. **What is this machine actually capable of?** — the `platform` module\n4. (Plus, behind a feature flag: **where do tests put their scratch files?** — `testing`)\n\n---\n\n## Layout\n\n| Path | Contents |\n|---|---|\n| `src/lib.rs` | `which`, `is_executable`, `now_ms`, `first_executable`, `path_extensions`, `testing` |\n| `src/platform.rs` | `Os`, `Userland`, `BashVersion`, `Platform`, `home_dir`, `preferred_schedulers` |\n\nThe `testing` submodule is gated behind a `testing` Cargo feature, enabled from `[dev-dependencies]` so resolver 2 keeps it out of release builds. The published tarball ships `include = [\"/src/**/*\", \"/README.md\"]` only — integration tests in sibling crates read fixtures from the repository root, which no crate tarball can carry.\n\n---\n\n## Command resolution\n\n### `which(cmd: &str) -> Option<PathBuf>`\n\nResolves a command name the way a shell would, with two branches:\n\n- **Anything containing a path separator** (or an absolute path) is checked directly. It is *not* joined onto `PATH` entries. Three prior copies of this function existed in the workspace; some of them joined absolute paths onto every `PATH` directory and therefore returned `None` for every absolute path handed to them. The test `an_absolute_path_is_checked_directly_not_joined_onto_path` pins this.\n- **A bare name** is joined onto each `PATH` entry in order, and the first executable match wins.\n\nBoth branches funnel into `first_executable`, which enforces the two rules that make the result trustworthy.\n\n```mermaid\nflowchart TD\n    W[\"which(cmd)\"] -->|\"has separator<br/>or absolute\"| FE[\"first_executable(path)\"]\n    W -->|\"bare name\"| SP[\"split_paths(PATH)<br/>→ dir.join(cmd)\"]\n    SP --> FE\n    FE --> IE[\"is_executable(base)\"]\n    IE -->|\"yes\"| OK[\"Some(path)\"]\n    IE -->|\"no\"| PX[\"path_extensions()\"]\n    PX -->|\"append each suffix,<br/>re-test\"| IE\n    PX -->|\"exhausted\"| NONE[\"None\"]\n```\n\n### Rule 1: executability, not existence\n\n`is_executable` consults the unix permission bits (`mode() & 0o111 != 0`) in addition to `is_file()`. Two of the three previous copies of `which` checked only `is_file()`, which reports a non-executable file named `curl` sitting on `PATH` as \"curl is available.\" The failure then surfaces much later, as a confusing spawn error far from its cause.\n\nOff unix there is no permission bit to consult, so `is_executable` degrades to a plain file check rather than pretending to know more than it does. This asymmetry is deliberate and is asserted per-platform in `a_file_that_is_not_runnable_is_not_a_command` — the unix arm asserts the bit, the non-unix arm asserts the equivalent Windows claim (nothing is invented by appending a suffix that does not exist on disk).\n\n### Rule 2: platform executable suffixes\n\n`path_extensions()` returns an empty `Vec` on unix — the executable bit is the whole answer there. On Windows it reads `PATHEXT`, falling back to `.COM;.EXE;.BAT;.CMD` (what Windows itself defaults to). Honouring the variable rather than hardcoding a list is how a machine gets to say that `.ps1` or `.py` counts as a command.\n\nTwo details in `first_executable` matter:\n\n- **The suffix is appended, never substituted.** `set_extension` would turn `check.sh` into `check.exe`; a command name may legitimately contain a dot, so the code pushes onto the `OsString` directly. `a_suffix_is_appended_rather_than_replacing_a_real_extension` pins this.\n- **Without the suffix loop, `which` returns `None` for everything on Windows.** `git` there is a file called `git.exe`, so joining the bare name onto `PATH` matches nothing. Everything downstream then faithfully reports the falsehood it was given: `doctor` says no tools are installed, `Platform::detect` finds no scheduler, and worktree isolation degrades to a shared directory citing \"git not on PATH\" — on a machine where git is very much on PATH.\n\n---\n\n## The clock\n\n`now_ms()` returns milliseconds since the Unix epoch, and is the single clock for the workspace. Timestamps are stored as numbers so the ledger stays sortable without a date parser.\n\nA clock that runs backwards yields `0` rather than panicking. The tradeoff is stated plainly: a wrong timestamp on a ledger entry is a nuisance; a panic partway through an unattended run is not.\n\nCallers include the ledger and logging (`loopsmith-cli/src/logging.rs::entry`), run bookkeeping (`src/run/mod.rs::execute`), evolution records (`src/run/evolve.rs`), and `src/run/summary.rs::deterministic`.\n\n---\n\n## The `platform` module\n\n`cfg!(target_os = …)` answers what the binary was *compiled for*. That is a different question from what the machine running it can *do*, and three facts in particular change what loopsmith and its generated scripts are allowed to assume:\n\n- **The bash on `PATH` may be from 2007.** macOS still ships 3.2.57 because 4.0 changed licence. Associative arrays, `${x,,}`, `mapfile`, and `&>>` all arrived in 4.0.\n- **`sed`, `stat`, and `readlink` take different flags** under GNU vs. BSD userlands. `sed -i` requires an argument on BSD and must not have one on GNU.\n- **The scheduler is whatever is installed**, not whatever the OS is famous for. A container has neither `launchctl` nor `crontab`; a Mac has both.\n\nEverything in this module probes and reports. Nothing decides on the caller's behalf, and nothing is cached across processes — a probe costs one `--version` call, and a run is not a hot loop.\n\n### `Os`\n\nA five-variant enum (`MacOs`, `Linux`, `FreeBsd`, `Windows`, `Other`) over `std::env::consts::OS`. This one genuinely *is* a compile-time fact; it lives here so callers have a single place to ask, next to the facts that are not. `as_str()` gives the stable string used in reports (`\"bsd\"` for the BSD family), and `is_windows()` is the \"does this host run `.cmd` batch files rather than `#!` scripts\" predicate.\n\n### `home_dir()`\n\nReturns the home directory by whichever variable *this* operating system uses. On Windows the order is `HOME` → `USERPROFILE` → `HOMEDRIVE` + `HOMEPATH`; elsewhere it is simply `HOME`. Empty values are filtered out, not accepted.\n\nReading `HOME` directly is the bug this exists to prevent: it is unset on Windows outside a POSIX emulation layer, and the loss surfaces as \"cannot locate LaunchAgents\" or as a loop cheerfully scaffolding itself into a relative path. `the_home_directory_is_found_by_this_platforms_variable` asserts the result is absolute for exactly that reason.\n\n`loopsmith-cli/src/scaffold.rs::guard_path` and `loopsmith-skills`' `skill_search_paths` both go through here.\n\n### `Userland`\n\n`Gnu` / `Bsd` / `Unknown`, **probed, never inferred from the OS**. Homebrew's `coreutils` puts GNU tools ahead of BSD ones on a Mac, and a stripped container may have busybox — so `Os::MacOs` does not imply BSD and `Os::Linux` does not imply GNU.\n\n`Userland::detect()` runs `sed --version`. GNU answers with a banner; BSD refuses with a non-zero status. Busybox is classified as `Gnu` for flag purposes. A banner that succeeds but mentions neither is `Unknown`.\n\n`sed_in_place()` is the payoff:\n\n| Userland | Flags |\n|---|---|\n| `Gnu` | `[\"-i\"]` |\n| `Bsd` | `[\"-i\", \"\"]` |\n| `Unknown` | `[\"-i\", \"\"]` |\n\n`Unknown` takes the BSD spelling deliberately. GNU rejects the empty suffix loudly; BSD, given a bare `-i`, silently swallows the *next* argument as a backup suffix — which is how a script ends up editing a file called `-e`. When you must guess, guess toward the failure you can see.\n\n### `BashVersion`\n\nHolds `major`, `minor`, and `raw` (the whole first line, kept for the `doctor` report).\n\n`parse(first_line: &str)` splits on `\"version \"`, then takes the leading run of digits and dots — a shape stable across every bash release since 2.0 (`GNU bash, version 3.2.57(1)-release (x86_64-apple-darwin24)`). A missing minor defaults to `0`, so `version 5 (x86_64)` parses as `5.0`. Anything that is not a bash banner yields `None`.\n\n`MODERN_MAJOR = 4` is the line between POSIX `sh` and everything else, and `is_modern()` is `major >= 4`. The private `probe(command)` runs `<command> --version` and parses the first stdout line.\n\n### `Platform` — the whole picture, probed once\n\n```rust\npub struct Platform {\n    pub os: Os,\n    pub userland: Userland,\n    pub bash: Option<BashVersion>,      // `bash` on PATH; a machine may have none\n    pub sh_bash: Option<BashVersion>,   // `/bin/sh`, when it is bash in POSIX mode\n    pub schedulers: Vec<&'static str>,  // installed, in preference order\n}\n```\n\n`Platform::detect()` fans out to every probe in the module:\n\n```mermaid\nflowchart LR\n    D[\"Platform::detect()\"] --> OS[\"Os::detect()\"]\n    D --> UL[\"Userland::detect()<br/>sed --version\"]\n    D --> B[\"BashVersion::probe(\\\"bash\\\")\"]\n    D --> SH[\"BashVersion::probe(\\\"/bin/sh\\\")\"]\n    D --> PS[\"preferred_schedulers(os)\"]\n    PS --> WH[\"which(candidate)<br/>filter to installed\"]\n```\n\n`sh_bash` being `None` is itself information: on Debian `/bin/sh` is `dash`, which rejects `[[`, `local -n`, and `echo -e` that a bash-as-sh would have accepted by accident.\n\nThree methods sit on top of the struct:\n\n- **`scheduler()`** — the first installed candidate, or `None` when the machine has none.\n- **`has_modern_bash()`** — `false` when bash is missing entirely. A script that cannot be run is not a script that may assume anything.\n- **`portability_note()`** — one line explaining why a generated script sticks to POSIX `sh`, or `None` when nothing is holding it back. Distinguishes \"no bash on PATH\" from \"bash 3.2 predates 4.0.\"\n\n### `preferred_schedulers(os)`\n\nThe **candidate** list, best first — not the answer. `Platform::detect` filters it through `which`.\n\n| OS | Candidates |\n|---|---|\n| `MacOs` | `launchctl`, `crontab` |\n| `Linux`, `FreeBsd` | `crontab`, `systemctl` |\n| `Windows` | `schtasks`, `crontab` |\n| `Other` | `crontab` |\n\nlaunchd goes first on macOS because it is the one that survives a reboot without the user enabling anything else. Windows previously fell into the catch-all arm and was offered `crontab` alone, so `schedule` reported \"no scheduler\" on machines with a perfectly good Task Scheduler; `every_os_has_a_scheduler_worth_probing_and_windows_gets_the_native_one` pins the fix. `crontab` still trails `schtasks` on Windows because a machine with Cygwin or WSL interop on `PATH` has a real cron — prefer the native tool, still find the other one.\n\n`src/cmd/schedule.rs::preferred_names` calls this directly; `detection_answers_something_for_this_machine` asserts that no reported scheduler is absent from `PATH`.\n\n---\n\n## `testing` (feature-gated)\n\nThree functions, enabled via `features = [\"testing\"]` from a `[dev-dependencies]` entry:\n\n- **`temp_path(tag)`** — a unique path under the system temp dir, **not created**.\n- **`temp_dir(tag)`** — the same, created.\n- **`cleanup(path)`** — best-effort `remove_dir_all`, errors discarded. A leaked temp directory must never fail a test.\n\nThe name is `loopsmith-{tag}-{pid}-{now_ms}-{counter}`, and the **counter is the load-bearing part**. This existed six times in four shapes across the workspace, and two of those shapes omitted it. Tests run in parallel threads within a single process, so pid and millisecond timestamp do not separate two directories created in the same millisecond — and when two tests share a directory, sled reports a lock error that reads like a backend bug rather than a test collision.\n\nUsed throughout `loopsmith-cli` tests (`logging.rs`, `permissions.rs`) and the run-layer tests in `src/run/{export,publish,mod}.rs`.\n\n---\n\n## How the workspace uses this crate\n\n```\nloopsmith  (the CLI binary)\n└── loopsmith-mcp ── loopsmith-gate ─┐\n    loopsmith-skills ────────────────┤\n    loopsmith-provider ──────────────┼── loopsmith-core ── loopsmith-util\n    loopsmith-graph ─────────────────┤        (config)      (primitives)\n    loopsmith-memory ────────────────┘\n```\n\nThe most instructive consumers:\n\n- **`src/cmd/doctor.rs`** is the densest caller: `Platform::detect`, `scheduler()`, `portability_note()`, plus `which` and `is_executable` in `report_tool` and `config_notes`. Doctor's entire report is a rendering of this crate's probes — which is why a `which` that silently returns `None` produces a doctor report where nothing exists.\n- **`src/cmd/schedule.rs`** pairs `Platform::detect` + `scheduler()` with `preferred_schedulers` via `preferred_names`.\n- **`src/cmd/new.rs`** calls `Platform::detect` so scaffolded scripts match the host.\n- **`loopsmith-cli/src/worktree.rs::which_git`** resolves git through `which`; failure there degrades worktree isolation to a shared directory.\n- **`loopsmith-skills::skill_search_paths`** reaches `home_dir` — and because `home_dir` calls `Os::detect`, several traced flows run from `install_default` all the way down through `which` into `path_extensions` and `is_executable`.\n\n---\n\n## Contributing notes\n\n- **Adding a dependency is a workspace-wide decision.** There are none today, by design. A new one lands in every crate.\n- **Probe, don't infer.** The recurring bug class this module exists to prevent is deducing a runtime fact from a compile-time one. `Userland` is the canonical example: `the_userland_is_probed_and_never_inferred_from_the_operating_system` re-derives the answer from the raw `sed` output and requires `detect()` to agree.\n- **Tests must not mutate `PATH` or the environment.** `set_var` races every other test thread that reads the environment — the same class of parallel-test collision the temp-dir counter exists to prevent. Both the PATHEXT and non-executable-file tests assert through `which`'s absolute-path branch and real fixture files on disk instead.\n- **Platform assertions must state that platform's own rule.** Asserting \"a plain file is not executable\" is asserting unix semantics on a system that may have none; write the `#[cfg(unix)]` / `#[cfg(not(unix))]` arms to make the platform's actual claim.\n- **New `Platform` fields need a `portability_note`-shaped answer.** The pattern throughout is: probe the fact, expose it as data, and give `doctor` a human-readable line explaining what it constrains.","project-documentation":"# Project Documentation\n\n# Project Documentation\n\nThe root Markdown files are a module in their own right: they are the only interface most people ever touch, they encode claims the runtime is expected to keep, and several of them are load-bearing for the tool itself (`skills/loopsmith*/SKILL.md` and `CLAUDE.md` are read by an agent, not a person). This document is for whoever has to change them without breaking that.\n\n## Inventory\n\n| File | Lines | Audience | Job |\n|---|---|---|---|\n| `README.md` | 274 | Developer arriving from a package registry | Install, five-minute path, scheduling, portability. Routes everywhere else |\n| `README-FOR-DUMMIES.md` | 397 | Non-programmer | One install line, the thirteen example loops, the six fields you edit, scheduling |\n| `README-DETAIL.md` | 450 | Contributor / evaluator | Architecture, command table, the A–J model, providers, self-evolution, repo layout, named tests |\n| `HOW-TO-USE.md` | 546 | Config author | Field-by-field reference for every section, plus failure playbook and promotion path |\n| `LOOP-TEMPLATE.md` | 370 | Config author, copying | The authoring surface — a fill-in `SKILL.md` with `REPLACE ME` slots and inline rationale |\n| `loops-engineering-cheat-sheet.md` | 157 | Anyone questioning a design decision | Distillation of the 20-source corpus, what was borrowed, what was rejected, and why |\n| `CHANGELOG.md` | — | Upgraders | Release-by-release changes |\n| `CLAUDE.md` / `AGENTS.md` | — | Agents | GitNexus index instructions; machine-generated between `<!-- gitnexus:start -->` markers |\n\n`assets/` holds the three logo sizes; every doc header points at `loopsmith-logo-512.png`.\n\n## The routing design\n\nNothing is written twice for the same reader. Each entry point is a triage step that hands off rather than expands.\n\n```mermaid\nflowchart TD\n    A[\"Reader\"] --> B{\"Writes code?\"}\n    B -->|no| C[\"README-FOR-DUMMIES.md\"]\n    B -->|yes| D[\"README.md\"]\n    C --> E[\"config/examples/*.md\"]\n    D --> E\n    D --> F[\"HOW-TO-USE.md<br/>every field\"]\n    D --> G[\"README-DETAIL.md<br/>architecture + why\"]\n    F --> H[\"LOOP-TEMPLATE.md<br/>copy and fill\"]\n    G --> I[\"loops-engineering-cheat-sheet.md<br/>the sources\"]\n```\n\nTwo rules fall out of this and are worth preserving:\n\n- **`README.md` never explains a field.** It names sections A–J and links to `HOW-TO-USE.md`. The moment it starts documenting `no_progress_iterations`, it has two owners.\n- **`README-FOR-DUMMIES.md` never mentions a crate, a tier, or the graph.** It documents six fields (B, C, D, F, G, H) and explicitly tells the reader to leave the rest alone — including the instruction to delete every `type: script` detector block, which is the one place the docs tell a reader to remove shipped config.\n\n## The claim the whole doc set exists to make\n\nEvery long-form doc restates one sentence, deliberately:\n\n> A model must not be the thing that certifies its own completion.\n\nIt appears as the epigraph in `README.md`, as the design finding in `README-DETAIL.md`, as the justification for the three-plane split in `HOW-TO-USE.md §1`, and as the verifier-independence ladder in `loops-engineering-cheat-sheet.md §2.2`. This is intentional repetition — the docs are read non-linearly and the claim is the reason the architecture looks the way it does — but it means **a change to the trust model is a four-file edit**. The concrete assertions that ride along with it, and must stay consistent:\n\n- `goal_satisfied` is written by `loopsmith-gate` and by nothing else.\n- The gate can **revoke** — the corpus's grading question, \"can your system take 'done' back?\"\n- The MCP server has **no tool for marking a goal satisfied**, guarded by the test `there_is_no_tool_for_declaring_a_goal_satisfied`.\n- A `judge` verdict from the builder's own provider is **refused, not discounted**.\n\n## What binds documentation to code\n\nThe docs are not free prose; several of their claims are checkable, and the ones that are should stay that way.\n\n| Doc statement | Bound to |\n|---|---|\n| The A–J sections and every field name | `config/loop.schema.json` |\n| `compat.sh` helpers (`sed_i`, `stat_size`, `readlink_f`, `sha256`, `require`, `need_bash`) | `runtime/crates/loopsmith-cli/templates/compat.template.sh` |\n| Trust floors, marketplace sources | `runtime/crates/loopsmith-cli/templates/marketplaces.json` |\n| The permission grant shape, MCP registration | `templates/permissions.template.json`, `templates/mcp.template.json` |\n| Thirteen example loops, `.yaml` + `.md` twins | `config/examples/` — 26 files, verified |\n| Named tests in `README-DETAIL.md#tests` | `runtime/crates/*` test modules |\n| Nine published crates | `runtime/crates/` — `loopsmith-{util,core,memory,graph,gate,provider,skills,mcp,cli}` |\n\n`README-DETAIL.md` cites tests by name (`the_gate_can_take_done_back`, `judge_on_the_builders_provider_is_refused`, `amdahl_matches_the_published_table`, `a_cron_trigger_fires_once_per_minute_not_once_per_poll`, and others). Renaming one of those tests silently invalidates the document — treat the names as public API of the docs.\n\nThe Markdown/YAML config duality is likewise doc-visible: `README-DETAIL.md` claims a round-trip test keeps both grammars honest against every shipped example, which is what makes the `.md`/`.yaml` twins in `config/examples/` safe to document as equivalent.\n\n## Ownership of repeated facts\n\nSome facts genuinely appear in several files. Each has one owner; the others must be strictly less detailed.\n\n| Fact | Owner | Restated in |\n|---|---|---|\n| Install lines per registry | `README.md#install` | `README-FOR-DUMMIES.md` (one line per manager, no table) |\n| Command list | `README-DETAIL.md#commands` | `README.md#while-it-runs` (question→command only) |\n| Detector types, strongest first | `HOW-TO-USE.md §5 D` | `README-DETAIL.md`, `LOOP-TEMPLATE.md` (table only, no semantics) |\n| Section field reference | `HOW-TO-USE.md §5` | `LOOP-TEMPLATE.md` (YAML snippets with rationale) |\n| Stop gates | `LOOP-TEMPLATE.md#f--stop-gates` | `HOW-TO-USE.md §5 F`, `README-DETAIL.md` |\n| Provider command-template model | `HOW-TO-USE.md §6` | `README-DETAIL.md#providers`, `LOOP-TEMPLATE.md#providers` |\n| What the loop may change about itself | `README-DETAIL.md` | Same two-column table verbatim in `HOW-TO-USE.md §11` and `LOOP-TEMPLATE.md` |\n| Corpus reasoning and rejections | `loops-engineering-cheat-sheet.md` | Cited by link only |\n\nThe \"does on its own / only proposes\" table is duplicated word-for-word in three files. If you change what the loop may do autonomously, grep for `only proposes`.\n\n## Verified drift\n\nChecked against the working tree while writing this:\n\n1. **Test counts disagree three ways.** `README.md` badges 327 passing, `README-DETAIL.md` badges 240, and `README-DETAIL.md#tests` says 148 in prose. At most one is current. The badge and the prose in the same file contradicting each other is the worst of the three.\n2. **`README-DETAIL.md#repository-layout` points at files that moved.** It lists `config/marketplaces.json`, `config/permissions.template.json`, and `config/mcp.template.json`. `config/` actually contains only `loop.schema.json` and `examples/`; those three templates live in `runtime/crates/loopsmith-cli/templates/`. The same document cites the correct path for `marketplaces.json` in its self-evolution section, so the layout block is the stale copy.\n3. **`loopsmith-util` is missing from every architecture diagram.** `README.md#packages` names all nine crates; the control-plane blocks in `README-DETAIL.md` and `HOW-TO-USE.md §1` show six and seven respectively.\n4. **\"A–H\" survives where the model is now A–J.** `HOW-TO-USE.md §1` and `§4` say \"A–H config model\", `LOOP-TEMPLATE.md` is titled \"The A–H model\" and its `validate` comment says \"A–H model complete\", while both READMEs and `HOW-TO-USE.md §5` document ten sections through J. Sections I and J are fully specified elsewhere in the same files.\n5. **`README-DETAIL.md#the-aj-model`** says \"Two more sections exist\" and then lists four (`graph`, `providers`, `skills`, `context`).\n6. **Two installer scripts are undocumented.** `README.md` names `install.sh`, `install.bat`, `installers/deps.sh`, and `installers/deps.ps1`; `installers/install.ps1` also exists and is mentioned nowhere.\n7. **`README-FOR-DUMMIES.md` links `skills/loopsmith/SKILL.md` and `skills/loopsmith-reference/SKILL.md`** — both directories exist, but the doc set never states that `LOOP-TEMPLATE.md` is the template *for* those skill files, which is what its frontmatter and `disable-model-invocation: true` field imply.\n\nNone of these are hard to fix; they are listed because they are the failure mode this module has. Every one is a fact that lives in two places with no test between them.\n\n## Conventions\n\n**Voice.** Declarative, and every rule carries its reason in the same breath — \"`validate` fails on purpose\", \"that refusal is the most valuable thing the tool does\", \"popularity is not trust\". A rule stated without its reason gets edited out by the next contributor who finds it inconvenient.\n\n**Error text is quoted verbatim.** `README.md`, `README-DETAIL.md`, `LOOP-TEMPLATE.md`, and `HOW-TO-USE.md#10-failure-playbook` all reproduce real output:\n\n```\nerror  pre_execution: 2 step(s) not marked done: …\n[FAIL] prose — judgment refused: judge and builder both ran on `claude`\n```\n\nThese are copied from the binary, not paraphrased. When you change a message in `loopsmith-cli`, grep the docs for the old string.\n\n**Diagrams.** ASCII for architecture (the three-plane block, the promotion path, the ledger flow); Mermaid only in `README-FOR-DUMMIES.md`, where three small `flowchart` diagrams carry the six-fields story for readers who will not parse a box-drawing diagram. Developer docs stay ASCII so they render in a terminal `less`.\n\n**Links are repo-relative** so they resolve on GitHub, on crates.io, and in a local checkout. `config/examples/*.md` is linked from the dummies guide and `config/examples/*.yaml` from the developer READMEs — deliberate, since each audience edits a different flavour.\n\n**Tables carry the reference material, prose carries the argument.** Field lists, detector types, platform matrices, and failure modes are tables; everything that explains a tradeoff is a paragraph.\n\n**Nothing is claimed that CI does not check.** The three-platform matrix is stated as \"something that gets checked rather than something written down\" — that phrasing is a promise. Don't add a platform, registry, or guarantee to a badge or table before it runs somewhere.\n\n## Changing these files\n\nBefore editing, know which document owns the fact you are changing (table above), then:\n\n- **New or renamed config field** → `config/loop.schema.json` first, then `HOW-TO-USE.md §5` (the reference), then `LOOP-TEMPLATE.md` (the snippet), then the READMEs only if it changes the ten-section story.\n- **New CLI command** → `README-DETAIL.md#commands` is the complete list; add to `README.md#while-it-runs` only if it answers a question a running loop provokes.\n- **Changed error message** → grep for the old text across all six root docs.\n- **New example loop** → add both `.yaml` and `.md` to `config/examples/`, then update the count (currently thirteen, hard-coded in four places), the grouped link list in `README.md#examples`, the annotated table in `README-DETAIL.md#the-examples`, and the plain-language table in `README-FOR-DUMMIES.md#what-people-use-it-for`.\n- **Design decision reversed** → `loops-engineering-cheat-sheet.md §4` is where rejections live. Record what changed and why there before rewriting the docs that depend on it.\n- **`CLAUDE.md` / `AGENTS.md`** → generated content between the `gitnexus` markers; regenerate rather than hand-edit.\n\nThe counts sprinkled through the prose — thirteen examples, nine crates, twenty sources, 2,600 marketplace repos, the test totals — are the most fragile thing in this module. Treat any numeric claim as something you are agreeing to maintain.\n\nMIT licensed, same as the code it describes.","provider-integration":"# Provider Integration\n\n# Provider Integration (`loopsmith-provider`)\n\nEvery model call in loopsmith goes out through this crate. It is small on purpose: a provider is a *command template*, and the crate's job is to pick one, run it, and report honestly on what happened.\n\n## The single design decision\n\nThere is no HTTP client here, no SDK, no per-vendor Rust module. A provider is a program you run with a prompt. Claude Code (`claude -p {prompt}`), Ollama (`ollama run {model}` with the prompt on stdin), an OpenAI-compatible endpoint (`curl` with a JSON body on stdin), a Grok CLI, an MCP server over stdio — they all reduce to the same shape, described by `loopsmith_core::ProviderSpec`.\n\nTwo consequences follow directly:\n\n- **Adding a provider is a config edit.** No Rust change, no rebuild. BYOK is not a feature that had to be built; it falls out of the shape.\n- **Secrets never enter this process.** `requires_env` names variables that must *exist*. `availability` checks `std::env::var_os(k).is_none()` and keeps only the names of the missing ones. Values are never read, never substituted into arguments, never logged. The `openai` starter spec passes the literal string `Authorization: Bearer $OPENAI_API_KEY` — `curl` expands it, so the key lives in the child's environment and nowhere else. The test `a_provider_with_missing_env_is_unavailable_and_names_only_the_key` asserts the diagnostic string contains no `=`, which is the leak that would happen if anyone ever changed `var_os` to `var`.\n\n## The two entry points\n\nCallers use `dispatch` almost always, and `invoke` when they already know which provider they want.\n\n```mermaid\ngraph TD\n    A[\"run_node / ask_agent / add_narrative\"] -->|InvokeRequest| B[dispatch]\n    B -->|pinned: Some| C[\"cfg.provider(id)\"]\n    B -->|pinned: None| D[\"cfg.cascade_for(tier)\"]\n    C --> E[availability]\n    D --> E\n    E -->|ok| F[invoke]\n    E -->|not ok| G[\"skipped.push(why_not)\"]\n    F -->|Err| G\n    F -->|Ok| H[\"(InvokeResponse, skipped)\"]\n    G -->|list exhausted| I[\"ProviderError::NoneAvailable\"]\n```\n\n### `dispatch(cfg, req, pinned) -> Result<(InvokeResponse, Vec<String>), ProviderError>`\n\nWalks a cascade. `pinned` short-circuits the whole thing to a single provider looked up by id (`cfg.provider(id)`); otherwise the tier in `req.tier` selects an ordered candidate list via `cfg.cascade_for`. For each candidate in order:\n\n1. `availability(spec)` — is the binary on PATH and is every `requires_env` name present?\n2. If not, push `\"{id} ({why_not})\"` onto `skipped` and continue.\n3. `invoke(spec, req)` — on `Ok`, return immediately; on `Err`, push `\"{id}: {e}\"` and continue.\n\nThe returned `Vec<String>` is not decoration. It is *why* the call landed where it did, and the ledger records it. When the list is exhausted, `ProviderError::NoneAvailable` carries the same accumulated reasons joined with `; ` — so an exhausted cascade tells you every attempt, not just the last. If the tier had no providers declared at all, `tried` reads `\"none declared\"` rather than an empty string.\n\nNote what `dispatch` does *not* do: there is no retry of a provider that already failed, and no reordering. The cascade is exactly the order in config.\n\n### `invoke(spec, req) -> Result<InvokeResponse, ProviderError>`\n\nRuns one provider. The mechanics, in order:\n\n**Placeholder substitution.** `render` replaces `{prompt}`, `{system}`, `{model}`, `{tier}`, and `{node}` in each element of `spec.args`. Substitution is a plain `String::replace` per key — unknown placeholders are left in the string verbatim (`unknown_placeholders_are_left_alone`), which means a typo in a config template surfaces as a strange argument reaching the child rather than as a silent empty value. `{model}` renders to the empty string when `spec.model` is `None`. `{tier}` comes from `tier_name`, which is the lowercase spelling used in cascade config keys.\n\n**Spawn.** `Command::new(&spec.command)` with the rendered args, `current_dir(&req.workdir)`, stdout and stderr piped. Stdin is piped when `spec.prompt_on_stdin` is set and `Stdio::null()` otherwise. In stdin mode the write is deliberately `let _ =` — a broken pipe means the child already exited, and the exit-code path below reports that far more usefully than an io error would.\n\n**Timeout.** `std::process` has no timeout, so `invoke` polls `try_wait()` every 50 ms against `spec.timeout_seconds`. On expiry it kills and reaps the child and returns `ProviderError::Timeout`. This is the one place the crate accepts a busy-ish wait; the alternative was an async runtime for a single feature. If `timeout_seconds` is `None`, the loop waits forever — a provider that hangs with no configured timeout hangs the node.\n\n**Failure is loud.** A non-zero exit is `ProviderError::Failed` carrying the *last line* of stderr, never a silent pass-through of partial output. `a_nonzero_exit_is_an_error_not_a_silent_pass` guards this.\n\n## Accounting: tokens and cost\n\n`InvokeResponse` carries `tokens`, `tokens_estimated`, and `cost_usd`. The resolution order after a successful run:\n\n1. `parse_usage(spec, stdout)` — compile `spec.usage_regex`, prefer capture group 1, fall back to the whole match, strip `,` and `_`, parse `u64`.\n2. If that yields nothing, `parse_usage(spec, stderr)`. Providers scatter usage across both streams; both get checked.\n3. Otherwise `estimate_tokens(&req.prompt, &stdout)` — four characters per token, rounded up with `div_ceil`.\n\nEvery fallible step in `parse_usage` uses `?` or `.ok()`, so a malformed `usage_regex` does not error the call; it silently degrades to an estimate (`a_malformed_usage_regex_falls_back_to_estimating`). That is a deliberate trade: an approximate ceiling that fires beats an exact one that never does, which is what an unaccounted budget gate amounts to. `tokens_estimated` is the flag that keeps this honest — a budget report can say which number it is looking at.\n\n`cost_usd` is `Some` only when both a token count and `spec.cost_per_1k_tokens` exist: `(tokens / 1000.0) * rate`. No rate configured means `None`, never a guessed price.\n\n## Supporting pieces\n\n| Item | Role |\n|---|---|\n| `Availability { on_path, missing_env }` | `ok()` is `on_path && missing_env.is_empty()`; `why_not()` renders the human-readable reason the cascade records |\n| `which` | Re-exported from `loopsmith-util`. The implementation moved there after turning out to exist three times across the workspace in three states of correctness — this re-export keeps the old path working |\n| `digest(s)` | 64-bit FNV-1a, hex-formatted. Not cryptographic. Its only job is letting the ledger say \"same prompt as before\" without storing the prompt twice. `run_node` calls it for prompt provenance |\n| `starter_providers()` | The five specs `loopsmith init` writes into a fresh config, via `loopsmith-cli`'s `starter_config` |\n\n### On the starter set\n\nThe five starters cover all three tiers (asserted by `starter_providers_cover_every_tier`), and unavailable ones are skipped rather than fatal — a fresh install works with whatever the user happens to have. Two specs encode a lesson worth keeping:\n\n- **`ollama` is 120s, not 600s.** `ollama run <model>` pulls the model when it is absent, and from outside the process a 4.7 GB download is indistinguishable from slow generation. One observed run spent its entire 600-second budget downloading and produced nothing. A cheap tier exists to be abandoned quickly, so the timeout is tuned to fall through to the next provider rather than to accommodate a pull. Run `ollama pull llama3` first.\n- **`openai` is the only starter with a `usage_regex` and a rate.** Its response body carries `total_tokens`, so its cost ceiling is measured rather than estimated.\n\n## How it connects\n\nUpstream, three call sites in the CLI build an `InvokeRequest` and call `dispatch`: `run_node` (`src/run/dispatch.rs`, the main node execution path, which also calls `digest`), `ask_agent` (`src/run/perturb.rs`), and `add_narrative` (`src/run/summary.rs`). `execute` in `src/cmd/providers.rs` calls `availability` directly — that is the `loopsmith providers` command reporting what is usable right now, and it is the flow that reaches down through `which` → `first_executable` → `is_executable`/`path_extensions` in `loopsmith-util` for platform-correct PATH resolution.\n\nDownstream, this crate depends only on `loopsmith-core` for the config model (`LoopConfig`, `ProviderSpec`, `ProviderKind`, `Tier`, and the `provider`/`cascade_for` lookups) and `loopsmith-util` for `which`. It knows nothing about the gate, the graph, or memory.\n\nThat last point is the boundary that matters. **A model must not certify its own completion.** `goal_satisfied` is written by `loopsmith-gate` and by nothing else. This crate runs models and reports what they said; it has no path to the gate and no way to influence whether a goal is considered met. Keep it that way when extending it.\n\n## Contributing notes\n\n- **Adding a provider should not mean touching this file.** If a new provider needs a Rust change, that is a signal the `ProviderSpec` shape is missing something — extend the spec in `loopsmith-core`, not the dispatch logic here.\n- **Never read an env var's value.** `availability` uses `var_os(...).is_none()` and keeps names only. Any change that reads a value puts a secret one `Debug` impl away from the ledger.\n- **Tests are hermetic and use real binaries.** `echo`, `cat`, `false`, `sleep`, `sh` — no mocks and no network. `a_usage_regex_extracts_the_real_count` carries a note worth reading before you write another: its payload deliberately avoids double quotes, because embedding them in an argument makes the test depend on platform escaping, and Windows escapes differently. It failed there once for a reason unrelated to usage parsing.\n- **`Cargo.toml` ships `src/` only.** The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain. Shipping them would hand a published crate tests that cannot pass.","scheduling-triggers":"# Scheduling & Triggers\n\n# Scheduling & Triggers\n\n`runtime/crates/loopsmith-cli/src/schedule.rs` and `runtime/crates/loopsmith-cli/src/cmd/schedule.rs`\n\nThis module is what turns a `schedules:` block in a loop config from parsed data into something that actually fires. It has two halves that are deliberately independent:\n\n1. **Trigger evaluation** (`schedule.rs`) — a cron parser, a UTC civil-time converter, and a `Watcher` that decides, on each poll, which triggers are due. This is the engine behind `loopsmith watch`, the long-lived process that keeps a loop alive for days or weeks.\n2. **OS handoff** (`cmd/schedule.rs` + the generators at the bottom of `schedule.rs`) — `loopsmith schedule` emits a launchd plist, a crontab line, or a `schtasks` command so the loop survives a reboot without a terminal left open.\n\nEverything in the first half is pure and testable: `Watcher::poll` takes the current time as a parameter rather than reading the clock, so the entire trigger matrix is exercised by unit tests with no sleeping.\n\n## Time is UTC, on purpose\n\nCron expressions are evaluated in UTC, and this is a decision rather than an oversight (see the module doc comment). Deriving a local offset in a multithreaded process is unsound on Unix without care, and a scheduler that is silently an hour off twice a year is worse than one that is honestly in UTC. The `crontab` output path prints an explicit warning about this, because system cron *does* use local time — so the same expression means two different things depending on who evaluates it. For a cadence that shouldn't care about wall clock at all, `interval` is the right trigger.\n\n`civil_from_unix(secs) -> Civil` does the conversion using Howard Hinnant's `civil_from_days` algorithm, deliberately hand-rolled so the scheduler adds no date-crate dependency the binary doesn't already carry. It yields `{year, month, day, hour, minute, weekday}`; weekday is derived from `(days + 4) % 7` because 1970-01-01 was a Thursday. It is also used outside this module — `logging::format_utc` calls it to timestamp log lines.\n\n## Cron parsing\n\n`CronExpr::parse` accepts the standard five fields — `minute hour day-of-month month day-of-week` — and rejects anything else with a message naming the field layout. Each field goes through `parse_field(spec, min, max)`, which handles `*`, comma lists, `a-b` ranges, and `/step` suffixes, in any combination (`*/15 9-17 1,15 * 1-5` parses). It normalizes to a sorted, deduplicated `Field::Values(Vec<u
