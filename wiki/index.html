orgot to declare a check must not silently graduate.\n\nNote that a detector error and a detector failure are distinguished in the evidence text even though both produce `passed: false`. \"Cannot run the check\" is a different fact from \"the check failed\", and a gate that reports missing tooling as unfinished work sends the loop off to fix imaginary bugs.\n\n## Data model\n\n```\nEvidence  ──evaluate(cfg, target, ev)──▶  TargetVerdict\n                                              │\n                                              ├─ Vec<CheckResult>   (one per validation)\n                                              └─ to_goal_state(n) ──▶ GoalState  (persisted)\n```\n\n### `Evidence`\n\nThe complete set of what the gate is allowed to look at. Built with a small builder API:\n\n```rust\nlet ev = Evidence::new(&workdir)\n    .with_metric(\"coverage\", 0.85)\n    .with_artifact(\"test_output\", &stdout)\n    .with_judgment(judgment);\n```\n\n- `artifacts: BTreeMap<String, String>` — named text blobs for `regex` detectors\n- `metrics: BTreeMap<String, f64>` — numbers for `threshold` detectors\n- `judgments: Vec<Judgment>` — model verdicts, keyed back to a validation by `Judgment::validation`\n- `workdir: PathBuf` — the `current_dir` for `script` detectors and the base for `file_exists` paths\n\n### `Judgment`\n\nCarries the provenance the independence check needs. Both `provider_id` (who judged) and `builder_provider_id` (who produced the work) are required fields — the comparison between them *is* the independence check. `score` is optional and only consulted when the detector declares `min_score`. Parsed from the outside world by `loopsmith_cli::judgment::parse`.\n\n### `CheckResult` / `TargetVerdict`\n\n`CheckResult` field names (`text` / `passed` / `evidence`) deliberately mirror the grading schema of the existing eval viewer so reports are readable by tooling that already exists.\n\n`TargetVerdict` carries per-check detail plus rolled-up `passed` / `failed` / `total` counts and a human-readable `reason` naming the specific blocking checks that failed. Its two methods:\n\n- `blocking_pass_rate()` — fraction of **blocking** checks that passed. Non-blocking checks are excluded from the denominator entirely. Returns `0.0` when there are no blocking checks (consistent with invariant: no blocking checks means no progress toward satisfaction).\n- `to_goal_state(iteration)` — the persistence boundary described above.\n\n## Detectors\n\n`run_detector` is a match over `loopsmith_core::Detector` and returns `Result<(bool, String), GateError>` — a verdict plus the evidence string that explains it. Every arm produces a human-legible explanation whether it passed or failed; the evidence string is what a developer reads when the loop stalls.\n\n| Variant | Verdict is | Evidence looks like |\n|---|---|---|\n| `Script { command, args, expect_exit }` | exit code equals `expect_exit` (default `0`) | `` `cargo` exited 101 (expected 0); error: test failed `` |\n| `FileExists { path, non_empty }` | path resolves under `workdir` and, if `non_empty`, has length > 0 | `./report.md exists (1284 bytes)` |\n| `RegexMatch { artifact, pattern }` | pattern matches the named artifact | `pattern matched \\`test_output\\`` |\n| `Threshold { metric, op, value }` | `op.apply(actual, value)` over a reported metric | `coverage = 0.85, required >= 0.8` |\n| `Judge { standard, min_score }` | see below | `mean score 4.20 against \\`house style guide\\` (min 4)` |\n\n`Script` captures only the **last line of stderr** for the evidence tail. That is a deliberate size bound, not an oversight — the full output belongs in an artifact if a regex check needs it.\n\n### The `Judge` arm in detail\n\nThis arm is the most involved, and the order of its steps matters:\n\n```mermaid\nflowchart TD\n    A[judgments for this validation] --> B{any recorded?}\n    B -->|no| F[\"fail: no judgment recorded\"]\n    B -->|yes| C{\"enforce_judge_independence<br/>AND a self-judgment exists?\"}\n    C -->|yes| G[\"fail: shares its blind spots\"]\n    C -->|no| D[pool = independent judgments<br/>fall back to all if none]\n    D --> E{min_score declared?}\n    E -->|yes| H[\"mean score >= min\"]\n    E -->|no| I[\"every judgment in pool passed\"]\n```\n\nTwo subtleties:\n\n- The independence *refusal* (under `enforce_judge_independence`) runs before pooling and rejects the entire check if **any** judgment is self-authored — one contaminated verdict spoils the batch rather than being quietly filtered out.\n- The pooling step separately prefers independent judgments and falls back to the full set only when none are independent. With enforcement on, that fallback is unreachable; with enforcement off, it is the soft version of the same preference.\n- With `min_score` set, judgments carrying no `score` are dropped from the mean, and an empty scored set fails rather than defaulting.\n\n## Targets, blocking, and success scenarios\n\nA `Validation` names a `target`. Targets are goal names plus the reserved constant `loopsmith_core::OVERALL`. `evaluate_all` produces a `BTreeMap<String, TargetVerdict>` covering every goal in the config plus `OVERALL`.\n\nSatisfaction of a *target* is decided entirely by blocking checks:\n\n```\nsatisfied = has_blocking_checks && no_blocking_check_failed\n```\n\nNon-blocking failures show up in `failed` and in the report, but do not hold the gate shut (`non_blocking_failures_do_not_hold_the_gate`).\n\nSatisfaction of a *success scenario* is a separate, looser layer on top. `success_met` interprets a `SuccessScenario` against its target's verdict:\n\n- `Mode::Percentage` — `verdict.blocking_pass_rate() >= threshold` (threshold defaults to `1.0`)\n- `Mode::Objective` / `Mode::Subjective` — plain `verdict.satisfied`\n\n`overall_success` collects the scenarios targeting `OVERALL` and requires **all** of them. If the config declares no `OVERALL` scenario at all, it falls back to the `OVERALL` verdict's own `satisfied` flag. This is the function the stop gates call.\n\n## How the rest of the workspace uses it\n\n```mermaid\nflowchart LR\n    R[\"run::execute\"] --> EA[evaluate_all]\n    S[\"run::stop::should_stop\"] --> OS[overall_success]\n    G[\"cmd::gate::execute\"] --> EV[evaluate]\n    M[\"mcp::tool_gate\"] --> EV\n    EA --> EV\n    OS --> SM[success_met]\n    EV --> TV[TargetVerdict]\n    TV --> GS[\"GoalState (memory)\"]\n```\n\nFour entry points, one evaluation core:\n\n- **`src/run/mod.rs::execute`** — the loop's per-iteration path, calls `evaluate_all` to refresh every goal plus `OVERALL`.\n- **`src/run/stop.rs::should_stop`** — calls `overall_success` to decide whether the loop terminates. `stop.rs` and `src/run/export.rs` also carry `TargetVerdict` values around for reporting.\n- **`src/cmd/gate.rs::execute`** — the standalone `loopsmith gate` CLI command, one target at a time. This is the path to use when debugging a stuck loop: run the gate by hand and read the `evidence` strings.\n- **`loopsmith-mcp::tool_gate`** — exposes `evaluate` over the local stdio MCP server, so an agent can *ask* the gate for a verdict without being able to write one.\n\nDownward, the crate depends on `loopsmith-core` for the config model (`LoopConfig`, `Validation`, `Detector`, `SuccessScenario`, `Mode`, `CompareOp`, `OVERALL`) and on `loopsmith-memory` for `GoalState` and `now_ms`. It depends on no provider crate — the gate cannot call a model, which is a structural guarantee rather than a convention.\n\n## Contributing\n\n**Adding a detector.** Add the variant to `loopsmith_core::Detector` (and the config schema), then add a match arm in `run_detector`. The arm must return an evidence string on *both* branches, and must fail closed when its input is missing — mirror the `\"was not reported\"` / `\"was not collected\"` arms rather than inventing a default-pass. If the detector can fail to execute at all, that is a `GateError`, not a `false`.\n\n**Do not add a code path that constructs `GoalState { satisfied: true }`.** `to_goal_state` is the only one, and the test `only_the_gate_builds_a_satisfied_goal_state` exists to keep it that way. Anything that needs a satisfied goal state must go through a `TargetVerdict`.\n\n**Tests.** The unit tests in `lib.rs` build configs from YAML via `cfg_with` → `loopsmith_core::parse_str`, which exercises the real config parser rather than hand-constructing structs. Filesystem tests use `loopsmith_util::testing::temp_dir` (behind the `testing` feature). Each existing test pins one invariant and is named as an assertion (`a_missing_judgment_fails_closed`, `a_target_with_no_blocking_validation_is_never_satisfied`) — follow that convention; the test name is the specification.\n\n**Packaging.** `Cargo.toml` ships only `/src/**/*` and the README. Integration tests read `config/examples/` and `config/loop.schema.json` from the repo root, which no crate tarball can contain, so they are deliberately excluded rather than shipped broken.","loop-configuration-schema":"# Loop Configuration Schema\n\n# Loop Configuration Schema\n\nThe config model is the contract between a human writing a loop and everything that runs one. It exists twice — once as a JSON Schema (`config/loop.schema.json`) for editors and external tooling, and once as Rust types in `loopsmith-core` (`runtime/crates/loopsmith-core/src/config/`) for the runtime. Neither one is sufficient alone, and the split is deliberate: the schema catches shape errors while you type, and `validate.rs` catches the cross-field rules a schema cannot express — most importantly that **every goal carries at least one blocking validation**.\n\n`loopsmith-core` has no dependencies beyond `serde`, `serde_json`, `serde_yaml`, and `thiserror`. It sits at the bottom of the crate graph; everything else (`loopsmith-gate`, `loopsmith-graph`, `loopsmith-provider`, `loopsmith-skills`, the CLI) depends on it, and it depends on none of them. That constraint shows up in the code — see [Derived analyses](#derived-analyses) for the two graph algorithms core has to reimplement because it cannot reach `loopsmith-graph`.\n\n---\n\n## The A–J sections\n\nA loop config is ten named sections plus four infrastructure blocks. The section letters are not decoration: they are the same in the template, the schema `description` strings, the Rust module names, and the Markdown parser's headings, so \"where does `stop_gates` live\" has one answer everywhere.\n\n| | Section | Rust module | Required |\n|---|---|---|---|\n| **A** | `information` | `config/info.rs` — `InfoItem` | no |\n| **B** | `pre_execution` | `config/work.rs` — `WorkItem` | no, but see below |\n| **C** | `goals` | `config/goals.rs` — `Goal` | **yes**, ≥1 |\n| **D** | `validations` | `config/validation.rs` — `Validation`, `Detector`, `Mode` | **yes**, ≥1 |\n| **E** | `success` | `config/success.rs` — `SuccessScenario` | no |\n| **F** | `stop_gates` | `config/gates.rs` — `StopGates` | no (defaulted) |\n| **G** | `schedules` | `config/triggers.rs` — `Trigger` | no |\n| **H** | `constraints` | `config/constraints.rs` — `Constraints`, `ConstraintSet` | no |\n| **I** | `execution_guidelines` | `config/guidelines.rs` — `ExecutionGuidelines`, `Guideline`, `Phase` | no |\n| **J** | `default_skills` | `config/default_skills.rs` — `DefaultSkill`, `SkillOrigin` | no |\n\nPlus four unlettered blocks: `graph` (`GraphSpec`, `NodeSpec`, `Concurrency`, `Role`, `Tier`), `providers` (`ProviderRouting`, `ProviderSpec`, `ProviderKind`), `skills` (`SkillPolicy`), and `context` (`ContextPolicy`).\n\n`name`, `goals`, and `validations` are the only fields the schema marks `required`. Everything else defaults, which means the smallest valid config is about ten lines — see `MINIMAL` in the `config/mod.rs` tests.\n\n### Two orderings that are not the same thing\n\nSections I and the graph both express order, and conflating them is the most common modelling mistake:\n\n- `graph.nodes[].depends_on` is a **data** edge. Only list a node whose output this node actually reads. Every edge here feeds critical-path and wave computation, so a decorative \"and then\" edge makes the schedule wrong.\n- `execution_guidelines.dependency` is a **method** edge — *gather before you draft*, *land the tests before you refactor*. Nodes join a phase with `stage:`, and a staged node is not dispatched until its phase is active. A node with no `stage` is always eligible.\n\nOrdering in section I is written as arrows (`gather -> draft -> review`), one chain per array entry, parsed by `parse_chain`. Guidelines with no arrow between them run in parallel — that's the default on purpose.\n\n---\n\n## Loading a config\n\n`lib.rs` exposes four entry points. Markdown is dispatched by extension rather than sniffed, because a `.md` config is a *different grammar*, not a different serialization — guessing would mean reporting a YAML parse error for a document that was never YAML.\n\n```mermaid\nflowchart LR\n    A[\"load(path)\"] --> B{is_markdown?}\n    B -- yes --> C[\"md::parse_md\"]\n    B -- no --> D[\"parse_str\"]\n    D --> E[\"serde_yaml\"]\n    E -- fails --> F[\"serde_json\"]\n    C --> G[LoopConfig]\n    E --> G\n    F --> G\n    G -.-> H[\"load_validated: validate + has_errors\"]\n```\n\n| Function | Behaviour |\n|---|---|\n| `load(path)` | Reads the file, routes to `parse_md` or `parse_str`. Returns `CoreError::Io` on a read failure. |\n| `is_markdown(path)` | `.md` / `.markdown`, case-insensitive. Used by `cmd/new.rs` and `cmd/convert.rs` to decide format independently of loading. |\n| `parse_str(text, origin)` | YAML first (a JSON superset in practice), then strict JSON. **Both** error strings survive into `CoreError::Parse` — a config that is neither gives you both diagnostics rather than the more confusing one. |\n| `load_validated(path)` | `load` + `validate`, promoting any error-severity issue to `CoreError::Invalid(report.render())`. |\n\n`load_validated` is what `cmd/run.rs::start` and `cmd/watch.rs::execute` call — the two paths that actually spend money. Read-only commands (`plan`, `doctor`, `gate`, `permissions`, `prune`, `schedule`, `providers`, `skills`) call plain `load` so they can inspect a config that would be refused for a run.\n\n### `deny_unknown_fields` everywhere\n\nEvery struct in `config/` carries `#[serde(deny_unknown_fields)]`, mirroring `additionalProperties: false` in the schema. Without it a misspelled key is silently dropped and the loop runs with a default the author never chose — `stop_gate:` instead of `stop_gates:` would discard the author's budget ceilings and turn a cost cap into a surprise invoice. Two tests in `config/mod.rs` pin this at both the top level and one level down.\n\n---\n\n## Tagged enums\n\nThree parts of the model are internally-tagged sum types. In YAML they read as an inline object with a discriminator; in the schema they are `oneOf` branches, each with its own `required` list.\n\n**`Detector`** (`tag = \"type\"`) — how a validation is decided. `script`, `file_exists`, `regex_match`, and `threshold` are deterministic; `judge` is a model verdict and requires a provider independent of the builder's:\n\n```yaml\ndetector: { type: script, command: cargo, args: [test], expect_exit: 0 }\ndetector: { type: file_exists, path: out/notes.md, non_empty: true }\ndetector: { type: regex_match, artifact: notes, pattern: \"https?://\" }\ndetector: { type: threshold, metric: coverage, op: gte, value: 0.8 }\ndetector: { type: judge, standard: \"Chicago Manual of Style\", min_score: 0.7 }\n```\n\n`CompareOp::apply` implements the five comparisons; `Eq` is an `f64::EPSILON` comparison, not `==`.\n\n**`Trigger`** (`tag = \"type\"`, section G) — `cron` (five-field, evaluated in **UTC**), `interval` (timezone-independent, the right choice when cadence doesn't need a wall-clock time), `file_change`, `goal_satisfied`, `manual`.\n\n**`Concurrency`** (`tag = \"mode\"`) — `sequential`, `fixed { max_parallel }`, or `auto { cap = 16, min_marginal_gain = 0.05 }`. `auto` is the default and derives width from the graph's widest wave, trimmed where marginal Amdahl speedup stops beating marginal cost. The actual derivation lives in `loopsmith-graph`; core only carries the knobs.\n\n`ProviderKind` is a plain enum with generous serde aliases, because a config that rejects `openai` in favour of `open_ai` wastes the author's afternoon. `claude`/`claude-code`/`claudecode`, `grok`, `custom`→`Byok`, `MCP`, `OpenAI` all resolve; the alias table is pinned by `provider_kind_aliases_still_resolve`.\n\n---\n\n## Validation\n\n`validate(&LoopConfig) -> ValidationReport` never fails — it accumulates. A `ValidationReport` is a `Vec<Issue>`, each with a `Severity` (`Warning` or `Error`), a dotted `field` path (`goals[2].name`, `validations[target=g1]`), and a message. `has_errors()` decides whether the config is runnable; `render()` produces the indented text the CLI prints.\n\nThe top-level `validate` checks `name` and non-empty `goals`, then delegates to eight focused passes:\n\n```\ncheck_goals  check_pre_execution  check_validations  check_success\ncheck_stop_gates  check_execution_guidelines  check_graph  check_providers\n```\n\n### The load-bearing rules\n\nThese are errors — they stop a run.\n\n- **Every goal needs at least one blocking validation.** `check_validations` counts blocking validations per target and reports `goal has no blocking validation; it could never be honestly satisfied` for any goal at zero. This is the single most common way loops fail, so the config is rejected rather than run.\n- **Unfinished `pre_execution` blocks the run.** Any `WorkItem` with `done: false` is an error naming the outstanding steps. The corpus rule is to do the task by hand first — the manual runs are the spec. An *empty* `pre_execution` is only a warning.\n- **`overall` is reserved.** A goal may not be named `overall` (the `OVERALL` constant); it is the target name meaning \"the loop as a whole\".\n- **Targets must resolve.** `validations[].target` and `success[].target` must name a goal or `overall`. Same for `goals[].depends_on`, `graph.nodes[].depends_on`, `graph.nodes[].goals`, `graph.nodes[].provider`, `graph.nodes[].stage`, and every id in `providers.cascade`.\n- **A judge needs a named standard.** An unnamed standard is an opinion, not a check.\n- **`percentage` success needs a `threshold` in `0.0..=1.0`.** Enforced in the schema with an `if`/`then` and again in `check_success`.\n- **`no_progress_iterations_randomness` must be strictly less than `no_progress_iterations`.** At or past the halt point the perturbation would never fire and the author would never find out. It is also refused when `no_progress_iterations` is `0`, since staleness is never counted then.\n\n### Warnings worth knowing\n\nShort goal descriptions and thin node instructions (\"vague roles produce whatever the model felt like\"), `max_iterations > 100` (\"usually a miscalibrated verifier\"), no budget ceiling of any kind, no `overall` validation, no judge node, a single provider while `enforce_judge_independence` is on, and `objective` mode paired with a `judge` detector.\n\n### Derived analyses\n\nThree passes compute something rather than just checking a field.\n\n**`available_artifacts`** — collects every path named by a `file_exists` detector in *this* config, registered under both the full path and the file stem. A `regex_match` naming anything else has nothing to match and fails closed for the life of the loop, which reads to a human as \"the work is not done\" rather than \"this check was never wired up\". So it is an error, and the message lists the artifacts that *are* available.\n\n**`wave_levels`** — the longest dependency chain ending at each node. Nodes sharing a wave have no path between them, so they are exactly the ones that can dispatch simultaneously; unisolated builders sharing a wave get the \"without worktree isolation\" warning. Chained builders (`draft -> make-media -> publish`) can never overlap and are deliberately *not* warned about — warning about them trains the reader to ignore the warning that matters. The relaxation loop is bounded by node count, so a cyclic graph stops improving instead of hanging.\n\n**`topo_order`** — Kahn's algorithm over `ExecutionGuidelines::phases()`, catching cycles in the arrow list. Both this and `wave_levels` duplicate logic that `loopsmith-graph` owns properly, because the dependency runs the other way and core cannot reach it. That's a stated trade, not an oversight.\n\n---\n\n## APIs the rest of the runtime uses\n\n| Method | Caller | Purpose |\n|---|---|---|\n| `LoopConfig::cascade_for(tier)` | `run/perturb.rs::ask_agent` | Ordered provider list for a tier. Falls back to any provider whose `tiers` is empty or contains the tier. |\n| `LoopConfig::blocking_validations_for(target)` | `run/prompts.rs::build_node_prompt` | The checks a node is actually being held to, injected into its prompt. |\n| `LoopConfig::provider(id)` | validation, routing | Lookup by id. |\n| `LoopConfig::goal_names()` | callers needing the goal set | |\n| `ConstraintSet::merged(global, node)` | `run/dispatch.rs::run_node` | Node rules **append**, node limits **win**. Pinned by `constraint_merge_appends_rules_and_overrides_limits`. |\n| `ConstraintSet::frozen_git_rules()` | parallel node prompts | The git rule set that made large parallel runs safe. |\n| `ExecutionGuidelines::phases()` | `run/phases.rs::new` | Guidelines + arrows resolved into DAG nodes. Deliberately does *not* check cycles or unknown names — that's the scheduler's and validator's job. |\n| `DefaultSkill::init_argv()` | `cmd/skills.rs` | `init_command` split on whitespace. |\n| `is_safe_repo_url(url)` | skill acquisition | `https://` only. |\n\n### Two security boundaries in the config model\n\n`init_command` on a `DefaultSkill` is an **argv line, not a shell line**. It is split on whitespace and executed directly, so `&&`, `|`, and `$(…)` survive as literal arguments. A config that could smuggle a shell into a setup step would make a loop directory an unreviewable install script. `an_init_command_is_argv_not_a_shell_line` asserts the literal `&&` survives as an argument.\n\n`is_safe_repo_url` accepts only `https://`. `git://` and `ssh://` carry no transport authentication a loop could verify, `file://` would let a config reach anywhere on the machine, and `https://-…` would be read by git as a flag rather than a URL.\n\nRelatedly, `ProviderSpec::requires_env` holds **key names only**. Values are never read, substituted, or logged, which keeps credentials out of the ledger.\n\n---\n\n## Where this crate sits\n\n```\nloopsmith  (CLI binary)\n└── loopsmith-mcp ── loopsmith-gate ─┐\n    loopsmith-skills ────────────────┤\n    loopsmith-provider ──────────────┼── loopsmith-core ── loopsmith-util\n    loopsmith-graph ─────────────────┤        (config)      (primitives)\n    loopsmith-memory ────────────────┘\n```\n\nAlmost every CLI subcommand begins by calling `load` or `load_validated`; for a Markdown config the flow runs `execute → load → md::parse_md → build_document → flush_entry → section_shape`, so a malformed heading surfaces as a Markdown-grammar error rather than a serde one. `cmd/validate.rs::execute` calls `load` and `validate` separately so it can print warnings alongside errors, and the guided builder (`guided/mod.rs`) calls `validate` on a partially-built `LoopConfig` after every answer.\n\nThe one rule the whole design rests on lives downstream, but the config model is what makes it enforceable: **a model must not certify its own completion.** `goal_satisfied` is written by `loopsmith-gate` and nothing else, and the gate can revoke — delete a required artifact and a satisfied goal flips back.\n\n---\n\n## Extending the model\n\nAdding a field touches four places, in this order:\n\n1. **`config/loop.schema.json`** — the property, its constraints, and a `description` that says *why*, not just what. Editors surface these.\n2. **The Rust struct** in the matching `config/*.rs` module. Give it `#[serde(default)]` or a named default fn; a literal `true` cannot be a serde default, which is why the shared `yes()` helper exists.\n3. **`validate.rs`** if the field has any relationship to another field. The schema cannot express \"must be less than that other field\", and that is exactly the class of bug that costs an unattended run.\n4. **`md/`** — the Markdown grammar, if the field should be authorable in a `.md` config.\n\nThen a test. The existing tests are the specification for the tricky rules: `a_regex_naming_an_artifact_nobody_produces_is_an_error`, `chained_builders_are_not_reported_as_parallel_writers`, `a_randomness_threshold_at_or_past_the_halt_point_is_refused`, `an_execution_guideline_cycle_is_refused`.\n\n### Notes for contributors\n\n- `Cargo.toml` ships `/src/**/*` and the README only. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping them would hand a published crate tests that cannot pass. Run those tests from a checkout, not a vendored copy.\n- The schema and the Rust types are kept in sync by hand. One place they read differently today: `Detector::Script::expect_exit` is `Option<i32>` in Rust (absent means \"not asserted\") while the schema documents `default: 0`. Check both when touching detector fields.\n- The crate-level doc comment in `lib.rs` still describes the model as A–H; `config/mod.rs` and the README carry the current A–J list. The section letters in `config/mod.rs` are authoritative.\n- The API is not stable across minor versions. Depend on `loopsmith-core` directly only if you are building on loopsmith's internals.","loop-execution-engine":"# Loop Execution Engine\n\n# Loop Execution Engine\n\n`runtime/crates/loopsmith-cli/src/run/`\n\nThe engine is the part of loopsmith that actually runs a loop: it takes a parsed `LoopConfig` and turns it into iterations of dispatched nodes, gate rulings, and a stop decision. Everything else in the CLI either produces the config that goes in (`scaffold`, `guided`) or reads the record that comes out (`watch`, `gate`, `resume`).\n\n`run/mod.rs` is the state machine and nothing else. Each neighbouring module owns one concern, and the split is enforced by what each is allowed to touch:\n\n| Module | Owns | Notable constraint |\n|---|---|---|\n| `mod.rs` | `execute()` — the iteration loop, ledger writes, checkpointing | The only place the `Store` is written during a run |\n| `dispatch.rs` | Isolation, skill resolution, the provider call | `run_node` is store-free so it can run on a worker thread |\n| `prompts.rs` | What a node is told | Pure string building |\n| `stop.rs` | The stop-gate ladder | A pure function over a snapshot; no store, no clock, no providers |\n| `phases.rs` | Section I at runtime — which phase is open | Completion read from gate verdicts only |\n| `summary.rs` | Compressing an iteration for the next one | Facts are Rust-built; narrative is optional and inert |\n| `publish.rs` | Moving isolated work back where the gate can see it | First writer of a path wins; the second is named |\n| `perturb.rs` | Varying approach when the run has stalled | Structurally forbidden from touching goal state |\n| `evolve.rs` | Judge harvesting, skill trials, proposals | — |\n| `export.rs` | The success package | Written only when the gate certified success |\n\n## The central invariant\n\nOne rule explains most of the design decisions here: **`loopsmith-gate` is the only thing that may declare work finished.** A node's own claim that it succeeded is not evidence, and no path exists from model output to `set_goal_state`.\n\nThree mechanisms enforce it:\n\n1. `collect_evidence` is deliberately narrow — artifacts on disk, metrics from `metrics.json`, and parsed judge verdicts. Node output is not included.\n2. `should_stop` runs *after* the gate ruling and is mechanical. No amount of confident output can extend a run past its ceiling.\n3. `run/mod.rs` has a test (`nothing_that_perturbs_or_summarises_can_reach_goal_state`) that greps `perturb.rs` and `summary.rs` for `set_goal_state`, `to_goal_state`, and `GoalState`. Both modules take model output as input, so the prohibition is asserted structurally rather than by review.\n\nThe same rule appears in `phases.rs` (a phase closes on verdicts, not on a node reporting done) and in `export.rs` (`stop.is_success()` is true only for `StopReason::OverallSuccess`, which only `should_stop` produces, and only from `loopsmith_gate::overall_success`).\n\n## One iteration\n\n```mermaid\nflowchart TD\n    A[Read scratchpads + carry-forward summaries] --> B{Stalled?}\n    B -->|yes| C[perturb::choose — seeded]\n    B -->|no| D\n    C --> D[For each wave: chunk by concurrency,<br/>filter by phase + revision ceiling]\n    D --> E[thread::scope — run_node in parallel]\n    E --> F[Join: ledger, episodes, publish worktrees]\n    F --> G[evolve::harvest_judgments → collect_evidence]\n    G --> H[gate::evaluate_all — the only ruling]\n    H --> I[phases.refresh · summary · revisions · trials]\n    I --> J{should_stop}\n    J -->|None| A\n```\n\n### Setup, before the first provider call\n\n`execute()` front-loads everything that can fail cheaply:\n\n- `loopsmith_graph::plan(&cfg.graph)` produces the waves, the chosen concurrency, and the predicted speedup — all of which go into the opening `RunStarted` ledger line.\n- `Phases::new(cfg)` resolves section I and reuses `loopsmith_graph::waves` purely for its cycle and unknown-name checks. An unschedulable phase graph is a config bug; discovering it after the first dispatch means paying for the discovery.\n- `Recorder::new` binds the ledger and the plain-text run log together. Every event from that point goes through one call, so the queryable record and the readable one cannot disagree — a test asserts the line count matches the ledger length.\n- `install_default_skills` runs section J's declared sub-agents, unless `dry_run`. A failure is recorded as `NodeFailed` and the run continues: a loop whose optional helper could not be fetched is degraded, not broken.\n\n### Per-iteration context\n\nTwo things are read once per iteration and shared with every node, so no worker thread touches the store mid-dispatch:\n\n- **Scratchpads** — per-goal notes written by the MCP scratchpad tool, keyed by goal name.\n- **Carry-forward** — `summary::carry_forward` renders the last `context.carry_summaries` iteration summaries. This is the whole cost-control story: the prompt carries compressed history, not episodes, so its size stops growing with the run. Setting `carry_summaries: 0` disables it, and the prompt digest becomes identical across iterations again — which is exactly the failure mode carry-forward was added to fix.\n\n### Dispatch\n\nNodes inside a wave are independent by construction, so ordering only matters *between* waves. Each wave is chunked by `plan.concurrency` and each chunk runs under `std::thread::scope`.\n\nTwo filters apply before a node is added to a chunk:\n\n- **Phase eligibility** (`Phases::eligible`) — nodes with no `stage` are always eligible, so adding section I was not a breaking change for configs that don't use it. Ineligible nodes are skipped *silently*; one line per waiting node per iteration would bury the events that matter.\n- **Revision ceiling** — `revisions[node_id] >= gates.max_revisions_per_node` stops the node being dispatched, with a ledger line saying why. The counter only increments for nodes that ran and left a declared goal unsatisfied; a node that does its job is never capped, and a node with no declared goals is never counted (there is nothing to measure it against).\n\nSkill acquisition happens *before* the threads start, because it touches the store. `ensure_skills` resolves each declared sub-agent, acquiring what's missing when `--acquire-skills` is on and otherwise logging that the node runs without it. An exploration candidate — from `evolve::next_candidate`, or forced by a stall — is attached to the first `Builder` in the chunk. Judges and adversaries keep a fixed toolset so the check does not drift while the work does.\n\n### Collecting outcomes\n\n`run_node` returns a `NodeOutcome` and writes nothing. All ledger writes happen after the join, in a defined order, so the ledger stays ordered even though the work did not. The caller then:\n\n- records the episode, accumulates `tokens_used` / `cost_usd` on the checkpoint, and sets `any_estimated` if any provider's usage was inferred rather than reported;\n- publishes isolated work (below);\n- pushes an `evolve::RanNode` for the trial accounting.\n\n`isolation` is carried out of `run_node` structurally rather than as prose, precisely because the caller has to publish from it and cannot do that from a description.\n\n## Isolation, publishing, and seeding\n\nIsolation is a property of the **wave**, not of the run.\n\n```mermaid\nflowchart LR\n    R[(loop root)] -->|\"seed: paths<br/>others published\"| W1[worktree: builder-a]\n    R -->|seed| W2[worktree: builder-b]\n    W1 -->|\"publish: git status<br/>changed paths\"| R\n    W2 -->|publish| R\n    R --> G[gate collects<br/>evidence here]\n```\n\nWithout `publish`, a `file_exists` detector pointing at an isolated builder's output could never pass — the work is real, on disk, and invisible to the only thing allowed to rule on it. That looks like the builder did nothing, which is worse than the clobbering isolation prevents.\n\n- `changed_paths` shells out to `git status --porcelain -z --untracked-files=all`. `-z` because paths may contain spaces; `--untracked-files=all` because a new artifact in a new directory is the normal case and git's default would collapse it to the directory name. `parse_status` drops the origin field of renames/copies and skips deletions — propagating a removal across the isolation boundary is a different decision from propagating a write.\n- `is_reserved` blocks `state/`, `logs/`, and `.git/` from ever leaving a worktree.\n- **First writer wins.** `claimed_paths` is scoped to the iteration; the second node to write a path is refused and named in the ledger alongside the winner. `published_paths` is broader and lives for the whole run — a node rewriting its own output next iteration is normal and is not a collision.\n- `seed` copies previously-published paths *into* a worktree before the node runs, because a worktree branches from `HEAD` and would otherwise be blind to everything the run produced since — including its own upstream. A node is never seeded with a path it published itself, so in-progress work isn't overwritten by last iteration's copy of it.\n\n## Prompts\n\n`build_system_prompt` carries the loop's static context: the loop name, the `information` block, and the merged `ConstraintSet` (rules, forbidden paths, forbidden commands, human checkpoints).\n\n`build_node_prompt` assembles, in order: the node's instruction; its phase guideline (first, because it is usually about what *not* to do yet); resolved sub-agents; the goals it advances **together with the blocking validations those goals face**; then either the judge output contract or the active perturbation directive; then carry-forward history; then scratchpad notes.\n\nStating the bar in the prompt is load-bearing. A node that does not know how it will be checked cannot aim at the check, and the gate will refuse work that missed a target nobody mentioned.\n\nJudges never receive a perturbation directive. Telling the thing that checks the work to \"try a different approach\" is how a stalled loop talks itself into a lower bar — the same reasoning that keeps judges on their configured tier while `Perturbation::tier_for` may escalate builders.\n\n## Stop gates\n\n`should_stop` is handed a `StopInputs` snapshot and returns `Option<StopReason>`; `None` means continue. Order is not arbitrary:\n\n1. `OverallSuccess` — checked first, so a run that meets the bar on its last permitted iteration reports success rather than \"iteration cap\".\n2. `NoProgress` — `no_progress_iterations: 0` means *disabled*, not *instant*.\n3. `IterationCap`, then `WallClock`, `TokenBudget`, `CostBudget` — budgets, cheapest signal first.\n\nStaleness is measured by `progress_signature`, a sorted fingerprint of `target:satisfied:passed/total` across all verdicts. Identical verdicts fingerprint identically; any change resets the counter.\n\nThis used to be eight inline `if` blocks inside `execute()`, each ending in the same `verdicts = current; break …` dance. The loop now yields `(StopReason, verdicts)` together, which is what removed that.\n\n**Adding a gate:** add a variant to `StopReason`, a `describe()` arm, the field on `StopGates` in `loopsmith-core`, and one `if` in `should_stop` — placed by cost, after the success check. Nothing in `execute()` changes.\n\n## Stall handling\n\nWhen `stale_iterations` reaches `gates.no_progress_iterations_randomness`, `perturb::choose` picks a variation, given the stall depth, the currently failing blocking checks (`failing_checks`), and the last two summaries. The choice can come from a cheap \"randomness agent\" or from a seeded fallback; either way the seed (`perturb::seed_for(run_id, iteration)`) is written to the ledger so the run replays.\n\nPerturbations reach the run in three ways: `Reorder` shuffles nodes within a wave, `Explore` forces an untried sub-agent onto a builder (the one case where trying one is worth the money unasked), and `tier_for` may run non-judge nodes one tier stronger.\n\nPerturbation delays giving up; it does not prevent it. The no-progress gate still fires.\n\n## Summaries\n\n`summary::deterministic` builds the half that cannot be wrong — what ran and via which provider, verdict deltas against the previous iteration, still-failing blocking checks with the gate's own evidence line, closed phases, and spend. Revocations get their own shouted `REVOKED —` line: the gate can take `done` back, and the next iteration must not have to infer that from silence.\n\n`summary::add_narrative` optionally buys prose from `context.summary_provider` at `Tier::Cheap`. It is best-effort, explicitly told it is not deciding whether anything is finished, and nothing reads a narrative to decide goal state. A failed or slow summariser must not fail the iteration it is describing.\n\n## Persistence and resume\n\nThe `Checkpoint` carries `iteration`, `tokens_used`, `cost_usd`, `completed_nodes`, `revisions`, `stale_iterations`, `last_signature`, and `verdicts_json`. It is saved at the end of every iteration that does not stop, and once more after the loop breaks.\n\nThe stop gates' accounting is *restored* from the checkpoint rather than reset, so a resumed run cannot be handed a fresh revision budget and a zeroed no-progress counter every time it pauses. `restore_verdicts` parses `verdicts_json` and drops it on error rather than guessing — a resumed run reporting no deltas on its first iteration is a small loss; one reporting invented deltas is not.\n\n## The success export\n\nOn `StopReason::OverallSuccess`, `export::export_success` writes `<root>/<name>-success/`: `SKILL.md` (frontmatter'd so the package is itself a reusable sub-agent), `EVIDENCE.md` (the gate's rulings, with a header stating that no node's own claim appears in it), the converged `loop.yaml` verbatim, a copy of `out/`, and `run.sh` + `run.cmd` launchers.\n\nThe launchers assume least: POSIX `sh` (macOS ships bash 3.2), `loopsmith` found on `PATH` rather than pinned to a path that existed only on the producing machine, and CRLF with a single trailing `exit /b` on the batch side — an early `exit /b` under `setlocal` reports 0 because the implicit `endlocal` restores the saved errorlevel.\n\n`sanitize()` maps anything outside `[A-Za-z0-9_-]` to `-`, so a loop named `demo/loop` or `../../etc` cannot place its export outside the loop directory.\n\nThere is no flag that writes an export for a run that missed its bar. An export that a confident model could produce would be a certificate that means nothing.\n\n## Where this connects\n\n- **In:** `cmd/run.rs`, `cmd/resume.rs`, and `cmd/watch.rs` all build a `RunOptions` and call `execute`. `cmd/run.rs::exit_code` and `cmd/mod.rs::report_outcome` read `StopReason::is_success`.\n- **Out:** `loopsmith-graph` (waves, concurrency), `loopsmith-gate` (`evaluate_all`, `overall_success`, `Evidence`, `TargetVerdict`), `loopsmith-provider` (`dispatch`, `InvokeRequest`, `digest`), `loopsmith-memory` (`Store`, `Checkpoint`, `Episode`, `IterationSummary`, `LedgerKind`), `loopsmith-skills` (`find_installed`, `acquire`, `install_default`), `loopsmith-core` (config types, `ConstraintSet::merged`).\n- **Sideways in the CLI:** `crate::worktree` (create/remove), `crate::logging` (`Recorder`, `RunLog`), `crate::judgment` (the judge output contract and its parser). `cmd/gate.rs` reuses `collect_evidence` so a standalone `loopsmith gate` sees exactly what the loop sees.\n\n## Testing notes for contributors\n\nThe tests in `mod.rs` run real loops end to end against `SledStore` and BYOK providers built from `echo`, `printf`, `true`, and `false`. That makes them fast and hermetic, and it means the behavioural claims above are asserted rather than described — a stuck node stops at its revision ceiling while the run continues; a satisfying node runs every iteration; three sleepers in one wave finish in roughly one delay; a judge sharing the builder's provider cannot satisfy the gate.\n\nTwo conventions worth keeping:\n\n- **Make success impossible deliberately** when testing a budget gate. Most tests swap `validations[1].detector` (the `overall` target) for `script: false` so the intended ceiling is what stops the run.\n- **Don't assume a Unix command exists.** `sleeper_provider()` returns `ping -n` on Windows because `sleep` isn't a command there — the original spelling failed to spawn instantly, took a different code path, and tripped a wall-clock assertion for reasons unrelated to concurrency.","markdown-yaml-config-interchange":"# Markdown/YAML Config Interchange\n\n# Markdown/YAML Config Interchange\n\nA loop config can be written as YAML or as a Markdown document, and the two are the *same model in two grammars*. This module is the Markdown grammar: a parser that turns a document into a config, a renderer that turns a config back into a document, and the `loopsmith convert` command that moves a file between the two.\n\nThe design commitment worth internalizing before reading any code: **neither the parser nor the renderer knows what a `Goal` or a `StopGates` is.** Both work entirely over `serde_yaml::Value`. Parsing is `markdown → Value → serde::Deserialize`; rendering is `serde_yaml::to_value → Value → markdown`. Every default, every `#[serde(alias)]`, every `deny_unknown_fields` rule from the YAML path applies to the Markdown path for free, because it *is* the YAML path from the `Value` onward.\n\n```mermaid\nflowchart LR\n    MD[\".md document\"] -->|tokenize| T[\"Vec&lt;Tok&gt;\"]\n    T -->|build_document| V[\"serde_yaml::Value\"]\n    V -->|serde::Deserialize| C[\"LoopConfig\"]\n    C -->|serde_yaml::to_value| V\n    V -->|render_md| MD\n```\n\nThe practical consequence: **adding a field to `LoopConfig` requires no change to this module at all.** Adding a whole new *section* requires, at most, one line in `section_shape` and one line in `SECTIONS`.\n\n## The document grammar\n\n```markdown\n# my-loop\n\n- version: 0.1.0\n- description: what this loop is for\n\nProse at the left margin is ignored. Put the reasoning here.\n\n## C. Goals\n\n### ship-it\n- description: the thing is shipped and the suite is green\n- priority: 1\n\n## F. Stop gates\n- max_iterations: 12\n- max_cost_usd: 10.0\n```\n\n| Markdown construct | Meaning |\n|---|---|\n| `# heading` | the config's `name` |\n| `## heading` | opens a section (`## F. Stop gates` → `stop_gates`) |\n| `### heading` | opens an entry inside the current section |\n| `- key: value` | a field, on the open entry or section or at top level |\n| `- bare item` | an element of a sequence |\n| indented bullets | nested mapping or sequence |\n| everything else | documentation — silently dropped |\n\nThat last row is the point of the whole format. Prose, tables, and fenced code blocks at column 0 are dropped by the tokenizer, so a config can explain *why* a goal exists in the same file as the goal.\n\n## Key components\n\n### `heading_to_key` — headings to config keys\n\n`## F. Stop gates` becomes `stop_gates`. Section letters are a navigation aid for humans, not part of the grammar, so a leading `A.` / `B)` / `10.` is stripped, then the rest is lowercased and space/hyphen-joined with underscores. Writing the raw key (`## stop_gates`) works identically.\n\nThe letter-stripping guard is narrow on purpose: the delimiter must appear at index ≤ 2 and everything before it must be alphanumeric. `Pre-execution` has its hyphen at index 3, so the word survives intact — there is a dedicated test (`a_hyphenated_word_is_not_mistaken_for_a_section_letter`) pinning exactly that.\n\n### `SectionShape` / `section_shape` — the only model-aware code here\n\nThis table is the single place the Markdown layer knows anything section-specific, and it exists for one reason: `### ship-it` must become `name: ship-it` for a goal but `id: ship-it` for a graph node.\n\n```rust\npub(crate) struct SectionShape {\n    pub list_field: Option<&'static str>,  // None when the section *is* the list\n    pub key_field: &'static str,           // field a `###` heading fills in\n}\n```\n\nTwo shapes exist:\n\n- **`list_field: None`** — the section is itself a sequence. `goals`, `validations`, `success`, `information`, `pre_execution`, `schedules`, `default_skills`. Entries append directly to `root[\"goals\"]`.\n- **`list_field: Some(field)`** — the section is a mapping with a list inside it. `graph` (`nodes`), `providers` (`providers`), `execution_guidelines` (`items`). Entries append to `root[\"graph\"][\"nodes\"]`, and sibling bullets under the `##` become the mapping's own fields.\n\nA section absent from this table takes no `###` entries at all — it is a plain field bag (`stop_gates`, `constraints`, `skills`, `context`). Writing `###` under one is an error, not a silent misparse.\n\n### `parse_md` — document to `LoopConfig`\n\nTwo passes, both in `parse.rs`.\n\n**`tokenize`** flattens the document to `Vec<Tok>` (`H1`/`H2`/`H3`/`Bullet { indent, text }`). It tracks fenced-block state (toggled by ``` at column 0) and drops everything inside. Headings are only recognized at column 0.\n\nThe one subtle rule is bullet continuation: a non-bullet line indented past the bullet above it, *with no blank line between*, is appended to that bullet's text with a newline. This is how a long `instruction` field spans several lines without being mistaken for prose. Both conditions matter — `after_blank` resets the continuation, which is what separates a wrapped value from a following paragraph.\n\n**`build_document`** walks the token stream with two pieces of state: the currently open `section` and the currently open `entry`. Every heading first calls `flush_entry`, which appends the open entry into its section's list (consulting `section_shape` to decide whether that list lives at `root[sec]` or `root[sec][field]`). Bullets route by that same state:\n\n| Open entry? | Open section? | Bullets land on |\n|---|---|---|\n| yes | — | the entry's fields |\n| no | yes | the section mapping |\n| no | no | top level (the preamble) |\n\nA `###` heading's text is inserted as `Value::from(String)` — deliberately never re-parsed as YAML. `### Recorded the baseline: test count, coverage` would otherwise deserialize as a one-entry mapping and land on a field expecting text.\n\n**`build_block`** handles one indentation level of bullets and recurses for deeper ones. A `key:` with no value owns the deeper bullets below it; a `key:` with no value and nothing below is an explicit `Null`. Mixing `key: value` bullets with bare list items at the same level is rejected — the block is either a mapping or a sequence, never both.\n\n**`split_field`** decides whether `- text` is a field or a bare list item, and its whitespace guard is load-bearing: a key containing whitespace is *not* a key. That is what keeps `- Never git stash. Never git reset.` from becoming a field named `Never git stash. Never git reset`.\n\n**`scalar`** runs each single-line value through `serde_yaml::from_str`, so `12`, `true`, and `[a, b]` arrive as the types they look like, falling back to a plain string. Multi-line values (continuation-folded ones) skip this entirely and stay verbatim — prose containing a colon is not a mapping.\n\nBoth failure modes — malformed document structure and serde rejection — surface as `CoreError::Parse` with `json: \"not attempted: the file was read as markdown\"`, so error output doesn't imply a JSON parse was tried.\n\n### `render_md` — `LoopConfig` to document\n\nThe exact inverse, also value-driven. `SECTIONS` fixes the emission order and headings so a rendered config reads like `LOOP-TEMPLATE.md`; `PREAMBLE` (`version`, `description`) lists top-level keys that render as bullets before the first `##`. Absent or blank sections are skipped entirely.\n\n`render_section` branches on the same `(value, shape)` pairing the parser uses — sequence-with-shape emits `###` entries, mapping-with-shape emits its own fields then its list, mapping-without-shape is a plain field bag. `render_entry` pulls out `key_field` for the `###` line and bullets the rest.\n\nThree encoding rules keep the output round-trippable:\n\n- **`push_string`** quotes only when it must: a string that YAML would read back as something *other* than that same string gets flow-quoted; everything else is written bare so prose stays readable. Multi-line strings are emitted as a first line plus continuation lines at `indent + 4`, matching the tokenizer's folding rule.\n- **`flow`** serializes via `serde_json` — JSON is a subset of YAML, so anything emitted this way round-trips through `scalar` unchanged. Nested lists of objects have no bullet form that survives a round trip, so they are emitted inline as flow.\n- **`is_blank`** omits nulls and empty collections (defaults put them back on the way in) but *deliberately treats the empty string as non-blank*. `value: \"\"` is a value the author chose; dropping it on a required field produces a document that no longer parses — which is precisely what happened to `information[].value` before this distinction existed.\n\nThe known lossy edge: trailing whitespace inside a value cannot survive, because a bullet ends where the line ends. Values are emitted `trim_end`ed. Nothing else is lost.\n\n#### The guard against silent key loss\n\nA top-level key that appears in neither `SECTIONS` nor `PREAMBLE` nor is `name` is *silently dropped* on render. `the_renderer_knows_about_every_top_level_config_key` serializes a parsed config and asserts every key it produces has somewhere to go. This is not hypothetical — the `context` section went missing exactly this way until a round-trip test caught it.\n\n**If you add a section to `LoopConfig`, add it to `SECTIONS`.** That test is the tripwire.\n\n## How it connects\n\n```mermaid\nflowchart TD\n    load[\"loopsmith_core::load\"] -->|is_markdown| parse_md\n    scaffold[\"cli scaffold\"] --> parse_md\n    parse_md --> cfg[\"LoopConfig\"]\n    cfg --> render_md\n    render_md --> guided[\"guided::render\"]\n    render_md --> web[\"web::assemble::render\"]\n    render_md --> convert[\"cmd::convert::execute\"]\n```\n\n- **`loopsmith_core::load`** dispatches on `is_markdown(path)` and calls `parse_md`, so *every* CLI command that loads a config (`watch`, `schedule`, `permissions`, …) reaches this module without knowing it exists. It is not an opt-in path.\n- **`scaffold`** (`loopsmith-cli/src/scaffold.rs`) parses the shipped Markdown template through `parse_md`, so the template is validated by the same code that validates user configs.\n- **`guided::render`** and **`web::assemble::render`** call `render_md` to emit a config the user authored through a wizard or the web UI.\n- **`cmd::convert::execute`** is the only place both directions are visible at once: `load` the file, then emit YAML if `--to-yaml` or the input was already Markdown, otherwise emit Markdown. Direction is inferred, so `convert` is idempotent-by-format rather than a toggle.\n\n## Contributing notes\n\n**Round-trip is a property test, not a hope.** `loopsmith-core/tests/md_roundtrip.rs` covers `parse_md`/`render_md` in both directions plus the specific hazards this module has actually hit: a Markdown config parsing to the same model as its YAML twin, prose and fences being ignored, multi-line instructions surviving, and misspelled fields being refused (proving `deny_unknown_fields` reaches the Markdown path). Any change to tokenizing or emission should come with a round-trip case.\n\n**Where changes usually belong:**\n\n| Change | What to touch |\n|---|---|\n| New config field | nothing here |\n| New field-bag section | `SECTIONS` in `render.rs` |\n| New section taking `###` entries | `section_shape` in `mod.rs` + `SECTIONS` |\n| Changed `###` key field for a section | `section_shape` only — both sides read it |\n\n**Invariants to preserve:**\n\n- The parser stays model-ignorant. If you find yourself matching on a config type name in `parse.rs`, the change belongs in serde instead.\n- Parse and render must read the same `section_shape`. Divergence there is exactly the class of bug round-trip tests exist to catch.\n- Anything the renderer emits must be re-readable by `scalar`, which is why non-obvious values go out as JSON flow.","mcp-server":"# MCP Server\n\n# MCP Server (`loopsmith-mcp`)\n\nA local, stdio-only Model Context Protocol server that exposes a loop's control plane — the schedule, the ledger, the gate's verdict — to any MCP client: an editor, an agent, Claude Code.\n\nThe crate is small on purpose. It is one file, `src/lib.rs`, holding a hand-written JSON-RPC 2.0 loop, a static tool catalogue, and six thin adapters that translate JSON arguments into calls on `loopsmith-core`, `loopsmith-graph`, `loopsmith-gate`, and `loopsmith-memory`.\n\n## The constraint that shapes the API\n\n> A model must not be the thing that certifies its own completion.\n\nThere is no `set_goal_satisfied` tool, no `mark_done`, no `satisfy`. `goal_satisfied` is written by `loopsmith-gate` and by nothing else, reached only through a deterministic detector. An agent connected over this server can *ask* the gate what it currently rules (`loopsmith_gate_evaluate`) and *read* the rulings already recorded (`loopsmith_goal_states`), but it has no path to write one.\n\nThis is not merely a documentation convention — it is asserted in a test:\n\n```rust\n#[test]\nfn there_is_no_tool_for_declaring_a_goal_satisfied() {\n    // The gate owns that ruling. If this ever fails, the independence\n    // guarantee has been quietly removed.\n    let names: Vec<String> = tools() /* ... */;\n    assert!(!names.iter().any(|n| n.contains(\"satisfy\")\n        || n.contains(\"set_goal\")\n        || n.contains(\"mark_done\")));\n}\n```\n\nIf you add a tool, that test is the tripwire. Adding anything whose name matches those patterns fails the build; adding a mutation that *does* the same thing under a different name defeats the design and should not be done.\n\nThe second constraint is transport: stdio only, never a socket. A loop's ledger and goal state are the record of what happened on your machine. Binding them to a port is a different security question than the one this crate answers.\n\n## Protocol surface\n\nJSON-RPC 2.0, newline-delimited, over stdin/stdout. Four methods, which is the whole surface an MCP client needs:\n\n| Method | Behaviour |\n|---|---|\n| `initialize` | Returns `protocolVersion` (`PROTOCOL_VERSION`, currently `\"2024-11-05\"`), `capabilities.tools`, and `serverInfo` naming `loopsmith` at `CARGO_PKG_VERSION` |\n| `notifications/initialized` | Accepted, replies `{}` — but `serve` suppresses the write, see below |\n| `tools/list` | Returns `{ \"tools\": tools() }` |\n| `tools/call` | Dispatches on `params.name`, passing `params.arguments` |\n\nAnything else returns a JSON-RPC error with code `-32601`.\n\nWriting the protocol directly, rather than pulling in an MCP SDK, keeps an async runtime out of the dependency tree for what is fundamentally a blocking read-line loop.\n\n### Request and Response\n\n`Request` deserializes with `#[serde(default)]` on every field except `method`, so a client that omits `jsonrpc` or sends no `params` still parses. `Response` is constructed only through two helpers:\n\n- `Response::ok(id, result)` — sets `jsonrpc: \"2.0\"`, fills `result`, leaves `error` `None`\n- `Response::err(id, code, message)` — fills `error` with `{code, message}`\n\nBoth `result` and `error` carry `skip_serializing_if = \"Option::is_none\"`, so exactly one appears on the wire.\n\n## Error model: two distinct channels\n\nThis is the part most likely to trip up a contributor. There are two kinds of failure and they surface differently:\n\n**Protocol errors** become a JSON-RPC `error` object. Only two are produced: `-32700` for a line that will not parse as JSON, and `-32601` for an unrecognized method.\n\n**Tool errors** — a missing argument, a config that will not load, a store read that fails — are *not* JSON-RPC errors. `call` catches the `Err(String)` from any `tool_*` function and returns a successful response whose result carries `isError: true`:\n\n```rust\nErr(msg) => Response::ok(\n    req.id.clone(),\n    json!({\n        \"content\": [{ \"type\": \"text\", \"text\": msg }],\n        \"isError\": true\n    }),\n),\n```\n\nThat is the MCP convention: the *call* succeeded, the *tool* reported a problem, and the model on the other end gets the message as readable text it can act on. Every `tool_*` function therefore returns `Result<Value, String>` with a human-legible string, never a typed error. Successful results are serialized with `serde_json::to_string_pretty` and wrapped in the same `content` array with `isError: false`.\n\n## Flow of a call\n\n```mermaid\nflowchart TD\n    serve[\"serve(input, output)\"] -->|per line| parse{parses?}\n    parse -->|no| perr[\"Response::err(-32700)\"]\n    parse -->|yes| handle[\"handle(&req)\"]\n    handle -->|initialize / tools/list| okr[\"Response::ok\"]\n    handle -->|tools/call| call[\"call(&req)\"]\n    handle -->|other| merr[\"Response::err(-32601)\"]\n    call --> tools[\"tool_plan / tool_gate / tool_ledger /\n    tool_goal_states / tool_record / tool_scratchpad\"]\n    tools -->|Ok / Err| wrap[\"Response::ok with isError flag\"]\n```\n\n`serve` is the only I/O in the crate. It reads `impl BufRead`, skips blank lines, and writes one line of JSON per response to `impl Write`, flushing after each. Taking generic reader and writer rather than touching `std::io::stdin` directly is what makes the loop testable — `serve_answers_requests_and_stays_silent_on_notifications` drives it with a `Cursor` over a string literal.\n\nOne behaviour worth noting: **notifications get no reply**. `serve` checks `req.id.is_none()` *before* dispatching, still runs `handle` (so side effects happen), then `continue`s without writing. This is per the JSON-RPC spec, and the test asserts that three input lines produce exactly two output lines.\n\n## The tool catalogue\n\n`tools()` returns a static `serde_json` array — name, description, and JSON Schema `inputSchema` per tool. It is a free function, not a method, precisely so the independence test can inspect it without constructing a store.\n\n| Tool | Backed by | Required args |\n|---|---|---|\n| `loopsmith_plan` | `loopsmith_core::load` → `loopsmith_graph::plan` | `config_path` |\n| `loopsmith_gate_evaluate` | `loopsmith_core::load` → `loopsmith_gate::evaluate` | `config_path`, `target` |\n| `loopsmith_ledger` | `Store::ledger` | `run_id` |\n| `loopsmith_goal_states` | `Store::goal_states` | `run_id` |\n| `loopsmith_record_episode` | `Store::put_episode` | `run_id`, `node_id`, `provider_id`, `output` |\n| `loopsmith_scratchpad` | `Store::scratchpad` / `Store::set_scratchpad` | `run_id`, `key` |\n\nTwo of these write. Both write *records of what happened* — an episode, a scratchpad note — rather than *rulings about it*. That distinction is the line the catalogue is drawn along.\n\nEvery tool pulls its required strings through the same helper:\n\n```rust\nfn str_arg(args: &Value, key: &str) -> Result<String, String> {\n    args.get(key)\n        .and_then(|v| v.as_str())\n        .map(|s| s.to_string())\n        .ok_or_else(|| format!(\"missing required argument `{key}`\"))\n}\n```\n\nUse it for any new required string argument — the error text naming the key is what the missing-argument tests assert on.\n\n### `loopsmith_plan`\n\nLoads the config, calls `loopsmith_graph::plan(&cfg.graph)`, and reshapes the `Plan` into a flat JSON object: `waves` (each with `index` and `nodes`), `critical_path`, `critical_path_cost`, `total_cost`, `parallel_fraction`, `concurrency`, `predicted_speedup`, `speedup_ceiling`. The reshaping is deliberate — the wire format is decoupled from `Plan`'s internal layout, so a field rename in `loopsmith-graph` does not silently change what clients see.\n\n### `loopsmith_gate_evaluate`\n\nThe one tool that builds structured input. It constructs an `Evidence` rooted at `workdir` (defaulting to `.`), then folds in optional caller-supplied evidence:\n\n- `metrics`: object values that are `as_f64()` land in `ev.metrics`\n- `artifacts`: object values that are `as_str()` land in `ev.artifacts`\n\nValues of the wrong type are silently skipped rather than rejected. It then calls `loopsmith_gate::evaluate(&cfg, &target, &ev)` and serializes the resulting `TargetVerdict`. `target` is a goal name or the literal `\"overall\"`.\n\nBecause the gate reads the filesystem under `workdir`, this tool is genuinely re-evaluating — delete a required artifact and the verdict changes. That is the same property that lets the gate *revoke* a satisfied goal.\n\n### `loopsmith_record_episode`\n\nAssembles an `Episode` and calls `Store::put_episode`, returning `{\"recorded\": true, \"seq\": <n>}`. Fields split three ways:\n\n- **Required, via `str_arg`**: `run_id`, `node_id`, `provider_id`, `output`\n- **Optional with defaults**: `iteration` (0), `role` (`\"builder\"`)\n- **Optional passthrough**: `tokens`, `cost_usd`, `duration_ms` — accepted from arguments but absent from the declared `inputSchema`\n- **Server-set**: `prompt_digest` (empty), `error` (`None`), `created_ms` (`loopsmith_memory::now_ms()`)\n\n`provider_id` being required is the point, not an oversight: unattributed work cannot be judged for independence, so an episode without provenance is refused. `recording_without_provenance_is_refused` locks that in.\n\n### `loopsmith_ledger`\n\nReads the full ledger, then applies `limit` as a **tail**, not a head:\n\n```rust\nlet n = entries.len().saturating_sub(limit as usize);\nentries = entries.split_off(n);\n```\n\nA caller asking for 20 gets the *most recent* 20, which is what you want when the interesting events are at the end of an append-only log. `saturating_sub` makes an over-large limit a no-op rather than a panic.\n\n### `loopsmith_scratchpad`\n\nRead/write on one entry point, discriminated by whether `value` is present as a string. Present → `set_scratchpad`, returns `{\"written\": true}`. Absent → `scratchpad`, returns `{\"value\": <maybe null>}`. The scratchpad is what carries reasoning between iterations of a loop.\n\n## Generic over the store\n\n```rust\npub struct Server<S: Store> {\n    pub store: S,\n}\n```\n\n`Server` is parameterized on `loopsmith_memory::Store`, not fixed to `SledStore`. The CLI constructs it with a sled-backed store rooted at `--state`; tests construct it over a temp path via `loopsmith_util::testing::temp_path`. Any `Store` implementation works, which is the seam for testing against a fake or for future backends.\n\nNote that `store` is a public field and `Server::new(store)` is the only constructor. Nothing in the crate is `async`, and nothing spawns threads — one server, one stdio pipe, one thread.\n\n## Where it sits\n\nThe MCP crate is a *leaf consumer*: it has no incoming calls from other loopsmith crates and reaches downward into four of them.\n\n```mermaid\nflowchart LR\n    cli[\"loopsmith (CLI)\"] --> mcp[\"loopsmith-mcp\"]\n    mcp --> core[\"loopsmith-core<br/>load\"]\n    mcp --> graph[\"loopsmith-graph<br/>plan\"]\n    mcp --> gate[\"loopsmith-gate<br/>evaluate\"]\n    mcp --> mem[\"loopsmith-memory<br/>Store\"]\n```\n\nIt is reached through the `loopsmith mcp` subcommand, and is not intended as a direct dependency for outside code — the API is not stable across minor versions.\n\n## Running it\n\n`runtime/crates/loopsmith-cli/templates/mcp.template.json` is the registration template. Copy the `mcpServers` block into `.mcp.json` at a project root:\n\n```json\n{\n  \"mcpServers\": {\n    \"loopsmith\": {\n      \"command\": \"loopsmith\",\n      \"args\": [\"mcp\", \"--state\", \"./state\"],\n      \"env\": {}\n    }\n  }\n}\n```\n\nOr register it with Claude Code directly:\n\n```bash\nclaude mcp add loopsmith -- loopsmith mcp --state ./state\n```\n\nThe template also documents two fallbacks for when the binary is not on `PATH`: an absolute path (`/usr/local/bin/loopsmith`), and a dev loop through `cargo run --release -p loopsmith -- mcp --state ./state`.\n\n## Packaging note\n\n`Cargo.toml` sets `include = [\"/src/**/*\", \"/README.md\"]`. This is not incidental tidiness — the integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain. Shipping the tests would hand a published crate tests that cannot pass, so only `src/` and the README travel.\n\n## Contributing\n\n**Adding a tool** is four edits, all in `src/lib.rs`:\n\n1. Add the entry to `tools()` with a complete `inputSchema` — `tools_list_is_non_empty_and_every_tool_has_a_schema` asserts every tool has `inputSchema.type == \"object\"`.\n2. Add a `\"name\" => self.tool_x(&args)` arm to `call`.\n3. Write `fn tool_x(&self, args: &Value) -> Result<Value, String>`, pulling required strings through `str_arg` and mapping downstream errors with `.map_err(|e| e.to_string())`.\n4. Add a test using the `server()` / `call()` / `text_of()` / `is_error()` helpers already in the test module.\n\n**Do not** add a tool that lets a caller assert a goal is complete, under any name. The gate owns that ruling; the absence of such a tool is the crate's reason for the shape it has.\n\n**Keep the failure modes intact.** The tests encode three behaviours that are easy to break by accident: malformed JSON produces a parse error rather than a panic, notifications produce no output line, and a missing argument comes back as a tool error naming the argument. All three are load-bearing for a client that has to keep talking to the server after a mistake.","memory-episode-store":"# Memory & Episode Store\n\n# Memory & Episode Store\n\n`loopsmith-memory` is the persistence plane for a loopsmith run. Everything that must survive a crash, a schedule boundary, or a context reset lives here — and nothing else does. It has no opinion about scheduling, provider routing, or verification; it stores what those layers decide and hands it back in a deterministic order.\n\nTwo rules shape the whole crate:\n\n1. **Validate before writing.** Bad data compounds. One wrong record becomes a retrieved \"fact\", which becomes reasoning, which becomes another record. Writes reject malformed input instead of storing it.\n2. **The store is a trait.** `sled` is the shipped backend but is effectively frozen upstream. Callers depend on `Store`; swapping the engine should not touch them.\n\nA third constraint is architectural rather than stylistic, and it explains several otherwise-odd design choices: **a model must not certify its own completion.** `GoalState { satisfied: true }` is written by `loopsmith-gate` and nothing else.\n\n## Layout\n\n```\nsrc/\n  lib.rs         records, the Store trait, score_skills, open()\n  sled_store.rs  SledStore — the shipped backend, key layout, lock handling\n```\n\n`lib.rs` is data and contract; `sled_store.rs` is the only file that knows what a database is. Adding a record type means touching both; adding a backend means touching only the second.\n\n## The records\n\nSeven record types cover the plane. They differ in who writes them and what they are for.\n\n| Record | Written by | Scope | Answers |\n|---|---|---|---|\n| `Episode` | the runtime, per node call | per run | What did this node do on this iteration? |\n| `GoalState` | **only** `loopsmith-gate` | per run + target | Has this goal been met? |\n| `LedgerEntry` | anything | per run, append-only | What happened, in order? |\n| `Checkpoint` | the runtime | one per run | Where do we resume, and how much budget is left? |\n| `IterationSummary` | the runtime (facts) + a model (narrative) | per run + iteration | What did iteration N amount to? |\n| `SkillTrial` | `src/run/evolve.rs` | **global** | Did this skill help? |\n| `Proposal` | `src/run/evolve.rs` | per run | What does the loop want changed? |\n\nPlus a keyless one: the **scratchpad**, a plain `String` at `(run_id, key)`, used to carry reasoning between iterations for a single goal.\n\n### Episode\n\nThe record of one node call. `provider_id` is not bookkeeping — it is recorded so the gate can verify a judge did not run on the same provider as its builder. `Episode::check` (private, called from `put_episode`) rejects an empty `run_id`, `node_id`, or `provider_id`.\n\n### GoalState\n\nThe gate's ruling on one target: `passed` / `failed` / `total`, a human-readable `reason`, and the `iteration` at which the ruling was made. `pass_rate()` is `passed / total`, guarding the zero case.\n\nCrucially the gate can **revoke**: delete a required artifact and a previously satisfied goal flips back to unsatisfied on the next evaluation. Goal state is a key-value slot per target (`gs/<run>/<target>`), not an append log, so the latest ruling is the only ruling.\n\n### LedgerEntry and `LedgerKind`\n\nAppend-only audit trail. The kind enum spans the whole lifecycle — `RunStarted`, `IterationStarted`, `NodeDispatched`, `NodeSucceeded`, `NodeFailed`, `GateEvaluated`, `GoalSatisfied`, `GoalRevoked`, `SkillAcquired`, `ProposalWritten`, `StopGateTriggered`, `RunFinished`.\n\nNote `StopGateTriggered` sits alongside the success kinds. A node that hits its ceiling constantly is a signal, and that signal is invisible if only completions are logged.\n\n### Checkpoint\n\n`Checkpoint` carries the obvious resume data (`iteration`, `completed_nodes`, `tokens_used`, `cost_usd`) and, less obviously, **the stop gates' own accounting**:\n\n- `revisions: BTreeMap<String, u32>` — how many times each node has run with its goals still unsatisfied. This is what `max_revisions_per_node` bounds.\n- `stale_iterations` — consecutive iterations in which no verdict moved.\n- `last_signature` — the rulings' signature at the last iteration.\n- `verdicts_json` — last iteration's gate rulings, serialised as text.\n\nWithout these on the checkpoint, a loop that resumes often would be handed a fresh revision budget and a zeroed no-progress counter every time, and a run going nowhere could never reach the halt that exists to stop it. The ceilings would apply only to runs that never paused. `checkpoint_survives_reopen` asserts each of these fields specifically for that reason.\n\n`verdicts_json` is text rather than the gate's verdict type on purpose: `loopsmith-gate` depends on `loopsmith-memory`, and keeping that direction is what keeps the only constructor of a satisfied `GoalState` inside the gate. Reversing it to get a typed field would break the rule the whole design rests on.\n\n`completed_nodes` means \"has this node ever run in this run\", not \"did it run this iteration\" — phase completion is computed from it, so the narrower reading would reopen a phase every iteration.\n\n`Checkpoint::new(run_id)` builds the zero state, and the tests use it with struct update syntax:\n\n```rust\nstore.save_checkpoint(&Checkpoint {\n    iteration: 7,\n    completed_nodes: vec![\"a\".into(), \"b\".into()],\n    revisions: [(\"a\".to_string(), 2u32)].into_iter().collect(),\n    ..Checkpoint::new(\"r1\")\n})?;\n```\n\n### IterationSummary\n\nThe record that makes a long run affordable. Without it, iteration N+1 either re-sends every prior episode (unbounded growth) or sends nothing (which is how a stalled loop ends up producing the byte-identical prompt it already failed with).\n\nThe `facts: Vec<String>` / `narrative: Option<String>` split is the same rule again in miniature: `facts` is written by Rust from the gate's own verdicts and is always present; `narrative` is optional model prose and is never load-bearing. `render()` produces the markdown block injected into a later prompt — heading, headline, bullet facts, then the narrative if it is non-empty.\n\nSummaries are keyed by **iteration**, not by sequence, so re-summarising an iteration replaces it. A sequence key would append a second version that later reads would silently count twice.\n\n### SkillTrial, `score_skills`, and `SkillScore`\n\n`SkillTrial` is the substrate of self-evolution. A loop cannot reason its way to knowing which sub-agents earn their place — it has to try them and watch the gate. Each trial pairs a skill with the gate outcome that followed (`pass_rate`, `satisfied`), so the ranking is grounded in verdicts rather than in the model's opinion of its own tooling.\n\nTrials are the one record keyed **globally** (`st/<seq>`), deliberately not per run: a skill's track record is only meaningful across runs, and one bad loop should not erase it. `Store::skill_trials()` accordingly takes no `run_id`.\n\n`score_skills(&[SkillTrial]) -> Vec<SkillScore>` folds trials by skill name into counts and a mean pass rate, then sorts by `satisfaction_rate()` descending with `trials` as the tiebreak. It reports every skill including one-trial ones — the doc comment is explicit that a skill with too few trials should be reported but not acted on. One lucky run is not evidence; the function does not enforce a minimum, so callers must.\n\nCallers: `src/cmd/skills.rs::scores` for the CLI view, and `src/run/evolve.rs::skill_proposals` when turning rankings into proposals.\n\n### Proposal and expiry\n\nA change the loop wants but may not apply itself. `ProposalKind` covers `AdoptSkill`, `DropSkill`, `TrySkill`, `ReshapeGraph`, and `ChangeCriteria` — the last of which is \"anything touching goals, validations, or success criteria\" and is always a proposal, never an action.\n\nExpiry exists because a proposal is evidence about a moment. \"This skill correlated with satisfied goals across the last three iterations\" is a claim about a graph and a config that have both since been hand-edited. Nothing expires a proposal automatically and nothing deletes one — the record of what the loop wanted is worth keeping — but a reviewer needs to be told which suggestions answer a question nobody is asking any more.\n\n`Proposal::default_lifetime_ms` is an exhaustive match, so a new kind cannot be added without deciding its lifetime:\n\n| Kind | Lifetime | Why |\n|---|---|---|\n| `TrySkill` | 7 days | Names a marketplace listing that may be gone |\n| `AdoptSkill`, `DropSkill` | 30 days | Names a skill set the reviewer has probably changed |\n| `ReshapeGraph` | 30 days | About a graph shape that drifts |\n| `ChangeCriteria` | never | A question about the goal, not an observation about a run |\n\n`with_default_expiry()` stamps the lifetime onto `created_ms` and **leaves an explicitly-set `expires_ms` alone**; it uses `checked_add`, so an absurd `created_ms` yields `None` rather than wrapping. `is_expired(now_ms)` treats the expiry instant itself as already stale.\n\n`expires_ms` carries `#[serde(default)]` for a concrete reason: proposals live in a sled store that outlives the binary that wrote them. Without it, records written before the field existed fail to parse and `loopsmith proposals` reports a backend error on a perfectly healthy store. `a_proposal_written_before_the_field_existed_still_deserialises` pins that. Every optional field on `Episode`, `LedgerEntry`, `SkillTrial`, and `Checkpoint` is defaulted for the same on-disk-compatibility reason.\n\n## The `Store` trait\n\n```rust\npub trait Store: Send + Sync { /* ... */ }\n```\n\n`Send + Sync` because the runtime dispatches nodes concurrently and shares one store across them. The surface is deliberately flat — no transactions, no queries, no cursors. Each record type gets a put and a read, reads are scoped by `run_id` (except `skill_trials`), and there is `runs()` and `flush()`.\n\nTwo ordering guarantees callers rely on:\n\n- `episodes`, `ledger`, `proposals` return in insertion order.\n- `summaries` returns oldest first.\n\nErrors are `MemError`: `Backend(String)` for engine failures, `Serde` (from `serde_json`), `Rejected(String)` for validation, `NotFound(String)`. `Rejected` is the interesting one — it means the write did not happen and the store is unchanged, which is what `malformed_episodes_are_rejected_not_stored` asserts by reading back an empty list.\n\n`open(path)` at the crate root is the convenience entry point; it returns a concrete `SledStore`.\n\n## `SledStore`\n\n### Key layout\n\nKeys are prefix-and-zero-padded so `scan_prefix` returns records in insertion order without a secondary index. Twenty digits of zero padding makes `u64` sequence numbers sort lexicographically.\n\n```text\nep/<run>/<seq:020>      episode\ngs/<run>/<target>       goal state\nlg/<run>/<seq:020>      ledger entry\nck/<run>                checkpoint\nsp/<run>/<key>          scratchpad\nsu/<run>/<iter:020>     iteration summary\nst/<seq:020>            skill trial (global, deliberately not per run)\npr/<run>/<seq:020>      proposal\n```\n\nSequences come from `next_seq()`, which wraps `sled::Db::generate_id()` — a single monotonic counter shared by every keyspace. Only relative ordering within a prefix matters, so sharing one counter costs nothing.\n\n`runs()` is derived rather than maintained: it scans `ck/` and strips the prefix off each key. A run exists precisely when it has a checkpoint. `BTreeSet` gives sorted, deduplicated output.\n\nValues are JSON via `serde_json`, except scratchpads, which are stored as raw UTF-8 bytes and read back through `from_utf8_lossy`.\n\n### Validation, per method\n\nValidation lives in the backend rather than in the trait, so each implementation owns it:\n\n| Method | Rejects |\n|---|---|\n| `put_episode` | empty `run_id`, `node_id`, or `provider_id` (via `Episode::check`) |\n| `set_goal_state` | empty `target`; `passed + failed > total` |\n| `append_ledger` | empty `run_id` |\n| `put_summary` | empty `run_id` |\n| `put_skill_trial` | empty `skill`; `pass_rate` outside `0.0..=1.0` |\n| `put_proposal` | empty `run_id` |\n\n`save_checkpoint` and `set_scratchpad` validate nothing. `save_checkpoint` instead calls `flush()` immediately after the insert — a checkpoint is the resume contract, and it should not depend on the background flusher beating a crash.\n\n### Opening under lock contention\n\n`SledStore::open` is not a thin wrapper around `sled::open`. Sled holds a file lock, and it releases that lock as part of cleanup — neither `drop` nor process exit makes that instantaneous. So \"locked\" usually means \"locked for another millisecond\", and failing immediately turns an ordinary race into a user-visible error.\n\nThis became reachable with the web UI: pressing Run and then Status spawns two processes back to back, and the first is often still exiting when
