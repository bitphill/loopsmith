var PAGES = {"cli-command-surface":"# CLI Command Surface\n\n# CLI Command Surface\n\nThe `loopsmith` binary crate (`runtime/crates/loopsmith-cli`, published as the package **`loopsmith`**) is the control plane for the whole workspace. Everything a user can ask loopsmith to do arrives here as an argv vector, is turned into a single typed `Command`, and is routed to exactly one module that does the work by calling into the library crates. No business logic lives in this layer — the gate, the graph planner, the store, and the provider cascade all live elsewhere. This crate owns the *grammar*, the *routing*, the *exit codes*, and the *human-readable output*.\n\nThe design constraint that shapes it: **the browser UI and the terminal are the same surface.** The web front end shells out to this binary rather than reimplementing anything, so it can never drift from what `loopsmith --help` lists.\n\n---\n\n## The three files that define the surface\n\n| File | Owns |\n|---|---|\n| `src/main.rs` | Process entry. Nothing else. |\n| `src/cli.rs` | The clap grammar: `Cli`, `Command`, `SkillsAction`, and `Cli::resolve`. |\n| `src/cmd/mod.rs` | `dispatch`, plus the four helpers every command shares. |\n\nThey are separated on purpose: the argument grammar is meant to be readable in one sitting, without twenty command bodies interleaved with it.\n\n### Entry path\n\n```mermaid\nflowchart LR\n    A[\"argv\"] --> B[\"Cli::parse()<br/>(clap)\"]\n    B --> C[\"Cli::resolve()<br/>collapse --web / --guided\"]\n    C --> D[\"cmd::dispatch(Command)\"]\n    D --> E[\"cmd::&lt;name&gt;::execute()\"]\n    E --> F[\"ExitCode\"]\n    C -.->|\"Err(String)\"| G[\"eprintln! + FAILURE\"]\n    E -.->|\"Err(String)\"| G\n```\n\n`main` is four lines of substance:\n\n```rust\nlet result = cli::Cli::parse().resolve().and_then(cmd::dispatch);\n```\n\nBecause `resolve` returns the same `Result<_, String>` shape a command body returns, a grammar error and a runtime error take the identical exit path — one `eprintln!(\"error: {e}\")`, one `ExitCode::FAILURE`.\n\n### `Cli::resolve` — one command, two spellings\n\n`--web` and `web`, `--guided` and `guided`, mean exactly the same thing. `resolve` is the single place that knows this, so `dispatch` stays a pure match over `Command`:\n\n| Invocation | Result |\n|---|---|\n| `--web` alone | `Command::Web { port: None, no_open: false }` |\n| `--guided` alone | `Command::Guided { path: None, edit: None }` |\n| `--web --guided` | error — two front ends onto the same config; picking one would guess wrong half the time |\n| `--web <subcommand>` | error — a contradiction, not a shorthand |\n| no flag, no subcommand | error naming `guided` and `web` as the two ways in |\n\nEach refusal names the flag involved, which is why the requirement is enforced here rather than expressed as a clap constraint that would produce a generic complaint.\n\n---\n\n## The command contract\n\nEvery command module exposes a function returning `Result<ExitCode, String>` — never `std::process::exit`. Two consequences:\n\n- A command is callable from a test (and from `src/web/`, which drives the same binary) without tearing down the process.\n- The exit code is decided in one place, and the *meaning* of a non-zero exit is a per-command decision rather than an accident.\n\nNon-zero exits that matter:\n\n- `validate` — `FAILURE` when the report has errors, or when `--strict` and there are warnings.\n- `gate` — `FAILURE` when the target is not satisfied. This is what makes `loopsmith gate` usable as a shell predicate.\n- `run` / `resume` — `FAILURE` when `out.stop.is_success()` is false, so a scheduler or CI step notices a run that missed its bar without parsing output (`cmd::run::exit_code`).\n- `skills install` — `FAILURE` if any declared skill failed to materialise; the others still install.\n- `doctor` — **always** `SUCCESS`, deliberately. Reporting a constraint is not the same as the machine being unusable, and a non-zero exit would fail a CI step that was working fine.\n\n### Shared helpers (`src/cmd/mod.rs`)\n\n```rust\npub fn config_dir(config: &Path) -> PathBuf\npub fn config_file_name(config: &Path) -> String\npub fn open_store(config: &Path) -> Result<loopsmith_memory::SledStore, String>\npub fn report_outcome(out: &RunOutcome)\n```\n\n`config_dir` exists because `Path::parent()` yields `Some(\"\")` for a bare `loop.yaml`, and an empty path is not a spawnable working directory — it normalises to `.`. Everything that resolves a loop's home (`state/`, `logs/`, worktrees, detector scripts) goes through it. `config_file_name` is its counterpart for generated scripts, which `cd` into the loop directory first and therefore want the relative name.\n\n`open_store` fixes the store location at `<config_dir>/state` — the one place that decision is made. `report_outcome` is the shared end-of-run summary printed by both `run` and `watch`: iterations, stop reason, spend (flagged when estimated because no provider reported usage), proposal count, per-target verdicts, log path, and the export path when a run converged.\n\n---\n\n## The commands\n\nGrouped by what they touch, not by their order in the enum.\n\n**Authoring a loop**\n- `new --path <dir>` → `cmd/new.rs` → `scaffold::scaffold`. `--path` is mandatory. Config can be handed over whole (`--config-file`, `--config-stdin`, `--markdown`) or left as the starter. `--git` initialises a repository. Nothing here blocks on a prompt — a command that waits for a keypress cannot run from a Makefile or from an agent setting the loop up.\n- `guided [DIR] [--edit FILE]` → `crate::guided::execute`. The terminal wizard; it ends by calling `scaffold::scaffold` with a `ProvidedConfig`, the same path `new --config-stdin` takes.\n- `web [--port] [--no-open]` → `cmd/web.rs`, behind the `web` feature.\n- `convert`, `validate --strict` — grammar translation and the A–J check.\n\n**Understanding before running**\n- `plan` → `loopsmith_graph::plan`: waves, critical path, total cost, parallel fraction `p`, chosen concurrency, predicted speedup and its infinite-worker ceiling. Then `unisolated_parallel_writers` warns about builder nodes that may run concurrently in one directory.\n- `doctor [config]` — see below.\n- `providers` → `loopsmith_provider::availability` per declared provider, printing `av.why_not()` when unavailable.\n- `permissions --write` → `crate::permissions::{required, merge_into, render}`.\n\n**Running**\n- `run [--run-id] [--dry-run] [--no-acquire] [--verbose]` and `resume <run-id> [--verbose]` both funnel into `cmd::run::start`, which loads *validated* config (`load_validated`, not bare `load`), opens the store, and calls `crate::run::execute`. Resume is the same operation with `resume: true` and a caller-supplied run id; the default run id is `run-{now_ms}`.\n- `watch [--max-runs] [--check]` — resident polling; see below.\n- `schedule [--install]` — hands the schedule to launchd/crontab/systemd/schtasks.\n\n**Reading what happened**\n- `status <run-id>` → goal states plus the checkpoint iteration.\n- `ledger <run-id> [--limit N]` → the last `N` append-only entries (default 50, tail-biased via `saturating_sub`).\n- `proposals <run-id>` → what the loop wants changed about itself, with a coarse `age()` and a stale marker. Stale proposals are reported, never deleted: the record is the only account of why the loop asked.\n- `gate --target <goal> --workdir <dir>` — a one-shot gate evaluation against the working tree. It calls `crate::run::collect_evidence` with an empty judgment vector, so subjective checks correctly report that no judgment was recorded.\n\n**Sub-agents** — `skills list|search|acquire|install|scores`, all in `cmd/skills.rs`.\n\n**Housekeeping** — `prune` (removes worktrees for `isolated: true` nodes via `worktree::create`/`worktree::remove`), `mcp --state <dir>` (serves `loopsmith_mcp::Server` on stdin/stdout).\n\n---\n\n## Commands worth reading closely\n\n### `doctor` — probes, then consequences\n\n`cmd/doctor.rs` is the antidote to environmental failures reported far from their cause. It prints the `Platform::detect()` result (os, userland, bash version, whether `/bin/sh` is bash in posix mode, which scheduler is installed), locates `git sh sed awk curl`, and then — the part that matters — turns each probe into a *consequence*:\n\n- BSD userland → `sed -i` needs a backup suffix, `stat` takes `-f`; source `scripts/compat.sh` instead of branching by hand.\n- Unknown userland → `compat.sh` assumes BSD, which fails loudly on GNU rather than quietly doing the wrong thing.\n- No scheduler → `schedule` has nothing to hand the loop to; `watch` still works.\n- No git → `isolated: true` nodes share a directory, and section J `github` sub-agents cannot be fetched.\n\nOne rendering detail is load-bearing: `sed_in_place()` returns an empty argument on BSD, and it is printed as `''` rather than joined away — that empty argument *is* the difference between the two userlands.\n\nWith a config argument, `config_notes` adds config-specific findings. It resolves every `Detector::Script` command the way the runtime will: no shell, so `command` is argv[0]; a relative path resolves against the loop directory, a bare name against `PATH`. Missing, non-existent, and non-executable each get their own message (the last suggests `chmod +x`). An unloadable config degrades to one note rather than an error.\n\n### `watch` — the resident loop\n\n`cmd/watch.rs` refuses immediately if `schedules` is empty or entirely `Trigger::Manual`, because `watch` would otherwise sleep forever. Then it derives a poll interval from the triggers and loops:\n\n1. Read goal state fresh from the latest run each tick, so a `goal_satisfied` trigger sees a run started elsewhere.\n2. `watcher.poll(...)` — the watcher is constructed with `Watcher::ignoring(vec![format!(\"{}-success\", cfg.name)])`, because the success export is written *into* the loop directory and a `file_change` trigger on the root would otherwise see it and start another run, which would write it again.\n3. On a fire, run with `verbose: false` (a resident watcher already prints to the terminal; detail belongs in the per-run log) and `report_outcome`.\n4. A failed run prints to stderr and the loop continues — that is the difference between a scheduler and a one-shot.\n\n`--check` prints what would fire and exits.\n\n### `new` / `scaffold.rs` — materialising a loop directory\n\n`cmd/new.rs` is thin; `src/scaffold.rs` does the work. It writes the config, `.gitignore`, `README.md`, `.mcp.json`, `marketplaces.json`, `permissions.template.json`, a real `.claude/settings.local.json` grant, `run.sh`/`resume.sh`/`run.cmd`/`resume.cmd`, and `scripts/compat.sh`, plus the `state/ logs/ out/ proposals/ generated-skills/ .claude/skills/` directories.\n\nFour decisions in this file are worth knowing before you change it:\n\n**`guard_path` refuses dangerous homes.** Empty path, filesystem root, and the user's home directory are rejected — but the load-bearing check is `install_root()`. A loop edits files, installs sub-agents, and writes state; pointing one at the loopsmith checkout would let a loop modify its own runtime. `install_root` walks up from `current_exe` looking for the pair `config/loop.schema.json` + `runtime/Cargo.toml`, which covers `cargo run`, an installed release binary, and a symlink into a checkout. The refusal suggests a working alternative (`--path ~/loops/<name>`), and there is a test asserting the installation is byte-identical after a scaffold.\n\n**`binary_path()` deliberately does not canonicalize an already-absolute path.** Package managers install behind a stable symlink into a versioned directory — Homebrew's `/usr/local/bin/loopsmith` → `.../Cellar/loopsmith/0.1.2/bin/loopsmith`. Resolving that pins the version, so every loop created before an upgrade would have a dead path in its launcher. A *relative* `current_exe` is still canonicalized, because cron and launchd inherit neither a working directory nor a `PATH`.\n\n**Both script flavours are written on every platform.** `.sh` is POSIX with `#!/bin/sh` (macOS ships bash 3.2.57; bash-4 syntax fails on the most common developer machine there is), and `.cmd` ships alongside it unconditionally because a loop directory outlives the machine that made it. The `.cmd` header carries a hard-won invariant: **exactly one `exit /b`, on the last line.** `setlocal` saves the errorlevel and the implicit `endlocal` restores it, so an early `exit /b 127` reports 0; `endlocal & exit /b` does not fix that inside a nested `if (…)` block. Every path sets `CODE` and falls through to `:loopsmith_done`. `enabledelayedexpansion` and `!ERRORLEVEL!` are required for the same class of reason — a parenthesised block is parsed as a unit before it runs. `crlf()` converts the output, because `cmd.exe` misparses LF-only batch files with no useful message.\n\n**A supplied config is parsed before anything is written.** `--config-file`/`--config-stdin` text goes through `parse_str` or `parse_md` first; a rejected config leaves no directory contents, because a loop directory holding an unreadable config is worse than no directory. Grammar is chosen by file extension (`loopsmith_core::is_markdown`), never guessed from content — a stray `#` heading must not silently reinterpret someone's YAML.\n\n`starter_config` builds the shipped default: a two-node `build → judge` graph, a `primary` goal, one `file_exists` and one `script` validation, the full stop-gate set, `Trigger::Manual`, and an **empty section J** so a fresh loop does not reach the network on its first run. Its `pre_execution` steps are `done: false` on purpose — the starter must *fail* `validate` until a human confirms they ran the task by hand. There is a test asserting exactly that in both directions.\n\nThe templates (`mcp.template.json`, `permissions.template.json`, `compat.template.sh`, `marketplaces.json`) are `include_str!`'d from `templates/` inside the crate rather than read from an install directory. That makes a new loop self-contained and makes it impossible for `new` to touch the checkout it was launched from — and it is also a packaging constraint: a published crate tarball holds only its own directory, so an `include_str!` reaching above the crate root compiles locally and fails `cargo package --verify`.\n\n---\n\n## `logging.rs` — the ledger's readable twin\n\nThe sled ledger is durable and queryable, but you cannot `tail -f` a database. `RunLog` writes `<loop>/logs/<run-id>.log` — one aligned line per ledger entry, timestamps in ISO UTC via `format_utc` (which reuses `schedule::civil_from_unix`, UTC for the same reason the cron matcher is: deriving a local offset is unsound in a multithreaded process on Unix). Newlines in `detail` are flattened so one event is always one record.\n\nThree properties are enforced by tests:\n\n- Logs land in `logs/`, **not** `state/` — sled owns that directory and the watcher ignores everything inside it.\n- `sanitize()` maps anything outside `[A-Za-z0-9_-]` to `-`, so a hand-passed `--run-id` of `../../etc/passwd` cannot write outside `logs/`.\n- An unwritable location degrades to a silent no-op. A full disk is a reason to lose the log, not to kill a run doing useful work.\n\n`Recorder<'a, S: Store>` bundles store + run id + `RunLog`, and exposes one method, `entry(...)`, that writes to both. That single choke point is what keeps the ledger and the log from disagreeing about what happened; `src/run/` and `src/run/dispatch.rs` record through it exclusively.\n\n---\n\n## How this crate connects outward\n\nCommand bodies are almost entirely calls into the workspace libraries:\n\n| Crate | Reached from |\n|---|---|\n| `loopsmith-core` | `load`, `load_validated`, `validate`, `parse_str`/`parse_md`, `is_markdown` — used by `validate`, `plan`, `gate`, `providers`, `prune`, `watch`, `doctor`, `scaffold` |\n| `loopsmith-memory` | `open` + the `Store` trait — `ledger`, `goal_states`, `checkpoint`, `proposals`, `skill_trials`, `score_skills` |\n| `loopsmith-graph` | `plan`, `unisolated_parallel_writers` (`cmd/plan.rs`) |\n| `loopsmith-gate` | `evaluate` (`cmd/gate.rs`) |\n| `loopsmith-provider` | `availability` (`cmd/providers.rs`), `starter_providers` (`scaffold.rs`) |\n| `loopsmith-skills` | `list_installed`, `search_marketplace`, `search_skills_cli`, `acquire`, `install_default` |\n| `loopsmith-mcp` | `Server::new(store).serve(stdin, stdout)` (`cmd/mcp.rs`) |\n| `loopsmith-util` | `which`, `is_executable`, `now_ms`, `platform::{Platform, Os, home_dir}`, and `testing::` in dev |\n\nCrate-internal siblings the command layer depends on: `run/` (`RunOptions`, `RunOutcome`, `execute`, `collect_evidence`, `stop::is_success`), `permissions.rs`, `schedule.rs` (`Watcher`, `poll_interval`, `now_unix`, `civil_from_unix`), `worktree.rs`, `guided/`, and `web/`.\n\n---\n\n## Feature gating\n\nThe `web` feature is on by default and pulls in `axum` + `tokio` — the entire async tree. It is default-on because the people the browser UI exists for are the least likely to know a cargo flag; `cargo install loopsmith --no-default-features` drops it.\n\nThe gating is done twice, and both halves matter:\n\n```rust\n#[cfg(feature = \"web\")]\nCommand::Web { port, no_open } => web::execute(port, no_open),\n#[cfg(not(feature = \"web\"))]\nCommand::Web { .. } => Err(\"this build has no web UI. Rebuild with the `web` feature: …\"),\n```\n\n`Command::Web` stays in the grammar unconditionally. A build without the feature still *parses* `loopsmith web` and tells you which flag brings it back, rather than pretending the command does not exist.\n\n---\n\n## Adding a command\n\n1. Add a variant to `Command` in `src/cli.rs`. The doc comment is the `--help` text — write it for someone who has not read the README.\n2. Add `pub mod <name>;` and a `pub fn execute(...) -> Result<ExitCode, String>` in `src/cmd/<name>.rs`. Use `config_dir` / `config_file_name` / `open_store` rather than re-deriving paths.\n3. Add the arm to `dispatch`. Keep it a flat match — destructure the variant and hand the fields straight to `execute`. If the command grows more than a handful of fields, follow `new`'s pattern and pass a struct (`new::NewArgs`).\n4. Decide the exit code deliberately. `SUCCESS` unless a non-zero exit is *information a script wants*.\n5. Never call `std::process::exit`, and never prompt for input — both break the web UI, `run.sh`, and CI, all of which drive this binary non-interactively.","distribution-installers":"# Distribution & Installers\n\n# Distribution & Installers\n\nEverything outside `runtime/` that gets a compiled `loopsmith` binary onto a user's machine. The Rust workspace produces one artifact; this module is the six different ways people ask for it — `curl | bash`, `install.bat`, `npm install -g`, `pip install`, `brew install`, `cargo install` — plus the version-synchronisation script that keeps those channels from drifting apart.\n\nNothing here is Rust, nothing here is imported by the runtime, and nothing here runs during a loop. It is a separate program written in five languages whose only contract with the rest of the codebase is: *the workspace root is `runtime/`, the binary is called `loopsmith`, and `runtime/Cargo.toml`'s `[workspace.package] version` is the truth.*\n\n## The two families\n\nEvery channel is one of two shapes, and the difference matters more than the language it is written in.\n\n**Build from source.** `install.sh`, `install.bat` → `installers/install.ps1`, and the Homebrew formula. These need a Rust toolchain, take minutes on a cold cache, and produce a binary compiled on the target machine.\n\n**Fetch a prebuilt binary.** The npm package and the PyPI distribution. These download a release asset for the host's target triple, verify it against the release's published `SHA256SUMS`, and install it. No toolchain, no compile.\n\n```mermaid\nflowchart TD\n    S[\"`runtime/` cargo workspace\"] --> R[\"GitHub release<br/>assets + SHA256SUMS\"]\n    S --> B[\"build from source\"]\n    B --> SH[\"install.sh / install.ps1\"]\n    B --> HB[\"Formula/loopsmith.rb\"]\n    B --> CI[\"cargo install loopsmith\"]\n    R --> NPM[\"npm postinstall<br/>scripts/install.js\"]\n    R --> PY[\"PyPI first run<br/>ensure_binary()\"]\n    SH & HB & CI & NPM & PY --> L[\"`loopsmith` on PATH\"]\n```\n\nThe fetch family is where the security-relevant code lives. Both implementations refuse to install an archive whose SHA-256 is not the one the release published — the comment in both files says the same thing, that a postinstall script running an unverified download is a supply-chain hole with a progress bar.\n\n## Building from source\n\n### `install.sh` (Linux, macOS, BSD)\n\nRe-runnable and idempotent; running it a second time is the documented upgrade path. Configuration is entirely environment variables, all with defaults:\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LOOPSMITH_REPO_URL` | `https://github.com/bitphill/loopsmith.git` | clone source when there is no local checkout |\n| `LOOPSMITH_BRANCH` | `main` | branch to clone |\n| `LOOPSMITH_HOME` | `$HOME/.loopsmith` | install root — holds `bin/`, `src/`, `install.log` |\n| `LOOPSMITH_BIN_DIR` | `/usr/local/bin` | where the symlink goes, if writable |\n\nThe flow: `detect_os` normalises `uname -s` into `linux`/`macos`/`bsd`/`windows`/`unknown` and aborts on `unknown`; an MSYS/Cygwin host warns and continues, since a POSIX layer is present. It then delegates to `installers/deps.sh` if that file exists, falling back to an inline `rustup` install if it does not — so a single-file copy of `install.sh` still works.\n\nTwo details in this script exist because of specific failures:\n\n- `export PATH=\"$HOME/.cargo/bin:$PATH\"` after the dependency step. `rustup` writes its PATH line to `~/.profile`, which zsh never reads, so a machine that just installed cargo can still fail to find it.\n- **A checkout beside the script wins over a clone.** If `$SCRIPT_DIR/runtime` exists, that directory is the build source. This is what makes `git clone && ./install.sh` install the code you just cloned rather than whatever `main` happens to be — non-obvious, and the thing to preserve if you restructure the repo.\n\nBuild, then install: `cargo build --release --bin loopsmith` inside `$SRC_DIR/runtime`, an explicit existence check on `target/release/loopsmith` (a successful `cargo build` with no binary at the expected path is a real and confusing failure), `install -m 0755` into `$LOOPSMITH_HOME/bin/`, then a symlink into `$LOOPSMITH_BIN_DIR` **only** when that directory is writable or the user is root. Otherwise it prints the `export PATH=…` line and exits successfully. The installer never escalates.\n\nEverything is `tee`'d to `$LOOPSMITH_HOME/install.log`.\n\n### `installers/deps.sh`\n\nCallable on its own, and safe to be. Its `pkg_install` dispatches on **the package manager, not the operating system** — a Debian container may have `apt` and no `sudo`, an Alpine one has `apk`, a Mac may have `brew` or nothing. The order tried is `apt-get`, `dnf`, `yum`, `pacman`, `apk`, `zypper`, `brew`, `pkg`. `sudo` is prefixed only when the effective uid is non-zero *and* `sudo` exists.\n\nIt installs `git` and `curl` if missing, and `rustup` (minimal profile, stable toolchain) if `cargo` is missing. It deliberately does **not** install a package manager when none is found — it prints the package list and returns non-zero, on the stated principle that a host with no package manager reflects a decision somebody made.\n\nIt also deliberately installs **no** `pkg-config` or OpenSSL headers. loopsmith links no C libraries: TLS never happens in-process because every provider is an external command. If you ever add a native dependency, this comment is the thing that has to change.\n\nFinally it warns — not fails — when cargo is older than 1.75, the declared `rust-version`. An older toolchain otherwise dies deep inside a dependency with a message about a syntax feature, which tells the user nothing.\n\n### `install.bat` and `installers/install.ps1`\n\n`install.bat` is a five-line shim whose entire job is making the install one word instead of an execution-policy incantation. It `cd`s to its own directory, checks that `powershell` is on PATH (exit `127` with a clear message if not), and calls:\n\n```\npowershell -NoProfile -ExecutionPolicy Bypass -File \"%~dp0installers\\install.ps1\" %*\n```\n\n`Bypass` is scoped to that one process and changes nothing about the machine.\n\n`install.ps1` mirrors `install.sh` step for step — same environment variables (`LOOPSMITH_REPO_URL`, `LOOPSMITH_BRANCH`, `LOOPSMITH_HOME`), same checkout-beats-clone rule, same log file, same `Write-Log`/`Write-Warn`/`Die` trio. Windows-specific differences worth knowing:\n\n- It checks `$LASTEXITCODE` explicitly after `cargo build`, because a failing native command inside a pipeline does not trip `$ErrorActionPreference = 'Stop'`.\n- The binary is `loopsmith.exe`, copied rather than symlinked.\n- PATH is edited via `[Environment]::SetEnvironmentVariable('PATH', …, 'User')` — the **user** scope, which needs no elevation. A tool installed into a home directory has no business editing a machine-wide setting. The current process's `$env:PATH` is also patched so the closing hint works in the same shell.\n\n`installers/deps.ps1` is the Windows counterpart to `deps.sh`. `Install-Pkg` tries `winget` then `choco` and dies if neither exists. Two Windows-only concerns: it prefers `winget install --id Rustup.Rustup` and otherwise downloads `rustup-init.exe` from `https://win.rustup.rs/x86_64`; and it checks for `link.exe`, warning about `Microsoft.VisualStudio.2022.BuildTools` and the \"Desktop development with C++\" workload, since the MSVC toolchain needs a linker that Rustup does not supply.\n\n### `Formula/loopsmith.rb`\n\nThis copy in the repository is the **template and source of truth**; the release workflow renders `url` and `sha256` for the tag being released and pushes the result to `bitphill/homebrew-loopsmith`, which is what `brew install` reads. Edit the body here — the two rendered lines get overwritten.\n\n```ruby\ncd \"runtime\" do\n  system \"cargo\", \"install\", *std_cargo_args(path: \"crates/loopsmith-cli\")\nend\n```\n\nNote the `cd \"runtime\"`: the cargo workspace root is not the repository root. This is the single fact most likely to break a formula edit.\n\nThe `test do` block is a genuine smoke test rather than a version-string check. It asserts `--version`, asserts `doctor` emits `platform` and `userland` (doctor must stay advisory so a constrained CI container cannot fail it), scaffolds a loop with `loopsmith new`, checks that `loop.yaml`, `run.sh`, and `run.cmd` all landed, and then asserts that `loopsmith validate` **exits 1** with `pre_execution` in the output. That refusal is the product; a build where it stops happening is a broken build.\n\nThe long comment above the class is a debugging note that has already cost someone an afternoon: codeload rate-limits unauthenticated archive downloads, `curl -sL` reports success while writing the error body, and hashing that yields a digest no install can ever match. Check the size (~2 MB) and `gzip -t` before trusting a digest. `gh api repos/.../tarball/<ref>` is not a substitute — it mangles binary output and returns a 199-byte fragment for every ref.\n\n## Fetching prebuilt binaries\n\nBoth fetch channels resolve the same six target triples:\n\n| Platform | Target |\n|---|---|\n| Linux x86_64 (glibc) | `x86_64-unknown-linux-gnu` |\n| Linux x86_64 (musl) | `x86_64-unknown-linux-musl` |\n| Linux arm64 | `aarch64-unknown-linux-gnu` |\n| macOS Intel | `x86_64-apple-darwin` |\n| macOS Apple silicon | `aarch64-apple-darwin` |\n| Windows x86_64 | `x86_64-pc-windows-msvc` |\n\nAsset names are `loopsmith-v<VERSION>-<TARGET>.tar.gz` (`.zip` on Windows), downloaded from `https://github.com/bitphill/loopsmith/releases/download/v<VERSION>/`, alongside a `SHA256SUMS` file.\n\n### npm — verify at install time\n\n`npm/package.json` declares `bin.loopsmith` → `bin/loopsmith.js` (the launcher shim) and a `postinstall` running `scripts/install.js`. `files` ships only the launcher, the install script, and the README — the downloaded binary is written into the installed package's `bin/` at postinstall time and is not part of the tarball.\n\n`scripts/install.js` is four functions:\n\n- `isMusl()` — runs `ldd --version`. glibc's answers and exits 0; musl's prints usage plus `musl libc` to stderr and exits non-zero, so the detection lives in the `catch` and greps `e.stderr`. Getting this wrong ships a glibc binary onto musl, where it dies with a bare `not found` naming no missing library.\n- `resolveTarget()` — maps `process.platform` / `process.arch` to a triple, calling `isMusl()` only for `linux/x64`. Returns `null` for anything unsupported.\n- `fetchBuffer(url)` — `fetch` with `redirect: 'follow'`, throwing on non-2xx.\n- `main()` — downloads the archive and `SHA256SUMS` in parallel, finds the line ending in the asset name, compares SHA-256, writes the archive to a temp file, and extracts **one named member** with the system `tar` (which has shipped with Windows 10 1803+ and reads zips, so both branches use it). On POSIX the extracted `loopsmith` is renamed to `loopsmith-bin` and `chmod 0755`'d; on Windows it stays `loopsmith.exe`. The temp file is removed in a `finally`.\n\nThe failure policy is explicit: the `catch` sets `process.exitCode = 0`. A flaky download must not hard-fail an `npm install` that may be installing twenty other packages; `bin/loopsmith.js` reports a clear error at run time if the binary never landed. If you make postinstall failures fatal, you are reversing a deliberate decision.\n\n### PyPI — verify on first run\n\n`pypi/src/loopsmith_cli/` inverts the timing. The binary is fetched on **first run**, not during `pip install`, and cached under `~/.loopsmith/bin/<version>/` (`LOOPSMITH_HOME` overrides the root). The reasoning is in the module docstring: a wheel that downloads at install time breaks in every environment that installs without a network and runs with one — CI images, Docker build stages, locked-down build hosts — and it surfaces as an install error for a package the user has not tried to use yet. Versioning the cache directory means an upgrade re-fetches rather than silently reusing an old binary.\n\n```mermaid\nflowchart LR\n    M[\"__main__.main()\"] --> E[\"ensure_binary()\"]\n    E --> C[\"cache_dir()\"]\n    E --> T[\"_target()\"]\n    E --> D[\"_expected_digest()\"]\n    D --> R[\"_read()\"]\n    E --> R\n    E --> X[\"_extract()\"]\n    E --> M\n    M --> V[\"os.execv / subprocess.call\"]\n```\n\n`_target()` uses `platform.machine()` rather than `platform.processor()` — the latter is empty on most Linux distributions and returns marketing strings on Windows — and distinguishes musl from glibc via `platform.libc_ver()` returning an empty libc name. Unsupported hosts raise `ResolveError`, the module's one exception type, carrying the `cargo install loopsmith` fallback in its message.\n\n`_extract()` extracts a single named member rather than calling `extractall`, and rejects entries that are symlinks, hard links, or whose name does not match exactly. A checksum match proves the archive is the one the release published; it does not make the archive trusted input, and a path-traversing entry only needs one careless extraction.\n\n`ensure_binary()` returns the cached path immediately if it exists; otherwise it resolves the target, reads the expected digest, downloads, compares, extracts into a `TemporaryDirectory`, moves the result into the cache, and sets the execute bits.\n\nThere is a long comment in `ensure_binary()` explaining what is *not* there: no \"reuse a `loopsmith` already on PATH\" shortcut. pip installs this package's own console script as `loopsmith`, so `shutil.which(\"loopsmith\")` finds the script that is currently running, and `execv`ing it re-enters the function — an infinite exec loop that presents as the command hanging with no output at all. `__main__.main()` guards the same failure a second way, comparing `Path(exe).resolve()` against `Path(sys.argv[0]).resolve()` and refusing to run if they match. An unresolvable `argv[0]` raises `OSError` and is ignored, since that is not a reason to refuse to run.\n\n`main()` then hands off. On POSIX it calls `os.execv` and never returns: loopsmith is long-running and interactive, and a Python parent process would have to forward signals correctly and would get it wrong at least once. `execv` makes the shell's Ctrl-C reach the real binary and its exit code arrive unchanged. Windows has no process-replacing exec, so it wraps with `subprocess.call` and maps `KeyboardInterrupt` to `130`. Every resolution failure returns `127`.\n\n### `pypi/build.sh`\n\nBuilds the sdist and wheel into `dist/`, runs `twine check`, and with `--upload` publishes using `PYPI_TOKEN`.\n\nIt exists instead of a bare `python3 -m build` because the interpreter first on PATH is not a stable fact. Installing anything through Homebrew can put a new `python3` ahead of the one whose user site-packages holds `build` and `twine`, and the failure reads as `No module named build` on a machine where build is very much installed. Homebrew's Python is also PEP 668 externally-managed, so `pip install --user` into it is refused outright. `pick_python()` walks an explicit candidate list (`python3.13` down to `/usr/bin/python3`), requiring each to import `venv`, and the script creates a throwaway `.venv-build` where the tooling is visible and nothing on the host is touched.\n\n## Version synchronisation — `tools/sync-version.sh`\n\n`runtime/Cargo.toml`'s `[workspace.package] version` is the single source of truth. Eight other places repeat it, and hand-editing eight files per release is how one gets missed — usually a URL, which fails silently as a broken image on a registry page nobody looks at twice.\n\n```\n./tools/sync-version.sh           # rewrite everything to match\n./tools/sync-version.sh --check   # fail if anything drifted (CI uses this)\n```\n\nThe script reads the version with `awk`, then calls its `apply` helper — `apply <file> <sed-pattern> <replacement> <label>` — once per derived location. `apply` writes to a temp file and `mv`s it rather than using `sed -i`, because that flag's spelling differs between GNU and BSD. In `--check` mode it reports and counts drift instead of writing, exiting 1 if anything is out of step.\n\nWhat it propagates:\n\n| Target | What is rewritten |\n|---|---|\n| `runtime/Cargo.toml` | workspace path-dependency versions (crate manifests inherit) |\n| `npm/package.json` | `\"version\"` |\n| `pypi/pyproject.toml` | `version` |\n| `pypi/src/loopsmith_cli/__init__.py` | `__version__` |\n| `Formula/loopsmith.rb` | the tag in the `archive/refs/tags/vX.Y.Z.tar.gz` URL |\n| `npm/README.md`, `pypi/README.md`, `runtime/crates/*/README.md` | tag-pinned logo URL and tag-pinned `README-FOR-DUMMIES.md` link |\n\nThe README URLs are pinned to a tag rather than `main` because a published README is immutable and an image URL that can move underneath it will eventually be wrong. Relative links do not resolve off GitHub at all, which is why the START-HERE link is absolute and tag-pinned too.\n\n**The formula's `sha256` is the one thing this script cannot derive.** It is the digest of a tarball GitHub generates for a tag that does not exist yet, so it stays manual, and the script's closing output prints the exact commands — download, `gzip -t`, `wc -c`, `shasum -a 256` — in that order for the reason described in the formula's header comment.\n\nThe script lives in `tools/`, not `scripts/`. That name is reserved for a loop's own detector scripts, and the repository deliberately ships none so the `pre_execution` refusal keeps its teaching value.\n\n## Package naming\n\n`loopsmith` was already taken on both npm and PyPI by unrelated projects, so the published names differ from the command:\n\n| Registry | Package | Command |\n|---|---|---|\n| crates.io | `loopsmith` | `loopsmith` |\n| npm | `@bitphill/loopsmith` | `loopsmith` |\n| PyPI | `loopsmith-cli` | `loopsmith` |\n| Homebrew | `bitphill/loopsmith` tap → `loopsmith` | `loopsmith` |\n\n`npm/README.md` and `pypi/README.md` are the registry-facing landing pages and are largely parallel text, diverging only in the install line and the \"how this package installs the binary\" section — install-time verification for npm, first-run for PyPI. Both open by stating plainly that the package is a Rust binary and not a library: there is nothing to `require()` or `import`, and the way to drive loops from either language is to spawn the CLI, whose exit codes are its API.\n\n## Contributing to this module\n\n- **Adding a platform** means touching five places: the release workflow's build matrix, `resolveTarget()` in `npm/scripts/install.js`, `_target()` in `pypi/src/loopsmith_cli/__init__.py`, the platform tables in both READMEs, and `os`/`cpu` in `npm/package.json`. The two resolvers must agree exactly on the triple string, since both index the same `SHA256SUMS`.\n- **Never relax the checksum check** in either fetch path to work around a release problem. Fix the release.\n- **Test the shell installers against the checkout-beats-clone branch specifically.** It is the path a contributor exercises and the path CI is least likely to cover, and a regression there silently installs `main` over the user's local work.\n- **Run `./tools/sync-version.sh --check` before opening a release PR**, and remember that a green check does not cover the formula's `sha256`.\n- The install scripts print two next steps on success — `loopsmith doctor` and `loopsmith new`. If the CLI's entry commands change, these strings are user-facing documentation and need updating with them.","evolution-perturbation":"# Evolution & Perturbation\n\n# Evolution & Perturbation\n\nTwo files under `runtime/crates/loopsmith-cli/src/run/` that answer the same question from opposite ends: *what should the loop do when its current setup isn't working?*\n\n- **`evolve.rs`** — gathers evidence about the loop's own tooling and writes proposals a human reads later. It never changes anything.\n- **`perturb.rs`** — picks one of four method changes when the loop stalls mid-run, and applies it to the next iteration.\n\nThe dividing line between them is *who acts*. Evolution's output is advice; perturbation's output is a change to how the very next iteration runs. Both are bound by the same constraint, stated in each module's header: neither may touch what counts as done. The gate owns that ruling, and nothing in either file can reach it.\n\nBoth are driven from `execute` in `src/run/mod.rs`, which is the only caller of either module.\n\n---\n\n## Part 1 — `evolve.rs`: evidence and proposals\n\n### The shape of an iteration's contribution\n\nThree functions run per iteration, in this order, all called from `execute`:\n\n```mermaid\ngraph LR\n  A[harvest_judgments] --> B[record_trials]\n  B --> C[write_proposals]\n  D[next_candidate] -.-> B\n  B --> S[(SkillTrial)]\n  C --> P[(Proposal)]\n```\n\n`next_candidate` runs earlier — before dispatch — because its answer determines which skill a node carries into the iteration that `record_trials` then scores.\n\n### `next_candidate` — what to try this time\n\n```rust\npub fn next_candidate(cfg: &LoopConfig, trials: &[SkillTrial]) -> Option<String>\n```\n\nReturns `None` unless `cfg.skills.explore` is on and `explore_candidates` is non-empty. Otherwise it filters candidates down to those that are (a) not already in any node's `skills` list, and (b) still short of `cfg.skills.min_trials`, then picks the **least-tried** one.\n\nThe `min_by_key` on trial count is the load-bearing detail. Picking the first match would pile every trial onto whichever candidate sorts earliest and leave the rest at zero evidence forever; least-tried-first spreads evidence evenly so `min_trials` is eventually satisfied for all of them.\n\n### `harvest_judgments` — reading the judges\n\n```rust\npub fn harvest_judgments<S: Store>(cfg: &LoopConfig, rec: &Recorder<S>, iteration: u32) -> Vec<Judgment>\n```\n\nPulls this run's episodes from the store, keeps the ones from this iteration whose node has `Role::Judge`, and hands each output to `judgment::parse`.\n\nThe interesting part is the third argument to `parse`. Independence — did a different provider review the work than produced it? — needs to know the *builder's* provider, not just the judge's. The judge node's `depends_on` list names the builder, so the function looks up the first dependency that also has an episode this iteration and takes its `provider_id`. Missing dependency, or a dependency that didn't run: `unwrap_or_default()` gives an empty string and the judgment records no independence claim rather than a false one.\n\n### `record_trials` — pairing skill use with outcome\n\n```rust\npub fn record_trials<S: Store>(\n    rec: &Recorder<S>,\n    iteration: u32,\n    episodes: &[RanNode],\n    node_skills: &BTreeMap<String, Vec<(String, String)>>,\n    verdicts: &BTreeMap<String, TargetVerdict>,\n)\n```\n\nFor each node that ran with skills attached, this writes one `SkillTrial` per skill, scored against **only the targets in that node's `goals`** — not the whole loop's verdicts. Scoring against everything would give every skill in the graph the same number, which is the same as measuring nothing. A node whose goals are all missing from `verdicts` contributes no trials at all.\n\nThe score is the mean `blocking_pass_rate()` across the node's relevant verdicts, clamped to `[0.0, 1.0]`; `satisfied` is the conjunction of all of them.\n\n`node_skills` maps node id to `(skill, source)` pairs — `source` records where the skill came from (config vs. exploration), which is what lets the recommender distinguish confirmed setup from trial evidence.\n\n### `RanNode`\n\n```rust\npub struct RanNode {\n    pub node_id: String,\n    pub goals: Vec<String>,\n    pub tokens: Option<u64>,\n}\n```\n\nThis struct exists because of a real bug, and the doc comment says so: it replaced a four-tuple threaded through three functions, and in that shape `SkillTrial.tokens` was permanently `None` — the caller had the number, but there was no field to put it in that wouldn't have made every call site worse. Cost belongs in the trial record because a skill that lifts the pass rate while tripling the bill is a different proposition from one that does it for free, and the ranking can't tell them apart without it.\n\nIf you add another per-dispatch fact the trial record needs, add a field here rather than widening a signature.\n\n### The proposal desk\n\n`write_proposals` is the entry point:\n\n```rust\npub fn write_proposals<S: Store>(\n    cfg: &LoopConfig,\n    rec: &Recorder<S>,\n    iteration: u32,\n    observed: &Observed,\n) -> usize\n```\n\nIt builds a `Desk` and sums four proposal writers. The return value is the count actually written.\n\n`Desk` is a small private struct holding the recorder, the iteration, and `said` — the set of `\"{kind:?}:{subject}\"` strings already in the store for this run. Its `write` method is a no-op returning `0` when the key is already in `said`, which is the whole point: without it, an unsatisfiable check would generate an identical proposal every iteration and the proposals file would be forty copies of one sentence. Nobody reads that file.\n\n`write` also handles expiry centrally via `Proposal::with_default_expiry()`, deliberately rather than taking an expiry per call site. Adding a new `ProposalKind` therefore forces a decision about how long its evidence stays true.\n\nFailure is quiet by design — a store error returns `0` instead of propagating. A proposal is advice; losing one should not take down a run.\n\n#### The four writers\n\n| Writer | Kind | Fires when | Suggests a patch? |\n|---|---|---|---|\n| `propose_reshape` | `ReshapeGraph` | a node in `observed.exhausted_nodes` burned `max_revisions_per_node` with goals unsatisfied | yes — a two-node split with a `-prepare` predecessor |\n| `propose_criteria_changes` | `ChangeCriteria` | a blocking, failing check whose `evidence` starts with `\"detector error\"` | no |\n| `propose_try_skill` | `TrySkill` | `explore` is off, candidates are listed, and something is still unsatisfied | yes — `skills:\\n  explore: true` |\n| `skill_proposals` | `AdoptSkill` / `DropSkill` | the accumulated trial record supports adoption or removal | adopt only — `skills: [name]` |\n\nThe first three read the run's own behaviour and need no history. Only `skill_proposals` touches the accumulated trial record, which is why it reads `skill_trials()` across all runs rather than `rec.run_id`'s alone.\n\nEach writer's reasoning is worth understanding rather than just its trigger:\n\n**`propose_reshape`** treats an exhausted node as evidence about the *graph*, not the node. One unit of work was asked to do something it can't do in one step; repeating that step won't help. But rewriting the graph is a config edit, so the loop writes down a suggested split and stops.\n\n**`propose_criteria_changes`** distinguishes a failing check from a broken one. A detector that errors fails closed forever — no amount of work by any node changes the answer — so it belongs in front of a human, not in the next iteration's prompt. The `\"detector error\"` prefix on `evidence` is the marker, so a detector that reports failure through that string is opting into this path.\n\n**`propose_try_skill`** exists because `skills.explore` defaults off (exploration costs real money). When the run is failing anyway, pointing out \"there's something here you've switched off\" is worth more than silently not doing it. Returns early when everything is satisfied — no need to spend money on a run that's working.\n\n**`skill_proposals`** delegates the actual ranking to `loopsmith_skills::recommend(&configured, &trials, cfg.skills.min_trials, 0.8, 0.2)` — adopt above an 0.8 satisfaction rate, drop below 0.2. It separately calls `score_skills(&trials)` to get the rate and trial count for the rationale text, since `recommend` returns only names.\n\n### `Observed`\n\n```rust\npub struct Observed<'a> {\n    pub exhausted_nodes: &'a [String],\n    pub verdicts: &'a BTreeMap<String, TargetVerdict>,\n}\n```\n\nThe narrow view `execute` hands to the proposal machinery. Both fields are borrowed; `Observed` owns nothing and lives for one call.\n\n---\n\n## Part 2 — `perturb.rs`: recovery from a stall\n\n### The two thresholds\n\n`no_progress_iterations` is the jidoka gate — stop the line rather than spin. `no_progress_iterations_randomness` fires **earlier** and tries something else first, because a loop that repeats the identical approach three times and then quits has learned nothing, and the cheapest thing to vary is the approach.\n\n### The menu\n\n```rust\npub enum Perturbation {\n    Reorder,           // dispatch each wave's nodes in a different order\n    Escalate,          // run builders one tier stronger\n    Explore,           // force an exploration candidate on, even if `explore` is off\n    Reframe(String),   // a specific different approach, in words\n}\n```\n\nTwo properties make this safe to leave running unattended:\n\n1. **The menu is fixed.** Every option changes *how* the loop works; none changes *what counts as done*. The agent picks from the menu — it does not write the menu.\n2. **It is seeded.** The seed comes from the run id and iteration and goes into the ledger, so a run that took a strange turn can be replayed.\n\nThree methods on the enum:\n\n- `describe()` — one-line ledger text.\n- `tier_for(base)` — `Escalate` maps `Cheap → Standard` and everything else to `Strong`; there is no tier above `Strong`, so escalation saturates. Every other variant returns `base` untouched.\n- `directive()` — the prompt fragment appended to a builder. Every variant returns `Some`, and every one of them ends with the same clause: *\"This instruction changes how you work. It does not change what counts as done — the gate is unchanged.\"* A test asserts that string is present for all four variants, because a \"work differently\" instruction must not read as permission to lower the bar.\n\n`Reorder` and `Explore` share directive text (try a materially different approach); `Escalate` gets its own (re-read the failing check and attack its actual cause); `Reframe` carries the agent's own sentence.\n\n### How a perturbation is chosen\n\n```mermaid\ngraph TD\n  E[execute detects stall] --> S[seed_for run_id, iteration]\n  E --> C[choose]\n  C --> A[ask_agent — cheap tier]\n  A -->|parses| P[Perturbation, agent=true]\n  A -->|no provider / bad answer| F[fallback seed]\n  F --> P2[Perturbation, agent=false]\n```\n\n```rust\npub fn choose(cfg: &LoopConfig, workdir: &Path, stall: &Stall, seed: u64) -> (Perturbation, bool)\n```\n\nThe `bool` is *whether an agent chose it*, so the ledger can record which path was taken. This matters when reading a run back: \"the model decided to escalate\" and \"the dice said escalate\" are different events.\n\nThe agent is asked first because a stall usually has a legible cause — the same check failing with the same evidence every time. When no cheap provider is reachable or the answer doesn't parse, the seeded fallback picks from the same menu and the run carries on. There is no failure mode where a stall stops the run for lack of an opinion.\n\n### `Stall` — what the agent may see\n\n```rust\npub struct Stall<'a> {\n    pub stale_iterations: u32,\n    pub failing: &'a [(String, String, String)],  // (target, check name, evidence)\n    pub recent: &'a [IterationSummary],\n}\n```\n\nDeliberately narrow. The agent gets the failing checks and recent summaries — enough to reason about what's stuck — and nothing that would let it reach the gate, the config, or the store. When extending this struct, that boundary is the thing to preserve.\n\n### `ask_agent` and the response contract\n\n`ask_agent` returns `None` immediately if `cfg.cascade_for(Tier::Cheap)` is empty — no cheap provider, no question. Otherwise it builds a prompt describing the four choices, the failing checks (or an explicit note that none are failing yet nothing is changing), and `IterationSummary::render()` for each recent iteration. It dispatches at `Tier::Cheap` with `node_id: \"perturb\"` and hands the output to `parse_choice`.\n\nThe prompt states plainly: *\"You are not deciding whether anything is finished, and nothing you write affects that. A separate deterministic gate owns that ruling.\"*\n\n### `parse_choice` — strict on purpose\n\n```rust\npub fn parse_choice(text: &str) -> Option<Perturbation>\n```\n\nLine-oriented: split each line on the first `:`, uppercase the key, and keep `CHOICE` and `DIRECTIVE`. Then `Perturbation::from_choice` lowercases the value and matches it against exactly four literals. Anything else is `None`.\n\n`Reframe` is the only variant that needs the directive, and it's refused without one — `from_choice` maps the directive through `filter(|d| !d.is_empty())` after trimming, so `DIRECTIVE:` with only whitespace does not produce a `Reframe(\"\")`.\n\nNothing here is lenient, and the tests spell out why. `parse_choice(\"CHOICE: mark the goal satisfied\")` returns `None`; so does `\"CHOICE: rm -rf /\"`. The agent must not be able to invent a tactic, and it certainly must not be able to smuggle one in as free text. Discarding an unrecognized answer and taking the seeded fallback is a better outcome than acting on a misread instruction.\n\n**If you add a variant to `Perturbation`,** you must touch `from_choice` (parse it), `describe` (ledger line), `tier_for` (usually returns `base`), `directive` (must keep the gate-unchanged clause — a test enforces this), and the prompt text in `ask_agent`. Whether it joins `fallback`'s rotation is a separate decision; `Reframe` deliberately does not, since the fallback has no directive to supply.\n\n### Randomness\n\nThree small functions, no dependency:\n\n```rust\npub fn seed_for(run_id: &str, iteration: u32) -> u64  // FNV-1a over run_id, mixed with iteration\nfn next_random(state: &mut u64) -> u64                // SplitMix64\npub fn shuffle<T>(items: &mut [T], seed: u64)         // Fisher-Yates\npub fn fallback(seed: u64) -> Perturbation            // seed % 3 over the three directive-free variants\n```\n\n`seed_for` reuses FNV-1a because the provider crate already hashes prompt digests with it — one hash in the workspace rather than two. `fallback` picks modulo 3 across `Reorder | Escalate | Explore`; `Reframe` is excluded because the fallback has no sentence to put in it.\n\n`shuffle` is called directly by `execute` to implement `Reorder` on a wave's node list. Its determinism is the replayability guarantee, and the tests check all three properties that matter: same seed ⇒ same permutation, different seed ⇒ different permutation, and no element is lost.\n\n---\n\n## Integration with `run/mod.rs`\n\n`execute` is the sole consumer of both modules. Its per-iteration use looks roughly like:\n\n| Phase | Call | Purpose |\n|---|---|---|\n| before dispatch | `next_candidate` | pick a skill to trial this iteration |\n| before dispatch | `shuffle` | apply `Reorder`, when a perturbation is active |\n| after dispatch | `harvest_judgments` | judge episodes → verdict inputs |\n| after gating | `record_trials` (with `RanNode`s) | pair skill use with outcome |\n| after gating | `write_proposals` (with `Observed`) | advice for a human |\n| on stall | `seed_for` → `Stall` → `choose` | pick a method change for the next iteration |\n\nThe `Recorder<S>` threaded through `evolve.rs` carries both `run_id` and `store`; every write goes through it, and the `LedgerKind::ProposalWritten` entries it emits are what surfaces proposals in the run log.\n\n## Invariants to preserve\n\n- **Neither module may change what counts as done.** No path in either file writes to config or gate criteria. `evolve.rs` writes `Proposal` rows and ledger entries; `perturb.rs` returns a `Perturbation` whose effects are confined to dispatch order, tier, skill attachment, and prompt text.\n- **Config edits are the human's.** Every adopt/drop/reshape/criteria finding ends as a proposal with an optional suggested patch, never an applied one.\n- **Unrecognized agent output is discarded, not interpreted.** `parse_choice` fails closed to the seeded fallback.\n- **Perturbation is replayable.** Anything that consumes randomness must derive it from `seed_for`, not from a fresh entropy source.\n- **A skill is scored against its own node's goals.** Widening that scope silently destroys the signal `skill_proposals` depends on.","example-loops":"# Example Loops\n\n# Example Loops (`config/examples/`)\n\nThirteen worked loop configurations, each shipped twice: `<name>-loop.yaml` is the source of truth and `<name>-loop.md` is a generated twin in the Markdown grammar. They are not documentation samples that happen to live in the repo — they are compiled into the `loopsmith` binary, served by the web UI, and executed by the integration test suite on every `cargo test`. An example that stops parsing, stops round-tripping, or stops surviving a run breaks the build.\n\n## What each example is for\n\n| Example | Subject | The mechanism it exists to demonstrate |\n|---|---|---|\n| `refactor-loop` | Refactor a module without changing behaviour | `tests-unchanged` — a script detector that forbids the loop from editing tests to make them pass |\n| `landing-page-loop` | Static landing page for GitHub Pages | Taste made checkable: Lighthouse thresholds + `links-resolve`, with the copy judged separately |\n| `viral-game-loop` | Small Godot game around one mechanic | Decomposing an ungateable word (\"viral\") into build health, time-to-first-play, and a cold playtest |\n| `research-loop` | Brief answered against primary sources | Citation floor: every claim carries a URL or file:line, with a source-independence floor |\n| `trend-radar-loop` | Trends across X, Instagram, TikTok | A numeric `rise_definition` (2× the trailing 7-day average) instead of \"feels like it's growing\" |\n| `idea-radar-loop` | Product ideas from public complaints | `threshold-met` on `min_complaints_per_pain`, plus a market check that reports \"already taken\" as a finding |\n| `account-watch-loop` | Watch accounts that talk early | Dated predictions scored by a *later* run, guarded by `no-retroactive-predictions` |\n| `traffic-loop` | Qualified traffic from venues that allow it | Gating on referred sessions rather than posts made |\n| `blogger-loop` | Opinionated posts on trending topics | Mechanical style metrics (`sentence_length_variance`, `hedging_density`) *and* a cold read on a different provider |\n| `cold-outreach-loop` | Personalised first-contact messages | The heaviest constraint set: suppression, opt-out, daily cap, and a human release checkpoint |\n| `sales-leads-loop` | ICP lead list from public sources | `lawful-basis-recorded` as a blocking check — a lead without a recorded source cannot pass the gate |\n| `marketing-automation-loop` | Scheduled multi-platform posting | Claims traced to the product's own site; publishing sits behind a human checkpoint |\n| `x402-agent-loop` | An agent that pays for things | Two documented postures (supervised vs autonomous) selected by editing one `human_checkpoint` line |\n\nThe README groups these as Build / Find out / Reach people / Spend money.\n\n## Anatomy: the A–J model in two grammars\n\nEvery example is the same `LoopConfig`. YAML uses the field names; the Markdown twin uses lettered sections, which is what the `## A. Information` … `## J. Default skills` headings in the `.md` files are.\n\n| Section | YAML key | What it carries |\n|---|---|---|\n| A | `information` | Key/value/note triples the nodes read — paths, thresholds stated in prose, the \"replace this\" placeholders |\n| B | `pre_execution` | Human prerequisites, each `done: false` as shipped |\n| C | `goals` | Named goals with `depends_on` and `priority` |\n| D | `validations` | `target` + `mode` (`objective` / `subjective` / `percentage`) + `detector` |\n| E | `success` | The overall gate, usually `mode: percentage, threshold: 1.0` |\n| F | `stop_gates` | Iteration, wall-clock, token, and cost ceilings; `no_progress_iterations` |\n| G | `schedules` | `cron`, `manual`, or `file_change` triggers |\n| H | `constraints` | `rules`, `forbidden_paths`, `forbidden_commands`, `max_seconds`, `human_checkpoint` |\n| I | `execution_guidelines` | Named stages and their `dependency` chain (`research -> draft -> revise`) |\n| J | `default_skills` | Skills fetched for the loop, e.g. `agent-reach` from GitHub |\n| — | `graph`, `providers`, `skills`, `context` | Nodes and concurrency, the provider cascade, skill acquisition, summary carry-over |\n\nDetectors used across the set: `file_exists` (with `non_empty`), `script` (`command`, `args`, `expect_exit`), `threshold` (`metric`, `op`, `value` — read from `metrics.json`), `regex_match` (`artifact`, `pattern`), and `judge` (`standard`, `min_score`).\n\n## Invariants every example holds\n\nThese are conventions, not schema requirements, and they are the reason the set is worth reading as a group.\n\n**Shipped configs do not run as-is, deliberately.** Every `pre_execution` step is `done: false`, and the detector scripts they name (`scripts/check-suppression.sh`, `scripts/assert-tests-untouched.sh`, `scripts/check-timestamps.sh`, …) do not exist in the repo. A user must describe the manual process before automating it, and must write the checks that encode their own standard. The test harness works around both by rewriting a *copy* in a scratch directory — see below — and never mutates `config/examples/`.\n\n**The gate is never only an opinion.** Each example pairs script/threshold detectors with at most a couple of `judge` ones. `providers.enforce_judge_independence: true` appears in every config, and judge nodes carry `provider: openai` while builders run on the `standard` cascade — so the model that wrote the artifact is not the model that certifies it. `blogger-loop` is the clearest case: the mechanical style metrics and the `cold-read` judge are both blocking, and neither would be sufficient alone.\n\n**Irreversible acts sit behind `human_checkpoint`.** Sending mail, publishing a post, deploying to a live domain, authorising a payment, adopting a proposed account list into the config. The loops draft and queue; a person releases.\n\n**Roles are used consistently.** `researcher` gathers without interpreting, `builder` writes artifacts, `judge` scores against a named standard, `adversary` argues the artifact is wrong (`challenge` in `account-watch-loop`, `specificity-check` in `cold-outreach-loop`). Nodes that write files concurrently are marked `isolated: true`, which gives them a git worktree each — `refactor-loop`'s `refactor-a` / `refactor-b` pair is the canonical illustration, and its comment explains why `concurrency.mode: auto` picks 2 there despite `cap: 16`.\n\n**Every example carries a cost ceiling.** `max_cost_usd` ranges from 8 to 15, alongside `max_tokens` and `max_wall_clock_seconds`.\n\n## How an example reaches a user\n\n```mermaid\nflowchart LR\n  A[\"config/examples/*.yaml<br/>source of truth\"] --> B[\"tools/sync-examples.sh\"]\n  B --> C[\"loopsmith-cli/templates/examples/\"]\n  C --> D[\"EMBEDDED via include_str!<br/>web/examples.rs\"]\n  A -. \"loopsmith convert\" .-> E[\"*.md twin\"]\n  D --> F[\"web::examples::list()\"]\n  A -. \"read live in a checkout\" .-> F\n  G[\"~/.loopsmith/examples/*.yaml\"] --> F\n```\n\n`config/` lives above the CLI crate root and is excluded from the published tarball, so `include_str!` cannot reach it. `tools/sync-examples.sh` copies the YAML into `runtime/crates/loopsmith-cli/templates/examples/` (and deletes copies whose source is gone), and `EMBEDDED` in `runtime/crates/loopsmith-cli/src/web/examples.rs` pulls them in by name.\n\n`web::examples::list()` resolves three sources, first to claim an id wins:\n\n1. `~/.loopsmith/examples/*.yaml` — the user's own beats the shipped ones.\n2. `config/examples/*.yaml` relative to the working directory — edits in a checkout show up without a rebuild.\n3. The compiled-in copies — always present, including for a crates.io/npm/pip/brew install.\n\nCard metadata is derived from the config, never hand-written: `ExampleCard` counts goals, validations, `judge_validations`, nodes, and providers, and renders `trigger` from the schedules plus `max_iterations` / `max_cost_usd` from the stop gates. A config that will not parse is dropped rather than shown as a broken card.\n\nFrom the CLI, an example is a starting config for `loopsmith new --config-file config/examples/research-loop.yaml`, and `loopsmith convert` translates between the grammars (direction is inferred: a `.md` input emits YAML, anything else emits Markdown; `--to-yaml` forces YAML, `--out` writes to a file).\n\n## The tests that hold the set together\n\n- `loopsmith-core/tests/md_roundtrip.rs` — `every_example_config_survives_a_markdown_round_trip` loads each `.yaml`, calls `render_md`, parses it back with `parse_md`, and compares the serialized `LoopConfig` field for field. `every_shipped_md_example_means_the_same_as_its_yaml_twin` compares each `.md` against its YAML source, which is what stops a hand-edited twin from drifting. Trailing whitespace is the one documented exception, because a YAML folded scalar (`>`) ends in a newline that a Markdown bullet cannot carry, so both sides are compared trimmed.\n- `web/examples.rs` — `every_compiled_in_example_parses` and `embedded_examples_match_the_source_of_truth`. The second fails when `tools/sync-examples.sh` has not been run, so drift is caught by `cargo test` rather than by a user with no checkout.\n- `loopsmith-cli/tests/stress.rs` — `every_example_completes_an_iteration_and_leaves_a_consistent_record` and `every_example_survives_a_run_where_nothing_passes` iterate `harness::all_examples()`. The `Fixture` builder in `tests/harness/mod.rs` copies the config into a scratch directory, marks `pre_execution` done, swaps the providers for deterministic commands that emit a fixed judge block, generates a `scripts/` directory of stubs that exit with `$STUB_EXIT`, and optionally initialises a git repo so `isolated: true` worktrees are real rather than silently degraded. Assertions land on the ledger, run log, summaries, and export — not on stdout.\n\n## Working on this module\n\n**Editing an existing example.** Change the `.yaml`, then regenerate the twin and resync:\n\n```bash\nloopsmith convert config/examples/blogger-loop.yaml --out config/examples/blogger-loop.md\ntools/sync-examples.sh\ncargo test\n```\n\nNever edit a `.md` by hand — `every_shipped_md_example_means_the_same_as_its_yaml_twin` will fail, and the fix is to regenerate rather than to reconcile.\n\n**Adding a new example.** Write the YAML, generate the `.md` twin, run `tools/sync-examples.sh`, add the `(name, include_str!(...))` entry to `EMBEDDED` in `web/examples.rs`, and add it to the README index. `all_examples()` and the round-trip tests discover it from the directory automatically, so the stress suite will start exercising it with no further wiring. Before it is worth shipping, check it against the invariants above: `pre_execution` unfinished, at least one non-judge blocking check per goal, `enforce_judge_independence` with judges on a different provider from the builder, a `human_checkpoint` covering anything irreversible, concurrent writers marked `isolated`, and a `max_cost_usd`.\n\n**Two things that look like bugs and are not.** The detector scripts do not exist — that is the user's half of the contract. The `pre_execution` steps are all `done: false` — that is what makes the config refuse to run until someone has done the manual pass it is automating.","execution-graph-concurrency-planning":"# Execution Graph & Concurrency Planning\n\n# Execution Graph & Concurrency Planning (`loopsmith-graph`)\n\n`runtime/crates/loopsmith-graph` turns a flat list of nodes that declare `depends_on` into an execution schedule: which nodes may run together, how long the run can possibly take, and how many workers are worth paying for.\n\nIt is a pure, dependency-light crate — `loopsmith-core` for the config types, `serde`, `thiserror`, nothing else. Every function is deterministic and cheap enough to re-run before each iteration of the loop, which is why callers plan repeatedly instead of caching a schedule.\n\n## The three jobs\n\n1. **Cycle detection.** A cyclic dependency graph is a config bug. It is caught in `waves` before any node is dispatched, not discovered at runtime by a deadlocked scheduler.\n2. **Wave scheduling.** Kahn's algorithm, grouped by level. Every node in a wave has all its dependencies satisfied by earlier waves, so the whole wave may run concurrently.\n3. **Sizing.** The critical path is the floor on wall-clock time. Amdahl's law is the ceiling on what more workers can buy. Both are arithmetic derived from the graph, available before dispatch.\n\n## The `DagNode` seam\n\nThe scheduler is not welded to `NodeSpec`. Everything topological goes through one trait:\n\n```rust\npub trait DagNode {\n    fn id(&self) -> &str;\n    fn deps(&self) -> &[String];\n    fn weight(&self) -> f64;   // relative cost; 1.0 when cost is meaningless\n}\n```\n\nTwo implementations ship in the crate:\n\n| Type | Source | `id` | `weight` |\n|---|---|---|---|\n| `NodeSpec` | config section G — the execution graph | `id` | `weight` field |\n| `Phase` | config section I — execution-guideline phases | `name` | always `1.0` |\n\nPhases carry no cost of their own — the work lives in the nodes assigned to them — so the critical path through the phase graph is just its longest chain.\n\nThis seam exists for a specific reason: sections G and I are different types with different fields but the same DAG problem. A second copy of Kahn's algorithm would be a second place for a cycle bug to hide. The test `any_dag_node_type_schedules_through_the_same_code` guards this by defining a `Step` type with nothing in common with `NodeSpec` — no role, no provider, no instruction — and scheduling it through the same code.\n\nIf you add a third graph-shaped config section, implement `DagNode` for it. Do not write another topological sort.\n\n## API surface\n\n### `waves<N: DagNode>(nodes: &[N]) -> Result<Vec<Wave>, GraphError>`\n\nLevel-grouped Kahn. Builds an indegree map and a reverse-edge (`dependents`) map, drains the ready set as one wave, decrements dependents, and collects the newly-zeroed nodes as the next wave.\n\n```rust\npub struct Wave {\n    pub index: usize,\n    pub nodes: Vec<String>,\n}\n```\n\nTwo failure modes, both returned before any partial schedule escapes:\n\n- `GraphError::UnknownNode(id)` — a `depends_on` entry names a node not present in the slice. Checked during edge construction, so it fires even on an otherwise-acyclic graph.\n- `GraphError::Cycle(ids)` — after the drain, `placed != nodes.len()`. The error string lists every node still carrying a nonzero indegree, which is the cycle plus everything downstream of it.\n\n**Determinism is deliberate and load-bearing.** `BTreeMap` for indegree and dependents, `BTreeSet` for the next level, and an explicit `names.sort()` per wave. The same config always produces byte-identical waves — which matters because plan output is surfaced to users (`loopsmith plan`, the web review view, the MCP `plan` tool) and because reproducible schedules make loop runs comparable across iterations. Swapping in a `HashMap` for speed would silently break that.\n\n### `critical_path<N: DagNode>(nodes: &[N]) -> Result<(Vec<String>, f64), GraphError>`\n\nLongest weighted path. It calls `waves` first and flattens the result, which gives a valid topological order for free (and re-checks for cycles). Then a single forward pass: each node's `best` cost is its own weight plus the largest `best` among its dependencies, with `prev` recording which dependency won. The path is reconstructed by walking `prev` back from the global maximum and reversing.\n\n```rust\n// a(1) -> b(5) -> d(1)   and   a(1) -> c(1) -> d(1)\nlet (path, cost) = critical_path(&nodes)?;\nassert_eq!(path, vec![\"a\", \"b\", \"d\"]);\nassert_eq!(cost, 7.0);\n```\n\nEmpty input returns `(vec![], 0.0)`. Ties on the terminal node resolve to the lexicographically last id, since `max_by` over a `BTreeMap` keeps the last maximum seen.\n\n### `parallel_fraction(total_cost, critical_cost) -> f64`\n\n```\np = (total_cost - critical_cost) / total_cost,  clamped to [0, 1]\n```\n\nThe share of total work not pinned to the critical path. This is the mechanical form of the \"and then\" test: work that genuinely reads an upstream output stays serial; everything else can in principle be spread across workers. A pure chain yields `p == 0.0` — total equals the critical cost, nothing is parallelizable. `total_cost <= 0.0` returns `0.0`.\n\nIt is a structural proxy, not a measurement. It assumes weights are honest relative costs and that non-critical work has somewhere to go. That is the right trade for a pre-dispatch estimate, but do not read `p` as an observed runtime property.\n\n### `amdahl(p, n)` and `speedup_ceiling(p)`\n\n```rust\namdahl(p, n) = 1.0 / ((1.0 - p) + (p / n))\nspeedup_ceiling(p) = 1.0 / (1.0 - p)\n```\n\n`p` is clamped to `[0, 1]` in both. `amdahl` returns `0.0` for `n == 0`; `speedup_ceiling` returns `f64::INFINITY` at `p >= 1.0`, which can propagate into `Plan::speedup_ceiling` — anything that formats or serializes a `Plan` needs to survive a non-finite float there.\n\nThis is the arithmetic that stops a fleet from being sized by optimism. At `p = 0.95`, sixteen workers buy ×9.14, not ×16; two hundred fifty-six buy ×18.6 against a hard ceiling of ×20. `amdahl_matches_the_published_table` pins those values.\n\n### `choose_concurrency(&Concurrency, &[Wave], p) -> (usize, f64)`\n\nReturns the worker count and its predicted speedup. Every mode is capped by `widest` — the node count of the largest wave — because workers beyond the widest wave have nothing to pick up.\n\n| Mode | Behavior |\n|---|---|\n| `Sequential` | pinned to `1` |\n| `Fixed { max_parallel }` | `max_parallel.max(1).min(widest)` |\n| `Auto { cap, min_marginal_gain }` | grows while the next worker earns its keep |\n\n`Auto` walks `n` from 2 up to `widest.min(cap)`, comparing `amdahl(p, n)` against the previous value. The first `n` whose marginal gain falls below `min_marginal_gain` breaks the loop, and `best` holds the last *accepted* count — the rejected `n` is never adopted.\n\nWorked example, from `auto_concurrency_stops_when_marginal_gain_dries_up`: sixteen independent nodes of weight 1 give one wave, critical cost 1, total 16, so `p = 0.9375`. Marginal gains run 0.88, 0.78, 0.70, 0.63, 0.57, 0.52 — and then 0.47 at `n = 8`, below the 0.5 threshold. The loop stops at 7 workers rather than fanning out to the cap of 16 for a fifth of a speedup unit.\n\n### `plan(spec: &GraphSpec) -> Result<Plan, GraphError>`\n\nThe full pass, and the entry point almost every caller uses.\n\n```mermaid\nflowchart TD\n    S[\"GraphSpec\"] --> W[\"waves()\"]\n    S --> C[\"critical_path()\"]\n    S --> T[\"total_cost = Σ weight\"]\n    C --> P[\"parallel_fraction()\"]\n    T --> P\n    W --> CC[\"choose_concurrency()\"]\n    P --> CC\n    CC --> PL[\"Plan\"]\n```\n\n`Plan` carries the schedule and the whole sizing argument, so a caller can show its work rather than just asserting a worker count:\n\n```rust\npub struct Plan {\n    pub waves: Vec<Wave>,\n    pub critical_path: Vec<String>,\n    pub critical_path_cost: f64,\n    pub total_cost: f64,\n    pub parallel_fraction: f64,\n    pub concurrency: usize,\n    pub predicted_speedup: f64,\n    pub speedup_ceiling: f64,\n}\n```\n\nNote that `plan` runs `waves` twice — once directly, once inside `critical_path`. Intentional: the crate is cheap enough that clarity wins over threading the order through, and both call sites want the cycle check.\n\n### `unisolated_parallel_writers(spec, waves) -> Vec<String>`\n\nA safety report, not a fix. It scans each wave for nodes with `role == Role::Builder && !isolated`, and if more than one lands in the same wave, every one of them goes into the output — those agents will write to the same worktree concurrently and clobber each other.\n\nThe crate reports rather than repairs because the resolution is a config decision: mark the nodes `isolated`, add a dependency edge to serialize them, or accept the risk. The scheduler has no basis for choosing.\n\n## How it plugs into the rest of loopsmith\n\n```\nloopsmith-graph\n├── src/cmd/plan.rs        execute()      → plan() + unisolated_parallel_writers()\n├── src/web/assemble.rs    plan_view()    → plan() + unisolated_parallel_writers()\n├── src/run/mod.rs         execute()      → plan()\n├── src/run/phases.rs      new()          → waves()   (over Phase, not NodeSpec)\n└── loopsmith-mcp          tool_plan()    → plan()\n```\n\n- **`src/cmd/plan.rs`** — the `loopsmith plan` subcommand. Dry-run inspection: prints the waves, critical path, chosen concurrency, and any unisolated-writer warnings without executing anything.\n- **`src/run/mod.rs`** — the live runner. Plans before dispatch and uses `Plan::waves` as the dispatch order and `Plan::concurrency` as the worker count.\n- **`src/run/phases.rs`** — the phase gate. `new()` schedules `Phase` values through the same `waves` call; `refresh()` uses the resulting order to keep a later phase shut until the earlier one closes.\n- **`src/web/assemble.rs`** — `plan_view()`, reached from `review_config()`, renders the same plan in the web review UI.\n- **`loopsmith-mcp`** — exposes `tool_plan` over stdio so an agent can ask for the schedule of a config it is editing.\n\nThe graph plane sits alongside the gate, not inside it. It decides *what runs when and how widely*; it has no say in whether a goal is satisfied. That stays with `loopsmith-gate`, per the project's one rule — a model must not be the thing that certifies its own completion.\n\n## Contributing notes\n\n- **Keep it deterministic.** `BTreeMap`/`BTreeSet`/explicit sorts throughout. Any change that introduces hash iteration order into wave composition or critical-path tie-breaking is a regression even if the tests happen to pass.\n- **Keep it total.** Every public function handles the degenerate cases: empty node lists, zero total cost, `n == 0`, `p == 1.0`. Preserve that — callers plan on partially-written configs.\n- **New graph section? Implement `DagNode`.** The `Step` test exists to prove the seam works for a type that shares nothing with `NodeSpec`; extend that test rather than duplicating the algorithm.\n- **`Cargo.toml` ships `src/` only.** The integration tests read `config/examples/` and `config/loop.schema.json` from the repo root, which no crate tarball can contain — including them would publish tests that cannot pass. Repo-root fixtures are fine for tests; do not add them to `include`.\n- **The API is not stable across minor versions.** This crate is a component of the `loopsmith` binary, not a general-purpose scheduling library.","gating-success-criteria":"# Gating & Success Criteria\n\n# Gating & Success Criteria (`loopsmith-gate`)\n\nThe gate is the component that decides whether a goal is done. It is deliberately the smallest crate in the workspace with the largest constraint attached to it: **`GoalState { satisfied: true }` is constructed here and nowhere else.** No prompt, no model, no judge node, and no other crate may set that field. The gate reads config-declared validations, runs mechanical detectors against collected evidence, and returns a verdict.\n\nEverything else in this document is a consequence of that one rule.\n\n## The three invariants\n\n**1. Only the gate may promote.**\n`TargetVerdict::to_goal_state` is the single constructor of a satisfied `GoalState`. A builder model reporting \"I finished\" is not evidence and is not represented anywhere in the `Evidence` struct.\n\n**2. The gate may also revoke.**\n`evaluate` is a pure function of `(config, target, evidence)` — it holds no memory of prior runs. Re-running it after a required artifact is deleted flips `satisfied` back to `false`. The test `the_gate_can_take_done_back` pins this: write `report.md`, evaluate (satisfied), delete it, evaluate again (not satisfied). A gate that only promotes is a burndown chart with extra steps.\n\n**3. A judge must be independent of the builder.**\nWhen `providers.enforce_judge_independence` is set, a `Judgment` whose `provider_id` equals its `builder_provider_id` is *refused* — it doesn't get downgraded or averaged in, it short-circuits the whole check to `false` with the evidence string `\"judgment refused: judge and builder both ran on ...; a shared provider shares its blind spots\"`. Sharing a provider between builder and judge means sharing blind spots.\n\n## Failure semantics: everything fails closed\n\nEvery ambiguous condition resolves to \"not satisfied\":\n\n| Condition | Result |\n|---|---|\n| Detector cannot run (`GateError::Detector`) | check fails, evidence is `\"detector error: ...\"` |\n| Invalid regex (`GateError::Regex`) | check fails |\n| Metric never reported | check fails, `\"metric \\`x\\` was not reported\"` |\n| Artifact never collected | check fails, `\"artifact \\`x\\` was not collected\"` |\n| No judgment recorded for a `Judge` validation | check fails, `\"no judgment recorded for \\`x\\`\"` |\n| Target has **zero** blocking validations | target unsatisfied, `\"nothing to satisfy\"` |\n\nThat last row is the one that surprises people. A target with no blocking validation aimed at it is *never* satisfied, no matter how many advisory checks pass. Silence is not success — a config that f
