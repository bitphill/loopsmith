hour off twice a year is worse than one that is honestly in UTC. The `crontab` path prints a warning about this, because there the expression is interpreted by *cron*, in local time — a genuine discrepancy that the user needs to know about. For a cadence that shouldn't care about wall clocks at all, `Trigger::Interval` is the right answer.\n\nRather than pull in a date crate, the module carries `civil_from_unix`, a direct port of Howard Hinnant's `civil_from_days`, producing a `Civil { year, month, day, hour, minute, weekday }`. The weekday falls out of `(days + 4).rem_euclid(7)` because 1970-01-01 was a Thursday. This function has one out-of-module consumer: `logging::format_utc` uses it to stamp log lines.\n\n## Cron parsing\n\n`CronExpr::parse` takes the standard five fields — `minute hour day-of-month month day-of-week` — and delegates each to `parse_field(spec, min, max)`, which returns a `Field`:\n\n```rust\npub enum Field {\n    Any,                 // `*`\n    Values(Vec<u32>),    // sorted, deduplicated\n}\n```\n\n`parse_field` handles comma lists, `a-b` ranges, and `/step` suffixes in any combination (`*/15`, `9-17`, `1,15`). Because `Values` is kept sorted and deduplicated, `Field::matches` is a binary search.\n\nErrors are strings that name the offending token: a step of `0` is rejected explicitly (\"step of 0 would never fire\") rather than looping forever, and out-of-range or inverted ranges report the bound they violated. Day-of-week accepts `0..=7` and `CronExpr::matches` treats `7` as Sunday when the computed weekday is `0`, matching every other cron.\n\n`CronExpr::parse` returns `Result<Self, String>` and `Watcher::poll` swallows the error with `let Ok(c) = ... else { continue }` — a malformed expression that survived config validation makes its trigger inert rather than killing the watcher.\n\n## The Watcher\n\n`Watcher` holds the state that makes triggers *edges* rather than *levels*. All four maps exist to answer \"have I already seen this?\":\n\n```rust\npub struct Watcher {\n    fired_minute: BTreeMap<String, i64>,   // cron expr → minute-of-epoch\n    last_interval_run: BTreeMap<u64, i64>, // period → last fire\n    last_mtime: BTreeMap<String, u64>,     // watched path → last seen mtime\n    satisfied_seen: BTreeMap<String, bool>,// goal → last known satisfaction\n    ignore: Vec<String>,                   // extra dirs to skip\n}\n```\n\n`poll(triggers, root, now, satisfied)` returns `Vec<Fired>` — every trigger that came due on this tick. Each variant has its own definition of \"due\":\n\n- **`Trigger::Cron`** — the expression matches the current `Civil` *and* `fired_minute` does not already hold this minute-of-epoch. The watcher polls faster than once a minute, so without this guard a `* * * * *` entry would fire on every poll inside the minute.\n- **`Trigger::Interval`** — the first `poll` primes `last_interval_run` and fires nothing; subsequent polls fire once `now - prev >= seconds`. Starting a watcher does not immediately kick off a run.\n- **`Trigger::FileChange`** — compares `newest_mtime_ignoring(root.join(path))` against the last recorded value, firing only on a strict increase. A path with no previous entry records the current value and stays quiet.\n- **`Trigger::GoalSatisfied`** — fires on the `false → true` transition only. Still-satisfied is not a new edge.\n- **`Trigger::Manual`** — never fires from the watcher.\n\n`Watcher::prime(triggers, root)` records the current mtime for every `FileChange` trigger without firing, so starting the watcher does not look like a change. `Watcher::ignoring(ignore)` is the constructor `watch.rs` actually uses, passing the success-export directory name.\n\n### What the watcher must never see\n\n`newest_mtime_ignoring` walks a path (depth-limited to 24) and returns the newest mtime in seconds, reporting `0` for a missing path — a watched path that does not exist yet is a normal state, not an error.\n\nThe skip list is where the real design pressure is:\n\n```rust\nconst NEVER_WATCHED: [&str; 3] = [\"state\", \".git\", \"logs\"];\n```\n\nEvery one of these is written *by* a run. A watcher that noticed them would fire a run, which would write them, which would fire a run — a loop that is never idle again, with nothing in the output explaining why. `state/` is sled's directory; `logs/` holds the run log, written on every single iteration.\n\nThe `extra` parameter covers the case only the caller knows: the success export, whose directory is named after the loop and is written whenever a run meets its bar. That one is the same mistake with a longer fuse — the loop would cycle permanently *exactly when it succeeded*. Both cases are pinned by tests (`the_watcher_ignores_its_own_state_directory`, `the_watcher_ignores_the_run_log_and_the_success_export`), the second of which also asserts that an ordinary edit still registers, so the skip list can't quietly render the trigger inert.\n\n### Poll cadence\n\n`poll_interval(triggers)` returns the shortest sensible sleep for a trigger set, starting at 30s and tightening per trigger:\n\n| Trigger | Ceiling | Why |\n|---|---|---|\n| `Cron` | 20s | Sub-minute polling, or a minute can be missed entirely |\n| `FileChange` | 5s | Responsiveness to edits |\n| `Interval { seconds }` | `seconds / 4`, floor 1 | Sample well inside the period |\n| `Manual` | — | No constraint |\n\nThe result is clamped to at least 1s.\n\n`Fired::describe()` renders the reason for the run log — `\"cron `* * * * *` matched (UTC)\"`, `\"`src/` changed\"`, and so on. It is the only place the *why* of a run becomes user-visible text.\n\n## OS handoff\n\n`schedule.rs` generates three artifacts as plain strings; none of them touch the filesystem:\n\n- **`launchd_plist(label, exe, config, log_dir)`** — a `RunAtLoad` + `KeepAlive` agent invoking `loopsmith watch <config>`, with stdout and stderr pointed at the log dir.\n- **`crontab_line(exe, config, expr, log_dir)`** — `<expr> <exe> run <config> >> <log_dir>/loopsmith.log 2>&1`.\n- **`schtasks_command(label, exe, config)`** — a `schtasks /Create /F /RL LIMITED /TN \"<label>\" /SC MINUTE /MO 1 /TR ...` invocation. `/F` so re-running updates the task instead of clashing on the name; `/RL LIMITED` because a loop has no business running elevated.\n\nThe `schtasks` quoting is the fiddly part and has a test of its own. `/TR` takes the entire command as a single argument, so the paths inside it need a second level of escaping (`\\\"`) — `C:\\Program Files\\…` is the case that finds out whether it's there. The test also pins that the output is exactly one line, since pasting it into a shell is the whole delivery mechanism.\n\n`default_label(loop_name)` produces `com.loopsmith.<sanitized>`, replacing every non-alphanumeric ASCII character with `-` so the label is safe for launchd.\n\n`launch_agents_dir()` resolves `~/Library/LaunchAgents` via `loopsmith_util::platform::home_dir`, but `LOOPSMITH_LAUNCH_AGENTS_DIR` overrides it. That override exists for the test suite: installing a launch agent is a persistent, user-visible change, and a suite that makes one into a real home directory is a suite nobody can run twice.\n\n## The `schedule` command\n\n`cmd/schedule.rs::execute(config, install)` loads the config, resolves the absolute config path and current exe, creates `<root>/logs`, and dispatches on `Platform::detect().scheduler()`.\n\nThe dispatch key is **what is installed**, not what the OS is famous for. `cfg!(target_os = \"macos\")` tells you the build target had launchd; it does not tell you this machine has `launchctl` on `PATH`, and a container built `FROM debian` has neither `crontab` nor `systemctl` unless someone put them there. Printing a crontab line to a host with no cron is an instruction that silently does nothing.\n\nWhen no scheduler is found, `execute` errors with the list of candidates that were actually probed — obtained from `preferred_names`, which re-reads `loopsmith_util::platform::preferred_schedulers(p.os)` rather than restating the list. The version that restated it told a Windows user to install `crontab`. The error also points at the fallback: `loopsmith watch` under any process supervisor — a systemd unit, a container restart policy, or a terminal left open.\n\nThe log directory is `<config_dir>/logs`, deliberately not `state/`. `state/` is sled's, and the watcher ignores everything inside it — including, until this was moved, the OS's own record of why the loop failed to start.\n\n### What `--install` actually does\n\nOnly one of the three branches has somewhere safe to write:\n\n| Scheduler | `--install` behavior |\n|---|---|\n| `launchctl` | Writes `<LaunchAgents>/<label>.plist`, then prints the `launchctl load -w` command for the user to run |\n| `schtasks` | Prints the command; calls `nothing_to_install` — Task Scheduler's jobs live in a database reachable only through `schtasks` |\n| crontab / other | Prints the line; calls `nothing_to_install` — a crontab is one file per user with no drop-in directory, so writing to it means rewriting entries this loop did not put there |\n\n`nothing_to_install(reason)` exists so a flag that cannot do anything says so on stderr, instead of being silently accepted. A no-op flag is worse than one that explains itself: the user walks away believing something was installed.\n\nEven in the launchd case, the module stops one step short. Writing the plist is reversible; `launchctl load -w` starts a process that survives reboots. That step stays the user's call, for the same reason `schtasks` prints rather than executes.\n\n## Extending the module\n\n- **Adding a trigger kind** means a new `Trigger` variant in `loopsmith-core`, a match arm in `Watcher::poll`, a matching `Fired` variant with a `describe()` string, whatever state it needs on `Watcher`, and a case in `poll_interval` if it constrains cadence. Ask whether the new trigger is an edge or a level — every existing one is an edge, and `poll` is called far more often than the thing it watches changes.\n- **Anything a run writes** must be unreachable from `newest_mtime_ignoring`, either in `NEVER_WATCHED` or through the `extra` list. This is the module's recurring failure mode and the reason two of its tests read like incident reports.\n- **Cron changes** should keep `parse` total over hostile input; the `malformed_expressions_are_rejected_with_a_reason` test enumerates the shapes that must stay rejected, `*/0` among them.\n- **New scheduler backends** belong behind `Platform::scheduler()` and `preferred_schedulers` in `loopsmith-util`, so the probe and the error message keep sharing one list.","skills-system":"# Skills System\n\n# Skills System (`loopsmith-skills`)\n\nHow a loop gets the sub-agents it needs, and how it learns which ones were worth having.\n\nThe crate has two responsibilities that look unrelated but are two halves of one idea:\n\n1. **Acquisition** — resolve a required skill name to a directory on disk, trying installed skills, then the marketplace, then generation.\n2. **Outcome ranking** — pair each skill use with the gate verdict that followed it, and turn that history into adopt/drop recommendations.\n\nThe second exists because the first cannot be decided by reasoning. A loop has no way to know in advance which sub-agents earn their keep; it has to try one, watch the gate, and keep what correlates with satisfied goals. Acquisition is an action the loop takes on its own. *Adoption* — writing a skill into the config — is a proposal a human applies.\n\n## Design invariants\n\nThree rules shape nearly every function here.\n\n**Quarantine, not installation.** Anything fetched or generated lands under `policy.quarantine_dir` (`generated-skills/` by default), never in `~/.claude/skills/`. An acquired sub-agent runs with whatever the permission grant allowed, so acquisition is a proposal and promotion stays a human act. `ResolvedSkill::quarantined` carries the flag to every caller.\n\n**Refuse, don't sanitise.** `is_safe_name` returns a bool; callers turn a `false` into `SkillError::Refused`. A silently rewritten skill name installs something the caller did not ask for. `is_safe_repo_url` (from `loopsmith-core`) applies the same logic to git URLs — https only.\n\n**Popularity is not trust.** `is_blocklisted` matches credential-shaped substrings (`credential`, `secret`, `exfil`, `keylog`, `password`, `token-steal`) case-insensitively and is applied *after* star ranking, at both the install boundary and inside `rank_entries`. The test `a_high_star_credential_grabber_is_still_excluded` pins this: a 9,000-star entry that matches the query is still dropped.\n\nNetwork access is shelled out to `curl`, `npx`, and `git` rather than linked in. That keeps the crate free of an HTTP client, and means a machine without those binaries degrades to \"installed only\" instead of failing to build. Every shelled call goes through the private `run()` helper, which checks `which(cmd)` first and returns `SkillError::Missing` rather than an opaque `NotFound` io error.\n\n## Acquisition\n\n`acquire(name, purpose, policy, project_root)` walks `policy.acquisition_order` — a `Vec<AcquisitionSource>` from section J of the config, defaulting to `[\"installed\", \"marketplace\", \"generate\"]`.\n\n```mermaid\nflowchart TD\n    A[\"acquire(name, purpose, policy, root)\"] --> B{next step in<br/>acquisition_order}\n    B -->|Installed| C[find_installed]\n    B -->|Marketplace| D[install_from_cli]\n    B -->|Generate| E[generate]\n    C -->|hit| F[\"ResolvedSkill<br/>{name, source, path, quarantined}\"]\n    C -->|miss| B\n    D -->|ok| F\n    D -->|Refused| G[\"SkillError::Refused<br/>(never retried)\"]\n    D -->|other error| B\n    E --> F\n```\n\nThe asymmetry in the marketplace arm is deliberate: a `Refused` (unsafe name, blocklist hit) aborts the whole walk, because falling through to `generate` after refusing to install would produce a skill under a name the safety check rejected. Any other failure — `npx` missing, network down, package not found — is a soft miss and the walk continues.\n\n### Finding what's already there\n\n`skill_search_paths` returns the search order, nearest first:\n\n| Position | Directory | Quarantined? |\n|---|---|---|\n| 1 | `<root>/.claude/skills` | no |\n| 2 | `<root>/generated-skills` | yes |\n| 3 | `<home>/.claude/skills` | no |\n\nHome comes from `loopsmith_util::platform::home_dir()`, not `$HOME` directly — Windows does not set `HOME` outside a POSIX emulation layer, and the user-level directory would silently vanish there.\n\nA skill *is* a directory containing `SKILL.md`. `find_installed` checks exactly that; a directory without one is not a skill. Both `find_installed` and `list_installed` report `Source::Installed` regardless of where the skill actually came from — the filesystem tells you *location*, not *provenance*, and `quarantined` (set by `dir.ends_with(\"generated-skills\")`) carries the caveat. `list_installed` deduplicates by name with a `BTreeSet`, so a project skill shadows a quarantined one of the same name.\n\n### Marketplace\n\nTwo distinct sources sit behind the word \"marketplace\", and they are not interchangeable:\n\n- **`claudemarketplaces.com`** (`marketplace::search_marketplace`) indexes plugin *bundles* — repositories, not individual skills. Discovery only.\n- **The `skills` CLI** (`install_from_cli`, `marketplace::search_skills_cli`) handles individual skills, via `npx --yes skills add <spec> --dir . -y` run with cwd set to the quarantine directory. `--dir .` is what keeps it out of the global skills path.\n\n`install_from_cli` derives the resulting directory name by taking the segment after the last `@`, then after the last `/` — so `vercel-labs/agent-skills@react` becomes `react`, and `owner/repo` becomes `repo`. That is why `is_safe_name` permits `/`, `@`, and `.` while still rejecting `..`, leading `/`, leading `-`, and anything over 64 characters.\n\n### Section-J defaults\n\n`install_default(spec: &DefaultSkill, policy, root)` installs one declared default sub-agent and is **idempotent** — an already-installed skill is returned untouched, so it is safe to call at the start of every run. It branches on `SkillOrigin`:\n\n- `Local` — never fetched. Returns `Missing` with a message telling you to put it under `.claude/skills/` or change its source.\n- `Marketplace` — `install_from_cli(spec.url.unwrap_or(&spec.name), quarantine)`.\n- `Github` — `clone_repo`, which requires an https URL and clones `--depth 1`. A loop wants the skill, not its history.\n\nAfter install, `spec.init_argv()` runs inside the installed directory as **argv, not a shell string**. See the note on `DefaultSkill::init_argv` in `loopsmith-core` for why.\n\n### Generation\n\n`generate(name, purpose, quarantine)` is the last resort. It writes a `SKILL.md` with YAML frontmatter and three sections — a description that says loopsmith wrote it and to review before promoting, an *Approach* section demanding a check that proves the work is done, and an *Output* section demanding evidence. The template text is load-bearing: a generated skill that produces unverifiable claims is useless to the gate.\n\n## The marketplace index\n\n`marketplace.rs` fetches `https://claudemarketplaces.com/api/marketplaces` — a flat JSON array of ~2,600 entries — with `curl -sS --fail --max-time N`.\n\nEverything in that response is **untrusted data written by strangers**. Descriptions and keywords are text to rank, never instructions.\n\n### Lenient deserialization\n\nThe `lenient` module supplies two `deserialize_with` helpers, and the reason is documented scar tissue: `stars` is a JSON **number** in the live index, **absent** on roughly a third of entries, and has been seen as a **string** from third-party mirrors. Declaring the field as `String` made every parse fail — and because the failure was swallowed, search silently returned nothing, which is indistinguishable from a working search with no hits.\n\n- `lenient::number` accepts a number, a string (stripping commas), or absence → `0`.\n- `lenient::string_list` accepts an array, a bare string → single-element vec, or absence → empty.\n\n`runtime/crates/loopsmith-cli/templates/marketplaces.json` documents the verified live shape and is the reference to update if the endpoint changes.\n\n### Ranking\n\n`MarketplaceEntry::relevance` is a keyword-overlap count against a lowercased haystack of `repo + description + categories + plugin_keywords`. It is deliberately dumb — its job is to shortlist for a human or for the trust floor, not to be clever.\n\n`rank_entries` applies, in order: star floor (`SearchOptions::min_stars`, default 100) → blocklist on `repo` → relevance > 0 → sort by relevance then stars → truncate to `limit`.\n\nTwo entry points, and the distinction matters:\n\n- **`rank_checked`** returns `Result` — a parse failure becomes `SkillError::Refused(\"marketplace index did not parse: …\")`.\n- **`rank`** is the convenience wrapper that treats a parse failure as no results.\n\n`search_marketplace` uses `rank_checked`. Prefer it in new code; reach for `rank` only where an empty list is genuinely the right answer to a broken index.\n\n`search_skills_cli` is separate because it queries individual skills rather than bundles. Note that it does **not** check the child's exit status — it returns stdout whatever happened, which is fine for a human-readable search dump and would not be fine for anything parsed.\n\n## Outcome ranking\n\nThe evolution half. `SkillTrial` and `score_skills` live in `loopsmith-memory`; this crate supplies the policy on top.\n\n```mermaid\nflowchart LR\n    A[node runs<br/>with skill X] --> B[gate verdict]\n    B --> C[\"SkillTrial<br/>{skill, source, pass_rate,<br/>satisfied}\"]\n    C --> D[(sled ledger)]\n    D --> E[score_skills]\n    E --> F[recommend]\n    F --> G[\"proposals/<br/>adopt · drop\"]\n    G -.human applies.-> H[config section J]\n```\n\n`recommend(configured, trials, min_trials, adopt_above, drop_below)` returns a `Recommendation { adopt, drop }`:\n\n- A skill with fewer than `min_trials` trials is skipped entirely. One lucky run is not evidence — the test `one_lucky_run_is_not_evidence` pins this.\n- `satisfaction_rate() >= adopt_above` **and not already configured** → `adopt`.\n- `rate <= drop_below` **and currently configured** → `drop`.\n\nRanking is grounded in gate verdicts, not in the model's opinion of its own tooling. `SkillTrial::source` records provenance on every trial, so a skill's track record carries where it came from.\n\nThe output is a proposal written to `proposals/`. Nothing in this crate mutates the config.\n\n## Integration points\n\n| Caller | Function | What it does |\n|---|---|---|\n| `src/run/dispatch.rs::ensure_skills` | `find_installed`, `acquire` | Per-node resolution before dispatch |\n| `src/run/mod.rs::install_default_skills` | `install_default` | Section-J defaults at run start |\n| `src/run/evolve.rs::skill_proposals` | `recommend` | Turns trials into proposals after a run |\n| `src/cmd/skills.rs::list` | `list_installed` | `loopsmith skills list` |\n| `src/cmd/skills.rs::search` | `search_marketplace`, `search_skills_cli`, `SearchOptions` | `loopsmith skills search` |\n| `src/cmd/skills.rs::install` | `install_default` | `loopsmith skills install` |\n\nUpstream dependencies: `loopsmith-core` for the config types (`SkillPolicy`, `DefaultSkill`, `SkillOrigin`, `AcquisitionSource`, `is_safe_repo_url`), `loopsmith-memory` for `SkillTrial` / `SkillScore` / `score_skills`, and `loopsmith-util` for `which` and `platform::home_dir`.\n\n`which` is re-exported from `loopsmith-util` rather than reimplemented. It used to be a PATH-only copy that accepted any file, so a non-executable `curl` on PATH read as \"curl is available\"; the shared version checks the executable bit.\n\n## Contributing notes\n\n**The packaging boundary.** `Cargo.toml` sets `include = [\"/src/**/*\", \"/README.md\"]` deliberately. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping them would hand a published crate tests that cannot pass.\n\n**Tests must not touch the network.** `acquire_falls_through_to_generation_when_nothing_is_found` constructs a `SkillPolicy` with the marketplace step removed for exactly this reason. Any new test exercising `acquire` should do the same.\n\n**Trust floors are partially unimplemented.** `templates/marketplaces.json` declares `min_installs: 1000` and a `trusted_owners` list that bypasses the floors. `SearchOptions` implements only `min_stars`; the install-count floor and the trusted-owner bypass are not wired into `rank_entries` yet. If you implement them, the blocklist must stay *after* any bypass — a trusted owner does not unblock a credential-shaped name.\n\n**Two blocklist representations.** The config template lists four glob patterns; `is_blocklisted` hardcodes six substrings. The code is authoritative today. Unifying them means teaching `is_blocklisted` to read from `SkillPolicy`, which changes its signature — check callers in `install_from_cli`, `install_default`, and `rank_entries` first."};

(function() {
  var activePage = 'overview';

  document.addEventListener('DOMContentLoaded', function() {
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
    renderMeta();
    renderNav();
    document.getElementById('menu-toggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
    });
    if (location.hash && location.hash.length > 1) {
      activePage = decodeURIComponent(location.hash.slice(1));
    }
    navigateTo(activePage);
  });

  function renderMeta() {
    if (!META) return;
    var el = document.getElementById('meta-info');
    var parts = [];
    if (META.generatedAt) {
      parts.push(new Date(META.generatedAt).toLocaleDateString());
    }
    if (META.model) parts.push(META.model);
    if (META.fromCommit) parts.push(META.fromCommit.slice(0, 8));
    el.textContent = parts.join(' \u00b7 ');
  }

  function renderNav() {
    var container = document.getElementById('nav-tree');
    var html = '<div class="nav-section">';
    html += '<a class="nav-item overview" data-page="overview" href="#overview">Overview</a>';
    html += '</div>';
    if (TREE.length > 0) {
      html += '<div class="nav-group-label">Modules</div>';
      html += buildNavTree(TREE);
    }
    container.innerHTML = html;
    container.addEventListener('click', function(e) {
      var target = e.target;
      while (target && !target.dataset.page) { target = target.parentElement; }
      if (target && target.dataset.page) {
        e.preventDefault();
        navigateTo(target.dataset.page);
      }
    });
  }

  function buildNavTree(nodes) {
    var html = '';
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      html += '<div class="nav-section">';
      html += '<a class="nav-item" data-page="' + escH(node.slug) + '" href="#' + encodeURIComponent(node.slug) + '">' + escH(node.name) + '</a>';
      if (node.children && node.children.length > 0) {
        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;
  }

  function escH(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function navigateTo(page) {
    activePage = page;
    location.hash = encodeURIComponent(page);

    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].dataset.page === page) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
})();

</script>
