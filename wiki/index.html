var PAGES = {"cli-command-surface":"# CLI Command Surface\n\nI'll write the documentation directly — no exploration needed, the source is in front of me.\n\n# CLI Command Surface\n\nThe `loopsmith` binary. This crate is the only executable in the workspace; every other crate is a library it links. Its job is argument parsing, dispatch, and presentation — the actual work (validation, planning, gating, provider routing, memory) lives in the eight `loopsmith-*` libraries it depends on.\n\nThe package is named `loopsmith`, not `loopsmith-cli`, so `cargo install loopsmith` matches the command it installs. The directory keeps the older name; cargo does not care.\n\n## The shape of the thing\n\nFour layers, each with a single responsibility:\n\n```mermaid\ngraph TD\n    main[\"main.rs<br/>parse + exit code\"] --> cli[\"cli.rs<br/>argument grammar\"]\n    cli -->|\"Cli::resolve()\"| dispatch[\"cmd::dispatch<br/>match over Command\"]\n    dispatch --> cmds[\"cmd/*.rs<br/>one module per subcommand\"]\n    cmds --> libs[\"loopsmith-core / -gate / -memory<br/>-graph / -provider / -skills / -mcp\"]\n    cmds --> local[\"scaffold.rs · logging.rs<br/>permissions.rs · schedule.rs · worktree.rs\"]\n```\n\n`main.rs` is three lines of logic:\n\n```rust\nlet result = cli::Cli::parse().resolve().and_then(cmd::dispatch);\n```\n\nEverything that can fail returns `Result<ExitCode, String>` rather than calling `std::process::exit`. That is what makes a command testable, and it means the exit code is decided in exactly one place — the `match` at the bottom of `main`.\n\n## `cli.rs` — the grammar, and nothing else\n\nThe argument grammar is deliberately separated from the command bodies so it can be read in one sitting. `Cli` carries two global flags and an optional subcommand:\n\n| Field | Purpose |\n|---|---|\n| `web: bool` | `loopsmith --web` |\n| `guided: bool` | `loopsmith --guided` |\n| `command: Option<Command>` | everything else |\n\n### `Cli::resolve` — collapsing two spellings into one\n\n`--web` and the `web` subcommand mean the same thing; so do `--guided` and `guided`. Both spellings exist because a flag is what people reach for and a subcommand is what the rest of the grammar looks like. Rather than teaching `dispatch` about that, `resolve` normalises the pair into a single `Command` before dispatch ever sees it:\n\n```rust\npub fn resolve(self) -> Result<Command, String>\n```\n\nIt is a total match over `(web, guided, command)`, and every rejected combination gets its own message:\n\n- `--web --guided` → two front ends for the same thing; picking one would guess wrong half the time.\n- `--web run loop.yaml` → a contradiction, not a shorthand. Refused rather than silently resolved.\n- nothing at all → names `--help`, `guided`, and `web` instead of clap's generic complaint.\n\nBecause `resolve` returns `Result<_, String>` and `dispatch` returns `Result<ExitCode, String>`, the two chain with `and_then` and share one error path.\n\n## `cmd/mod.rs` — dispatch and the shared helpers\n\n`dispatch(command: Command) -> Result<ExitCode, String>` is a pure match that destructures each variant and hands the fields to that command's `execute`. `Command::Skills` nests one level further into `SkillsAction`.\n\nFour helpers are shared across command modules:\n\n**`config_dir(config: &Path) -> PathBuf`** — the directory holding the config. `Path::parent()` returns `Some(\"\")` for a bare `loop.yaml`, and an empty path is not a usable working directory (spawning into it fails with ENOENT), so this normalises to `.`. Nearly every command that touches the filesystem or spawns a process routes through it.\n\n**`config_file_name(config: &Path) -> String`** — the config's own file name, for generated scripts that `cd` into the loop directory first and therefore want a relative name.\n\n**`open_store(config: &Path)`** — opens the sled store at `<config_dir>/state`. Used by `status`, `ledger`, `proposals`, `watch`, and `skills scores`.\n\n**`report_outcome(out: &RunOutcome)`** — the end-of-run summary shared by `run`, `resume`, and `watch`: run id, iteration count, stop reason, spend (flagged as estimated when no provider reported usage), proposal count, per-target verdicts, log path, and the export path when a run converged. When `out.stop.is_success()` is false it prints the `loopsmith ledger` invocation for that run id, because the ledger is where the failure is legible.\n\n### The `web` feature\n\n`web` is a default feature gating `axum` and `tokio` — the whole async tree. Dispatch handles its absence explicitly rather than dropping the variant:\n\n```rust\n#[cfg(not(feature = \"web\"))]\nCommand::Web { .. } => Err(\"this build has no web UI. Rebuild with the `web` feature: …\")\n```\n\nA command that exists in `--help` but errors with build instructions beats one that vanishes.\n\n## The commands\n\nEach lives in `cmd/<name>.rs` with a single `execute`. Grouped by what they do:\n\n### Authoring\n\n| Command | Module | Notes |\n|---|---|---|\n| `new --path <dir>` | `new.rs` → `scaffold.rs` | `--path` is mandatory; a loop owns durable state |\n| `guided` / `--guided` | `guided/` | terminal wizard, `--edit <file>` to walk an existing config |\n| `web` / `--web` | `web/` (feature-gated) | localhost-only browser UI |\n| `validate <config>` | `validate.rs` | `--strict` promotes warnings to errors |\n| `convert <config>` | `convert.rs` | YAML ⇄ Markdown, same model either way |\n\n`new` never blocks on a prompt. A command that waits for a keypress cannot be run from a script, a Makefile, or the agent setting the loop up for you — so a complete config arrives via `--config-file` or `--config-stdin`, parsed by `read_provided` before anything is written. With `--config-file`, the file's extension picks the grammar (`loopsmith_core::is_markdown`); guessing from content would let a stray `#` reinterpret someone's YAML.\n\n### Inspection\n\n`plan` prints waves, critical path cost, parallel fraction `p`, chosen concurrency, and the Amdahl speedup ceiling from `loopsmith_graph::plan`, then warns about `unisolated_parallel_writers` — builder nodes that may run in the same wave without worktree isolation.\n\n`status` prints the gate's recorded rulings per target plus the checkpoint iteration. `ledger` tails the append-only entries (`--limit`, default 50, applied with `saturating_sub`). `proposals` prints what the loop wants changed about itself, with a coarse `age()` rendering — nobody asks which millisecond a proposal was written — and marks expired ones stale without deleting them; the record is still the only account of why the loop asked.\n\n`gate` evaluates once against the working tree. It calls `run::collect_evidence` with an empty judgment vector, so subjective checks correctly report that no judgment was recorded. It exits non-zero when the target is not satisfied.\n\n`providers` reports per-provider availability via `loopsmith_provider::availability`, showing the command when reachable and `why_not()` when not.\n\n`doctor` is the environment probe, and the one command whose output is purely advisory — it always exits `SUCCESS`, because reporting a constraint is not the same as the machine being unusable and a non-zero exit would fail an otherwise-fine CI step. It reports OS, userland (with the literal `sed` in-place flags, rendering the empty BSD argument as `''` because that *is* the difference between the two), bash version, `/bin/sh`, the scheduler actually on `PATH`, and five tools. Given a config it also runs `config_notes`, which walks script detectors and checks each command exists and is executable — a detector runs with no shell, so `command` is argv[0] and a relative path resolves against the loop directory.\n\n### Execution\n\n`run` and `resume` are the same operation with a different starting checkpoint, and share `cmd::run::start`:\n\n```rust\npub fn start(config: &Path, opts: RunOptions) -> Result<RunOutcome, String> {\n    let cfg = loopsmith_core::load_validated(config)?;\n    let store = open_store(config)?;\n    let out = crate::run::execute(&cfg, &store, &opts)?;\n    report_outcome(&out);\n    Ok(out)\n}\n```\n\n`resume` differs only in setting `resume: true` and forcing `dry_run: false`. `exit_code` maps a run that did not meet its bar to `ExitCode::FAILURE`, so a scheduler or CI step notices without parsing output. Run ids default to `run-<now_ms>`.\n\n`watch` stays resident. It refuses upfront if every trigger is `Manual` — `watch` would otherwise sleep forever — then polls at `schedule::poll_interval`, reading goal state fresh each tick so a `goal_satisfied` trigger sees runs started elsewhere. Two details carry weight:\n\n- The `Watcher` is constructed `ignoring` `<name>-success`, the success export directory. A `file_change` trigger on the loop root would otherwise see the export and start a run that writes it again.\n- A failed run is printed to stderr and the loop continues. That is precisely the difference between a scheduler and a one-shot.\n\n`schedule` writes the launchd agent or crontab line; installing it is a persistent change to the machine and stays the user's call.\n\n### Skills\n\n`cmd/skills.rs` holds five entry points rather than one `execute`: `list`, `search`, `acquire`, `install`, `scores`.\n\n`list` defaults to loop-local skills, filtering out anything under `$HOME/.claude/skills` unless `--all` — the global directory is dozens of entries and drowns the signal. `search` queries both claudemarketplaces.com and `npx skills find`, treats either being unavailable as a printed note rather than an error, and installs nothing. `install` materialises section J on demand and returns `FAILURE` if any spec failed. `scores` ranks sub-agents by the gate outcomes that followed their use, and closes by naming `cfg.skills.min_trials` — one lucky run proves nothing.\n\nEverything acquired lands quarantined. Both `acquire` and `install` say so explicitly: a sub-agent runs with whatever your permission grant allowed.\n\n### Plumbing\n\n`permissions` prints or merges the consolidated grant. `prune` removes the git worktrees the loop created, probing each `isolated` node through `worktree::create`/`remove`. `mcp` serves `loopsmith_mcp::Server` over stdio.\n\n## `scaffold.rs` — what `loopsmith new` materialises\n\nThe largest local module, and the one with the most environmental reasoning baked in.\n\n`scaffold(&NewLoopArgs) -> io::Result<Scaffold>` writes the config, `.gitignore`, README, MCP definition, `marketplaces.json`, the permission grant (via `crate::permissions::required` and `merge_into`), all four launchers, and `scripts/compat.sh`. It returns which files were written, which config file name was used, and `Option<Result<(), String>>` for git — `None` when not asked for, `Some(Err)` when asked for and impossible, never fatal.\n\n**`guard_path`** runs first and refuses an empty path, a filesystem root, the home directory, and — the load-bearing one — anything inside the loopsmith installation. A loop edits files, installs sub-agents, and writes state; pointing one at the checkout that runs it lets a loop modify its own runtime. `install_root()` finds that checkout by walking up from `current_exe` looking for `config/loop.schema.json` and `runtime/Cargo.toml` together, which covers `cargo run`, an installed release binary, and a symlink into the repo. The refusal suggests a working alternative (`--path ~/loops/<name>`) rather than just saying no.\n\n**A supplied config is parsed before it is written.** A new loop directory holding an unparseable config is worse than no directory, so `parse_str`/`parse_md` runs first and an error aborts before anything lands.\n\n**`binary_path()` is deliberately not canonicalized when already absolute.** Package managers install behind a stable symlink into a versioned directory — Homebrew's `/usr/local/bin/loopsmith` points into `/usr/local/Cellar/loopsmith/<version>/`. Resolving the symlink pins the version, so every loop created before an upgrade gets a dead path in its launcher. The symlink is the durable answer. A *relative* `current_exe` still gets canonicalized, because cron and launchd inherit neither a working directory nor a `PATH`.\n\n**Both launcher flavours are written on every platform.** `run.sh`/`resume.sh` are POSIX `sh` — not bash — because macOS still ships bash 3.2.57 and bash-4 syntax fails there. `run.cmd`/`resume.cmd` are written with CRLF (`crlf()`), because older `cmd.exe` reads a trailing `\\n` as part of the last token, turning `exit /b 2` into an unknown command. A loop directory outlives the machine that made it, so a loop scaffolded on a Mac has to start on Windows without regeneration; `cmd.exe` cannot run a shebang and no POSIX shell will run a `.cmd`, so the pair is the only arrangement that survives the copy.\n\n**The `.cmd` launchers have exactly one `exit /b`, on the last line.** This is worth understanding before editing them. `setlocal` saves the errorlevel and the implicit `endlocal` at end-of-file *restores* it, so a bare `exit /b 127` reports 0. `endlocal & exit /b 127` fixes that at top level but not inside a nested `if ( … )` block — which is where the failing path lived. So every path sets `CODE` and falls through to `:loopsmith_done`. Relatedly, the header uses `enabledelayedexpansion` and `!ERRORLEVEL!`: a parenthesised block is parsed as a unit, so `%ERRORLEVEL%` inside one expands to the value from before the block.\n\n**Templates are compiled in** with `include_str!` from `templates/`, not read from the install directory. That is what makes a new loop self-contained and makes it impossible for `new` to depend on — or touch — the checkout it was launched from. They live inside the crate rather than the repo's `config/` for a packaging reason: a published tarball holds only its own directory, so an `include_str!` reaching above the crate root compiles locally and fails `cargo package --verify`. The same constraint drives the `include` list in `Cargo.toml`, including why the compiled web UI sits under `src/web/dist/`.\n\n`init_git` runs last so the initial commit captures the whole scaffold. The commit is not optional: `git worktree add` resolves a start point and a repository with no HEAD has none, so an uncommitted repo fails as unhelpfully as no repo. Identity is passed inline with `-c user.email=…` rather than written to the repo config — a machine with no `user.email` would fail the commit, and silently editing someone's git identity to scaffold a loop is not a trade anyone agreed to. An existing `.git` is left alone.\n\n## `logging.rs` — the run log\n\nThe sled ledger is the durable, queryable record, but it is a database: you cannot `tail -f` it, and after an unattended run finishes at 4am the first thing anyone wants is a file to scroll.\n\n`Recorder<'a, S: Store>` bundles store, run id, and `RunLog`. Its single `entry()` method builds a `LedgerEntry` and writes it to *both* — one method that records an event means the log and the ledger cannot disagree about what happened. `crate::run::execute`, `run::dispatch::ensure_skills`, and `install_default_skills` all record through it.\n\nLogs land in `<loop>/logs/`, deliberately not `<loop>/state/`: sled owns that directory, and the watcher ignores everything inside it. Three things are load-bearing:\n\n- **Failures are swallowed.** `RunLog::open` degrades to a no-op when the directory cannot be created. A full disk is a reason to lose the log, not to kill a run doing useful work.\n- **`sanitize()` on the run id.** Ids come from a timestamp today, but `--run-id` reaches this unchecked, and a path separator in a filename is how a log ends up somewhere nobody looks. `../../etc/passwd` becomes `------etc-passwd`.\n- **Newlines are replaced with spaces** in `write`, so one entry is always one line — `grep` and eyeballs both work.\n\n`format_utc` reuses `schedule::civil_from_unix`, the same hand-rolled civil-date arithmetic the cron matcher uses. UTC throughout, for the reason documented on the scheduler: deriving a local offset is unsound in a multithreaded process on Unix, and a scheduler quietly an hour off twice a year is worse than one honestly in UTC.\n\n## Contributing\n\n**Adding a subcommand** touches three places: a variant on `Command` in `cli.rs` (doc comment becomes the help text), a `pub mod` plus a `dispatch` arm in `cmd/mod.rs`, and a new `cmd/<name>.rs` exposing `execute(…) -> Result<ExitCode, String>`.\n\nConventions worth keeping:\n\n- Return `Result<ExitCode, String>`; never `exit()`. One exit path, in `main`.\n- Reach for `config_dir`, `config_file_name`, and `open_store` rather than re-deriving paths.\n- Decide the exit code deliberately. `gate` and `validate` fail on a bad verdict; `run` fails when the bar was not met; `doctor` never fails.\n- `load` vs `load_validated`: read-only inspection commands use `loopsmith_core::load`; anything that will *execute* the loop uses `load_validated` (`run`, `resume`, `watch`).\n- Prose in output is part of the interface. Messages here say what to do next, not just what went wrong — the refusal in `guard_path` and the ledger hint in `report_outcome` are the pattern.\n\nTests live beside the code in `#[cfg(test)]` modules and use `loopsmith_util::testing::{temp_dir, temp_path, cleanup}` (`loopsmith-util` with the `testing` feature is a dev-dependency). Tests that need git return early when `loopsmith_util::which(\"git\")` is `None`. Two in `scaffold.rs` are worth preserving verbatim: `creating_a_loop_leaves_the_loopsmith_installation_untouched` fingerprints `config/` and `skills/` before and after a scaffold, and `the_starter_config_validates_once_pre_execution_is_marked_done` asserts the starter config *fails* validation as shipped — the refusal to run before the manual pass is done is a feature, not a gap.","distribution-installers":"# Distribution & Installers\n\n# Distribution & Installers\n\nEverything outside `runtime/` that gets a `loopsmith` binary onto a machine. The Rust workspace produces one executable; this module is the five different stories told about how that executable arrives, plus the tooling that keeps those stories agreeing on a version number.\n\nNothing here is linked into the binary. It is shell, PowerShell, Ruby, JavaScript, and Python that runs on the user's machine before `loopsmith` ever executes.\n\n## The channels\n\n| Channel | Entry point | How the binary is obtained | When |\n|---|---|---|---|\n| Source install (POSIX) | `install.sh` | `cargo build --release` | at install |\n| Source install (Windows) | `install.bat` → `installers/install.ps1` | `cargo build --release` | at install |\n| Homebrew | `Formula/loopsmith.rb` | `cargo install` via `std_cargo_args` | at install |\n| npm | `npm/scripts/install.js` (`postinstall`) | download + SHA256 verify | at install |\n| PyPI | `pypi/src/loopsmith_cli/` | download + SHA256 verify | **first run** |\n| crates.io | `cargo install loopsmith` | compiled by cargo | at install |\n\nThree of these compile from source and two ship a prebuilt artifact. The split matters because it determines what can go wrong: the compiling channels fail on toolchain problems (no cargo, cargo too old, no MSVC linker), and the downloading channels fail on host-detection and integrity problems (wrong target triple, checksum mismatch, unlisted asset).\n\n```mermaid\nflowchart TD\n    A[user] --> B[install.sh / install.bat]\n    A --> C[brew install]\n    A --> D[npm i -g]\n    A --> E[pip install]\n    B --> F[cargo build --release]\n    C --> F\n    D --> G[download release asset]\n    E --> G\n    G --> H[verify against SHA256SUMS]\n    F --> I[loopsmith on PATH]\n    H --> I\n```\n\n## Build-from-source installers\n\n### `install.sh`\n\nBash, `set -euo pipefail`, re-runnable — running it a second time is the documented upgrade path. It is deliberately bash and not POSIX sh, in contrast to the loop scripts the tool *generates*: an installer runs once on a machine someone is sitting at.\n\nThe sequence:\n\n1. `detect_os` normalizes `uname -s` to `linux`/`macos`/`bsd`/`windows`/`unknown`. `unknown` is fatal; `windows` (MSYS/Cygwin) warns and continues, since a POSIX layer is present.\n2. Delegates to `installers/deps.sh` if it exists beside the script; otherwise falls back to an inline `rustup` install.\n3. Prepends `$HOME/.cargo/bin` to `PATH` **for this process**. rustup writes its PATH line into `~/.profile`, which zsh never reads — so a machine that just installed cargo can still not see it.\n4. Picks a source directory: a `runtime/` directory beside the script wins over cloning. This is what makes `git clone && ./install.sh` install the code you just cloned rather than whatever `main` happens to be. Otherwise `git clone --depth 1 --branch \"$BRANCH\"` into `$INSTALL_DIR/src`.\n5. `cargo build --release --bin loopsmith` in `$SRC_DIR/runtime`, then `install -m 0755` the result into `$INSTALL_DIR/bin/loopsmith`.\n6. Symlinks into `$BIN_LINK_DIR` **only if it is writable or we are root** — no implicit sudo. When it can't, it prints the `export PATH=...` line instead of failing.\n\nKnobs, all environment variables with defaults:\n\n| Variable | Default |\n|---|---|\n| `LOOPSMITH_REPO_URL` | `https://github.com/bitphill/loopsmith.git` |\n| `LOOPSMITH_HOME` | `$HOME/.loopsmith` |\n| `LOOPSMITH_BIN_DIR` | `/usr/local/bin` |\n| `LOOPSMITH_BRANCH` | `main` |\n\nEverything is teed to `$INSTALL_DIR/install.log`, truncated at the start of each run.\n\n### `installers/deps.sh`\n\nCallable on its own. Two rules shape it: **install nothing already present**, and **never install a package manager**. A host with no package manager is a decision someone made, and `pkg_install` reports it rather than working around it.\n\n`pkg_install` dispatches on the *package manager*, not the OS — `apt-get`, `dnf`, `yum`, `pacman`, `apk`, `zypper`, `brew`, `pkg` — because a Debian container may have apt and no sudo, and a Mac may have brew or nothing. `sudo` is prefixed only when not root and `sudo` exists.\n\nIt installs `git` and `curl` when missing, then rustup with `--profile minimal` if `cargo` is absent. It deliberately installs **no** pkg-config or OpenSSL headers: loopsmith links no C libraries and never does TLS in-process, because every provider is an external command.\n\nThe last check parses `cargo --version` and warns if the minor version is below **1.75**, the declared `rust-version`. Without that warning, an older toolchain fails deep inside a dependency with a message about a syntax feature, which is not a useful clue.\n\n### `install.bat` and `installers/install.ps1`\n\n`install.bat` exists so the install is one word instead of an execution-policy incantation. It checks for `powershell` on `PATH` (exit `127` with a clear message if absent) and invokes `install.ps1` with `-NoProfile -ExecutionPolicy Bypass`, scoped to that one process — nothing about the machine changes.\n\n`install.ps1` mirrors `install.sh` step for step: log file under `$InstallDir`, delegate to `deps.ps1`, prepend `%USERPROFILE%\\.cargo\\bin`, prefer a `runtime` directory beside the repo root over cloning, `cargo build --release --bin loopsmith`, copy `loopsmith.exe` into `$InstallDir\\bin`.\n\nThe one structural difference: there is no symlink step. Instead it edits the **User** PATH via `[Environment]::SetEnvironmentVariable(..., 'User')` — no elevation needed, and a tool installed into a home directory has no business touching a machine-wide setting. It also updates `$env:PATH` in-process and tells the user to open a new shell.\n\n`deps.ps1` follows `deps.sh`'s policy with `winget` and `choco` as the two managers, installs neither, and adds two Windows-specific concerns: `Rustup.Rustup` pulls the MSVC toolchain, so the script warns when `link.exe` is missing and names the Visual Studio C++ build tools package. Without winget it downloads `rustup-init.exe` from `https://win.rustup.rs/x86_64` and deletes it afterward.\n\n## `Formula/loopsmith.rb`\n\nThis file is the **source of truth**; the release workflow renders `url` and `sha256` for the tag being released and pushes the result to `bitphill/homebrew-loopsmith`, which is what `brew install` actually reads. Edit the body here — those two lines get overwritten.\n\nTwo details a contributor will trip over:\n\n- **The cargo workspace root is `runtime/`, not the repository root.** `install` does `cd \"runtime\"` and then `system \"cargo\", \"install\", *std_cargo_args(path: \"crates/loopsmith-cli\")`. Note the path is the *crate* here, where the shell installers use `--bin loopsmith` from the workspace root.\n- **Getting the `sha256` right is the recurring failure.** codeload rate-limits unauthenticated archive downloads and `curl -sL` reports success while writing the error body; hashing that produces a digest no install can ever match. Check the size and gzip validity first — the file should be ~2 MB — and note that `gh api repos/.../tarball/<ref>` is not a substitute: it mangles binary output and returns a 199-byte fragment for every ref.\n\nThe `test do` block is a real smoke test, not a version print. It asserts `--version`, asserts `doctor` emits `platform` and `userland` (`doctor` must stay advisory so a constrained CI container can't make it fail), scaffolds a loop with `loopsmith new`, checks that `loop.yaml`, `run.sh`, and `run.cmd` all landed, and then asserts that `validate` **exits 1** mentioning `pre_execution`. That refusal is the product; a build where it stops happening is a broken build.\n\n## Prebuilt-binary channels\n\nBoth the npm and PyPI packages are Rust binaries wearing a package manager's clothes. Neither exposes anything to `require()` or `import`; the installed command is `loopsmith` and its exit codes are its API.\n\n### The shared contract\n\nEvery release publishes, per target triple, an archive named:\n\n```\nloopsmith-v<VERSION>-<TARGET>.tar.gz     # .zip on Windows\n```\n\nalongside a `SHA256SUMS` file listing all of them, at `https://github.com/bitphill/loopsmith/releases/download/v<VERSION>/`.\n\nSix targets are prebuilt: `x86_64-unknown-linux-gnu`, `x86_64-unknown-linux-musl`, `aarch64-unknown-linux-gnu`, `x86_64-apple-darwin`, `aarch64-apple-darwin`, `x86_64-pc-windows-msvc`. Anything else falls back to `cargo install loopsmith`.\n\n**The verification step is the point of both implementations.** A postinstall script that pipes a downloaded binary onto disk unverified is a supply-chain hole with a progress bar. Both fetch `SHA256SUMS`, find the line ending in the asset name, and refuse if the asset is unlisted or the digest doesn't match — before the file is made executable.\n\n### npm — `npm/scripts/install.js`\n\nRuns as `postinstall`. Flow: `main` → `resolveTarget` → `isMusl`, then two parallel `fetchBuffer` calls (asset and `SHA256SUMS`), digest comparison, and `tar` extraction of a single named member into `npm/bin/`, renamed to `loopsmith-bin` (`loopsmith.exe` on Windows). The wrapper `bin/loopsmith.js` — the `bin` entry in `package.json` — is what npm links onto PATH and what reports a clear error if the binary never landed.\n\n`isMusl` is subtle enough to be worth reading before touching: musl's `ldd` has no `--version` flag, prints usage plus `musl libc` to **stderr**, and exits non-zero, where glibc's answers and exits 0. So the detection is \"did `execFileSync` throw, and does the captured stderr match `/musl/i`\". Getting this wrong yields a binary that dies with a bare `not found` on a perfectly good libc.\n\nExtraction shells out to `tar` in both cases — `tar.exe` has shipped with Windows 10 1803 and later and reads zips.\n\nThe failure handler sets `process.exitCode = 0` **on purpose**. A flaky download should not hard-fail an `npm install` that may be installing twenty other packages; the launcher surfaces the problem at run time instead.\n\n### PyPI — `pypi/src/loopsmith_cli/`\n\nThe important divergence from npm: **the binary is fetched on first run, not during `pip install`**, and cached under `~/.loopsmith/bin/<version>/` (`LOOPSMITH_HOME` overrides the root). A wheel that downloads at install time breaks in every environment that installs without a network and runs with one — CI images, Docker build stages, locked-down build hosts — and the failure surfaces as an install error for a package the user hasn't tried to use yet.\n\n`__init__.py` holds the resolution logic:\n\n- `_target()` maps `platform.system()` / `platform.machine()` to a triple, raising `ResolveError` for unsupported hosts. It uses `platform.machine()` rather than `platform.processor()`, which is empty on most Linux distributions and returns marketing strings on Windows. musl detection here is `platform.libc_ver()` returning empty — a different mechanism from the npm side, solving the same problem.\n- `cache_dir()` is versioned, so an upgrade re-fetches rather than reusing a stale binary.\n- `_expected_digest(asset)` reads `SHA256SUMS` over `_read` and returns the matching line's digest, or raises.\n- `ensure_binary()` orchestrates: cache hit → return; otherwise `_target` → `_expected_digest` → `_read` → compare → `_extract` into a `TemporaryDirectory` → `shutil.move` into the cache → chmod +x.\n- `_extract()` extracts **one named member**, never `extractall`, and rejects symlinks and hardlinks. An archive is untrusted input even when its checksum matched, and a path-traversing entry only needs one careless extraction.\n\n`__main__.py` is the console entry point declared by `[project.scripts]`. Two hazards drive its shape:\n\n1. **There is deliberately no \"reuse a `loopsmith` already on PATH\" shortcut.** pip installs *this package's* console script as `loopsmith`, so `shutil.which(\"loopsmith\")` finds the very script that is running, and `execv`ing it re-enters `ensure_binary` — an infinite exec loop that presents as the command hanging with no output at all. `main()` additionally compares `Path(exe).resolve()` against `Path(sys.argv[0]).resolve()` and refuses, as belt-and-braces against the one failure mode with no useful symptom.\n2. **On POSIX it `os.execv`s rather than wrapping.** loopsmith is long-running and interactive; a Python parent would have to forward signals correctly and would get it wrong at least once. `execv` makes the shell's Ctrl-C reach the real binary and its exit code arrive unchanged. Windows has no process-replacing exec, so it falls back to `subprocess.call` and maps `KeyboardInterrupt` to `130`.\n\nBoth `ResolveError` and `OSError` map to exit `127` with a `cargo install loopsmith` suggestion.\n\n### `pypi/build.sh`\n\nBuilds sdist + wheel into `dist/` and runs `twine check`; `--upload` publishes using `PYPI_TOKEN`.\n\nIt creates a throwaway `.venv-build` rather than calling `python3 -m build` directly, because the interpreter first on `PATH` is not a stable fact: installing anything through Homebrew can put a new `python3` ahead of the one whose user site-packages holds `build` and `twine`, and the failure reads as `No module named build` on a machine where build is very much installed. Homebrew's Python is also PEP 668 externally-managed, so `pip install --user` into it is refused outright. `pick_python()` walks an explicit candidate list (`python3.13` … `/usr/bin/python3`) and requires `import venv` to succeed, so the choice doesn't depend on PATH order.\n\n## Version synchronization — `tools/sync-version.sh`\n\n`runtime/Cargo.toml`'s `[workspace.package] version` is the single source of truth. Everything else is derived:\n\n- `runtime/Cargo.toml` workspace path-dependency versions\n- `npm/package.json` `version`\n- `pypi/pyproject.toml` `version`\n- `pypi/src/loopsmith_cli/__init__.py` `__version__`\n- `Formula/loopsmith.rb` — the tag inside the `url`\n- The tag-pinned logo URL and START-HERE link in `npm/README.md`, `pypi/README.md`, and `runtime/crates/*/README.md`\n\n```bash\n./tools/sync-version.sh           # rewrite everything to match\n./tools/sync-version.sh --check   # non-zero if anything drifted (CI uses this)\n```\n\nHand-editing eight files per release is how one gets missed, and the one that gets missed is usually a URL — failing silently as a broken image on a registry page nobody looks at twice. The READMEs pin to a **tag**, not `main`, because a published README is immutable and an image URL that can move underneath it will eventually be wrong.\n\nTwo implementation notes:\n\n- `apply()` writes through `mktemp` and `mv` rather than using `sed -i`, whose spelling differs between GNU and BSD.\n- The formula's `sha256` is **not** synced. It's the digest of a tarball GitHub generates, so it can't be derived from anything local; the script prints the `curl | gzip -t | wc -c | shasum` recipe at the end as a reminder, and the release checklist owns it.\n\nThe script lives in `tools/`, not `scripts/` — `scripts/` is reserved for a loop's own detector scripts, and the repository deliberately ships none so the `pre_execution` refusal keeps its teaching value.\n\n## Registry names\n\n`loopsmith` was already taken on both npm and PyPI by unrelated projects, so the published names differ from the command:\n\n| Registry | Package | Command |\n|---|---|---|\n| npm | `@bitphill/loopsmith` | `loopsmith` |\n| PyPI | `loopsmith-cli` | `loopsmith` |\n| crates.io | `loopsmith` | `loopsmith` |\n| Homebrew | `bitphill/loopsmith` tap | `loopsmith` |\n\nThe Homebrew formula requires a `brew tap` step because it isn't in homebrew-core; the file carries nothing tap-specific, so it can be submitted unchanged when the project has enough history behind it.\n\n`npm/README.md` and `pypi/README.md` are near-identical marketing copy maintained in parallel — they exist because registry pages render their own README and can't follow a relative link. They differ only in their install commands, badges, and the section describing that channel's install mechanism. Keeping them in sync is manual apart from the URL lines `sync-version.sh` owns.\n\n## Adding a platform\n\n1. Add the target to the release workflow's build matrix so an archive and a `SHA256SUMS` line exist.\n2. Add the mapping to `resolveTarget()` in `npm/scripts/install.js` and to `_target()` in `pypi/src/loopsmith_cli/__init__.py`. These are independent implementations of the same table — changing one without the other means one ecosystem silently falls through to \"build from source\".\n3. Add the row to the prebuilt tables in both READMEs.\n4. If the platform needs a new libc or ABI discriminator, it needs a detection function in each language, and each one is its own hazard — see `isMusl` and `platform.libc_ver()` above.\n\nNothing in `install.sh`, `install.ps1`, or the formula needs touching: those compile for whatever host they run on.","evolution-perturbation":"# Evolution & Perturbation\n\n# Evolution & Perturbation\n\n`runtime/crates/loopsmith-cli/src/run/evolve.rs`\n`runtime/crates/loopsmith-cli/src/run/perturb.rs`\n\nThese two modules are the loop's self-observation machinery. Both are invoked from `execute` in `src/run/mod.rs`, once per iteration, and both exist to answer the same question from different angles: *the loop is not converging — what now?*\n\nThey divide by who is allowed to act on the answer:\n\n| | `evolve.rs` | `perturb.rs` |\n|---|---|---|\n| Produces | `Proposal` rows in the store | a `Perturbation` applied to the next iteration |\n| Acted on by | a human, later, by editing the config | the loop itself, immediately |\n| Can change | nothing | *how* the loop works |\n| Can never change | anything | *what counts as done* |\n\nThat last row is the load-bearing invariant. Nothing in either module can reach goal state, relax a check, or touch the gate. `evolve.rs` cannot even write the config — it writes prose and a suggested patch and stops. `perturb.rs` can steer the loop, but only within a fixed menu of four tactics, and every prompt it emits states explicitly that the gate is unchanged (there is a test, `every_directive_says_the_gate_is_unchanged`, that holds this).\n\n---\n\n## `evolve.rs` — evidence in, proposals out\n\n### The per-iteration path\n\n`execute` calls three functions in sequence, plus one that runs when exploration is on.\n\n**`next_candidate(cfg, trials) -> Option<String>`** decides whether this iteration should trial an unconfigured sub-agent. It is gated on `cfg.skills.explore` and returns `None` unless `explore_candidates` is non-empty. Candidates already present on some node's `skills` list are filtered out (they are not candidates, they are policy), as are candidates that already have `cfg.skills.min_trials` behind them. Among the rest it picks the **least-tried** one, so evidence spreads across candidates instead of piling onto whichever name sorts first.\n\n**`harvest_judgments(cfg, rec, iteration) -> Vec<Judgment>`** reads back this iteration's episodes from the store and turns judge output into structured verdicts. For each episode whose node has `role == Role::Judge`, it resolves *which builder that judge reviewed* by walking the node's `depends_on` and finding the matching episode in the same iteration, then hands the judge's output, the judge's `provider_id`, and the builder's `provider_id` to `judgment::parse`. The builder provider is what independence is measured against — a judge running on the same provider as the builder it graded is a weaker signal, and `judgment::parse` needs both ids to say so.\n\nStore errors here are swallowed: `rec.store.episodes(...)` failing yields an empty `Vec`, not an error. Judgment harvesting is advisory, and a store hiccup should not take the run down.\n\n**`record_trials(rec, iteration, episodes, node_skills, verdicts)`** is the scoring step. For each `RanNode` that used skills, it collects the `TargetVerdict`s for *that node's own goals* — not the whole loop's — averages their `blocking_pass_rate()`, and takes `satisfied` as the conjunction. Scoring per-node matters: attribute the loop-wide verdict to every skill and every skill in the graph shares one indistinguishable outcome. Nodes whose goals have no verdict yet are skipped entirely rather than recorded as failures.\n\n`RanNode` exists as a named struct for a specific reason documented in the source: it replaced a four-tuple threaded through three functions, which is why `SkillTrial.tokens` was permanently `None` for a while — the caller had the token count and there was nowhere in the tuple to put it. Cost belongs in the trial record because \"lifts the pass rate for free\" and \"lifts the pass rate while tripling the bill\" are different propositions, and the ranking cannot tell them apart without it.\n\n### The proposal desk\n\n`write_proposals(cfg, rec, iteration, observed) -> usize` is the entry point, and it is a sum of four independent generators:\n\n```rust\npropose_reshape(cfg, &desk, observed.exhausted_nodes)\n    + propose_criteria_changes(&desk, observed.verdicts)\n    + propose_try_skill(cfg, &desk, observed.verdicts)\n    + skill_proposals(cfg, &desk)\n```\n\nEach returns how many proposals it wrote, so callers sum instead of each threading a `&mut` counter.\n\n`Observed<'a>` is the input contract — `exhausted_nodes` (nodes that hit `max_revisions_per_node` with goals still open) and `verdicts` (the gate's current rulings). The first three generators read only the run's own behaviour; only `skill_proposals` needs the accumulated cross-run trial record.\n\nThe private `Desk<'a, S: Store>` struct is the write path. It is constructed with `said`, a set of `\"{kind:?}:{subject}\"` keys built from every proposal already stored for this run. `Desk::write` checks that set first and returns `0` on a repeat — the whole point being that a proposals file with forty identical entries is a proposals file nobody reads. Note that `said` is a snapshot taken at construction, so a single `write_proposals` call cannot dedupe *within itself*; the four generators are distinct enough by `(kind, subject)` that this does not currently collide.\n\n`write` also calls `Proposal::with_default_expiry()` rather than accepting an expiry argument. That is deliberate: expiry is derived from `ProposalKind`, so a new kind cannot be added without deciding how long its evidence stays true. On a store error it returns `0` and skips the ledger entry, keeping the count honest.\n\n### What each generator says\n\n- **`propose_reshape` → `ProposalKind::ReshapeGraph`.** A node that burned its revision budget without satisfying its goals is evidence about the *graph*, not the node: one unit of work was asked to do something it cannot do in one step. Rewriting the graph would be the loop editing its own config, so instead it emits a suggested YAML patch adding a `{node}-prepare` researcher upstream, and a human decides.\n- **`propose_criteria_changes` → `ProposalKind::ChangeCriteria`.** Scans blocking, failing checks for evidence starting with `\"detector error\"`. A detector that cannot run fails closed forever, so no amount of work by any node will change the answer — that is a criteria problem, not a work problem, and it belongs in front of a human rather than in the next iteration's prompt.\n- **`propose_try_skill` → `ProposalKind::TrySkill`.** Fires only when `skills.explore` is *off*, candidates are listed, and at least one target is unsatisfied. Exploration is off by default because it spends real money; when the run is failing anyway, pointing out \"there is something here you have switched off\" beats silently not doing it. The patch is a one-liner: `skills:\\n  explore: true`.\n- **`skill_proposals` → `ProposalKind::AdoptSkill` / `DropSkill`.** The only generator that reads `store.skill_trials()` (all runs, not just this one). It passes the configured skill list and the trials to `loopsmith_skills::recommend(&configured, &trials, cfg.skills.min_trials, 0.8, 0.2)` — adopt above an 0.8 satisfaction rate, drop below 0.2, both requiring `min_trials` of evidence. Rationale strings are rendered from `loopsmith_memory::score_skills`, via a small `rate_of` closure that yields `(satisfaction_rate, trials)` and defaults to `(0.0, 0)` for a skill the scorer did not see.\n\n---\n\n## `perturb.rs` — recovery from a stall\n\nTwo config knobs bracket a stalled run. `no_progress_iterations` is the jidoka gate: stop the line rather than spin. `no_progress_iterations_randomness` fires *earlier* and does something else first, on the theory that a loop which repeats an identical approach three times and then quits has learned nothing, and the cheapest variable to change is the approach.\n\n### The fixed menu\n\n```rust\npub enum Perturbation {\n    Reorder,          // dispatch each wave's nodes in a different order\n    Escalate,         // run builders one tier stronger\n    Explore,          // force an untried candidate onto a builder, even if explore is off\n    Reframe(String),  // tell builders to take a specific different approach\n}\n```\n\nThree methods define its effect on the next iteration:\n\n- **`describe()`** — the one-line form written to the ledger.\n- **`tier_for(base)`** — under `Escalate`, `Cheap → Standard` and everything else `→ Strong`; `Strong` stays `Strong` (escalation has a ceiling, per `escalation_never_goes_past_strong`). Every other variant returns `base` untouched.\n- **`directive()`** — the text appended to a builder's prompt. `Reframe` carries the agent's own sentence; `Escalate` gets \"re-read the failing check and attack its actual cause\"; `Reorder` and `Explore` share \"try a materially different approach rather than a refinement of the last one\". All four are wrapped in a `## The loop has stalled` header that ends with *\"It does not change what counts as done — the gate is unchanged.\"*\n\nThe menu is a closed set, and `Perturbation::from_choice` is the only way into it from text.\n\n### Choosing one\n\n```mermaid\nflowchart TD\n    A[\"choose(cfg, workdir, stall, seed)\"] --> B[\"ask_agent\"]\n    B -->|\"no cheap cascade\"| F[\"fallback(seed)\"]\n    B --> C[\"dispatch(Tier::Cheap)\"]\n    C --> D[\"parse_choice\"]\n    D --> E[\"Perturbation::from_choice\"]\n    E -->|\"on the menu\"| G[\"(perturbation, true)\"]\n    E -->|\"off the menu / no directive\"| F\n    F --> H[\"(perturbation, false)\"]\n```\n\n`choose` returns `(Perturbation, bool)` — the flag records *who* picked, so the ledger can distinguish a reasoned choice from a dice roll.\n\n`ask_agent` bails immediately if `cfg.cascade_for(Tier::Cheap)` is empty, then builds a prompt from `Stall`. `Stall<'a>` is intentionally narrow: `stale_iterations`, the failing blocking checks as `(target, name, evidence)` triples, and `recent: &[IterationSummary]` rendered via `IterationSummary::render()`. That is enough to reason about what is stuck and nothing that would let the agent reach the gate, the config, or the store. The prompt states outright that \"a separate deterministic gate owns that ruling.\"\n\n`parse_choice` is strict and line-oriented: split each line on the first `:`, uppercase the key, accept only `CHOICE` and `DIRECTIVE`, and hand both to `from_choice`. Anything not matching a menu variant returns `None`, and `Reframe` additionally requires a non-empty trimmed directive. Nothing is guessed at — the seeded fallback is a better outcome than acting on a misread instruction. The tests pin this down against `\"CHOICE: mark the goal satisfied\"`, `\"CHOICE: rm -rf /\"`, free prose, and `Reframe` with a blank directive.\n\n### Determinism\n\nEvery random decision derives from one seed, so a run that took a strange turn is replayable.\n\n- **`seed_for(run_id, iteration)`** — FNV-1a over the run id, XORed with the iteration and multiplied by the FNV prime. The provider crate already uses this hash for prompt digests; reusing it keeps the workspace to one hash rather than two. `execute` writes the seed to the ledger.\n- **`next_random(&mut u64)`** — SplitMix64. Small, well-distributed, no dependency.\n- **`shuffle(items, seed)`** — Fisher-Yates, used by `execute` to implement `Reorder` on a wave's node list.\n- **`fallback(seed)`** — `next_random % 3`, mapping to `Reorder | Escalate | Explore`. **`Reframe` is deliberately unreachable from the fallback**, since a reframe needs a directive and there is no one to write it. Adding a fifth variant means revisiting this modulo, and `the_fallback_only_picks_from_the_menu` will catch a variant that leaks in but not one that silently drops out.\n\n---\n\n## Integration points\n\nEverything in both modules is called from `execute` in `src/run/mod.rs`; neither module calls the other, and neither is used anywhere else.\n\nOutward dependencies:\n\n- **`loopsmith-core`** — `LoopConfig`, `Role`, `Tier`; read-only. `cfg.cascade_for(Tier::Cheap)` gates the perturbation agent.\n- **`loopsmith-memory`** — the `Store` trait (via `logging::Recorder`), plus `Episode`, `Proposal`, `ProposalKind`, `SkillTrial`, `LedgerKind`, `now_ms`, `score_skills`.\n- **`loopsmith-gate`** — `Judgment` and `TargetVerdict` (`blocking_pass_rate()`, `satisfied`, `checks`); consumed only, never constructed.\n- **`loopsmith-skills`** — `recommend`, the adopt/drop policy.\n- **`loopsmith-provider`** — `dispatch` and `InvokeRequest`, used once, by `ask_agent`, at `Tier::Cheap` under `node_id: \"perturb\"`.\n- **`crate::judgment`** — `parse`, called per judge episode.\n\nConfig surface these modules read: `skills.explore`, `skills.explore_candidates`, `skills.min_trials`, `graph.nodes[].skills` / `.goals` / `.role` / `.depends_on`, `stop_gates.max_revisions_per_node`, and the provider cascades.\n\n---\n\n## Contributing notes\n\n**Adding a `ProposalKind`.** Add a generator alongside the existing four, sum it into `write_proposals`, and route it through `Desk::write` — that is what gives you deduplication and the ledger entry for free. You must also give the kind an expiry in `Proposal::with_default_expiry`; the indirection exists precisely so this cannot be skipped.\n\n**Adding a `Perturbation` variant.** Five places move together: the enum, `describe`, `directive`, `tier_for`, `from_choice`, and the choice menu inside `ask_agent`'s prompt (the prompt text is the agent's only description of the menu — a variant missing from it is a variant that never gets chosen). Then decide whether `fallback`'s `% 3` should include it. Any new `directive()` must keep the \"does not change what counts as done\" clause or `every_directive_says_the_gate_is_unchanged` fails.\n\n**Store failures are non-fatal by design** throughout `evolve.rs` — `episodes`, `proposals`, `skill_trials`, and `put_proposal` all degrade to \"no evidence, no proposals\" rather than propagating. If you add a path where a lost write should be visible, surface it explicitly; the current silence is a deliberate choice for advisory machinery, not an oversight to copy blindly.\n\n**The tests live in `perturb.rs` only.** They cover seed stability, shuffle determinism and permutation-preservation, the fallback's menu discipline, `parse_choice` acceptance and rejection, and the tier ceiling. `evolve.rs` has no unit tests in-file; its behaviour is exercised through the run-level suite, which is worth knowing before you refactor a generator.","example-loops":"# Example Loops\n\n# Example Loops\n\n`config/examples/` is the loop library that ships with loopsmith: thirteen complete, non-toy configs covering research, refactoring, marketing, lead generation, and agent payments. They are simultaneously documentation, the web UI's starting-point gallery, and the broadest integration fixture in the repository — a config change that breaks the runtime fails a stress test over all thirteen before it reaches anyone.\n\nEvery example exists three times, and the three copies are kept identical by tests:\n\n| Copy | Path | Why it exists |\n|---|---|---|\n| Source of truth | `config/examples/*.yaml` | Edited by hand; what the README links to |\n| Markdown twin | `config/examples/*.md` | Same model, prose-shaped grammar |\n| Embedded copy | `runtime/crates/loopsmith-cli/templates/examples/*.yaml` | `include_str!` cannot reach above the package root |\n\n## The catalogue\n\nGrouped the way `README.md` groups them:\n\n**Build** — `refactor-loop` (behaviour-preserving refactor where `cargo test --workspace` is the gate and editing a test is a blocking failure), `landing-page-loop` (static site gated on Lighthouse ≥ 90/95 and page weight < 500 KB), `viral-game-loop` (a Godot game gated on build health, time-to-first-play, and a cold playtest).\n\n**Find out** — `research-loop` (primary sources, every claim cited), `trend-radar-loop` (X/Instagram/TikTok, \"rising\" defined as 2× the trailing 7-day average), `idea-radar-loop` (product ideas that trace to ≥ 8 dated complaints across ≥ 2 venues), `account-watch-loop` (pre-viral signals, scored against what actually broke out by a *later* run).\n\n**Reach people** — `traffic-loop` (measured in referred sessions, not posts made), `blogger-loop` (style budget plus an independent cold read), `cold-outreach-loop` (suppression list and opt-out as blocking checks, sending behind a human checkpoint), `sales-leads-loop` (`lawful-basis-recorded` is blocking), `marketing-automation-loop` (every claim traced to the business site).\n\n**Spend money** — `x402-agent-loop` (real payments from a funded float, supervised by default; going autonomous means deleting one `human_checkpoint` line).\n\nThe set is deliberately uneven in shape. `refactor-loop` has no `schedules` beyond cron and file-change and no `default_skills`; `marketing-automation-loop` has a four-stage pipeline with an optional media phase. Reading two of them side by side is how the schema's optional halves become visible.\n\n## Anatomy\n\nEach `.yaml` is a `LoopConfig` and uses the same lettered spine, which `render_md` reproduces as sections A–J in the Markdown twin:\n\n- **A `information`** — `key`/`value`/`note` triples. Configuration the nodes read, plus the rules a human is expected to replace (`Replace with who this page is for`). Numeric definitions live here: `prevalence_rule`, `rise_definition`, `pain_threshold`.\n- **B `pre_execution`** — always ships with `done: false`. This is why an example cannot be run straight out of the box, and it is intentional: the loop refuses until a person confirms they have done the thing by hand once.\n- **C `goals`** — named, `depends_on`-ordered, with a `priority`.\n- **D `validations`** — the gate. Each has a `target` (a goal name or `overall`), a `mode` (`objective`, `subjective`, `percentage`), a `statement`, and a `Detector`: `file_exists`, `script`, `threshold`, `regex_match`, or `judge`.\n- **E `success`** — usually one `percentage` entry at `threshold: 1.0` over `overall`.\n- **F `stop_gates`** — `max_iterations`, `max_cost_usd`, `no_progress_iterations`, `stop_on_overall_success`, and friends.\n- **G `schedules`** — `Trigger` variants: `manual`, `cron`, `interval`, `file_change`, `goal_satisfied`.\n- **H `constraints.global`** — prose `rules`, `forbidden_paths`, `forbidden_commands`, `max_seconds`, and `human_checkpoint`. The checkpoints are where irreversible acts live: sending mail, publishing a post, authorising a payment.\n- **I `execution_guidelines`** — named stages plus a `dependency` chain like `research -> draft -> revise`, mirrored by each node's `stage`.\n- **J `default_skills`** — external skills (several examples pull `agent-reach` from GitHub).\n- **`graph`** — `nodes` with `id`, `role` (`researcher`, `builder`, `judge`, `adversary`), `instruction`, `depends_on`, `goals`, `tier`, optional `provider`, `weight`, `isolated`; plus `concurrency` (`mode: auto`, a `cap`, and `min_marginal_gain`).\n- **`providers`** — the same three-provider set almost everywhere (`ollama` cheap, `claude` standard, `openai` strong), a `cascade` per tier, and `enforce_judge_independence: true`.\n- **`skills`**, **`context`** — acquisition policy and how many prior summaries carry forward.\n\n### Conventions the set holds to\n\nThese are not enforced by the schema, but every example follows them and a new one should:\n\n- **The writer never grades itself.** Builder nodes run on the `standard` tier via `claude`; judge and adversary nodes are pinned `tier: strong, provider: openai`. `enforce_judge_independence: true` backs this at runtime. `blogger-loop.yaml`'s header comment states the reasoning outright — \"reads like a human\" is exactly the claim a model will certify about its own output.\n- **Subjective checks are paired with mechanical ones.** `blogger-loop` gates on `sentence_length_variance`, `stock_transitions_per_500w`, and `hedging_density` *and* on a `judge`. `landing-page-loop` pairs a taste review with Lighthouse numbers.\n- **Builders that write files are `isolated: true`** so they get a worktree; researchers and judges are not.\n- **Irreversible or public acts sit behind `human_checkpoint`**, never behind a model's judgement.\n- **Anti-self-grading structure where the loop scores its own past output.** `account-watch-loop` runs its `score-past` stage *before* `watch` and `detect`, and adds `no-retroactive-predictions` (a script detector on timestamps) as a blocking `overall` check.\n- **Detector scripts are named but not shipped.** `scripts/check-suppression.sh`, `scripts/assert-tests-untouched.sh`, and the rest do not exist in the repo. The user writes them; the harness stubs them.\n\n## Distribution: how an example reaches a user\n\n`runtime/crates/loopsmith-cli/src/web/examples.rs` owns the library the web UI shows. `sources()` walks three directories in priority order and the first to claim an id wins:\n\n```mermaid\nflowchart LR\n  U[\"~/.loopsmith/examples/*.yaml<br/>origin: user\"] --> S[sources]\n  R[\"./config/examples/*.yaml<br/>origin: repo\"] --> S\n  E[\"EMBEDDED consts<br/>origin: embedded\"] --> S\n  S --> L[\"list() → Vec&lt;ExampleCard&gt;\"]\n  S --> W[\"raw(id) → String\"]\n  L --> API[\"GET /api/examples\"]\n  W --> API2[\"GET /api/examples/{id}\"]\n```\n\nA user's own file shadows the shipped one of the same stem; a checkout's `config/examples` shadows the compiled-in copy, so editing a YAML in this repo shows up in `--web` without a rebuild. `list()` de-duplicates by id, drops anything that will not parse (better a missing card than one that fails on click), and sorts by the loop's own `name`.\n\n`ExampleCard` is derived entirely from the config — there is no hand-written card metadata, so a card cannot disagree with the loop it describes. Beyond `id`, `name`, `blurb` (the `description`, truncated to 180 chars), and `origin`, it carries counts of `goals`, `validations`, `nodes`, and `providers`; `judge_validations`, which surfaces how much of the gate is an opinion; `trigger`, rendered into English by `describe_triggers` / `human_seconds` (`600` → `10m`, `21_600` → `6h`); and the two stop gates a newcomer most needs before pressing run, `max_iterations` and `max_cost_usd`.\n\nThe HTTP surface is two routes in `web/api.rs` — `list_examples` and `load_example`, the latter 404ing with `no example called \\`{id}\\`` — consumed by `api.examples()` and `api.example(id)` in `web/src/api.ts`, which returns `{ id, yaml, config }`.\n\n### Keeping the embedded copies honest\n\n`tools/sync-examples.sh` copies `config/examples/*.yaml` into `templates/examples/`, deleting copies whose source is gone. Forgetting to run it is caught by `embedded_examples_match_the_source_of_truth`, which compares byte-for-byte and also asserts the two directories have the same file count. That test returns early when `config/` is absent — the published-tarball case, where the embedded copy is not a copy of anything.\n\nAdding an example therefore means adding a line to `EMBEDDED` in `examples.rs` *and* running the sync script.\n\n## The two formats\n\n`.md` and `.yaml` are two grammars over one `LoopConfig`. `loopsmith convert` infers direction from the input extension (`.md` → YAML, anything else → Markdown) and is a straight load-then-emit through `loopsmith_core::render_md` / `parse_md`. The same renderer backs `loopsmith --guided` and the web assembler's `Format::Markdown`.\n\n`runtime/crates/loopsmith-core/tests/md_roundtrip.rs` uses the example set as its corpus:\n\n- `every_example_config_survives_a_markdown_round_trip` — load each YAML, render to Markdown, parse it back, compare serialized forms.\n- `every_shipped_md_example_means_the_same_as_its_yaml_twin` — load both files on disk and require them to describe the same loop. This is what stops a hand-edited `.md` from drifting; regenerate it with `convert` rather than editing it.\n\nComparison runs through `normalized()`, which trims trailing whitespace in every string. That is the one documented difference between the formats: a YAML folded scalar (`>`) ends in a newline that a Markdown bullet cannot carry.\n\n## The examples as a test fixture\n\n`runtime/crates/loopsmith-cli/tests/harness/mod.rs` turns a shipped example into something runnable without touching `config/examples/`. `Fixture::example(name, tag)` reads the YAML, then rewrites a copy in a scratch directory:\n\n- `unblock` marks every `pre_execution` step done.\n- `deterministic_providers` swaps the real provider commands for a command that emits a fixed judge block — no money, no disagreement between runs.\n- `stub_scripts(Stubs)` generates the `scripts/` directory the config names, with stubs that exit on `$STUB_EXIT`. `Stubs::Pass` walks the success path and the export; `Stubs::Fail` reaches `no_progress_iterations`, the randomness gate, and `max_revisions_per_node`; `Stubs::PassFrom(n)` flips at an iteration using a counter file, since a loop cannot change its own environment mid-run.\n- `satisfy_files` / `satisfy_metrics` write the artifacts and metrics the detectors look for. Artifact bodies carry a URL and a `post_id:` line because several examples put a `regex_match` on the same file a `file_exists` check already covers.\n\n`all_examples()` enumerates the directory, so a new example is picked up by the two whole-set stress tests automatically:\n\n- `every_example_completes_an_iteration_and_leaves_a_consistent_record` — capped at one iteration with everything satisfiable. Asserts the ledger opens with `RunStarted`, closes with `RunFinished` or `StopGateTriggered`, that the run log and the ledger have the same number of lines (they are written through one call, so divergence means one write path grew a branch the other did not), and that one iteration leaves exactly one summary.\n- `every_example_survives_a_run_where_nothing_passes` — no stubs, no artifacts, no metrics. Script detectors error, file detectors miss, thresholds have nothing to read. The run must exit non-zero, write the stop to the ledger, and produce no export directory. A detector that fails closed is correct; a runtime that panics on it is not.\n\nIndividual examples also anchor narrower suites — `surface.rs` and `opt_in.rs` reach for `research-loop.yaml` and `refactor-loop.yaml` as realistic inputs.\n\n## Adding an example\n\n1. Write `config/examples/<name>-loop.yaml`. Lead with a comment block naming the failure mode the config is built against — every existing example does, and it is the part that teaches.\n2. Generate the twin: `loopsmith convert config/examples/<name>-loop.yaml -o config/examples/<name>-loop.md`.\n3. `tools/sync-examples.sh`, then add the `include_str!` line to `EMBEDDED` in `runtime/crates/loopsmith-cli/src/web/examples.rs`.\n4. Link it from `README.md` and the table in `README-DETAIL.md`.\n5. `cargo test`. The example must parse, carry a non-empty `description` (an empty one means a blank card), have at least one goal and one validation, survive the Markdown round trip, complete a supervised iteration, and fail cleanly when nothing is satisfiable.\n\nTwo invariants are easy to break by accident and worth restating: `pre_execution` steps stay `done: false` in the shipped file, and detector scripts stay unshipped. Both make the example un-runnable as-is, which is the point — the harness supplies them, and a user is expected to.","execution-graph-concurrency-planning":"# Execution Graph & Concurrency Planning\n\n# Execution Graph & Concurrency Planning\n\nThe `loopsmith-graph` crate is the scheduler for loopsmith's node plane. Nodes declare `depends_on`; this crate answers three questions from that declaration alone, before any node is dispatched:\n\n1. Is the graph acyclic and are all dependencies real?\n2. Which nodes can run at the same time?\n3. How many workers should actually be started?\n\nAll three are pure arithmetic over the config — no I/O, no clock, no provider calls. That is what makes it cheap enough to run before every iteration, and testable without any harness.\n\n## The crate's one public entry point\n\n`plan(&GraphSpec) -> Result<Plan, GraphError>` does the whole pass and is what every caller outside the crate uses:\n\n```rust\nlet plan = loopsmith_graph::plan(&config.graph)?;\n```\n\nInternally it is four steps stitched together:\n\n```mermaid\ngraph LR\n    S[GraphSpec] --> W[waves]\n    S --> CP[critical_path]\n    W --> CC[choose_concurrency]\n    CP --> PF[parallel_fraction]\n    PF --> CC\n    CC --> P[Plan]\n    PF --> P\n```\n\n`critical_path` calls `waves` again internally to get a topological order — the pass is deliberately not micro-optimized, because the graphs are config-sized and the redundant Kahn run costs nothing next to the clarity of each function standing alone.\n\n## `DagNode`: one scheduler, two graphs\n\nThe scheduler is not written against `NodeSpec`. It is written against a three-method trait:\n\n```rust\npub trait DagNode {\n    fn id(&self) -> &str;\n    fn deps(&self) -> &[String];\n    fn weight(&self) -> f64;\n}\n```\n\nTwo impls ship in the crate:\n\n| Impl | Config section | Weight |\n|---|---|---|\n| `NodeSpec` | G — the execution graph | `node.weight` |\n| `Phase` | I — execution-guideline phases | always `1.0` |\n\nPhases carry no cost of their own — the work lives in the nodes assigned to a phase — so a phase graph's critical path is just its longest chain. The reason for the trait is stated bluntly in the source: a second copy of Kahn's algorithm would be a second place for a cycle bug to hide. The test `any_dag_node_type_schedules_through_the_same_code` guards this by defining a local `Step` type with nothing in common with `NodeSpec` and scheduling it through the same functions.\n\nIf you add a third DAG somewhere in the config, implement `DagNode` for it rather than writing a topological sort next to it.\n\n## Wave scheduling — `waves`\n\n`waves` is Kahn's algorithm with one modification: instead of draining the ready queue one node at a time, it drains an entire level at once. Each level becomes a `Wave { index, nodes }`, and every node in a wave may run concurrently.\n\nTwo failure modes are distinguished, and both are config bugs rather than runtime ones:\n\n- `GraphError::UnknownNode(id)` — a `depends_on` names a node that isn't in the list. Detected during the indegree build, before any traversal.\n- `GraphError::Cycle(ids)` — after the queue empties, fewer nodes were placed than exist. The error string lists every node still carrying a nonzero indegree, which is the cycle plus everything downstream of it.\n\nDeterminism matters here and is bought in two places: `BTreeMap`/`BTreeSet` for the indegree and next-level structures, and an explicit `names.sort()` on each wave. The same config always yields byte-identical waves, which is what lets `plan` output be diffed and checkpointed.\n\n## Critical path — `critical_path`\n\nThe longest weighted path through the DAG. It walks nodes in topological order and, for each, takes the best-scoring dependency as its predecessor:\n\n```\nbest[n] = max(best[d] for d in deps(n), or 0) + weight(n)\n```\n\n`prev` records which dependency won, so the path is recovered by walking backward from the highest-scoring node and reversing. An empty graph returns `(vec![], 0.0)`.\n\nThis number is the floor on wall-clock time: no worker count lowers it. In the test case `a(1) → b(5) → d(1)` alongside `a(1) → c(1) → d(1)`, the path is `[\"a\", \"b\", \"d\"]` at cost `7.0` — the heavier chain wins even though both have the same node count.\n\n## Sizing the fleet\n\n### Deriving `p` instead of guessing it\n\n`parallel_fraction(total_cost, critical_cost)` returns the share of total work not stuck on the critical path:\n\n```\np = (total - critical) / total,  clamped to [0, 1]\n```\n\nA pure chain has `total == critical`, so `p = 0` — correctly, because nothing in it can overlap. Sixteen independent nodes have a critical path of one node, so `p` approaches 1. This is the mechanical form of the \"and then\" test: work that genuinely reads an upstream output stays serial; everything else is parallelizable.\n\n### Amdahl's law\n\n```rust\npub fn amdahl(p: f64, n: usize) -> f64   // 1 / ((1-p) + p/n)\npub fn speedup_ceiling(p: f64) -> f64    // 1 / (1-p), INFINITY at p == 1\n```\n\n`amdahl` clamps `p` and returns `0.0` for `n == 0`. The test `amdahl_matches_the_published_table` pins the values that appear in loopsmith's docs — at `p = 0.95`, sixteen workers buy ×9.14 and 256 workers buy ×18.62 against a ceiling of ×20. Those three numbers are the whole argument for not sizing a fleet by intuition.\n\n### `choose_concurrency`\n\nTakes the config's `Concurrency` mode, the computed waves, and `p`; returns `(workers, predicted_speedup)`.\n\nEvery mode is bounded above by `widest` — the node count of the largest wave — because workers beyond the widest wave have nothing to pick up:\n\n| Mode | Behavior |\n|---|---|\n| `Sequential` | pinned to 1 |\n| `Fixed { max_parallel }` | `max_parallel`, floored at 1 and capped at `widest` |\n| `Auto { cap, min_marginal_gain }` | grows from 1 while each additional worker still buys at least `min_marginal_gain` more speedup, stopping at the first one that doesn't; hard-capped at `min(widest, cap)` |\n\n`Auto` is the crate's thesis in five lines: `amdahl(p, n) - amdahl(p, n-1)` shrinks fast, so the loop breaks early and the fleet stops growing where it stops paying. `auto_concurrency_stops_when_marginal_gain_dries_up` asserts exactly this on 16 independent nodes with `min_marginal_gain: 0.5` — the answer is strictly between 1 and 16.\n\n## The one thing the crate reports but does not fix\n\n```rust\npub fn unisolated_parallel_writers(spec: &GraphSpec, waves: &[Wave]) -> Vec<String>\n```\n\nAny wave containing more than one `Role::Builder` node with `isolated == false` yields all of those node ids. Two builders sharing a working tree in the same wave will clobber each other's files. The crate returns the names and stops — as the source comment says, the fix (mark them isolated, or serialize them with a dependency edge) is a config decision, not something a scheduler should make silently.\n\nNote this is a separate call from `plan`; callers that want the warning must invoke it themselves with the waves `plan` produced. Both `src/cmd/plan.rs` and `src/web/assemble.rs` do.\n\n## Who calls this\n\n| Caller | Uses |\n|---|---|\n| `execute` (`src/cmd/plan.rs`) | `plan` + `unisolated_parallel_writers` — the `loopsmith plan` command's dry-run output |\n| `execute` (`src/run/mod.rs`) | `plan` — the live run reads its wave order and worker count from here |\n| `plan_view` (`src/web/assemble.rs`) | `plan` + `unisolated_parallel_writers` — the browser config review |\n| `tool_plan` (`loopsmith-mcp/src/lib.rs`) | `plan` — exposed as an MCP tool |\n| `PhaseState::new` (`src/run/phases.rs`) | `waves` directly, over `Phase` — the section-I phase gate |\n\n`src/run/phases.rs` is the one caller that reaches past `plan` to `waves`, and it is the reason `DagNode` exists: phases need topology and nothing else, so it schedules `Phase` values through the same Kahn implementation rather than duplicating it.\n\n## Dependencies and testing\n\nOnly `loopsmith-core` (for `GraphSpec`, `NodeSpec`, `Phase`, `Concurrency`, `Role`), `serde`, and `thiserror`. No async runtime, no filesystem, no clock — every function is deterministic and total.\n\nNote the `Cargo.toml` `include` list ships `src/` and `README.md` only. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain, so they are deliberately excluded from the published package. Run the full suite from the workspace root, not from an unpacked tarball.\n\n## Contributing notes\n\n- New graph shapes belong in the unit tests in `lib.rs`, which cover the whole surface: fan-out, chains, cycles, unknown deps, weighted critical paths, each concurrency mode, and a foreign `DagNode` type.\n- If you change `waves`, keep the `BTreeMap`/`BTreeSet` and the per-wave sort. Swapping in a `HashMap` will pass the tests intermittently and break plan determinism.\n- `choose_concurrency` deliberately breaks on the *first* worker that fails the marginal-gain test rather than scanning to the cap. Since `amdahl` is monotone-concave in `n`, that break is the true stopping point, not an approximation.\n- The `amdahl` values in `amdahl_matches_the_published_table` are quoted in user-facing docs. Changing the formula means changing the docs.","gating-success-criteria":"# Gating & Success Criteria\n\n# Gating & Success Criteria (`loopsmith-gate`)\n\nThe gate is the crate that decides whether work is done. It is deliberately the least clever crate in the workspace: plain Rust, no provider calls of its own, no prompt anywhere in the code path. Everything it can conclude follows mechanically from a config and a bag of evidence.\n\nIts defining constraint is negative: `GoalState { satisfied: true, .. }` is constructed in exactly one place — `TargetVerdict::to_goal_state` in `src/lib.rs`. Nothing that a model emits can produce that value directly. If you are adding a feature that makes completion easier to declare, you are probably working against the point of the crate.\n\n## The two invariants\n\n**A model cannot certify its own completion.** Verdicts come from detectors, and detectors are exit codes, filesystem metadata, regex matches, and numeric comparisons. The one detector that consults a model (`Detector::Judge`) refuses a judgment whose `provider_id` equals its `builder_provider_id` — it does not discount it, it fails the check outright with `\"judgment refused: judge and builder both ran on ...\"`.\n\n**The gate can revoke.** `evaluate` holds no memory of prior runs. Re-running against fresh evidence recomputes from scratch, so deleting a required artifact flips a satisfied target back to unsatisfied. The test `the_gate_can_take_done_back` pins this: write `report.md`, evaluate (satisfied), delete it, evaluate again (not satisfied). Any caching layer added in front of `evaluate` must preserve this — a gate that only promotes is a burndown chart.\n\n## Types\n\n| Type | Role |\n|---|---|\n| `Evidence` | The complete input surface: `artifacts` (name → text), `metrics` (name → f64), `judgments`, and `workdir`. Builder methods `with_artifact`, `with_metric`, `with_judgment` chain off `Evidence::new(workdir)`. |\n| `Judgment` | One model verdict, carrying provenance: `validation`, `provider_id`, `builder_provider_id`, `passed`, optional `score`, `standard`, `evidence`. Parsed from model output by `parse` in `loopsmith-cli/src/judgment.rs`. |\n| `CheckResult` | One validation's outcome: `name`, `text`, `passed`, `blocking`, `evidence`. Field names mirror the existing eval viewer's grading schema (`text`/`passed`/`evidence`) so reports are readable by tooling that already exists. |\n| `TargetVerdict` | All checks for one target plus `satisfied`, the pass/fail/total counts, and a human-readable `reason`. |\n| `GateError` | `Detector(String)` for \"the check could not run\" and `Regex { name, source }` for a validation whose pattern does not compile. |\n\nNote what is *not* in `Evidence`: the builder's own claim that it finished. That omission is intentional and load-bearing.\n\n## Evaluation\n\n```mermaid\nflowchart TD\n    E[\"evaluate(cfg, target, ev)\"] --> F[\"filter cfg.validations by target\"]\n    F --> D[\"run_detector per validation\"]\n    D --> C[\"CheckResult{passed, blocking, evidence}\"]\n    C --> Q{\"any blocking check?\"}\n    Q -->|no| U[\"unsatisfied — nothing to satisfy\"]\n    Q -->|yes| B{\"blocking failures?\"}\n    B -->|yes| U2[\"unsatisfied — names the failures\"]\n    B -->|no| S[\"satisfied\"]\n```\n\n`evaluate` selects the validations whose `target` matches, runs each detector, and folds the results into a `TargetVerdict`. Three rules govern the outcome:\n\n1. **Silence is not success.** A target with zero blocking validations is *never* satisfied — `reason` reads `no blocking validation targets \\`X\\`; nothing to satisfy`. Forgetting to write a check does not count as passing it.\n2. **Only blocking failures hold the gate shut.** Non-blocking checks still appear in `checks` and still count toward `failed`, but they cannot block satisfaction (`non_blocking_failures_do_not_hold_the_gate`).\n3. **Detector errors fail closed.** An `Err` from `run_detector` becomes `(false, \"detector error: {e}\")` rather than propagating. The distinction between \"the check failed\" and \"the check could not run\" survives in the `evidence` string, not in `satisfied` — a missing tool reads as unfinished work at the boolean level. If you need callers to branch on that difference, the `evidence` prefix is currently the only signal, and lifting it into a typed field is an open improvement.\n\n`evaluate_all` runs `evaluate` once per goal in `cfg.goals` plus once for the `OVERALL` target, returning a `BTreeMap<String, TargetVerdict>` (ordered, so reports and snapshots are stable).\n\n## Detectors\n\n`run_detector` is a single match over `loopsmith_core::Detector`. Each arm returns `(passed, evidence)`, where the evidence string is written to be read by a human in a terminal.\n\n- **`Script { command, args, expect_exit }`** — spawns the command in `ev.workdir`, compares the exit code against `expect_exit` (default `0`), and appends the last line of stderr to the evidence when there is one. A code of `-1` stands in for signal-terminated processes. A failure to *spawn* is a `GateError::Detector`; a non-zero exit is an ordinary failed check.\n- **`FileExists { path, non_empty }`** — `workdir`-relative `fs::metadata`. Three distinguishable outcomes: absent, present-but-empty (when `non_empty`), present with a byte count.\n- **`RegexMatch { artifact, pattern }`** — compiles the pattern (a bad pattern is `GateError::Regex`, carrying the validation name), then matches against `ev.artifacts[artifact]`. An uncollected artifact fails with `artifact \\`X\\` was not collected` rather than passing vacuously.\n- **`Threshold { metric, op, value }`** — applies `CompareOp::apply` to `ev.metrics[metric]`. An unreported metric fails; `a_missing_metric_fails_rather_than_passes_by_default` guards that. `op_str` renders the operator for the evidence line.\n- **`Judge { standard, min_score }`** — the only detector that reads model output. See below.\n\nEvery arm defaults to *fail* when its input is missing. That is the house style for this crate; a new detector that returns `true` on absent evidence would be a bug.\n\n## The judge path\n\n`Detector::Judge` collects the judgments whose `validation` matches the check name, then:\n\n1. **No judgments → fail** (`no judgment recorded for \\`X\\``).\n2. **Independence enforcement.** If `cfg.providers.enforce_judge_independence` is set and *any* matching judgment has `provider_id == builder_provider_id`, the whole check fails immediately. This is a refusal, not an averaging-out: one self-judgment poisons the check.\n3. **Pool selection.** Independent judgments form the pool. When enforcement is off and no independent judgment exists, the pool falls back to all judgments — that fallback is the only path by which a self-judgment can contribute to a pass, and it requires the config to have explicitly disabled enforcement.\n4. **Scoring.** With `min_score`, the mean of the reported `score` values must reach it, and a pool with no scores at all fails. Without `min_score`, every judgment in the pool must have `passed: true`.\n\n## Success scenarios\n\nVerdicts answer \"is this target satisfied?\". Success scenarios answer \"is that enough to stop?\".\n\n`success_met(scenario, verdict)` switches on `SuccessScenario::mode`:\n\n- `Mode::Percentage` compares `verdict.blocking_pass_rate()` against `threshold` (default `1.0`). The rate counts only blocking checks, and returns `0.0` when there are none — consistent with \"no blocking checks means nothing to satisfy\".\n- `Mode::Objective` and `Mode::Subjective` both defer to `verdict.satisfied`.\n\n`overall_success(cfg, verdicts)` requires *every* scenario targeting `OVERALL` to hold. With no such scenario declared it falls back to the `OVERALL` verdict's own `satisfied` flag, and returns `false` if that verdict is missing entirely.\n\n## How it plugs into the rest of the workspace\n\n```mermaid\nflowchart LR\n    run[\"src/run/mod.rs::execute\"] --> ea[\"evaluate_all\"]\n    cmd[\"src/cmd/gate.rs::execute\"] --> ev[\"evaluate\"]\n    mcp[\"loopsmith-mcp::tool_gate\"] --> ev\n    ea --> ev\n    ev --> tv[\"TargetVerdict\"]\n    tv --> stop[\"src/run/stop.rs::should_stop → overall_success\"]\n    tv --> gs[\"to_goal_state → loopsmith-memory::GoalState\"]\n```\n\n- **`src/run/mod.rs::execute`** calls `evaluate_all` each iteration; `src/run/stop.rs::should_stop` feeds the resulting map to `overall_success` to decide whether the loop terminates.\n- **`src/cmd/gate.rs::execute`** is the one-shot `loopsmith gate` CLI path — same `evaluate`, no loop around it.\n- **`loopsmith-mcp::tool_gate`** exposes `evaluate` over the local stdio MCP server, so an agent can *ask* the gate for a verdict without being able to write one.\n- **`src/run/summary.rs`, `src/run/export.rs`, `src/run/stop.rs
