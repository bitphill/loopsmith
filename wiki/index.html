 the second opens. Under the CLI alone the gap was a human's reaction time.\n\n```mermaid\nflowchart TD\n    A[\"open(path)\"] --> B[\"sled::open\"]\n    B -->|Ok| C[\"SledStore\"]\n    B -->|Err| D{\"is_lock_contention?\"}\n    D -->|no| E[\"MemError::Backend(sled message)\"]\n    D -->|yes| F{\"past LOCK_WAIT<br/>deadline?\"}\n    F -->|yes| G[\"MemError::Backend<br/>'locked by another<br/>loopsmith process'\"]\n    F -->|no| H[\"sleep backoff,<br/>double it (cap 150ms)\"]\n    H --> B\n```\n\nThe parameters are deliberate rather than guessed:\n\n- **`LOCK_WAIT = 2s`.** The failure it exists for is a holder that has already been dropped or exited, so the lock is coming free in milliseconds. Two seconds is far longer than that and still short enough that a genuinely held lock reports quickly rather than hanging.\n- **Backoff doubles from 5ms, capped at 150ms.** The common case clears on the first retry and should not pay for the rare one.\n- **`is_lock_contention` matches narrowly.** It checks `sled::Error::Io` for `WouldBlock` / `ResourceBusy`, and falls back to substring matching on `\"could not acquire lock\"` / `\"WouldBlock\"` because sled flattens the `io::Error` into a string on some paths. Narrow on purpose: a corrupt database or a missing directory must not be retried.\n- **The timeout message names the cause** — \"locked by another loopsmith process ... A run, a watch, or an MCP server is probably still using it\" — because a bare `WouldBlock` gives the user nothing to act on.\n\nBoth halves are pinned by tests. `opening_waits_for_a_lock_that_is_being_released` holds the lock for 120ms on another thread and asserts the second open both succeeds and actually waited ≥100ms. `a_lock_nobody_releases_is_reported_rather_than_waited_on_forever` holds it for the whole call and asserts the wait is at least `LOCK_WAIT` and under `LOCK_WAIT * 3` — retrying must not become hanging.\n\n## How it connects\n\n`loopsmith-memory` sits at the bottom of the dependency graph next to `loopsmith-core`, depending only on `loopsmith-util` (for `now_ms`, re-exported so the whole workspace reads one clock), `serde`, `serde_json`, `thiserror`, and `sled`.\n\n```mermaid\nflowchart LR\n    gate[\"loopsmith-gate<br/><i>writes GoalState<\/i>\"] --> mem\n    runtime[\"src/run/*<br/><i>episodes, checkpoints,<br/>summaries, trials<\/i>\"] --> mem\n    skills[\"loopsmith-skills\"] --> mem\n    mcp[\"loopsmith-mcp<br/><i>read surface<\/i>\"] --> mem\n    mem[\"loopsmith-memory\"] --> util[\"loopsmith-util\"]\n```\n\nConcrete call sites in the workspace:\n\n- `src/run/mod.rs::execute` constructs `Episode` records as nodes complete.\n- `src/run/summary.rs` builds `IterationSummary` values; its tests (`deterministic`, `carry_forward_honours_the_configured_depth`) cover the facts/narrative split and how much history is carried forward.\n- `src/run/evolve.rs` is the self-evolution path: `record_trials` writes `SkillTrial`s, `skill_proposals` runs them through `score_skills`, and `write` / `propose_reshape` emit `Proposal`s.\n- `src/cmd/skills.rs::scores` renders `score_skills` output for the CLI.\n- `loopsmith-cli/src/logging.rs` mirrors `LedgerEntry` into the logs directory (its tests check entries land in `logs/`, not `state/`, and that an unwritable location degrades to a no-op rather than failing a run).\n- `loopsmith-mcp` exposes the read surface over stdio.\n\nThe crate's test helper `tmp()` in `sled_store.rs` is used widely across the workspace's own tests (scaffold, worktree), which is why the call graph shows CLI tests reaching into this crate — those are test-fixture edges, not runtime dependencies.\n\n## Contributing\n\n**Adding a record type.** Define the struct in `lib.rs` with `#[serde(default)]` on every optional field, add the put/read pair to `Store`, pick a two-letter key prefix, and implement it in `sled_store.rs`. Decide up front whether it is per-run (`xx/<run>/...`) or global (`xx/...`) — `SkillTrial` is global because a skill's record must outlive one loop, and that decision is not reversible without a migration.\n\n**Adding a `ProposalKind`.** The match in `default_lifetime_ms` is exhaustive, so the compiler forces the lifetime decision. `every_proposal_kind_has_a_decided_lifetime` then restates each decision explicitly, so changing one shows up in a diff rather than passing silently.\n\n**Changing a stored shape.** Records outlive the binary that wrote them. New fields need `#[serde(default)]`; removed or renamed fields need a migration path, because reads deserialise straight out of sled with no version tag.\n\n**Do not add a write path for `satisfied: true`.** Convenience constructors, `Default` impls, or test helpers that produce a satisfied `GoalState` outside `loopsmith-gate` erode the one rule the design rests on. The dependency direction (gate → memory, never the reverse) is the mechanism that enforces it; keep it.\n\n**Tests clean up after themselves.** Each backend test opens a store under `loopsmith_util::testing::temp_path` and ends with `std::fs::remove_dir_all`. The lock-contention tests are timing-sensitive by nature but bounded on both sides — keep the bounds if you touch `LOCK_WAIT` or the backoff.","other":"# Other\n\n# `loopsmith-cli` integration tests\n\n`runtime/crates/loopsmith-cli/tests/` is the only place in the workspace where the shipped binary is executed end to end. Every crate under `runtime/crates/` has unit tests that prove its own pieces in isolation; this suite proves the pieces work *together*, under a real iteration loop, driven through `CARGO_BIN_EXE_loopsmith`, against the configs in `config/examples/` that users are actually handed.\n\nThere is no library code here. The module is five test binaries plus one shared harness.\n\n| File | Covers |\n|---|---|\n| `harness/mod.rs` | The `Fixture` builder. No tests of its own. |\n| `stress.rs` | The iteration loop: phases, worktree isolation, stop gates, proposals, resume, export |\n| `surface.rs` | Subcommands that were implemented and never executed |\n| `compat.rs` | What a generated loop assumes about the machine it lands on |\n| `guided.rs` | `loopsmith guided`, scripted through piped stdin |\n| `opt_in.rs` | Anything that reaches the network or spends money |\n\n```sh\ncargo test -p loopsmith --test stress\ncargo test -p loopsmith --test surface\ncargo test -p loopsmith --test compat\ncargo test -p loopsmith --test guided\ncargo test -p loopsmith --test opt_in     # skips everything gated by default\n```\n\n---\n\n## Why a fixture exists\n\nThe shipped examples cannot be run as they stand, and both reasons are deliberate design rather than bugs:\n\n1. **Every example refuses.** `pre_execution` steps ship as `done: false`, so `validate` and `run` both stop. That refusal is the teaching mechanism.\n2. **No detector scripts exist.** The examples name 29 distinct `scripts/…` detectors between them and the repository ships none. A missing script becomes a detector *error*, which the gate converts to a failed check — correct behaviour, and useless for exercising anything past the first gate.\n\n`Fixture` therefore rewrites a **copy** in a scratch directory. Nothing under `config/examples/` is ever touched.\n\n```mermaid\ngraph LR\n  E[\"config/examples/*.yaml\"] --> P[\"parse_str\"]\n  P --> U[\"unblock<br/>pre_execution done\"]\n  U --> D[\"deterministic_providers<br/>printf judge block\"]\n  D --> W[\"write_config<br/>scratch/loop.yaml\"]\n  W --> S[\"stub_scripts /<br/>satisfy_files /<br/>satisfy_metrics /<br/>git_init\"]\n  S --> R[\"run_loop → the binary\"]\n  R --> A[\"store() · log_text() · export_dir()\"]\n```\n\n### The builder\n\n`Fixture::example(name, tag)` loads a shipped example; `Fixture::from_yaml(text, tag)` takes config text directly, for shapes no example has. Both run `unblock` and `deterministic_providers` before writing `loop.yaml` into a scratch directory from `loopsmith_util::testing::temp_dir`.\n\nThe chainable stages are opt-in, because each one is an axis a scenario may or may not want:\n\n- `stub_scripts(Stubs::Pass | Stubs::Fail | Stubs::PassFrom(n))` — writes an executable stub for every `scripts/…` detector the config names, honouring `$STUB_EXIT`. `PassFrom(n)` uses a `.stub-count` file in the loop root rather than an environment variable, because the loop cannot change its own environment between iterations. On Windows the stub is written as `.cmd` and the config's detector `command` is repointed at it — the same rewrite a Windows user has to do by hand.\n- `satisfy_files()` / `write_artifacts(body)` — creates every path a `file_exists` detector names.\n- `satisfy_metrics()` / `metrics(&[(name, value)])` — writes `metrics.json`, where threshold detectors read from. The no-argument form derives a satisfying value per `CompareOp`.\n- `git_init()` — makes the loop directory a repository with one commit, so `isolated: true` produces a real worktree instead of degrading. A repository with no commit has no `HEAD`, and `git worktree add` refuses to branch from nothing.\n\n`cfg` is public and mutable. Mutate it, then call `write_config()` — nothing else notices the change. `stress.rs` builds on this with two local helpers: `cap(cfg, n)` bounds a run so it cannot sit in a long example's ten-iteration, three-hour default, and `starve(cfg, target)` rewires every validation on a target to `false` so a run keeps iterating instead of succeeding on its first pass.\n\nExecution: `run(args)`, `run_with_env(args, env)`, and `run_loop(run_id, env)` (which is `run --run-id <id> --no-acquire`).\n\n### Deterministic providers\n\n`deterministic_providers` swaps every provider for `printf` emitting a fixed judge block. Three properties of that rewrite are load-bearing:\n\n- **Provider ids are preserved.** `enforce_judge_independence` compares them: a judge must sit on a different id from the builder it reviewed. Rewriting the ids would quietly switch that check off.\n- **Every provider emits the judge block**, not only the ones a judge sits on. Judge output is harvested only from nodes whose role is `judge`, so a builder emitting the same text is inert — and this avoids re-deriving the cascade to work out where a judge would land.\n- **The block carries an `EVIDENCE:` line.** A judge PASS with no evidence is demoted to FAIL by the parser, which would make every subjective validation permanently unsatisfiable.\n\n`failing_judge_payload(cfg)` and `set_provider_output(cfg, id, payload)` cover the judge-refuses axis; `judge_provider_ids(cfg)` resolves which id a judge node actually lands on, following `cascade_for` when the node named none.\n\n---\n\n## Assertions read artifacts, not stdout\n\nStdout is a report. The record is the sled ledger, `logs/<run-id>.log`, `store.summaries()`, the checkpoint, and the presence or absence of `<name>-success/`. `Fixture::store()`, `Fixture::log_text(run_id)` and `Fixture::export_dir()` are how a scenario reaches them.\n\nOne assertion recurs across the suite and is worth keeping:\n\n```rust\nassert_eq!(log.lines().count(), ledger.len());\n```\n\nThe run log and the ledger are written through a single call, so they must always hold the same number of events. A divergence means one of the two write paths grew a branch the other did not.\n\n---\n\n## What each suite establishes\n\n### `stress.rs` — the iteration loop\n\nTwo sweeps run over `all_examples()`: `every_example_completes_an_iteration_and_leaves_a_consistent_record` (satisfiable detectors, one iteration, one summary, log/ledger agreement) and `every_example_survives_a_run_where_nothing_passes` (no stubs, no artifacts, no metrics — a non-zero exit, a `StopGateTriggered` on the ledger, and no export). These are the cheapest signal that a config change broke the runtime rather than the schema.\n\nBeyond the sweeps, each test isolates one mechanism the unit tests can only reach synthetically:\n\n- **Phases.** `phases_open_one_at_a_time_across_a_real_run` asserts the ordering of `traffic-loop`'s four linear phases against verdicts the gate actually produced, not synthetic ones. `a_phase_that_never_satisfies_its_goals_never_opens_the_next_one` pins the absence of a timeout or eventual give-up.\n- **Isolation.** Outside a repository, `isolated: true` degrades to the shared directory — silently, by design — and `isolation_degrades_to_shared_outside_a_repository` asserts the degradation is *reported*. Inside one, `an_isolated_builders_output_reaches_the_gate` covers the publish step (evidence is collected from the loop root; isolated nodes run in `state/worktrees/<node>/`), and `an_isolated_node_can_read_what_its_isolated_upstream_produced` covers seeding, since a worktree branches from `HEAD` and starts blind to everything the run has produced since.\n- **Stop gates.** `no_progress_iterations`, the randomness gate's seeded fallback, its *agent* path (a deterministic cheap provider on the `cheap` cascade, so `ask_agent` returns something instead of `None`), an off-menu answer falling back rather than being guessed at, and `max_revisions_per_node` bounding one stuck node without stopping the run.\n- **Resume.** Everything the stop gates count used to be declared inside the iteration loop, so it was rebuilt from nothing on resume. Two tests pin the fix: a resume must not refund a node's revision budget, and must not reset `stale_iterations` or `last_signature`.\n- **Proposals.** One test per `ProposalKind` — `ReshapeGraph` (an exhausted node, one proposal, not one per iteration), `ChangeCriteria` (a detector that *cannot run* is a broken check, not a failing one), `TrySkill` (proposed, not spent). Each also asserts the config on disk is untouched: the loop proposes, a human applies.\n- **Summaries and trials.** `context.summary_provider` is set by no example, so the narrative path had never run — and the prose it produces must not be able to satisfy a goal the gate refused. `SkillTrial.tokens` must carry the using node's cost, or ranking cannot tell a skill that lifts the pass rate for free from one that does it by tripling the bill.\n\nTwo shared configs anchor the negative cases: `NEVER_SATISFIED` (one node, wired to fail) and `ISOLATED_WRITER` / `ISOLATED_CHAIN` (providers that are `sh -c` commands writing real files).\n\n### `surface.rs` — the command surface\n\nCommands that parsed and compiled and had never been executed: `new --config-stdin` (YAML and `--markdown`), `convert --to-yaml` in both directions, `skills install`, `watch --check` and `watch` as a resident process bounded by `--max-runs`, `schedule` with and without `--install`, the read-only reports (`plan`, `providers`, `permissions`, `gate`), the run reports against an unknown run id, and `prune` with and without worktrees.\n\nThe round-trip test compares parsed models rather than text, via a local `trimmed()` that strips trailing whitespace from every scalar — a YAML block scalar ends with a newline and Markdown has no way to say so, a documented property of the Markdown grammar rather than a conversion bug.\n\n`schedule --install` is provable because `LOOPSMITH_LAUNCH_AGENTS_DIR` redirects the destination. Loading the plist stays the user's call, so no test runs `launchctl load -w`. `schedule_without_install_only_prints` deliberately accepts any of three next-step strings — `--install`, `crontab -e`, `schtasks /Create` — because asserting only the launchd wording passed on macOS and failed on every Linux box, which is what the CI matrix was added to find.\n\n### `compat.rs` — portability\n\nA loop directory outlives the checkout that produced it. Three differences break it every time and all three are invisible on the machine that wrote it: bash 3.2 (macOS still ships it), BSD versus GNU `sed`/`stat`/`readlink`, and whichever scheduler is installed, which is not implied by the OS.\n\nThese tests *run* the generated scripts rather than reading them. `new_loop(tag)` scaffolds into a scratch directory — `loopsmith new` refuses a path inside the loopsmith checkout, which is why this is never done in-tree.\n\n- `scripts/compat.sh` ships executable with every new loop, and every helper it defines (`compat_report`, `sed_i`, `stat_size`, `stat_mtime`, `readlink_f`, `sha256`, `require`, `need_bash`) is exercised under POSIX `sh`. The `sed_i` assertion also checks for stray `sample.txt*` backups, which is what a wrong `sed -i` spelling produces on BSD.\n- `require` and `need_bash` exit **2, not 1**. A detector's exit code is its verdict: \"this machine cannot run the check\" is a different fact from \"the check failed\", and a gate that cannot tell them apart reports missing tooling as unfinished work.\n- `run.sh` and `resume.sh` are checked with `sh -n` and scanned for bashisms (`[[`, `declare -A`, `mapfile`, `readarray`, `${!`, `&>>`). The scan runs over `strip_comments(&text)`, because these files *document* the constructs they must not use and a check that read prose would flag its own explanation. The same function strips `rem ` lines for the `.cmd` dialect.\n- The `.cmd` launchers must be CRLF (with LF only, the trailing newline joins the last token and `exit /b 2` becomes an unknown command), must use `setlocal enabledelayedexpansion` and `!ERRORLEVEL!` rather than `%ERRORLEVEL%`, and must have exactly one exit — `endlocal & exit /b %CODE%` — reached from every path via a `:loopsmith_done` label. `setlocal`'s implicit `endlocal` restores the errorlevel, so an early `exit /b 127` reports 0; `endlocal & exit /b 127` fixes that on a top-level line but *not* inside a nested `if ( … )` block, which is where the broken one was. A single exit point needs no reasoning about block parsing.\n- `launcher(dir, stem)` and `launcher_file(stem)` pick the launcher this host can execute. A test hardcoding `./run.sh` would test nothing on Windows, and `#[cfg(unix)]` would leave the `.cmd` unexercised on the only platform that runs it. `with_system_path` builds a minimal `PATH` — just `dir` on unix, plus `System32` on Windows, since removing it would stop the test measuring the fallback and start it measuring whether `where.exe` exists.\n- Indentation is asserted, because a `\\` continuation inside a non-raw `format!` eats the next line's leading whitespace and the generated `run.sh` reached disk flat. Nothing about that fails a build or a parse.\n- An **export** must be POSIX and must *not* pin a binary path from the machine that made it, since it travels further than anything else a loop produces.\n- `doctor` reports os, userland, bash, scheduler and git, quotes the in-place `sed -i` spelling for this userland, and stays advisory — a non-zero exit would fail a CI step that was working. Pointed at a config it also names detectors that do not exist or are not executable.\n\n`doctor_reports_a_detector_that_is_not_executable` is `#[cfg(unix)]` on purpose: there is no executable bit off unix, so `loopsmith_util::is_executable` degrades to a file check and `doctor` is *right* to report nothing. Gating the whole test says that, where a `#[cfg]` around just the `chmod` would leave a test asserting the wrong thing on Windows.\n\n### `guided.rs` — the wizard\n\n`loopsmith guided` reads a TTY when it has one and a plain answer stream when it does not; a piped stdin is exactly the second case. These tests script the whole conversation as lines of stdin and assert on what lands on disk — then run the config through `loopsmith validate`, the same validator a human would use, which is the real gate.\n\nAnswers use option **values** (`__byok__`, `file_exists`, `done`) rather than menu numbers, because the wizard accepts either and a value does not move when the catalog gains an entry. `minimal_script()` is the shared answer set; `a_yaml_choice_writes_yaml` locates the format answer with `position()` rather than indexing into the tail. `back_returns_to_the_previous_field` proves `:back` re-asks an earlier field without restarting the section or losing later answers; `quitting_writes_nothing` proves `:quit` leaves no directory; `edit_loads_an_existing_config_and_rewrites_it` covers `--edit` against a config already on disk.\n\n### `opt_in.rs` — network and money\n\nEvery test here returns without asserting unless its variable is set, via a local `gated!` macro that prints why it skipped. `cargo test --workspace` therefore never clones a repository, never calls a model, and never costs anything.\n\n```sh\nLOOPSMITH_STRESS_NETWORK=1  cargo test -p loopsmith --test opt_in\nLOOPSMITH_STRESS_PROVIDER=1 cargo test -p loopsmith --test opt_in -- --nocapture\n```\n\n`LOOPSMITH_STRESS_NETWORK` covers section J: a declared `github` sub-agent cloned into `generated-skills/`, and a post-clone `init_command` running inside the installed directory (it is argv, never a shell line). `LOOPSMITH_STRESS_PROVIDER` runs `research-loop` once against whatever model the example names — point it at the cheapest one you have; the aim is to prove the plumbing reaches a real provider, not to get a good answer — and checks that the randomness agent keeps to its four-item menu (`reorder:`, `escalate:`, `explore:`, `reframe:`) when a real model answers rather than a `printf`.\n\nTwo things here are *not* gated. `an_unsafe_repo_url_is_refused_before_git_is_reached` needs no network and is the half of the clone path that matters most. `the_harness_still_builds_a_runnable_fixture` is a sanity check, so a failure above is about the network or the provider rather than the scaffolding around it.\n\n---\n\n## Traps\n\nMost of these were once sentences someone had to remember. A remembered rule is one refactor away from being gone, so each is now something that fails.\n\n**Behaviours, pinned by a test:**\n\n| Trap | Pinned by |\n|---|---|\n| A `\\` continuation in a non-raw `format!` eats the next line's indentation | `the_generated_scripts_keep_the_indentation_they_were_written_with` |\n| `cmd.exe` needs CRLF; LF-only makes the last token unparseable | `the_generated_cmd_launchers_are_crlf_and_shaped_for_cmd_exe` |\n| A bashism check that reads comments flags its own explanation | `strip_comments`, extended to `rem ` for the `.cmd` dialect |\n| The userland is probed with `sed --version`, never inferred from the OS | `the_userland_is_probed_and_never_inferred_from_the_operating_system` (`platform.rs`) |\n| Windows fell into the catch-all arm and was offered `crontab` | `every_os_has_a_scheduler_worth_probing_and_windows_gets_the_native_one` |\n| `HOME` is unset on Windows | `the_home_directory_is_found_by_this_platforms_variable` |\n| `require` / `need_bash` exit 2, not 1 | `need_bash_exits_two_so_a_missing_tool_is_not_read_as_a_failed_check` |\n| A new `ProposalKind` must decide its own staleness | `every_proposal_kind_has_a_decided_lifetime` (`loopsmith-memory`) |\n| Proposals written before `expires_ms` existed must still load | `a_proposal_written_before_the_field_existed_still_deserialises` |\n\n**Test-authoring rules, which cannot be asserted:**\n\n- **Give every fixture a distinct tag.** Temp directories are named from it and the suite runs threaded, so two concurrent tests sharing a tag collide on the sled lock — the same error, from the same cause, with nothing pointing at the tag.\n- **The sled store cannot be opened while the binary under test is running**, and the handle must be dropped before its directory is removed. A store opened around a `Command` call reports a lock error that reads like a backend bug. Hence the `drop(store); f.cleanup();` pairing at the end of nearly every test.\n- **A detector script runs with no shell and no timeout.** `command` is argv[0] and `args` are literal, so a stub needs a shebang and must not hang.\n- **`satisfy_files` writes a body, not a placeholder.** The files a `file_exists` detector names are the same files a `regex_match` detector reads — evidence collection registers them under their stem — so `ARTIFACT_BODY` carries a URL and a `post_id:` line, the tokens the shipped examples look for. Use `write_artifacts` when a scenario needs something specific.\n\n---\n\n## Deliberately not covered\n\n- **Actually loading a launch agent.** `--install` writes the plist and stops; `launchctl load -w` stays the user's call. The same reasoning applies to `schtasks /Create` on Windows, where `schedule` prints the command rather than running it.\n- **Executing a `.cmd` launcher.** No POSIX host can run one, so this suite checks its shape and the `windows-latest` CI leg runs it.\n- **A GNU userland, locally.** `compat.rs` exercises the helpers rather than mocking the userland, so it asserts against whichever machine the suite runs on. The `ubuntu-latest` CI leg proves the other half by running the same tests.\n\n---\n\n## Connections to the rest of the workspace\n\n`harness/mod.rs` is the only file that reaches into other crates directly, and it does so as a *reader* of the same public surface a user has:\n\n- `loopsmith_core` — `LoopConfig`, `Detector`, `ProviderKind`, `ProviderSpec`, `Role`, `Tier`, `CompareOp`, `parse_str`, `load`, `cascade_for`\n- `loopsmith_memory` — `SledStore`, `open`, the `Store` trait (`ledger`, `episodes`, `summaries`, `goal_states`, `proposals`, `checkpoint`, `runs`, `skill_trials`), `LedgerKind`, `ProposalKind`\n- `loopsmith_util::testing::temp_dir` for scratch directories\n- `repo_root()` walks three ancestors up from `CARGO_MANIFEST_DIR` to reach `config/examples/`, so `all_examples()` enumerates whatever ships rather than a hardcoded list — a new example is covered by the two sweeps the moment it lands.\n\nEverything else goes through `Command::new(LOOPSMITH)`, where `LOOPSMITH` is `env!(\"CARGO_BIN_EXE_loopsmith\")`. Cargo builds the binary for the integration test and hands the path over, so there is no `cargo run` here and no chance of driving a stale build.\n\n### Adding a test\n\n1. Pick a distinct `tag`.\n2. Start from `Fixture::example` when the point is *this config works*, or `Fixture::from_yaml` when the point is a shape no example has.\n3. Mutate `f.cfg`, then `write_config()`. Use `cap` to bound the run.\n4. Chain the stages the scenario needs — a fixture with no `stub_scripts` is a starved run, and that is sometimes the point.\n5. Assert against `store()`, `log_text()`, or `export_dir()`. Not stdout.\n6. `drop(store); f.cleanup();`","overview":"# loops — Wiki\n\n# loopsmith\n\n> Self-evolving agent loops. The gate is code, so \"done\" cannot be argued.\n\nloopsmith runs a long-lived AI work loop against a job you describe once in a plain text file: what you want, how anyone would tell it's good, and when to stop. It dispatches the work to whatever agent CLI you already have, checks the result against mechanical criteria, sends it back when it falls short, and terminates when it passes. A loop can run unattended for weeks.\n\nOne rule holds the entire design up:\n\n> **A model must not be the thing that certifies its own completion.**\n\nThe field `goal_satisfied` is written by a deterministic Rust gate and by nothing else — no prompt, no judge node, no other crate. And the gate can **revoke**: delete a required artifact and a satisfied goal flips back to unsatisfied. A system that can only promote is a burndown chart with extra steps.\n\n---\n\n## The shape of the system\n\nThe repository is a Rust workspace under `runtime/` — one binary crate, `loopsmith-cli`, published as **`loopsmith`**, plus eight libraries beneath it. Everything a user can ask for arrives as an argv vector, becomes a typed `Command`, and is routed to exactly one place that does the work by calling into the libraries.\n\n```mermaid\ngraph TD\n    CLI[\"CLI<br/>loopsmith-cli\"]\n    SCHED[\"Scheduling<br/>cron · watch\"]\n    CFG[\"Config model<br/>loopsmith-core\"]\n    ENG[\"Execution engine<br/>run/\"]\n    GRAPH[\"Planner<br/>loopsmith-graph\"]\n    PROV[\"Providers<br/>loopsmith-provider\"]\n    GATE[\"Gate<br/>loopsmith-gate\"]\n    MEM[\"Memory<br/>loopsmith-memory\"]\n    SKILL[\"Skills<br/>loopsmith-skills\"]\n\n    CLI --> CFG\n    CLI --> ENG\n    SCHED --> ENG\n    ENG --> GRAPH\n    ENG --> PROV\n    ENG --> GATE\n    ENG --> SKILL\n    ENG --> MEM\n    GATE --> MEM\n    GRAPH --> CFG\n\n    style GATE fill:#C1272D,color:#fff\n    style CFG fill:#2A5A8A,color:#fff\n```\n\nTwo crates sit at the centre of everything. The [loop configuration schema](loop-configuration-schema.md) is the vocabulary the whole workspace speaks — nearly every other module calls into it — and the [loop execution engine](loop-execution-engine.md) is the state machine that turns a parsed config into iterations. The [gate](gating-success-criteria.md) is deliberately the smallest crate with the largest constraint attached, and [platform utilities](platform-utilities.md) sits at the bottom of the dependency graph depending on nothing at all.\n\n---\n\n## How a loop actually runs\n\n**You describe the job.** A config has ten sections, A through J: information, the manual work list, goals, validations, success criteria, stop gates, schedules, constraints, execution guidelines, default skills. You can write it as YAML or as Markdown — they are the same model in two grammars, and the [Markdown/YAML interchange](markdown-yaml-config-interchange.md) translates between them without either side knowing what a `Goal` is. If you would rather not write it by hand, `loopsmith --guided` walks you through it in the terminal and `loopsmith --web` paints the same config in a browser; both end at the same validator.\n\n**Validation refuses on purpose.** `loopsmith validate` fails until every `pre_execution` step is marked done, because automating a task you have never done by hand once produces fast, confident garbage. It also enforces the cross-field rule a JSON Schema cannot express: every goal carries at least one validation.\n\n**The planner schedules the work.** [Execution graph and concurrency planning](execution-graph-concurrency-planning.md) reads the `depends_on` edges between nodes and returns waves of nodes that may run together, the longest chain, and the worker count past which no more parallelism helps. It is pure and cheap, so the engine replans before every iteration instead of caching.\n\n**Nodes are dispatched.** [Provider integration](provider-integration.md) resolves each node's `cheap`/`standard`/`strong` tier into an actual command to run. A provider is a command template — a binary, its arguments, and a few switches — not a trait or an HTTP client, which is why loopsmith never holds an API key. It checks only that the variables named in `requires_env` exist. The [skills system](skills-system.md) supplies whatever sub-agents a node asked for, resolving each name through installed → marketplace → generate.\n\n**The gate rules.** Evidence is collected from the filesystem and handed to mechanical detectors declared in the config. The gate returns a verdict, and only the gate constructs a satisfied goal state.\n\n**Everything durable is written down.** [Memory and the episode store](memory-episode-store.md) persists whatever must survive a crash, a schedule boundary, or a context reset, validating before writing so one bad record cannot become a retrieved \"fact\" that becomes reasoning that becomes another bad record. `loopsmith resume <run-id>` picks up from the last checkpoint.\n\n**When it stalls, it changes tack.** [Evolution and perturbation](evolution-perturbation.md) answers the same question from two ends: `perturb.rs` applies one of four method changes to the next iteration when progress stops, while `evolve.rs` gathers evidence about the loop's own tooling and writes proposals for a human to read. Perturbation acts; evolution only advises.\n\n**And it keeps running without you.** [Scheduling and triggers](scheduling-triggers.md) supplies the heartbeat a config file doesn't have — cron parsing, UTC calendar math, and a watcher state machine — and hands the decision to something that outlives your terminal.\n\nSurrounding all of that: the [CLI command surface](cli-command-surface.md) owns the grammar, routing, and exit codes for every subcommand (`new`, `validate`, `plan`, `run`, `watch`, `gate`, `ledger`, `resume`, `convert`, `doctor`, `providers`, `skills`, `schedule`, `permissions`, `mcp`, `web`). [Permissions and sandboxing](permissions-sandboxing.md) derives the smallest capability set a config needs, shows it to a human once, and merges it into the harness settings file without clobbering what was already there. The [MCP server](mcp-server.md) exposes a loop's schedule, ledger, and gate verdict over stdio to any MCP client — read-only where it matters, because a model still may not certify its own completion.\n\n---\n\n## Getting set up\n\n```bash\ncargo install loopsmith                 # or: npm i -g @bitphill/loopsmith\n                                        #     pip install loopsmith-cli\n                                        #     brew install bitphill/loopsmith/loopsmith\n```\n\nThe [distribution and installers](distribution-installers.md) module is the six different channels that deliver the same binary, plus the script that keeps their versions from drifting.\n\nWorking on the code itself:\n\n```bash\ncd runtime\ncargo build --release\ncargo test              # unit tests per crate, plus the integration suite\n```\n\nThe [integration test suite](other.md) is the only place the shipped binary is exercised end to end — five test binaries driven through `CARGO_BIN_EXE_loopsmith` against the real configs in `config/examples/`, so an example that stops parsing, round-tripping, or converging breaks the build.\n\nYour first loop:\n\n```bash\nloopsmith new --path ~/loops/nightly-refactor --purpose \"keep the module simple\"\ncd ~/loops/nightly-refactor\nloopsmith validate loop.yaml && loopsmith plan loop.yaml && ./run.sh\n```\n\nPoint `--path` somewhere outside this repository — a loop edits files and writes state, and it does not get pointed at the tool that runs it.\n\n---\n\n## Where to read next\n\nThe fastest way to understand a config is to read one that works: the thirteen [example loops](example-loops.md) ship as a YAML source of truth and a generated Markdown twin, are compiled into the binary, and are executed by the test suite. Start from one with `loopsmith new --config-file <example>` rather than from the blank template.\n\nFor the prose side — `README.md`, `HOW-TO-USE.md`, `LOOP-TEMPLATE.md`, `README-DETAIL.md`, `README-FOR-DUMMIES.md` — see [project documentation](project-documentation.md), which tracks which files make which claims about behaviour the Rust actually enforces, and where a code change silently invalidates them.","permissions-sandboxing":"# Permissions & Sandboxing\n\n# Permissions & Sandboxing\n\nThe permission layer answers one question: *what is the smallest set of capabilities this loop config actually needs?* It derives that set from the config, shows it to a human once, and writes it into the settings file the harness reads. Everything else in the module exists to keep that grant honest — narrow, idempotent, and non-destructive to whatever the user already had.\n\n**Files**\n\n| Path | Role |\n|---|---|\n| `runtime/crates/loopsmith-cli/src/permissions.rs` | Derivation, rendering, and settings-file merge |\n| `runtime/crates/loopsmith-cli/src/cmd/permissions.rs` | The `loopsmith permissions` subcommand |\n| `runtime/crates/loopsmith-cli/templates/permissions.template.json` | Documented example of the output shape |\n| `runtime/crates/loopsmith-cli/templates/compat.template.sh` | Portability helpers for detector scripts |\n\n---\n\n## Why it exists\n\nA hands-off run cannot stop halfway to ask for consent. The naive fix — grant everything up front — turns a hands-off run into an unsupervised one. The module's compromise is stated in the file's own header comment: derive the narrowest rule set the config needs, present it once, write it where the harness reads it.\n\nThe consequence worth internalizing before you edit anything here: **permission rules are not the safety mechanism.** The generated file denies nothing by default, and `permissions.template.json` says so explicitly in its `$deny_note`. What stops a run from doing something irreversible is the constraint block in the loop config — `constraints.human_checkpoint` and the rules around proposals and quarantined sub-agents. This module only removes *prompts*, never *checkpoints*. `render()` says the same thing to the user, and there is a test (`render_mentions_that_checkpoints_still_stop`) that fails if that sentence ever goes missing.\n\n---\n\n## The three functions\n\n### `required(cfg: &LoopConfig) -> Vec<String>`\n\nWalks the config and collects permission strings into a `BTreeSet<String>`, so the result is deduplicated and sorted by construction. Five sources contribute:\n\n1. **Providers** — every entry in `cfg.providers.providers` is a command, so each yields `Bash({p.command}:*)`.\n2. **Script detectors** — each validation whose `detector` matches `Detector::Script { command, .. }` yields `Bash({command}:*)`, so gating can run its checks without prompting mid-run.\n3. **Skill acquisition** — only if `cfg.skills.acquisition_order` contains `AcquisitionSource::Marketplace`. That adds `Bash(npx skills:*)` **and** `WebFetch(domain:claudemarketplaces.com)`. A loop that never reaches the marketplace never asks for network access.\n4. **Core file tools** — `Read`, `Write`, `Edit`, `Glob`, `Grep`, unconditionally. The loop reads and writes inside its own directory.\n\nNon-obvious property: the set is the entire deduplication and ordering strategy. `the_grant_has_no_duplicates_and_is_sorted` asserts that the returned `Vec` equals its own sorted-and-deduped copy — if you ever swap `BTreeSet` for a `Vec` with manual pushes, that test is what catches you.\n\nAlso note what is *absent* relative to the template: `required` does not emit `Bash(loopsmith:*)`. The template lists it under `$sections.control_plane` as part of a hand-written example; the derived grant does not include a self-rule.\n\n### `render(grant: &[String]) -> String`\n\nThe human-readable preflight block, shown before the single grant. It prints one indented rule per line, then two closing claims: nothing outside the list is requested, and human checkpoints still stop regardless of the grant. This is the text a user reads to decide whether the loop is asking for too much, so keep it scannable — plain lines, no framing, no persuasion.\n\n### `merge_into(path: &Path, grant: &[String]) -> io::Result<String>`\n\nMerges the grant into a settings JSON file and returns the pretty-printed result so the caller can display it. The defensive sequence matters:\n\n- Missing file → start from `json!({})`.\n- Present but unparseable → `unwrap_or_else(|_| json!({}))`, i.e. fall back to an empty object rather than propagating a parse error.\n- Parsed to a non-object (an array, a bare string) → replaced with `json!({})`.\n- `permissions` and `permissions.allow` are created with `entry(...).or_insert_with(...)` only if absent.\n- Existing string entries are collected into a `BTreeSet` and each grant rule is pushed only if not already present.\n- Parent directories are created with `create_dir_all` before the write; the file ends with a trailing newline.\n\nTwo behaviors are load-bearing and both are tested. `merging_preserves_existing_rules_and_adds_new_ones` checks that an unrelated top-level key (`theme`) and a pre-existing rule (`Skill(claude-api)`) both survive — this file is usually `.claude/settings.local.json`, which belongs to the user, not to loopsmith. `merging_is_idempotent` checks that running the merge twice leaves `allow` at length 1.\n\nEdge case to be aware of if you extend this: if `permissions.allow` exists but is *not* an array, `as_array_mut()` returns `None`, the `if let Some(list)` body is skipped, and the file is rewritten unchanged apart from formatting. Non-string entries in `allow` are ignored by the dedup set but left in place.\n\n---\n\n## The command\n\n`cmd/permissions.rs::execute(config, write)` is the whole CLI surface:\n\n```\nloopsmith permissions <config>                                   # print the preflight block\nloopsmith permissions <config> --write .claude/settings.local.json\n```\n\nIt loads the config via `loopsmith_core::load` (which runs the Markdown config parser — `parse_md` → `build_document` → `tokenize`/`section_shape`), calls `required`, and then branches: with no `--write` it prints `render(&grant)`; with a path it calls `merge_into`, prints a count line (`wrote N permission rule(s) to <path>`), then prints the merged JSON. Both `load` and `merge_into` errors are flattened to `String` via `map_err(|e| e.to_string())`. The function always returns `ExitCode::SUCCESS` on the happy path; failures surface as the `Err(String)` the CLI's caller reports.\n\n---\n\n## Where it plugs in\n\n`required` has two callers outside this module, and both use it for the *derivation* only — neither goes through the subcommand:\n\n```mermaid\ngraph LR\n    CFG[LoopConfig] --> REQ[\"permissions::required\"]\n    REQ --> REN[\"render → stdout\"]\n    REQ --> MRG[\"merge_into → settings.local.json\"]\n    SC[\"scaffold.rs::scaffold\"] --> REQ\n    RC[\"web/assemble.rs::review_config\"] --> REQ\n    CMD[\"cmd/permissions::execute\"] --> REQ\n```\n\n- **`scaffold`** emits the grant as part of generating a new loop directory, so a freshly scaffolded loop ships with a settings file matching its own config.\n- **`review_config`** (web) surfaces the grant in the config review surface, so the same list a terminal user would see is shown before a run is accepted.\n\nKeeping `required` pure — config in, sorted `Vec<String>` out, no I/O — is what makes those three consumers possible. Adding a filesystem read or a side effect to it would couple the web review path to disk state. Put new I/O in `merge_into` or in the caller.\n\n---\n\n## Sandboxing at the detector boundary\n\n`compat.template.sh` is the other half of the story. Permissions govern *what a detector is allowed to invoke*; this template governs *whether the detector can run at all on the machine it landed on*.\n\nThe critical constraint, repeated twice in the file's header: **loopsmith runs a detector with no shell.** `command` is `argv[0]` and `args` are literal — no globbing, no `&&`, no pipes, no `$VAR` expansion. A detector is therefore a real file with a real shebang, and this template is what it sources:\n\n```sh\n. ./scripts/compat.sh\n```\n\nEverything is detected at run time rather than baked in at generation time, because a loop directory gets copied to a build box, a container, or another laptop, and a baked-in answer would be silently wrong on arrival. Three exported variables carry the detection: `LOOPSMITH_OS` (from `uname -s`), `LOOPSMITH_USERLAND` (`gnu` if `sed --version` succeeds, else `bsd`), and `LOOPSMITH_BASH_MAJOR` (parsed from `bash --version`, or `0` when bash is absent).\n\nThe helpers wrap the differences that actually break scripts:\n\n| Helper | Papers over |\n|---|---|\n| `sed_i` | GNU `sed -i` takes no argument; BSD requires one — get it wrong and BSD eats the next argument as a backup suffix |\n| `stat_size` / `stat_mtime` | `-c%s`/`-c%Y` on GNU vs `-f%z`/`-f%m` on BSD |\n| `readlink_f` | `readlink -f` is missing on BSD before macOS 12; falls back to a `cd`/`pwd -P` walk |\n| `sha256` | `sha256sum` or `shasum -a 256`, whichever is installed |\n| `need_bash` | macOS ships bash 3.2.57 (licence), so associative arrays, `${x,,}`, `mapfile`, `&>>`, and `**` are all unavailable |\n| `require` | A tool the detector depends on is not on `PATH` |\n| `compat_report` | One-line environment summary for a log or bug report |\n\n### Exit code 2 is a contract\n\n`need_bash` and `require` both `exit 2`, never `exit 1`. A detector's exit code *is* its verdict, and \"this machine cannot run the check\" is a categorically different fact from \"the check failed\". A gate that collapses the two reports missing tooling as unfinished work. If you add another failure path to this template, exit 2.\n\nWindows is covered only via Git Bash, WSL, or MSYS, where everything above behaves as it does on Linux. Nothing here runs under `cmd.exe` or PowerShell — a detector for those is a `.cmd` or `.ps1` naming its own interpreter, again because there is no shell to interpret one for it.\n\n---\n\n## Extending the module\n\n**Adding a new permission source.** Add a branch to `required` that inserts into `set`. Keep it conditional on something in the config — the module's whole premise is that an unused capability is never requested, and `marketplace_access_is_only_requested_when_the_policy_uses_it` is the shape of test to copy: build the config both ways and assert the rule appears in one and not the other.\n\n**Changing the emitted string format.** `Bash({command}:*)` is the harness's matcher syntax, not loopsmith's. Changing it changes what the harness allows; it is not a cosmetic edit.\n\n**Touching `merge_into`.** The user's settings file is shared state. Any change must preserve the two tested invariants — unrelated keys survive, and repeated merges do not grow the list.\n\n**Test helpers.** The local `cfg(extra: &str)` builder formats a YAML-ish config string and runs it through `loopsmith_core::parse_str`, splicing `extra` in at the end so a test can append config sections. Temp directories come from `loopsmith_util::testing::temp_dir` and are cleaned up with a trailing `let _ = std::fs::remove_dir_all(dir);`.","platform-utilities":"# Platform Utilities\n\n# Platform Utilities (`loopsmith-util`)\n\nThe bottom of the dependency graph. Every other crate in the workspace depends on this one, and this one depends on nothing — not even `serde`. That constraint is the whole design: anything added here is added to every build of every crate, so the bar for entry is \"this was already written more than once, in more than one state of correctness.\"\n\nThree things live here:\n\n| Item | Answers |\n|---|---|\n| `which` / `is_executable` | Is this command runnable, and where is it? |\n| `now_ms` | What time is it, as a sortable number? |\n| `platform` | What is this host *actually*, at run time? |\n| `testing` (feature-gated) | Where can a test put a scratch directory without colliding? |\n\n---\n\n## `which` — shell-faithful command resolution\n\n```rust\npub fn which(cmd: &str) -> Option<PathBuf>\npub fn is_executable(p: &Path) -> bool\n```\n\n`which` resolves a command the way a shell would, and the two branches are distinct:\n\n- **Anything containing a separator** (absolute paths, `./check.sh`, `dir/tool`) is checked directly. Earlier copies of this function were PATH-only and joined absolute paths onto every `PATH` entry, which always returned `None`. `an_absolute_path_is_checked_directly_not_joined_onto_path` pins that.\n- **Bare names** are resolved against `PATH` via `std::env::split_paths`, taking the first hit.\n\nBoth branches funnel into the private `first_executable`, which is where the two real subtleties live.\n\n### Executability is checked, not assumed\n\n`is_executable` consults the unix permission bits (`mode() & 0o111`) and requires `is_file()`. Two of the three functions this replaced checked only `is_file()`, so a non-executable file named `curl` sitting on `PATH` read as \"curl is available\" — and the failure surfaced much later as a confusing spawn error rather than at the availability check.\n\nOff unix there is no permission bit, so `is_executable` degrades to a plain file check rather than pretending to know more than it does. This asymmetry is deliberate and the tests encode it per-platform: `a_file_that_is_not_runnable_is_not_a_command` asserts the bit on unix, and asserts the *equivalent* Windows claim (nothing is invented by appending a suffix) elsewhere.\n\n### `PATHEXT` suffixes are appended, never substituted\n\n`path_extensions()` returns an empty `Vec` on unix — the executable bit is the whole answer there — and on Windows reads `PATHEXT`, falling back to `.COM;.EXE;.BAT;.CMD`. Honouring the variable rather than hardcoding is how a machine gets to say that `.ps1` or `.py` counts as a command.\n\nThe suffix is pushed onto the `OsString`, not applied with `set_extension`. `set_extension` would rewrite `check.sh` into `check.exe`; appending gives `check.sh.exe`, which is correct because a command name may legitimately contain a dot.\n\nWithout this loop, `which` returned `None` for **every command on a Windows machine** (`git` there is `git.exe`, so the bare join matches nothing). The blast radius of that one bug is a good map of who calls this function: `doctor` reported no tools installed, `Platform::detect` found no scheduler, and worktree isolation degraded to a shared directory citing \"git not on PATH\" — on a machine where git was very much on PATH.\n\n```mermaid\nflowchart TD\n    W[\"which(cmd)\"] -->|\"has separator\"| FE[\"first_executable(path)\"]\n    W -->|\"bare name\"| SP[\"split_paths(PATH)<br/>join each dir\"]\n    SP --> FE\n    FE --> IE[\"is_executable?\"]\n    IE -->|yes| HIT[\"Some(path)\"]\n    IE -->|no| PX[\"path_extensions()<br/>append each suffix\"]\n    PX --> IE2[\"is_executable?\"]\n    IE2 -->|yes| HIT\n    IE2 -->|exhausted| NONE[\"None\"]\n```\n\n---\n\n## `now_ms` — the single clock\n\n```rust\npub fn now_ms() -> u64\n```\n\nMilliseconds since the Unix epoch. Timestamps are stored as numbers throughout loopsmith so the memory ledger stays sortable without a date parser.\n\nA clock that has run backwards (`duration_since` returning `Err`) yields `0` rather than panicking. The trade is explicit: a wrong timestamp on one ledger entry is a nuisance; a panic partway through an unattended overnight run is not.\n\n---\n\n## `platform` — what the host actually is\n\n`cfg!(target_os = …)` tells you what the binary was *compiled* for. It cannot tell you which bash is on `PATH`, which userland `sed` belongs to, or which scheduler is installed — and each of those changes what a generated script is allowed to assume. Everything in this module probes at run time, reports, and decides nothing on the caller's behalf. Nothing is cached across processes; a probe costs one `--version` call and a loop run is not a hot path.\n\n### `Os`\n\nA thin enum (`MacOs`, `Linux`, `FreeBsd`, `Windows`, `Other`) over `std::env::consts::OS`. This one genuinely *is* a compile-time fact — it is wrapped here so callers have one place to ask, sitting next to the facts that are not. `as_str()` gives the stable lowercase name used in reports; `is_windows()` answers \"does this host run `.cmd` batch files rather than `#!` scripts.\"\n\nThe BSD variants collapse: `freebsd`, `openbsd`, and `netbsd` all map to `Os::FreeBsd`, which stringifies as `\"bsd\"`.\n\n### `home_dir()`\n\n```rust\npub fn home_dir() -> Option<PathBuf>\n```\n\nOff Windows this is just `HOME`, rejecting the empty string. On Windows it tries `HOME` first (Git Bash and MSYS set it, and it is the more specific answer when both exist), then `USERPROFILE`, then reconstructs `HOMEDRIVE` + `HOMEPATH` for a bare `cmd.exe`.\n\nCode that reads `HOME` directly silently loses the home directory on Windows, and the failure surfaces far downstream as \"cannot locate LaunchAgents\" or as a loop cheerfully scaffolding itself into a relative path. The test asserts the result is *absolute* for exactly that reason.\n\n### `Userland`\n\n```rust\npub enum Userland { Gnu, Bsd, Unknown }\n```\n\nProbed, never inferred. `Userland::detect()` runs `sed --version`: GNU answers successfully, BSD exits non-zero. A successful run whose output mentions `gnu` or `busybox` is `Gnu`; a successful run that mentions neither is `Unknown`; a non-zero exit is `Bsd`; a spawn failure is `Unknown`.\n\nThe operating system does not imply the userland in either direction — Homebrew's `coreutils` puts GNU tools ahead of BSD ones on a Mac, and a stripped container may carry busybox.\n\n`sed_in_place()` is what callers actually want out of this: `[\"-i\"]` for GNU, `[\"-i\", \"\"]` for BSD. Getting it backwards on BSD silently consumes the *next* argument as a backup suffix, which is how a script ends up editing a file called `-e`. **`Unknown` deliberately takes the BSD spelling** — GNU rejects the empty suffix loudly, and a loud failure beats a silent wrong edit.\n\n### `BashVersion`\n\n```rust\npub struct BashVersion { pub major: u32, pub minor: u32, pub raw: String }\n```\n\nmacOS still ships bash 3.2.57, because 4.0 changed licence. Associative arrays, `${x,,}`, `mapfile`, `&>>`, and `**` all arrived in 4.0 — so a detector script written on Linux dies with a syntax error on a Mac rather than a useful message. `MODERN_MAJOR = 4` is that line, and `is_modern()` is the question.\n\n`parse` takes the first line of `bash --version` and splits on the literal `\"version \"`, then takes the leading run of digits and dots. The banner shape has been stable since bash 2.0:\n\n```\nGNU bash, version 3.2.57(1)-release (x86_64-apple-darwin24)\n```\n\nA missing minor defaults to `0`, so `version 5 (x86_64)` parses as 5.0. Anything that is not a bash banner — `\"zsh 5.9\"`, `\"bash: command not found\"`, `\"\"` — yields `None`. `raw` keeps the whole trimmed line for the `doctor` report. The private `probe(command)` is `parse` applied to whatever `<command> --version` prints on stdout.\n\n### `Platform`\n\n```rust\npub struct Platform {\n    pub os: Os,\n    pub userland: Userland,\n    pub bash: Option<BashVersion>,\n    pub sh_bash: Option<BashVersion>,\n    pub schedulers: Vec<&'static str>,\n}\n```\n\n`Platform::detect()` is the one call that assembles the whole picture — an `Os::detect`, a `Userland::detect`, two `BashVersion::probe` calls, and a `which` sweep over the scheduler candidates.\n\n`sh_bash` probes `/bin/sh` specifically. On Debian that is `dash` and the field is `None`, which is worth knowing on its own: dash rejects `[[`, `local -n`, and `echo -e` that a bash-as-sh would have accepted by accident.\n\n`preferred_schedulers(os)` is a free function returning the *candidate* list, best first — not the answer:\n\n| OS | Candidates | Why this order |\n|---|---|---|\n| macOS | `launchctl`, `crontab` | launchd survives a reboot without the user enabling anything |\n| Linux / BSD | `crontab`, `systemctl` | |\n| Windows | `schtasks`, `crontab` | Task Scheduler is the only one that ships with Windows; crontab still worth probing for Cygwin/WSL interop |\n| Other | `crontab` | |\n\n`Platform::detect` filters that list through `crate::which`, so `schedulers` holds only what is genuinely installed and `scheduler()` returns the first survivor (or `None`). The Windows row exists because Windows once fell into the catch-all arm, was offered `crontab`, and `schedule` reported \"no scheduler\" on a machine with a perfectly good Task Scheduler — `every_os_has_a_scheduler_worth_probing_and_windows_gets_the_native_one` pins it.\n\nTwo derived answers round it out:\n\n- `has_modern_bash()` — `false` when bash is missing entirely. A script that cannot be run is not a script that may assume anything.\n- `portability_note()` — one line explaining why a generated script sticks to POSIX `sh`, or `None` when nothing is holding it back. Distinguishes \"no bash on PATH\" from \"bash 3.2 predates 4.0\".\n\n```mermaid\nflowchart LR\n    D[\"Platform::detect()\"] --> OS[\"Os::detect()\"]\n    D --> U[\"Userland::detect()<br/>sed --version\"]\n    D --> B[\"BashVersion::probe<br/>bash + /bin/sh\"]\n    D --> PS[\"preferred_schedulers(os)\"]\n    PS --> WH[\"which() filter\"]\n    B --> P[\"parse()\"]\n    WH --> S[\"schedulers[]\"]\n```\n\n---\n\n## `testing` — feature-gated scratch directories\n\nBehind the `testing` feature, off by default. Crates enable it from `[dev-dependencies]`; resolver 2 keeps it out of the normal build, so this never ships in a release binary.\n\n```rust\npub fn temp_path(tag: &str) -> PathBuf  // unique, NOT created\npub fn temp_dir(tag: &str) -> PathBuf   // unique, created\npub fn cleanup(p: &Path)                // best-effort, never fails a test\n```\n\nPaths are `loopsmith-{tag}-{pid}-{now_ms}-{n}`, where `n` comes from a process-wide `AtomicU64`.\n\n**The counter is the load-bearing part.** This helper existed six times in four shapes, and two of those shapes omitted it. Tests run in parallel threads within one process, so pid and millisecond timestamp do not separate two directories created in the same millisecond — and when two tests share a directory, `sled` reports a lock error that reads like a backend bug rather than a test collision. Debugging that once is why this is centralized.\n\n`cleanup` swallows its error deliberately: a leaked temp directory is not worth failing an otherwise-passing test over.\n\n---\n\n## Who calls this\n\n`temp_dir` / `cleanup` are the widest consumers by call count — scaffolding tests, logging tests, permission-merge tests, run/export and run/publish fixtures, the web API's `write_scratch` path — but they are test scaffolding and carry no production weight.\n\nThe load-bearing production consumers are narrower:\n\n- **`src/cmd/doctor.rs`** — calls `Platform::detect`, then reports `scheduler()` and `portability_note()`; uses `is_executable` in `config_notes` to check the tools a config references.\n- **`src/cmd/schedule.rs`** — `Platform::detect` plus `scheduler()` to pick a scheduler, and `preferred_schedulers` in its own `preferred_names` to describe what it looked for.\n- **`src/cmd/new.rs`** — `Platform::detect` when generating a loop, so the scaffolded scripts match the host.\n\n`which` and `now_ms` are used broadly across the workspace but through direct calls rather than any single flow worth naming.\n\n---\n\n## Contributing to this crate\n\n**The dependency budget is zero.** A new dependency here lands in every crate in the workspace. If something needs a crate, it belongs a layer up, in `loopsmith-core` or wherever its actual consumer lives.\n\n**The entry bar is duplication.** Each item here has a doc comment recording how many times it was written before it was centralized, and which of those copies was wrong. That is the format — a new addition should be able to name the copies it replaces.\n\n**Probe, report, do not decide.** `platform` returns what it found. `preferred_schedulers` returns candidates, not a choice; `portability_note` returns a sentence, not a policy. The caller decides.\n\n**Tests must not mutate the process environment.** `std::env::set_var` races every other test thread that reads the environment — the same class of collision the temp-dir counter exists to prevent. Both the PATHEXT test and the non-executable-file test go through `which`'s absolute-path branch instead of swapping `PATH`, and say so in comments.\n\n**Assert the platform's own rule, not unix's.** Where a claim means different things on the two platforms, the tests split under `#[cfg(unix)]` / `#[cfg(not(unix))]` and assert the equivalent claim on each, rather than asserting unix semantics on a system that has none.\n\n**Packaging note.** `Cargo.toml` ships only `/src/**/*` and `/README.md`. The workspace integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain — shipping them would hand a published crate tests that cannot pass.","project-documentation":"# Project Documentation\n\n# Project Documentation\n\nThe documentation set is a module in its own right: seven top-level Markdown files plus the shipped example configs, all of which make claims about behaviour that `loopsmith` enforces in Rust. Nothing here is generated — every file is hand-written and every file can drift. This page describes what each file is for, which reader it targets, the invariants they collectively assert, and the specific places where a code change silently invalidates prose.\n\n## The files\n\n| File | Audience | Contract it holds |\n|---|---|---|\n| `README.md` | A developer deciding whether to install | Install lines per registry, the three front ends, the five-minute path, scheduling and portability tables |\n| `README-FOR-DUMMIES.md` | A non-programmer | The same product with no schema, no crate names, and no CLI beyond four commands |\n| `README-DETAIL.md` | A contributor | Architecture, the full command table, the A–J model, providers, the gate's rationale, repository layout, notable tests |\n| `HOW-TO-USE.md` | Someone writing a `loop.yaml` | Field-by-field reference for every section, plus the permission preflight, ledger, and failure playbook |\n| `LOOP-TEMPLATE.md` | Someone authoring a loop by hand | A fill-in config with a *why it exists* note per section; copied to `<loop>/SKILL.md` |\n| `loops-engineering-cheat-sheet.md` | A designer of any loop system | The 20-source distillation, what was borrowed, what was rejected and why |\n| `AGENTS.md` / `CLAUDE.md` | Agents working in this repo | GitNexus index conventions; identical bodies, two filenames for two tool ecosystems |\n\n`config/examples/*.yaml` and their `.md` twins are documentation too — thirteen loops that double as the browser UI's and wizard's example library.\n\n## Reading paths\n\nThe four entry points are deliberately non-overlapping. A reader should land in exactly one and be routed onward, never asked to read two files that say the same thing differently.\n\n```mermaid\nflowchart TD\n    D[\"README-FOR-DUMMIES.md<br/><i>no code required<\/i>\"] --> R\n    R[\"README.md<br/><i>install · 5 minutes<\/i>\"] --> H[\"HOW-TO-USE.md<br/><i>every field<\/i>\"]\n    R --> DT[\"README-DETAIL.md<br/><i>architecture · why<\/i>\"]\n    H --> T[\"LOOP-TEMPLATE.md<br/><i>authoring surface<\/i>\"]\n    DT --> CS[\"loops-engineering-cheat-sheet.md<br/><i>sources · rejections<\/i>\"]\n    T --> EX[\"config/examples/*<br/><i>thirteen worked loops<\/i>\"]\n```\n\n`README.md` is the hub — it links every other file. `README-FOR-DUMMIES.md` is the only file allowed to link *down* into examples using the `.md` variants rather than the `.yaml` ones, because its readers edit Markdown configs.\n\n## The invariants the prose asserts\n\nEvery document repeats a small set of claims. They are the product, so they must be phrased consistently and must remain true of the code:\n\n1. **The gate is the only writer of `goal_satisfied`, and it can revoke.** Stated in `README.md`, `README-DETAIL.md` (\"Why the gate is Rust\"), `HOW-TO-USE.md` §1, and `LOOP-TEMPLATE.md` §D. Backed by `the_gate_can_take_done_back` and by the MCP surface test `there_is_no_tool_for_declaring_a_goal_satisfied`.\n2. **`validate` fails on purpose** until every `pre_execution` step is `done: true`. The exact error text is quoted verbatim in three files — treat it as a fixture, not as illustrative prose.\n3. **Every goal needs at least one blocking validation**, or the config is rejected.\n4. **A `judge` verdict from the builder's own provider is refused, not discounted** (`judge_on_the_builders_provider_is_refused`).\n5. **`requires_env` names keys; values are never read, substituted, or logged.** Repeated wherever a provider example appears, including the browser UI's secret-store section.\n6. **Cron is evaluated in UTC**, and `file_change` / `goal_satisfied` triggers fire on the edge.\n7. **The loop proposes goal, validation, success, and skill changes; it never applies them.** Rendered as the same two-column table in `README-DETAIL.md`, `HOW-TO-USE.md` §11, and `LOOP-TEMPLATE.md`.\n\nWhen one of these changes in the runtime, all of its occurrences change together. Grep for the phrasing, not for the concept.\n\n## Where docs bind to code\n\nThese are the couplings that break quietly.\n\n**The A–J model.** `HOW-TO-USE.md` §5 is the field reference; `config/loop.schema.json` is the machine-readable source; `loopsmith_core::validate` enforces the cross-field rules the schema cannot express (targets resolving, cycles in `execution_guidelines.dependency`, `regex_match` artifacts naming a path some `file_exists` detector declares). A new field means edits in all three, plus `LOOP-TEMPLATE.md` if it belongs on the authoring surface.\n\n**The command table.** `README-DETAIL.md` lists every subcommand. It is the closest thing to a CLI reference and has no test behind it — adding a subcommand without touching that table is the most common drift in the set.\n\n**The examples.** `config/examples/` is authoritative; `tools/sync-examples.sh` copies into `runtime/crates/loopsmith-cli/templates/examples/`, which the binary pulls in with `include_str!` (it cannot reach above the package root, and `config/` is excluded from the published tarball). A test fails when the two copies diverge, so this coupling *is* enforced — but the count \"thirteen\", written out in prose in four places and in three separate tables, is not.\n\n**The detector helper table.** `HOW-TO-USE.md` §5 documents `sed_i`, `stat_size`, `stat_mtime`, `readlink_f`, `sha256`, `require`, and `need_bash`, along with the rule that `require` and `need_bash` exit **2** rather than 1 — \"this machine cannot run the check\" is a different verdict from \"the check failed\". That table must match the shipped `scripts/compat.sh` exactly; a helper renamed there breaks detectors written from the docs on a different machine.\n\n**Diagrams exist in triplicate.** The guided-wizard flow appears as `assets/guided-flow.png` (both READMEs), as a Mermaid graph, and as an ASCII fallback for terminals that render neither. The architecture flow likewise exists as `assets/architecture.png` and as Mermaid. Changing the flow means regenerating a PNG *and* editing two text renderings; the ASCII block is the one that gets forgotten.\n\n## Conventions\n\n- **Tables over prose for anything enumerable.** Detectors, stop gates, platform behaviour, and failure modes are all tables. Prose is reserved for the reasoning.\n- **Every section explains *why it exists* before *what it takes*.** This is the house style in `LOOP-TEMPLATE.md` and `HOW-TO-USE.md`, and it is why those files are long: a field whose purpose is unstated gets set to whatever the example showed.\n- **Quote real output.** Provider availability listings, spend lines, `skills scores` tables, and the `pre_execution` refusal are copied from actual runs. Do not paraphrase them into plausible-looking output.\n- **Relative links only.** Files are read on GitHub, on the docs site, and inside a clone. The single absolute link that is load-bearing is the code wiki at `https://bitphill.github.io/loopsmith/wiki/#overview`.\n- **`README-FOR-DUMMIES.md` never names a crate, a Rust symbol, or YAML.** It says \"checker\", not \"gate\"; \"practice run\", not \"dry run\" (though it names the button `Dry run`). Terms introduced there map one-to-one onto the developer vocabulary but are not interchangeable within a file.\n- **Aliases are documented, not hidden.** `--web`/`web` and `--guided`/`guided` both exist; `HOW-TO-USE.md` §4b states plainly that neither spelling is the real one and that combining `--web` with a subcommand is refused rather than resolved.\n\n## Known drift\n\nPresent in the tree today, and worth fixing as part of any docs pass:\n\n- **Test counts disagree three ways.** `README.md`'s badge says 415, `README-DETAIL.md`'s badge says 240, and its body says \"148 tests, no warnings\". At most one is current. The number is manual in all three places.\n- **\"A–H\" survives where the model is A–J.** `HOW-TO-USE.md` §1 describes core as \"A–H config model and validation\" and §4 calls the scaffolded file \"the A–H config\"; `LOOP-TEMPLATE.md` is still headed \"The A–H model\" and its run block says \"A–H model complete and consistent\". Sections **I** (`execution_guidelines`) and **J** (`default_skills`) are documented elsewhere in the same files.\n- **`README-DETAIL.md` has two `## Architecture` headings.** The second one — the three-front-ends section — is unreachable by anchor, and the table-of-contents link at the top resolves to the first.\n- **`no_progress_iterations_randomness` is filed under \"F, continued\"** in `HOW-TO-USE.md` §5, after section I's neighbours, rather than inside the `stop_gates` entry it belongs to. It is also the only stop-gate field absent from `LOOP-TEMPLATE.md`'s section F block.\n- **`HOW-TO-USE.md` §5 introduces `context`, `graph`, and `skills` as \"two more sections\" and then lists four.** `README-DETAIL.md` makes the same slip.\n- **`loopsmith skills install <config>`** appears only in `HOW-TO-USE.md` §J; it is missing from the `README-DETAIL.md` command table, which lists `skills search`, `acquire`, `list`, and `scores`.\n\n## Checklist for a documentation change\n\n- Which of the seven invariants does this touch? Update every occurrence, in the same words.\n- Does it add or change a config field? Then `config/loop.schema.json`, `HOW-TO-USE.md` §5, and — if a human would hand-write it — `LOOP-TEMPLATE.md`.\n- Does it add a subcommand or flag? `README-DETAIL.md`'s command table, and `README-FOR-DUMMIES.md` only if a non-programmer would ever type it.\n- Does it change an example? Run `tools/sync-examples.sh` and `cargo test`, or the compiled-in copy goes stale.\n- Does it change a diagram? PNG, Mermaid, and ASCII fallback — all three.\n- Does the quoted CLI output still match? Re-run the command and paste, rather than editing the old block.","provider-integration":"# Provider Integration\n\n# Provider Integration (`loopsmith-provider`)\n\n`runtime/crates/loopsmith-provider/src/lib.rs`\n\nThe provider plane is the only place in loopsmith that talks to a model. It answers one question — *given a node that wants a `cheap`/`standard`/`strong` completion, which program do we actually run, and what did it cost?* — and it answers it without ever holding an API key.\n\n## The one design decision\n\n**A provider is a command template.** Not a trait, not an HTTP client, not a feature flag. `ProviderSpec` describes a binary, its arguments, and a few behavioural switches; `invoke` spawns it. Claude Code, `ollama run`, a Grok CLI, an OpenAI-compatible endpoint driven by `curl`, an MCP server over stdio — all of them are \"a program you run with a prompt.\"\n\nTwo consequences follow, and they are the reason to keep the decision:\n\n1. **Adding a provider is a config edit.** No Rust change, no rebuild, no release. `ProviderKind` exists for labelling and reporting, not for dispatch — `Byok` is a first-class kind, and the dispatch path never matches on kind.\n2. **Secrets never enter the process.** `requires_env` names variables that must *exist*; `availability` checks presence with `std::env::var_os(k).is_none()` and never reads a value. Nothing is substituted into an argument, logged, or written to the ledger. The child command does its own expansion.\n\n## Types you will touch\n\n| Type | Role |\n|---|---|\n| `InvokeRequest` | What the caller wants: `node_id`, `system`, `prompt`, `tier`, `workdir`. `node_id` is for logging and digests only. |\n| `InvokeResponse` | What came back: `provider_id`, `output` (stdout), `exit_code`, `duration_ms`, `stderr_tail`, `tokens`, `tokens_estimated`, `cost_usd`. `Serialize + Deserialize` because it lands in the ledger. |\n| `Availability` | `on_path` plus `missing_env` (**names only**). `ok()` requires both; `why_not()` renders the human explanation the cascade records. |\n| `ProviderError` | `NoneAvailable { tier, tried }`, `Spawn`, `Timeout { id, seconds }`, `Failed { id, code, stderr }`. |\n\n`ProviderSpec`, `ProviderKind`, `Tier`, and `LoopConfig` all come from `loopsmith-core` (`src/config/providers.rs`, `src/config/mod.rs`). This crate owns behaviour, core owns the schema.\n\n## The dispatch path\n\n`dispatch` is the entry point almost every caller uses. It resolves a candidate list, skips what is unusable, tries what is left in order, and returns the response alongside the list of skipped ids so the ledger can record *why* a given provider served the call.\n\n```mermaid\nflowchart TD\n    A[\"dispatch(cfg, req, pinned)\"] --> B{pinned?}\n    B -- yes --> C[\"cfg.provider(id)\"]\n    B -- no --> D[\"cfg.cascade_for(tier)\"]\n    C --> E[\"for spec in candidates\"]\n    D --> E\n    E --> F{\"availability(spec).ok()?\"}\n    F -- no --> G[\"push why_not() to skipped\"]\n    F -- yes --> H[\"invoke(spec, req)\"]\n    H -- Err --> G\n    G --> E\n    H -- Ok --> I[\"(response, skipped)\"]\n    E -. exhausted .-> J[\"Err(NoneAvailable { tried })\"]\n```\n\nThree properties worth preserving when you edit this:\n\n- **An unavailable provider is not an error.** It is a skip with a reason. A machine without `ollama` installed still runs the loop.\n- **A failed provider is also a skip.** `invoke` returning `Err` falls through to the next candidate; only an exhausted cascade is fatal.\n- **`NoneAvailable` carries every attempt** in `tried`, joined with `; `. When the cascade was empty it reads `\"none declared\"`. This string is often the only diagnostic a user sees, so keep it informative.\n\n`pinned` bypasses the cascade entirely — one named provider, or nothing. That is the mechanism callers use to enforce judge independence (a judge must not run on the same provider as the builder it is checking); the *policy* lives with the caller, the escape hatch lives here.\n\n## Rendering a command\n\n`render` substitutes `{key}` placeholders from a `BTreeMap<&str, &str>`. `invoke` builds exactly five:\n\n`{prompt}` · `{system}` · `{model}` (empty string when `spec.model` is `None`) · `{tier}` (`tier_name`: `\"cheap\"`/`\"standard\"`/`\"strong\"`) · `{node}`\n\nUnknown placeholders are left verbatim — `render(\"{prompt} {unknown}\", …)` yields `\"hi {unknown}\"`. That is deliberate and tested; a typo in a config should produce a visibly wrong command line, not a silently empty argument.\n\nPrompt delivery is a switch, not a convention. With `prompt_on_stdin: false` the prompt reaches the child only through a rendered `{prompt}` argument. With `prompt_on_stdin: true` stdin is piped and the prompt written to it — and a broken pipe there is deliberately swallowed, because a child that exited early is reported far more usefully by the exit-code path below.\n\n## Running one provider\n\n`invoke` spawns with `Command`, `current_dir(&req.workdir)`, stdout and stderr piped, stdin piped or null per the switch.\n\nTimeouts are a **50 ms poll loop over `try_wait`**, not an async runtime — `std::process` has no timeout, and pulling in a runtime for this one feature was judged too heavy. On expiry: `kill`, `wait`, `Err(Timeout)`. If you ever make this crate async, this loop is the thing you are replacing.\n\nA non-zero exit is `ProviderError::Failed` carrying only the **last line** of stderr. A silent pass on a failed provider would let a broken command masquerade as an empty completion, which the loop cannot distinguish from a model that had nothing to say.\n\n## Usage and cost\n\nThe accounting ladder, in order:\n\n1. `parse_usage(spec, stdout)` — compile `spec.usage_regex`, take capture group 1 (falling back to the whole match), strip `,` and `_`, parse `u64`. Every failure step returns `None` via `?`, including an uncompilable regex.\n2. `parse_usage(spec, stderr)` — providers report usage in wildly different streams.\n3. `estimate_tokens(prompt, stdout)` — `chars / 4`, ceiling. Sets `tokens_estimated: true`.\n\nThe estimate is not defended as accurate. It is defended as *present*: an approximate ceiling that fires beats an exact one that never does, which is what an unaccounted budget gate amounts to. `tokens_estimated` exists so a budget report can say which kind of number it is holding.\n\n`cost_usd` is `Some` only when both a token count and `cost_per_1k_tokens` exist. No rate means no cost — never a guessed one.\n\n## `starter_providers()`\n\nFive specs emitted by `loopsmith init` (via `starter_config` in `loopsmith-cli/src/scaffold.rs`) so a fresh config has a working cascade on day one: `claude` (standard+strong), `ollama` (cheap), `grok` (standard), `openai` (strong), `gemini` (standard). Every tier is covered, and a test asserts it stays that way. Since each is just a command, an uninstalled one is skipped rather than fatal.\n\nTwo entries encode hard-won specifics:\n\n- **`ollama` gets 120 s, not 600 s.** `ollama run <model>` silently pulls a missing model, and from outside the process a 4.7 GB download is indistinguishable from slow generation — one observed run burned its entire 600 s budget downloading and produced nothing. A cheap tier exists to be abandoned quickly. Pull first: `ollama pull llama3`.\n- **`openai` is `curl`, and the key is the literal string `Authorization: Bearer $OPENAI_API_KEY`.** It also carries a `usage_regex` for `\"total_tokens\"`, so its cost ceiling is measured rather than estimated.\n\n## Callers\n\n| Caller | Uses |\n|---|---|\n| `run_node` (`src/run/dispatch.rs`) | Builds `InvokeRequest`, calls `dispatch`, calls `digest` for prompt provenance |\n| `ask_agent` (`src/run/perturb.rs`) | `InvokeRequest` + `dispatch` |\n| `add_narrative` (`src/run/summary.rs`) | `InvokeRequest` + `dispatch` |\n| `execute` (`src/cmd/providers.rs`) | `availability` — the `loopsmith providers` doctor view |\n| `starter_config` (`loopsmith-cli/src/scaffold.rs`) | `starter_providers` |\n\n`digest` is FNV-1a, 64-bit, hex-formatted. Explicitly not cryptographic: its only job is to let the ledger say \"same prompt as before\" without storing the prompt twice.\n\n`which` is a re-export from `loopsmith-util`. The path stayed so existing callers keep compiling; the implementation moved once it turned out to have been written three times across the workspace, in three different states of correctness. Do not re-add a local copy.\n\n## Extending\n\n**Adding a provider** — edit config. Give it an `id`, a `command`, `args` with placeholders, the tiers it serves, and add the id to the relevant `cascade` lists. If it needs credentials, name them in `requires_env` and let the command expand them.\n\n**Adding a `ProviderKind` variant** — that is a `loopsmith-core` change, and it buys you a label, not behaviour. Ask whether `Byok` already covers the case; usually it does.\n\n**Changing `dispatch` or `invoke`** — these are the crate's two load-bearing functions and every runtime path reaches them. Run impact analysis before editing, per the project's standing rule.\n\n## Gotchas\n\n- **No shell is involved.** `Command::new` execs the binary directly, so an argument like `$OPENAI_API_KEY` is delivered to the child *verbatim*; expansion is entirely the child command's responsibility. This is what keeps values out of this process, and it means shell syntax (globs, pipes, `&&`) in `args` does not work.\n- **`args` are rendered, `command` is not.** A placeholder in the command name is passed through unsubstituted.\n- **A malformed `usage_regex` degrades silently** to estimation rather than failing the call. Intentional, and covered by `a_malformed_usage_regex_falls_back_to_estimating`.\n- **Output is `from_utf8_lossy`.** Non-UTF-8 provider output is replaced, not rejected.\n- **Windows argument quoting bites tests.** `a_usage_regex_extracts_the_real_count` deliberately uses `total_tokens=1234` with no double quotes; the earlier JSON-shaped payload failed on Windows for reasons that had nothing to do with usage parsing.\n\n## Tests\n\nThe module test block is the specification, and it runs against real binaries (`sh`, `echo`, `cat`, `false`, `sleep`) rather than mocks — `invoke`'s contract *is* process behaviour, so mocking it would test nothing. `cfg_with` builds a minimal valid `LoopConfig` through `loopsmith_core::parse_str` and overwrites `providers.providers` / `providers.cascade`; use it for any new cascade case.\n\nThe cases worth not breaking: fall-through past an unavailable provider, fall-through past an erroring one, exhaustion naming every attempt, pinning bypassing the cascade, tiers selecting different cascades, and — critically — `a_provider_with_miss
