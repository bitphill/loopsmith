var PAGES = {"cli-command-surface":"# CLI Command Surface\n\n# CLI Command Surface\n\nThe `loopsmith` binary crate (`runtime/crates/loopsmith-cli`, package name **`loopsmith`**, not `loopsmith-cli` — so `cargo install loopsmith` matches the command it installs). Everything a user can type lives here; everything a user can't type lives in the eight workspace libraries this crate depends on.\n\nThe design rule for the whole module: **this crate parses, routes, prints, and decides exit codes. It does not decide anything else.** Config semantics live in `loopsmith-core`, scheduling math in `loopsmith-graph`, verdicts in `loopsmith-gate`. When a command body grows a decision that another crate should own, that's the smell to act on.\n\n## Layout\n\n| File | Responsibility |\n|---|---|\n| `src/main.rs` | Entry point. Parses, dispatches, prints `error: {e}` to stderr, returns an `ExitCode`. Nothing else. |\n| `src/cli.rs` | The clap grammar — `Cli`, `Command`, `SkillsAction`. No command bodies. |\n| `src/cmd/mod.rs` | `dispatch()` plus the four helpers every command shares. |\n| `src/cmd/*.rs` | One module per subcommand, each exposing `execute(...)`. |\n| `src/scaffold.rs` | `loopsmith new`'s file materialisation, path guards, and generated launchers. |\n| `src/logging.rs` | The plain-text run log and the `Recorder` that keeps it in sync with the sled ledger. |\n| `src/run/`, `src/schedule.rs`, `src/worktree.rs`, `src/permissions.rs`, `src/judgment.rs` | Supporting machinery the command bodies call into. |\n\nThe split between `main.rs` and `cli.rs` is deliberate and worth preserving: the argument grammar for sixteen commands is readable in one sitting only if no command bodies are interleaved with it.\n\n## The three layers\n\n```mermaid\nflowchart LR\n    main[\"main.rs<br/>Cli::parse()\"] --> dispatch[\"cmd::dispatch\"]\n    dispatch --> cmdmod[\"cmd/*::execute\"]\n    cmdmod --> helpers[\"config_dir · open_store<br/>report_outcome\"]\n    cmdmod --> libs[\"loopsmith-core · -gate<br/>-graph · -memory · …\"]\n    dispatch --> code[\"ExitCode\"]\n    main --> code\n```\n\n`dispatch` is one flat `match` over `Command`. It destructures the clap variant and hands the fields to the module's `execute`; `Command::Skills` nests a second match over `SkillsAction`. There is no trait, no registry, and no dynamic dispatch — adding a command means adding a variant and a match arm, and the compiler tells you if you forgot the second one.\n\n## The command contract\n\nEvery command body returns `Result<ExitCode, String>` and **never calls `std::process::exit`**. Two consequences:\n\n- A command is callable from a test without tearing down the process.\n- Exit codes are decided in exactly one place — the `match` in `main`, where `Err` becomes `ExitCode::FAILURE` after printing `error: {e}`.\n\nExit semantics differ per command and are load-bearing for anyone scripting around them:\n\n| Command | Non-zero when |\n|---|---|\n| `run`, `resume` | `!out.stop.is_success()` — via `cmd::run::exit_code`, so a scheduler or CI step notices without parsing output |\n| `gate` | the verdict is not satisfied |\n| `validate` | `report.has_errors()`, or `--strict` and any warnings |\n| `skills install` | any section-J spec failed to install |\n| `doctor` | **never.** Advisory by design — reporting a constraint is not the same as the machine being unusable, and a non-zero exit here would fail a CI step that was working fine |\n| everything else | only on `Err` |\n\n## Shared helpers (`cmd/mod.rs`)\n\nFour functions, each solving a problem that bit once:\n\n- **`config_dir(config) -> PathBuf`** — the directory holding the config. `Path::parent()` returns `Some(\"\")` for a bare `loop.yaml`, and an empty path isn't a usable working directory (spawning into it fails with ENOENT), so this normalises to `.`. This is the loop root for every purpose: state, logs, worktrees, detector resolution.\n- **`config_file_name(config) -> String`** — just the file name, for the generated scripts. They `cd` into the loop directory first, so a relative name is what they want.\n- **`open_store(config)`** — opens the sled store at `config_dir(config)/state`. Every command that reads persisted state goes through this rather than joining `state` by hand.\n- **`report_outcome(&RunOutcome)`** — the end-of-run block: run id, iteration count, `stop.describe()`, spend (marked `(estimated: no provider reported usage)` when no provider reported), proposal count, a per-target `SATISFIED`/`not satisfied` table, the log path, the export path, and — when the run didn't meet its bar — the exact `loopsmith ledger <config> <run-id>` line to type next. Shared by `run`, `resume`, and `watch` so all three read identically.\n\n## Command groups\n\n### Scaffolding — `new`\n\n`cmd/new.rs` is thin; `scaffold.rs` does the work. The flag surface exists to make the command scriptable: `--config-file`, `--config-stdin` (mutually exclusive, enforced by both clap's `conflicts_with` and `read_provided`), and `--markdown` to force the stdin grammar. **Nothing in this path blocks on a prompt** — a command that waits for a keypress cannot be run from a Makefile or from the agent setting the loop up for you.\n\n`read_provided` picks the grammar from the file's own extension via `loopsmith_core::is_markdown`, never from content: a stray `#` heading silently reinterpreting someone's YAML is a worse failure than a wrong extension.\n\nThe success output branches on `Os::detect().is_windows()` twice — once for `set` vs `export` in the key-export hint, once to name `run.cmd`/`resume.cmd` rather than `run.sh`/`resume.sh`. Both branches are cheap and both are the difference between a first-run instruction that works and one that sends the reader to a file their shell can't execute. Paths are printed with `args.path.join(run).display()`, not interpolated with a `/`, so the separator is the host's.\n\n### Inspection — `validate`, `convert`, `plan`, `providers`, `permissions`\n\nPure reads. `plan` loads the config, calls `loopsmith_graph::plan`, and prints waves, critical path, total cost, parallel fraction `p`, chosen concurrency, and predicted speedup against the infinite-worker ceiling — then calls `loopsmith_graph::unisolated_parallel_writers` and warns about builder nodes that may run concurrently without worktree isolation. `providers` maps each declared provider through `loopsmith_provider::availability` and prints either the command or `av.why_not()`.\n\n### Execution — `run`, `resume`, `watch`\n\nAll three converge on `crate::run::execute` with a `RunOptions`:\n\n```mermaid\nflowchart TD\n    run[\"cmd::run::execute<br/>resume: false\"] --> start[\"cmd::run::start\"]\n    resume[\"cmd::resume::execute<br/>resume: true\"] --> start\n    start --> lv[\"core::load_validated\"]\n    start --> exec[\"run::execute\"]\n    watch[\"cmd::watch::execute<br/>poll loop\"] --> exec\n    exec --> report[\"report_outcome\"]\n```\n\n`cmd::run::start` is the shared body — load *validated* (not just loaded), open the store, execute, report. `resume` is the same operation with a different starting checkpoint, which is why it is four lines. Run ids default to `run-{now_ms}`.\n\n`watch` is the command that makes a loop live for weeks:\n\n- It refuses up front if `schedules` is empty or entirely `Trigger::Manual` — that watcher would sleep forever, and saying so beats hanging.\n- Poll cadence comes from `schedule::poll_interval(&cfg.schedules)`; cron is matched in UTC, and the banner says so.\n- The `Watcher` is constructed with `Watcher::ignoring(vec![format!(\"{}-success\", cfg.name)])`. Without that, a run meeting its bar writes the success export into the loop directory, a `file_change` trigger sees it, and the loop restarts itself forever.\n- Goal state is re-read from the store on every poll rather than cached, so a `goal_satisfied` trigger notices a run started elsewhere.\n- **A failed run must not kill the watcher** — the `Err` arm prints `run failed: {e}` and continues. That is the difference between a scheduler and a one-shot.\n\n### Observation — `status`, `ledger`, `proposals`, `gate`\n\n`status` prints the gate's current rulings plus the checkpoint iteration. `ledger` tails the append-only entries, `--limit` applied with `saturating_sub` so a short ledger doesn't panic.\n\n`gate` evaluates once against a working tree using `run::collect_evidence(&cfg, workdir, Some(workdir.join(\"metrics.json\")), vec![])` — the empty judgment vector is the point: a one-shot check has no judge run behind it, so subjective checks correctly report that no judgment was recorded rather than silently passing.\n\n`proposals` reports staleness but **never deletes**. A proposal records what the loop wanted at a moment; the moment went stale, not the record, and the record is still the only account of why the loop asked. `age()` renders coarse buckets (`just now` / `Nm ago` / `Nh ago` / `Nd ago`) because nobody has ever wanted the exact millisecond.\n\n### Environment — `doctor`, `prune`, `mcp`\n\n`doctor` is the module's most opinionated command. It probes rather than infers: `Platform::detect()` for OS, userland, bash version, `/bin/sh` identity, and `scheduler()`; `loopsmith_util::which` for `git`, `sh`, `sed`, `awk`, `curl`. The `sed -i` flags are rendered with empty arguments shown as `''` — that empty argument *is* the difference between the GNU and BSD invocations, and a report that hides it claims the two are the same.\n\nGiven a config, `config_notes` additionally resolves every `Detector::Script` command: a name containing `/` is joined onto the loop root, a bare name goes through `which`. Missing, non-existent, and non-executable each get their own message (the last one hands you the `chmod +x` line). Catching this here beats discovering it as a detector error on the first gate evaluation.\n\n`prune` walks `cfg.graph.nodes` filtered to `isolated`, and uses `worktree::create(&root, &node.id, \"prune\")` as a *probe* — if the result matches `Isolation::Worktree { .. }` there is something to remove, so it calls `worktree::remove`.\n\n`mcp` opens a store at `--state` (default `state`) and serves `loopsmith_mcp::Server` over locked stdin/stdout.\n\n### Ecosystem — `skills`\n\nFive subcommands under one `SkillsAction`. `list` filters out `~/.claude/skills` unless `--all`, since the global directory is dozens of entries and drowns the loop's own. `search` queries claudemarketplaces.com and `npx skills find`, and each source degrades to `unavailable: {e}` independently — one being down doesn't cost you the other — then closes with \"Nothing was installed\" and the acquire line. `acquire` and `install` both end by telling you quarantined skills wait for a human, because a sub-agent runs with whatever your permission grant allowed. `scores` ranks by gate outcomes and closes with the config's own `min_trials`: fewer than that is not evidence.\n\n## Scaffolding internals (`scaffold.rs`)\n\n### `guard_path` — where a loop may not go\n\nCalled first in `scaffold()`, before any directory is created. It refuses an empty path, a filesystem root, the home directory itself, and — the load-bearing one — **anywhere inside the loopsmith installation**. `install_root()` walks up from `current_exe()` looking for a directory that has both `config/loop.schema.json` and `runtime/Cargo.toml`, which covers `cargo run`, an installed `target/release` binary, and a symlink into the repo. A loop edits files, clones sub-agents, and writes state; pointing one at the checkout that runs it lets a loop modify its own runtime. The refusal message includes a working alternative (`--path ~/loops/<name>`), and a test asserts that it does.\n\n`absolutize()` handles paths that don't exist yet — `canonicalize` first, then absolute-as-is, then joined onto the cwd.\n\n### `binary_path` — deliberately not canonicalized\n\nThe generated launchers pin an absolute path to the binary, because cron, launchd, and Task Scheduler inherit neither a shell's `PATH` nor its working directory. But an *already-absolute* `current_exe()` is written down **unresolved**. Package managers install behind a stable symlink into a versioned directory (Homebrew: `/usr/local/bin/loopsmith` → `/usr/local/Cellar/loopsmith/0.1.2/bin/loopsmith`); resolving it pins the version, and every loop created before an upgrade gets a dead launcher the moment that Cellar directory is replaced. A *relative* `current_exe` still gets canonicalized. Both scripts also carry a PATH fallback that says exactly what happened if the pin ever goes stale.\n\n### Generated launchers\n\nBoth flavours are written **on every platform, unconditionally**. The premise of the portability design is that a loop directory outlives the machine that made it; `cmd.exe` cannot run a `#!` script and no POSIX shell will run a `.cmd`, so the pair is the only arrangement that survives a copy.\n\n`script_header` emits `#!/bin/sh`, not bash — macOS still ships bash 3.2.57, so anything needing bash 4 syntax fails on the most common developer machine there is. It's built from a raw string literal, not an escaped one: `\\` line continuations eat the next line's leading whitespace and the script reaching disk came out flat.\n\n`cmd_header` carries the hardest-won comment in the crate. Batch exit codes under `setlocal` have two traps:\n\n1. The implicit `endlocal` at end-of-file **restores the errorlevel `setlocal` saved**, so a bare `exit /b 127` reports 0.\n2. `endlocal & exit /b 127` fixes that at top level but not inside a nested `if ( … )` block — which is where the failing one lived.\n\nThe resolution: exactly one `exit /b` per launcher, on the last line (`CMD_FOOTER`), reached by every path. Each branch sets `CODE` and falls through to `:loopsmith_done`. `enabledelayedexpansion` and `!ERRORLEVEL!` are used because a parenthesised block is parsed as a unit before it runs, so `%ERRORLEVEL%` inside one expands to the value from before the block.\n\n`crlf()` converts line endings on the way out: older `cmd.exe` reads a trailing `\\n` as part of the last token, turning `exit /b 2` into an unknown command with no useful message.\n\n### Templates and ordering\n\nThe four harness files are `include_str!`-compiled from `templates/` — `mcp.template.json`, `permissions.template.json`, `compat.template.sh`, `marketplaces.json`. That makes a new loop self-contained and makes it impossible for `new` to touch the checkout it was launched from. They live inside the crate rather than the repo's `config/` for a packaging reason: a published tarball holds only its own directory, so an `include_str!` reaching above the crate root compiles locally and fails `cargo package --verify`. The same constraint shapes `Cargo.toml`'s anchored `include` list — and the leading slash on `/README.md` matters, since an unanchored `README.md` would also match `tests/README.md`.\n\nA supplied config is **parsed before anything is written**. A loop directory holding an unparseable config is worse than no directory; `an_unparseable_supplied_config_writes_no_directory_contents` locks that in.\n\nThe starter config from `starter_config()` ships with `pre_execution` steps set `done: false`, so **it deliberately fails validation as generated**. That refusal is the feature — the manual run is the spec. Two tests guard the pair: it must have errors as shipped, and must have none once every step is flipped to `done: true`.\n\n## Run logging (`logging.rs`)\n\nThe sled ledger is durable and queryable, but you can't `tail -f` a database, and after an unattended run finishes at 4am the first thing anyone wants is a file to scroll.\n\n`RunLog::open(root, run_id, verbose)` opens `<root>/logs/<sanitized-run-id>.log` — `logs/`, deliberately **not** `state/`, because sled owns that directory and the watcher ignores everything inside it. On failure it degrades to a no-op with `path() == None`: a full disk is a reason to lose the log, not a reason to kill a run doing useful work.\n\n`sanitize()` maps anything outside `[A-Za-z0-9_-]` to `-` and empty to `run`. Run ids come from a timestamp today, but `--run-id` reaches here unchecked, and a path separator in a filename is how a log ends up written somewhere nobody looks. `sanitize(\"../../etc/passwd\") == \"------etc-passwd\"` is a test.\n\n`format_utc` uses the same hand-rolled `civil_from_unix` the cron matcher uses — UTC throughout, because deriving a local offset in a multithreaded process is unsound on Unix, and a scheduler quietly an hour off twice a year is worse than one honestly in UTC.\n\n`Recorder<'a, S: Store>` bundles store + run id + log, and exposes one method, `entry(iteration, kind, detail, node_id)`, which writes to both. That single choke point is what keeps the ledger and the log from disagreeing about what happened. Newlines in `detail` are replaced with spaces so one event is always one line — `grep` and eyeballs both work, and a test asserts a multi-line detail produces exactly one line.\n\nCallers: `run::execute`, `run::install_default_skills`, and `run::dispatch::ensure_skills`.\n\n## Dependency direction\n\n```\nloopsmith (this crate)\n  ├── loopsmith-core       config model, load / load_validated / validate / parse_str / parse_md / is_markdown\n  ├── loopsmith-memory     open, SledStore, Store trait, LedgerEntry, score_skills, now_ms\n  ├── loopsmith-gate       evaluate\n  ├── loopsmith-graph      plan, unisolated_parallel_writers\n  ├── loopsmith-provider   availability, starter_providers\n  ├── loopsmith-skills     list_installed, acquire, install_default, search_marketplace, marketplace::*\n  ├── loopsmith-mcp        Server\n  └── loopsmith-util       which, is_executable, now_ms, platform::{Platform, Os, Userland, home_dir}, testing::*\n```\n\nArrows point one way only. No library depends on this crate; nothing here is re-exported as an API. `loopsmith-util` is pulled in twice — once normally, once with `features = [\"testing\"]` under `[dev-dependencies]` for `temp_dir`, `temp_path`, and `cleanup`.\n\n## Adding a subcommand\n\n1. Add a variant to `Command` in `cli.rs`, with doc comments — clap renders them as the help text, and they are the primary user-facing description of the command.\n2. Create `src/cmd/<name>.rs` with `pub fn execute(...) -> Result<ExitCode, String>`, and a `//!` header stating what the command is for.\n3. Add `pub mod <name>;` to `cmd/mod.rs` and a match arm in `dispatch`.\n4. Use `config_dir` / `open_store` rather than joining `state` yourself.\n5. Decide the exit code deliberately: is a \"bad\" result a script-visible failure (`gate`, `validate`) or advisory (`doctor`)? Both are defensible; pick one on purpose.\n\n## Gotchas\n\n- **Don't add a prompt.** Several commands are explicitly designed to be runnable from a script, a Makefile, or an agent. Interactivity would break that silently.\n- **`load` vs `load_validated`.** Inspection commands (`plan`, `gate`, `providers`, `prune`, `skills *`, `doctor`) use `load`; anything that starts a run (`run`, `resume`, `watch`) uses `load_validated`. Don't cross the streams — validating in `doctor` would make a diagnostic command refuse to diagnose a broken config, which is when you need it most.\n- **Path joins use components, not slash literals.** `Path::new(\".claude\").join(\"skills\")`, not `\".claude/skills\"`. A forward slash inside a `join` is a path on Unix and a filename component that merely happens to work on Windows, and the two stop agreeing the moment the name goes anywhere but `create_dir_all`.\n- **Secrets never enter this crate's data flow.** `requires_env` names variables that must *exist*; loopsmith never reads their values, so a key cannot reach a prompt, a log, or the ledger. Keep it that way — let the provider command expand them itself.\n- **Section-count drift in help text.** `cli.rs`'s help for `validate` and `cmd/validate.rs`'s doc comment both say \"the A–H model\", while the README, `new`'s output, and the generated per-loop README say A–J. The model has ten sections; the two `validate` strings are stale and are what a user sees in `--help`.","distribution-installers":"# Distribution & Installers\n\n# Distribution & Installers\n\nEverything that gets a `loopsmith` binary onto a machine that does not have one. Nothing in this module is part of the runtime — the Rust code under `runtime/` never imports any of it — but every user meets this module before they meet anything else, so its failure modes are the ones that get reported as \"loopsmith doesn't work.\"\n\nThere are four independent ways in, and they split cleanly into two families:\n\n| Path | Entry point | Where the binary comes from |\n|---|---|---|\n| Source install (Linux/macOS/BSD) | `install.sh` | `cargo build --release` on the user's machine |\n| Source install (Windows) | `install.bat` → `installers/install.ps1` | same |\n| npm | `npm i -g @bitphill/loopsmith` | prebuilt GitHub release asset, at `postinstall` |\n| PyPI | `pip install loopsmith-cli` | prebuilt GitHub release asset, on **first run** |\n| Homebrew | `brew install bitphill/loopsmith/loopsmith` | `cargo install` from the tagged source tarball |\n\ncrates.io (`cargo install loopsmith`) is the fallback named in every error message on this module's paths; it needs nothing from here.\n\n## The two invariants\n\nRead these before changing anything, because most of the odd-looking code exists to hold one of them up.\n\n**1. A downloaded binary is verified before it is executed.** Both prebuilt paths fetch the release's `SHA256SUMS`, find the line ending in this host's asset name, and compare it to a SHA-256 of the bytes actually received. A mismatch or a missing line aborts. The release workflow publishes `SHA256SUMS` for exactly this reason — a postinstall script that pipes an unverified download onto disk is a supply-chain hole with a progress bar.\n\n**2. The source installers never install a package manager.** `installers/deps.sh` and `installers/deps.ps1` will use apt/dnf/yum/pacman/apk/zypper/brew/pkg, or winget/choco, whichever is present — but a host with none of them gets a message naming the packages to install by hand, not a bootstrap. A machine without a package manager is a decision somebody made.\n\n## Source installers\n\n```mermaid\nflowchart TD\n    A[install.sh] --> B[installers/deps.sh]\n    C[install.bat] --> D[installers/install.ps1]\n    D --> E[installers/deps.ps1]\n    B --> F[cargo build --release]\n    D --> F\n    F --> G[\"$LOOPSMITH_HOME/bin/loopsmith\"]\n    G --> H[symlink or user PATH]\n```\n\n`install.sh` requires bash; the loop scripts it eventually helps you generate are POSIX `sh`. That asymmetry is deliberate — an installer runs once on a machine you are sitting at, a loop script runs unattended on a machine nobody chose.\n\nShared behaviour across `install.sh` and `install.ps1`:\n\n- **Idempotent.** Re-running is how you upgrade. Both truncate `$LOOPSMITH_HOME/install.log` at the start and tee everything into it.\n- **A checkout beside the script wins.** If `runtime/` exists next to the installer, it builds that; otherwise it shallow-clones `$LOOPSMITH_REPO_URL` at `$LOOPSMITH_BRANCH` into `$LOOPSMITH_HOME/src`. This is what makes `git clone && ./install.sh` install the code you just cloned rather than whatever `main` happens to be.\n- **They re-export `~/.cargo/bin` into their own process.** rustup writes its PATH line to `~/.profile`, which zsh never reads, so a machine with cargo installed can still not see cargo. Both installers prepend it themselves and then hard-fail if `cargo` still is not resolvable.\n- **They verify the build output exists** rather than trusting cargo's exit code alone (`install.ps1` checks `$LASTEXITCODE` explicitly, since PowerShell does not propagate a native command's failure through the pipeline).\n\nEnvironment overrides: `LOOPSMITH_HOME`, `LOOPSMITH_REPO_URL`, `LOOPSMITH_BRANCH`, and on POSIX only `LOOPSMITH_BIN_DIR` (default `/usr/local/bin`).\n\nWhere they differ is the last step. `install.sh` symlinks into `$BIN_LINK_DIR` only when it is writable or the user is root, and otherwise prints the `export PATH=...` line to add by hand. `install.ps1` edits the **user** PATH via `[Environment]::SetEnvironmentVariable(..., 'User')` — no elevation, and a tool installed into a home directory has no business editing a machine-wide setting. It also patches `$env:PATH` for the current process so the closing \"next steps\" commands are runnable immediately.\n\n`install.bat` is a five-line shim. It exists so the install is one word rather than an execution-policy incantation: it checks that `powershell` is on PATH (exit 127 if not) and invokes `install.ps1` with `-ExecutionPolicy Bypass` scoped to that one process, which changes nothing about the machine.\n\n### The dependency scripts\n\nBoth `deps.sh` and `deps.ps1` are safe to run standalone and install nothing already present. They resolve `git` (and `curl` on POSIX), then rustup with the minimal profile, then check the toolchain version: below **1.75** — the declared `rust-version` — they warn and suggest `rustup update stable`, because an older toolchain fails deep inside a dependency with a message about a syntax feature, which is not a useful clue.\n\nTwo platform-specific notes worth keeping:\n\n- `deps.sh` deliberately installs **nothing** for pkg-config or OpenSSL headers. loopsmith links no C libraries and never uses TLS in-process — providers are external commands — so the usual `libssl-dev` incantation would be cargo-culted weight.\n- `deps.ps1` checks for `link.exe` at the end and, if absent, points at `Microsoft.VisualStudio.2022.BuildTools` with the \"Desktop development with C++\" workload. The MSVC Rust toolchain needs it, and a missing linker is a much worse failure to debug than a warning.\n\n## Prebuilt-binary packages\n\nBoth the npm and PyPI packages are thin launchers around the same six release assets. Neither is a library — there is nothing to `require()` or `import`; the exit codes are the API.\n\n### Target resolution\n\nSix targets are published: `x86_64-unknown-linux-{gnu,musl}`, `aarch64-unknown-linux-gnu`, `{x86_64,aarch64}-apple-darwin`, `x86_64-pc-windows-msvc`. Both packages implement the same table independently, and both have to solve the same problem — telling glibc from musl, since a glibc build on musl dies with a bare `not found` that names no missing library.\n\n- **npm** (`resolveTarget` → `isMusl` in `npm/scripts/install.js`): runs `ldd --version`. musl's `ldd` has no such flag — it prints usage plus \"musl libc\" to stderr and exits non-zero, where glibc answers and exits 0 — so `isMusl` returns true only when the thrown error's stderr matches `/musl/i`.\n- **PyPI** (`_target` in `pypi/src/loopsmith_cli/__init__.py`): uses `platform.libc_ver()`, treating an empty result as musl, and `platform.machine()` rather than `platform.processor()` (the latter is empty on most Linux distributions and returns marketing strings on Windows).\n\nAn unrecognised host is not an error in npm — `main` warns and returns, leaving `bin/loopsmith.js` to report at run time — while Python raises `ResolveError`, which `__main__.main` turns into exit 127. Note that `win32`/`arm64` resolves to nothing in either implementation even though `package.json` declares `cpu: [\"x64\", \"arm64\"]`; those hosts fall through to the build-from-source message.\n\n### npm: fetch at install, fail soft\n\n`npm/scripts/install.js` runs as `postinstall`. `main` resolves the target, downloads the asset and `SHA256SUMS` concurrently via `fetchBuffer`, compares digests, then extracts the single expected member with the system `tar` (`tar.exe` has shipped with Windows 10 1803 and reads zips), renames it to `bin/loopsmith-bin` (`bin/loopsmith.exe` on Windows) and chmods it 0755. The temp archive is removed in a `finally`.\n\nThe `.catch` at the bottom sets `process.exitCode = 0` on purpose. A flaky download should not hard-fail an `npm install` that may be installing twenty other packages; `bin/loopsmith.js` — the declared `bin` entry — reports a clear error at run time if the binary never landed.\n\n### PyPI: fetch at first run, cached\n\nThe wheel deliberately does **not** download at install time. A wheel that fetches during `pip install` breaks in every environment that installs without a network and runs with one — CI images, Docker build stages, locked-down build hosts — and surfaces as an install error for a package the user has not tried to use yet.\n\nInstead `loopsmith = \"loopsmith_cli.__main__:main\"` is the console script, and the fetch happens on demand:\n\n```mermaid\nflowchart LR\n    M[\"__main__.main\"] --> E[ensure_binary]\n    E --> C[cache_dir]\n    E --> T[_target]\n    E --> D[_expected_digest]\n    D --> R[_read]\n    E --> R\n    E --> X[_extract]\n    M --> P[\"os.execv / subprocess.call\"]\n```\n\n`cache_dir()` is `$LOOPSMITH_HOME/bin/<version>/` (default `~/.loopsmith`), versioned so an upgrade re-fetches rather than reusing a stale binary. `ensure_binary` returns early if that path already exists; otherwise it verifies, extracts to a `TemporaryDirectory`, and `shutil.move`s the result into place.\n\nThree details in this file exist because of specific failure modes:\n\n- **`_extract` pulls one named member**, and rejects it if the name does not match exactly or the entry is a symlink/hardlink. A checksum match proves provenance, not safety — a path-traversing entry only needs one careless `extractall`.\n- **There is no \"reuse a `loopsmith` already on PATH\" shortcut.** pip installs *this package's* console script as `loopsmith`, so `shutil.which(\"loopsmith\")` would find the very script that is running; `exec`ing it re-enters `ensure_binary` forever, presenting as a hang with no output. `main` keeps a belt-and-braces guard comparing the resolved binary against `sys.argv[0]` and refuses rather than looping.\n- **POSIX uses `os.execv`, Windows uses `subprocess.call`.** loopsmith is long-running and interactive; replacing the process means the shell's Ctrl-C reaches the real binary and the exit code arrives unchanged. Windows has no process-replacing exec, so that branch wraps and translates `KeyboardInterrupt` to 130.\n\n`pypi/build.sh` builds sdist + wheel (`--upload` publishes with `PYPI_TOKEN`). It creates a throwaway `.venv-build` rather than calling `python3 -m build` directly: the interpreter first on PATH is not a stable fact, Homebrew can put a fresh `python3` ahead of the one whose site-packages holds `build`, and Homebrew's Python is PEP 668 externally-managed so `pip install --user` into it is refused outright. `pick_python` scans an explicit candidate list so the choice does not depend on PATH order.\n\n### Homebrew\n\n`Formula/loopsmith.rb` is the source of truth; it is mirrored into the `bitphill/homebrew-loopsmith` tap at release time, which is what makes `brew install loopsmith` resolve by bare name after tapping. Nothing in it is tap-specific, so the same file can go to homebrew-core when that PR is worth filing.\n\nIt builds from source (`depends_on \"rust\" => :build`), `cd`s into `runtime` — the cargo workspace root is not the repository root — and installs the `crates/loopsmith-cli` package.\n\nThe `test do` block is the module's only real end-to-end assertion, and it is chosen carefully: `--version` must echo the formula's `version`; `doctor` must print `platform` and `userland` and must stay advisory so a constrained CI container cannot fail it; and `new` followed by `validate` must **exit 1** with `pre_execution` in the output. That refusal is the product, so a build where it stops happening is a broken build.\n\nThe `sha256` is the one value nothing can derive locally. The header comment documents the trap in detail: codeload rate-limits unauthenticated archive downloads, `curl -sL` reports success while writing the error body, and hashing that yields a checksum no install can ever match. Check the size and `gzip -t` before trusting a digest, and do not substitute `gh api .../tarball/<ref>` — it mangles binary output and returns a 199-byte fragment for every ref.\n\n## Version propagation\n\n`runtime/Cargo.toml`'s `[workspace.package] version` is the single source of truth. `tools/sync-version.sh` rewrites everything derived from it:\n\n| Target | What is rewritten |\n|---|---|\n| `runtime/Cargo.toml` | workspace path-dep `version = \"...\"` pins |\n| `npm/package.json` | `\"version\"` |\n| `pypi/pyproject.toml` | `version` |\n| `pypi/src/loopsmith_cli/__init__.py` | `__version__` (drives the release URL and cache dir) |\n| `Formula/loopsmith.rb` | the tag in the `archive/refs/tags/v…` URL |\n| `npm/README.md`, `pypi/README.md`, `runtime/crates/*/README.md` | tag-pinned logo URL and START-HERE link |\n\n`--check` is the CI mode: it reports drift and exits 1 instead of writing. The script builds each edit in a temp file and `mv`s it, because `sed -i` spelling differs between GNU and BSD.\n\nTwo constraints it encodes: registry READMEs are immutable once published, so their asset URLs are pinned to the release tag rather than `main`; and the formula's `sha256` is explicitly *not* synced — it is the digest of a tarball GitHub generates after the tag exists, so it stays manual and the closing output reminds you with the exact commands.\n\nThe script lives in `tools/`, not `scripts/`: that name is reserved for a loop's own detector scripts, and the repository ships none on purpose so the `pre_execution` refusal keeps its teaching value.\n\n## Working on this module\n\n**Release order matters.** Bump `runtime/Cargo.toml` → run `tools/sync-version.sh` → tag and let the release workflow publish assets plus `SHA256SUMS` → compute and paste the formula `sha256` → publish npm and PyPI. Both prebuilt launchers derive their download URL from their own version string, so publishing a package before the matching release exists produces a 404 at install (npm, soft-fail) or first run (PyPI, exit 127).\n\n**Adding a platform** means touching five places: the release workflow's build matrix, `resolveTarget` in `npm/scripts/install.js`, `_target` in `pypi/src/loopsmith_cli/__init__.py`, and the platform tables in both `npm/README.md` and `pypi/README.md`. The two resolvers are intentionally independent implementations of the same table — there is no shared spec file, so they drift silently unless changed together.\n\n**Raising the Rust floor** means `runtime/Cargo.toml`'s `rust-version` plus the hardcoded `75` comparison in both `installers/deps.sh` and `installers/deps.ps1`.\n\n**Testing an installer** is easiest with `LOOPSMITH_HOME=$(mktemp -d)` and, for the PyPI launcher, the same variable to force a cold fetch. To exercise the clone branch of `install.sh` rather than the checkout branch, run the script from a directory with no sibling `runtime/`.","evolution-perturbation":"# Evolution & Perturbation\n\n# Evolution & Perturbation\n\n`runtime/crates/loopsmith-cli/src/run/`\n- `evolve.rs` — what the loop learns about its own tooling, written down for a human\n- `perturb.rs` — what the loop varies when it has stopped moving but still has budget\n\nBoth modules exist to let a long-running loop react to its own failure. Both are built around the same hard boundary: **they change method, never criteria.** Nothing in either file can mutate `LoopConfig`, and nothing in either file can move a target from unsatisfied to satisfied. The gate owns that ruling; these modules can only produce advice (`evolve`) or vary how the next iteration does its work (`perturb`).\n\nRead that constraint as a design invariant, not a convention. Several odd-looking choices below — why `propose_reshape` emits a YAML fragment instead of applying it, why `parse_choice` throws away anything off the menu — are it being enforced.\n\n---\n\n## Part 1: `evolve.rs` — evidence and proposals\n\n### What it does\n\nOver a run, `evolve` accumulates two kinds of evidence:\n\n1. **Skill trials** — every dispatch that used a sub-agent gets paired with the gate outcome that followed it (`record_trials`).\n2. **Run behaviour** — nodes that burned their revision budget, checks whose detectors are broken, exploration that is configured but switched off.\n\nOnce per iteration, `write_proposals` turns that evidence into `Proposal` rows in the store and one `LedgerKind::ProposalWritten` entry per proposal. A human reads them and decides.\n\n### Entry points\n\nAll four are called from `execute` in `src/run/mod.rs`:\n\n| Function | Called when | Returns |\n|---|---|---|\n| `next_candidate(cfg, trials)` | choosing what to attach to a builder | `Option<String>` — a candidate skill to trial |\n| `harvest_judgments(cfg, rec, iteration)` | after the wave has run | `Vec<Judgment>` from this iteration's judge nodes |\n| `record_trials(rec, iteration, episodes, node_skills, verdicts)` | after the gate has ruled | `()` — writes `SkillTrial` rows |\n| `write_proposals(cfg, rec, iteration, observed)` | end of iteration | count of proposals written |\n\n### `next_candidate` — exploration order\n\nGated on `cfg.skills.explore` and a non-empty `cfg.skills.explore_candidates`. It excludes anything already in the graph's `skills` lists (no point \"discovering\" what's configured), excludes anything that already has `cfg.skills.min_trials` behind it, and picks the **least-tried** of what's left.\n\nThe `min_by_key` on trial count is the load-bearing part. Without it, candidates would be tried in `explore_candidates` order and the first name would collect all the evidence while the rest stayed at zero trials — never enough to earn or lose a proposal.\n\n### `record_trials` — scoping the verdict\n\nTwo decisions worth understanding before you touch this function:\n\n**Scoring is per-node, not per-loop.** A node's skills are scored only against the targets in that node's `goals`. If you widened this to all verdicts, every skill in the graph would share one pass rate and the ranking would carry no signal. Nodes whose goals have no verdict are skipped entirely.\n\n**`pass_rate` and `satisfied` measure different things.** `pass_rate` is the mean of `blocking_pass_rate()` across the relevant verdicts (clamped to `0.0..=1.0`); `satisfied` requires *every* relevant verdict to be satisfied. A skill can have a good pass rate and never a satisfied trial.\n\n`RanNode` carries `tokens` because cost is part of the proposition — a skill that lifts the pass rate while tripling the bill is not the same recommendation as one that does it for free. The struct's doc comment records why it's a struct: as a four-tuple threaded through three functions there was nowhere to put the token count, and `SkillTrial.tokens` was permanently `None` as a result. If you find yourself wanting to pass \"just one more thing\" through here, add a field.\n\n### `harvest_judgments` — deriving the builder provider\n\nFilters this iteration's episodes down to nodes with `Role::Judge`, then for each one resolves the *builder's* provider by walking `node.depends_on` and finding the matching episode. That provider id is what `judgment::parse` measures independence against — a judge running on the same provider as the builder it reviewed is a weaker signal. An unresolvable dependency yields an empty provider string rather than skipping the judgment.\n\n### The proposal desk\n\n`Desk` is a private per-iteration helper. It holds the `Recorder`, the iteration number, and `said`: the set of `\"{kind:?}:{subject}\"` keys already present in the store for this run. `Desk::write` checks that set and returns `0` instead of writing a duplicate.\n\nThat set is snapshotted when `write_proposals` builds the desk, and `write` takes `&self` — so dedupe is **across iterations**, not within one call. Today that's fine because each `propose_*` function iterates distinct subjects, but two proposals of the same kind and subject inside a single iteration would both be written. Keep that in mind if you add a proposal source that can emit the same subject twice.\n\n`write` returns `usize` (1 or 0) so callers can sum instead of each threading a mutable counter. Failed store writes return `0` and are otherwise silent — a proposal is advice, and losing one is not worth failing an iteration over.\n\nExpiry comes from `Proposal::with_default_expiry()`, derived from the `ProposalKind`, deliberately not a parameter. Adding a new kind therefore forces a decision about how long its evidence stays true.\n\n### The four proposal sources\n\n`write_proposals` sums four independent producers. The first three read the run's own behaviour; only the fourth needs the accumulated trial record.\n\n- **`propose_reshape`** (`ProposalKind::ReshapeGraph`) — for each node in `Observed::exhausted_nodes`, i.e. nodes that hit `cfg.stop_gates.max_revisions_per_node` with goals unsatisfied. The reasoning: this is evidence about the *graph*, not the node — one unit of work was asked to do something it cannot do in a single step. The patch is a suggested split (`{node_id}-prepare` as a `researcher` dependency), offered as text for a human to apply.\n\n- **`propose_criteria_changes`** (`ProposalKind::ChangeCriteria`) — scans blocking, failing checks whose `evidence` starts with `\"detector error\"`. A detector that cannot run fails closed forever, so no amount of node work will change the answer. This is the one place the module talks about criteria at all, and it still only files a proposal.\n\n- **`propose_try_skill`** (`ProposalKind::TrySkill`) — fires only when `explore` is **off**, candidates are listed, and at least one target is unsatisfied. Suggests the first unconfigured candidate with a `skills:\\n  explore: true` patch. Exploration costs real dispatches, which is why it's off by default; when the run is failing anyway, saying \"there is something here you have switched off\" is worth the noise.\n\n- **`skill_proposals`** (`AdoptSkill` / `DropSkill`) — calls `loopsmith_skills::recommend(&configured, &trials, cfg.skills.min_trials, 0.8, 0.2)`: adopt above an 0.8 satisfaction rate, drop below 0.2, both requiring `min_trials`. Rates quoted in the rationale come from `score_skills(&trials)` via the local `rate_of` closure, defaulting to `(0.0, 0)` for a skill the scorer doesn't know. Note `desk.rec.store.skill_trials()` reads trials across **all** runs, unlike the run-scoped queries elsewhere in the file — the trial record is meant to accumulate.\n\n`Observed<'a>` is the input contract: exhausted node ids and the current verdict map, borrowed. Anything a new proposal source needs about the run's behaviour belongs on this struct.\n\n---\n\n## Part 2: `perturb.rs` — recovering from a stall\n\n### The two thresholds\n\n`no_progress_iterations` is the jidoka gate — stop the line rather than spin. `no_progress_iterations_randomness` fires *earlier* and does something else first, because a loop that repeats the identical approach three times and then quits has learned nothing, and the approach is the cheapest thing to vary.\n\n### The fixed menu\n\n```rust\npub enum Perturbation {\n    Reorder,          // dispatch each wave's nodes in a different order\n    Escalate,         // run builders one tier stronger for an iteration\n    Explore,          // force an untried candidate onto a builder, even if explore is off\n    Reframe(String),  // tell builders to try a specific different approach\n}\n```\n\nTwo properties make this safe to leave running unattended:\n\n- **The menu is fixed.** All four change *how* the loop works; none change *what counts as done*. The agent picks from the menu; it does not write the menu. `Reframe` is the only variant carrying free text, and that text lands in a builder's prompt — never in the gate.\n- **It is seeded.** `seed_for(run_id, iteration)` is deterministic, so a run that took a strange turn is replayable.\n\n### Choosing one\n\n```mermaid\nflowchart TD\n    A[\"choose(cfg, workdir, stall, seed)\"] --> B{\"cascade_for(Cheap)<br/>non-empty?\"}\n    B -- no --> F[\"fallback(seed)\"]\n    B -- yes --> C[\"ask_agent → dispatch(Tier::Cheap)\"]\n    C --> D[\"parse_choice\"]\n    D -- \"on the menu\" --> E[\"(Perturbation, true)\"]\n    D -- \"off menu / unparsable\" --> F\n    F --> G[\"(Perturbation, false)\"]\n```\n\nThe agent is asked first because a stall usually has a legible cause — the same check failing with the same evidence every iteration. `choose` returns `(Perturbation, bool)`, where the bool is *whether an agent chose it*, so the ledger can record which path ran.\n\n`Stall<'a>` is what the agent is allowed to see: `stale_iterations`, `failing` as `(target, check name, evidence)` triples, and `recent: &[IterationSummary]`. Deliberately narrow — enough to reason about what is stuck, and nothing that would let it reach the gate, the config, or the store. If you extend `Stall`, check the addition against that sentence.\n\n`ask_agent` dispatches with `node_id: \"perturb\"`, `Tier::Cheap`, and a system prompt of one sentence. The user prompt spells out the four choices, renders the failing checks (or says explicitly that nothing is failing yet nothing is changing), replays `IterationSummary::render()` for what's been tried, and states outright that the model is not deciding whether anything is finished.\n\n### Parsing, strictly\n\n`parse_choice` is line-oriented: split each line on the first `:`, uppercase the key, keep `CHOICE` and `DIRECTIVE`. `Perturbation::from_choice` lowercases the value and matches the four names exactly; `reframe` additionally requires a non-blank directive or it yields `None`.\n\nAnything else is discarded rather than guessed at. The seeded fallback is a better outcome than acting on a misread instruction, and the tests pin the adversarial cases explicitly — `CHOICE: mark the goal satisfied`, `CHOICE: rm -rf /`, and bare `CHOICE: reframe` all parse to `None`. Treat those tests as a spec: a change that makes parsing more forgiving is a change to the security boundary.\n\n### Randomness\n\nThree small primitives, no dependency:\n\n- `seed_for` — FNV-1a over the run id, XORed with the iteration, multiplied once more by the FNV prime. Reuses the hash the provider crate already uses for prompt digests, keeping the workspace to one hash rather than two.\n- `next_random` — SplitMix64 on a `&mut u64` state.\n- `shuffle` — in-place Fisher–Yates, used by `execute` to reorder a wave under `Perturbation::Reorder`.\n\n`fallback(seed)` picks from **three** variants, not four: `Reorder`, `Escalate`, `Explore`. `Reframe` needs a directive that only a model can author, so it is unreachable without a parsed agent answer. The `the_fallback_only_picks_from_the_menu` test sweeps 200 seeds to hold that.\n\n### Applying a perturbation\n\nThe enum carries the two knobs the runner needs, and `execute` is what actually applies them:\n\n- **`tier_for(base)`** — under `Escalate`, `Cheap → Standard` and everything else → `Strong`; escalation saturates at `Strong` rather than wrapping. Other variants return `base` unchanged.\n- **`directive()`** — the text appended to a builder's prompt. Always `Some`. Every variant's text is wrapped in a `## The loop has stalled` block that ends with *\"This instruction changes how you work. It does not change what counts as done — the gate is unchanged.\"* The `every_directive_says_the_gate_is_unchanged` test asserts that substring for all four variants, because a prompt telling a builder to work differently must not read as permission to lower the bar.\n\n`Reorder` and `Explore` share a directive (\"try a materially different approach rather than a refinement of the last one\"); `Escalate` gets a sharper one aimed at the failing check's cause; `Reframe` passes the agent's sentence through.\n\n`describe()` produces the one-line ledger form.\n\n---\n\n## How this connects to the rest of the loop\n\n`execute` in `src/run/mod.rs` is the only caller of both modules — there is no other consumer, and neither module calls back into the runner. Per iteration, roughly:\n\n1. `next_candidate` may attach an exploration candidate to a builder.\n2. If stalled: `seed_for` → `choose` → apply via `tier_for` / `directive` / `shuffle`.\n3. Dispatch the wave, collecting `RanNode` values.\n4. `harvest_judgments` for the judge verdicts.\n5. Gate runs; `record_trials` pairs skills with the outcome.\n6. `write_proposals` with an `Observed` describing exhausted nodes and current verdicts.\n\nOutward dependencies: `loopsmith_memory` for `Store`, `Episode`, `SkillTrial`, `Proposal`, `score_skills`, `now_ms`; `loopsmith_skills::recommend` for adopt/drop thresholds; `loopsmith_gate` for `Judgment` and `TargetVerdict`; `loopsmith_provider::dispatch` for the one cheap call in `ask_agent`; `crate::judgment::parse` for judge output; `crate::logging::Recorder` for the ledger.\n\n## If you're contributing here\n\n- **Adding a `ProposalKind`** — decide its expiry in `with_default_expiry` (the derivation is intentional), write a `propose_*` function returning `usize`, and add it to the sum in `write_proposals`. Keep the dedupe subject stable across iterations or the same advice reappears every iteration.\n- **Adding a `Perturbation` variant** — you must handle it in `tier_for`, `directive`, `from_choice`, `describe`, the `ask_agent` prompt's menu, and decide whether `fallback` can reach it. Ask whether it changes method or criteria; if there is any argument for the latter, it belongs in `evolve.rs` as a proposal instead.\n- **Never make either module write config.** Adopting a skill, reshaping a graph, and turning exploration on are all human edits. That is the whole reason these are two modules and not one self-tuning controller.","example-loops":"# Example Loops\n\n# Example Loops — `config/examples/`\n\nThirteen worked loop configurations, each shipped twice: as `<name>.yaml` and as an equivalent `<name>.md`. They are the corpus the runtime is tested against, the starting point `loopsmith new --config-file` copies from, and the repository's argument-by-demonstration for what a checkable gate looks like.\n\nNothing here is library code. There are no functions, no call graph, and no imports — the module is data. Its contract is enforced from outside, by the schema (`config/loop.schema.json`), the validator (`loopsmith-core/src/validate.rs`), the round-trip test (`loopsmith-core/tests/md_roundtrip.rs`), and the stress harness (`loopsmith-cli/tests/stress.rs`). Editing an example is editing a test fixture.\n\n---\n\n## The two-file rule\n\nEvery example exists as YAML and as Markdown because loopsmith accepts both grammars for the same model. The `.md` files are **generated**, not hand-written:\n\n```sh\nloopsmith convert config/examples/research-loop.yaml -o config/examples/research-loop.md\nloopsmith convert config/examples/research-loop.md            # goes back to YAML\n```\n\n`cmd/convert.rs` infers direction from the input extension (`loopsmith_core::is_markdown`) and is load-then-emit: `loopsmith_core::load` → `render_md` or `serde_yaml::to_string`.\n\nTwo tests hold the pair together:\n\n- `every_example_config_survives_a_markdown_round_trip` — for each `.yaml`, render to Markdown, `parse_md` it back, and require the two `LoopConfig` values to match field for field.\n- `every_shipped_md_example_means_the_same_as_its_yaml_twin` — the checked-in `.md` must still mean what its `.yaml` twin means.\n\nComparison is on the serialized form with trailing whitespace trimmed in every string (`normalized()`), because a YAML folded scalar (`>`) ends in a newline that a Markdown bullet cannot carry. That is the only permitted difference. **If you edit a `.yaml`, regenerate the `.md`.** Hand-editing one side is exactly what the second test exists to catch.\n\nNote that the top-of-file prose comments in the YAML (the reasoning behind each config) do not survive the round trip — they are YAML comments, not model fields. The `.md` twin carries the structure, not the commentary.\n\n## Anatomy shared by all thirteen\n\nEvery example fills the same A–J sections in the same order. What varies is only the content:\n\n| Section | Key | Role in the corpus |\n|---|---|---|\n| A | `information` | Named constants a node may read: file paths, thresholds stated in prose, the placeholder the user must replace |\n| B | `pre_execution` | The \"do it by hand first\" work list — **always shipped with `done: false`** |\n| C | `goals` | Named, `depends_on`-ordered outcomes; nodes and validations both target these |\n| D | `validations` | The gate. `objective` (script / file_exists / threshold / regex_match) and `subjective` (judge) |\n| E | `success` | Usually one `percentage` entry at `threshold: 1.0` over `target: overall` |\n| F | `stop_gates` | Iterations, wall clock, tokens, `max_cost_usd`, no-progress detection |\n| G | `schedules` | `cron`, `manual`, or `file_change` |\n| H | `constraints` | `rules`, `forbidden_paths`, `forbidden_commands`, `max_seconds`, `human_checkpoint` |\n| I | `execution_guidelines` | Named stages plus a `dependency` chain like `research -> draft -> revise` |\n| J | `default_skills` | Sub-agents the loop may use; seven examples name `agent-reach` |\n\nBelow A–J come `graph`, `providers`, `skills`, and `context`.\n\n### `pre_execution` is unfinished on purpose\n\n`check_pre_execution` in `validate.rs` emits a hard error for any step not marked done:\n\n> `N step(s) not marked done: … . Automating before understanding produces fast, confident garbage`\n\nSo **no shipped example will pass `loopsmith validate` as it stands**, and none will run. This is the single most load-bearing property of the corpus and must be preserved when adding an example. The stress harness works around it by rewriting a copy in a scratch directory (`harness/mod.rs`), never `config/examples/` itself.\n\n### Detector scripts do not exist\n\nExamples reference `scripts/check-citations.sh`, `scripts/check-suppression.sh`, `scripts/check-venues.sh`, and about a dozen others. None of them are in the repo. The named script is the specification of a check the user must write for their own project; the harness generates stubs that exit with `$STUB_EXIT` when it needs to run one.\n\n### `regex_match` artifacts must be registered\n\n`blogger-loop` uses `{ type: regex_match, artifact: research, pattern: \"https?://\" }`. The name `research` resolves because the same config has a `file_exists` detector on `out/research.md` — evidence is registered under both the full path and the stem. A regex naming anything else has nothing to match and fails closed forever, which reads as rigour while being permanently unsatisfiable. `validate.rs` checks this; keep new regex detectors pointed at a path some `file_exists` detector already names.\n\n## The catalogue\n\n**Build things**\n\n| Loop | Gate that carries the weight |\n|---|---|\n| `refactor-loop` | `cargo test --workspace` plus `scripts/assert-tests-untouched.sh` — the loop is forbidden from editing tests to make them pass |\n| `landing-page-loop` | Lighthouse ≥ 90 performance / ≥ 95 accessibility, page weight < 500KB, every CTA resolving |\n| `viral-game-loop` | Headless Godot export, time-to-first-play, a cold playtest — \"viral\" decomposed into four checkable things |\n\n**Find things out**\n\n| Loop | Gate that carries the weight |\n|---|---|\n| `research-loop` | `independent_sources ≥ 4`, per-claim citation check, link resolution, an adversary node that must steelman the opposing case |\n| `trend-radar-loop` | Every trend cites post IDs and a rise ratio against a stated numeric `rise_definition` |\n| `idea-radar-loop` | `min_complaints_per_pain ≥ 8` across ≥ 2 venues, plus a competitor check that reports \"already taken\" honestly |\n| `account-watch-loop` | Predictions are timestamped and scored by a *later* run; `scripts/check-timestamps.sh` blocks backdating |\n\n**Reach people**\n\n| Loop | Gate that carries the weight |\n|---|---|\n| `traffic-loop` | `referred_sessions ≥ 50` — measured traffic, not posts made — and no post to a venue that forbids promotion |\n| `blogger-loop` | Three mechanical style metrics (`sentence_length_variance`, `stock_transitions_per_500w`, `hedging_density`) *and* an independent cold read |\n| `sales-leads-loop` | `lawful-basis-recorded`; a lead without a recorded source and basis cannot satisfy the gate |\n| `cold-outreach-loop` | `suppression-honoured`, `opt-out-present`, `nothing-sent-unreviewed`; the most constrained config here |\n| `marketing-automation-loop` | Every claim traced to the business site, disclosure present, cadence respected |\n\n**Spend money**\n\n| Loop | Gate that carries the weight |\n|---|---|\n| `x402-agent-loop` | Merchant allowlist, `total_spend_usd ≤ cap`, balance reconciliation every iteration; posture chosen by one line in `human_checkpoint` |\n\n## Patterns the corpus repeats\n\nThese are the reason the examples exist. Each one shows up in most configs, and a new example is expected to follow them.\n\n**Decompose the unmeasurable claim into measurable parts, then judge the remainder separately.** `blogger-loop` is the clearest case: \"sounds human\" becomes three numeric thresholds plus one `judge` detector scored against a hand-written reference post, and both are blocking. `landing-page-loop` does the same to \"looks good\"; `viral-game-loop` to \"shareable\".\n\n**Put the judge on a different model family than the builder.** Every example sets `enforce_judge_independence: true` and pins its judge nodes to `provider: openai` while builders run on the `standard` tier (`claude`). A model grading its own output is not a gate.\n\n**Give the adversary its own node.** `research-loop`'s `critic`, `account-watch-loop`'s `challenge`, `cold-outreach-loop`'s `specificity-check`, `x402-agent-loop`'s `challenge-plan` — all `role: adversary`, all instructed to argue *against* the work, not to improve it.\n\n**Isolate the writer.** Builder nodes that produce the deliverable carry `isolated: true`, so a wave of parallel builders gets a worktree each rather than racing on the same files.\n\n**Order stages so self-grading is hard.** `account-watch-loop` runs `score-past -> watch -> detect`: yesterday's predictions are scored *before* today's are made, because it is harder to grade yourself generously when you have not yet decided what to predict.\n\n**Put irreversible actions behind `human_checkpoint`.** Publishing, sending, calling, deploying, paying, adopting a proposed config change. `x402-agent-loop` documents the supervised→autonomous switch as removing exactly one line, and says what you must have watched before doing it.\n\n**Refuse to fake a missing capability.** \"If a platform's credentials are missing, skip that platform and say so.\" A missing key is a skipped platform, never an estimate.\n\n### The recurring graph shape\n\nMost examples are the same four-part topology with different labels — cheap collection, a standard-tier isolated build, and two strong-tier reviewers on a different provider fanning out from the build:\n\n```mermaid\ngraph LR\n    A[researcher · cheap<br/>collect / survey] --> B[builder · standard<br/>isolated: true]\n    B --> C[judge · strong<br/>provider: openai]\n    B --> D[adversary · strong<br/>provider: openai]\n    C --> E[builder · standard<br/>revise]\n    D --> E\n```\n\n`refactor-loop` widens the middle instead of the ends — `refactor-a` and `refactor-b` both depend on `survey`, so auto-concurrency picks 2 despite `cap: 16`, because a third worker has nothing to do. `trend-radar-loop` widens the front (`pull-x`, `pull-instagram`, `pull-tiktok` in one wave, `cap: 8`).\n\n### The provider block is near-identical everywhere\n\n`ollama` (cheap, `qwen2.5-coder`) → `claude` (standard, `claude_code`) → `openai` (strong, `curl` to the chat completions endpoint, `requires_env: [OPENAI_API_KEY]`), with `cascade: { cheap: [ollama, claude], standard: [claude], strong: [openai, claude] }`. Two deviations, both deliberate: `research-loop` uses `llama3` and lets `standard` fall back to `ollama`; `research-loop` and `refactor-loop` both give `claude` the `strong` tier as well, so they degrade rather than fail without an OpenAI key.\n\n`requires_env` is presence-checked only — loopsmith never reads the value, so a key cannot reach a prompt, a log, or the ledger.\n\n## How the runtime consumes these files\n\n```mermaid\ngraph TD\n    Y[config/examples/*.yaml] -->|render_md| M[config/examples/*.md]\n    M -->|parse_md| RT[md_roundtrip.rs]\n    Y --> RT\n    Y -->|Fixture::example| H[tests/harness]\n    H -->|real binary| S[stress.rs]\n    Y -->|--config-file| N[loopsmith new]\n```\n\n**`loopsmith-cli/tests/harness/mod.rs`** turns an example into something runnable without touching the source tree. `Fixture::example(name, scratch)` copies the config, marks every `pre_execution` step done, swaps the providers for deterministic commands that emit a fixed judge block, generates a `scripts/` directory of stubs driven by `Stubs::{Pass, Fail, PassFrom(n)}`, and optionally initialises a git repo so worktree isolation is real rather than silently degraded. `satisfy_files()` writes artifacts containing a URL and a `post_id:` line, because that is what the shipped `regex_match` detectors look for; `satisfy_metrics()` supplies the numbers the `threshold` detectors read.\n\n**`loopsmith-cli/tests/stress.rs`** then runs the whole set through the real binary, twice:\n\n- `every_example_completes_an_iteration_and_leaves_a_consistent_record` — one supervised iteration with detectors satisfiable. Asserts on artifacts, not stdout: the ledger opens with `RunStarted` and closes with `RunFinished` or `StopGateTriggered`, the run log has exactly as many lines as the ledger has entries, and one iteration leaves exactly one summary.\n- `every_example_survives_a_run_where_nothing_passes` — no stubs, no artifacts, no metrics. The process must exit non-zero, write the stop to the ledger, and produce no export directory. A detector that fails closed is correct; a runtime that panics on it is not.\n\nBecause `all_examples()` reads the directory, **adding a `.yaml` here adds it to both tests automatically**. A config that cannot survive a starved run is a config that will break CI.\n\n## Adding an example\n\n1. Write the `.yaml`. Lead with a comment block naming the failure mode the config is built against — that is the house style, and it is what makes an example teach rather than just run.\n2. Leave every `pre_execution` step `done: false`.\n3. Make the gate mostly objective. If the interesting property is subjective, decompose it into measurable parts first and put the judge on a different provider than the builder.\n4. Point any `regex_match` at a path some `file_exists` detector already names.\n5. Put anything irreversible or outward-facing in `human_checkpoint`.\n6. Generate the twin: `loopsmith convert config/examples/<name>.yaml -o config/examples/<name>.md`.\n7. Run `cargo test -p loopsmith-core --test md_roundtrip` and `cargo test -p loopsmith-cli --test stress`.\n8. Add the row to the table in `README-DETAIL.md#the-examples` and the grouped link line in `README.md`, both of which currently say \"Thirteen\".","execution-graph-concurrency-planning":"# Execution Graph & Concurrency Planning\n\n# Execution Graph & Concurrency Planning (`loopsmith-graph`)\n\n`runtime/crates/loopsmith-graph/src/lib.rs`\n\nTurns a flat list of nodes that declare `depends_on` into an execution schedule: which nodes may run together, how long the graph can possibly take, and how many workers are worth paying for. Everything in this crate is pure, deterministic, and allocation-light enough to re-run before every iteration of a loop — there is no I/O, no async, and no state carried between calls.\n\nThe crate depends only on `loopsmith-core` (for `GraphSpec`, `NodeSpec`, `Phase`, `Concurrency`, `Role`), `serde`, and `thiserror`.\n\n## The three jobs\n\n1. **Cycle and reference validation** — a cyclic or dangling `depends_on` is a config bug. It is caught before anything is dispatched, as a typed `GraphError`, not as a deadlock at runtime.\n2. **Wave scheduling** — Kahn's algorithm grouped by level. Every node in a wave has all its dependencies satisfied by earlier waves, so the whole wave is safe to run concurrently.\n3. **Sizing** — the critical path is the floor on wall-clock time that no amount of parallelism can lower; Amdahl's law is the ceiling on what additional workers can buy. Both are computed from the graph itself, before dispatch.\n\n## The planning pipeline\n\n`plan(&GraphSpec) -> Result<Plan, GraphError>` is the single entry point most callers want. It composes the four public primitives:\n\n```mermaid\nflowchart LR\n    S[GraphSpec] --> W[waves]\n    S --> C[critical_path]\n    S --> T[total_cost<br/>sum of weights]\n    C --> PF[parallel_fraction]\n    T --> PF\n    PF --> CC[choose_concurrency]\n    W --> CC\n    CC --> P[Plan]\n```\n\nNote that `critical_path` calls `waves` internally to get a topological order, so a full `plan()` runs Kahn's algorithm twice. That is deliberate — the primitives stay independently callable, and the graphs are small.\n\n### `Plan`\n\n```rust\npub struct Plan {\n    pub waves: Vec<Wave>,\n    pub critical_path: Vec<String>,\n    pub critical_path_cost: f64,\n    pub total_cost: f64,        // fully serial cost\n    pub parallel_fraction: f64, // p, derived not guessed\n    pub concurrency: usize,     // chosen worker count\n    pub predicted_speedup: f64, // amdahl(p, concurrency)\n    pub speedup_ceiling: f64,   // 1 / (1 - p)\n}\n```\n\nA `Wave` is just `{ index: usize, nodes: Vec<String> }` — node ids, sorted.\n\n## `DagNode`: the scheduler is not welded to `NodeSpec`\n\n```rust\npub trait DagNode {\n    fn id(&self) -> &str;\n    fn deps(&self) -> &[String];\n    fn weight(&self) -> f64;\n}\n```\n\nThree things is all scheduling needs from a node: what it's called, what it waits for, what it costs. `waves` and `critical_path` are generic over `N: DagNode`, which is what keeps the config's section G execution graph and section I execution guidelines on one implementation of Kahn's algorithm instead of two.\n\nTwo impls ship in this crate:\n\n| Type | `id` | `weight` |\n|---|---|---|\n| `NodeSpec` (section G) | `self.id` | `self.weight` |\n| `Phase` (section I) | `self.name` | always `1.0` |\n\nPhases carry no cost of their own — the work lives in the nodes assigned to them — so the critical path through the phase graph degenerates to its longest chain. The test `any_dag_node_type_schedules_through_the_same_code` schedules a local `Step` struct that shares no fields with `NodeSpec` at all, which is the regression guard on that decoupling.\n\nIf you add a third graph-shaped concept, implement `DagNode` for it rather than writing another topological sort. Nodes with no meaningful cost should return `1.0` from `weight()`, not `0.0` — a zero weight makes the node invisible to critical-path selection.\n\n## Wave scheduling\n\n```rust\npub fn waves<N: DagNode>(nodes: &[N]) -> Result<Vec<Wave>, GraphError>\n```\n\nStandard Kahn, with the ready set drained a whole level at a time so each level becomes a `Wave`. Two properties worth knowing when you touch it:\n\n- **Output is deterministic.** Indegrees live in a `BTreeMap` and the next ready set is a `BTreeSet`, so iteration order never depends on hashing; node names within a wave are additionally sorted explicitly. Two runs over the same spec produce byte-identical plans.\n- **Both error paths are checked here, not later.** An unresolvable `depends_on` fails fast with `GraphError::UnknownNode` while indegrees are being built. A cycle is detected structurally at the end: if `placed != nodes.len()`, the nodes still carrying a nonzero indegree are exactly the ones trapped in or downstream of the cycle, and their ids are joined into `GraphError::Cycle`.\n\n## Critical path\n\n```rust\npub fn critical_path<N: DagNode>(nodes: &[N]) -> Result<(Vec<String>, f64), GraphError>\n```\n\nLongest weighted path. Because the wave order is a valid topological order, a single forward pass over the flattened waves suffices: each node's best cost is `max(dep costs) + own weight`, with a `prev` map recording which dependency won so the path can be walked back and reversed.\n\nGiven `a(1) → b(5) → d(1)` and `a(1) → c(1) → d(1)`, the result is `([\"a\", \"b\", \"d\"], 7.0)`. An empty node list yields `(vec![], 0.0)`.\n\nTies are broken by iteration order: the terminal node is chosen with `max_by` over a `BTreeMap`, which returns the *last* maximal element, so an exact tie resolves to the alphabetically later id. Deterministic, but do not build logic on top of which of two equal-cost paths gets reported.\n\n## Choosing a worker count\n\nThree functions, in the order the pipeline uses them.\n\n**`parallel_fraction(total_cost, critical_cost) -> f64`** — the share of total work not stuck on the critical path, clamped to `[0, 1]`. This is the mechanical version of the \"and then\" test: work that genuinely reads an upstream output stays serial, everything else is parallelizable. A pure chain gives `p = 0.0`; sixteen independent unit-weight nodes give `p = 15/16 = 0.9375`. `total_cost <= 0.0` returns `0.0` rather than dividing by zero.\n\n**`amdahl(p, n) -> f64`** — `1 / ((1 - p) + p/n)`. `p` is clamped; `n == 0` returns `0.0`; `n == 1` returns exactly `1.0` for any `p`. The point of having it is that it refuses to flatter a fleet:\n\n| p | n | speedup |\n|---|---|---|\n| 0.95 | 16 | 9.14 |\n| 0.70 | 16 | 2.91 |\n| 0.95 | 256 | 18.62 |\n\n**`speedup_ceiling(p) -> f64`** — `1 / (1 - p)`, the limit as workers approach infinity, and `f64::INFINITY` at `p >= 1.0`. In practice `plan()` cannot reach `p == 1.0` with positive weights, since the critical path always contains at least one node, but downstream formatting should still be prepared for a non-finite value if it calls `speedup_ceiling` directly.\n\n**`choose_concurrency(&Concurrency, &[Wave], p) -> (usize, f64)`** returns the worker count and its predicted speedup. Every mode is bounded above by `widest` — the size of the largest wave — because no scheduling policy can use more workers than the graph ever makes runnable at once:\n\n- `Sequential` → `(1, 1.0)`.\n- `Fixed { max_parallel }` → `max_parallel.max(1).min(widest)`. A spec asking for 32 workers over a two-node graph gets 2.\n- `Auto { cap, min_marginal_gain }` → grows the fleet from 1 while each additional worker still buys at least `min_marginal_gain` of extra speedup, and stops at the first worker that doesn't, capped at `min(widest, cap)`.\n\nWorked example, from `auto_concurrency_stops_when_marginal_gain_dries_up`: 16 independent nodes, so `p = 0.9375`, `widest = 16`, `cap = 16`, `min_marginal_gain = 0.5`. Marginal gains run 0.88, 0.78, 0.70, 0.63, 0.57, 0.52 — and the eighth worker would add only 0.47, below the threshold. The loop breaks and `Auto` settles on **7 workers at ×5.09**, not 16. Sizing a fleet at the cap here would pay more than double for a fifth of the remaining headroom.\n\n## Reported hazard: unisolated parallel writers\n\n```rust\npub fn unisolated_parallel_writers(spec: &GraphSpec, waves: &[Wave]) -> Vec<String>\n```\n\nScans each wave for `NodeSpec`s with `role == Role::Builder` and `isolated == false`. If more than one lands in the same wave, they will write to the same working tree concurrently and clobber each other, so all of them are returned. Fewer than two writers in a wave reports nothing.\n\nThis is deliberately a *report*, not a fix. The remedy — mark nodes `isolated`, add a dependency edge, or drop to `Sequential` — is a config decision the crate has no business making. The returned `Vec` is flat across waves, so an id can appear more than once if the node participates in multiple offending waves (`src/cmd/plan.rs` is the consumer that surfaces this to the user).\n\n## How the rest of loopsmith uses this\n\n```mermaid\nflowchart LR\n    CP[\"cmd/plan.rs::execute\"] --> PL[plan]\n    RM[\"run/mod.rs::execute\"] --> PL\n    MCP[\"loopsmith-mcp::tool_plan\"] --> PL\n    PH[\"run/phases.rs::new\"] --> WV[waves]\n    CP --> UW[unisolated_parallel_writers]\n```\n\n- **`src/run/mod.rs::execute`** — the real scheduler. Calls `plan()` to get waves and the worker count before dispatching an iteration.\n- **`src/cmd/plan.rs::execute`** — the `loopsmith plan` CLI command. Calls `plan()` and additionally `unisolated_parallel_writers` to warn about write conflicts without running anything.\n- **`loopsmith-mcp::tool_plan`** — exposes the same planning pass over the local stdio MCP server.\n- **`src/run/phases.rs::new`** — calls `waves()` directly over `Phase` values (not `plan()`), because phase gating only needs the level structure; there is no fleet to size for phases.\n\nBecause all four go through the same two functions, a change to wave ordering or cycle detection changes the CLI, the runtime, the MCP surface, and phase gating simultaneously. Run impact analysis before editing `waves`, `critical_path`, or `plan`.\n\n## Contributing notes\n\n- **Keep it deterministic.** No `HashMap`/`HashSet` in the scheduling path — `BTreeMap`/`BTreeSet` are load-bearing for reproducible plans, not a style choice.\n- **Keep it total.** Every numeric helper already handles its degenerate input (`n == 0`, `total_cost <= 0.0`, empty node list, `p` outside `[0, 1]`). New arithmetic should do the same rather than pushing validation onto callers.\n- **The unit tests are the spec.** `amdahl_matches_the_published_table` pins the speedup numbers quoted in the docs; `fixed_concurrency_is_capped_by_the_widest_wave` pins the widest-wave bound; the three `..._foreign_node_type...` tests pin the `DagNode` decoupling. If a change requires editing one of those, it is an intentional behavior change and should be treated as such.\n- **Only `src/` ships.** `Cargo.toml` sets `include = [\"/src/**/*\", \"/README.md\"]` because the integration tests read `config/examples/` and `config/loop.schema.json` from the repository root, which no crate tarball can contain. Don't add test fixtures that assume the packaged crate can see repo-root files.","gating-success-criteria":"# Gating & Success Criteria\n\n# Gating & Success Criteria (`loopsmith-gate`)\n\nThe gate is the only component in the workspace permitted to decide that a goal is done. Everything else in loopsmith — providers, skills, the graph scheduler, the MCP server — can produce work and produce claims about work. Only `loopsmith-gate` turns a claim into a `GoalState { satisfied: true }`.\n\nThe crate is small on purpose. It is plain Rust with no model in the loop: it reads validations out of the config, runs mechanical detectors against collected evidence, and returns a verdict. Read `runtime/crates/loopsmith-gate/src/lib.rs` top to bottom and you have seen the whole module.\n\n## The invariant\n\n> A model must not be the thing that certifies its own completion.\n\nTwo properties fall out of that, and both are load-bearing:\n\n1. **Only `TargetVerdict::to_goal_state` constructs a satisfied `GoalState`.** No prompt, judge node, or provider response path writes that field. If you are adding a code path that persists goal state, it must route through a verdict.\n2. **The gate revokes.** `evaluate` is a pure function of `(config, target, evidence)` with no memory of prior runs. Delete a required artifact and the next evaluation flips `satisfied` back to `false`. The test `the_gate_can_take_done_back` pins this: it writes `report.md`, evaluates to satisfied, removes the file, and asserts the re-evaluation is unsatisfied. A gate that can only promote is a burndown chart with extra steps — do not add caching or \"sticky\" satisfaction.\n\n## Evaluation flow\n\n```mermaid\nflowchart LR\n    A[LoopConfig<br/>validations] --> B[evaluate<br/>target filter]\n    E[Evidence<br/>artifacts / metrics<br/>judgments / workdir] --> B\n    B --> C[run_detector<br/>per validation]\n    C --> D[CheckResult]\n    D --> F[TargetVerdict]\n    F --> G[to_goal_state]\n    F --> H[success_met /<br/>overall_success]\n```\n\n`evaluate_all` fans this out: one verdict per `cfg.goals` entry, plus one for the `OVERALL` pseudo-target (the `OVERALL` constant comes from `loopsmith-core`).\n\n## Core types\n\n### `Evidence`\n\nEverything the gate is allowed to look at — and nothing else. Notably absent: the builder's own assertion that it finished.\n\n| Field | Used by |\n|---|---|\n| `artifacts: BTreeMap<String, String>` | `Detector::RegexMatch` |\n| `metrics: BTreeMap<String, f64>` | `Detector::Threshold` |\n| `judgments: Vec<Judgment>` | `Detector::Judge` |\n| `workdir: PathBuf` | `Detector::Script` (cwd), `Detector::FileExists` (path root) |\n\nBuilt with `Evidence::new(workdir)` plus the chainable `with_metric` / `with_artifact` / `with_judgment` builders:\n\n```rust\nlet ev = Evidence::new(\"/repo\")\n    .with_metric(\"coverage\", 0.85)\n    .with_artifact(\"test-log\", &stdout);\nlet verdict = evaluate(&cfg, \"g1\", &ev);\n```\n\n### `Judgment`\n\nA model's verdict on a subjective validation, carrying the provenance the gate needs. `validation` names the `Validation` it answers; `provider_id` is who judged; `builder_provider_id` is who produced the work. `score` is optional and only consulted when the detector declares `min_score`. Constructed on the CLI side by `parse` in `loopsmith-cli/src/judgment.rs`.\n\n### `CheckResult` and `TargetVerdict`\n\n`CheckResult` field names (`text` / `passed` / `evidence`) deliberately mirror the grading schema of the existing eval viewer, so verdicts are readable by tooling that already exists. `evidence` is always a human-readable sentence explaining *why* — `\"coverage = 0.5, required >= 0.8\"`, `\"report.md does not exist\"` — not just a boolean restated.\n\n`TargetVerdict` aggregates: the checks, `passed`/`failed`/`total` counts, `satisfied`, and a `reason` string. Two methods matter:\n\n- `blocking_pass_rate()` — fraction of *blocking* checks that passed. Non-blocking checks are excluded entirely. **An empty blocking set returns `0.0`, not `1.0`** — consistent with the \"silence is not success\" rule below.\n- `to_goal_state(iteration)` — the only satisfied-`GoalState` constructor in the workspace. Stamps `updated_ms` via `now_ms` (re-exported through `loopsmith-memory`).\n\n### `GateError`\n\n- `Detector(String)` — the check could not be run (binary not on PATH, spawn failure).\n- `Regex { name, source }` — a validation's pattern does not compile.\n\n## Satisfaction rules\n\n`evaluate` decides `satisfied` from blocking checks only, in this order:\n\n1. **No blocking validation targets this goal → never satisfied.** Reason: `\"no blocking validation targets \\`{target}\\`; nothing to satisfy\"`. A goal with only advisory checks, or with no checks at all, cannot pass. Silence is not success.\n2. **All blocking checks passed → satisfied.**\n3. **Any blocking check failed → unsatisfied**, with the failing check names listed in `reason`.\n\nNon-blocking failures still increment `failed` and appear in the report, but never hold the gate shut (`non_blocking_failures_do_not_hold_the_gate`).\n\n## Detectors\n\n`run_detector` is a single `match` on `Detector` (defined in `loopsmith-core`). Every arm fails closed — missing input is a failure, never a default pass.\n\n| Detector | Passes when | Fails closed on |\n|---|---|---|\n| `Script { command, args, expect_exit }` | exit code equals `expect_exit` (default `0`) | spawn error → `GateError::Detector`; no exit code → `-1` |\n| `FileExists { path, non_empty }` | `workdir.join(path)` exists, and is non-empty if `non_empty` | missing file; zero-length file when `non_empty` |\n| `RegexMatch { artifact, pattern }` | pattern matches the named artifact | artifact not collected; bad pattern → `GateError::Regex` |\n| `Threshold { metric, op, value }` | `op.apply(actual, value)` holds | metric not reported (`a_missing_metric_fails_rather_t
