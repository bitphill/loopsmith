[workspace]
resolver = "2"
members = [
    "crates/loopsmith-util",
    "crates/loopsmith-core",
    "crates/loopsmith-memory",
    "crates/loopsmith-graph",
    "crates/loopsmith-gate",
    "crates/loopsmith-provider",
    "crates/loopsmith-skills",
    "crates/loopsmith-mcp",
    "crates/loopsmith-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/bitphill/loopsmith"
homepage = "https://github.com/bitphill/loopsmith"
authors = ["bitphill"]
keywords = ["agent", "loop", "llm", "orchestration", "cli"]
categories = ["command-line-utilities", "development-tools"]

# Each of these carries a `version` as well as a `path`. The path is what a
# workspace build uses; the version is what crates.io requires, and a
# path-only dependency is rejected at publish time with "all dependencies must
# have a version specified".
[workspace.dependencies]
loopsmith-util = { path = "crates/loopsmith-util", version = "0.2.0" }
loopsmith-core = { path = "crates/loopsmith-core", version = "0.2.0" }
loopsmith-memory = { path = "crates/loopsmith-memory", version = "0.2.0" }
loopsmith-graph = { path = "crates/loopsmith-graph", version = "0.2.0" }
loopsmith-gate = { path = "crates/loopsmith-gate", version = "0.2.0" }
loopsmith-provider = { path = "crates/loopsmith-provider", version = "0.2.0" }
loopsmith-skills = { path = "crates/loopsmith-skills", version = "0.2.0" }
loopsmith-mcp = { path = "crates/loopsmith-mcp", version = "0.2.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9.34 is published as "+deprecated" and unmaintained upstream.
# serde_yaml_ng is the maintained continuation with the same API, so it is
# renamed back to `serde_yaml` here and no call site changes.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
sled = "0.34"
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# Web UI (`loopsmith web`). Behind the `web` feature on the CLI crate so a
# minimal build can drop the whole async tree with --no-default-features.
# `ws` is axum's own tungstenite-backed WebSocket extractor: same RFC6455 wire
# protocol the browser speaks, and unlike the `websocket` crate it shares the
# one tokio runtime instead of demanding a second blocking listener.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }

# Two profiles, because the two audiences want opposite things.
#
# `release` is what `cargo install loopsmith` and the Homebrew formula build,
# on the user's own machine while they wait. Keeping it at thin LTO costs
# roughly 1.3 MB of binary and saves them about six minutes.
#
# `dist` is what the release workflow builds for the prebuilt binaries that npm
# and PyPI download. That build happens once, in CI, where nobody is waiting —
# so it buys the smaller artifact with time that costs nothing. Measured on
# this workspace: 8.21 MB in 3m50s against 6.88 MB in 9m29s, a 16% reduction.
#
# `panic` is deliberately left at `unwind` in both. The usual argument for
# `abort` is size, but loopsmith is now a long-running server as well as a CLI,
# and tokio catches a panicking request handler to keep the rest alive. Under
# `abort` one bad request would take down a server the user has open in a tab.
[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
