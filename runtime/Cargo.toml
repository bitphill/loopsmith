[workspace]
resolver = "2"
members = [
    "crates/loopsmith-util",
    "crates/loopsmith-core",
    "crates/loopsmith-memory",
    "crates/loopsmith-graph",
    "crates/loopsmith-gate",
    "crates/loopsmith-provider",
    "crates/loopsmith-skills",
    "crates/loopsmith-mcp",
    "crates/loopsmith-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/bitphill/loopsmith"
homepage = "https://github.com/bitphill/loopsmith"
authors = ["bitphill"]
keywords = ["agent", "loop", "llm", "orchestration", "cli"]
categories = ["command-line-utilities", "development-tools"]

# Each of these carries a `version` as well as a `path`. The path is what a
# workspace build uses; the version is what crates.io requires, and a
# path-only dependency is rejected at publish time with "all dependencies must
# have a version specified".
[workspace.dependencies]
loopsmith-util = { path = "crates/loopsmith-util", version = "0.1.2" }
loopsmith-core = { path = "crates/loopsmith-core", version = "0.1.2" }
loopsmith-memory = { path = "crates/loopsmith-memory", version = "0.1.2" }
loopsmith-graph = { path = "crates/loopsmith-graph", version = "0.1.2" }
loopsmith-gate = { path = "crates/loopsmith-gate", version = "0.1.2" }
loopsmith-provider = { path = "crates/loopsmith-provider", version = "0.1.2" }
loopsmith-skills = { path = "crates/loopsmith-skills", version = "0.1.2" }
loopsmith-mcp = { path = "crates/loopsmith-mcp", version = "0.1.2" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9.34 is published as "+deprecated" and unmaintained upstream.
# serde_yaml_ng is the maintained continuation with the same API, so it is
# renamed back to `serde_yaml` here and no call site changes.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
sled = "0.34"
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
