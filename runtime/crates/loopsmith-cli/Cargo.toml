[package]
# The package is `loopsmith`, not `loopsmith-cli`, so `cargo install loopsmith`
# matches the command it installs. The directory keeps its old name; a package
# name and a directory name are unrelated to cargo.
name = "loopsmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "loopsmith: plan, run, resume, and gate self-evolving agent loops behind a deterministic verification gate"
# `templates/` holds the four files `include_str!` compiles in. `config/` and
# `assets/` live above the crate root and cannot travel in the tarball.
# Leading slashes anchor these to the package root. Unanchored `README.md`
# matches `tests/README.md` too, which is a note to whoever adds a test and has
# no business in a published tarball.
# `src/web/dist/` holds the compiled web UI. It sits under `src/` on
# purpose: `config/` and `assets/` cannot travel in the tarball, so a
# frontend served from anywhere else would 404 for every installed user.
include = ["/src/**/*", "/templates/**/*", "/README.md"]

[[bin]]
name = "loopsmith"
path = "src/main.rs"

[features]
default = ["web"]
# `loopsmith web` — the browser UI. On by default because the people it exists
# for are the ones least likely to know a cargo flag. Dropping it removes the
# whole async tree: `cargo install loopsmith --no-default-features`.
web = ["dep:axum", "dep:tokio"]

[dependencies]
loopsmith-util = { workspace = true }
loopsmith-core = { workspace = true }
loopsmith-memory = { workspace = true }
loopsmith-graph = { workspace = true }
loopsmith-gate = { workspace = true }
loopsmith-provider = { workspace = true }
loopsmith-skills = { workspace = true }
loopsmith-mcp = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
loopsmith-util = { workspace = true, features = ["testing"] }
