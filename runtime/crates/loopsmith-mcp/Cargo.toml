[package]
name = "loopsmith-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Only `src/` travels. The integration tests read `config/examples/` and
# `config/loop.schema.json` from the repository root, which no crate tarball can
# contain, so shipping them would hand a published crate tests that cannot pass.
include = ["/src/**/*"]
description = "Local stdio MCP server exposing loopsmith memory, gate, and graph to any MCP client"

[dependencies]
loopsmith-core = { workspace = true }
loopsmith-memory = { workspace = true }
loopsmith-graph = { workspace = true }
loopsmith-gate = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
loopsmith-util = { workspace = true, features = ["testing"] }
