[package]
name = "loopsmith-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Only `src/` travels. The integration tests read `config/examples/` and
# `config/loop.schema.json` from the repository root, which no crate tarball can
# contain, so shipping them would hand a published crate tests that cannot pass.
include = ["/src/**/*"]
description = "Dependency-free primitives shared across loopsmith crates: PATH lookup, wall-clock, and test scaffolding"

[features]
# Test scaffolding is opt-in so it never ships in a release build. Crates enable
# it from `[dev-dependencies]`; resolver 2 keeps that out of the normal build.
testing = []

[dependencies]
