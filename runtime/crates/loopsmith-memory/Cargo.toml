[package]
name = "loopsmith-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Only `src/` travels. The integration tests read `config/examples/` and
# `config/loop.schema.json` from the repository root, which no crate tarball can
# contain, so shipping them would hand a published crate tests that cannot pass.
include = ["/src/**/*", "/README.md"]
description = "Shared embedded memory for loopsmith: episodes, goal state, ledger, checkpoints"

[dependencies]
loopsmith-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sled = { workspace = true }

[dev-dependencies]
loopsmith-util = { workspace = true, features = ["testing"] }
