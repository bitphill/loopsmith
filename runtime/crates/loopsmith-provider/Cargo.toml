[package]
name = "loopsmith-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Only `src/` travels. The integration tests read `config/examples/` and
# `config/loop.schema.json` from the repository root, which no crate tarball can
# contain, so shipping them would hand a published crate tests that cannot pass.
include = ["/src/**/*", "/README.md"]
description = "Provider routing for loopsmith: Claude Code, Ollama, Grok, OpenAI, Gemini, Hermes, MCP, and any BYOK command"

[dependencies]
loopsmith-util = { workspace = true }
loopsmith-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
